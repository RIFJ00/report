<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策リサーチ関連ダッシュボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* カードのホバーアニメーション */
        .hover-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hover-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .status-loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-12 max-w-7xl w-full text-center border border-gray-200">
        <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800 mb-10 leading-tight">
            政策リサーチ関連ダッシュボード
        </h1>

        <!-- グリッドレイアウトの調整: 6枚になったため lg以上で3列に設定 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- 本日のポイント -->
            <div class="hover-card bg-gradient-to-tr from-green-50 to-green-100 p-8 rounded-2xl shadow-lg flex flex-col items-center border border-green-200">
                <div class="mb-6">
                    <svg class="w-16 h-16 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <button onclick="openUrlWithPassword('https://report.rifj.jp/point/', 'point')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-2 rounded-full shadow-md transition-colors mb-4 focus:outline-none focus:ring-4 focus:ring-green-300">
                    本日のポイント
                </button>
                <p id="point-status" class="text-xs text-green-800 font-medium status-loading">読込中...</p>
            </div>

            <!-- 政策レポート -->
            <div class="hover-card bg-gradient-to-tr from-purple-50 to-purple-100 p-8 rounded-2xl shadow-lg flex flex-col items-center border border-purple-200">
                <div class="mb-6">
                    <svg class="w-16 h-16 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17h6m-1-4v4m-2-4h2a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v6a2 2 0 002 2h2m2 0h2a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v6a2 2 0 002 2h2"></path>
                    </svg>
                </div>
                <button onclick="openUrlWithPassword('https://report.rifj.jp/policy/', 'policy')" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-2 rounded-full shadow-md transition-colors mb-4 focus:outline-none focus:ring-4 focus:ring-purple-300">
                    政策レポート
                </button>
                <p id="policy-status" class="text-xs text-purple-800 font-medium status-loading">読込中...</p>
            </div>

            <!-- 開発者のブログ -->
            <div class="hover-card bg-gradient-to-tr from-red-50 to-red-100 p-8 rounded-2xl shadow-lg flex flex-col items-center border border-red-200">
                <div class="mb-6">
                    <svg class="w-16 h-16 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                </div>
                <button onclick="openUrlWithPassword('https://report.rifj.jp/blog/', 'blog')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-2 rounded-full shadow-md transition-colors mb-4 focus:outline-none focus:ring-4 focus:ring-red-300">
                    開発者のブログ
                </button>
                <p id="blog-status" class="text-xs text-red-800 font-medium status-loading">読込中...</p>
            </div>

            <!-- 国会質問主意書 -->
            <div class="hover-card bg-gradient-to-tr from-amber-50 to-amber-100 p-8 rounded-2xl shadow-lg flex flex-col items-center border border-amber-200">
                <div class="mb-6">
                    <svg class="w-16 h-16 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <button onclick="openUrlWithPassword('https://report.rifj.jp/shitsumonshui/', 'shui')" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 px-2 rounded-full shadow-md transition-colors mb-4 focus:outline-none focus:ring-4 focus:ring-amber-300">
                    国会質問主意書
                </button>
                <p id="diet-status" class="text-xs text-amber-800 font-medium status-loading">読込中...</p>
            </div>

            <!-- 文脈解析アプリ -->
            <div class="hover-card bg-gradient-to-tr from-blue-50 to-blue-100 p-8 rounded-2xl shadow-lg flex flex-col items-center border border-blue-200">
                <div class="mb-6">
                    <svg class="w-16 h-16 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
                    </svg>
                </div>
                <button onclick="window.open('https://report.rifj.jp/text/', '_blank')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-2 rounded-full shadow-md transition-colors mb-4 focus:outline-none focus:ring-4 focus:ring-blue-300">
                    文脈解析アプリ
                </button>
                <p class="text-sm text-blue-800 font-medium">データ内容を分析</p>
            </div>

            <!-- レイアウトツール (新規追加) -->
            <div class="hover-card bg-gradient-to-tr from-indigo-50 to-indigo-100 p-8 rounded-2xl shadow-lg flex flex-col items-center border border-indigo-200">
                <div class="mb-6">
                    <svg class="w-16 h-16 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"></path>
                    </svg>
                </div>
                <button onclick="window.open('https://report.rifj.jp/layout/', '_blank')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-2 rounded-full shadow-md transition-colors mb-4 focus:outline-none focus:ring-4 focus:ring-indigo-300">
                    レイアウトツール
                </button>
                <p class="text-sm text-indigo-800 font-medium">レイアウト構成を設計</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getFirestore, collection, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        // Firebase Configurations
        const firebaseConfigBlog = {
            apiKey: "AIzaSyD-2UK3S9QjydIIqcTwyfpZMh-Gy4fXlMA",
            authDomain: "blog-viewer-f83bc.firebaseapp.com",
            projectId: "blog-viewer-f83bc",
            storageBucket: "blog-viewer-f83bc.firebasestorage.app",
            messagingSenderId: "182374996524",
            appId: "1:182374996524:web:c6d9f3cfe32957a0bd4f89"
        };

        const firebaseConfigDiet = {
            apiKey: "AIzaSyD7Tvb6Di--LS4E1AxDPhZo0L5ZKM6EmVs",
            authDomain: "user-9b981.firebaseapp.com",
            projectId: "user-9b981"
        };

        const firebaseConfigImport = {
            apiKey: "AIzaSyCU6YBFAcSUbrCi1-bCKbs1U0BCW5QFF04",
            authDomain: "import-b6097.firebaseapp.com",
            projectId: "import-b6097",
            storageBucket: "import-b6097.firebasestorage.app",
            messagingSenderId: "462510788117",
            appId: "1:462510788117:web:44ff1fd1af583f67bc081c"
        };

        // Initialize Apps
        const appBlog = initializeApp(firebaseConfigBlog, "blogApp");
        const dbBlog = getFirestore(appBlog);

        const appDiet = initializeApp(firebaseConfigDiet, "dietApp");
        const dbDiet = getFirestore(appDiet);

        const appImport = initializeApp(firebaseConfigImport, "importApp");
        const dbImport = getFirestore(appImport);

        // Utility to format date and update UI
        function updateStatusDisplay(elementId, date) {
            const el = document.getElementById(elementId);
            if (!el || !date) return;

            const formatted = date.toLocaleString('ja-JP', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });

            const today = new Date();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);

            const isSameDay = (d1, d2) => 
                d1.getFullYear() === d2.getFullYear() && 
                d1.getMonth() === d2.getMonth() && 
                d1.getDate() === d2.getDate();

            el.textContent = `最終更新: ${formatted}`;
            el.classList.remove('status-loading');

            if (isSameDay(date, today)) {
                el.className = "text-xs font-black text-red-600";
            } else if (isSameDay(date, yesterday)) {
                el.className = "text-xs font-bold text-red-500";
            } else {
                el.className = "text-xs font-medium opacity-75";
            }
        }

        // --- Logic: 本日のポイント ---
        onSnapshot(doc(dbImport, "artifacts/default-policy-research-app/public/data/policy_data/point_last_import_metadata"), (snap) => {
            if (snap.exists()) {
                const ts = snap.data().lastImportTimestamp;
                const date = ts?.toDate ? ts.toDate() : new Date(ts);
                updateStatusDisplay('point-status', date);
            }
        });

        // --- Logic: 政策レポート ---
        onSnapshot(doc(dbImport, "artifacts/default-policy-research-app/public/data/policy_data/policy_last_import_metadata"), (snap) => {
            if (snap.exists()) {
                const ts = snap.data().lastImportTimestamp;
                const date = ts?.toDate ? ts.toDate() : new Date(ts);
                updateStatusDisplay('policy-status', date);
            }
        });

        // --- Logic: 開発者のブログ ---
        onSnapshot(collection(dbBlog, "posts"), (snapshot) => {
            let latest = null;
            snapshot.docs.forEach(d => {
                const ts = d.data().createdAt;
                const date = ts?.toDate ? ts.toDate() : new Date(ts);
                if (!latest || date > latest) latest = date;
            });
            updateStatusDisplay('blog-status', latest);
        });

        // --- Logic: 国会質問主意書 ---
        const initDiet = async () => {
            const auth = getAuth(appDiet);
            await signInAnonymously(auth);
            onSnapshot(doc(dbDiet, "dashboard_data", "config"), (snap) => {
                if (snap.exists()) {
                    const sessions = snap.data().sessions || [];
                    if (sessions.length > 0) {
                        const latestSession = sessions.reduce((max, s) => 
                            new Date(s.updatedAt) > new Date(max.updatedAt) ? s : max, sessions[0]);
                        updateStatusDisplay('diet-status', new Date(latestSession.updatedAt));
                    }
                }
            });
        };
        initDiet();
    </script>

    <script>
        /**
         * 指定されたURLにパスワード情報を付与して新しいタブで開く
         */
        function openUrlWithPassword(baseUrl, password) {
            const targetUrl = `${baseUrl}?pw=${password}#${password}`;
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
