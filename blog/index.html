<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブログ記事一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .list-item.active { background-color: #e0f2fe; border-left-color: #0ea5e9; }
        .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @-webkit-keyframes spinner { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .panel-height { height: calc(100vh - 10rem); }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.5); }
        #toast { transition: opacity 0.3s, transform 0.3s; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4 md:p-6">
        <header class="mb-6 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-700">ブログ記事一覧</h1>
        </header>
        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 panel-height">
            <div class="lg:col-span-1 bg-white p-4 rounded-xl shadow-md flex flex-col h-full">
                <div class="flex-shrink-0">
                    <div class="relative mb-3">
                        <input type="search" id="search" placeholder="検索..." class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-sky-500 focus:border-sky-500">
                        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <button id="clearSearchBtn" class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-gray-600 hidden" title="クリア"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                    </div>
                    <div class="flex items-center space-x-2 mb-2 text-sm">
                        <select id="sortKey" class="bg-gray-50 border border-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-1.5"><option value="date">日付</option><option value="title">タイトル</option><option value="createdAt">登録日</option></select>
                        <select id="sortOrder" class="bg-gray-50 border border-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-1.5"><option value="desc">降順</option><option value="asc">昇順</option></select>
                    </div>
                    <div id="itemCount" class="text-sm text-right text-gray-600 mb-2"></div>
                </div>
                <div id="list" class="space-y-2 overflow-y-auto flex-grow min-h-0 pr-1">
                    <div class="flex items-center justify-center h-full"><div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-32 w-32"></div></div>
                </div>
                <div id="pagination-controls" class="flex-shrink-0 pt-3 border-t flex justify-center items-center space-x-2 text-gray-600"></div>
            </div>
            <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-md flex flex-col h-full">
                <h2 class="text-xl font-bold mb-3 border-b pb-3">記事プレビュー</h2>
                <iframe id="preview" class="w-full flex-grow border rounded-lg min-h-0" srcdoc="<div style='display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;'>記事を選択してください</div>"></iframe>
            </div>
        </main>
    </div>
    
    <!-- Export Modal -->
    <div id="exportModalPublic" class="fixed inset-0 z-50 flex items-center justify-center w-full h-full modal-backdrop hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md m-4">
            <div class="p-6">
                <h3 class="text-lg font-medium text-gray-900">エクスポート形式の選択</h3>
                <p class="mt-2 text-sm text-gray-500">この記事をどの形式でエクスポートしますか？</p>
            </div>
            <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-lg">
                <button id="exportPdfBtnPublic" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:ml-3 sm:w-auto sm:text-sm">
                    <span id="exportPdfBtnTextPublic">PDFで保存</span>
                    <div id="exportPdfSpinnerPublic" class="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 ml-2 hidden"></div>
                </button>
                <button id="exportHtmlBtnPublic" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-sky-600 text-base font-medium text-white hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 sm:ml-3 sm:w-auto sm:text-sm">HTMLで保存</button>
                <button id="cancelExportBtnPublic" type="button" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:w-auto sm:text-sm">キャンセル</button>
            </div>
        </div>
    </div>
    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-[100] bg-gray-800 text-white py-2 px-5 rounded-lg shadow-lg opacity-0 transform translate-y-2">
        <p id="toastMessage"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {"apiKey":"AIzaSyD-2UK3S9QjydIIqcTwyfpZMh-Gy4fXlMA","authDomain":"blog-viewer-f83bc.firebaseapp.com","projectId":"blog-viewer-f83bc","storageBucket":"blog-viewer-f83bc.firebasestorage.app","messagingSenderId":"182374996524","appId":"1:182374996524:web:c6d9f3cfe32957a0bd4f89","measurementId":"G-KNZCSQF6LX"};
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const getEl = id => document.getElementById(id);
        const listContainer = getEl('list'), preview = getEl('preview'), search = getEl('search'), itemCountEl = getEl('itemCount'), paginationControls = getEl('pagination-controls'), sortKeySelect = getEl('sortKey'), sortOrderSelect = getEl('sortOrder'), clearSearchBtn = getEl('clearSearchBtn');
        const exportModal = getEl('exportModalPublic'), exportHtmlBtn = getEl('exportHtmlBtnPublic'), exportPdfBtn = getEl('exportPdfBtnPublic'), cancelExportBtn = getEl('cancelExportBtnPublic'), exportPdfBtnText = getEl('exportPdfBtnTextPublic'), exportPdfSpinner = getEl('exportPdfSpinnerPublic');
        const toast = getEl('toast'), toastMessage = getEl('toastMessage');

        let fileDatabase = [];
        let currentFilteredFiles = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let currentSort = { key: 'date', order: 'desc' };
        
        const showToast = (message, type = 'info') => {
            toastMessage.textContent = message;
            toast.className = 'fixed top-5 right-5 z-[100] text-white py-2 px-5 rounded-lg shadow-lg opacity-0 transform translate-y-2';
            toast.classList.add({success:'bg-green-500',error:'bg-red-500',info:'bg-sky-500'}[type]);
            toast.classList.remove('opacity-0', 'translate-y-2');
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); }, 3000);
        };

        const escapeHtml = str => {
            const p = document.createElement('p');
            p.textContent = str || '';
            return p.innerHTML;
        };

        const injectResponsiveStyles = content => {
            const style = '<style>html,body{max-width:100%!important;overflow-x:hidden!important}img,iframe,video{max-width:100%!important;height:auto!important}<\/style>';
            return content.includes('</head>') ? content.replace('</head>', style + '</head>') : style + content;
        };
        
        const setButtonLoading = (btn, textEl, spinnerEl, isLoading, text) => { 
            btn.disabled = isLoading; 
            if (textEl) textEl.textContent = text; 
            if (spinnerEl) spinnerEl.classList.toggle('hidden', !isLoading); 
        };

        const previewFile = async fileId => {
            if (!fileId) return;
            const fileToDisplay = fileDatabase.find(f => f.id === fileId);
            if (fileToDisplay) {
                if (fileToDisplay.isChunked && !fileToDisplay.content) {
                    preview.srcdoc = `<div style='display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;'>コンテンツを読み込み中...</div>`;
                    const chunksQuery = query(collection(db, "contentChunks"), where("postId", "==", fileId));
                    const chunksSnapshot = await getDocs(chunksQuery);
                    const chunks = chunksSnapshot.docs.map(d => d.data()).sort((a, b) => a.index - b.index);
                    fileToDisplay.content = chunks.map(c => c.data).join('');
                }
                preview.srcdoc = injectResponsiveStyles(fileToDisplay.content || '');
                document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
                const activeItem = document.querySelector(`.list-item[data-id="${fileId}"]`);
                if (activeItem) activeItem.classList.add('active');
            }
        };

        const openExportModal = (fileId) => {
            exportPdfBtn.dataset.id = fileId;
            exportHtmlBtn.dataset.id = fileId;
            exportModal.classList.remove('hidden');
        };
        const closeExportModal = () => exportModal.classList.add('hidden');
        
        const exportAsHtml = async (fileId) => {
            const fileToExport = fileDatabase.find(f => f.id === fileId);
            if (!fileToExport) return;
            let fullContent = fileToExport.content;
            if (fileToExport.isChunked && !fullContent) {
                await previewFile(fileId);
                fullContent = fileDatabase.find(f => f.id === fileId).content;
            }
            const blob = new Blob([fullContent], { type: 'text/html;charset=utf-8' });
            saveAs(blob, `${fileToExport.title}.html`);
            showToast("HTMLファイルをエクスポートしました", "success");
            closeExportModal();
        };

        const exportAsPdf = async (fileId) => {
            setButtonLoading(exportPdfBtn, exportPdfBtnText, exportPdfSpinner, true, "準備中...");
            const { jsPDF } = window.jspdf;

            const fileToExport = fileDatabase.find(f => f.id === fileId);
            if (!fileToExport) {
                showToast("エクスポート対象のファイルが見つかりません。", "error");
                setButtonLoading(exportPdfBtn, exportPdfBtnText, exportPdfSpinner, false, "PDFで保存");
                closeExportModal();
                return;
            }

            let fullContent = fileToExport.content;
            if (fileToExport.isChunked && !fullContent) {
                showToast("コンテンツを読み込み中...", "info");
                await previewFile(fileId);
                fullContent = fileDatabase.find(f => f.id === fileId).content;
            }

            const iframe = document.createElement('iframe');
            iframe.style.position = 'absolute';
            iframe.style.left = '-9999px';
            iframe.style.width = '190mm'; 
            iframe.style.border = 'none';
            document.body.appendChild(iframe);

            setButtonLoading(exportPdfBtn, exportPdfBtnText, exportPdfSpinner, true, "生成中...");

            try {
                const iframeLoadPromise = new Promise((resolve, reject) => {
                    iframe.onload = resolve;
                    iframe.onerror = reject;
                });
                
                const iframeDoc = iframe.contentWindow.document;
                iframeDoc.open();
                
                const pdfExportStyles = `<style>html, body { margin: 0 !important; padding: 0 !important; box-sizing: border-box !important; overflow-wrap: break-word !important; width: 190mm !important; } img, iframe, video { max-width: 100% !important; height: auto !important; }</style>`;

                let finalHtml = fullContent;
                if (finalHtml.includes('</head>')) {
                    finalHtml = finalHtml.replace('</head>', `${pdfExportStyles}</head>`);
                } else {
                    finalHtml = `<html><head>${pdfExportStyles}</head><body>${finalHtml}</body></html>`;
                }
                
                iframeDoc.write(finalHtml);
                iframeDoc.close();
                
                await iframeLoadPromise;

                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error('コンテンツの読み込みがタイムアウトしました。')), 15000);
                    
                    const images = Array.from(iframeDoc.body.getElementsByTagName('img'));
                    if (images.length === 0) { clearTimeout(timeout); setTimeout(resolve, 500); return; }

                    let loadedCount = 0;
                    const checkImages = () => { if (loadedCount === images.length) { clearTimeout(timeout); setTimeout(resolve, 500); } };

                    images.forEach(img => {
                        if (img.complete) { loadedCount++; } 
                        else { img.onload = () => { loadedCount++; checkImages(); }; img.onerror = () => { loadedCount++; checkImages(); }; }
                    });
                    checkImages();
                });
                
                const canvas = await html2canvas(iframe.contentWindow.document.body, { scale: 2, useCORS: true, logging: false });

                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
                
                const marginY = 20; const marginX = 10;
                const pdfWidth = pdf.internal.pageSize.getWidth() - marginX * 2;
                const pdfHeight = pdf.internal.pageSize.getHeight() - marginY * 2;

                const ratio = canvas.width / pdfWidth;
                const scaledCanvasHeight = canvas.height / ratio;
                
                let position = 0;
                pdf.addImage(imgData, 'PNG', marginX, marginY, pdfWidth, scaledCanvasHeight);
                let heightLeft = scaledCanvasHeight - pdfHeight;

                while (heightLeft > 0) {
                    position -= pdfHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', marginX, position + marginY, pdfWidth, scaledCanvasHeight);
                    heightLeft -= pdfHeight;
                }
                
                pdf.save(`${fileToExport.title}.pdf`);
                showToast("PDFファイルをエクスポートしました", "success");

            } catch (err) {
                console.error("PDF generation error: ", err);
                showToast(`PDFの生成に失敗しました: ${err.message}`, "error");
            } finally {
                document.body.removeChild(iframe);
                setButtonLoading(exportPdfBtn, exportPdfBtnText, exportPdfSpinner, false, "PDFで保存");
                closeExportModal();
            }
        };

        function renderPagination(totalItems, totalPages) {
            paginationControls.innerHTML = '';
            if (totalPages <= 1) { itemCountEl.textContent = `ヒット: ${totalItems} 件 / 全体: ${fileDatabase.length} 件`; return; }
            const startItem = (currentPage - 1) * itemsPerPage + 1;
            const endItem = Math.min(currentPage * itemsPerPage, totalItems);
            itemCountEl.textContent = `${startItem}-${endItem} / ${totalItems} 件`;
            
            const firstPrevDisabled = currentPage === 1 ? 'disabled' : '';
            const lastNextDisabled = currentPage === totalPages ? 'disabled' : '';

            paginationControls.innerHTML = `
                <button id="firstPageBtn" class="px-3 py-1 bg-gray-200 rounded-md hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed" ${firstPrevDisabled}>&lt;&lt;</button>
                <button id="prevPageBtn" class="px-3 py-1 bg-gray-200 rounded-md hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed" ${firstPrevDisabled}>&lt;</button>
                <span class="text-sm">Page</span>
                <input type="number" id="pageInput" min="1" max="${totalPages}" value="${currentPage}" class="w-12 text-center border rounded-md p-1">
                <span class="text-sm">of ${totalPages}</span>
                <button id="nextPageBtn" class="px-3 py-1 bg-gray-200 rounded-md hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed" ${lastNextDisabled}>&gt;</button>
                <button id="lastPageBtn" class="px-3 py-1 bg-gray-200 rounded-md hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed" ${lastNextDisabled}>&gt;&gt;</button>
            `;
            
            const pageInput = getEl('pageInput');
            const goToPage = (page) => { currentPage = Math.max(1, Math.min(totalPages, page)); renderList(); };
            getEl('firstPageBtn').addEventListener('click', () => goToPage(1));
            getEl('prevPageBtn').addEventListener('click', () => goToPage(currentPage - 1));
            getEl('nextPageBtn').addEventListener('click', () => goToPage(currentPage + 1));
            getEl('lastPageBtn').addEventListener('click', () => goToPage(totalPages));
            pageInput.addEventListener('change', () => goToPage(parseInt(pageInput.value, 10)));
        }

        function renderList() {
            const term = search.value.toLowerCase();
            currentFilteredFiles = fileDatabase.filter(f => (f.title || '').toLowerCase().includes(term) || (f.content || '').toLowerCase().includes(term));

            currentFilteredFiles.sort((a, b) => {
                const key = currentSort.key;
                const order = currentSort.order === 'asc' ? 1 : -1;
                let valA = a[key], valB = b[key];
                if (key === 'createdAt' && valA?.toDate) valA = valA.toDate().toISOString();
                if (key === 'createdAt' && valB?.toDate) valB = valB.toDate().toISOString();
                valA = valA || ''; valB = valB || '';
                if (valA < valB) return -1 * order;
                if (valA > valB) return 1 * order;
                return 0;
            });

            const totalItems = currentFilteredFiles.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;

            const paginatedItems = currentFilteredFiles.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
            listContainer.innerHTML = '';

            if (totalItems > 0) {
                paginatedItems.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'list-item p-3 flex justify-between items-center cursor-pointer hover:bg-gray-100 rounded-lg border-l-4 border-transparent';
                    div.dataset.id = f.id;
                    div.innerHTML = `<div class="pointer-events-none pr-2 overflow-hidden flex-grow"><h3 class="font-semibold truncate" title="${escapeHtml(f.title)}">${escapeHtml(f.title)}</h3><p class="text-sm text-gray-500">${f.date || '日付未設定'}</p></div>
                    <div class="flex-shrink-0">
                         <button class="export-btn-public p-2 rounded-full hover:bg-gray-300" data-id="${f.id}" title="エクスポート">
                            <svg class="w-5 h-5 text-gray-500 hover:text-sky-600 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        </button>
                    </div>`;
                    listContainer.appendChild(div);
                });
            } else {
                listContainer.innerHTML = '<p class="text-gray-500 p-4 text-center">記事がありません。</p>';
            }
            renderPagination(totalItems, totalPages);
        }

        onSnapshot(query(collection(db, "posts")), snapshot => {
            fileDatabase = snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
            renderList();
            if (fileDatabase.length > 0) {
                const firstId = currentFilteredFiles[0]?.id;
                if(firstId) previewFile(firstId);
            }
        });

        listContainer.addEventListener('click', e => {
            const exportBtn = e.target.closest('.export-btn-public');
            if(exportBtn){
                openExportModal(exportBtn.dataset.id);
                return;
            }
            const listItem = e.target.closest('.list-item');
            if (listItem) previewFile(listItem.dataset.id);
        });
        
        cancelExportBtn.addEventListener('click', closeExportModal);
        exportHtmlBtn.addEventListener('click', (e) => exportAsHtml(e.currentTarget.dataset.id));
        exportPdfBtn.addEventListener('click', (e) => exportAsPdf(e.currentTarget.dataset.id));

        search.addEventListener('input', () => { currentPage = 1; renderList(); clearSearchBtn.classList.toggle('hidden', !search.value); });
        clearSearchBtn.addEventListener('click', () => { search.value = ''; clearSearchBtn.classList.add('hidden'); currentPage = 1; renderList(); search.focus(); });
        sortKeySelect.addEventListener('change', e => { currentSort.key = e.target.value; currentPage = 1; renderList(); });
        sortOrderSelect.addEventListener('change', e => { currentSort.order = e.target.value; currentPage = 1; renderList(); });

    </script>
</body>
</html>
