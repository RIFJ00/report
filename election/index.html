    <script type="module" id="firebase-script">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // 指定されたFirebase設定 (データの保存先・読込先)
        const firebaseConfig = {
            apiKey: "AIzaSyCzxK80B7Tl2EoBemiWq2_rKFPHhr1vkVI",
            authDomain: "election-fe317.firebaseapp.com",
            projectId: "election-fe317",
            storageBucket: "election-fe317.firebasestorage.app",
            messagingSenderId: "3312762738",
            appId: "1:3312762738:web:9f7c1430d5f5ceaacee7eb",
            measurementId: "G-B102SLVDK5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        // アプリIDは環境変数があればそれを、なければデフォルトを使用
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-election-app';

        window.fb = {
            initAuth: () => new Promise((resolve) => {
                onAuthStateChanged(auth, (user) => {
                    if (user) resolve(user);
                    else signInAnonymously(auth).catch(console.error);
                });
            }),
            saveData: async (type, data) => {
                let user = auth.currentUser;
                if (!user) {
                    try {
                        // 認証が切れている場合は再ログインを試みる
                        const cred = await signInAnonymously(auth);
                        user = cred.user;
                    } catch (e) {
                        console.error("Auth failed during save:", e);
                        throw new Error("認証に失敗しました。");
                    }
                }
                try {
                    // データ保存パス: 指定されたProject内の election_storage コレクションへ保存
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'election_storage');
                    const docRef = doc(colRef, type);
                    await setDoc(docRef, { 
                        content: JSON.stringify(data), 
                        updatedAt: new Date().toISOString(),
                        updatedBy: user.uid
                    });
                    console.log(`Data saved: ${type}`);
                } catch (e) { 
                    console.error("Save failed", e); 
                    throw e;
                }
            },
            subscribe: (type, callback) => {
                // データ読込リスナー: 常に最新のデータを監視・取得
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'election_storage');
                const docRef = doc(colRef, type);
                return onSnapshot(docRef, (snap) => {
                    if (snap.exists()) {
                        try {
                            const val = snap.data();
                            callback(JSON.parse(val.content), val.updatedAt);
                            console.log(`Data updated: ${type}`);
                        } catch (e) { console.error("Parse error", e); }
                    } else {
                        console.log(`No data found for: ${type}`);
                    }
                }, (error) => console.error("Snapshot error:", error));
            }
        };
        // Signal that Firebase is ready
        window.fbReady = true;
    </script>

gs.newPartyEffect > 0 ? '+' : ''}{settings.newPartyEffect}%</span></div><input type="range" min="-20" max="20" step="1" value={settings.newPartyEffect} onChange={(e) => handleChange('newPartyEffect', e.target.value)} className="w-full accent-blue-600" /><div className="flex justify-between text-[10px] text-gray-400"><span>-20%</span><span>+20%</span></div></div><div className="flex flex-col gap-3"><div className="flex justify-between text-xs font-bold text-gray-600"><span>新興躍進 (国民・参政↑ 立憲・自民↓)</span><span className={settings.emergingSurge !== 0 ? 'text-orange-700' : ''}>+{settings.emergingSurge}%</span></div><input type="range" min="0" max="20" step="1" value={settings.emergingSurge} onChange={(e) => handleChange('emergingSurge', e.target.value)} className="w-full accent-orange-500" /><div className="flex justify-between text-[10px] text-gray-400"><span>0%</span><span>+20%</span></div></div></div>

        const App = () => {

            // ... (helper functions omitted) ...
            const parseNumber = (val) => { 
                if (typeof val === 'number') return val; 
                if (!val) return null; 
                // 全角数字を半角に変換し、カンマを除去
                const clean = String(val).replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/["',]/g, ''); 
                const num = parseFloat(clean); 
                return isNaN(num) ? null : num; 
            };
            const getStr = (val) => val === undefined || val === null ? "" : String(val);
            const calculateAge = (birthDateStr) => { const today = new Date(); const birthDate = new Date(birthDateStr); if (isNaN(birthDate.getTime())) return null; let age = today.getFullYear() - birthDate.getFullYear(); const m = today.getMonth() - birthDate.getMonth(); if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) { age--; } const yyyy = birthDate.getFullYear(); const mm = String(birthDate.getMonth() + 1).padStart(2, '0'); const dd = String(birthDate.getDate()).padStart(2, '0'); return `${yyyy}/${mm}/${dd} (${age}歳)`; };
            const findHeaderRow = (rows, keywords) => { for (let i = 0; i < Math.min(rows.length, 15); i++) { const row = rows[i].map(c => getStr(c)); const matchCount = keywords.filter(kw => row.some(cell => cell.includes(kw))).length; if (matchCount >= 2) return { index: i, row }; } return null; };
            const findColumnIndex = (headerRow, possibleNames, excludeNames = []) => { return headerRow.findIndex(cell => possibleNames.some(name => cell.includes(name)) && (!excludeNames || !excludeNames.some(ex => cell.includes(ex)))); };

                let headerRow, startRowIdx;

                const districtIdx = findColumnIndex(headerRow, ['小選挙区', '選挙区', '選挙区名', 'District']);

                let nameIdx = findColumnIndex(headerRow, ['2026候補者', '2026候補', '26候補', '今回候補者', '候補者名', '氏名', '名前', '候補', 'Name', 'Candidate'], ['2024', '24候補', '前回', '旧']);
                
                // もし見つからなければ、制約を緩めて探す（2024候補者しかないファイルへの対応）
                if (nameIdx === -1) {
                    nameIdx = findColumnIndex(headerRow, ['候補者', '名前', '氏名', '2024候補者', '2024候補']);
                }

                // 2024候補者（前回の候補者）用
                const name2024Idx = findColumnIndex(headerRow, ['2024候補者', '2024候補', '24候補', '前回候補者', '旧候補者', '前職']);

                const votesPredIdx = findColumnIndex(headerRow, ['今回予想', '得票予測', '予想', 'Predicted']);
                // 候補者指数列の検索
                // 修正後: "候補者指数" をピンポイントで指定
                const indexIdx = findColumnIndex(headerRow, ['候補者指数', 'CandidateIndex']);

                const statusIdx = findColumnIndex(headerRow, ['当落', '結果', '2024'], ['得票', '候補', '予想', '基数', 'No', '年齢', '回数']); 
                const status2021Idx = findColumnIndex(headerRow, ['2021当落', '2021結果', '21当落']); 
                const winStatusIdx = findColumnIndex(headerRow, ['当落予想', '判断', '判定']);
                const ageIdx = findColumnIndex(headerRow, ['年齢', 'Age']);
                const dobIdx = findColumnIndex(headerRow, ['生年月日', '誕生日']);
                const incStatusIdx = findColumnIndex(headerRow, ['回数', '現新']);
                const voterCountIdx = findColumnIndex(headerRow, ['有権者数', '直近有権者数']);
                const typeIdx = findColumnIndex(headerRow, ['区分', 'Type']);
                const votes2024Idx = findColumnIndex(headerRow, ['2024得票数', '2024得票', '2024年得票', 'R6得票']);
                const votes2021Idx = findColumnIndex(headerRow, ['2021得票数', '2021得票', '2021年得票', 'R3得票']);
                const votes2017Idx = findColumnIndex(headerRow, ['2017得票数', '2017得票', '2017年得票', 'H29得票']);
                const votes2014Idx = findColumnIndex(headerRow, ['2014得票数', '2014得票', '2014年得票', 'H26得票']);
                const votes2012Idx = findColumnIndex(headerRow, ['2012得票数', '2012得票', '2012年得票', 'H24得票']);
                const votes2009Idx = findColumnIndex(headerRow, ['2009得票数', '2009得票', '2009年得票', 'H21得票']);
                const votes2005Idx = findColumnIndex(headerRow, ['2005得票数', '2005得票', '2005年得票', 'H17得票']);

                if (nameIdx === -1 || (districtIdx === -1 && partyIdx === -1)) {
                    let missing = [];

                    if (districtIdx === -1 && partyIdx === -1) missing.push("選挙区 または 政党");
                    setAlertMessage(`必須列が見つかりません: ${missing.join(", ")} を含む列が必要です。\nヘッダー行が正しいか、文字化けしていないか確認してください。`);
                    return;

                const newCandidates = [];
                const newVoterCounts = new Map(voterCounts); 
                
                for (let i = startRowIdx; i < rows.length; i++) {
                    const row = rows[i];

                    const nameRaw = getStr(row[nameIdx]);
                    
                    // ★修正: 名前が空でも、過去の当選実績(◎, ○, ⚪︎)があればデータとして取り込む
                    const statusCheck = statusIdx !== -1 ? getStr(row[statusIdx]) : '';
                    const status2021Check = status2021Idx !== -1 ? getStr(row[status2021Idx]) : '';
                    const hasWinRecord = statusCheck.match(/[◎○⚪︎]/) || status2021Check.match(/[◎○⚪︎]/);

                    // 候補者指数の取得 (デフォルトは1.0)
                    const cIndex = indexIdx !== -1 ? parseNumber(row[indexIdx]) : 1.0;

                    let type = 'single';
                    let typeFound = false;
                    if (typeIdx !== -1) {
                        const typeVal = getStr(row[typeIdx]);
                        if (typeVal.includes('比例') || typeVal.includes('2')) { type = 'proportional'; typeFound = true; } 
                        else if (typeVal.includes('選挙区') || typeVal.includes('1')) { type = 'single'; typeFound = true; }
                    } 
                    if (!typeFound) { if (districtName.includes('比例') || districtName.includes('ブロック')) type = 'proportional'; }
                    if (voterCountIdx !== -1) {
                        const vCount = parseNumber(row[voterCountIdx]);
                        if (vCount) newVoterCounts.set(districtName.replace(/\s+/g, ''), { voterCount: vCount, komeiProportional: 0 }); // Init with 0
                    }
                    let displayAge = '';
                    const dobRaw = dobIdx !== -1 ? getStr(row[dobIdx]) : '';
                    if (dobRaw) {
                        const calculated = calculateAge(dobRaw);
                        displayAge = calculated ? calculated : (ageIdx !== -1 ? getStr(row[ageIdx]).replace(/"/g, '') : '');
                    } else {
                        displayAge = ageIdx !== -1 ? getStr(row[ageIdx]).replace(/"/g, '') : '';
                        if (displayAge && !isNaN(displayAge) && !displayAge.includes('歳')) displayAge += '歳';
                    }
                    const getVotes = (idx) => idx !== -1 ? parseNumber(row[idx]) : null;
                    const v2024 = getVotes(votes2024Idx);
                    let predictedVotes = votesPredIdx !== -1 ? parseNumber(row[votesPredIdx]) : 0;

                    // 正規化: 日本保守 -> 保守
                    let partyNameRaw = partyIdx !== -1 ? getStr(row[partyIdx]).replace(/"/g, '').trim() : '無所属';
                    if (partyNameRaw.includes('日本保守')) { partyNameRaw = '保守'; }
                    
                    // ★修正: 選挙区の立憲は「中道」に名称変更
                    if (type === 'single' && partyNameRaw.includes('立憲')) { partyNameRaw = '中道'; }

                    if (predictedVotes === null || predictedVotes === 0) {
                        if (type === 'proportional') {
                            if (v2024 !== null && v2024 > 0) {
                                let coef = 1.0;
                                Object.keys(PARTY_COEFFICIENTS).forEach(key => { if (partyNameRaw.includes(key)) coef = PARTY_COEFFICIENTS[key]; });
                                predictedVotes = Math.floor(v2024 * coef);
                            }
                        } else {
                            const history = [v2024, getVotes(votes2021Idx), getVotes(votes2017Idx), getVotes(votes2014Idx), getVotes(votes2012Idx)].filter(v => v !== null && v > 0);
                            if (history.length > 0) predictedVotes = Math.floor(history.reduce((a, b) => a + b, 0) / history.length);
                        }
                    }
                    newCandidates.push({
                        id: `row-${i}`,
                        district: districtName,
                        party: partyNameRaw,
                        name: finalName,
                        name2024: name2024Raw,
                        candidateIndex: cIndex !== null ? cIndex : 1.0, // 追加: 候補者指数 (デフォルト1.0)
                        age: displayAge,
                        incumbentStatus: incStatusIdx !== -1 ? getStr(row[incStatusIdx]).replace(/"/g, '') : '',
                        predictedVotes: predictedVotes || 0,
                        votes2024: v2024,
                        votes2021: getVotes(votes2021Idx),
                        votes2017: getVotes(votes2017Idx),
                        votes2014: getVotes(votes2014Idx),
                        votes2012: getVotes(votes2012Idx),
                        votes2009: getVotes(votes2009Idx),
                        votes2005: getVotes(votes2005Idx),
                        status: statusIdx !== -1 ? getStr(row[statusIdx]).replace(/"/g, '') : '',
                        status2021: status2021Idx !== -1 ? getStr(row[status2021Idx]).replace(/"/g, '') : '',
                        winningStatus: winStatusIdx !== -1 ? getStr(row[winStatusIdx]).replace(/"/g, '') : '',
                        type: type
                    });
                }
                
                const districtMap = new Map();
                newCandidates.forEach(c => { if (c.type === 'single') { if (!districtMap.has(c.district)) districtMap.set(c.district, []); districtMap.get(c.district).push(c); } });
                const candidatesToAdd = [];
                districtMap.forEach((districtCandidates, districtName) => {
                    const komei = districtCandidates.find(c => c.party.includes('公明'));
                    const jimin = districtCandidates.find(c => c.party.includes('自民'));
                    if (komei && komei.predictedVotes > 0) {

                                id: `generated-jimin-${districtName}`,

                                predictedVotes: transferVotes,

                                status: '', status2021: '', winningStatus: '-', type: 'single',
                                candidateIndex: 1.0 // 自動生成分の指数は1.0
                            });
                        }
                    }
                });
                newCandidates.push(...candidatesToAdd);

                if (newCandidates.length > 0) {

                    // --- 3. 手動アップロード時も localStorage へ保存 ---

                            // Ensure voter counts are saved if they were updated during candidate processing

                            setAlertMessage(`データを読み込み、画面に反映しました。\n(クラウドへの保存も完了)\n候補者数: ${newCandidates.length}名`);
                        } catch(e) {
                            console.error(e);
                            setAlertMessage(`画面には反映されましたが、クラウドへの保存に失敗しました。\n通信環境や認証状態を確認してください。\nエラー: ${e.message}`);
                        }
                    } else {
                        setAlertMessage("ローカルプレビューを更新しました(保存機能なし)。");
                    }
                    const singleCount = newCandidates.filter(c => c.type === 'single').length;
                    setActiveTab(singleCount > 0 ? 'single' : 'proportional');
                } else {

                }
            };

            const processVoterData = async (rows) => { /* ... (Existing Code) ... */ 
                if (IS_READ_ONLY) return;
                if (!rows || rows.length === 0) return;
                let headerRow = rows[0].map(h => getStr(h));
                let startRowIdx = 1;
                for(let i=0; i<Math.min(rows.length, 5); i++){ if (rows[i].map(c => getStr(c)).some(c => c.includes('選挙区'))) { headerRow = rows[i].map(c => getStr(c)); startRowIdx = i + 1; break; } }
                
                const districtIdx = headerRow.findIndex(h => h.includes('選挙区') || h.includes('都道府県'));
                const voterCountIdx = headerRow.findIndex(h => h.includes('有権者数') || h.includes('有権者総数'));
                const komeiPropIdx = headerRow.findIndex(h => {
                    const s = getStr(h).replace(/\s+/g, '');
                    return s.includes('公明') && (s.includes('比例') || s.includes('得票') || s === '公明' || s === '公明党');
                });
                // 投票率列 (キーワード拡充)
                const turnoutIdx = findColumnIndex(headerRow, ['投票率', '参考投票率', 'Turnout', 'VotingRate']);

                if (districtIdx === -1) { setAlertMessage("必須列「選挙区」が見つかりません。"); return; }
                if (voterCountIdx === -1) { setAlertMessage("必須列「有権者数」が見つかりません。"); return; }

                const newVoterCounts = new Map(voterCounts); 
                let count = 0;
                let komeiCount = 0;

                for (let i = startRowIdx; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || row.length < 2) continue;
                    const districtRaw = getStr(row[districtIdx]).replace(/"/g, '').trim();
                    const voterVal = parseNumber(row[voterCountIdx]);
                    const komeiVal = komeiPropIdx !== -1 ? parseNumber(row[komeiPropIdx]) : 0;
                    const turnoutVal = turnoutIdx !== -1 ? parseNumber(row[turnoutIdx]) : null;

                    if (districtRaw) { 
                        // 特別処理: 全国合計の保存
                        if (districtRaw.includes("全国") || districtRaw.includes("合計") || districtRaw.includes("総数")) {
                            const currentNat = newVoterCounts.get('National') || {};
                            let natTurnout = turnoutVal;
                            // 1以上なら%表記とみなして100で割る簡易判定
                            if (natTurnout !== null && natTurnout > 1) natTurnout /= 100;
                            
                            newVoterCounts.set('National', { 
                                voterCount: voterVal || currentNat.voterCount || 0, 
                                komeiProportional: 0, 
                                referenceTurnout: natTurnout !== null ? natTurnout : (currentNat.referenceTurnout || 0.55)
                            });

                        const finalVoterCount = voterVal !== null ? voterVal : currentVoterCount;
                        
                        newVoterCounts.set(key, {
                            voterCount: finalVoterCount,
                            komeiProportional: komeiVal || 0,
                            referenceTurnout: turnoutVal
                        }); 
                        count++;
                        if (komeiVal > 0) komeiCount++;
                    }

                if (count > 0) {

                }

                     const matchCount = partyKeys.filter(p => rowStr.some(c => c.includes(p))).length;

                         headerRow = rowStr;
                         headerIndex = i;
                         break;

                     if (idx !== -1) partyIndices[p] = idx;
                 });

                         };

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        
                        if (type === 'analysis') processAnalysisData(rows);
                        else if (type === 'voter') processVoterData(rows);
                        else if (type === 'support') processSupportData(rows); // 追加
                        
                    } catch (err) { console.error(err); setAlertMessage("ファイルの読み込みに失敗しました。"); }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleResetData = () => { /* ... same ... */
                setConfirmConfig({
                    message: "データを初期化しますか？ (クラウド上のデータは削除されませんが、表示はリセットされます)",
                    onConfirm: () => {
                        setCandidates(INITIAL_MOCK_DATA);
                        setVoterCounts(new Map());
                        setSupportRates(null); // Reset support rates
                        setSupportRatesLastUpdated(null); // Reset date
                        // --- Reset localStorage ---
                        localStorage.removeItem('election_candidates');
                        localStorage.removeItem('election_voters');
                        localStorage.removeItem('election_support_rates'); // Reset support rates storage
                        localStorage.removeItem('election_support_rates_updated');
                        setLastUpdated("Simulation Data");
                        setSimSettings({ takaichiEffect: 0, coalitionEffect: 0, newPartyEffect: 0, emergingSurge: 0, turnoutChange: 0 });
                        setAlertMessage("表示をリセットしました。");
                    }
                });
            };

            const handleUpdateCandidates = (updatedDistrictCandidates) => { /* ... same ... */
                if (IS_READ_ONLY) return;
                setCandidates(prev => {
                    const newCandidates = [...prev];
                    updatedDistrictCandidates.forEach(updated => {
                        const index = newCandidates.findIndex(c => c.id === updated.id);
                        if (index !== -1) newCandidates[index] = updated;
                    });
                    if (window.fb) { window.fb.saveData('candidates', newCandidates); }
                    // Update localStorage
                    localStorage.setItem('election_candidates', JSON.stringify(newCandidates));
                    return newCandidates;
                });
            };

            // --- Export Read-Only HTML Logic ---
            const handleExportReadOnlyHtml = () => {
                const scriptContent = document.getElementById('app-script').textContent;
                
                // 1. Remove Firebase Script block completely
                const htmlContent = document.documentElement.outerHTML;
                const headContent = htmlContent.match(/<head>([\s\S]*?)<\/head>/)[1];
                // Remove Firebase script block from head
                const newHead = headContent.replace(/<script type="module" id="firebase-script">[\s\S]*?<\/script>/, '');

                // 2. Modify App Script
                // Set IS_READ_ONLY to true
                let newScript = scriptContent.replace('const IS_READ_ONLY = false;', 'const IS_READ_ONLY = true;');
                
                // Embed current candidates data
                const candidatesJson = JSON.stringify(candidates);
                newScript = newScript.replace(
                    /const INITIAL_MOCK_DATA = \[[\s\S]*?\]; \/\/ --- Mock Data Generator/,
                    `const INITIAL_MOCK_DATA = ${candidatesJson}; // Data embedded at export`
                );

                // Embed current voter counts
                const votersJson = JSON.stringify(Array.from(voterCounts.entries()));
                newScript = newScript.replace(
                    /const INITIAL_VOTER_COUNTS = \[[\s\S]*?\];/,
                    `const INITIAL_VOTER_COUNTS = ${votersJson}; // Data embedded at export`
                );

                // Embed support rates and date
                const supportJson = JSON.stringify(supportRates);
                newScript = newScript.replace(
                    /const \[supportRates, setSupportRates\] = useState\(\(\) => \{[\s\S]*?\}\);/,
                    `const [supportRates, setSupportRates] = useState(${supportJson});`
                );
                
                // Embed support rates date
                newScript = newScript.replace(
                    /const \[supportRatesLastUpdated, setSupportRatesLastUpdated\] = useState\(\(\) => \{[\s\S]*?\}\);/,
                    `const [supportRatesLastUpdated, setSupportRatesLastUpdated] = useState("${supportRatesLastUpdated || ''}");`
                );

                // Remove LoginScreen definition
                newScript = newScript.replace(/\/\* STRIP_START \*\/[\s\S]*?\/\* STRIP_END \*\//g, `
                // LoginScreen removed for Read-Only version
                const LoginScreen = () => null;
                `);

                // Remove Data Management Tab logic from export code (optional, but cleaner)
                // We will rely on IS_READ_ONLY flag to hide UI elements, so code removal isn't strictly necessary for security,
                // but removing the renderUpload function body makes it cleaner.
                // However, since we want to keep it simple and robust, we rely on IS_READ_ONLY flag which is already used in JSX.

                // Construct final HTML
                const html = `<!DOCTYPE html><html lang="ja"><head>${newHead}</head><body class="bg-gray-100 text-gray-800"><div id="root"></div><script type="text/babel">${newScript}const root = ReactDOM.createRoot(document.getElementById("root")); root.render(<App />);</` + `script></body></html>`;
                
                setExportCode(html);
            };

            const handleSummaryClick = (data) => { if (data && data.name) { setSelectedParty(data.name); setActiveTab('single'); } };
            const clearFilters = () => { setFilterText(""); setSelectedParty("All"); setSelectedPrefecture("All"); setShowCloseRaceOnly(false); setFilterType('all'); };
            const handleCloseRaceClick = () => { setFilterText(""); setSelectedParty("All"); setSelectedPrefecture("All"); setShowCloseRaceOnly(true); setActiveTab('single'); };

            // Base Turnout Calculation (moved to App scope)
            const { baseTurnout, rawNationalTurnout } = useMemo(() => {
                const nationalData = voterCounts.get('National');
                const rawVal = (nationalData && nationalData.referenceTurnout) ? nationalData.referenceTurnout : 0.55;
                return { baseTurnout: rawVal * 1.02, rawNationalTurnout: rawVal };
            }, [voterCounts]);

            const simulatedCandidates = useMemo(() => { 
                return candidates.map(c => {
                    let multiplier = 1.0;
                    let baseVotes = c.predictedVotes || 0;
                    
                    // --- 1. 基礎票 (Base Votes) の計算 ---
                    const getAverageVotes = () => {
                        const history = [c.votes2024, c.votes2021, c.votes2017, c.votes2014, c.votes2012]
                            .filter(v => typeof v === 'number' && v > 0);
                        if (history.length === 0) return 0;
                        return history.reduce((sum, val) => sum + val, 0) / history.length;
                    };

                    const avgVotes = getAverageVotes();
                    
                    const districtKey = c.district.replace(/\s+/g, '');
                    const voterData = voterCounts.get(districtKey);
                    // voterDataがundefinedの場合のガードを追加しつつ取得
                    const komeiProp = (voterData && typeof voterData === 'object') ? (voterData.komeiProportional || 0) : 0;

                    // 政党別の計算ロジック (小選挙区のみ適用)
                    // ★修正: ファイルの予想値有無にかかわらず、立憲・自民・公明のルールを強制適用する
                    if (c.type === 'single') {
                        // 過去平均があればそれを基準に、なければ現在の予想値を基準にする
                        const basis = avgVotes > 0 ? avgVotes : baseVotes;

                        if (c.party.includes('立憲') || c.party.includes('中道')) {
                            // 立憲・中道: (過去平均 × 0.9) + (公明比例票 × 0.65)
                            baseVotes = Math.floor((basis * 0.9) + (komeiProp * 0.65));
                        } else if (c.party.includes('自民')) {
                            // 自民: ((過去平均) - (公明比例票 × 0.7)) × 1.18 (変更)
                            baseVotes = Math.floor(Math.max(0, basis - (komeiProp * 0.7)) * 1.18);
                        } else if (c.party.includes('公明')) {
                            // 選挙区の公明は0
                            baseVotes = 0;
                        } else {
                            // その他: 予想値がなく、過去平均がある場合のみ平均を採用 (予想値がある場合はそのまま)
                            if ((!baseVotes || baseVotes === 0) && avgVotes > 0) {
                                baseVotes = Math.floor(avgVotes);
                            }
                        }
                    }
                    
                    // 予測値が計算後も0で、かつ支持率データがある場合は自動算出 (新人候補などの救済)
                    // (有権者数 × 支持率(小数) × 投票行為割合(小数))
                    if ((!baseVotes || baseVotes === 0) && supportRates) {
                         const partyKey = Object.keys(PARTY_COLORS).find(k => c.party.includes(k));
                         const rateData = partyKey ? supportRates[partyKey] : null;
                         
                         let vCount = 0;
                         let refTurnout = 0.55; // デフォルト投票率 55%

                         if (typeof voterData === 'number') vCount = voterData;
                         else if (voterData) {
                             vCount = voterData.voterCount;
                             if (voterData.referenceTurnout != null) refTurnout = voterData.referenceTurnout;
                         }
                         
                         if (rateData && vCount > 0) {
                             const support = rateData.support || 0;
                             const pTurnout = rateData.turnout || 0;
                             // 計算: 有権者数 * 地区投票率 * 政党支持率 * 政党投票行為率
                             baseVotes = Math.floor(vCount * refTurnout * support * pTurnout);
                         }
                    }
                    
                    // 1. 高市効果 (自民)
                    if (c.party.includes('自民')) {
                        multiplier += (simSettings.takaichiEffect / 100);
                        // 4. 新興躍進の副作用 (自民減 - 立憲減と合わせて全体バランス)
                        if (simSettings.emergingSurge > 0) {
                            multiplier -= (simSettings.emergingSurge / 100) / 3;
                        }
                    }
                    
                    // 2. 連立効果 (維新)
                    if (c.party.includes('維新')) {
                        multiplier += (simSettings.coalitionEffect / 100);
                    }

                    // 3. 新党効果 (立憲・公明比) & 4. 新興躍進の副作用 (立憲減)
                    if (c.party.includes('立憲') || c.party.includes('中道')) {
                        multiplier += (simSettings.newPartyEffect / 100);
                        multiplier -= (simSettings.emergingSurge / 100);
                    }
                    if (c.party.includes('公明') && c.type === 'proportional') {
                        multiplier += (simSettings.newPartyEffect / 100);
                    }

                    // 4. 新興躍進 (国民・参政)
                    if (c.party.includes('国民') || c.party.includes('参政')) {
                        multiplier += (simSettings.emergingSurge / 100);
                    }
                    
                    if (c.party.includes('共産')) multiplier *= 1.05;

                    // Apply Turnout Change (Voting Rate Slider)
                    // 変動後の投票率
                    const currentTurnout = baseTurnout + (simSettings.turnoutChange / 100);
                    // 係数 (0除算防止)
                    const turnoutMultiplier = baseTurnout > 0 ? (currentTurnout / baseTurnout) : 1.0;
                    
                    // ★修正: 投票率変動は「自民・国民・維新・参政」のみに適用する
                    const turnoutSensitiveParties = ['自民', '国民', '維新', '参政'];
                    if (turnoutSensitiveParties.some(p => c.party.includes(p))) {
                        multiplier *= turnoutMultiplier;
                    }

                    // 候補者指数を取得 (デフォルト1.0)
                    const cIndex = c.candidateIndex !== undefined ? c.candidateIndex : 1.0;

                    // 基本予測値 * シミュレーション倍率 * 候補者指数
                    // 指数はすべて計算の最後に掛ける
                    const simulatedVotes = Math.floor(baseVotes * Math.max(0, multiplier) * cIndex);
                    return { ...c, predictedVotes: simulatedVotes };
                });
            }, [candidates, simSettings, voterCounts, supportRates, baseTurnout]);

            const districtsData = useMemo(() => { /* ... same ... */
                const map = new Map();
                simulatedCandidates.forEach(c => {
                    const key = c.district.replace(/\s+/g, '');
                    if (!map.has(key)) map.set(key, []);
                    map.get(key)?.push(c);
                });
                const districts = [];
                map.forEach((cands, key) => {
                    cands.sort((a, b) => b.predictedVotes - a.predictedVotes);
                    let isClose = false;
                    if (cands.length >= 2 && cands[0].predictedVotes > 0) {
                        const diff = cands[0].predictedVotes - cands[1].predictedVotes;
                        if (diff / cands[0].predictedVotes < 0.1) isClose = true;
                    }
                    const totalPredictedVotes = cands.reduce((sum, c) => sum + c.predictedVotes, 0);
                    
                    let voters = 0;
                    let komeiProportional = 0;
                    let referenceTurnout = null;
                    
                    // Try to get data from map
                    const vData = voterCounts.get(key);

                    // Special handling for National Total if available
                    if ((key.includes('全国') || key === '合計') && voterCounts.has('National')) {
                        const natData = voterCounts.get('National');
                        voters = natData.voterCount;
                        referenceTurnout = natData.referenceTurnout; // 全国データの投票率も反映
                    } 
                    // Normal handling
                    else if (typeof vData === 'number') {
                        voters = vData;
                    } else if (vData) {
                        voters = vData.voterCount;
                        komeiProportional = vData.komeiProportional || 0;
                        referenceTurnout = vData.referenceTurnout;
                    }

                    const type = cands.length > 0 ? cands[0].type : 'single';

                    if (type === 'proportional') {
                         const targetPrefs = BLOCK_TO_PREFS[key]; 
                         if (targetPrefs) {
                             let totalVotersInBlock = 0;
                             let totalVotesInBlock = 0;

                             voterCounts.forEach((val, dKey) => {
                                 if (targetPrefs.some(pref => dKey.startsWith(pref))) {
                                     const vCount = (typeof val === 'number' ? val : val.voterCount);
                                     voters += vCount;
                                     if(typeof val === 'object') komeiProportional += (val.komeiProportional || 0);

                                     // 参考投票率の加重平均用計算
                                     if (typeof val === 'object' && val.referenceTurnout != null) {
                                         totalVotersInBlock += vCount;
                                         totalVotesInBlock += vCount * val.referenceTurnout;
                                     }
                                 }
                             });

                             // 全国の場合は個別ブロック計算ではなくNationalデータを優先しているので、ここではその他ブロック用
                             if (totalVotersInBlock > 0 && !key.includes('全国')) {
                                 referenceTurnout = totalVotesInBlock / totalVotersInBlock;
                             }
                         }
                    }

                    let turnout = null;
                    if (voters > 0) turnout = totalPredictedVotes / voters;
                    
                    districts.push({ 
                        name: key, 
                        candidates: cands, 
                        isCloseRace: isClose, 
                        totalPredictedVotes, 
                        voterCount: voters, 
                        turnout, 
                        type,
                        komeiProportional,
                        referenceTurnout // 追加
                    });
                });
                const getBlockIndex = (name) => PR_BLOCKS.indexOf(name);
                return districts.sort((a, b) => {
                    if (a.type === 'proportional' && b.type === 'proportional') return getBlockIndex(a.name) - getBlockIndex(b.name);
                    const getPrefIndex = (name) => { const pref = PREFECTURE_ORDER.find(p => name.startsWith(p)); return pref ? PREFECTURE_ORDER.indexOf(pref) : 999; };
                    const indexA = getPrefIndex(a.name); const indexB = getPrefIndex(b.name);
                    if (indexA !== indexB) return indexA - indexB;
                    const getDistrictNumber = (name) => { const match = name.match(/(\d+)区/); return match ? parseInt(match[1], 10) : 0; };
                    return getDistrictNumber(a.name) - getDistrictNumber(b.name);
                });
            }, [simulatedCandidates, voterCounts]);

            const partyStats = useMemo(() => { /* ... same ... */
                const stats = {};
                Object.keys(PARTY_COLORS).forEach(p => { stats[p] = { name: p, color: PARTY_COLORS[p], singleWinsResult: 0, prWinsResult: 0, singleWinsPred: 0, prWinsPred: 0 }; });
                
                // Helper to merge Komei into Chudo
                const getAggregatedParty = (partyName) => {
                    if (partyName.includes('公明')) return '中道';
                    // もし「立憲」が残っていたら中道へ
                    if (partyName.includes('立憲')) return '中道'; 
                    // デフォルトのマッピング
                    return Object.keys(PARTY_COLORS).find(k => partyName.includes(k)) || '諸派';
                };

                simulatedCandidates.forEach(c => {
                    // Logic fix: For 2026 mode (default), we want summary LEFT column to show 2024 results.
                    // c.status contains 2024 results. c.status2021 contains 2021.
                    // If displayYear is 2026 or 2024, use c.status.
                    const statusVal = (displayYear === '2024' || displayYear === '2026') ? c.status : c.status2021;
                    if (statusVal) {
                        const partyKey = getAggregatedParty(c.party);
                        if (!stats[partyKey]) stats[partyKey] = { name: partyKey, color: DEFAULT_COLOR, singleWinsResult: 0, prWinsResult: 0, singleWinsPred: 0, prWinsPred: 0 };
                        if (statusVal.includes('◎')) stats[partyKey].singleWinsResult++;
                        else if (statusVal.includes('○') || statusVal.includes('⚪︎')) stats[partyKey].prWinsResult++;
                    }
                });
                districtsData.forEach(d => {
                    if (d.type === 'single' && d.candidates.length > 0) {
                        const winner = d.candidates[0];
                        const partyKey = getAggregatedParty(winner.party);
                        if (!stats[partyKey]) stats[partyKey] = { name: partyKey, color: DEFAULT_COLOR, singleWinsResult: 0, prWinsResult: 0, singleWinsPred: 0, prWinsPred: 0 };
                        stats[partyKey].singleWinsPred++;
                    }
                });
                const proportionalVotes = {};
                simulatedCandidates.forEach(c => {
                    if (c.type === 'proportional' && c.predictedVotes > 0) {
                        const partyKey = getAggregatedParty(c.party);
                        if (!proportionalVotes[partyKey]) proportionalVotes[partyKey] = 0;
                        proportionalVotes[partyKey] += c.predictedVotes;
                    }
                });
                const prAllocation = calculateDhondt(proportionalVotes, 176);
                Object.keys(prAllocation).forEach(party => {
                    if (!stats[party]) stats[party] = { name: party, color: DEFAULT_COLOR, singleWinsResult: 0, prWinsResult: 0, singleWinsPred: 0, prWinsPred: 0 };
                    stats[party].prWinsPred = prAllocation[party];
                });
                return Object.values(stats).filter(p => (p.singleWinsResult + p.prWinsResult + p.singleWinsPred + p.prWinsPred) > 0).sort((a, b) => (b.singleWinsPred + b.prWinsPred) - (a.singleWinsPred + a.prWinsPred));
            }, [simulatedCandidates, districtsData, displayYear]);

            const semiCircleData = useMemo(() => { /* ... same ... */
                const order = ['諸派', '社民', '共産', 'れいわ', '公明', '立憲', '中道', '日本保守', '参政', '国民', '維新', '自民'];
                return order.map(partyName => {
                    const stat = partyStats.find(p => p.name === partyName);
                    const seats = stat ? (stat.singleWinsPred + stat.prWinsPred) : 0;
                    return { name: partyName, value: seats, fill: PARTY_COLORS[partyName] || DEFAULT_COLOR };
                }).filter(d => d.value > 0);
            }, [partyStats]);

            const isCountablePR = (name) => !name.includes("全国") && !name.includes("区分");
            
            const filteredDistricts = useMemo(() => {
                return districtsData.filter(d => {
                    if (activeTab === 'single' && d.type !== 'single') return false;
                    if (activeTab === 'proportional' && d.type !== 'proportional') return false;
                    if (showCloseRaceOnly && !d.isCloseRace) return false;
                    
                    let matchPref = false;
                    if (selectedPrefecture === "All") {
                        matchPref = true;
                    } else {
                        if (d.name.includes(selectedPrefecture)) {
                            matchPref = true;
                        } 
                        else if (d.type === 'proportional') {
                             if (d.name.includes(selectedPrefecture)) {
                                 matchPref = true;
                             }
                             const targetBlock = PREF_TO_BLOCK[selectedPrefecture];
                             if (targetBlock && d.name === targetBlock) {
                                 matchPref = true;
                             }
                        }
                        else if (d.type === 'single') {
                            const targetPrefs = BLOCK_TO_PREFS[selectedPrefecture]; 
                            if (targetPrefs && targetPrefs.some(pref => d.name.includes(pref))) {
                                matchPref = true;
                            }
                        }
                    }

                    const matchParty = selectedParty === "All" || d.candidates.some(c => c.party.includes(selectedParty));
                    
                    if (!matchPref || !matchParty) return false;
                    if (!filterText) return true;
                    const lowerFilter = filterText.toLowerCase().trim();
                    const matchDistrictName = d.name.toLowerCase().includes(lowerFilter);
                    const matchCandidate = d.candidates.some(c => 
                        (c.name && c.name.toLowerCase().includes(lowerFilter)) || 
                        (c.party && c.party.toLowerCase().includes(lowerFilter))
                    );
                    return matchDistrictName || matchCandidate;
                });
            }, [districtsData, filterText, selectedParty, selectedPrefecture, activeTab, showCloseRaceOnly]);

            const renderSummary = () => {
                // Calculate National Total Voter Count from file
                const nationalTotalVoters = voterCounts.get('National');
                const totalVotersDisplay = (nationalTotalVoters && typeof nationalTotalVoters === 'object') 
                    ? nationalTotalVoters.voterCount 
                    : Array.from(voterCounts.values()).reduce((sum, v) => sum + (typeof v === 'number' ? v : v.voterCount), 0);
                
                return (
                <div className="flex flex-col h-full">
                    {/* 投票率スライダーをここに配置 */}
                    <TurnoutControlBar settings={simSettings} setSettings={setSimSettings} baseTurnout={baseTurnout} rawNationalTurnout={rawNationalTurnout} />
                    
                    <div className="flex-1 overflow-y-auto p-4 md:p-8 pb-20">
                        <SimulationPanel settings={simSettings} setSettings={setSimSettings} />
                        
                        {/* National Voter Count Display */}
                        {totalVotersDisplay > 0 && (
                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-200 text-center mb-6">
                                <span className="text-gray-600 font-bold mr-2">全国有権者数:</span>
                                <span className="text-2xl font-mono font-bold text-blue-800">{totalVotersDisplay.toLocaleString()}</span>
                            </div>
                        )}

                        <div className="flex flex-col md:flex-row gap-6">
                        <Card className="flex-1 p-6 flex flex-col min-h-[600px]">
                            <h3 className="text-lg font-bold mb-6 text-gray-800 flex-none">2026年 獲得議席予測 (小選挙区＋比例)</h3>
                            <div className="flex-1 flex flex-col gap-8">
                                <div className="flex-1 w-full min-h-[300px]">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={partyStats} layout="vertical" margin={{ left: 20, right: 30 }} onClick={(data) => { if (data && data.activePayload && data.activePayload.length > 0) handleSummaryClick(data.activePayload[0].payload); }}>
                                            <CartesianGrid strokeDasharray="3 3" horizontal={false} />
                                            <XAxis type="number" />
                                            <YAxis dataKey="name" type="category" width={70} interval={0} tick={{ fontSize: 11 }} />
                                            <RechartsTooltip />
                                            <Legend verticalAlign="top" height={36}/>
                                            <Bar dataKey="singleWinsPred" name="小選挙区(予測)" stackId="a" fill="#8884d8" cursor="pointer" />
                                            <Bar dataKey="prWinsPred" name="比例(176配分)" stackId="a" fill="#82ca9d" cursor="pointer" />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                                <div className="h-48 w-full relative">
                                    <h4 className="text-sm text-center font-bold text-gray-500 absolute top-0 left-0 w-full z-10">勢力図 (予測合計)</h4>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <Pie data={semiCircleData} cx="50%" cy="85%" startAngle={180} endAngle={0} innerRadius="100%" outerRadius="140%" paddingAngle={1} dataKey="value">
                                                {semiCircleData.map((entry, index) => (<Cell key={`cell-${index}`} fill={entry.fill} />))}
                                            </Pie>
                                            <RechartsTooltip />
                                            <Legend verticalAlign="bottom" height={36}/>
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </Card>
                        <Card className="flex-1 p-6 h-fit relative">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-lg font-bold text-gray-800">政党別 実績・予測詳細</h3>
                                <div className="flex items-center gap-2 bg-gray-100 p-1 rounded-lg">
                                    <button onClick={() => setDisplayYear('2024')} className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${(displayYear === '2024' || displayYear === '2026') ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>2024当選</button>
                                    <button onClick={() => setDisplayYear('2021')} className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${displayYear === '2021' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}>2021当選</button>
                                </div>
                            </div>

                        <div className="max-w-7xl mx-auto px-4 flex justify-between items-center">
                            <div className="flex space-x-6 overflow-x-auto no-scrollbar flex-1 -mb-[1px]">
                                <button onClick={() => setActiveTab('summary')} className={`py-3 px-1 flex items-center gap-2 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'summary' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}><MapIcon width={16} height={16} />情勢サマリー</button>
                                <button onClick={() => setActiveTab('single')} className={`py-3 px-1 flex items-center gap-2 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'single' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}><FileText width={16} height={16} />小選挙区</button>
                                <button onClick={() => setActiveTab('proportional')} className={`py-3 px-1 flex items-center gap-2 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'proportional' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}><Layers width={16} height={16} />比例代表</button>
                                {!IS_READ_ONLY && <button onClick={() => setActiveTab('upload')} className={`py-3 px-1 flex items-center gap-2 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'upload' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}><Upload width={16} height={16} />データ管理・読込</button>}
                            </div>
                            <div className="py-2 pl-4 flex-none">
                                <button onClick={() => setShowExplanation(true)} className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-bold rounded-full hover:bg-indigo-700 transition-colors shadow-sm whitespace-nowrap">
                                    <Info width={16} height={16} />
                                    シミュレーションの解説
                                </button>
                            </div>
                        </div>
                    </div>
                    <main className="flex-1 overflow-hidden relative max-w-7xl mx-auto w-full">
                        {activeTab === 'summary' && renderSummary()}
                        
                        {(activeTab === 'single' || activeTab === 'proportional') && renderDistrictsList()}

                        {activeTab === 'upload' && !IS_READ_ONLY && renderUpload()}
                    </main>
                    <footer className="flex-none bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
                        &copy; 一般社団法人日本みらい研
                    </footer>
                    {selectedDistrict && <DistrictModal district={selectedDistrict} onClose={() => setSelectedDistrict(null)} onUpdate={handleUpdateCandidates} />}
                    <AlertDialog message={alertMessage} onClose={() => setAlertMessage(null)} />
                    <ConfirmDialog config={confirmConfig} onCancel={() => setConfirmConfig(null)} />
                    {exportCode && <CodeExportDialog code={exportCode} onClose={() => setExportCode(null)} />}
                    
                    {/* 解説モーダル */}
                    {showExplanation && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 z-[70] flex items-center justify-center p-4" onClick={() => setShowExplanation(false)}>
                            <div className="bg-white rounded-xl shadow-xl p-6 max-w-lg w-full max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
                                    <Info className="w-6 h-6 text-blue-600"/> シミュレーションの解説
                                </h3>
                                <div className="text-sm text-gray-700 space-y-4 leading-relaxed">
                                    <p>このシミュレーションは、過去の衆議院選挙の結果をベースに、内閣支持率や各政党の支持率、選挙区情勢などを総合的に判断した試算結果である。</p>
                                    <p>立・公は中道とし、選挙区の公明票は自民から中道に移動し、その上で、各党の党勢や世論、候補者の動きなどを加えて予想票を算出している。</p>
                                    <p>デフォルトでは、自民や連立効果、新興政党の躍進を抑え気味にし、中道は立憲と公明の連携が8割程度進む前提で設定している。</p>
                                    <p>そのため、実際には、中道の勢いは現状よりマイナスとなる可能性が高く、自民は10％程度まで上昇する可能性があることに留意いただきたい。</p>
                                    <p>数値の設定を調整できるスライドも用意しているので、各自の感覚に応じて数値を調整して、当落予測をすることも可能となっている。</p>
                                    <p>過去の投票数は、選挙区割りや候補者の変動もあるため、正確ではないケースもあるが、分かる範囲で記載している。</p>
                                </div>
                                <div className="mt-6 flex justify-end">
                                    <button onClick={() => setShowExplanation(false)} className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold transition-colors">閉じる</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
