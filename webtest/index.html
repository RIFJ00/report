<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策リサーチ関連動画</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .aspect-w-16 { position: relative; padding-bottom: 56.25%; }
        .aspect-w-16 iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* タブのトランジション */
        .tab-btn { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto px-4 py-6">
        
        <!-- ヘッダー -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 flex items-center">
                <i class="fas fa-play-circle text-blue-600 mr-3"></i>政策リサーチ関連動画
            </h1>
            <div class="flex items-center gap-4">
                <div class="text-sm text-gray-500">
                    最終更新: <span id="last-updated-time">未取得</span>
                </div>
                <button id="update-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium shadow-sm transition-colors flex items-center gap-2">
                    <i class="fas fa-sync-alt"></i> 更新
                </button>
            </div>
        </header>

        <!-- タブナビゲーション (並列表示) -->
        <div class="flex gap-2 mb-6 bg-gray-200 p-1 rounded-xl">
            <!-- 本日のポイント タブ -->
            <div id="tab-point" class="tab-btn flex-1 flex items-center justify-center gap-2 py-3 rounded-lg cursor-pointer text-center font-bold text-gray-600 hover:bg-gray-300" onclick="switchTab('point')">
                <i class="fas fa-lightbulb"></i>
                <span>本日のポイント</span>
                <!-- 該当URLへのリンク -->
                <a href="https://example.com/point" target="_blank" title="元のサイトを開く" class="ml-1 text-gray-400 hover:text-blue-600" onclick="event.stopPropagation();">
                    <i class="fas fa-external-link-alt text-sm"></i>
                </a>
            </div>

            <!-- 政策レポート タブ -->
            <div id="tab-report" class="tab-btn flex-1 flex items-center justify-center gap-2 py-3 rounded-lg cursor-pointer text-center font-bold text-gray-600 hover:bg-gray-300" onclick="switchTab('report')">
                <i class="fas fa-file-alt"></i>
                <span>政策レポート</span>
                <!-- 該当URLへのリンク -->
                <a href="https://example.com/report" target="_blank" title="元のサイトを開く" class="ml-1 text-gray-400 hover:text-blue-600" onclick="event.stopPropagation();">
                    <i class="fas fa-external-link-alt text-sm"></i>
                </a>
            </div>
        </div>

        <!-- メインコンテンツエリア -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- プレイヤーエリア (左側 2/3) -->
            <div class="lg:col-span-2">
                <div class="bg-black rounded-xl overflow-hidden shadow-lg aspect-w-16 mb-4">
                    <div id="youtube-player"></div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h2 id="current-video-title" class="text-xl font-bold text-gray-900 mb-2">動画を選択してください</h2>
                    <p id="current-video-channel" class="text-gray-500 text-sm"><i class="fas fa-tv mr-1"></i> チャンネル情報</p>
                </div>
            </div>

            <!-- 再生リストエリア (右側 1/3) -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[500px] lg:h-auto lg:max-h-[600px]">
                <div class="p-4 border-b border-gray-100 bg-gray-50 rounded-t-xl flex justify-between items-center">
                    <h3 class="font-bold text-gray-800">
                        <i class="fas fa-list-ul mr-2"></i>再生リスト (<span id="current-tab-name">本日のポイント</span>)
                    </h3>
                    <span id="playlist-count" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full font-bold">0 件</span>
                </div>
                
                <!-- リストアイテムコンテナ -->
                <div id="playlist-container" class="flex-1 overflow-y-auto p-2 space-y-1">
                    <!-- JSで動的にリストが生成されます -->
                    <div class="text-center text-gray-500 py-10">読み込み中...</div>
                </div>
            </div>

        </div>
    </div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- 設定と状態管理 ---
        const UPDATE_INTERVAL_MS = 60 * 60 * 1000; // 60分
        
        let state = {
            activeTab: 'point', // 'point' または 'report'
            playlists: {
                point: [],
                report: []
            },
            currentVideoIndex: 0,
            lastUpdated: null
        };

        let player;
        let updateTimer;
        let isPlayerReady = false;

        // --- ダミーデータ生成関数 (実際のAPI等に置き換えてください) ---
        // ※実際はRSSフィードやYouTube APIから取得する処理に変更します。
        async function fetchFeedsData() {
            // API通信を模倣した待機
            await new Promise(resolve => setTimeout(resolve, 800));
            
            const now = new Date();
            const dateStr = `${now.getMonth()+1}月${now.getDate()}日`;

            return {
                point: [
                    { id: 'dQw4w9WgXcQ', title: `【${dateStr}】本日のポイント解説 1`, channel: '政策リサーチch' },
                    { id: 'jNQXAC9IVRw', title: `【${dateStr}】本日のポイント解説 2 (市場動向)`, channel: '政策リサーチch' },
                    { id: 'M7lc1UVf-VE', title: `【${dateStr}】本日のポイント解説 3 (トピック)`, channel: '政策リサーチch' }
                ],
                report: [
                    { id: 'C0DPdy98e4c', title: `【${dateStr}発行】月例 政策レポート詳細`, channel: 'シンクタンク公式' },
                    { id: '3JZ_D3ELwOQ', title: `【解説】政策レポート：次期法案のゆくえ`, channel: 'シンクタンク公式' },
                    { id: 'hHvd1Lw_Q_0', title: `【対談】有識者が語る最新政策レポート`, channel: 'シンクタンク公式' }
                ]
            };
        }

        // --- データ更新処理 ---
        async function updateData(force = false) {
            const btn = document.getElementById('update-btn');
            const icon = btn.querySelector('i');
            
            // ボタンのアニメーション
            icon.classList.add('fa-spin');
            btn.disabled = true;
            btn.classList.add('opacity-70');

            try {
                // 両方のフィードデータを取得
                const newData = await fetchFeedsData();
                state.playlists.point = newData.point;
                state.playlists.report = newData.report;
                state.lastUpdated = new Date().getTime();
                
                // localStorageへ保存（更新するまで保持）
                saveToLocalStorage();
                
                // UIの再描画
                updateLastUpdatedText();
                renderPlaylist();
                
                // 更新時、または最初の読み込み時に一番最初の動画を表示
                state.currentVideoIndex = 0;
                loadCurrentVideo();

                // 自動更新のタイマーをリセット
                resetAutoUpdateTimer();
                
            } catch (error) {
                console.error("データの更新に失敗しました", error);
                alert("データの取得に失敗しました。時間をおいて再試行してください。");
            } finally {
                icon.classList.remove('fa-spin');
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }
        }

        // --- LocalStorage 処理 ---
        function saveToLocalStorage() {
            localStorage.setItem('policy_autoplayer_data', JSON.stringify({
                playlists: state.playlists,
                lastUpdated: state.lastUpdated
            }));
        }

        function loadFromLocalStorage() {
            const data = localStorage.getItem('policy_autoplayer_data');
            if (data) {
                const parsed = JSON.parse(data);
                if (parsed.playlists && parsed.playlists.point.length > 0) {
                    state.playlists = parsed.playlists;
                    state.lastUpdated = parsed.lastUpdated;
                    return true;
                }
            }
            return false;
        }

        // --- UI描画処理 ---
        
        // タブの切り替え
        function switchTab(tabName) {
            if (state.activeTab === tabName) return;
            state.activeTab = tabName;
            state.currentVideoIndex = 0; // タブを変えたら最初の動画に戻る
            
            updateTabUI();
            renderPlaylist();
            loadCurrentVideo(); // デフォルトで最初の動画を画面に表示
        }

        // タブの見た目（色）の更新
        function updateTabUI() {
            const tabPoint = document.getElementById('tab-point');
            const tabReport = document.getElementById('tab-report');
            const tabNameLabel = document.getElementById('current-tab-name');

            // アクティブなタブのスタイル（青色）
            const activeClasses = ['bg-blue-600', 'text-white', 'shadow-md'];
            const inactiveClasses = ['text-gray-600', 'hover:bg-gray-300'];

            if (state.activeTab === 'point') {
                tabPoint.classList.add(...activeClasses);
                tabPoint.classList.remove(...inactiveClasses);
                tabReport.classList.add(...inactiveClasses);
                tabReport.classList.remove(...activeClasses);
                tabNameLabel.textContent = '本日のポイント';
            } else {
                tabReport.classList.add(...activeClasses);
                tabReport.classList.remove(...inactiveClasses);
                tabPoint.classList.add(...inactiveClasses);
                tabPoint.classList.remove(...activeClasses);
                tabNameLabel.textContent = '政策レポート';
            }
        }

        // 再生リストの描画
        function renderPlaylist() {
            const container = document.getElementById('playlist-container');
            const currentList = state.playlists[state.activeTab];
            
            document.getElementById('playlist-count').textContent = `${currentList.length} 件`;
            container.innerHTML = '';

            if (currentList.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-10">動画がありません</div>';
                return;
            }

            currentList.forEach((video, index) => {
                const isActive = index === state.currentVideoIndex;
                const activeClass = isActive ? 'bg-blue-50 border-blue-500 border-l-4' : 'bg-white border-transparent hover:bg-gray-50 border-l-4';
                
                const itemDiv = document.createElement('div');
                itemDiv.className = `flex gap-3 p-2 rounded cursor-pointer transition-colors ${activeClass}`;
                itemDiv.onclick = () => playVideoIndex(index);

                itemDiv.innerHTML = `
                    <div class="relative w-24 h-16 flex-shrink-0 bg-gray-200 rounded overflow-hidden">
                        <img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg" alt="${video.title}" class="w-full h-full object-cover">
                        ${isActive ? '<div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center"><i class="fas fa-play text-white text-sm"></i></div>' : ''}
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <h4 class="text-sm font-bold text-gray-900 line-clamp-2 leading-snug" title="${video.title}">${video.title}</h4>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        // 最終更新日時の表示
        function updateLastUpdatedText() {
            if (!state.lastUpdated) return;
            const d = new Date(state.lastUpdated);
            const formatted = `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            document.getElementById('last-updated-time').textContent = formatted;
        }

        // --- プレイヤー制御 ---
        
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 0,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            isPlayerReady = true;
            // データがすでにローカルにあり、ロード待ちだった場合は表示
            if (state.playlists[state.activeTab].length > 0) {
                loadCurrentVideo();
            }
        }

        function onPlayerStateChange(event) {
            // 動画が終了したとき（オートプレイ）
            if (event.data === YT.PlayerState.ENDED) {
                playNextVideo();
            }
        }

        function playVideoIndex(index) {
            state.currentVideoIndex = index;
            loadCurrentVideo();
            renderPlaylist(); // リストのハイライト更新
        }

        function loadCurrentVideo() {
            if (!isPlayerReady) return;
            const currentList = state.playlists[state.activeTab];
            
            if (currentList.length > 0 && currentList[state.currentVideoIndex]) {
                const video = currentList[state.currentVideoIndex];
                player.loadVideoById(video.id);
                
                // タイトルなどのメタデータを更新
                document.getElementById('current-video-title').textContent = video.title;
                document.getElementById('current-video-channel').innerHTML = `<i class="fas fa-tv mr-1"></i> ${video.channel || '情報なし'}`;
            } else {
                document.getElementById('current-video-title').textContent = '再生可能な動画がありません';
                document.getElementById('current-video-channel').innerHTML = '';
            }
        }

        function playNextVideo() {
            const currentList = state.playlists[state.activeTab];
            if (state.currentVideoIndex < currentList.length - 1) {
                state.currentVideoIndex++;
                loadCurrentVideo();
                renderPlaylist();
            }
            // 最後の動画が終わったら止まる仕様としています（必要に応じてループ処理も可能）
        }

        // --- 自動更新のタイマー制御 ---
        function resetAutoUpdateTimer() {
            if (updateTimer) {
                clearInterval(updateTimer);
            }
            updateTimer = setInterval(() => {
                updateData(true);
            }, UPDATE_INTERVAL_MS);
        }

        // --- 初期化処理 ---
        function init() {
            // UIの初期設定
            updateTabUI();

            // 更新ボタンのイベント登録
            document.getElementById('update-btn').addEventListener('click', () => updateData(true));

            // ローカルストレージにデータがあれば読み込み、なければ新規フェッチ
            if (loadFromLocalStorage()) {
                updateLastUpdatedText();
                renderPlaylist();
                // プレイヤー側の準備ができ次第ロードされるようにしている
                resetAutoUpdateTimer();
            } else {
                updateData(true);
            }
        }

        // DOMロード完了時に初期化
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
