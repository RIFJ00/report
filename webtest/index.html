<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策リサーチ関連動画</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .active-video {
            border-left: 4px solid #ef4444; /* red-500 */
            background-color: #fee2e2; /* red-100 */
        }
        /* スクロールバーのスタイリング */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- ヘッダー＆コントロールパネル -->
    <header class="bg-white shadow-md z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <!-- タイトル、APIキー、検索枠の行 -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4 relative z-50">
                <h1 class="text-xl font-bold text-gray-900 flex items-center shrink-0">
                    <i class="fab fa-youtube text-red-600 mr-2 text-2xl"></i> 政策リサーチ関連動画
                </h1>
                
                <div class="flex flex-col sm:flex-row items-end sm:items-center gap-4 w-full md:w-auto">
                    <!-- APIキー設定 (ドロップダウン式) -->
                    <details class="text-sm text-gray-600 group relative">
                        <summary class="cursor-pointer hover:text-red-600 font-medium select-none flex items-center py-2">
                            <i class="fas fa-cog mr-1"></i> API設定
                        </summary>
                        <div class="absolute right-0 top-full mt-1 p-4 bg-white border border-gray-200 rounded-md shadow-xl w-72 sm:w-80 z-[100]">
                            <p class="mb-3 text-xs text-gray-600 leading-relaxed">
                                ※<span class="text-red-600 font-bold">限定公開</span>のプレイリストを正確な日時で並び替えたり、安定して全件取得したい場合は、ご自身の「YouTube Data API v3」のAPIキーを入力してください。
                            </p>
                            <input type="text" id="apiKey" placeholder="AIzaSy... (任意)" 
                                   class="block w-full rounded-md border-gray-300 border px-3 py-2 focus:border-red-500 focus:ring-red-500 outline-none bg-white">
                        </div>
                    </details>
                    
                    <!-- 検索ボックス -->
                    <div class="relative w-full sm:w-64 shrink-0">
                        <input type="text" id="searchInput" placeholder="複数ワードは空白区切り..." class="w-full pl-9 pr-10 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:border-red-500 focus:ring-red-500 transition bg-white">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-gray-400"></i>
                        </div>
                        <button id="clearSearchBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 hidden transition">
                            <i class="fas fa-times-circle"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 操作パネル行 -->
            <div class="flex flex-col md:flex-row gap-4 items-stretch relative z-10">
                <div class="flex-1 w-full">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 h-full">
                        <label class="cursor-pointer h-full">
                            <input type="radio" name="playlistSelect" value="PL6FZHPPVKyXFXEJTbul2NaCUsWPYJBZC_" class="peer sr-only" checked>
                            <div class="h-full rounded-md border border-gray-300 px-3 py-3 text-base md:text-lg font-bold text-gray-700 transition hover:bg-gray-50 peer-checked:border-blue-500 peer-checked:bg-blue-50 peer-checked:text-blue-700 shadow-sm flex items-center justify-center">
                                会議等概要説明動画
                            </div>
                        </label>
                        <label class="cursor-pointer h-full">
                            <input type="radio" name="playlistSelect" value="PL6FZHPPVKyXEIY8f5r6qP2wBitWD6Nc_2" class="peer sr-only">
                            <div class="h-full rounded-md border border-gray-300 px-3 py-3 text-base md:text-lg font-bold text-gray-700 transition hover:bg-gray-50 peer-checked:border-blue-500 peer-checked:bg-blue-50 peer-checked:text-blue-700 shadow-sm flex items-center justify-center">
                                政策レポート等解説動画
                            </div>
                        </label>
                    </div>
                </div>
                
                <!-- 自動更新の入力欄を非表示に (hidden クラスを追加) -->
                <div class="w-full md:w-32 shrink-0 hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-1">自動更新 (分)</label>
                    <input type="number" id="updateInterval" value="60" min="5" 
                           class="block w-full rounded-md border-gray-300 border px-3 py-2 focus:border-red-500 focus:ring-red-500 outline-none transition">
                </div>
                
                <button id="startBtn" class="w-full md:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded shadow transition duration-200 flex items-center justify-center shrink-0">
                    <i class="fas fa-sync-alt mr-2"></i>更新
                </button>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6 h-auto md:h-[calc(100vh-180px)]">
        
        <!-- プレイヤー＆概要エリア -->
        <div class="w-full md:w-2/3 flex flex-col gap-4 h-full overflow-hidden">
            <!-- 16:9 プレイヤー -->
            <div class="bg-black rounded-xl overflow-hidden shadow-lg relative w-full aspect-video shrink-0">
                <div id="player" class="absolute inset-0"></div>
                <div id="player-placeholder" class="absolute inset-0 flex items-center justify-center text-gray-500 pointer-events-none">
                    <div class="text-center">
                        <i class="fas fa-video text-4xl mb-2"></i>
                        <p>上部の「取得＆再生」ボタンを押して開始してください</p>
                    </div>
                </div>
            </div>

            <!-- 概要パネル -->
            <div class="bg-white rounded-xl shadow-lg p-4 md:p-6 flex-1 overflow-y-auto border border-gray-200 min-h-[150px]">
                <h2 id="currentTitle" class="text-xl md:text-2xl font-bold text-gray-900 mb-2 leading-tight">動画を選択してください</h2>
                <p id="currentDate" class="text-sm text-gray-500 mb-4 border-b border-gray-100 pb-2"></p>
                <div id="currentDescription" class="text-sm text-gray-700 whitespace-pre-wrap break-words leading-relaxed"></div>
            </div>
        </div>
        
        <!-- 再生リストエリア -->
        <div class="w-full md:w-1/3 bg-white rounded-xl shadow-lg flex flex-col h-[60vh] md:h-full border border-gray-200 overflow-hidden shrink-0">
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center shrink-0">
                <h2 class="text-lg font-bold text-gray-800"><i class="fas fa-list-ul mr-2 text-gray-600"></i>再生リスト (新しい順)</h2>
                <button id="refreshBtn" class="text-gray-500 hover:text-blue-600 transition" title="今すぐリストを更新">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>

            <div class="px-4 py-2 bg-gray-100 text-xs text-gray-500 flex justify-between shrink-0">
                <span id="playlistInfo">未取得</span>
                <!-- 自動更新のカウントダウンを非表示に -->
                <span id="nextUpdateInfo" class="hidden"></span>
            </div>
            <div id="playlistContainer" class="flex-1 overflow-y-auto">
                <div class="p-6 text-center text-gray-400 text-sm">
                    動画データがありません
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase 初期化 ---
        const firebaseConfig = {
          apiKey: "AIzaSyCU6YBFAcSUbrCi1-bCKbs1U0BCW5QFF04",
          authDomain: "import-b6097.firebaseapp.com",
          projectId: "import-b6097",
          storageBucket: "import-b6097.firebasestorage.app",
          messagingSenderId: "462510788117",
          appId: "1:462510788117:web:44ff1fd1af583f67bc081c",
          measurementId: "G-Z5ZNMKGTTK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Firebase認証（匿名ログイン）
        let user = null;
        async function initAuth() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Firebase Authentication failed:", error);
            }
        }
        
        onAuthStateChanged(auth, (u) => { user = u; });

        // 保存先パス用のAppID
        const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'youtube-playlist-app';

        // Firebaseからリストを読み込む
        async function loadFromFirebase(playlistId) {
            if (!user) return null;
            try {
                const docRef = doc(db, 'artifacts', envAppId, 'public', 'data', 'playlists', playlistId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // Firebaseに保存したタイムスタンプ(数値)をDate型に戻す
                    return data.videos.map(v => ({
                        ...v,
                        pubDate: new Date(v.pubDate)
                    }));
                }
            } catch (e) {
                console.error("Firebaseからの読み込みエラー:", e);
            }
            return null;
        }

        // Firebaseへリストを保存する
        async function saveToFirebase(playlistId, videos) {
            if (!user) return;
            try {
                const docRef = doc(db, 'artifacts', envAppId, 'public', 'data', 'playlists', playlistId);
                // Date型をタイムスタンプ(数値)に変換して保存
                // Firestoreの1ドキュメント容量上限(1MB)エラーを回避するため、長文になりがちなdescriptionは最大250文字に切り詰めて保存
                const dataToSave = videos.map(v => ({
                    id: v.id,
                    title: v.title,
                    description: v.description ? (v.description.length > 250 ? v.description.substring(0, 250) + "..." : v.description) : "",
                    thumbnail: v.thumbnail || "",
                    pubDate: v.pubDate.getTime(),
                    isEstimated: !!v.isEstimated
                }));
                await setDoc(docRef, { videos: dataToSave, updatedAt: Date.now() });
                console.log(`動画リスト(${videos.length}件)をFirebaseに保存しました。`);
            } catch (e) {
                console.error("Firebaseへの保存エラー:", e);
                showToast("データベースの保存容量上限により、保存に失敗しました。", true);
            }
        }

        let player = null;
        let isPlayerReady = false;
        let videoList = [];
        let currentIndex = 0;
        let updateIntervalId = null;
        let nextUpdateTime = null;
        let countdownIntervalId = null;

        // --- YouTube IFrame API のロード ---
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // module化によりグローバルスコープから外れるため、windowに明示的に登録
        window.onYouTubeIframeAPIReady = function() {
            isPlayerReady = true;
        };

        function initPlayer() {
            if (player) return; // 既に存在する場合は無視
            
            // YT APIがまだロードされていない場合は少し待ってから再試行する
            if (typeof YT === 'undefined' || typeof YT.Player === 'undefined') {
                setTimeout(initPlayer, 500);
                return;
            }

            document.getElementById('player-placeholder').style.display = 'none';
            
            // 最初から対象の動画IDを指定してプレイヤーを作成する
            const initialVideoId = videoList.length > 0 ? videoList[currentIndex].id : '';

            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: initialVideoId,
                // サードパーティCookieブロックを回避するための nocookie ドメインを使用
                host: 'https://www.youtube-nocookie.com',
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 1,
                    'mute': 0, // 音が出るように初期ミュートを解除
                    'rel': 0,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            renderPlaylist();
            
            // 音声ありの自動再生はブラウザにブロックされる可能性が高いため、その旨を通知する
            const playPromise = event.target.playVideo();
            
            // プレイヤーの音量を100%に設定し、確実にミュートを解除
            setTimeout(() => {
                if(player && typeof player.unMute === 'function') {
                    player.unMute();
                    player.setVolume(100);
                }
            }, 500);

            showToast("再生を開始します。※自動で始まらない場合は、動画画面をクリックしてください。");
        }

        function onPlayerStateChange(event) {
            // 動画が最後まで再生されたら次へ
            if (event.data === YT.PlayerState.ENDED) {
                playNextVideo();
            }
        }

        function onPlayerError(event) {
            console.warn("動画の再生エラー コード:", event.data);
            let errorMsg = "動画を再生できませんでした。";
            
            // エラーコードに応じたメッセージ
            if (event.data === 101 || event.data === 150) {
                errorMsg = "埋め込み再生が許可されていない動画です。";
            } else if (event.data === 100) {
                errorMsg = "動画が見つかりません（削除・非公開等）。";
            } else if (event.data === 2) {
                errorMsg = "動画IDが不正です。";
            }

            showToast(errorMsg + " 次へスキップします。", true);
            setTimeout(playNextVideo, 2000); // 2秒後に自動で次へ
        }

        // --- 再生制御ロジック ---
        function playNextVideo() {
            if (videoList.length === 0) return;
            currentIndex++;
            
            // リストの最後まで行ったら最初（最新）に戻る
            if (currentIndex >= videoList.length) {
                currentIndex = 0;
                showToast("プレイリストが一周しました。最初から再生します。");
            }
            playCurrentVideo();
        }

        function playCurrentVideo() {
            if (videoList.length === 0 || !player || typeof player.loadVideoById !== 'function') return;
            const video = videoList[currentIndex];
            player.loadVideoById(video.id);
            renderPlaylist();
            updateCurrentVideoInfo(); // 再生時に概要を更新
        }

        // --- 概要パネルの更新 ---
        function updateCurrentVideoInfo() {
            if (videoList.length === 0) return;
            const video = videoList[currentIndex];
            
            document.getElementById('currentTitle').textContent = video.title;
            
            // 公開日のフォーマット
            const dateStr = video.pubDate.toLocaleDateString('ja-JP', { 
                year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
            });
            // 推定フラグがある場合はその旨を表示
            document.getElementById('currentDate').textContent = video.isEstimated ? `公開日: 約 ${dateStr} (推定)` : `公開日: ${dateStr}`;
            
            // 概要の表示
            const descEl = document.getElementById('currentDescription');
            if (video.description) {
                descEl.textContent = video.description;
            } else {
                descEl.textContent = "この動画に概要はありません。";
                descEl.classList.add("text-gray-400");
            }
            descEl.classList.remove("text-gray-400");
        }

        // --- データ取得ロジック ---
        function extractPlaylistId(input) {
            if (!input) return null;
            const match = input.match(/[?&]list=([^&]+)/);
            if (match) return match[1];
            return input.trim();
        }

        // 11桁の正しいYouTube動画IDかチェックするバリデーション関数
        function isValidVideoId(id) {
            return id && /^[a-zA-Z0-9_-]{11}$/.test(id);
        }

        async function fetchPlaylistData(isAutoUpdate = false, forceYouTube = false) {
            const selectedRadio = document.querySelector('input[name="playlistSelect"]:checked');
            const playlistId = selectedRadio ? selectedRadio.value : null;
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!playlistId) {
                showToast("プレイリストを選択してください", true);
                return;
            }

            // 保存
            localStorage.setItem('yt_auto_playlist_select', playlistId);
            if (apiKey) localStorage.setItem('yt_auto_api_key', apiKey);

            if (!isAutoUpdate) showToast("動画リストを取得中...");

            const btn = document.getElementById('startBtn');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>取得中';
            btn.disabled = true;

            try {
                let videos = null;
                let existingVideos = null;
                let source = "Firebase";

                // 1. まずはFirebaseから既存データを読み込み
                existingVideos = await loadFromFirebase(playlistId);

                // 強制取得フラグがオフなら、とりあえず既存データを表示用にセット
                if (!forceYouTube) {
                    videos = existingVideos;
                }

                // 2. Firebaseに無かった場合、または強制更新の場合はYouTubeから取得し、統合する
                if (!videos || videos.length === 0 || forceYouTube) {
                    source = forceYouTube && existingVideos ? "YouTube + Firebase(蓄積)" : "YouTube";
                    let newVideos = [];
                    let usedScraping = false;
                    let apiFailed = false;
                    
                    if (apiKey) {
                        try {
                            newVideos = await fetchWithApi(playlistId, apiKey);
                        } catch (apiError) {
                            console.warn("API取得エラー:", apiError);
                            apiFailed = true;
                            // APIキーの設定ミスなどの場合、処理を止めずに代替手段へフォールバックする
                            showToast(`${apiError.message}。代替手段（RSS等）での取得を試行します。`, true);
                        }
                    } 

                    // APIキーがない場合、もしくはAPI取得が失敗した場合に代替手段を実行
                    if (!apiKey || apiFailed) {
                        try {
                            newVideos = await fetchWithRss(playlistId);
                            if (!newVideos || newVideos.length === 0) throw new Error("RSS Empty");
                        } catch (rssError) {
                            console.warn("RSSからの取得に失敗したため、限定公開用のHTML解析を試行します。", rssError);
                            newVideos = await fetchWithHtmlScraping(playlistId);
                            usedScraping = true;
                        }
                    }

                    // APIキーなしのスクレイピング取得で上限の100件に達している場合、警告を出す
                    if (usedScraping && newVideos && newVideos.length === 100) {
                        setTimeout(() => showToast("APIキー未設定のため最新100件までしか取得できません。過去の全動画を取得するには高度な設定からAPIキーを入力してください。", true), 3500);
                    }

                    // 取得できたら、Firebaseの既存データとマージ（統合）して保存
                    if (newVideos && newVideos.length > 0) {
                        if (existingVideos && existingVideos.length > 0) {
                            // IDをキーにして重複を排除しつつ統合
                            const videoMap = new Map();
                            // まず既存データを入れる
                            existingVideos.forEach(v => videoMap.set(v.id, v));
                            // 新しいデータで上書き／追加する
                            newVideos.forEach(v => videoMap.set(v.id, v));
                            
                            // Mapから配列に戻して、新しい順（降順）にソート
                            videos = Array.from(videoMap.values());
                            videos.sort((a, b) => b.pubDate - a.pubDate);
                        } else {
                            videos = newVideos;
                        }
                        
                        // マージされたすべての動画リストをFirebaseに保存（蓄積）
                        await saveToFirebase(playlistId, videos);
                    } else if (!videos) {
                        // 新規取得に失敗したが既存データがある場合のフォールバック
                        videos = existingVideos; 
                    }
                }

                if (!videos || videos.length === 0) {
                    showToast("動画が見つかりませんでした。", true);
                    return;
                }

                // 現在再生中の動画IDを記録
                const currentVideoId = videoList[currentIndex]?.id;
                
                videoList = videos;
                let latestDateStr = "";
                if (videoList.length > 0) {
                    const shortDate = videoList[0].pubDate.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    latestDateStr = ` (最終更新日: ${shortDate})`;
                }
                document.getElementById('playlistInfo').textContent = `全 ${videoList.length} 件${latestDateStr}`;
                
                // リスト更新時の再生位置の調整
                let newIndex = videoList.findIndex(v => v.id === currentVideoId);
                
                if (!player) {
                    // 初回起動
                    currentIndex = 0;
                    initPlayer(); // プレイヤーの初期化（完了後自動で再生される）
                } else {
                    if (newIndex === -1 && !isAutoUpdate) {
                        // 手動取得で現在の動画が見つからなければ最初から
                        currentIndex = 0;
                        playCurrentVideo();
                    } else if (newIndex !== -1) {
                        // 現在の動画が存在すればインデックスを更新
                        currentIndex = newIndex;
                        renderPlaylist();
                    } else {
                        // 自動更新時に現在再生中の動画がリストから消えた場合（稀）
                        // 再生は止めず、インデックスだけ0にしておく
                        currentIndex = 0;
                        renderPlaylist();
                    }
                }

                if (!isAutoUpdate) showToast("動画リストを読み込みました！");
                
                // 自動更新タイマーのリセットと開始
                resetAutoUpdateTimer();

            } catch (e) {
                console.error(e);
                let errorMsg = e.message;
                // TypeError: Load failed 等ネットワーク系エラーのわかりやすい表示
                if (e.name === 'TypeError' && e.message === 'Load failed') {
                    errorMsg = "ネットワーク通信がブロックされました。APIキーの設定をお試しください。";
                }
                showToast("取得エラー: " + errorMsg, true);
            } finally {
                btn.innerHTML = originalBtnText;
                btn.disabled = false;
            }
        }

        // 方法1: RSSを利用して最新を取得（APIキー不要、最新15件程度）
        async function fetchWithRss(playlistId) {
            const rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
            
            // 複数のプロキシをフォールバックとして用意し、取得成功率を上げる
            const proxies = [
                `https://api.allorigins.win/raw?url=`,
                `https://api.codetabs.com/v1/proxy/?quest=`,
                `https://corsproxy.io/?`
            ];

            let xmlText = null;

            for (const proxy of proxies) {
                try {
                    const res = await fetch(proxy + encodeURIComponent(rssUrl));
                    if (!res.ok) continue;
                    xmlText = await res.text();
                    if (xmlText && xmlText.includes('<feed')) {
                        break; // 取得成功
                    }
                } catch (e) {
                    console.warn(`Proxy ${proxy} failed:`, e);
                }
            }

            if (!xmlText || !xmlText.includes('<feed')) {
                throw new Error("通信に失敗しました。プレイリストが非公開か、通信制限の可能性があります。");
            }

            // XMLの直接解析
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            
            const entries = xmlDoc.querySelectorAll("entry");
            if (entries.length === 0) {
                 return []; // 動画が0件
            }

            const items = Array.from(entries).map(entry => {
                const idNode = entry.querySelector("id");
                const idText = idNode ? idNode.textContent : "";
                const vid = idText.replace("yt:video:", "");
                
                const titleNode = entry.querySelector("title");
                const title = titleNode ? titleNode.textContent : "無題の動画";
                
                // 動画の正確な作成日（公開日）を取得
                const publishedNode = entry.querySelector("published");
                const pubDateText = publishedNode ? publishedNode.textContent : new Date().toISOString();
                
                // 概要（Description）を取得
                let description = "";
                const descNodes = entry.getElementsByTagNameNS("http://search.yahoo.com/mrss/", "description");
                if (descNodes && descNodes.length > 0) {
                    description = descNodes[0].textContent;
                } else {
                    const mediaDesc = entry.getElementsByTagName("media:description")[0];
                    if (mediaDesc) description = mediaDesc.textContent;
                }
                
                return {
                    id: vid,
                    title: title,
                    description: description,
                    thumbnail: `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`,
                    pubDate: new Date(pubDateText)
                };
            }).filter(item => isValidVideoId(item.id)); // 不正なIDを除外
            
            // 新しい順（降順）にソート
            items.sort((a, b) => b.pubDate - a.pubDate);
            return items;
        }

        // 方法3: HTMLスクレイピングを利用（限定公開プレイリスト等、RSSが取得できない場合の代替手段）
        async function fetchWithHtmlScraping(playlistId) {
            const url = `https://www.youtube.com/playlist?list=${playlistId}`;
            
            const proxies = [
                { url: `https://api.allorigins.win/get?url=`, type: 'json' },
                { url: `https://api.codetabs.com/v1/proxy/?quest=`, type: 'text' },
                { url: `https://corsproxy.io/?`, type: 'text' }
            ];
            
            let html = null;
            
            for (const proxy of proxies) {
                try {
                    const res = await fetch(proxy.url + encodeURIComponent(url));
                    if (!res.ok) continue;
                    
                    if (proxy.type === 'json') {
                        const data = await res.json();
                        html = data.contents;
                    } else {
                        html = await res.text();
                    }
                    
                    if (html && html.includes('ytInitialData')) break;
                } catch (e) {
                    console.warn(`Scraping proxy ${proxy.url} failed:`, e);
                }
            }
            
            if (!html) throw new Error("通信がブロックされました。ブラウザのセキュリティ設定を確認するか、APIキーを設定してください。");

            // ytInitialData (YouTubeの動画データJSON) を抽出
            let ytDataString = null;
            const match1 = html.match(/var ytInitialData = (\{.*?\});<\/script>/);
            const match2 = html.match(/window\["ytInitialData"\] = (\{.*?\});/);
            
            if (match1) ytDataString = match1[1];
            else if (match2) ytDataString = match2[1];
            
            if (!ytDataString) {
                throw new Error("解析不能。非公開設定になっているか、APIキーが必要です。");
            }
            
            const ytData = JSON.parse(ytDataString);
            let items = [];
            
            // より堅牢な再帰的検索（YouTubeのデータ構造変更に強い）
            function extractVideoItems(obj) {
                let found = [];
                if (!obj || typeof obj !== 'object') return found;
                if (Array.isArray(obj)) {
                    for (const item of obj) found.push(...extractVideoItems(item));
                } else {
                    if (obj.playlistVideoRenderer) {
                        found.push(obj);
                    } else {
                        for (const key in obj) found.push(...extractVideoItems(obj[key]));
                    }
                }
                return found;
            }
            
            try {
                items = extractVideoItems(ytData);
            } catch (e) {
                throw new Error("データ抽出中のエラーです。");
            }

            if (items.length === 0) {
                throw new Error("限定公開リスト内に動画が見つかりません。");
            }

            // 「1年前」「3 months ago」等のテキストから大まかな日付を推測する関数
            function estimateDateFromRelativeTime(relativeTimeText) {
                const now = new Date();
                const text = relativeTimeText || "";
                
                let match = text.match(/(\d+)\s*(年|ヶ月|箇月|週間|日|時間|分)\s*前/);
                if (!match) match = text.match(/(\d+)\s*(year|month|week|day|hour|minute)s?\s*ago/i);
                
                if (match) {
                    const num = parseInt(match[1], 10);
                    const unit = match[2].toLowerCase();
                    
                    if (unit.includes('年') || unit.includes('year')) now.setFullYear(now.getFullYear() - num);
                    else if (unit.includes('ヶ月') || unit.includes('箇月') || unit.includes('month')) now.setMonth(now.getMonth() - num);
                    else if (unit.includes('週間') || unit.includes('week')) now.setDate(now.getDate() - (num * 7));
                    else if (unit.includes('日') || unit.includes('day')) now.setDate(now.getDate() - num);
                    else if (unit.includes('時間') || unit.includes('hour')) now.setHours(now.getHours() - num);
                    else if (unit.includes('分') || unit.includes('minute')) now.setMinutes(now.getMinutes() - num);
                    
                    return now;
                }
                return null;
            }
            
            let videos = [];
            
            items.forEach((item, index) => {
                const vidRenderer = item.playlistVideoRenderer;
                // 有効な動画IDが存在し、再生不能な動画でないものを抽出
                if (vidRenderer && isValidVideoId(vidRenderer.videoId) && vidRenderer.isPlayable !== false) {
                    
                    // 限定公開のHTMLには正確なタイムスタンプが無いため、相対時間テキストを取得する
                    let relativeTimeText = "";
                    if (vidRenderer.videoInfo && vidRenderer.videoInfo.runs) {
                        const timeRun = vidRenderer.videoInfo.runs.find(r => r.text && (r.text.includes('前') || r.text.includes('ago')));
                        if (timeRun) relativeTimeText = timeRun.text;
                    }

                    // テキストから日付を推測（逆算）
                    let pubDate = estimateDateFromRelativeTime(relativeTimeText);
                    
                    if (pubDate) {
                        // 同じ「1年前」でも、元の並び順が上のものを少し新しくするための微小な調整
                        pubDate = new Date(pubDate.getTime() - (index * 1000));
                    } else {
                        // 全く取れなかった場合は現在時刻からのダミー
                        pubDate = new Date(Date.now() - (index * 100000));
                    }

                    videos.push({
                        id: vidRenderer.videoId,
                        title: vidRenderer.title?.runs?.[0]?.text || "無題の動画",
                        description: relativeTimeText ? `※APIキー未設定の限定公開取得ルートを通ったため、詳細な概要は取得できません。\n（動画一覧に表示されていた公開時期: ${relativeTimeText}）` : "", 
                        thumbnail: `https://i.ytimg.com/vi/${vidRenderer.videoId}/mqdefault.jpg`,
                        pubDate: pubDate,
                        isEstimated: true // 推測値であることをマーク
                    });
                }
            });
            
            // 新しい順（降順）にソート
            videos.sort((a, b) => b.pubDate - a.pubDate);
            return videos;
        }

        // 方法2: YouTube Data API v3 を利用（APIキー必要、ページネーションで全件取得）
        async function fetchWithApi(playlistId, apiKey) {
            let videos = [];
            let nextPageToken = '';
            const maxResults = 50; 
            
            while (true) {
                // partパラメータに contentDetails を追加し、動画の元の公開日を取得できるようにする
                const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=${maxResults}&playlistId=${playlistId}&key=${apiKey}&pageToken=${nextPageToken}`;
                const res = await fetch(url);
                if (!res.ok) {
                    const err = await res.json();
                    const msg = err.error?.message || "APIリクエストエラー";
                    
                    // 制限や無効化に関する具体的なエラーハンドリング
                    if (msg.includes("blocked") || msg.includes("not enabled")) {
                        throw new Error("【設定エラー】GCPプロジェクトで「YouTube Data API v3」が有効になっていないか、APIキーに厳しい制限（HTTPリファラー等）がかかっています。GCPコンソールをご確認ください");
                    }
                    throw new Error(`APIエラー: ${msg}`);
                }
                const data = await res.json();
                
                data.items.forEach(item => {
                    // snippet.publishedAt(リスト追加日)ではなく、contentDetails.videoPublishedAt(動画公開日)を使用する
                    const publishedAt = item.contentDetails?.videoPublishedAt || item.snippet.publishedAt;
                    
                    videos.push({
                        id: item.snippet.resourceId.videoId,
                        title: item.snippet.title,
                        description: item.snippet.description, // APIから概要を取得
                        thumbnail: item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url,
                        pubDate: new Date(publishedAt)
                    });
                });
                
                nextPageToken = data.nextPageToken;
                if (!nextPageToken) break;
            }
            
            // プライベート動画や削除済み動画を除外
            videos = videos.filter(v => 
                v.title !== 'Private video' && 
                v.title !== 'Deleted video' && 
                v.thumbnail &&
                isValidVideoId(v.id) // 不正なIDを除外
            );
            
            // 新しい順（降順）にソート
            videos.sort((a, b) => b.pubDate - a.pubDate);
            return videos;
        }

        // --- UIレンダリング ---
        function renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';
            
            // 同義語を正規化するヘルパー関数（略称を正式名称に統一して検索しやすくする）
            const normalizeText = (text) => {
                if (!text) return "";
                return text.toLowerCase()
                    .replace(/経産省/g, "経済産業省")
                    .replace(/国交省/g, "国土交通省")
                    .replace(/文科省/g, "文部科学省")
                    .replace(/厚労省/g, "厚生労働省")
                    .replace(/農水省/g, "農林水産省");
            };
            
            const rawQuery = document.getElementById('searchInput')?.value || '';
            const queryStr = normalizeText(rawQuery).trim();
            // 全角・半角スペースで分割し、空の文字列を除外した配列を作成
            const queries = queryStr ? queryStr.split(/[\s　]+/).filter(q => q.length > 0) : [];
            let displayedCount = 0;
            
            if (videoList.length === 0) {
                container.innerHTML = '<div class="p-6 text-center text-gray-400 text-sm">動画がありません</div>';
                return;
            }

            videoList.forEach((video, index) => {
                // 検索クエリがある場合、AND検索（すべての単語が含まれているか）を実行
                if (queries.length > 0) {
                    const titleLower = normalizeText(video.title);
                    const descLower = normalizeText(video.description);
                    
                    const isMatch = queries.every(q => titleLower.includes(q) || descLower.includes(q));
                    
                    if (!isMatch) return;
                }
                
                displayedCount++;

                const isActive = index === currentIndex;
                const item = document.createElement('div');
                item.className = `flex items-start gap-3 p-3 border-b border-gray-100 cursor-pointer hover:bg-red-50 transition-colors ${isActive ? 'active-video' : ''}`;
                
                item.onclick = () => {
                    currentIndex = index;
                    playCurrentVideo();
                };
                
                const imgContainer = document.createElement('div');
                imgContainer.className = 'relative shrink-0 w-28 h-16 bg-black rounded overflow-hidden';
                
                const img = document.createElement('img');
                img.src = video.thumbnail;
                img.className = 'w-full h-full object-cover opacity-90';
                
                if (isActive) {
                    const overlay = document.createElement('div');
                    overlay.className = 'absolute inset-0 bg-black/40 flex items-center justify-center';
                    overlay.innerHTML = '<i class="fas fa-play text-white text-sm"></i>';
                    imgContainer.appendChild(img);
                    imgContainer.appendChild(overlay);
                } else {
                    imgContainer.appendChild(img);
                }
                
                const textContainer = document.createElement('div');
                textContainer.className = 'flex flex-col overflow-hidden justify-center h-full';
                
                const title = document.createElement('span');
                title.className = `text-sm font-medium line-clamp-2 leading-tight ${isActive ? 'text-red-700 font-bold' : 'text-gray-800'}`;
                title.textContent = video.title;
                
                const date = document.createElement('span');
                date.className = 'text-xs text-gray-500 mt-1';
                // 日付のフォーマット
                const shortDate = video.pubDate.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                date.textContent = video.isEstimated ? `約 ${shortDate}` : shortDate;
                
                textContainer.appendChild(title);
                textContainer.appendChild(date);
                
                item.appendChild(imgContainer);
                item.appendChild(textContainer);
                container.appendChild(item);
            });
            
            // 検索結果が0件の場合のメッセージ
            if (displayedCount === 0) {
                container.innerHTML = '<div class="p-6 text-center text-gray-400 text-sm">一致する動画が見つかりませんでした</div>';
            }
            
            // 件数表示の更新
            const infoEl = document.getElementById('playlistInfo');
            if (infoEl) {
                let latestDateStr = "";
                if (videoList.length > 0) {
                    const shortDate = videoList[0].pubDate.toLocaleDateString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    latestDateStr = ` (最終更新日: ${shortDate})`;
                }

                if (queries.length > 0) {
                    infoEl.textContent = `検索結果: ${displayedCount} 件 / 全 ${videoList.length} 件${latestDateStr}`;
                } else {
                    infoEl.textContent = `全 ${videoList.length} 件${latestDateStr}`;
                }
            }
            
            // 再生中のアイテムへ自動スクロール (検索絞り込み中でない場合のみ)
            if (queries.length === 0) {
                setTimeout(() => {
                    const activeItem = container.querySelector('.active-video');
                    if (activeItem) {
                        activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }, 100);
            }
        }

        // --- 自動更新ロジック ---
        function resetAutoUpdateTimer() {
            if (updateIntervalId) clearInterval(updateIntervalId);
            if (countdownIntervalId) clearInterval(countdownIntervalId);
            
            const intervalMinutes = parseInt(document.getElementById('updateInterval').value, 10) || 60;
            if (intervalMinutes < 1) return; // 0以下の場合は自動更新しない
            
            const intervalMs = intervalMinutes * 60 * 1000;
            nextUpdateTime = Date.now() + intervalMs;
            
            updateIntervalId = setInterval(() => {
                console.log("バックグラウンド更新を実行します...");
                // 自動更新時はYouTubeから強制再取得してFirebaseを上書きする
                fetchPlaylistData(true, true);
            }, intervalMs);

            // カウントダウン表示の更新
            updateCountdownDisplay();
            countdownIntervalId = setInterval(updateCountdownDisplay, 60000); // 1分ごとに更新
        }

        function updateCountdownDisplay() {
            const infoEl = document.getElementById('nextUpdateInfo');
            if (!nextUpdateTime) {
                infoEl.textContent = "";
                return;
            }
            
            const diffMs = nextUpdateTime - Date.now();
            if (diffMs <= 0) {
                infoEl.textContent = "更新中...";
                return;
            }
            const diffMinutes = Math.ceil(diffMs / 60000);
            infoEl.textContent = `次回更新まで 約 ${diffMinutes} 分`;
        }

        // --- ユーティリティ ---
        function showToast(message, isError = false) {
            // 既存のトーストを削除
            const existing = document.getElementById('toast-msg');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-msg';
            toast.className = `fixed bottom-4 right-4 md:bottom-8 md:right-8 px-6 py-3 rounded shadow-lg text-white font-medium z-50 transform transition-all duration-300 translate-y-0 opacity-100 ${isError ? 'bg-red-600' : 'bg-gray-800'}`;
            toast.innerHTML = isError ? `<i class="fas fa-exclamation-circle mr-2"></i>${message}` : `<i class="fas fa-info-circle mr-2"></i>${message}`;
            
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- 初期化 ---
        document.addEventListener('DOMContentLoaded', async () => {
            // 保存された設定の復元
            const savedSelect = localStorage.getItem('yt_auto_playlist_select');
            const savedApiKey = localStorage.getItem('yt_auto_api_key');
            
            if (savedSelect) {
                const radio = document.querySelector(`input[name="playlistSelect"][value="${savedSelect}"]`);
                if (radio) radio.checked = true;
            }
            if (savedApiKey) document.getElementById('apiKey').value = savedApiKey;
            
            // イベントリスナー (false: 手動表示更新, true: YouTube強制取得)
            // ※ボタンを押した時はFirebaseの既存データではなく、必ずYouTubeから再取得するように修正
            document.getElementById('startBtn').addEventListener('click', () => fetchPlaylistData(false, true));
            // 🔄更新ボタンは、強制的にYouTubeから再取得させる
            document.getElementById('refreshBtn').addEventListener('click', () => fetchPlaylistData(false, true));
            
            // 選択を変更した際に自動で取得を開始する
            document.querySelectorAll('input[name="playlistSelect"]').forEach(radio => {
                radio.addEventListener('change', () => fetchPlaylistData(false, false));
            });
            
            document.getElementById('updateInterval').addEventListener('change', () => {
                if(videoList.length > 0) resetAutoUpdateTimer();
            });

            // 検索ボックスのイベントリスナー追加
            const searchInput = document.getElementById('searchInput');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            searchInput.addEventListener('input', () => {
                if (searchInput.value.trim() !== '') {
                    clearSearchBtn.classList.remove('hidden');
                } else {
                    clearSearchBtn.classList.add('hidden');
                }
                renderPlaylist(); // 入力するたびにリストを再描画（フィルタリング）
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderPlaylist(); // クリアしてリスト全体を再描画
            });

            // === ページ読み込み時にFirebaseから自動でリストを呼び出す ===
            await initAuth();
            user = auth.currentUser;
            fetchPlaylistData(false, false);
        });
    </script>
