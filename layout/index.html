  <!-- エラー検知用スクリプト -->
  <script>
    window.addEventListener('error', function(event) {
      var root = document.getElementById('root');
      if (root && root.innerHTML.includes('アプリケーションを読み込んでいます')) {
        root.innerHTML = '<div style="padding: 20px; color: #b91c1c; background: #fef2f2; height: 100vh;">' +
                         '<h2 style="font-weight: bold; margin-bottom: 10px;">致命的なエラー</h2>' +
                         '<p>' + (event.message || '起動中にエラーが発生しました') + '</p>' +
                         '</div>';
      }
    });
    window.addEventListener('load', function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.innerHTML.includes('アプリケーションを読み込んでいます')) {
          root.innerHTML = '<div style="padding: 20px; color: #b91c1c; background: #fef2f2; height: 100vh;">' +
                           '<h2 style="font-weight: bold; margin-bottom: 10px;">初期化タイムアウト</h2>' +
                           '<p>コンパイル処理が完了しませんでした。ネットワーク環境やブラウザのセキュリティ設定をご確認ください。</p>' +
                           '</div>';
        }
      }, 5000);
    });
  </script>

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: '2rem', color: '#b91c1c', backgroundColor: '#fef2f2', minHeight: '100vh' }}>
              <h2 style={{ fontSize: '1.5rem', fontWeight: 'bold', margin: '0 0 1rem 0' }}>レンダリングエラーが発生しました</h2>
              <p style={{ fontFamily: 'monospace' }}>{this.state.error && this.state.error.toString()}</p>
            </div>
          );
        }
        return this.props.children;
      }
    }

## 1. はじめに
本資料は、社内業務効率化のための次世代AIアシスタント導入に関する提案をまとめたものです。
日々の定型業務を自動化し、より創造的な業務に時間を割くことを目的としています。

---

## 2. 現状の課題
現在の業務フローには以下の課題が存在します。

- 議事録作成に膨大な時間がかかっている
- 情報の検索性が低く、過去のデータ活用が不十分
- 部署間の情報共有にタイムラグが発生している

---

## 3. 解決策
AIアシスタントを導入することで、これらの課題を以下のよう解決します。

1. **自動文字起こし・要約機能**による議事録作成のゼロ化
2. **社内データ連携検索**によるナレッジ共有の迅速化
3. **チャットボット連携**による24時間体制の社内ヘルプデスク

---

- 業務時間の **20% 削減**
- 社内問い合わせ対応コストの半減
- 社員エンゲージメントの向上

ご検討のほど、よろしくお願いいたします。`;

        return defaultValue;

          border: 'border-cyan-400', borderRev: 'border-slate-900',
          lightBg: 'bg-slate-50 text-slate-900', lightBgRev: 'bg-cyan-50 text-cyan-900',
          preview: 'border-gray-500', isTwoTone: true, color1: '#0f172a', color2: '#22d3ee', hex: '#22d3ee', hexRev: '#0f172a' 
        },
        purple_yellow: {

          grad: 'bg-gradient-to-br from-purple-900 to-indigo-900 text-yellow-400', gradRev: 'bg-gradient-to-br from-yellow-400 to-amber-400 text-purple-900',
          border: 'border-yellow-400', borderRev: 'border-purple-900',
          lightBg: 'bg-purple-50 text-purple-900', lightBgRev: 'bg-yellow-50 text-yellow-900',
          preview: 'border-gray-400', isTwoTone: true, color1: '#581c87', color2: '#facc15', hex: '#facc15', hexRev: '#581c87'

        brown_beige: {

          border: 'border-orange-200', borderRev: 'border-amber-900',

        }
      };

      const getSlideClasses = (layout, color) => {
        const c = slideColors[color] || slideColors.blue;
        const l = slideLayouts[layout] || slideLayouts.solid;
        const rev = isSlideReversed && c.isTwoTone;

        switch(l.type) {
          case 'solid': return rev ? c.solidRev : c.solid;
          case 'gradient': return rev ? c.gradRev : c.grad;
          case 'accent': return 'bg-white text-gray-800';
          case 'header': return 'bg-white text-gray-800 pt-16'; 
          case 'minimal': return rev ? c.lightBgRev : c.lightBg;
          case 'card': return rev ? c.lightBgRev : c.lightBg; 
          default: return rev ? c.solidRev : c.solid;
        }
      };

      const renderSlideDecoration = (layout, color) => {
        const c = slideColors[color] || slideColors.blue;
        const l = slideLayouts[layout] || slideLayouts.solid;
        const rev = isSlideReversed && c.isTwoTone;
        const solidClass = rev ? (c.solidRev || '') : (c.solid || '');
        const borderClass = rev ? (c.borderRev || '') : (c.border || '');
        
        if (l.type === 'accent') {
          return <div className={`absolute left-0 top-0 bottom-0 w-4 border-l-[16px] ${borderClass}`}></div>;
        }
        if (l.type === 'minimal') {
           const bgClass = (solidClass.split(' ')[0]) || ''; 
           return <div className={`absolute top-0 left-0 right-0 h-2 ${bgClass}`}></div>;
        }
        if (l.type === 'header') {
           const bgClass = (solidClass.split(' ')[0]) || ''; 
           return <div className={`absolute top-0 left-0 right-0 h-16 ${bgClass} shadow-md`}></div>;
        }
        return null;
      };

      const getProcessedReportText = (sourceText) => {
        if (!sourceText) return '';
        if (slideBreakMode === 'none') return sourceText;
        const manualPages = sourceText.split(/^(?:===|---|ーーー|—-|——)$/gm);
        
        if (['hr', 'hr_jp', 'hr_dash', 'hr_eq'].includes(slideBreakMode)) {
          return manualPages.join('\n\n===\n\n');
        }

        const finalPages = [];
        
        manualPages.forEach(manualPage => {
          const lines = manualPage.split('\n');
          let currentPage = [];

          lines.forEach(line => {
            let isBreak = false;
            if (slideBreakMode === 'h1' && line.startsWith('# ')) isBreak = true;
            if (slideBreakMode === 'h2' && line.startsWith('## ')) isBreak = true;
            if (slideBreakMode === 'list' && (line.startsWith('- ') || /^\d+\.\s/.test(line))) isBreak = true;

            if (isBreak && currentPage.filter(l => l.trim() !== '').length > 0) {
              finalPages.push(currentPage.join('\n'));
              currentPage = [line];
            } else {
              currentPage.push(line);
            }
          });
          
          finalPages.push(currentPage.join('\n'));
        });

        return finalPages.join('\n\n===\n\n');
      };

      const getSlides = (sourceText) => {
        if (mode !== 'slides') return [];
        if (!sourceText) return [];
        if (slideBreakMode === 'none') return [sourceText];

        const manualSlides = sourceText.split(/^(?:===|---|ーーー|—-|——)$/gm).map(s => s.trim()).filter(s => s !== '');
        
        if (['hr', 'hr_jp', 'hr_dash', 'hr_eq'].includes(slideBreakMode)) {
          return manualSlides;
        }

        const finalSlides = [];
        
        manualSlides.forEach(manualSlide => {
          const lines = manualSlide.split('\n');
          let currentSlide = [];

          lines.forEach(line => {
            let isBreak = false;
            if (slideBreakMode === 'h1' && line.startsWith('# ')) isBreak = true;
            if (slideBreakMode === 'h2' && line.startsWith('## ')) isBreak = true;
            if (slideBreakMode === 'list' && (line.startsWith('- ') || /^\d+\.\s/.test(line))) isBreak = true;

            if (isBreak && currentSlide.length > 0) {
              finalSlides.push(currentSlide.join('\n'));
              currentSlide = [line];
            } else {
              currentSlide.push(line);
            }
          });
          
          if (currentSlide.length > 0) {
            finalSlides.push(currentSlide.join('\n'));
          }
        });

        if (finalSlides.length === 0 && sourceText.trim()) {
          finalSlides.push(sourceText);
        }

        return finalSlides;
      };

      const parseMarkdown = (markdown, isSlide = false, forExport = false, currentLogoText = '', currentBreakMode = 'hr') => {
        if (!markdown) return '';
        let html = String(markdown);

        const safeLogoText = String(currentLogoText || '');
        const escapedLogo = safeLogoText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const logoHtml = escapedLogo ? `<div class="doc-logo" style="text-align: right; font-size: 0.75rem; opacity: 0.6; margin-top: 2rem; padding-bottom: 0.5rem; font-family: inherit;">${escapedLogo}</div>` : '';

        if (forExport) {
          html = html
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
            .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/gim, '<em>$1</em>');
            
          if (currentBreakMode !== 'none') {
            html = html.replace(/^(?:===|---|ーーー|—-|——)$/gim, `${logoHtml}<div class="page-break" style="page-break-before: always; break-before: page; clear: both; height: 0; margin: 0; padding: 0;"></div>`);
          } else {
            html = html.replace(/^(?:===|---|ーーー|—-|——)$/gim, '<hr />');
          }

          html = html.replace(/^- (.*$)/gim, '<li>$1</li>');
          html = html.replace(/^\d+\. (.*$)/gim, '<li class="decimal">$1</li>');
          html = html.replace(/(<li>.*<\/li>\n?)+/g, match => `<ul>${match}</ul>`);
          html = html.replace(/(<li class="decimal">.*<\/li>\n?)+/g, match => `<ol>${match.replace(/class="decimal"/g, '')}</ol>`);

          const lines = html.split('\n');
          const parsedLines = lines.map(line => {
            const trimmed = line.trim();
            if (!trimmed || /^(<h|<ul|<ol|<li|<blockquote|<hr|<div)/.test(trimmed)) return line;
            return `<p>${line}</p>`;
          });
          let parsedText = parsedLines.join('\n');
          
          if (!isSlide && safeLogoText && currentBreakMode === 'none') {
              parsedText += `\n${logoHtml}`;
          }
          return parsedText;
        }

        const breakHtml = `${logoHtml}<div class="html2pdf__page-break page-break" style="page-break-before: always; break-before: page; clear: both; width: 100%;"><div data-html2canvas-ignore="true" style="display: flex; align-items: center; justify-content: center; margin: 3rem 0;"><hr style="flex-grow: 1; border-top: 2px dashed currentColor; opacity: 0.3; margin: 0;"><span style="padding: 0 1rem; opacity: 0.5; font-size: 0.85rem; font-family: monospace;">Page Break</span><hr style="flex-grow: 1; border-top: 2px dashed currentColor; opacity: 0.3; margin: 0;"></div></div>`;

        html = html
          .replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold mt-6 mb-2 text-current opacity-90">$1</h3>')
          .replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-8 mb-4 border-b border-current/20 pb-2">$1</h2>')
          .replace(/^# (.*$)/gim, '<h1 class="text-4xl font-extrabold mt-4 mb-6 tracking-tight">$1</h1>')
          .replace(/^\> (.*$)/gim, '<blockquote class="border-l-4 border-current/50 pl-4 py-2 italic my-6 opacity-80">$1</blockquote>')
          .replace(/\*\*(.*?)\*\*/gim, '<strong class="font-bold opacity-100">$1</strong>')
          .replace(/\*(.*?)\*/gim, '<em class="italic">$1</em>');

        if (currentBreakMode !== 'none') {
          html = html.replace(/^(?:===|---|ーーー|—-|——)$/gim, breakHtml);
        } else {
          html = html.replace(/^(?:===|---|ーーー|—-|——)$/gim, '<hr class="my-6 border-t border-current/20" />');
        }

        html = html.replace(/^- (.*$)/gim, '<li class="ml-6 list-disc my-1">$1</li>');
        html = html.replace(/^\d+\. (.*$)/gim, '<li class="ml-6 list-decimal my-1">$1</li>');
        html = html.replace(/(<li class="[^"]*list-disc[^"]*">.*<\/li>\n?)+/g, match => `<ul class="my-4 space-y-2">${match}</ul>`);
        html = html.replace(/(<li class="[^"]*list-decimal[^"]*">.*<\/li>\n?)+/g, match => `<ol class="my-4 space-y-2">${match}</ol>`);

        const lines = html.split('\n');
        const parsedLines = lines.map(line => {
          const trimmed = line.trim();
          if (!trimmed || /^(<h|<ul|<ol|<li|<blockquote|<hr|<div)/.test(trimmed)) return line;
          return `<p class="my-3 leading-relaxed ${isSlide ? 'text-lg md:text-xl' : 'text-base'}">${line}</p>`;
        });

        let parsedText = parsedLines.join('\n');
        if (!isSlide && safeLogoText && currentBreakMode === 'none') {
            parsedText += `\n${logoHtml}`;
        }
        return parsedText;
      };

      const getThemeValues = () => {

          else if (slideColor === 'purple_yellow') { bgColorHex = "581c87"; textColorHex = "facc15"; }
          else if (slideColor === 'brown_beige') { bgColorHex = "78350f"; textColorHex = "ffedd5"; }
          else { bgColorHex = "f9fafb"; textColorHex = "111827"; }

          if (l.type === 'minimal' || l.type === 'accent' || l.type === 'header' || l.type === 'card') {
            if (slideColor === 'blue') { bgColorHex = "eff6ff"; textColorHex = "1e3a8a"; }
            else if (slideColor === 'purple') { bgColorHex = "faf5ff"; textColorHex = "581c87"; }
            else if (slideColor === 'rose') { bgColorHex = "fff1f2"; textColorHex = "881337"; }
            else if (slideColor === 'orange') { bgColorHex = "fff7ed"; textColorHex = "7c2d12"; }
            else if (slideColor === 'emerald') { bgColorHex = "ecfdf5"; textColorHex = "064e3b"; }
            else if (slideColor === 'teal') { bgColorHex = "f0fdfa"; textColorHex = "134e4a"; }
            else if (slideColor === 'dark') { bgColorHex = "f1f5f9"; textColorHex = "0f172a"; }
            else if (slideColor === 'navy_yellow') { bgColorHex = "f8fafc"; textColorHex = "0f172a"; }
            else if (slideColor === 'black_green') { bgColorHex = "f3f4f6"; textColorHex = "000000"; }
            else if (slideColor === 'white_crimson') { bgColorHex = "ffffff"; textColorHex = "be123c"; }
            else if (slideColor === 'dark_cyan') { bgColorHex = "f8fafc"; textColorHex = "0f172a"; }
            else if (slideColor === 'purple_yellow') { bgColorHex = "faf5ff"; textColorHex = "581c87"; }
            else if (slideColor === 'brown_beige') { bgColorHex = "fff7ed"; textColorHex = "78350f"; }
            else { bgColorHex = "ffffff"; textColorHex = "111827"; }

            if (isSlideReversed && slideColors[slideColor]?.isTwoTone) {
              if (slideColor === 'navy_yellow') { bgColorHex = "fefce8"; textColorHex = "713f12"; } 
              else if (slideColor === 'black_green') { bgColorHex = "f0fdf4"; textColorHex = "14532d"; }

              else if (slideColor === 'dark_cyan') { bgColorHex = "ecfeff"; textColorHex = "164e63"; } 
              else if (slideColor === 'purple_yellow') { bgColorHex = "fefce8"; textColorHex = "713f12"; } 
              else if (slideColor === 'brown_beige') { bgColorHex = "ffedd5"; textColorHex = "78350f"; } 
            }
          } else {
            if (isSlideReversed && slideColors[slideColor]?.isTwoTone) {
               const temp = bgColorHex;
               bgColorHex = textColorHex;
               textColorHex = temp;
            }

        }

        return { fontFamily, docFontFamily, bgColorHex, textColorHex };
      };

      const handleDownloadPDF = async () => {

          const container = document.createElement('div');

              let slideBgColor = exportBgColor;

            }).join('');

            plainHTML = pages.map((pageContent, index) => {

              html2canvas: { scale: 2, useCORS: true, windowWidth: 794 },
              jsPDF: { unit: 'px', format: [794, 1122], orientation: 'portrait' },
              pagebreak: { mode: 'css', avoid: ['.pdf-report'] }

          }

          // PDF化するターゲット要素の"内側"にスタイルを含めることで、確実にCSSを適用させる
          const pdfContent = `

      const handleExportWord = async () => {
        if (!window.docx) {
          alert("Word生成ライブラリを読み込み中です。少し待ってから再度お試しください。");
          return;
        }
        setIsExporting(true);

        try {
          const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Footer } = window.docx;
          const { docFontFamily, bgColorHex, textColorHex } = getThemeValues();
          const docColor = textColorHex;

          const parseInlineText = (textStr) => {
            const parts = textStr.split(/(\*\*.*?\*\*|\*.*?\*)/g);
            return parts.map(part => {
              if (part.startsWith('**') && part.endsWith('**')) {
                return new TextRun({ text: part.slice(2, -2), bold: true, color: docColor });
              } else if (part.startsWith('*') && part.endsWith('*')) {
                return new TextRun({ text: part.slice(1, -1), italics: true, color: docColor });
              } else {
                return new TextRun({ text: part, color: docColor });
              }
            }).filter(run => run.text !== "");
          };

          const children = [];

          if (mode === 'slides') {
            const slidesTextArray = getSlides(activeText);
            slidesTextArray.forEach((slideText, idx) => {
              if (idx > 0) {
                children.push(new Paragraph({ pageBreakBefore: true }));
              }
              const lines = slideText.split('\n');
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) {
                  children.push(new Paragraph({ text: "" }));
                  continue;
                }
                if (line === '---' || line === '===' || line === 'ーーー' || line === '—-' || line === '——') {
                  if (slideBreakMode === 'none') {
                    children.push(new Paragraph({ text: "---", alignment: AlignmentType.CENTER }));
                  }
                  continue; 
                }

                if (line.startsWith('# ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(2)), heading: HeadingLevel.HEADING_1 }));
                } else if (line.startsWith('## ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(3)), heading: HeadingLevel.HEADING_2 }));
                } else if (line.startsWith('### ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(4)), heading: HeadingLevel.HEADING_3 }));
                } else if (line.startsWith('- ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(2)), bullet: { level: 0 } }));
                } else if (/^\d+\.\s/.test(line)) {
                  children.push(new Paragraph({ children: parseInlineText(line), indent: { left: 720 } }));
                } else if (line.startsWith('> ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(2)), indent: { left: 720 } }));
                } else {
                  children.push(new Paragraph({ children: parseInlineText(line) }));
                }
              }
            });
          } else {
            const processedReportText = getProcessedReportText(activeText);
            const lines = processedReportText.split('\n');
            for (let i = 0; i < lines.length; i++) {
              const line = lines[i].trim();
              if (!line) {
                children.push(new Paragraph({ text: "" }));
                continue;
              }

              if (line === '===' || line === '---' || line === 'ーーー' || line === '—-' || line === '——') {
                if (slideBreakMode !== 'none') {
                  children.push(new Paragraph({ pageBreakBefore: true }));
                } else {
                  children.push(new Paragraph({ text: "---", alignment: AlignmentType.CENTER }));
                }
                continue;
              }

              if (line.startsWith('# ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(2)), heading: HeadingLevel.HEADING_1 }));
              } else if (line.startsWith('## ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(3)), heading: HeadingLevel.HEADING_2 }));
              } else if (line.startsWith('### ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(4)), heading: HeadingLevel.HEADING_3 }));
              } else if (line.startsWith('- ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(2)), bullet: { level: 0 } }));
              } else if (/^\d+\.\s/.test(line)) {
                children.push(new Paragraph({ children: parseInlineText(line), indent: { left: 720 } }));
              } else if (line.startsWith('> ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(2)), indent: { left: 720 } }));
              } else {
                children.push(new Paragraph({ children: parseInlineText(line) }));
              }
            }
          }

          const doc = new Document({
            creator: "DocCraft",
            background: { color: bgColorHex },
            styles: {
              default: {
                document: {
                  run: { font: docFontFamily, color: docColor },
                  paragraph: { spacing: { line: 360, after: 120 } },
                },
                heading1: { run: { size: 48, bold: true }, paragraph: { spacing: { before: 400, after: 200 } } },
                heading2: { run: { size: 36, bold: true }, paragraph: { spacing: { before: 300, after: 100 } } },
                heading3: { run: { size: 28, bold: true }, paragraph: { spacing: { before: 200, after: 100 } } },
              }
            },
            sections: [{ 
              properties: { 
                page: {
                  size: mode === 'slides' 
                    ? { orientation: "landscape", width: 16838, height: 11906 } 
                    : { orientation: "portrait", width: 11906, height: 16838 }
                }
              },
              footers: (logoText && Footer) ? {
                default: new Footer({
                  children: [
                    new Paragraph({
                      children: [new TextRun({ text: logoText, color: docColor })],
                      alignment: AlignmentType.RIGHT,
                    }),
                  ],
                }),
              } : undefined,
              children: children 
            }],
          });

          const blob = await Packer.toBlob(doc);
          const url = URL.createObjectURL(blob);
          const fileDownload = document.createElement("a");
          document.body.appendChild(fileDownload);
          fileDownload.href = url;
          fileDownload.download = `document_${Date.now()}.docx`;
          fileDownload.target = "_blank";
          fileDownload.rel = "noopener noreferrer";
          fileDownload.click();
          document.body.removeChild(fileDownload);
          setTimeout(() => URL.revokeObjectURL(url), 1000);

        } catch (error) {
          console.error("Word Export Error:", error);
          alert("Wordの生成中にエラーが発生しました。");
        } finally {
          setIsExporting(false);
        }
      };

      const handleExportPPTX = async () => {
        if (!window.PptxGenJS) {
          alert("PowerPoint生成ライブラリを読み込み中です。少し待ってから再度お試しください。");
          return;
        }
        setIsExporting(true);

        try {
          const pres = new window.PptxGenJS();
          pres.layout = 'LAYOUT_16x9';

          const { docFontFamily, bgColorHex, textColorHex } = getThemeValues();
          const l = slideLayouts[slideLayout] || slideLayouts.solid;
          const currentSlideColor = slideColors[slideColor] || slideColors.blue;
          const mainHexColor = (isSlideReversed && currentSlideColor.isTwoTone) ? currentSlideColor.hexRev.replace('#', '') : currentSlideColor.hex.replace('#', '');

          const rawSlides = getSlides(activeText);
          
          for (let s = 0; s < rawSlides.length; s++) {
            const slideText = rawSlides[s].trim();
            const slide = pres.addSlide();
            
            slide.background = { color: bgColorHex };

            let textX = '5%', textY = '10%', textW = '90%', textH = '80%'; 
            let isCardText = false;

            if (l.type === 'accent') {
              slide.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: '3%', h: '100%', fill: { color: mainHexColor } });
              textX = '8%'; textW = '87%';
            } else if (l.type === 'header') {
              slide.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: '100%', h: '12%', fill: { color: mainHexColor } });
              textY = '18%'; textH = '72%';
            } else if (l.type === 'minimal') {
              slide.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: '100%', h: '2%', fill: { color: mainHexColor } });
            } else if (l.type === 'card') {
              slide.addShape(pres.ShapeType.rect, { 
                x: '5%', y: '5%', w: '90%', h: '90%', 
                fill: { color: 'ffffff' }
              });
              textX = '10%'; textY = '10%'; textW = '80%'; textH = '80%';
              isCardText = true;
            }

            const slideTextColor = isCardText ? '1f2937' : textColorHex;

            const textRuns = [];
            const lines = slideText.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
              let line = lines[i].trim();
              if (!line) {
                 textRuns.push({ text: " ", options: { breakLine: true, fontSize: 18 } });
                 continue;
              }
              if (line === '---' || line === '===' || line === 'ーーー' || line === '—-' || line === '——') {
                 if (slideBreakMode !== 'none') continue; 
                 line = '---';
              }

              let baseOptions = { color: slideTextColor, fontFace: docFontFamily };
              
              if (line.startsWith('# ')) {
                line = line.slice(2);
                baseOptions.fontSize = 36;
                baseOptions.bold = true;
              } else if (line.startsWith('## ')) {
                line = line.slice(3);
                baseOptions.fontSize = 28;
                baseOptions.bold = true;
              } else if (line.startsWith('### ')) {
                line = line.slice(4);
                baseOptions.fontSize = 22;
                baseOptions.bold = true;
              } else if (line.startsWith('- ')) {
                line = line.slice(2);
                baseOptions.fontSize = 18;
                baseOptions.bullet = true;
              } else if (/^\d+\.\s/.test(line)) {
                line = line.replace(/^\d+\.\s/, '');
                baseOptions.fontSize = 18;
                baseOptions.bullet = { type: 'number' };
              } else if (line.startsWith('> ')) {
                line = line.slice(2);
                baseOptions.fontSize = 18;
                baseOptions.italic = true;
              } else {
                baseOptions.fontSize = 18;
              }

              const parts = line.split(/(\*\*.*?\*\*|\*.*?\*)/g);
              const lineRuns = [];
              for (let j = 0; j < parts.length; j++) {
                const part = parts[j];
                if (!part) continue;

                let opts = { ...baseOptions };
                let txt = part;

                if (txt.startsWith('**') && txt.endsWith('**')) {
                  txt = txt.slice(2, -2);
                  opts.bold = true;
                } else if (txt.startsWith('*') && txt.endsWith('*')) {
                  txt = txt.slice(1, -1);
                  opts.italic = true;
                }

                if (lineRuns.length > 0) delete opts.bullet;

                lineRuns.push({ text: txt, options: opts });
              }

              if (lineRuns.length > 0) {
                lineRuns[lineRuns.length - 1].options.breakLine = true;
                textRuns.push(...lineRuns);
              }
            }

            slide.addText(textRuns, {
              x: textX, y: textY, w: textW, h: textH,
              valign: 'middle',
              margin: 0
            });

            slide.addText(`${s + 1}`, {
              x: '90%', y: '90%', w: '5%', h: '5%',
              fontSize: 12, color: slideTextColor, align: 'right', transparency: 50
            });

            if (logoText) {
              slide.addText(logoText, {
                x: '50%', y: '94%', w: '45%', h: '4%',
                fontSize: 10, color: slideTextColor, align: 'right', transparency: 60
              });
            }
          }

          const blob = await pres.write({ outputType: "blob" });
          const url = URL.createObjectURL(blob);
          const fileDownload = document.createElement("a");
          document.body.appendChild(fileDownload);
          fileDownload.href = url;
          fileDownload.download = `presentation_${Date.now()}.pptx`;
          fileDownload.target = "_blank";
          fileDownload.rel = "noopener noreferrer";
          fileDownload.click();
          document.body.removeChild(fileDownload);
          setTimeout(() => URL.revokeObjectURL(url), 1000);

        } catch (error) {
          console.error("PPTX Export Error:", error);
          alert("PowerPointの生成中にエラーが発生しました。");
        } finally {
          setIsExporting(false);
        }
      };

                    style={proseStyle}
                    dangerouslySetInnerHTML={{ __html: parseMarkdown(pageContent, false, false, '', slideBreakMode) }}
                  />
                  {logoText && slideBreakMode !== 'none' && (
                    <div style={{ position: 'absolute', right: '20mm', bottom: '20mm', fontSize: '0.75rem', opacity: 0.6, fontFamily: 'inherit' }}>
                      {logoText}
                    </div>
                  )}

              ))}
            </div>
          );
        } else {
          const slides = getSlides(activeText);
          
          return (
            <div className="flex flex-col gap-8 items-center pb-12 w-full">
              {slides.map((slideContent, index) => {
                const slideClass = getSlideClasses(slideLayout, slideColor);
                const isCard = slideLayouts[slideLayout]?.type === 'card';

                return (
                  <div 
                    key={index}
                    className={`slide-element w-full max-w-4xl shadow-2xl flex flex-col justify-center relative overflow-hidden transition-colors duration-300 ${slideClass} ${isCard ? 'p-6 md:p-8' : 'p-12 md:p-16'}`}
                    style={{ aspectRatio: '16/9' }}
                  >
                    {renderSlideDecoration(slideLayout, slideColor)}
                    
                    {isCard ? (
                      <div className="w-full h-full bg-white rounded-2xl shadow-lg p-8 md:p-12 flex flex-col justify-center relative z-10 text-gray-800">
                        <div className="absolute right-6 bottom-8 text-sm opacity-50 font-mono">{index + 1}</div>
                        {logoText && <div className="absolute right-6 bottom-4 text-xs opacity-40 font-sans">{logoText}</div>}
                        <div 
                          className="w-full"
                          dangerouslySetInnerHTML={{ __html: parseMarkdown(slideContent, true, false, '', slideBreakMode) }}

                      </div>
                    ) : (
                      <>
                        <div className="absolute right-6 bottom-8 text-sm opacity-50 font-mono">{index + 1}</div>
                        {logoText && <div className="absolute right-6 bottom-4 text-xs opacity-40 font-sans">{logoText}</div>}
                        <div 
                          className="w-full z-10"
                          dangerouslySetInnerHTML={{ __html: parseMarkdown(slideContent, true, false, '', slideBreakMode) }}
                        />
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          );
        }
      };

      const handleFormatSelection = (e) => {
        const format = e.target.value;
        if (!format) return;

        const textarea = textareaRef.current;
        if (!textarea) return;

        const startPos = textarea.selectionStart;
        const endPos = textarea.selectionEnd;
        const currentText = safeText;

        if (format === 'page_break') {
          const breakMark = '\n\n---\n\n';
          const newText = currentText.substring(0, startPos) + breakMark + currentText.substring(endPos);
          setText(newText);
          setTimeout(() => {
            textarea.selectionStart = textarea.selectionEnd = startPos + breakMark.length;
            textarea.focus();
          }, 0);
          e.target.value = "";
          return;
        }

        if (format === 'clear_all') {
          const lines = currentText.split('\n');
          const newLines = lines.map(line => {
            const trimmed = line.trim();
            // 区切り線を削除
            if (/^(?:===|---|ーーー|—-|——)$/.test(trimmed)) return '';
            // EOFタグは保持
            if (trimmed === '[EOF]') return line;
            
            // 行頭の装飾記号を削除
            let cleanLine = line.replace(/^(?:#+\s+|- \s*|\d+\.\s+|> \s*)/, '');
            // インライン装飾（太字・斜体）を削除
            cleanLine = cleanLine.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
            
            return cleanLine;
          });
          
          // 連続する空行を整える
          const newText = newLines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
          setText(newText);
          
          e.target.value = "";
          return;
        }

        let lineStart = currentText.lastIndexOf('\n', startPos - 1) + 1;
        let lineEnd = currentText.indexOf('\n', endPos);
        if (lineEnd === -1) lineEnd = currentText.length;

        const beforeText = currentText.substring(0, lineStart);
        const targetText = currentText.substring(lineStart, lineEnd);
        const afterText = currentText.substring(lineEnd);

        const lines = targetText.split('\n');
        const formattedLines = lines.map((line) => {
          let cleanLine = line.replace(/^(#+ |- |\d+\.\s+|> )/, '');
          let newLine = cleanLine;
          
          if (format === 'h1') newLine = '# ' + cleanLine;
          else if (format === 'h2') newLine = '## ' + cleanLine;
          else if (format === 'h3') newLine = '### ' + cleanLine;
          else if (format === 'list') newLine = '- ' + cleanLine;
          else if (format === 'num_list') newLine = '1. ' + cleanLine;
          else if (format === 'quote') newLine = '> ' + cleanLine;
          else if (format === 'clear') newLine = cleanLine;
          
          return newLine;
        });

        const newTargetText = formattedLines.join('\n');
        const newText = beforeText + newTargetText + afterText;
        
        setText(newText);
        
        setTimeout(() => {
          if (startPos === endPos) {
             const diff = formattedLines[0].length - lines[0].length;
             textarea.selectionStart = textarea.selectionEnd = Math.max(0, startPos + diff);
          } else {
             textarea.selectionStart = startPos;
             textarea.selectionEnd = startPos + newTargetText.length;
          }
          textarea.focus();
        }, 0);

        e.target.value = "";
      };

      const handleInsertEOF = () => {
        const textarea = textareaRef.current;
        if (!textarea) return;

        const eofMark = '\n\n[EOF]\n\n';
        
        const startPos = textarea.selectionStart;
        const endPos = textarea.selectionEnd;
        const newText = safeText.substring(0, startPos) + eofMark + safeText.substring(endPos);
        
        setText(newText);
        
        setTimeout(() => {
          textarea.selectionStart = textarea.selectionEnd = startPos + eofMark.length;
          textarea.focus();
        }, 0);
      };

      const processAutoPageBreak = () => {
        if (safeText.trim() === '') {
          setShowAutoPageBreakConfirm(false);
          return;
        }

        const splitByEOF = safeText.split('[EOF]');
        let targetText = splitByEOF[0];
        const eofText = splitByEOF.length > 1 ? '\n\n[EOF]' + splitByEOF[1] : '';

        // 既存の改ページ記号を完全に削除し、一度プレーンな状態にする
        targetText = targetText.replace(/^[ \t]*(?:===|---|ーーー|—-|——)[ \t]*$/gm, '');
        // 改ページ削除によって生じた余分な空行を整理する
        targetText = targetText.replace(/\n{3,}/g, '\n\n').trim();

        const lines = targetText.split('\n');
        const newLines = [];
        let currentWeight = 0;
        
        // A4用紙やスライドにロゴごと確実に収まるようにウェイトを設定
        // ロゴが存在する場合は、1ページあたりの限界文字数を少なくして余白を確保する
        const maxWeight = mode === 'report' ? (logoText ? 34 : 36) : (logoText ? 6 : 7); 
        
        let breakMark = '---';
        if (slideBreakMode === 'hr_eq') breakMark = '===';
        else if (slideBreakMode === 'hr_jp') breakMark = 'ーーー';
        else if (slideBreakMode === 'hr_dash') breakMark = '—-';
        else if (mode === 'report') breakMark = '===';

        let i = 0;
        while (i < lines.length) {
          const line = lines[i];
          const trimmed = line.trim();

          let lineWeight = 1;
          if (trimmed === '') {
            lineWeight = 1;
          } else if (trimmed.startsWith('# ')) {
            lineWeight = 3; // 見出し1は大きくスペースを取る
          } else if (trimmed.startsWith('## ') || trimmed.startsWith('### ')) {
            lineWeight = 2; // 見出し2,3
          } else {
            const charPerLine = mode === 'report' ? 40 : 25;
            // 行の折り返しを考慮した高さを算出
            lineWeight = Math.max(1, Math.ceil(trimmed.length / charPerLine) * 1.2);
          }

          if (currentWeight > 0) {
            let shouldBreak = false;
            
            if (currentWeight + lineWeight > maxWeight) {
              shouldBreak = true;
            } else if (currentWeight > maxWeight * 0.7 && trimmed.match(/^#{1,3}\s/)) {
              // ページの下部に見出しだけが孤立するのを防ぐために改ページ
              shouldBreak = true;
            }

            if (shouldBreak) {
              // 改ページ前の余分な空行を削除
              while (newLines.length > 0 && newLines[newLines.length - 1].trim() === '') {
                 newLines.pop();
              }
              newLines.push('');
              newLines.push(breakMark);
              newLines.push('');
              currentWeight = 0;
            }
          }

          newLines.push(line);
          currentWeight += lineWeight;
          i++;
        }

        let formattedText = newLines.join('\n').replace(/\n{3,}/g, '\n\n');

        setText(formattedText.trim() + eofText);
        setShowAutoPageBreakConfirm(false);
      };

      const processAutoFormat = () => {
        if (safeText.trim() === '') {
          setShowAutoFormatConfirm(false);
          return;
        }

        const splitByEOF = safeText.split('[EOF]');
        let targetText = splitByEOF[0];
        const eofText = splitByEOF.length > 1 ? '\n\n[EOF]' + splitByEOF[1] : '';

        // --- 強制的に全ての装飾を一度クリアする ---
        let plainLines = targetText.split('\n').map(line => {
          const trimmed = line.trim();
          // 改ページ記号を削除
          if (/^(?:===|---|ーーー|—-|——)$/.test(trimmed)) return '';
          // 行頭のMarkdown装飾記号を削除
          let cleanLine = trimmed.replace(/^(?:#+\s+|- \s*|\d+\.\s+|> \s*)/, '');
          // 文字列内の太字・斜体の装飾を削除
          cleanLine = cleanLine.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
          return cleanLine;
        });
        
        targetText = plainLines.join('\n').replace(/\n{3,}/g, '\n\n');

        // --- 再解析して最適な装飾を割り振る ---
        const lines = targetText.split('\n');
        let isFirstContentLine = true;
        let inList = false;
        
        const newLines = lines.map((line, index) => {
          const trimmed = line.trim();
          
          if (!trimmed) {
             inList = false;
             return line;
          }
          
          // 【見出し】や［見出し］のパターン
          const bracketHeadingMatch = trimmed.match(/^[【\[]([^】\]]+)[】\]]$/);
          if (bracketHeadingMatch) {
            inList = false;
            const headingText = bracketHeadingMatch[1].trim();
            if (isFirstContentLine) {
              isFirstContentLine = false;
              return '# ' + headingText;
            }
            return '## ' + headingText;
          }

          // 第○章、第○部 などのパターン
          if (/^第[０-９0-9一二三四五六七八九十百]+[章部節項]/.test(trimmed)) {
            inList = false;
            if (isFirstContentLine) {
              isFirstContentLine = false;
              return '# ' + trimmed;
            }
            return '## ' + trimmed;
          }
          
          // リスト記号の変換 (・ ■ ● ○ ◎ ◆ ◇)
          if (/^[・■●○◎◆◇-]/u.test(trimmed)) {
            isFirstContentLine = false;
            inList = true;
            return '- ' + trimmed.replace(/^[・■●○◎◆◇-]\s*/, '').trim();
          }
          
          // (1) などの番号リスト変換、または丸数字
          if (/^\(\d+\)/.test(trimmed) || /^[①②③④⑤⑥⑦⑧⑨⑩]/.test(trimmed)) {
            isFirstContentLine = false;
            inList = true;
            let numMatched = trimmed.match(/^\((\d+)\)/);
            if (numMatched) {
                return trimmed.replace(/^\((\d+)\)\s*/, numMatched[1] + '. ');
            } else {
                return '- ' + trimmed.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/, '').trim(); 
            }
          }
          
          // 一般的な見出しの推測 (句点で終わらない、35文字以内)
          const isShortNoPunctuation = trimmed.length > 0 && trimmed.length <= 35 && !/[。！？.!?]$/.test(trimmed);
          const prevLine = index > 0 ? lines[index - 1].trim() : '';
          const isPrevEmpty = prevLine === '';
          const nextLine = index < lines.length - 1 ? lines[index + 1].trim() : '';
          const isNextEmpty = nextLine === '';

          if (isShortNoPunctuation && !inList) {
            if (isFirstContentLine) {
              isFirstContentLine = false;
              return '# ' + trimmed; 
            } 
            else if (isPrevEmpty && isNextEmpty) {
              return '## ' + trimmed; 
            }
          }
          
          isFirstContentLine = false;
          return trimmed; 
        });

        let formattedText = newLines.join('\n');

        setText(formattedText + eofText);
        setShowAutoFormatConfirm(false);
      };

      const processFileUpload = async (file) => {
        const fileType = file.name.split('.').pop().toLowerCase();

        try {
          if (fileType === 'txt' || fileType === 'md') {
            const reader = new FileReader();
            reader.onload = (e) => setText(e.target.result);
            reader.readAsText(file);
          } else if (fileType === 'html' || fileType === 'htm') {
            const reader = new FileReader();
            reader.onload = (e) => {
              const parser = new DOMParser();
              const doc = parser.parseFromString(e.target.result, 'text/html');
              let extractedText = doc.body.textContent || '';
              extractedText = extractedText.replace(/\n\s*\n/g, '\n\n').trim();
              setText(extractedText);
            };
            reader.readAsText(file);
          } else if (fileType === 'docx') {
            if (!window.mammoth) {
              alert("Word読み込みライブラリを準備中です。少し待ってから再度お試しください。");
              return;
            }
            const reader = new FileReader();
            reader.onload = async (e) => {
              const arrayBuffer = e.target.result;
              try {
                const result = await window.mammoth.extractRawText({ arrayBuffer });
                setText(result.value);
              } catch (err) {
                console.error("Mammoth Error:", err);
                alert("Wordファイルの読み込みに失敗しました。");
              }
            };
            reader.readAsArrayBuffer(file);
          } else {
            alert("対応していないファイル形式です。.txt, .md, .html, または .docx を選択してください。");
          }
        } catch (error) {
          console.error("File Read Error:", error);
          alert("ファイルの読み込み中にエラーが発生しました。");
        }
      };

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (safeText.trim() !== '') {
          setPendingUploadFile(file);
          setShowUploadConfirm(true);
        } else {
          processFileUpload(file);
        }
        
        event.target.value = ''; 
      };

      return (
        <div className="flex flex-col h-screen bg-gray-50 text-gray-800 font-sans overflow-hidden">
          <header className="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm z-10">
            <div className="flex items-center gap-2">
              <div className="bg-indigo-600 p-2 rounded-lg text-white">
                <Layout size={20} />
              </div>
              <h1 className="text-xl font-bold text-gray-800 tracking-tight">DocCraft <span className="text-sm font-normal text-gray-500 ml-2">ドキュメント自動レイアウトツール</span></h1>
            </div>
            <div className="flex gap-2">
              <button 
                onClick={() => setShowResetConfirm(true)}
                className="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-500 hover:text-red-600 bg-white border border-gray-200 rounded-md hover:bg-red-50 transition-colors mr-2"
              >
                <RotateCcw size={16} /> 初期化
              </button>
              <button 
                onClick={mode === 'report' ? handleExportWord : handleExportPPTX}
                className="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
              >
                {mode === 'report' ? <><FileText size={16} /> Word</> : <><Presentation size={16} /> PowerPoint</>}
              </button>
              
              <button 
                onClick={handleExportHTML}
                className="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
              >
                <FileCode size={16} /> HTML
              </button>
              <button 
                onClick={handleExportPDF}
                disabled={isExporting}
                className={`flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-600 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors shadow-sm
                  ${isExporting ? 'cursor-wait opacity-70' : ''}`}
              >
                <Download size={16} /> {isExporting ? '準備中...' : 'PDF (印刷)'}
              </button>
              <button 
                onClick={handleDownloadPDF}
                disabled={isExporting}
                className={`flex items-center gap-2 px-4 py-2 text-sm font-medium text-white rounded-md transition-colors shadow-sm
                  ${isExporting ? 'bg-indigo-400 cursor-wait' : 'bg-indigo-600 hover:bg-indigo-700'}`}
              >
                <Download size={16} /> {isExporting ? '準備中...' : 'PDF'}
              </button>

          <div className="flex flex-1 overflow-hidden">

                      ${mode === 'report' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/30' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-100'}`}

                      <button
                        onClick={handleLoadSample}
                        className="text-xs text-indigo-600 font-medium flex items-center gap-1 bg-white hover:bg-indigo-50 px-2.5 py-1.5 rounded transition-colors shadow-sm border border-indigo-200 shrink-0 ml-2"
                        title="サンプルデータを入力します"
                      >
                        <FileText size={12} /> サンプル
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div className="flex-1 flex flex-col relative bg-white">
                <div className="flex items-center justify-between px-4 py-2 border-b border-gray-100 bg-gray-50/50 shrink-0 overflow-x-auto whitespace-nowrap">
                  <div className="text-xs text-gray-500 font-mono flex items-center gap-1 mr-4">
                    <Type size={14} /> <span>Editor</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <input 
                      type="file" 
                      accept=".txt,.md,.docx,.html,.htm" 
                      ref={fileInputRef} 
                      className="hidden" 
                      onChange={handleFileUpload}
                    />
                    <button
                      onClick={() => fileInputRef.current?.click()}
                      className="text-xs text-emerald-700 font-medium flex items-center gap-1 bg-emerald-50 hover:bg-emerald-100 px-2.5 py-1.5 rounded transition-colors shadow-sm border border-emerald-200"
                      title="テキスト(txt, md), Word(docx), HTMLファイルを読み込みます"
                    >
                      <Upload size={12} /> ファイル読込
                    </button>
                    <select
                      onChange={handleFormatSelection}
                      defaultValue=""
                      className="w-28 text-xs text-indigo-700 font-medium bg-indigo-50 border border-indigo-100 hover:bg-indigo-100 rounded px-2 py-1.5 focus:ring-indigo-500 focus:border-indigo-500 outline-none shadow-sm cursor-pointer transition-colors"
                      title="カーソル位置の行に装飾を適用します"
                    >
                      <option value="" disabled>✎ 装飾</option>
                      <option value="h1">見出し1 (#)</option>
                      <option value="h2">見出し2 (##)</option>
                      <option value="h3">見出し3 (###)</option>
                      <option value="list">リスト (-)</option>
                      <option value="num_list">番号リスト (1.)</option>
                      <option value="quote">引用 (&gt;)</option>
                      <option value="page_break">区切り/改ページ (---)</option>
                      <option value="clear">装飾をクリア</option>
                      <option value="clear_all">全装飾のクリア</option>
                    </select>
                    <button
                      onClick={() => setShowAutoFormatConfirm(true)}
                      className="text-xs text-amber-600 font-medium flex items-center gap-1 bg-amber-50 hover:bg-amber-100 px-2.5 py-1.5 rounded transition-colors shadow-sm border border-amber-200"
                      title="テキスト内容を解析し、見出しやリストを自動設定します"
                    >
                      <Wand2 size={12} /> 自動装飾
                    </button>
                    <button
                      onClick={() => setShowAutoPageBreakConfirm(true)}
                      className="text-xs text-blue-600 font-medium flex items-center gap-1 bg-blue-50 hover:bg-blue-100 px-2.5 py-1.5 rounded transition-colors shadow-sm border border-blue-200"
                      title="1ページに収まるように自動的に改ページを挿入します"
                    >
                      <Layers size={12} /> 自動改ページ
                    </button>
                    <button
                      onClick={handleInsertEOF}
                      className="text-xs text-red-600 font-medium flex items-center gap-1 bg-red-50 hover:bg-red-100 px-2.5 py-1.5 rounded transition-colors shadow-sm border border-red-100"
                      title="これ以降のテキストをプレビューや出力に反映させません"
                    >
                      <Ban size={12} /> 非表示
                    </button>
                    <button
                      onClick={() => setShowClearConfirm(true)}
                      className="text-xs text-gray-600 font-medium flex items-center gap-1 bg-gray-100 hover:bg-gray-200 px-2.5 py-1.5 rounded transition-colors shadow-sm border border-gray-200"
                      title="エディタの内容をすべて消去します"
                    >
                      <Trash2 size={12} /> クリア
                    </button>
                  </div>
                </div>
                <textarea
                  ref={textareaRef}
                  value={safeText}
                  onChange={(e) => setText(e.target.value)}
                  placeholder={"ここにマークダウン形式でテキストを入力または貼り付けるか、ファイルを読み込んで下さい...\n\n見出し: # または ## または ###\nリスト: - または 1.\nスライド区切り/改ページ: [改ページ]ボタンを使用\n\n読み込めるファイルは、text、doc、html、markdown形式になります。"}
                  className="flex-1 w-full p-6 resize-none focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500/50 bg-transparent text-gray-700 leading-relaxed font-mono text-sm"
                  spellCheck="false"
                />
              </div>
            </div>

            <div className="w-1/2 bg-gray-200/80 overflow-y-auto relative p-6 md:p-10 flex flex-col items-center">
              <div className="absolute top-4 right-6 flex items-center gap-2 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full shadow-sm text-xs font-medium text-gray-500 z-10 border border-gray-100">
                <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                ライブプレビュー
              </div>
              
              <div 
                id="preview-content"
                ref={previewRef}
                className={`w-full flex flex-col items-center ${mode === 'slides' ? '' : 'max-w-[210mm]'}`}
              >
                {renderPreviewContent()}
              </div>
            </div>
          </div>

          <footer className="bg-white border-t border-gray-200 py-2 px-6 text-center text-xs text-gray-500 shrink-0 z-10">
            &copy; 一般社団法人日本みらい研
          </footer>

          {showSampleConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">サンプルの読み込み</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">
                  現在のテキストが消去され、サンプルデータで上書きされます。よろしいですか？
                </p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowSampleConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={() => {
                      setText(defaultText);
                      setShowSampleConfirm(false);
                    }}
                    className="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 transition-colors"
                  >
                    上書きする
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAutoPageBreakConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">自動改ページの確認</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">
                  テキストの長さを見積もり、1ページ（または1スライド）に収まるように自動的に改ページ記号を挿入します。よろしいですか？
                </p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowAutoPageBreakConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={processAutoPageBreak}
                    className="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors"
                  >
                    実行する
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAutoFormatConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">自動装飾の確認</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">
                  テキストの内容を自動で解析し、タイトルやサブタイトルに見出し記号（#）を付与してフォントサイズやレイアウトを最適化します。よろしいですか？
                </p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowAutoFormatConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={processAutoFormat}
                    className="px-4 py-2 text-sm font-medium text-white bg-amber-500 rounded-md hover:bg-amber-600 transition-colors"
                  >
                    実行する
                  </button>
                </div>
              </div>
            </div>
          )}

          {showResetConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">初期化の確認</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">テキストの内容と選択したテーマ・カラー設定をすべて初期状態（デフォルト）に戻しますか？この操作は取り消せません。</p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowResetConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={handleFullReset}
                    className="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700 transition-colors"
                  >
                    リセットする
                  </button>
                </div>
              </div>
            </div>
          )}

          {showClearConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">テキストの消去</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">エディタの内容をすべて消去しますか？この操作は取り消せません。</p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowClearConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={() => {
                      setText('');
                      setShowClearConfirm(false);
                      setTimeout(() => textareaRef.current?.focus(), 0);
                    }}
                    className="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700 transition-colors"
                  >
                    消去する
                  </button>
                </div>
              </div>
            </div>
          )}

          {showUploadConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">ファイル読み込みの確認</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">現在のテキストが消去され、ファイルの内容で上書きされます。よろしいですか？</p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => {
                      setShowUploadConfirm(false);
                      setPendingUploadFile(null);
                    }}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={() => {
                      if (pendingUploadFile) {
                        processFileUpload(pendingUploadFile);
                      }
                      setShowUploadConfirm(false);
                      setPendingUploadFile(null);
                    }}
                    className="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 transition-colors"
                  >
                    上書きする
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    try {
      if (ReactDOM.createRoot) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
      } else {
        ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, rootElement);
      }
    } catch (e) {
      rootElement.innerHTML = '<div style="padding: 20px; color: red;">アプリケーションの起動に失敗しました: ' + e.message + '</div>';
      console.error(e);
    }
  </script>
</body>
</html>
