  <!-- エラー検知用スクリプト -->
  <script>
    window.addEventListener('error', function(event) {
      var root = document.getElementById('root');
      if (root && root.innerHTML.includes('アプリケーションを読み込んでいます')) {
        root.innerHTML = '<div style="padding: 20px; color: #b91c1c; background: #fef2f2; height: 100vh;">' +
                         '<h2 style="font-weight: bold; margin-bottom: 10px;">致命的なエラー</h2>' +
                         '<p>' + (event.message || '起動中にエラーが発生しました') + '</p>' +
                         '</div>';
      }
    });
    window.addEventListener('load', function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.innerHTML.includes('アプリケーションを読み込んでいます')) {
          root.innerHTML = '<div style="padding: 20px; color: #b91c1c; background: #fef2f2; height: 100vh;">' +
                           '<h2 style="font-weight: bold; margin-bottom: 10px;">初期化タイムアウト</h2>' +
                           '<p>コンパイル処理が完了しませんでした。ネットワーク環境やブラウザのセキュリティ設定をご確認ください。</p>' +
                           '</div>';
        }
      }, 5000);
    });
  </script>

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: '2rem', color: '#b91c1c', backgroundColor: '#fef2f2', minHeight: '100vh' }}>
              <h2 style={{ fontSize: '1.5rem', fontWeight: 'bold', margin: '0 0 1rem 0' }}>レンダリングエラーが発生しました</h2>
              <p style={{ fontFamily: 'monospace' }}>{this.state.error && this.state.error.toString()}</p>
            </div>
          );
        }
        return this.props.children;
      }
    }

本資料は、社内業務効率化のための次世代AIアシスタント導入に関する提案をまとめたものです。
日々の定型業務を自動化し、より創造的な業務に時間を割くことを目的としています。

---

## 2. 現状の課題
現在の業務フローには以下の課題が存在します。

1. 議事録作成に膨大な時間がかかっている
2. 情報の検索性が低く、過去のデータ活用が不十分
3. 部署間の情報共有にタイムラグが発生している

---

AIアシスタントを導入することで、これらの課題を以下のよう解決します。

1. **自動文字起こし・要約機能**による議事録作成のゼロ化

2. 社内問い合わせ対応コストの半減
3. 社員エンゲージメントの向上

ご検討のほど、よろしくお願いいたします。`;

    function getSavedValue(key, defaultValue) {
      try {
        const isInit = window.localStorage.getItem('doccraft_is_init');

        if (isInit === 'true' && saved !== null) return saved;
        return defaultValue;
      } catch (error) {
        return defaultValue;
      }
    }

    function saveToStorage(key, value) {
      try {
        window.localStorage.setItem('doccraft_is_init', 'true');
        window.localStorage.setItem(key, value);
      } catch (error) {}
    }

      const getSlideClasses = (layout, color) => {
        const c = slideColors[color] || slideColors.blue;
        const l = slideLayouts[layout] || slideLayouts.solid;
        const rev = isSlideReversed && c.isTwoTone;

        switch(l.type) {
          case 'solid': return rev ? c.solidRev : c.solid;
          case 'gradient': return rev ? c.gradRev : c.grad;
          case 'accent': return 'bg-white text-gray-800';
          case 'header': return 'bg-white text-gray-800 pt-16'; 
          case 'minimal': return rev ? c.lightBgRev : c.lightBg;
          case 'card': return rev ? c.lightBgRev : c.lightBg; 
          default: return rev ? c.solidRev : c.solid;
        }
      };

      const renderSlideDecoration = (layout, color) => {
        const c = slideColors[color] || slideColors.blue;
        const l = slideLayouts[layout] || slideLayouts.solid;
        const rev = isSlideReversed && c.isTwoTone;
        const solidClass = rev ? (c.solidRev || '') : (c.solid || '');
        const borderClass = rev ? (c.borderRev || '') : (c.border || '');
        
        if (l.type === 'accent') {
          return <div className={`absolute left-0 top-0 bottom-0 w-4 border-l-[16px] ${borderClass}`}></div>;
        }
        if (l.type === 'minimal') {
           const bgClass = (solidClass.split(' ')[0]) || ''; 
           return <div className={`absolute top-0 left-0 right-0 h-2 ${bgClass}`}></div>;
        }
        if (l.type === 'header') {
           const bgClass = (solidClass.split(' ')[0]) || ''; 
           return <div className={`absolute top-0 left-0 right-0 h-16 ${bgClass} shadow-md`}></div>;
        }
        return null;
      };

      const getProcessedReportText = (sourceText) => {
        if (!sourceText) return '';
        if (slideBreakMode === 'none') return sourceText;
        const manualPages = sourceText.split(/^(?:===|---|ーーー|—-|——)$/gm);
        
        if (['hr', 'hr_jp', 'hr_dash', 'hr_eq'].includes(slideBreakMode)) {
          return manualPages.join('\n\n===\n\n');
        }

        const finalPages = [];
        
        manualPages.forEach(manualPage => {
          const lines = manualPage.split('\n');
          let currentPage = [];

          lines.forEach(line => {
            let isBreak = false;
            if (slideBreakMode === 'h1' && line.startsWith('# ')) isBreak = true;
            if (slideBreakMode === 'h2' && line.startsWith('## ')) isBreak = true;
            if (slideBreakMode === 'list' && (line.startsWith('- ') || /^\d+\.\s/.test(line))) isBreak = true;

            if (isBreak && currentPage.filter(l => l.trim() !== '').length > 0) {
              finalPages.push(currentPage.join('\n'));
              currentPage = [line];
            } else {
              currentPage.push(line);
            }
          });
          
          finalPages.push(currentPage.join('\n'));
        });

        return finalPages.join('\n\n===\n\n');
      };

      const getSlides = (sourceText) => {
        if (mode !== 'slides') return [];
        if (!sourceText) return [];
        if (slideBreakMode === 'none') return [sourceText];

        const manualSlides = sourceText.split(/^(?:===|---|ーーー|—-|——)$/gm).map(s => s.trim()).filter(s => s !== '');
        
        if (['hr', 'hr_jp', 'hr_dash', 'hr_eq'].includes(slideBreakMode)) {
          return manualSlides;
        }

        const finalSlides = [];
        
        manualSlides.forEach(manualSlide => {
          const lines = manualSlide.split('\n');
          let currentSlide = [];

          lines.forEach(line => {
            let isBreak = false;
            if (slideBreakMode === 'h1' && line.startsWith('# ')) isBreak = true;
            if (slideBreakMode === 'h2' && line.startsWith('## ')) isBreak = true;
            if (slideBreakMode === 'list' && (line.startsWith('- ') || /^\d+\.\s/.test(line))) isBreak = true;

            if (isBreak && currentSlide.length > 0) {
              finalSlides.push(currentSlide.join('\n'));
              currentSlide = [line];

            }

          if (currentSlide.length > 0) {
            finalSlides.push(currentSlide.join('\n'));

        return finalSlides;

      const parseMarkdown = (markdown, isSlide = false, forExport = false, currentLogoText = '', currentBreakMode = 'hr') => {
        if (!markdown) return '';
        let html = String(markdown);

        const safeLogoText = String(currentLogoText || '');
        const escapedLogo = safeLogoText.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const logoHtml = escapedLogo ? `<div class="doc-logo" style="text-align: right; font-size: 0.75rem; opacity: 0.6; margin-top: 2rem; padding-bottom: 0.5rem; font-family: inherit;">${escapedLogo}</div>` : '';

        if (forExport) {
          html = html
            .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
            .replace(/!\[([^\]]*)\]\((.*?)\)/gim, '<img src="$2" alt="$1" style="max-width: 100%; max-height: 300px; object-fit: contain; margin: 1rem auto; display: block; border-radius: 0.375rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);" />')
            .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/gim, '<em>$1</em>');
            
          if (currentBreakMode !== 'none') {
            html = html.replace(/^(?:===|---|ーーー|—-|——)$/gim, `${logoHtml}<div class="page-break" style="page-break-before: always; break-before: page; clear: both; height: 0; margin: 0; padding: 0;"></div>`);
          } else {
            html = html.replace(/^(?:===|---|ーーー|—-|——)$/gim, '<hr />');
          }

          // Markdown lists to HTML with specific classes for styling
          html = html.replace(/^- (.*$)/gim, '<li class="ul-li my-1">$1</li>');
          html = html.replace(/^\d+\. (.*$)/gim, '<li class="ol-li my-1">$1</li>');
          
          // Wrap list items in ul/ol with hanging indent styles
          html = html.replace(/(<li class="ul-li my-1">.*<\/li>\n?)+/g, match => `<ul style="padding-left: 1.5em; list-style-position: outside; margin-left: 0; margin-top: 0.5rem; margin-bottom: 1rem;">${match.replace(/class="ul-li my-1"/g, 'class="my-1"')}</ul>`);
          html = html.replace(/(<li class="ol-li my-1">.*<\/li>\n?)+/g, match => `<ol style="padding-left: 1.5em; list-style-position: outside; margin-left: 0; margin-top: 0.5rem; margin-bottom: 1rem;">${match.replace(/class="ol-li my-1"/g, 'class="my-1"')}</ol>`);

          const lines = html.split('\n');
          const parsedLines = lines.map(line => {
            const trimmed = line.trim();
            if (!trimmed || /^(<h|<ul|<ol|<li|<blockquote|<hr|<div|<img)/.test(trimmed)) return line;
            return `<p>${line}</p>`;
          });
          let parsedText = parsedLines.join('\n');
          
          if (!isSlide && safeLogoText && currentBreakMode === 'none') {
              parsedText += `\n${logoHtml}`;
          }
          return parsedText;
        }

        const breakHtml = `${logoHtml}<div class="html2pdf__page-break page-break" style="page-break-before: always; break-before: page; clear: both; width: 100%;"><div data-html2canvas-ignore="true" style="display: flex; align-items: center; justify-content: center; margin: 3rem 0;"><hr style="flex-grow: 1; border-top: 2px dashed currentColor; opacity: 0.3; margin: 0;"><span style="padding: 0 1rem; opacity: 0.5; font-size: 0.85rem; font-family: monospace;">Page Break</span><hr style="flex-grow: 1; border-top: 2px dashed currentColor; opacity: 0.3; margin: 0;"></div></div>`;

        html = html
          .replace(/^#### (.*$)/gim, '<h4 class="text-lg font-bold mt-4 mb-2 text-current opacity-90">$1</h4>')
          .replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold mt-6 mb-2 text-current opacity-90">$1</h3>')
          .replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-8 mb-4 border-b border-current/20 pb-2">$1</h2>')
          .replace(/^# (.*$)/gim, '<h1 class="text-4xl font-extrabold mt-4 mb-6 tracking-tight">$1</h1>')
          .replace(/^\> (.*$)/gim, '<blockquote class="border-l-4 border-current/50 pl-4 py-2 italic my-6 opacity-80">$1</blockquote>')
          .replace(/!\[([^\]]*)\]\((.*?)\)/gim, '<img src="$2" alt="$1" class="max-w-full max-h-64 object-contain mx-auto my-4 rounded-md shadow-sm" />')
          .replace(/\*\*(.*?)\*\*/gim, '<strong class="font-bold opacity-100">$1</strong>')
          .replace(/\*(.*?)\*/gim, '<em class="italic">$1</em>');

        if (currentBreakMode !== 'none') {
          html = html.replace(/^(?:===|---|ーーー|—-|——)$/gim, breakHtml);
        } else {
          html = html.replace(/^(?:===|---|ーーー|—-|——)$/gim, '<hr class="my-6 border-t border-current/20" />');
        }

        // Preview lists to HTML with specific classes
        html = html.replace(/^- (.*$)/gim, '<li class="ul-li my-1">$1</li>');
        html = html.replace(/^\d+\. (.*$)/gim, '<li class="ol-li my-1">$1</li>');
        
        // Wrap list items and force outside positioning for correct hanging indent
        html = html.replace(/(<li class="ul-li my-1">.*<\/li>\n?)+/g, match => `<ul class="my-4 space-y-2 list-disc" style="padding-left: 1.5em; list-style-position: outside; margin-left: 0;">${match.replace(/class="ul-li my-1"/g, 'class="my-1"')}</ul>`);
        html = html.replace(/(<li class="ol-li my-1">.*<\/li>\n?)+/g, match => `<ol class="my-4 space-y-2 list-decimal" style="padding-left: 1.5em; list-style-position: outside; margin-left: 0;">${match.replace(/class="ol-li my-1"/g, 'class="my-1"')}</ol>`);

        const lines = html.split('\n');
        const parsedLines = lines.map(line => {
          const trimmed = line.trim();
          if (!trimmed || /^(<h|<ul|<ol|<li|<blockquote|<hr|<div|<img)/.test(trimmed)) return line;
          return `<p class="my-3 leading-relaxed ${isSlide ? 'text-lg md:text-xl' : 'text-base'}">${line}</p>`;
        });

        let parsedText = parsedLines.join('\n');
        if (!isSlide && safeLogoText && currentBreakMode === 'none') {
            parsedText += `\n${logoHtml}`;
        }
        return parsedText;
      };

      const handleExportWord = async () => {
        if (!window.docx) {

          return;
        }
        setIsExporting(true);

        try {
          const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, Footer } = window.docx;
          const { docFontFamily, bgColorHex, textColorHex } = getThemeValues();
          const docColor = textColorHex;

          const parseInlineText = (textStr) => {
            const parts = textStr.split(/(\*\*.*?\*\*|\*.*?\*)/g);
            return parts.map(part => {
              if (part.startsWith('**') && part.endsWith('**')) {
                return new TextRun({ text: part.slice(2, -2), bold: true, color: docColor });
              } else if (part.startsWith('*') && part.endsWith('*')) {
                return new TextRun({ text: part.slice(1, -1), italics: true, color: docColor });
              } else {
                return new TextRun({ text: part, color: docColor });
              }
            }).filter(run => run.text !== "");
          };

          const children = [];

          if (mode === 'slides') {
            const slidesTextArray = getSlides(activeText);
            slidesTextArray.forEach((slideText, idx) => {
              if (idx > 0) {
                children.push(new Paragraph({ pageBreakBefore: true }));
              }
              const lines = slideText.split('\n');
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) {
                  children.push(new Paragraph({ text: "" }));
                  continue;
                }
                if (line === '---' || line === '===' || line === 'ーーー' || line === '—-' || line === '——') {
                  if (slideBreakMode === 'none') {
                    children.push(new Paragraph({ text: "---", alignment: AlignmentType.CENTER }));
                  }
                  continue; 
                }

                if (line.match(/^!\[([^\]]*)\]\((.*?)\)$/)) {
                  const match = line.match(/^!\[([^\]]*)\]\((.*?)\)$/);
                  children.push(new Paragraph({ 
                    children: [new TextRun({ text: `[図表: ${match[1] || '画像'}]`, italics: true, color: "888888" })], 
                    alignment: AlignmentType.CENTER 
                  }));
                  continue;
                }

                if (line.startsWith('# ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(2)), heading: HeadingLevel.HEADING_1 }));
                } else if (line.startsWith('## ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(3)), heading: HeadingLevel.HEADING_2 }));
                } else if (line.startsWith('### ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(4)), heading: HeadingLevel.HEADING_3 }));
                } else if (line.startsWith('#### ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(5)), heading: HeadingLevel.HEADING_4 }));
                } else if (/^\d+\.\s/.test(line)) {
                  children.push(new Paragraph({ children: parseInlineText(line), indent: { left: 400, hanging: 400 } }));
                } else if (line.startsWith('- ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(2)), bullet: { level: 0 } }));
                } else if (line.startsWith('> ')) {
                  children.push(new Paragraph({ children: parseInlineText(line.slice(2)), indent: { left: 720 } }));
                } else {
                  children.push(new Paragraph({ children: parseInlineText(line) }));
                }
              }

                if (slideBreakMode !== 'none') {
                  children.push(new Paragraph({ pageBreakBefore: true }));
                } else {
                  children.push(new Paragraph({ text: "---", alignment: AlignmentType.CENTER }));
                }
                continue;
              }

              if (line.match(/^!\[([^\]]*)\]\((.*?)\)$/)) {
                const match = line.match(/^!\[([^\]]*)\]\((.*?)\)$/);
                children.push(new Paragraph({ 
                  children: [new TextRun({ text: `[図表: ${match[1] || '画像'}]`, italics: true, color: "888888" })], 
                  alignment: AlignmentType.CENTER 
                }));
                continue;
              }

              if (line.startsWith('# ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(2)), heading: HeadingLevel.HEADING_1 }));
              } else if (line.startsWith('## ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(3)), heading: HeadingLevel.HEADING_2 }));
              } else if (line.startsWith('### ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(4)), heading: HeadingLevel.HEADING_3 }));
              } else if (line.startsWith('#### ')) {
                children.push(new Paragraph({ children: parseInlineText(line.slice(5)), heading: HeadingLevel.HEADING_4 }));
              } else if (/^\d+\.\s/.test(line)) {
                children.push(new Paragraph({ children: parseInlineText(line), indent: { left: 400, hanging: 400 } }));
              } else if (line.startsWith('- ')) {

                children.push(new Paragraph({ children: parseInlineText(line) }));

          }

          const doc = new Document({

                heading2: { run: { size: 36, bold: true }, paragraph: { spacing: { before: 300, after: 100 } } },

                      alignment: AlignmentType.RIGHT,
                    }),

                }),
              } : undefined,
              children: children

          const blob = await Packer.toBlob(doc);

      const handleExportPPTX = async () => {

          alert("PowerPoint生成ライブラリを読み込み中です。少し待ってから再度お試しください。");
          return;
        }
        setIsExporting(true);

        try {
          const pres = new window.PptxGenJS();
          pres.layout = 'LAYOUT_16x9';

          const { docFontFamily, bgColorHex, textColorHex } = getThemeValues();
          const l = slideLayouts[slideLayout] || slideLayouts.solid;
          const currentSlideColor = slideColors[slideColor] || slideColors.blue;
          const mainHexColor = (isSlideReversed && currentSlideColor.isTwoTone) ? currentSlideColor.hexRev.replace('#', '') : currentSlideColor.hex.replace('#', '');

          const rawSlides = getSlides(activeText);
          
          for (let s = 0; s < rawSlides.length; s++) {
            const slideText = rawSlides[s].trim();
            const slide = pres.addSlide();
            
            slide.background = { color: bgColorHex };

            let textX = '5%', textY = '10%', textW = '90%', textH = '80%'; 
            let isCardText = false;

            if (l.type === 'accent') {
              slide.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: '3%', h: '100%', fill: { color: mainHexColor } });
              textX = '8%'; textW = '87%';
            } else if (l.type === 'header') {
              slide.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: '100%', h: '12%', fill: { color: mainHexColor } });
              textY = '18%'; textH = '72%';
            } else if (l.type === 'minimal') {
              slide.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: '100%', h: '2%', fill: { color: mainHexColor } });
            } else if (l.type === 'card') {
              slide.addShape(pres.ShapeType.rect, { 
                x: '5%', y: '5%', w: '90%', h: '90%', 
                fill: { color: 'ffffff' }
              });
              textX = '10%'; textY = '10%'; textW = '80%'; textH = '80%';
              isCardText = true;
            }

            const slideTextColor = isCardText ? '1f2937' : textColorHex;

            const textRuns = [];
            const lines = slideText.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
              let line = lines[i].trim();
              if (!line) {
                 textRuns.push({ text: " ", options: { breakLine: true, fontSize: 18 } });
                 continue;
              }
              if (line === '---' || line === '===' || line === 'ーーー' || line === '—-' || line === '——') {
                 if (slideBreakMode !== 'none') continue; 
                 line = '---';
              }

              let baseOptions = { color: slideTextColor, fontFace: docFontFamily };
              
              if (line.match(/^!\[([^\]]*)\]\((.*?)\)$/)) {
                const match = line.match(/^!\[([^\]]*)\]\((.*?)\)$/);
                textRuns.push({ text: `[図表: ${match[1] || '画像'}]`, options: { breakLine: true, ...baseOptions, italic: true, color: '888888' } });
                continue;
              }

              if (line.startsWith('# ')) {
                line = line.slice(2);
                baseOptions.fontSize = 36;
                baseOptions.bold = true;
              } else if (line.startsWith('## ')) {
                line = line.slice(3);
                baseOptions.fontSize = 28;
                baseOptions.bold = true;
              } else if (line.startsWith('### ')) {
                line = line.slice(4);
                baseOptions.fontSize = 22;
                baseOptions.bold = true;
              } else if (line.startsWith('#### ')) {
                line = line.slice(5);
                baseOptions.fontSize = 20;
                baseOptions.bold = true;
              } else if (/^\d+\.\s/.test(line)) {
                line = line.replace(/^\d+\.\s/, '');
                baseOptions.fontSize = 18;
                baseOptions.bullet = { type: 'number' };
              } else if (line.startsWith('- ')) {
                line = line.slice(2);
                baseOptions.fontSize = 18;
                baseOptions.bullet = true;
              } else if (line.startsWith('> ')) {
                line = line.slice(2);
                baseOptions.fontSize = 18;
                baseOptions.italic = true;
              } else {
                baseOptions.fontSize = 18;
              }

              const parts = line.split(/(\*\*.*?\*\*|\*.*?\*)/g);
              const lineRuns = [];
              for (let j = 0; j < parts.length; j++) {
                const part = parts[j];
                if (!part) continue;

                let opts = { ...baseOptions };
                let txt = part;

                if (txt.startsWith('**') && txt.endsWith('**')) {
                  txt = txt.slice(2, -2);
                  opts.bold = true;
                } else if (txt.startsWith('*') && txt.endsWith('*')) {
                  txt = txt.slice(1, -1);
                  opts.italic = true;
                }

                if (lineRuns.length > 0) delete opts.bullet;

                lineRuns.push({ text: txt, options: opts });
              }

              if (lineRuns.length > 0) {
                lineRuns[lineRuns.length - 1].options.breakLine = true;
                textRuns.push(...lineRuns);
              }
            }

            slide.addText(textRuns, {
              x: textX, y: textY, w: textW, h: textH,

            });

            });

      const renderPreviewContent = () => {

      };

      const handleFormatSelection = (e) => {
        const format = e.target.value;
        if (!format) return;

        const textarea = textareaRef.current;
        if (!textarea) return;

        const startPos = textarea.selectionStart;
        const endPos = textarea.selectionEnd;
        const currentText = safeText;

        if (format === 'page_break') {
          const breakMark = '\n\n---\n\n';
          const newText = currentText.substring(0, startPos) + breakMark + currentText.substring(endPos);
          setText(newText);
          setTimeout(() => {
            textarea.selectionStart = textarea.selectionEnd = startPos + breakMark.length;
            textarea.focus();
          }, 0);
          e.target.value = "";
          return;
        }

        if (format === 'clear_all') {
          const lines = currentText.split('\n');
          const newLines = lines.map(line => {
            const trimmed = line.trim();
            // 区切り線を削除
            if (/^(?:===|---|ーーー|—-|——)$/.test(trimmed)) return '';
            // EOFタグは保持
            if (trimmed === '[EOF]') return line;
            
            // 行頭の装飾記号を削除
            let cleanLine = line.replace(/^(?:#+\s+|- \s*|\d+\.\s+|> \s*)/, '');
            // インライン装飾（太字・斜体）を削除
            cleanLine = cleanLine.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
            
            return cleanLine;
          });
          
          // 連続する空行を整える
          const newText = newLines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
          setText(newText);
          
          e.target.value = "";
          return;
        }

        if (format === 'clear_page_breaks') {
          const lines = currentText.split('\n');
          const newLines = lines.map(line => {
            const trimmed = line.trim();
            // 区切り線を削除
            if (/^(?:===|---+|ーーー|—-|——)$/.test(trimmed)) return '';
            return line;
          });
          
          // 連続する空行を整える
          const newText = newLines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
          setText(newText);
          
          e.target.value = "";
          return;
        }

        let lineStart = currentText.lastIndexOf('\n', startPos - 1) + 1;
        let lineEnd = currentText.indexOf('\n', endPos);
        if (lineEnd === -1) lineEnd = currentText.length;

        const beforeText = currentText.substring(0, lineStart);
        const targetText = currentText.substring(lineStart, lineEnd);
        const afterText = currentText.substring(lineEnd);

        const lines = targetText.split('\n');
        const formattedLines = lines.map((line) => {
          if (format === 'clear_page_break') {
            // 改ページ記号のみを空文字に変換
            if (/^[ \t]*(?:===|---+|ーーー|—-|——)[ \t]*$/.test(line)) {
              return '';
            }
            return line;
          }

          let cleanLine = line.replace(/^(#+ |- |\d+\.\s+|> )/, '');
          let newLine = cleanLine;
          
          if (format === 'h1') newLine = '# ' + cleanLine;
          else if (format === 'h2') newLine = '## ' + cleanLine;
          else if (format === 'h3') newLine = '### ' + cleanLine;
          else if (format === 'h4') newLine = '#### ' + cleanLine;
          else if (format === 'list') newLine = '- ' + cleanLine;
          else if (format === 'num_list') newLine = '1. ' + cleanLine;
          else if (format === 'quote') newLine = '> ' + cleanLine;
          else if (format === 'clear') newLine = cleanLine;
          
          return newLine;
        });

        const newTargetText = formattedLines.join('\n');
        let newText = beforeText + newTargetText + afterText;
        
        // 指定行の改ページを削除したことで生じた不要な空行を整理する
        if (format === 'clear_page_break') {
          newText = newText.replace(/\n{3,}/g, '\n\n');
        }
        
        setText(newText);
        
        setTimeout(() => {
          if (startPos === endPos) {
             const diff = formattedLines[0].length - lines[0].length;
             textarea.selectionStart = textarea.selectionEnd = Math.max(0, startPos + diff);
          } else {
             textarea.selectionStart = startPos;
             textarea.selectionEnd = startPos + newTargetText.length;
          }
          textarea.focus();
        }, 0);

        e.target.value = "";
      };

      const handleInsertEOF = () => {
        const textarea = textareaRef.current;
        if (!textarea) return;

        const eofMark = '\n\n[EOF]\n\n';
        
        const startPos = textarea.selectionStart;
        const endPos = textarea.selectionEnd;
        const newText = safeText.substring(0, startPos) + eofMark + safeText.substring(endPos);
        
        setText(newText);
        
        setTimeout(() => {
          textarea.selectionStart = textarea.selectionEnd = startPos + eofMark.length;
          textarea.focus();
        }, 0);
      };

      const processAutoPageBreak = () => {
        if (safeText.trim() === '') {
          setShowAutoPageBreakConfirm(false);
          return;
        }

        const splitByEOF = safeText.split('[EOF]');
        let targetText = splitByEOF[0];
        const eofText = splitByEOF.length > 1 ? '\n\n[EOF]' + splitByEOF[1] : '';

        // 既存の改ページ記号を完全に削除
        const linesBefore = targetText.split('\n');
        const cleanedLines = linesBefore.filter(line => {
          const trimmed = line.trim();
          return !/^(?:===|---+|ーーー|—-|——)$/.test(trimmed);
        });
        
        targetText = cleanedLines.join('\n');
        targetText = targetText.replace(/\n{3,}/g, '\n\n').trim();

        const lines = targetText.split('\n');
        const newLines = [];
        
        const isReport = mode === 'report';
        const isStrict = autoPageBreakMode === 'strict';
        
        // 単位を「1行の高さ」とし、1ページに入る最大行数を設定（行ズレ防止のため安全マージンを取る）
        const maxWeight = isReport ? (logoText ? 31.0 : 34.0) : (logoText ? 9.0 : 10.5); 
        const charPerLine = isReport ? 38 : 30; 
        
        let breakMark = '---';
        if (slideBreakMode === 'hr_eq') breakMark = '===';
        else if (slideBreakMode === 'hr_jp') breakMark = 'ーーー';
        else if (slideBreakMode === 'hr_dash') breakMark = '—-';
        else if (mode === 'report') breakMark = '===';

        const getDisplayLength = (str) => {
          let len = 0;
          for (let k = 0; k < str.length; k++) {
            len += str.charCodeAt(k) > 255 ? 1 : 0.55;
          }
          return len;
        };

        const forceSplitText = (text, maxLength) => {
          const result = [];
          let currentStr = '';
          let currentLen = 0;
          for (let char of text) {
            const charLen = char.charCodeAt(0) > 255 ? 1 : 0.55;
            if (currentLen + charLen > maxLength) {
              result.push(currentStr);
              currentStr = char;
              currentLen = charLen;
            } else {
              currentStr += char;
              currentLen += charLen;
            }
          }
          if (currentStr) result.push(currentStr);
          return result;
        };

        // 行を要素にパースし、それぞれの「重み（高さ）」を計算する
        const elements = [];
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          if (trimmed === '') {
            elements.push({ line, weight: 1.0, type: 'empty' });
          } else if (trimmed.match(/^!\[([^\]]*)\]\((.*?)\)$/)) {
            elements.push({ line, weight: isReport ? 12.0 : 8.0, type: 'image' });
          } else if (trimmed.match(/^#{1,4}\s/) || trimmed.match(/^[【\[].+[】\]]$/) || trimmed.match(/^第[０-９0-9一二三四五六七八九十百]+[章部節項]/)) {
            let weight = 2.5;
            if (trimmed.startsWith('# ')) weight = 3.5;
            else if (trimmed.startsWith('## ')) weight = 3.0;
            elements.push({ line, weight, type: 'heading' });
          } else if (isStrict && !trimmed.startsWith('- ') && !trimmed.startsWith('> ') && !/^\d+\.\s/.test(trimmed)) {
            // 【厳密モード】通常のテキスト段落は、折り返し文字数で強制的に複数行に分割する
            const subLines = forceSplitText(trimmed, charPerLine);
            subLines.forEach((sub, idx) => {
              elements.push({ line: sub, weight: 1.0, type: 'text_part', isLast: idx === subLines.length - 1 });
            });
          } else {
            // リスト、引用、または文意モードでのテキスト段落
            const content = trimmed.replace(/^(?:-\s+|\d+\.\s+|> \s*)/, '');
            const len = getDisplayLength(content);
            const linesCount = Math.max(1, Math.ceil(len / charPerLine));
            let weight = linesCount;
            if (trimmed.startsWith('- ') || /^\d+\.\s/.test(trimmed)) weight += 0.2; // リスト間マージン
            else if (trimmed.startsWith('> ')) weight += 1.0; // 引用マージン
            else weight += 1.0; // 段落マージン
            
            elements.push({ line, weight, type: 'block' });
          }
        }

        let currentWeight = 0;
        for (let i = 0; i < elements.length; i++) {
          const el = elements[i];

          // ページ先頭の空行は無視
          if (currentWeight === 0 && el.type === 'empty') continue;

          let shouldBreak = false;

          // 1. 容量オーバーによる改ページ
          if (currentWeight > 0 && currentWeight + el.weight > maxWeight) {
            shouldBreak = true;
          } 
          // 2. 【文意モード】見出しの繰り上げ判定（先読み）
          else if (!isStrict && el.type === 'heading') {
            let nextWeight = 0;
            let j = i + 1;
            // 次の要素（空行を飛ばして本文を見つける）の重みを加算
            while (j < elements.length && elements[j].type === 'empty') {
              nextWeight += elements[j].weight;
              j++;
            }
            if (j < elements.length) {
              nextWeight += elements[j].weight;
            }
            // 見出し + 次の本文 が収まらない場合、見出しごと次ページへ繰り上げる
            if (currentWeight > 0 && currentWeight + el.weight + nextWeight > maxWeight) {
              shouldBreak = true;
            }
          }

          if (shouldBreak) {
             // 改ページ前の余分な空行を削除
             while (newLines.length > 0 && newLines[newLines.length - 1].trim() === '') {
                newLines.pop();
             }
             
             // 改ページを挿入
             newLines.push('');
             newLines.push(breakMark);
             newLines.push('');
             currentWeight = 0;
             
             // 空行が原因で改ページになった場合は次ページ先頭から排除
             if (el.type === 'empty') {
               continue;
             }
          }

          newLines.push(el.line);
          currentWeight += el.weight;
          
          // 厳密モードで分割された段落の最後の場合、段落マージンを足す
          if (isStrict && el.type === 'text_part' && el.isLast) {
            currentWeight += 0.5;
          }
        }

        let formattedText = newLines.join('\n').replace(/\n{3,}/g, '\n\n');

        setText(formattedText.trim() + eofText);
        setShowAutoPageBreakConfirm(false);
      };

      const processAutoFormat = () => {
        if (safeText.trim() === '') {
          setShowAutoFormatConfirm(false);
          return;
        }

        const splitByEOF = safeText.split('[EOF]');
        let targetText = splitByEOF[0];
        const eofText = splitByEOF.length > 1 ? '\n\n[EOF]' + splitByEOF[1] : '';

        // 連続する空行を整理
        targetText = targetText.replace(/\n{3,}/g, '\n\n');
        let lines = targetText.split('\n');
        
        if (autoFormatMode === 'clear') {
          lines = lines.map(line => {
            const trimmed = line.trim();
            // 区切り線を削除
            if (/^(?:===|---+|ーーー|—-|——)$/.test(trimmed)) return '';
            
            let cleanLine = trimmed;
            
            // 画像記号はそのまま維持
            if (/^!\[([^\]]*)\]\((.*?)\)$/.test(cleanLine)) {
              return cleanLine;
            }
            
            // 行頭の見出しや引用は削除
            cleanLine = cleanLine.replace(/^(?:#+\s+|> \s*)/, '');
            
            // リスト記号は後で復元できるように統一マーカーに一時変換
            if (/^(?:-\s+|\d+\.\s+|[・■●○◎◆◇]\s*|\(\d+\)\s*|[①②③④⑤⑥⑦⑧⑨⑩]\s*)/.test(cleanLine)) {
              cleanLine = '___LIST_ITEM___ ' + cleanLine.replace(/^(?:-\s+|\d+\.\s+|[・■●○◎◆◇]\s*|\(\d+\)\s*|[①②③④⑤⑥⑦⑧⑨⑩]\s*)/, '').trim();
            }
            
            // インライン装飾（太字・斜体）を削除
            cleanLine = cleanLine.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1');
            return cleanLine;
          });
          
          targetText = lines.join('\n').replace(/\n{3,}/g, '\n\n');
          lines = targetText.split('\n');
        }
        
        let isFirstContentLine = true;
        let inList = false;
        let listCounter = 1;
        
        const newLines = lines.map((line, index) => {
          const trimmed = line.trim();
          
          if (!trimmed) {
             inList = false;
             listCounter = 1;
             return line;
          }
          
          // 区切り線はそのまま維持し、リスト状態をリセット
          if (/^(?:===|---+|ーーー|—-|——)$/.test(trimmed)) {
             inList = false;
             isFirstContentLine = false;
             return trimmed;
          }

          // すでにMarkdown見出しの場合
          if (/^#+\s/.test(trimmed)) {
             inList = false;
             listCounter = 1;
             isFirstContentLine = false;
             return trimmed; 
          }
          
          // 画像記法の場合
          if (/^!\[([^\]]*)\]\((.*?)\)$/.test(trimmed)) {
             inList = false;
             listCounter = 1;
             isFirstContentLine = false;
             return line; 
          }

          // 見出しの判定と変換
          const bracketMatch = trimmed.match(/^[【\[]([^】\]]+)[】\]]$/);
          let isHeading = false;
          let headingText = trimmed;

          if (bracketMatch) {
            headingText = bracketMatch[1].trim();
            isHeading = true;
          } else if (/^第[０-９0-9一二三四五六七八九十百]+[章部節項]/.test(trimmed)) {
            isHeading = true;
          } else {
            // 短くて句点で終わらない行で、前後のどちらかが空行なら見出しと推測
            const prevLine = index > 0 ? lines[index - 1].trim() : '';
            const nextLine = index < lines.length - 1 ? lines[index + 1].trim() : '';
            if (trimmed.length > 0 && trimmed.length <= 35 && !/[。！？.!?]$/.test(trimmed) && !inList) {
               if (isFirstContentLine || (prevLine === '' && nextLine === '')) {
                   isHeading = true;
               }
            }
          }

          if (isHeading) {
            inList = false;
            listCounter = 1;
            const prefix = isFirstContentLine ? '# ' : '## ';
            isFirstContentLine = false;
            return prefix + headingText;
          }

          // リストの判定 (元の記号を読み取って統一的に番号リストにする)
          let isListItem = false;
          let content = trimmed;

          if (autoFormatMode === 'clear') {
            if (/^___LIST_ITEM___\s/.test(trimmed)) {
              isListItem = true;
              content = trimmed.replace(/^___LIST_ITEM___\s*/, '').trim();
            }
          } else {
            const listMatch = trimmed.match(/^(?:[-*+]|\d+[\.．\)]|\(\d+\)|[・■●○◎◆◇①②③④⑤⑥⑦⑧⑨⑩])\s*(.+)$/);
            if (listMatch) {
              isListItem = true;
              content = listMatch[1];
            }
          }
          
          if (isListItem) {
             isFirstContentLine = false;
             inList = true;
             const res = `${listCounter}. ${content}`;
             listCounter++;
             return res;
          }

          // リスト記号はないが、直前がリストで、この行も短くて句点がない場合はリストの続きとみなす（文脈の読み取り）
          if (inList && trimmed.length <= 40 && !/[。！？.!?]$/.test(trimmed)) {
             const res = `${listCounter}. ${trimmed}`;
             listCounter++;
             return res;
          }

          // それ以外は通常の段落
          inList = false;
          listCounter = 1;
          isFirstContentLine = false;
          return line;
        });

        let formattedText = newLines.join('\n');
        setText(formattedText + eofText);
        setShowAutoFormatConfirm(false);
      };

      const handleImageUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            // キャンバスを使って画像をリサイズ・圧縮し、ブラウザのフリーズを防ぐ
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1280;
            const MAX_HEIGHT = 1280;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            // JPEGとして品質0.8で出力し、ファイルサイズを削減
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);

            const textarea = textareaRef.current;
            if (!textarea) return;

            const startPos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;
            const fileName = file.name.split('.')[0] || '画像';
            const imageMarkdown = `\n![${fileName}](${compressedBase64})\n`;
            
            const currentText = safeText;
            const newText = currentText.substring(0, startPos) + imageMarkdown + currentText.substring(endPos);
            setText(newText);
            
            setTimeout(() => {
              textarea.selectionStart = textarea.selectionEnd = startPos + imageMarkdown.length;
              textarea.focus();
            }, 0);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = '';
      };

      const processFileUpload = async (file) => {
        const fileType = file.name.split('.').pop().toLowerCase();

        try {
          if (fileType === 'txt' || fileType === 'md') {
            const reader = new FileReader();
            reader.onload = (e) => setText(e.target.result);
            reader.readAsText(file);
          } else if (fileType === 'html' || fileType === 'htm') {
            const reader = new FileReader();
            reader.onload = (e) => {
              const parser = new DOMParser();
              const doc = parser.parseFromString(e.target.result, 'text/html');
              let extractedText = doc.body.textContent || '';
              extractedText = extractedText.replace(/\n\s*\n/g, '\n\n').trim();
              setText(extractedText);
            };
            reader.readAsText(file);
          } else if (fileType === 'docx') {
            if (!window.mammoth) {
              alert("Word読み込みライブラリを準備中です。少し待ってから再度お試しください。");
              return;
            }
            const reader = new FileReader();
            reader.onload = async (e) => {
              const arrayBuffer = e.target.result;
              try {
                const result = await window.mammoth.extractRawText({ arrayBuffer });
                setText(result.value);
              } catch (err) {
                console.error("Mammoth Error:", err);
                alert("Wordファイルの読み込みに失敗しました。");
              }
            };
            reader.readAsArrayBuffer(file);
          } else {
            alert("対応していないファイル形式です。.txt, .md, .html, または .docx を選択してください。");
          }
        } catch (error) {
          console.error("File Read Error:", error);
          alert("ファイルの読み込み中にエラーが発生しました。");
        }
      };

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        if (safeText.trim() !== '') {
          setPendingUploadFile(file);
          setShowUploadConfirm(true);

                    <hr className="my-8" />

                    <h3 className="text-xl font-bold text-indigo-900 border-b border-indigo-100 pb-2">2. 便利な機能</h3>

                    <h4 className="font-bold text-gray-800 mt-6">ファイルを読み込む</h4>
                    <p>テキストファイルやWordファイルなどを直接エディタに読み込むことができます。</p>
                    <ol className="list-decimal pl-6 space-y-1">
                      <li>左サイドバーにある <strong>「ファイル読込」</strong> ボタンをクリックします。</li>
                      <li>読み込みたいファイル（.txt, .md, .html, .docx）を選択します。</li>
                      <li>エディタに文章が自動で抽出されます。</li>
                    </ol>

                    <h4 className="font-bold text-gray-800 mt-6">画像を挿入する</h4>
                    <p>エディタ内のカーソルがある位置に画像を挿入できます。</p>
                    <ol className="list-decimal pl-6 space-y-1">
                      <li>エディタ上部の <strong>「画像」</strong> ボタンをクリックします。</li>
                      <li>挿入したい画像ファイルを選択します。</li>
                      <li>自動的に適切なサイズに圧縮され、エディタに <code>![画像](...)</code> という特殊な文字列が挿入されます（右側のプレビューには画像として表示されます）。</li>
                    </ol>

                    <h4 className="font-bold text-gray-800 mt-6">ロゴを表示する</h4>
                    <p>全ページ（またはスライド）の右下に共通の文字を表示できます。</p>
                    <ul className="list-disc pl-6 space-y-1">
                      <li>左サイドバーの <strong>「ロゴ」</strong> 入力欄に、社名や日付などを入力すると全ページに反映されます。</li>
                    </ul>

                    <hr className="my-8" />

                    <h3 className="text-xl font-bold text-indigo-900 border-b border-indigo-100 pb-2">3. 自動化ツール（魔法のステッキ）</h3>
                    <p>手作業で文字を装飾したり改ページを入れるのが面倒な場合、DocCraftが自動でレイアウトを整えます。エディタ上部のツールバーに用意されています。</p>

                    <h4 className="font-bold text-gray-800 mt-6">🪄 自動装飾</h4>
                    <p>テキストの内容をAI（プログラム）が読み取り、見出しや箇条書きを推測して自動で装飾記号を付与します。</p>
                    <ul className="list-disc pl-6 space-y-1">
                      <li><strong>「現在の文体を活かす」</strong>: 今ある「・」などの記号を尊重して綺麗なリストに変換します。</li>
                      <li><strong>「一度全ての装飾をクリア」</strong>: ゴチャゴチャになってしまった装飾を一度リセットして、最初から推測し直します。</li>
                    </ul>

                    <h4 className="font-bold text-gray-800 mt-6">📚 自動改ページ</h4>
                    <p>文章が1ページ（または1スライド）に収まりきらない場合、ちょうど良い長さで自動的に改ページ記号を挿入します。</p>
                    <ul className="list-disc pl-6 space-y-1">
                      <li><strong>「文意で区切る」</strong>: 見出しの前など、キリの良いところで余裕を持ってページを分割します（推奨）。</li>
                      <li><strong>「行数で厳密に区切る」</strong>: ページの限界まで文字を詰め込んでから分割します。</li>
                    </ul>

                    <hr className="my-8" />

                    <h3 className="text-xl font-bold text-indigo-900 border-b border-indigo-100 pb-2">4. 文字の装飾方法（Markdown記法）</h3>
                    <p>DocCraftは「Markdown（マークダウン）」という記法に対応しています。エディタ上部の <strong>「✎ 装飾」</strong> プルダウンから選ぶか、直接記号を入力することで文字を装飾できます。</p>

                    <div className="overflow-x-auto my-6 border border-gray-200 rounded-lg">
                      <table className="min-w-full text-sm text-left m-0">
                        <thead className="bg-gray-100 text-gray-700">
                          <tr>
                            <th className="px-4 py-3 border-b border-gray-200 font-bold w-1/4">装飾の種類</th>
                            <th className="px-4 py-3 border-b border-gray-200 font-bold w-1/3">入力方法</th>
                            <th className="px-4 py-3 border-b border-gray-200 font-bold">プレビュー画面での見た目</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-200 bg-white">
                          <tr><td className="px-4 py-3 font-medium">大見出し</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200"># 見出しテキスト</code></td><td className="px-4 py-3 text-gray-600">一番大きな太字（タイトルなど）</td></tr>
                          <tr><td className="px-4 py-3 font-medium">中見出し</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">## 見出しテキスト</code></td><td className="px-4 py-3 text-gray-600">下線付きの大きな太字（章の区切りなど）</td></tr>
                          <tr><td className="px-4 py-3 font-medium">小見出し</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">### 見出しテキスト</code></td><td className="px-4 py-3 text-gray-600">少し大きな太字</td></tr>
                          <tr><td className="px-4 py-3 font-medium">微小見出し</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">#### 見出しテキスト</code></td><td className="px-4 py-3 text-gray-600">太字</td></tr>
                          <tr><td className="px-4 py-3 font-medium">箇条書きリスト</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">- リストの項目</code></td><td className="px-4 py-3 text-gray-600">黒丸（・）の箇条書き</td></tr>
                          <tr><td className="px-4 py-3 font-medium">番号付きリスト</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">1. リストの項目</code></td><td className="px-4 py-3 text-gray-600">数字（1. 2. 3.）の箇条書き</td></tr>
                          <tr><td className="px-4 py-3 font-medium">引用</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">&gt; 引用テキスト</code></td><td className="px-4 py-3 text-gray-600">縦線が入った斜体のテキスト</td></tr>
                          <tr><td className="px-4 py-3 font-medium">太字</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">**太くしたい文字**</code></td><td className="px-4 py-3 text-gray-600"><strong>太字</strong></td></tr>
                          <tr><td className="px-4 py-3 font-medium">改ページ / スライド分割</td><td className="px-4 py-3"><code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">---</code> または <code className="bg-slate-100 px-1.5 py-0.5 rounded text-pink-600 border border-slate-200">===</code></td><td className="px-4 py-3 text-gray-600">ここでページ（スライド）が切り替わります</td></tr>
                        </tbody>
                      </table>
                    </div>

                    <div className="bg-amber-50 border-l-4 border-amber-400 p-4 my-6 rounded-r-md">
                      <p className="m-0"><strong className="text-amber-800">💡 ヒント:</strong> 「✎ 装飾」プルダウンを使うと、カーソルがある行に自動で記号をつけたり、逆に記号を消したりすることができます。</p>
                    </div>

                    <hr className="my-8" />

                    <h3 className="text-xl font-bold text-indigo-900 border-b border-indigo-100 pb-2">5. その他の機能</h3>
                    <ul className="list-disc pl-6 space-y-2 mt-4">
                      <li><strong>💾 自動保存機能</strong>: エディタに入力したテキストや、選択したレイアウト・カラー設定はブラウザに自動的に保存されます。一度画面を閉じても、右上の「初期化」ボタンを押してリセットするまでは前回の状態が維持されます。</li>
                      <li><strong>区切り設定</strong>: 左サイドバーの「区切り」から、どの記号（<code>---</code> や <code>#</code> など）で改ページを行うかを変更できます。デフォルトは <code>---</code> です。</li>
                      <li><strong>🚫 非表示タグ</strong>: エディタ内で <code>[EOF]</code> と入力された行以降のテキストは、プレビューや出力ファイルに一切反映されません。メモ書きや一時保存の文章を残しておくのに便利です（エディタ上部の「非表示」ボタンからも挿入可能）。</li>
                      <li><strong>現在位置のハイライト</strong>: エディタ内をクリックすると、カーソルがある行の左端に「▶」が表示され、行全体が青くハイライトされるため、今どこを編集しているかがすぐに分かります。</li>
                    </ul>
                  </div>
                </div>
                
                <div className="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end shrink-0">
                  <button 
                    onClick={() => setShowManual(false)}
                    className="px-6 py-2.5 text-sm font-bold text-white bg-indigo-600 rounded-md hover:bg-indigo-700 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

          {showSampleConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">サンプルの読み込み</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">
                  現在のテキストが消去され、サンプルデータで上書きされます。よろしいですか？
                </p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowSampleConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={() => {
                      setText(defaultText);
                      setShowSampleConfirm(false);
                    }}
                    className="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 transition-colors"
                  >
                    上書きする
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAutoPageBreakConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">自動改ページの確認</h3>
                <p className="text-sm text-gray-600 mb-4 leading-relaxed">
                  テキストの長さを見積もり、1ページ（または1スライド）に収まるように自動的に改ページ記号を挿入します。
                </p>
                <div className="flex flex-col gap-3 mb-6 bg-slate-50 p-4 rounded-md border border-slate-200">
                  <label className="flex items-center gap-3 cursor-pointer">
                    <input 
                      type="radio" 
                      name="pageBreakMode" 
                      value="context" 
                      checked={autoPageBreakMode === 'context'} 
                      onChange={() => setAutoPageBreakMode('context')} 
                      className="text-indigo-600 focus:ring-indigo-500 w-4 h-4"
                    />
                    <span className="text-sm text-gray-700 font-medium">文意で区切る（見出し前などで分割）</span>
                  </label>
                  <label className="flex items-center gap-3 cursor-pointer">
                    <input 
                      type="radio" 
                      name="pageBreakMode" 
                      value="strict" 
                      checked={autoPageBreakMode === 'strict'} 
                      onChange={() => setAutoPageBreakMode('strict')} 
                      className="text-indigo-600 focus:ring-indigo-500 w-4 h-4"
                    />
                    <span className="text-sm text-gray-700 font-medium">行数で厳密に区切る（限界まで詰める）</span>
                  </label>
                </div>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowAutoPageBreakConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={processAutoPageBreak}
                    className="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors"
                  >
                    実行する
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAutoFormatConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">自動装飾の確認</h3>
                <p className="text-sm text-gray-600 mb-4 leading-relaxed">
                  テキストの内容を自動で解析し、タイトルやサブタイトルに見出し記号（#）を付与してフォントサイズやレイアウトを最適化します。よろしいですか？
                </p>
                <div className="flex flex-col gap-3 mb-6 bg-slate-50 p-4 rounded-md border border-slate-200">
                  <label className="flex items-center gap-3 cursor-pointer">
                    <input 
                      type="radio" 
                      name="formatMode" 
                      value="context" 
                      checked={autoFormatMode === 'context'} 
                      onChange={() => setAutoFormatMode('context')} 
                      className="text-indigo-600 focus:ring-indigo-500 w-4 h-4"
                    />
                    <span className="text-sm text-gray-700 font-medium">現在の文体を活かす（既存の装飾を尊重）</span>
                  </label>
                  <label className="flex items-center gap-3 cursor-pointer">
                    <input 
                      type="radio" 
                      name="formatMode" 
                      value="clear" 
                      checked={autoFormatMode === 'clear'} 
                      onChange={() => setAutoFormatMode('clear')} 
                      className="text-indigo-600 focus:ring-indigo-500 w-4 h-4"
                    />
                    <span className="text-sm text-gray-700 font-medium">一度全ての装飾をクリアして再構築する</span>
                  </label>
                </div>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowAutoFormatConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={processAutoFormat}
                    className="px-4 py-2 text-sm font-medium text-white bg-amber-500 rounded-md hover:bg-amber-600 transition-colors"
                  >
                    実行する
                  </button>
                </div>
              </div>
            </div>
          )}

          {showResetConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">初期化の確認</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">テキストの内容と選択したテーマ・カラー設定をすべて初期状態（デフォルト）に戻しますか？この操作は取り消せません。</p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowResetConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={handleFullReset}
                    className="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700 transition-colors"
                  >
                    リセットする
                  </button>
                </div>
              </div>
            </div>
          )}

          {showClearConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">テキストの消去</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">エディタの内容をすべて消去しますか？この操作は取り消せません。</p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => setShowClearConfirm(false)}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={() => {
                      setText('');
                      setShowClearConfirm(false);
                      setTimeout(() => textareaRef.current?.focus(), 0);
                    }}
                    className="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700 transition-colors"
                  >
                    消去する
                  </button>
                </div>
              </div>
            </div>
          )}

          {showUploadConfirm && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 border border-gray-100">
                <h3 className="text-lg font-bold mb-3 text-gray-800">ファイル読み込みの確認</h3>
                <p className="text-sm text-gray-600 mb-6 leading-relaxed">現在のテキストが消去され、ファイルの内容で上書きされます。よろしいですか？</p>
                <div className="flex justify-end gap-3">
                  <button 
                    onClick={() => {
                      setShowUploadConfirm(false);
                      setPendingUploadFile(null);
                    }}
                    className="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200 transition-colors"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={() => {
                      if (pendingUploadFile) {
                        processFileUpload(pendingUploadFile);
                      }
                      setShowUploadConfirm(false);
                      setPendingUploadFile(null);
                    }}
                    className="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 transition-colors"
                  >
                    上書きする
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    try {
      if (ReactDOM.createRoot) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
      } else {
        ReactDOM.render(<ErrorBoundary><App /></ErrorBoundary>, rootElement);
      }
    } catch (e) {
      rootElement.innerHTML = '<div style="padding: 20px; color: red;">アプリケーションの起動に失敗しました: ' + e.message + '</div>';
      console.error(e);
    }
  </script>
</body>
</html>
