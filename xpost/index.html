<!-- Chosen Palette: Slate Blue & Warm Gray -->
<!-- Application Structure Plan: Single-page React application for viewing, filtering, searching, and exploring Prime Minister X posts (Read-Only Mode for Public Security). -->
<!-- Visualization & Content Choices: Interactive data card grid, pagination, detailed view modal, search & filter controls, header update date, and footer access timestamp. NO SVG graphics used. NO Mermaid JS used. -->
<!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首相官邸Xビューワー</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebaseの設定 -->
  <script>
    const __firebase_config = JSON.stringify({
      apiKey: "AIzaSyA7dp6nU6M6YkqaR4cZQfvQ3bRgtZeY1CY",
      authDomain: "xpost-942ed.firebaseapp.com",
      projectId: "xpost-942ed",
      storageBucket: "xpost-942ed.firebasestorage.app",
      messagingSenderId: "344400516416",
      appId: "1:344400516416:web:2cfda7f42a970dedc096a5",
      measurementId: "G-3V0YP0Z3QS"
    });
  </script>

  <!-- Firebase SDK のモジュールインポート -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
      }
    }
  </script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <!-- アプリケーションのコード -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from 'firebase/app';
    import { getFirestore, doc, onSnapshot, collection } from 'firebase/firestore';

    const { useState, useEffect } = React;

    // Firebase 初期化
    let app, db;
    try {
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Firebase config initialization error:", e);
    }

    const isTwitterUrl = (url) => {
      if (!url) return false;
      return url.includes('twitter.com') || url.includes('x.com');
    };

    // 日時文字列から日付（YYYY/MM/DD等）のみを抽出するヘルパー
    const formatDateOnly = (dateStr) => {
      if (!dateStr) return '未設定';
      const match = dateStr.match(/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}/);
      if (match) return match[0];
      return dateStr.split(' ')[0] || dateStr;
    };

    function PrimeMinisterXViewer() {
      const [posts, setPosts] = useState([]);
      const [selectedPost, setSelectedPost] = useState(null);
      
      const [lastUpdatedTime, setLastUpdatedTime] = useState('');
      const [accessTime, setAccessTime] = useState('');

      const [selectedCategory, setSelectedCategory] = useState('すべて');
      const [selectedEvaluation, setSelectedEvaluation] = useState('すべて');
      const [searchDate, setSearchDate] = useState('');
      const [searchKeyword, setSearchKeyword] = useState('');
      const [sortOrder, setSortOrder] = useState('desc');
      
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 15;

      // アクセス日時の設定（リアルタイム）
      useEffect(() => {
        const now = new Date();
        const formattedDate = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        setAccessTime(formattedDate);
      }, []);

      const categories = ['すべて', ...Array.from(new Set(posts.map(p => p.category).filter(Boolean)))];
      const evaluations = ['すべて', ...Array.from(new Set(posts.map(p => p.evaluation).filter(Boolean)))];

      const processedPosts = posts
        .filter(post => {
          const matchCategory = selectedCategory === 'すべて' || post.category === selectedCategory;
          const matchEvaluation = selectedEvaluation === 'すべて' || post.evaluation === selectedEvaluation;
          const matchDate = searchDate === '' || (post.date && post.date.startsWith(searchDate));
          
          const keyword = searchKeyword.toLowerCase();
          const matchKeyword = keyword === '' || (
            (post.title && post.title.toLowerCase().includes(keyword)) ||
            (post.text && post.text.toLowerCase().includes(keyword)) ||
            (post.category && post.category.toLowerCase().includes(keyword)) ||
            (post.evaluation && post.evaluation.toLowerCase().includes(keyword)) ||
            (post.postType && post.postType.toLowerCase().includes(keyword)) ||
            (post.date && post.date.toLowerCase().includes(keyword))
          );

          return matchCategory && matchEvaluation && matchDate && matchKeyword;
        })
        .sort((a, b) => {
          const dateA = new Date(a.date);
          const dateB = new Date(b.date);
          return sortOrder === 'desc' ? dateB - dateA : dateA - dateB;
        });

      useEffect(() => {
        setCurrentPage(1);
      }, [selectedCategory, selectedEvaluation, searchDate, searchKeyword, sortOrder]);

      const totalPages = Math.ceil(processedPosts.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const currentPosts = processedPosts.slice(startIndex, endIndex);

      // Twitter 埋め込み用スクリプト読み込み
      useEffect(() => {
        const script = document.createElement("script");
        script.src = "https://platform.twitter.com/widgets.js";
        script.async = true;
        script.charset = "utf-8";
        document.body.appendChild(script);
      }, []);

      useEffect(() => {
        if (selectedPost && window.twttr) {
          setTimeout(() => {
            if (window.twttr && window.twttr.widgets) {
              window.twttr.widgets.load();
            }
          }, 100);
        }
      }, [selectedPost]);

      // Firestore リアルタイム取得（読み込みのみ）
      useEffect(() => {
        if (!db) return;

        try {
          const postsRef = collection(db, 'x_posts');
          const unsubscribePosts = onSnapshot(postsRef, (snapshot) => {
            const fetchedPosts = [];
            snapshot.forEach(doc => {
              fetchedPosts.push({ id: doc.id, ...doc.data() });
            });
            setPosts(fetchedPosts);
          }, (error) => {
            console.error("Firestore取得エラー:", error);
          });

          // 最終更新日時の取得
          const metaRef = doc(db, 'x_posts_meta', 'info');
          const unsubscribeMeta = onSnapshot(metaRef, (docSnap) => {
            if (docSnap.exists() && docSnap.data().lastUpdated) {
              setLastUpdatedTime(docSnap.data().lastUpdated);
            }
          });

          return () => {
            unsubscribePosts();
            unsubscribeMeta();
          };
        } catch(e) {
          console.warn("Firestore listener failed:", e);
        }
      }, [db]);

      const handleClearFilters = () => {
        setSelectedCategory('すべて');
        setSelectedEvaluation('すべて');
        setSearchDate('');
        setSearchKeyword('');
        setSortOrder('desc');
        setCurrentPage(1);
      };

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 font-sans p-4 md:p-8 flex flex-col justify-between">
          <div className="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden w-full">
            
            {/* ヘッダー：items-end により右下の底面にバッジを配置 */}
            <header className="bg-blue-900 text-white p-6 border-b border-blue-800 flex flex-col md:flex-row md:items-end justify-between gap-4">
              <div>
                <h1 className="text-2xl md:text-3xl font-bold flex items-center">
                  <span className="mr-3 text-2xl">𝕏</span>
                  高市首相 X投稿アーカイブ
                </h1>
                <p className="mt-2 text-blue-100 text-sm">
                  高市首相の過去のX投稿を閲覧・検索できる公開アーカイブログです。
                </p>
                <p className="mt-1 text-blue-200/90 text-xs md:text-sm">
                  なお、区分や評価は一般社団法人日本みらい研の独自分析です。
                </p>
              </div>

              {/* 右下に下揃えで配置 */}
              <div className="flex-shrink-0 flex flex-col items-start md:items-end justify-end gap-2 text-xs md:self-end">
                <span className="text-blue-200/90 font-medium bg-blue-800/60 px-3 py-1.5 rounded-md border border-blue-700/50">
                  データ更新日: {formatDateOnly(lastUpdatedTime)}
                </span>
              </div>
            </header>

            {/* 検索・フィルターエリア */}
            <div className="bg-gray-50 border-b border-gray-200 p-4 sm:p-6 flex flex-wrap items-end gap-4 shadow-sm relative z-10">
              <div className="flex-1 min-w-[200px]">
                <label className="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wider">語句で検索</label>
                <input
                  type="text"
                  placeholder="タイトルや本文を検索..."
                  value={searchKeyword}
                  onChange={(e) => setSearchKeyword(e.target.value)}
                  className="w-full px-3 h-[34px] border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none text-sm shadow-sm transition-shadow box-border"
                />
              </div>
              
              <div className="w-full sm:w-auto">
                <label className="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wider">日付で検索</label>
                <input 
                  type="date" 
                  value={searchDate}
                  onChange={(e) => setSearchDate(e.target.value)}
                  className="w-full sm:w-[150px] border border-gray-300 rounded-md px-3 h-[34px] focus:ring-blue-500 focus:border-blue-500 outline-none text-sm shadow-sm transition-shadow box-border"
                />
              </div>

              <div className="w-full sm:w-auto">
                <label className="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wider">表示順</label>
                <select 
                  value={sortOrder}
                  onChange={(e) => setSortOrder(e.target.value)}
                  className="w-full sm:w-[150px] border border-gray-300 rounded-md px-3 h-[34px] focus:ring-blue-500 focus:border-blue-500 outline-none bg-white text-sm shadow-sm transition-shadow box-border"
                >
                  <option value="desc">新しい日時順</option>
                  <option value="asc">古い日時順</option>
                </select>
              </div>

              <div className="w-full sm:w-auto">
                 <label className="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wider">区分で絞り込み</label>
                 <select 
                   value={selectedCategory} 
                   onChange={(e) => setSelectedCategory(e.target.value)}
                   className="w-full sm:w-[160px] border border-gray-300 rounded-md px-3 h-[34px] focus:ring-blue-500 focus:border-blue-500 outline-none bg-white text-sm shadow-sm transition-shadow box-border"
                 >
                   {categories.map(cat => (
                     <option key={cat} value={cat}>{cat}</option>
                   ))}
                 </select>
              </div>

              <div className="w-full sm:w-auto">
                 <label className="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wider">評価で絞り込み</label>
                 <select 
                   value={selectedEvaluation} 
                   onChange={(e) => setSelectedEvaluation(e.target.value)}
                   className="w-full sm:w-[140px] border border-gray-300 rounded-md px-3 h-[34px] focus:ring-blue-500 focus:border-blue-500 outline-none bg-white text-sm shadow-sm transition-shadow box-border"
                 >
                   {evaluations.map(ev => (
                     <option key={ev} value={ev}>{ev}</option>
                   ))}
                 </select>
              </div>
              
              <div className="w-full sm:w-auto">
                <button
                  onClick={handleClearFilters}
                  className="w-full sm:w-auto bg-white border border-gray-300 text-gray-600 hover:bg-gray-100 hover:text-gray-900 px-4 h-[34px] rounded-md text-sm font-medium transition-colors shadow-sm flex items-center justify-center box-border"
                >
                  クリア
                </button>
              </div>
            </div>

            {/* コンテンツ一覧 */}
            <div className="p-0 sm:p-4">
              <div className="flex justify-between items-center px-4 sm:px-2 py-3 border-b sm:border-none border-gray-200">
                <div className="text-sm text-gray-500 font-medium">
                  全 <span className="text-gray-900 font-bold">{processedPosts.length}</span> 件
                  {processedPosts.length > 0 && `中 ${startIndex + 1} - ${Math.min(endIndex, processedPosts.length)}件目を表示`}
                </div>
              </div>
              
              {currentPosts.length > 0 ? (
                <div className="grid gap-4 sm:gap-6 mt-2">
                  {currentPosts.map(post => (
                    <div 
                      key={post.id} 
                      className="bg-white p-5 rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-all cursor-pointer flex flex-col md:flex-row gap-4 group"
                      onClick={() => setSelectedPost(post)}
                    >
                      <div className="flex-shrink-0 flex md:flex-col items-center md:items-start gap-3 md:w-48">
                         <div className="flex flex-col">
                            <div className="text-sm text-gray-500 font-medium flex items-center">
                               📅 {post.date}
                            </div>
                            <div className="flex flex-wrap gap-2 mt-2">
                              {post.category && (
                                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                  {post.category}
                                </span>
                              )}
                              {post.evaluation && (
                                <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
                                  {post.evaluation}
                                </span>
                              )}
                              {post.postType && (
                                 <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600 border border-gray-200">
                                   {post.postType}
                                 </span>
                              )}
                            </div>
                         </div>
                      </div>
                      
                      <div className="flex-grow flex flex-col">
                         {post.title && (
                           <h3 className="font-bold text-gray-900 text-lg mb-1.5 group-hover:text-blue-700 transition-colors truncate max-w-full md:max-w-xl">
                             {post.title}
                           </h3>
                         )}
                        <p className="text-gray-700 text-sm leading-relaxed line-clamp-3">
                          {post.text}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="text-center py-20 px-4 bg-white rounded-lg border border-gray-200 shadow-sm">
                  <h3 className="mt-2 text-sm font-medium text-gray-900">表示するデータがありません</h3>
                  <p className="mt-1 text-sm text-gray-500">
                    指定された条件に一致する投稿は見つかりませんでした。
                  </p>
                </div>
              )}

              {/* ページネーション */}
              {totalPages > 1 && (
                <div className="flex items-center justify-between border-t border-gray-200 bg-white px-4 py-3 sm:px-6 mt-6 rounded-lg shadow-sm">
                  <div className="flex flex-1 justify-between sm:hidden">
                    <button
                      onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                      disabled={currentPage === 1}
                      className="relative inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50"
                    >
                      前へ
                    </button>
                    <button
                      onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                      disabled={currentPage === totalPages}
                      className="relative ml-3 inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50"
                    >
                      次へ
                    </button>
                  </div>
                  <div className="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
                    <div>
                      <p className="text-sm text-gray-700">
                        <span className="font-medium">{totalPages}</span> ページ中 <span className="font-medium text-blue-600">{currentPage}</span> ページ目を表示
                      </p>
                    </div>
                    <div>
                      <nav className="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
                        <button
                          onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                          disabled={currentPage === 1}
                          className="relative inline-flex items-center rounded-l-md px-3 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 disabled:opacity-50"
                        >
                          前へ
                        </button>
                        <span className="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-gray-700 ring-1 ring-inset ring-gray-300">
                          {currentPage} / {totalPages}
                        </span>
                        <button
                          onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))}
                          disabled={currentPage === totalPages}
                          className="relative inline-flex items-center rounded-r-md px-3 py-2 text-gray-400 ring-1 ring-inset ring-gray-300 hover:bg-gray-50 disabled:opacity-50"
                        >
                          次へ
                        </button>
                      </nav>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* フッター */}
          <footer className="mt-8 text-center text-xs text-gray-500 border-t border-gray-200 pt-6 pb-6 w-full max-w-5xl mx-auto">
            <p className="font-bold text-gray-800 text-base md:text-lg mb-1">一般社団法人日本みらい研</p>
            <p className="text-gray-500 text-xs">アクセス日時: {accessTime || '---'}</p>
          </footer>

          {/* 詳細モーダル */}
          {selectedPost && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-60 transition-opacity">
              <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in duration-200">
                <div className="p-6 overflow-y-auto flex-grow">
                  
                  <div className="flex flex-wrap gap-2 mb-4">
                    {selectedPost.category && (
                      <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800 border border-blue-200">
                        {selectedPost.category}
                      </span>
                    )}
                    {selectedPost.evaluation && (
                      <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200">
                        {selectedPost.evaluation}
                      </span>
                    )}
                    {selectedPost.postType && (
                       <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-600 border border-gray-200">
                         {selectedPost.postType}
                       </span>
                    )}
                  </div>

                  <div className="space-y-4">
                    {selectedPost.title && (
                      <div className="border-b border-gray-100 pb-3 mb-3">
                        <h2 className="text-xl font-bold text-gray-900 leading-snug">{selectedPost.title}</h2>
                      </div>
                    )}
                    
                    <div className="text-sm text-gray-500 font-medium flex items-center mb-4">
                      📅 {selectedPost.date}
                    </div>
                    
                    <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                      <p className="text-gray-800 whitespace-pre-wrap leading-relaxed text-sm md:text-base">
                        {selectedPost.text}
                      </p>
                    </div>
                    
                    {selectedPost.url && (
                      <div className="mt-6 flex flex-col">
                        {isTwitterUrl(selectedPost.url) ? (
                           <div className="border-t border-gray-100 pt-4">
                              <h4 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                                𝕏 実際のポスト (URLから自動表示)
                              </h4>
                              <div className="flex justify-center bg-white border border-gray-200 rounded-xl p-4 min-h-[200px] overflow-hidden shadow-sm">
                                <blockquote className="twitter-tweet" data-dnt="true" data-theme="light">
                                  <a href={selectedPost.url.replace('x.com', 'twitter.com')}></a>
                                </blockquote>
                              </div>
                           </div>
                        ) : (
                          <a 
                            href={selectedPost.url} 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="inline-flex items-center w-fit text-blue-600 hover:text-blue-800 font-medium transition-colors bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-md"
                          >
                            🔗 リンク先を開く
                          </a>
                        )}
                      </div>
                    )}
                  </div>
                </div>
                
                <div className="p-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 flex-shrink-0">
                  <button
                    onClick={() => setSelectedPost(null)}
                    className="px-5 py-2 bg-blue-900 text-white rounded-md hover:bg-blue-800 font-medium transition-colors shadow-sm"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PrimeMinisterXViewer />);
  </script>
</body>
</html>
