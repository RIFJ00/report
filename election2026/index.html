edCandidates.map((cand, idx) => { const percentage = totalPredicted > 0 ? (cand.predictedVotes / totalPredicted) * 100 : 0; const partyColor = Object.entries(PARTY_COLORS).find(([k]) => cand.party.includes(k))?.[1] || DEFAULT_COLOR; const isPredictedWinner = cand.id === winnerId; return (<div key={cand.id} className={`p-4 rounded-lg border ${isPredictedWinner ? 'border-l-4 border-l-red-500 border-gray-200 bg-red-50/10' : 'border-gray-100'} ${isEditing ? 'border-blue-200 ring-1 ring-blue-100' : ''}`}><div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2 gap-2"><div className="flex items-center gap-3 w-full sm:w-auto">{isPredictedWinner && !isEditing && <div className="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded shadow-sm whitespace-nowrap">{district.type === 'proportional' ? '第1党' : '当選予測'}</div>}<div className="flex-1"><div className="flex items-center gap-2 flex-wrap">{isEditing ? <input type="text" value={cand.name} onChange={(e) => handleChange(cand.id, 'name', e.target.value)} className="border border-gray-300 rounded px-2 py-1 text-lg font-bold w-full sm:w-48" /> : <h3 className="text-lg font-bold text-gray-900">{cand.name}</h3>}<Badge color={partyColor}>{cand.party}</Badge><span className="text-sm text-gray-600">({cand.age})</span><span className="text-xs bg-gray-100 px-1.5 py-0.5 rounded text-gray-600">{cand.incumbentStatus}</span></div></div></div><div className="text-right self-end sm:self-auto">{isEditing ? <div className="flex flex-col items-end"><label className="text-xs text-gray-500 font-bold">予測得票数</label><input type="number" value={cand.predictedVotes} onChange={(e) => handleVoteChange(cand.id, e.target.value)} className="border border-gray-300 rounded px-2 py-1 text-right font-mono font-bold w-32" /></div> : <><div className="text-xl font-mono font-bold text-gray-800">{cand.predictedVotes.toLocaleString()}</div><div className="text-xs text-gray-500">予測得票率 {percentage.toFixed(1)}%</div></>}</div></div><div className="flex items-center gap-4 text-xs text-gray-600 mb-3 bg-gray-50 p-2 rounded"><div className="flex items-center gap-2"><span className="font-bold">2024結果:</span>{isEditing ? <select value={cand.status} onChange={(e) => handleChange(cand.id, 'status', e.target.value)} className="border border-gray-300 rounded px-1 py-0.5"><option value="">-</option><option value="◎">◎</option><option value="○">○</option><option value="⚪︎">⚪︎</option><option value="△">△</option><option value="▲">▲</option></select> : <span className={`font-bold ${cand.status?.includes('◎') ? 'text-red-600' : ''}`}>{cand.status || '-'}</span>}</div><div className="flex items-center gap-2"><span className="font-bold">2021結果:</span>{isEditing ? <select value={cand.status2021} onChange={(e) => handleChange(cand.id, 'status2021', e.target.value)} className="border border-gray-300 rounded px-1 py-0.5"><option value="">-</option><option value="◎">◎</option><option value="○">○</option><option value="⚪︎">⚪︎</option><option value="△">△</option><option value="▲">▲</option></select> : <span className={`font-bold ${cand.status2021?.includes('◎') ? 'text-red-600' : ''}`}>{cand.status2021 || '-'}</span>}</div><div className="flex items-center gap-2 ml-auto"><span className="font-bold">当落予測(元データ):</span>{isEditing ? <input type="text" value={cand.winningStatus} onChange={(e) => handleChange(cand.id, 'winningStatus', e.target.value)} className="border border-gray-300 rounded px-2 py-0.5 w-20" /> : <span>{cand.winningStatus || '-'}</span>}</div></div><div className="w-full bg-gray-100 rounded-full h-3 mb-4"><div className="h-3 rounded-full transition-all duration-500" style={{ width: `${percentage}%`, backgroundColor: partyColor }}></div></div><div className="mt-2 bg-white rounded border border-gray-100 overflow-hidden cursor-pointer hover:border-blue-300 hover:shadow-sm transition-all" onClick={() => setShowHistoryGraph(true)} title="クリックして推移グラフを表示"><div className="bg-gray-50 px-3 py-1 text-xs font-bold text-gray-500 flex items-center justify-between border-b border-gray-100"><span className="flex items-center gap-1"><History className="w-3 h-3" /> 過去の実績 (得票数)</span><span className="text-blue-500 flex items-center gap-1 hover:underline"><TrendingUp className="w-3 h-3"/> グラフで見る</span></div><div className="overflow-x-auto"><table className="w-full text-xs text-left"><thead><tr className="text-gray-400 border-b border-gray-50">{historyYears.map(y => <th key={y} className="py-1 px-2 font-normal whitespace-nowrap text-center">{y}</th>)}</tr></thead><tbody><tr>{historyYears.map(y => { const val = cand[`votes${y}`]; return (<td key={y} className={`py-1 px-2 font-mono whitespace-nowrap text-center ${y===2024 ? 'bg-yellow-50 font-bold' : ''}`}>{val ? val.toLocaleString() : '-'}</td>); })}</tr></tbody></table></div></div></div>); })}</div><div className="mt-8 p-4 bg-gray-50 rounded-lg border border-gray-200 text-sm text-gray-500"><h4 className="font-bold mb-2 flex items-center gap-2"><Info className="w-4 h-4" /> 分析メモ</h4><p>{district.isCloseRace ? `${editedCandidates[0].name} と ${editedCandidates[1].name} の票差が10%未満の激戦区です。` : `${editedCandidates[0].name} がリードしています。`}</p></div></div></div>{showHistoryGraph && <HistoryGraphModal candidates={editedCandidates} onClose={() => setShowHistoryGraph(false)} />}</div>);
        };

        const SimulationPanel = ({ settings, setSettings }) => {

gs.newPartyEffect > 0 ? '+' : ''}{settings.newPartyEffect}%</span></div><input type="range" min="-20" max="20" step="1" value={settings.newPartyEffect} onChange={(e) => handleChange('newPartyEffect', e.target.value)} className="w-full accent-blue-600" /><div className="flex justify-between text-[10px] text-gray-400"><span>-20%</span><span>+20%</span></div></div><div className="flex flex-col gap-1"><div className="flex justify-between text-xs font-bold text-gray-600"><span>新興躍進 (国民・参政↑ 立憲↓)</span><span className={settings.emergingSurge !== 0 ? 'text-orange-700' : ''}>+{settings.emergingSurge}%</span></div><input type="range" min="0" max="20" step="1" value={settings.emergingSurge} onChange={(e) => handleChange('emergingSurge', e.target.value)} className="w-full accent-orange-500" /><div className="flex justify-between text-[10px] text-gray-400"><span>0%</span><span>+20%</span></div></div></div></Card>
            );

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(IS_READ_ONLY); 
            const [candidates, setCandidates] = useState(() => INITIAL_MOCK_DATA);
            const [voterCounts, setVoterCounts] = useState(() => new Map(INITIAL_VOTER_COUNTS));

            const [simSettings, setSimSettings] = useState({ takaichiEffect: 0, coalitionEffect: 0, newPartyEffect: 0, emergingSurge: 0 });

                        } catch (e) { console.error("Firebase init failed:", e); }
                    }
                };
                if (isLoggedIn) loadData();
            }, [isLoggedIn]);

            // ... (helper functions omitted) ...
            const parseNumber = (val) => { if (typeof val === 'number') return val; if (!val) return null; const clean = String(val).replace(/["',]/g, ''); const num = parseFloat(clean); return isNaN(num) ? null : num; };
            const getStr = (val) => val === undefined || val === null ? "" : String(val);
            const calculateAge = (birthDateStr) => { const today = new Date(); const birthDate = new Date(birthDateStr); if (isNaN(birthDate.getTime())) return null; let age = today.getFullYear() - birthDate.getFullYear(); const m = today.getMonth() - birthDate.getMonth(); if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) { age--; } const yyyy = birthDate.getFullYear(); const mm = String(birthDate.getMonth() + 1).padStart(2, '0'); const dd = String(birthDate.getDate()).padStart(2, '0'); return `${yyyy}/${mm}/${dd} (${age}歳)`; };
            const findHeaderRow = (rows, keywords) => { for (let i = 0; i < Math.min(rows.length, 15); i++) { const row = rows[i].map(c => getStr(c)); const matchCount = keywords.filter(kw => row.some(cell => cell.includes(kw))).length; if (matchCount >= 2) return { index: i, row }; } return null; };
            const findColumnIndex = (headerRow, possibleNames, excludeNames = []) => { return headerRow.findIndex(cell => possibleNames.some(name => cell.includes(name)) && (!excludeNames || !excludeNames.some(ex => cell.includes(ex)))); };

            // ... (data processing functions omitted) ...
            const processAnalysisData = async (rows) => { /* Same as before, but ensure it's not called in read-only */
                if (IS_READ_ONLY) return;
                // ... (Implementation same as previous, using window.fb to save) ...
                if (!rows || rows.length === 0) return;
                const keyColumns = ['選挙区', '小選挙区', '政党', '党派', '名', '氏名', '候補', '候補者'];
                const headerInfo = findHeaderRow(rows, keyColumns);
                let headerRow, startRowIdx;
                if (headerInfo) { headerRow = headerInfo.row; startRowIdx = headerInfo.index + 1; } else { headerRow = rows[0].map(h => getStr(h)); startRowIdx = 1; }

                const districtIdx = findColumnIndex(headerRow, ['小選挙区', '選挙区', '選挙区名', 'District']);
                const partyIdx = findColumnIndex(headerRow, ['政党', '党派', '会派', 'Party']);
                const nameIdx = findColumnIndex(headerRow, ['候補者名', '氏名', '名前', '候補', '2024候補者', 'Name', 'Candidate']);

                const statusIdx = findColumnIndex(headerRow, ['当落', '結果', '2024'], ['得票', '候補', '予想', '基数', 'No', '年齢', '回数']); 
                const status2021Idx = findColumnIndex(headerRow, ['2021当落', '2021結果', '21当落']); 
                const winStatusIdx = findColumnIndex(headerRow, ['当落予想', '判断', '判定']);
                const ageIdx = findColumnIndex(headerRow, ['年齢', 'Age']);
                const dobIdx = findColumnIndex(headerRow, ['生年月日', '誕生日']);
                const incStatusIdx = findColumnIndex(headerRow, ['回数', '現新']);
                const voterCountIdx = findColumnIndex(headerRow, ['有権者数', '直近有権者数']);
                const typeIdx = findColumnIndex(headerRow, ['区分', 'Type']);
                const votes2024Idx = findColumnIndex(headerRow, ['2024得票数', '2024得票', '2024年得票', 'R6得票']);
                const votes2021Idx = findColumnIndex(headerRow, ['2021得票数', '2021得票', '2021年得票', 'R3得票']);
                const votes2017Idx = findColumnIndex(headerRow, ['2017得票数', '2017得票', '2017年得票', 'H29得票']);
                const votes2014Idx = findColumnIndex(headerRow, ['2014得票数', '2014得票', '2014年得票', 'H26得票']);

                if (nameIdx === -1 || (districtIdx === -1 && partyIdx === -1)) {
                    let missing = [];

                for (let i = startRowIdx; i < rows.length; i++) {

                    const nameRaw = getStr(row[nameIdx]);

                    const districtName = districtIdx !== -1 ? getStr(row[districtIdx]).replace(/"/g, '').trim() : '不明';

                        const typeVal = getStr(row[typeIdx]);
                        if (typeVal.includes('比例') || typeVal.includes('2')) { type = 'proportional'; typeFound = true; } 
                        else if (typeVal.includes('選挙区') || typeVal.includes('1')) { type = 'single'; typeFound = true; }
                    } 
                    if (!typeFound) { if (districtName.includes('比例') || districtName.includes('ブロック')) type = 'proportional'; }
                    if (voterCountIdx !== -1) {
                        const vCount = parseNumber(row[voterCountIdx]);
                        if (vCount) newVoterCounts.set(districtName.replace(/\s+/g, ''), vCount);
                    }
                    let displayAge = '';
                    const dobRaw = dobIdx !== -1 ? getStr(row[dobIdx]) : '';
                    if (dobRaw) {
                        const calculated = calculateAge(dobRaw);
                        displayAge = calculated ? calculated : (ageIdx !== -1 ? getStr(row[ageIdx]).replace(/"/g, '') : '');
                    } else {
                        displayAge = ageIdx !== -1 ? getStr(row[ageIdx]).replace(/"/g, '') : '';
                        if (displayAge && !isNaN(displayAge) && !displayAge.includes('歳')) displayAge += '歳';
                    }
                    const getVotes = (idx) => idx !== -1 ? parseNumber(row[idx]) : null;
                    const v2024 = getVotes(votes2024Idx);
                    let predictedVotes = votesPredIdx !== -1 ? parseNumber(row[votesPredIdx]) : 0;

                    // 正規化: 日本保守 -> 保守
                    let partyNameRaw = partyIdx !== -1 ? getStr(row[partyIdx]).replace(/"/g, '').trim() : '無所属';
                    if (partyNameRaw.includes('日本保守')) { partyNameRaw = '保守'; }

                    if (predictedVotes === null || predictedVotes === 0) {
                        if (type === 'proportional') {
                            if (v2024 !== null && v2024 > 0) {
                                let coef = 1.0;
                                Object.keys(PARTY_COEFFICIENTS).forEach(key => { if (partyNameRaw.includes(key)) coef = PARTY_COEFFICIENTS[key]; });
                                predictedVotes = Math.floor(v2024 * coef);
                            }
                        } else {
                            const history = [v2024, getVotes(votes2021Idx), getVotes(votes2017Idx), getVotes(votes2014Idx), getVotes(votes2012Idx)].filter(v => v !== null && v > 0);
                            if (history.length > 0) predictedVotes = Math.floor(history.reduce((a, b) => a + b, 0) / history.length);
                        }
                    }
                    newCandidates.push({
                        id: `row-${i}`,
                        district: districtName,
                        party: partyNameRaw,
                        name: nameRaw.replace(/"/g, '').trim(),
                        age: displayAge,
                        incumbentStatus: incStatusIdx !== -1 ? getStr(row[incStatusIdx]).replace(/"/g, '') : '',
                        predictedVotes: predictedVotes || 0,
                        votes2024: v2024,
                        votes2021: getVotes(votes2021Idx),
                        votes2017: getVotes(votes2017Idx),
                        votes2014: getVotes(votes2014Idx),
                        votes2012: getVotes(votes2012Idx),
                        votes2009: getVotes(votes2009Idx),
                        votes2005: getVotes(votes2005Idx),
                        status: statusIdx !== -1 ? getStr(row[statusIdx]).replace(/"/g, '') : '',
                        status2021: status2021Idx !== -1 ? getStr(row[status2021Idx]).replace(/"/g, '') : '',
                        winningStatus: winStatusIdx !== -1 ? getStr(row[winStatusIdx]).replace(/"/g, '') : '',
                        type: type
                    });
                }
                
                const districtMap = new Map();
                newCandidates.forEach(c => { if (c.type === 'single') { if (!districtMap.has(c.district)) districtMap.set(c.district, []); districtMap.get(c.district).push(c); } });
                const candidatesToAdd = [];
                districtMap.forEach((districtCandidates, districtName) => {
                    const komei = districtCandidates.find(c => c.party.includes('公明'));
                    const jimin = districtCandidates.find(c => c.party.includes('自民'));
                    if (komei && komei.predictedVotes > 0) {
                        const transferVotes = Math.floor(komei.predictedVotes * 0.88);
                        komei.predictedVotes = 0;
                        if (jimin) { jimin.predictedVotes += transferVotes; } 
                        else {
                            candidatesToAdd.push({
                                id: `generated-jimin-${districtName}`,
                                district: districtName,
                                party: '自民', name: '(自民党)', age: '-', incumbentStatus: '-',
                                predictedVotes: transferVotes,
                                votes2024: null, votes2021: null, votes2017: null, votes2014: null, votes2012: null, votes2009: null, votes2005: null,
                                status: '', status2021: '', winningStatus: '-', type: 'single'
                            });

                if (newCandidates.length > 0) {

                        setLastUpdated(new Date().toLocaleString('ja-JP'));

                    }
                    const singleCount = newCandidates.filter(c => c.type === 'single').length;
                    setActiveTab(singleCount > 0 ? 'single' : 'proportional');
                } else {
                    setAlertMessage("有効なデータが見つかりませんでした。");
                }
            };

            const processVoterData = async (rows) => { /* ... similar logic to previous, guarded ... */ 
                if (IS_READ_ONLY) return;
                if (!rows || rows.length === 0) return;
                let headerRow = rows[0].map(h => getStr(h));
                let startRowIdx = 1;
                for(let i=0; i<Math.min(rows.length, 5); i++){ if (rows[i].map(c => getStr(c)).some(c => c.includes('選挙区'))) { headerRow = rows[i].map(c => getStr(c)); startRowIdx = i + 1; break; } }
                const districtIdx = headerRow.findIndex(h => h.includes('選挙区') || h.includes('都道府県'));
                const voterCountIdx = headerRow.findIndex(h => h.includes('有権者数') || h.includes('有権者総数'));
                if (districtIdx === -1 || voterCountIdx === -1) { setAlertMessage("必須列が見つかりません: 「選挙区」「有権者数」"); return; }
                const newVoterCounts = new Map(voterCounts);

                    const districtRaw = getStr(row[districtIdx]).replace(/"/g, '').trim();
                    const voterVal = parseNumber(row[voterCountIdx]);

                } else { setAlertMessage("有効な有権者データが見つかりませんでした。"); }
            };

            const handleFileUpload = (event, type) => {
                if (IS_READ_ONLY) return;

                const file = event.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                        if (type === 'analysis') processAnalysisData(rows);
                        else processVoterData(rows);
                    } catch (err) { console.error(err); setAlertMessage("ファイルの読み込みに失敗しました。"); }
                };
                reader.readAsArrayBuffer(file);

            // --- Export Read-Only HTML Logic ---

            const handleSummaryClick = (data) => { if (data && data.name) { setSelectedParty(data.name); setActiveTab('single'); } };
            const clearFilters = () => { setFilterText(""); setSelectedParty("All"); setSelectedPrefecture("All"); setShowCloseRaceOnly(false); setFilterType('all'); };
            const handleCloseRaceClick = () => { setFilterText(""); setSelectedParty("All"); setSelectedPrefecture("All"); setShowCloseRaceOnly(true); setActiveTab('single'); };

            const simulatedCandidates = useMemo(() => { /* ... same ... */
                return candidates.map(c => {
                    let multiplier = 1.0;
                    if (c.party.includes('自民')) multiplier += (simSettings.takaichiEffect / 100);
                    if (c.party.includes('維新')) multiplier += (simSettings.coalitionEffect / 100);
                    if (c.party.includes('立憲')) { multiplier += (simSettings.newPartyEffect / 100); multiplier -= (simSettings.emergingSurge / 100); }
                    if (c.party.includes('公明') && c.type === 'proportional') multiplier += (simSettings.newPartyEffect / 100);
                    if (c.party.includes('国民') || c.party.includes('参政')) multiplier += (simSettings.emergingSurge / 100);
                    if (c.party.includes('共産')) multiplier *= 1.05;
                    const baseVotes = c.predictedVotes || 0;
                    const simulatedVotes = Math.floor(baseVotes * Math.max(0, multiplier));
                    return { ...c, predictedVotes: simulatedVotes };
                });
            }, [candidates, simSettings]);

            const districtsData = useMemo(() => { /* ... same ... */
                const map = new Map();
                simulatedCandidates.forEach(c => {
                    const key = c.district.replace(/\s+/g, '');
                    if (!map.has(key)) map.set(key, []);
                    map.get(key)?.push(c);
                });
                const districts = [];
                map.forEach((cands, key) => {
                    cands.sort((a, b) => b.predictedVotes - a.predictedVotes);
                    let isClose = false;
                    if (cands.length >= 2 && cands[0].predictedVotes > 0) {
                        const diff = cands[0].predictedVotes - cands[1].predictedVotes;
                        if (diff / cands[0].predictedVotes < 0.1) isClose = true;
                    }
                    const totalPredictedVotes = cands.reduce((sum, c) => sum + c.predictedVotes, 0);
                    let voters = voterCounts.get(key) || null;
                    let turnout = null;
                    if (voters && voters > 0) turnout = totalPredictedVotes / voters;
                    const type = cands.length > 0 ? cands[0].type : 'single';
                    districts.push({ name: key, candidates: cands, isCloseRace: isClose, totalPredictedVotes, voterCount: voters, turnout, type });
                });
                const getBlockIndex = (name) => PR_BLOCKS.indexOf(name);
                return districts.sort((a, b) => {
                    if (a.type === 'proportional' && b.type === 'proportional') return getBlockIndex(a.name) - getBlockIndex(b.name);
                    const getPrefIndex = (name) => { const pref = PREFECTURE_ORDER.find(p => name.startsWith(p)); return pref ? PREFECTURE_ORDER.indexOf(pref) : 999; };
                    const indexA = getPrefIndex(a.name); const indexB = getPrefIndex(b.name);
                    if (indexA !== indexB) return indexA - indexB;
                    const getDistrictNumber = (name) => { const match = name.match(/(\d+)区/); return match ? parseInt(match[1], 10) : 0; };
                    return getDistrictNumber(a.name) - getDistrictNumber(b.name);
                });
            }, [simulatedCandidates, voterCounts]);

            const partyStats = useMemo(() => { /* ... same ... */
                const stats = {};
                Object.keys(PARTY_COLORS).forEach(p => { stats[p] = { name: p, color: PARTY_COLORS[p], singleWinsResult: 0, prWinsResult: 0, singleWinsPred: 0, prWinsPred: 0 }; });
                simulatedCandidates.forEach(c => {
                    const statusVal = displayYear === '2024' ? c.status : c.status2021;
                    if (statusVal) {
                        const partyKey = Object.keys(PARTY_COLORS).find(k => c.party.includes(k)) || '諸派';
                        if (!stats[partyKey]) stats[partyKey] = { name: partyKey, color: DEFAULT_COLOR, singleWinsResult: 0, prWinsResult: 0, singleWinsPred: 0, prWinsPred: 0 };
                        if (statusVal.includes('◎')) stats[partyKey].singleWinsResult++;
                        else if (statusVal.includes('○') || statusVal.includes('⚪︎')) stats[partyKey].prWinsResult++;
                    }
                });
                districtsData.forEach(d => {
                    if (d.type === 'single' && d.candidates.length > 0) {
                        const winner = d.candidates[0];
                        const partyKey = Object.keys(PARTY_COLORS).find(k => winner.party.includes(k)) || '諸派';
                        if (!stats[partyKey]) stats[partyKey] = { name: partyKey, color: DEFAULT_COLOR, singleWinsResult: 0, prWinsResult: 0, singleWinsPred: 0, prWinsPred: 0 };
                        stats[partyKey].singleWinsPred++;
                    }
                });
                const proportionalVotes = {};
                simulatedCandidates.forEach(c => {
                    if (c.type === 'proportional' && c.predictedVotes > 0) {
                        const partyKey = Object.keys(PARTY_COLORS).find(k => c.party.includes(k)) || '諸派';
                        if (!proportionalVotes[partyKey]) proportionalVotes[partyKey] = 0;
                        proportionalVotes[partyKey] += c.predictedVotes;
                    }
                });
                const prAllocation = calculateDhondt(proportionalVotes, 176);
                Object.keys(prAllocation).forEach(party => {
                    if (!stats[party]) stats[party] = { name: party, color: DEFAULT_COLOR, singleWinsResult: 0, prWinsResult: 0, singleWinsPred: 0, prWinsPred: 0 };
                    stats[party].prWinsPred = prAllocation[party];
                });
                return Object.values(stats).filter(p => (p.singleWinsResult + p.prWinsResult + p.singleWinsPred + p.prWinsPred) > 0).sort((a, b) => (b.singleWinsPred + b.prWinsPred) - (a.singleWinsPred + a.prWinsPred));
            }, [simulatedCandidates, districtsData, displayYear]);

            const semiCircleData = useMemo(() => { /* ... same ... */

                return order.map(partyName => {
                    const stat = partyStats.find(p => p.name === partyName);

                    return { name: partyName, value: seats, fill: PARTY_COLORS[partyName] || DEFAULT_COLOR };
                }).filter(d => d.value > 0);
            }, [partyStats]);

                             if (targetBlock && d.name === targetBlock) {

                             }
                        }
                        else if (d.type === 'single') {
                            const targetPrefs = BLOCK_TO_PREFS[selectedPrefecture]; 
                            if (targetPrefs && targetPrefs.some(pref => d.name.includes(pref))) {
                                matchPref = true;
                            }
                        }
                    }

            const renderSummary = () => ( /* ... same ... */
                <div className="space-y-8 p-4 md:p-8 overflow-y-auto h-full pb-20">

                    <div className="mt-8 p-4 bg-gray-50 rounded-lg border border-gray-200 text-sm text-gray-500">

                <div className="flex flex-col items-center justify-start h-full p-6 bg-gray-50 pb-20 overflow-y-auto gap-6 animate-in fade-in duration-300">
                    <div className="bg-white p-8 rounded-xl shadow-md border border-gray-200 text-center max-w-lg w-full">

                        <p className="text-gray-600 text-sm mb-6">「得票予測シュミレーション.csv」などを読み込みます。<br/><span className="text-xs text-gray-400">必須列: 選挙区, 政党, 候補者名<br/>追加: 今回予想, 年齢, 2024/2021/2017...得票数</span></p>
                        <label className="block w-full cursor-pointer group"><div className="flex items-center justify-center w-full px-6 py-3 bg-blue-600 text-white rounded-lg group-hover:bg-blue-700 transition-colors shadow-md font-bold text-sm"><span className="mr-2"><Upload width={16} height={16} /></span>分析ファイルを選択 (CSV / Excel)</div><input type="file" accept=".csv, .xlsx, .xls" onChange={(e) => handleFileUpload(e, 'analysis')} className="hidden" /></label>
                    </div>
                    <div className="bg-white p-8 rounded-xl shadow-md border border-gray-200 text-center max-w-lg w-full">
                        <div className="mx-auto mb-4 text-green-500 flex justify-center"><Users width={48} height={48} /></div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">2. 有権者数ファイルをアップロード</h3>
                        <p className="text-gray-600 text-sm mb-6">「有権者数入力用ファイル.csv」などを読み込み、選挙区データに紐付けます。<br/><span className="text-xs text-gray-400">必須列: 選挙区, 有権者数 (または有権者総数)</span></p>
                        <label className="block w-full cursor-pointer group"><div className="flex items-center justify-center w-full px-6 py-3 bg-green-600 text-white rounded-lg group-hover:bg-green-700 transition-colors shadow-md font-bold text-sm"><span className="mr-2"><Upload width={16} height={16} /></span>有権者数ファイルを選択 (CSV / Excel)</div><input type="file" accept=".csv, .xlsx, .xls" onChange={(e) => handleFileUpload(e, 'voter')} className="hidden" /></label>
                    </div>
                    <div className="bg-white p-8 rounded-xl shadow-md border border-gray-200 text-center max-w-lg w-full">
                        <div className="mx-auto mb-4 text-purple-500 flex justify-center"><Download width={48} height={48} /></div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">3. データをエクスポート</h3>
                        <p className="text-gray-600 text-sm mb-6">現在の分析データをCSVファイルとしてダウンロードします。<br/><span className="text-xs text-gray-400">編集した内容も含まれます。</span></p>
                        <button onClick={handleExportData} className="flex items-center justify-center w-full px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors shadow-md font-bold text-sm"><span className="mr-2"><Download width={16} height={16} /></span>CSV形式でダウンロード</button>
                    </div>
                    <div className="bg-white p-8 rounded-xl shadow-md border border-gray-200 text-center max-w-lg w-full border-t-4 border-t-purple-500">
                        <div className="mx-auto mb-4 text-purple-600 flex justify-center"><Code width={48} height={48} /></div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">4. 閲覧専用ファイル書き出し</h3>
                        <p className="text-gray-600 text-sm mb-6">現在のデータを保持したまま、アップロードや編集機能を削除した<br/><strong>「閲覧専用のHTMLファイル」</strong>のコードを生成します。<br/><span className="text-xs text-gray-400">配布や共有に便利です。</span></p>
                        <button onClick={handleExportReadOnlyHtml} className="flex items-center justify-center w-full px-6 py-3 bg-white border-2 border-purple-600 text-purple-600 rounded-lg hover:bg-purple-50 transition-colors shadow-sm font-bold text-sm"><span className="mr-2"><Code width={16} height={16} /></span>閲覧専用コードを生成</button>
                    </div>
                    <div className="max-w-lg w-full mt-4">

                    </div>
                </div>

            return (

                            <div className="text-xs text-gray-500 hidden sm:flex flex-col items-end"><span className="flex items-center gap-1"><Save width={12} height={12} />最終更新: {lastUpdated}</span></div>

                    </header>

                            <button onClick={() => setActiveTab('summary')} className={`py-3 px-1 flex items-center gap-2 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'summary' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}><MapIcon width={16} height={16} />情勢サマリー</button>

                            <button onClick={() => setActiveTab('proportional')} className={`py-3 px-1 flex items-center gap-2 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'proportional' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}><Layers width={16} height={16} />比例代表</button>
                            {!IS_READ_ONLY && <button onClick={() => setActiveTab('upload')} className={`py-3 px-1 flex items-center gap-2 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'upload' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}><Upload width={16} height={16} />データ管理・読込</button>}
                        </div>
                    </div>
                    <main className="flex-1 overflow-hidden relative max-w-7xl mx-auto w-full">
                        {activeTab === 'summary' && renderSummary()}
                        
                        {(activeTab === 'single' || activeTab === 'proportional') && (
                            <div className="flex flex-col h-full">
                                <div className="flex-none p-4 bg-white border-b border-gray-200 shadow-sm z-10 space-y-4">
                                    <div className="flex flex-col md:flex-row gap-4">
                                        <div className="flex-1"><div className="relative"><div className="absolute left-3 top-2.5 text-gray-400"><Search width={16} height={16} /></div><input type="text" placeholder="候補者名、選挙区名、政党名..." className="pl-10 pr-10 w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition-all" value={filterText} onChange={(e) => setFilterText(e.target.value)} />{filterText && <button onClick={() => setFilterText("")} className="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600"><X width={16} height={16} /></button>}</div></div>
                                        <div className="w-full md:w-48"><div className="relative">
                                            <select className="w-full p-2 border border-gray-300 rounded-md outline-none appearance-none" value={selectedPrefecture} onChange={(e) => setSelectedPrefecture(e.target.value)}>
                                                <option value="All">全国</option>
                                                <optgroup label="比例ブロック">{PR_BLOCKS.map(b => <option key={b} value={b}>{b}</option>)}</optgroup>
                                                <optgroup label="都道府県">{PREFECTURE_ORDER.map(p => <option key={p} value={p}>{p}</option>)}</optgroup>
                                            </select>
                                            <div className="absolute right-3 top-3 text-gray-400 pointer-events-none"><ChevronDown width={16} height={16} /></div></div></div>
                                        <div className="w-full md:w-48"><div className="relative"><select className="w-full p-2 border border-gray-300 rounded-md outline-none appearance-none" value={selectedParty} onChange={(e) => setSelectedParty(e.target.value)}><option value="All">全政党</option>{Object.keys(PARTY_COLORS).map(p => <option key={p} value={p}>{p}</option>)}</select><div className="absolute right-3 top-3 text-gray-400 pointer-events-none"><ChevronDown width={16} height={16} /></div></div></div>
                                        <div className="flex items-center gap-2 bg-gray-100 p-1 rounded-lg self-end md:self-auto h-[42px]">
                                            <button className={`px-3 h-full rounded-md text-xs font-bold transition-all ${displayYear === '2026' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`} onClick={() => setDisplayYear('2026')}>2026予想</button>
                                            <button className={`px-3 h-full rounded-md text-xs font-bold transition-all ${displayYear === '2024' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`} onClick={() => setDisplayYear('2024')}>2024当選</button>
                                            <button className={`px-3 h-full rounded-md text-xs font-bold transition-all ${displayYear === '2021' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'}`} onClick={() => setDisplayYear('2021')}>2021当選</button>
                                        </div>
                                        <div className="flex items-center gap-2 self-end md:self-auto h-[42px] px-2 bg-gray-50 rounded border border-gray-200">
                                            <label className="text-xs font-bold text-gray-500 mr-1">絞り込み:</label>
                                            <select value={filterType} onChange={(e) => setFilterType(e.target.value)} className="bg-transparent text-sm font-bold text-gray-700 outline-none cursor-pointer"><option value="all">全て</option><option value="winner_all">当選 (◎+○)</option><option value="winner_single">選挙区 (◎)</option><option value="winner_pr">比例復活 (○)</option></select>
                                        </div>
                                        <button onClick={clearFilters} className="flex items-center justify-center gap-1 px-3 py-2 bg-gray-100 text-gray-600 rounded-md hover:bg-gray-200 transition-colors self-end md:self-auto h-[42px]" title="条件をクリア"><RefreshCcw width={16} height={16} /><span className="text-sm font-bold">クリア</span></button>
                                    </div>
                                    <div className="flex justify-between items-center text-sm text-gray-500">
                                        <span>{showCloseRaceOnly ? <span className="text-red-600 font-bold mr-2">【接戦区のみ表示中】</span> : ""}表示中: <strong>{filteredDistricts.length}</strong> {activeTab === 'single' ? '選挙区' : 'ブロック'}</span>
                                        <span className="text-xs">クリックで詳細・編集</span>
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 bg-gray-100 pb-20">
                                    <SimulationPanel settings={simSettings} setSettings={setSimSettings} />
                                    <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                                        {filteredDistricts.map((district) => (
                                            <Card key={district.name} className="p-4" onClick={() => setSelectedDistrict(district)}>
                                                <div className="flex justify-between items-center mb-3">
                                                    <div>
                                                        <h4 className="font-bold text-lg text-gray-800 flex items-center">{district.name} {activeTab === 'single' && district.isCloseRace && <span className="ml-2 px-2 py-0.5 bg-red-100 text-red-600 text-xs rounded-full border border-red-200">接戦</span>}</h4>
                                                        <div className="text-xs text-gray-500 mt-0.5">予想総票数: {district.totalPredictedVotes.toLocaleString()} {district.turnout && <span>(投票率: {(district.turnout*100).toFixed(1)}%)</span>}</div>
                                                    </div>
                                                </div>
                                                <div className="space-y-3">
                                                    {district.candidates.map((cand, idx) => {
                                                        let match = true;
                                                        const getWinnerId = (cands) => { const sorted = [...cands].sort((a,b)=>b.predictedVotes-a.predictedVotes); return sorted[0]?.id; };
                                                        const isSingleW = (c, dCands) => (displayYear === '2026' ? c.id === getWinnerId(dCands) : (displayYear==='2024'?c.status:c.status2021)?.includes('◎'));
                                                        const isPrW = (c) => displayYear !== '2026' && (displayYear==='2024'?c.status:c.status2021)?.match(/[○⚪︎]/);
                                                        const isW = (c, dCands) => isSingleW(c, dCands) || isPrW(c);

                                                        if (filterType === 'winner_all') match = isW(cand, district.candidates);
                                                        else if (filterType === 'winner_single') match = isSingleW(cand, district.candidates);
                                                        else if (filterType === 'winner_pr') match = isPrW(cand);
                                                        if (!match) return null;

                                                        const percentage = district.totalPredictedVotes > 0 ? (cand.predictedVotes / district.totalPredictedVotes) * 100 : 0;
                                                        const partyColor = Object.entries(PARTY_COLORS).find(([k]) => cand.party.includes(k))?.[1] || DEFAULT_COLOR;
                                                        if (filterType === 'all' && idx >= (activeTab === 'single' ? 2 : 5)) return null;

                                                        let displayStatus = "";
                                                        if (displayYear === '2026') { if (isSingleW(cand, district.candidates)) displayStatus = "当選予測"; } 
                                                        else { displayStatus = displayYear === '2024' ? cand.status : cand.status2021; }

                                                        return (
                                                            <div key={cand.id} className="relative">
                                                                <div className="flex justify-between text-sm mb-1">
                                                                    <div className="flex items-center gap-2 overflow-hidden"><span className={`font-bold truncate ${idx === 0 && filterType === 'all' ? 'text-gray-900' : 'text-gray-700'}`}>{cand.name.replace(` (${district.name})`, '')} </span><Badge color={partyColor}>{cand.party}</Badge>{displayStatus && <span className="text-xs bg-gray-100 px-1 rounded text-gray-600">{displayStatus}</span>}</div>
                                                                    <span className="font-mono text-gray-600 text-xs">{cand.predictedVotes.toLocaleString()}</span>
                                                                </div>
                                                                <div className="w-full bg-gray-100 rounded-full h-1.5 mb-2"><div className="h-1.5 rounded-full" style={{ width: `${percentage}%`, backgroundColor: partyColor }}></div></div>
                                                            </div>
                                                        );
                                                    })}
                                                    {filterType === 'all' && district.candidates.length > (activeTab === 'single' ? 2 : 5) && <div className="text-xs text-center text-gray-400 mt-2">他 {district.candidates.length - (activeTab === 'single' ? 2 : 5)} {activeTab === 'single' ? '名' : '政党'}...</div>}
                                                    {filterType !== 'all' && district.candidates.filter(c => { const getWinnerId=(cs)=>cs.sort((a,b)=>b.predictedVotes-a.predictedVotes)[0]?.id; const isW=(cc,dcs)=> (displayYear==='2026'?cc.id===getWinnerId(dcs):(displayYear==='2024'?cc.status:cc.status2021)?.match(/[◎○⚪︎]/)); return isW(c, district.candidates); }).length === 0 && <div className="text-xs text-center text-gray-400 mt-2">該当なし</div>}
                                                </div>
                                            </Card>
                                        ))}
                                        {filteredDistricts.length === 0 && <div className="col-span-full flex flex-col items-center justify-center py-20 text-gray-500"><AlertCircle width={48} height={48} /><p>条件に一致するデータが見つかりません。</p></div>}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'upload' && !IS_READ_ONLY && renderUpload()}
                    </main>
                    <footer className="flex-none bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
                        &copy; 一般社団法人日本みらい研
                    </footer>
                    {selectedDistrict && <DistrictModal district={selectedDistrict} onClose={() => setSelectedDistrict(null)} onUpdate={handleUpdateCandidates} />}
                    <AlertDialog message={alertMessage} onClose={() => setAlertMessage(null)} />
                    <ConfirmDialog config={confirmConfig} onCancel={() => setConfirmConfig(null)} />
                    {exportCode && <CodeExportDialog code={exportCode} onClose={() => setExportCode(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
