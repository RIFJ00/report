<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせフォーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        primaryHover: '#1d4ed8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white max-w-2xl w-full rounded-2xl shadow-xl overflow-hidden">
        <!-- ヘッダー部分 -->
        <div class="bg-primary p-6 text-white text-center">
            <i data-lucide="mail" class="w-10 h-10 mx-auto mb-3 text-white"></i>
            <h2 class="text-2xl font-bold">お問い合わせ</h2>
            <p class="text-blue-100 mt-2 text-sm">ご質問やご相談など、お気軽にお問い合わせください。</p>
        </div>

        <!-- フォーム部分 -->
        <form id="contactForm" class="p-8 space-y-6">
            
            <!-- お名前 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">姓 <span class="text-red-500">*</span></label>
                    <input type="text" id="lastName" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition"
                        placeholder="山田">
                </div>
                <div>
                    <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">名 <span class="text-red-500">*</span></label>
                    <input type="text" id="firstName" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition"
                        placeholder="太郎">
                </div>
            </div>

            <!-- メールアドレス -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス <span class="text-red-500">*</span></label>
                <input type="email" id="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition"
                    placeholder="your@email.com">
                <p class="text-xs text-gray-500 mt-1">※内容確認のため、このアドレス宛（CC）にもコピーが送信されます。</p>
            </div>

            <!-- 件名 -->
            <div>
                <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">件名 <span class="text-red-500">*</span></label>
                <select id="subject" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition bg-white">
                    <option value="" disabled selected>選択してください</option>
                    <option value="サービスについて">サービスについて</option>
                    <option value="お見積りのご依頼">お見積りのご依頼</option>
                    <option value="採用について">採用について</option>
                    <option value="その他">その他</option>
                </select>
            </div>

            <!-- お問い合わせ内容 -->
            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">お問い合わせ内容 <span class="text-red-500">*</span></label>
                <textarea id="message" rows="5" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition resize-none"
                    placeholder="具体的な内容をご記入ください。"></textarea>
            </div>

            <!-- メッセージ表示領域 (送信中・完了・エラー) -->
            <div id="statusMessage" class="hidden p-4 rounded-lg text-sm flex items-start gap-3">
                <!-- JavaScriptで中身を動的に変更します -->
            </div>

            <!-- 送信ボタン -->
            <button type="submit" id="submitButton"
                class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-5 h-5" id="submitIcon"></i>
                <span id="submitText">送信する</span>
            </button>
        </form>
    </div>

    <script>
        // アイコンの初期化
        lucide.createIcons();

        // フォーム送信時の処理
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // デフォルトの送信処理をブロック

            // ▼▼▼ ここにGASで発行したURLを設定します ▼▼▼
            const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwz8bSTclWLem2h3vwkfWwYoxs9A-ip6TUJCmf7dGND671jT3AXTDTBuTWlYVylokY/exec'; 

            if (GAS_WEB_APP_URL === 'YOUR_GAS_WEB_APP_URL_HERE') {
                alert('システムエラー: 送信先のURLが設定されていません。管理者にお問い合わせください。');
                return;
            }

            // UI要素の取得
            const submitButton = document.getElementById('submitButton');
            const submitIcon = document.getElementById('submitIcon');
            const submitText = document.getElementById('submitText');
            const statusMessage = document.getElementById('statusMessage');

            // 送信中のUIに変更
            submitButton.disabled = true;
            submitButton.classList.replace('bg-primary', 'bg-gray-400');
            submitButton.classList.replace('hover:bg-primaryHover', 'hover:bg-gray-400');
            submitButton.classList.add('cursor-not-allowed');
            submitText.textContent = '送信中...';
            // アイコンをローディングスピナー（SVG）に一時的に変更
            submitIcon.outerHTML = `<svg id="loadingIcon" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            statusMessage.classList.add('hidden');

            // 入力データの収集
            const formData = {
                lastName: document.getElementById('lastName').value,
                firstName: document.getElementById('firstName').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            try {
                // バックグラウンドでGASへデータを送信
                // CORS制約によるLoad failedエラーを回避するため、mode: 'no-cors' を指定
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain', 
                    },
                    body: JSON.stringify(formData)
                });

                // no-corsモードではGASからの返答を直接読み取れないため、
                // 通信エラー(例外)が発生せずにここまで到達できれば「送信成功」とみなします
                document.getElementById('contactForm').reset(); // フォームをクリア
                
                statusMessage.className = 'p-4 rounded-lg text-sm flex items-start gap-3 bg-green-50 text-green-800';
                statusMessage.innerHTML = `
                    <i data-lucide="check-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                    <div>
                        <p class="font-bold">送信が完了しました</p>
                        <p class="mt-1">お問い合わせありがとうございます。ご入力いただいたメールアドレス宛に控えを送信いたしました。</p>
                    </div>
                `;
            } catch (error) {
                // エラー時の処理
                console.error('Error:', error);
                statusMessage.className = 'p-4 rounded-lg text-sm flex items-start gap-3 bg-red-50 text-red-800';
                statusMessage.innerHTML = `
                    <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
                    <div>
                        <p class="font-bold">送信エラー</p>
                        <p class="mt-1">申し訳ありませんが、通信エラーが発生しました。時間をおいて再度お試しください。</p>
                    </div>
                `;
            } finally {
                // UIを元の状態に戻す
                submitButton.disabled = false;
                submitButton.classList.replace('bg-gray-400', 'bg-primary');
                submitButton.classList.replace('hover:bg-gray-400', 'hover:bg-primaryHover');
                submitButton.classList.remove('cursor-not-allowed');
                submitText.textContent = '送信する';
                
                // ローディングアイコンを元の送信アイコンに戻す
                const loadingIcon = document.getElementById('loadingIcon');
                if(loadingIcon) {
                    loadingIcon.outerHTML = `<i data-lucide="send" class="w-5 h-5" id="submitIcon"></i>`;
                }
                lucide.createIcons(); // アイコンの再描画
                statusMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
