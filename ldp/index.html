            });

                <p class="mb-6 text-gray-600">主要メディア各社の直近の世論調査(9月30日時点)を基に、一般と自民党支持層の平均支持率を算出。「一般」での支持と、党員票の動向に影響を与える「自民支持層」での支持の乖離が注目される。</p>
                <div class="chart-container mb-8"><canvas id="pollsChart"></canvas></div>
                <h4 class="text-xl font-bold mb-3">各社調査結果一覧</h4>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white border rounded-lg text-sm">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="py-2 px-3 text-left">調査機関 (対象)</th>
                                ${pollTableHeaders}
                            </tr>
                        </thead>
                        <tbody>${pollTableRows}</tbody>
                    </table>
                    <p class="text-xs text-right mt-1 text-gray-500">＊ 直近の各社調査に基づく</p>
                </div>`;

            // Render First Round
            document.getElementById('first-round-sim-subcontent').innerHTML = `
                <h3 class="text-2xl font-bold mb-2 text-gray-900 border-l-4 border-gray-800 pl-3">第1回投票シミュレーション</h3>
                <p class="mb-4 text-gray-600">各種データと一般社団法人日本みらい研の独自調査による前提条件に基づき、1回目の投票結果をシミュレート。議員票と党員票の内訳を可視化し、各候補の支持構造を分析する。下のボタンでシナリオを切り替えられる。</p>
                <div class="flex justify-center space-x-2 mb-6">
                    <button class="sim-button active bg-gray-800 text-white py-2 px-4 rounded-lg" data-sim="sim1">新前提に基づく予測</button>
                    <button class="sim-button bg-gray-200 text-gray-700 py-2 px-4 rounded-lg" data-sim="sim2">前回総裁選票を前提</button>
                    <button class="sim-button bg-gray-200 text-gray-700 py-2 px-4 rounded-lg" data-sim="sim3">保守回帰シナリオ</button>
                </div>
                <div class="chart-container" style="height: 450px;"><canvas id="firstRoundChart"></canvas></div>
                <div id="sim-analysis" class="mt-6 p-4 bg-gray-100 rounded-lg"><h4 class="font-bold text-lg mb-2">分析：</h4><p class="text-gray-700"></p></div>`;
            document.querySelectorAll('.sim-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    document.querySelectorAll('.sim-button').forEach(b => {
                        b.classList.remove('active', 'bg-gray-800', 'text-white');
                        b.classList.add('bg-gray-200', 'text-gray-700');
                    });
                    e.currentTarget.classList.add('active', 'bg-gray-800', 'text-white');
                    e.currentTarget.classList.remove('bg-gray-200', 'text-gray-700');
                    renderSimFirstRoundChart(e.currentTarget.dataset.sim);
                });
            });

            // Render Runoff
            document.getElementById('runoff-sim-subcontent').innerHTML = `
                <h3 class="text-2xl font-bold mb-2 text-gray-900 border-l-4 border-gray-800 pl-3">決選投票シミュレーション (高市 vs 小泉)</h3>
                <p class="mb-4 text-gray-600">シミュレーションの結果、決選投票は「高市 vs 小泉」となる可能性が極めて高い。ここでは、敗退した候補の票がどのように動くかを想定した3つのケースを分析する。総票数342票、過半数は172票である。</p>
                <div class="flex justify-center space-x-2 mb-6">
                    <button class="runoff-button active bg-gray-800 text-white py-2 px-4 rounded-lg" data-runoff="caseA">ケースA: 政策重視</button>
                    <button class="runoff-button bg-gray-200 text-gray-700 py-2 px-4 rounded-lg" data-runoff="caseB">ケースB: 党内力学重視</button>
                    <button class="runoff-button bg-gray-200 text-gray-700 py-2 px-4 rounded-lg" data-runoff="caseC">ケースC: 拮抗</button>
                </div>
                <div class="chart-container"><canvas id="runoffChart"></canvas></div>
                <div id="runoff-analysis" class="mt-6 p-4 bg-gray-100 rounded-lg"><h4 class="font-bold text-lg mb-2">分析：</h4><p class="text-gray-700"></p></div>`;
            document.querySelectorAll('.runoff-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    document.querySelectorAll('.runoff-button').forEach(b => {
                        b.classList.remove('active', 'bg-gray-800', 'text-white');
                        b.classList.add('bg-gray-200', 'text-gray-700');
                    });
                    e.currentTarget.classList.add('active', 'bg-gray-800', 'text-white');
                    e.currentTarget.classList.remove('bg-gray-200', 'text-gray-700');
                    renderSimRunoffChart(e.currentTarget.dataset.runoff);
                });
            });

            // Render Candidates Comparison
            const { policyAreas, candidates, candidateData } = APP_DATA.policy;
            const candidateHeaders = candidates.map(c => `<th class="text-left py-3 px-4 uppercase font-semibold text-sm">${c.name}</th>`).join('');
            const policyRows = policyAreas.map((area, index) => {
                const cells = candidates.map(c => `<td class="text-left py-3 px-4 text-sm">${candidateData[c.id].policies[area.id] || 'ー'}</td>`).join('');
                return `
                    <tr class="${index % 2 === 0 ? 'bg-gray-50' : ''}">
                        <td class="text-left py-3 px-4 font-bold text-sm">${area.icon} ${area.name}</td>
                        ${cells}
                    </tr>`;
            }).join('');
            
            document.getElementById('candidates-sim-subcontent').innerHTML = `
                <h3 class="text-2xl font-bold mb-4 text-gray-900 border-l-4 border-gray-800 pl-3">主要政策比較</h3>
                <p class="mb-6 text-gray-600">各候補者の主要政策を一覧で比較する。経済、安全保障、党改革など、それぞれの考え方の違いが鮮明になっている。</p>
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white border rounded-lg">
                        <thead class="bg-gray-800 text-white">
                            <tr>
                                <th class="text-left py-3 px-4 uppercase font-semibold text-sm w-1/6">政策分野</th>
                                ${candidateHeaders}
                            </tr>
                        </thead>
                        <tbody class="text-gray-700">${policyRows}</tbody>
                    </table>
                </div>`;
             renderSimOverviewSubView();
        }

        function renderSimOverviewSubView() {
            // This is the default view, content is already in the innerHTML.
        }

        function renderSimPollsChart() {
            const { averages } = APP_DATA.simulation.pollDetails;
            renderBarChart('pollsChart', averages.labels, averages.datasets, {
                 plugins: { title: { display: true, text: '「次の総裁にふさわしい人物」メディア各社平均', font: { size: 18 } } },
                 scales: { y: { title: { display: true, text: '支持率 (%)' } } }
            });
        }
        
        function renderSimFirstRoundChart(simId) {
            const sim = APP_DATA.simulation.firstRoundSimData[simId];

            const totalLabelsPlugin = {
                id: 'totalLabels',
                afterDatasetsDraw(chart) {
                    const { ctx } = chart;
                    ctx.save();
                    ctx.font = 'bold 12px sans-serif';
                    ctx.fillStyle = '#333';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';

                    const meta = chart.getDatasetMeta(1); // meta of the last dataset
                    if (!meta) return;
                    meta.data.forEach((datapoint, index) => {
                        const total = chart.data.datasets.reduce((sum, dataset) => sum + dataset.data[index], 0);
                        const { y } = datapoint;
                        const barEndpoint = datapoint.x;
                        
                        ctx.fillText(total, barEndpoint + 5, y);
                    });
                    ctx.restore();
                }
            };
            
            renderBarChart('firstRoundChart', sim.labels, [
                { label: '議員票', data: sim.data['議員票'], backgroundColor: 'rgba(54, 162, 235, 0.7)'},
                { label: '党員票', data: sim.data['党員票'], backgroundColor: 'rgba(255, 99, 132, 0.7)'}
            ], {
                indexAxis: 'y',
                plugins: { 
                    legend: {display: true}, 
                    title: { display: true, text: '第1回投票 予測結果', font: { size: 18 } },
                    datalabels: {
                        display: true,
                        color: 'white',
                        align: 'center',
                        anchor: 'center',
                        font: { weight: 'bold' },
                        formatter: (value) => value,
                    }
                },
                scales: { 
                    x: { stacked: true, title: { display: true, text: '予測得票数 (票)' } },
                    y: { stacked: true }
                }
            }, [totalLabelsPlugin]);
        
            document.querySelector('#sim-analysis p').textContent = sim.analysis;
        }


        function renderSimRunoffChart(caseId) {
            const runoffCase = APP_DATA.simulation.runoffSimData[caseId];
             renderBarChart('runoffChart', runoffCase.labels, [{
                label: '予測得票数', data: runoffCase.data,
                backgroundColor: ['#ef4444', '#f97316']
            }], {
                 scales: { x: { barPercentage: 0.5 } },
                 plugins: { 
                    legend: {display: false}, 
                    title: { display: true, text: '決選投票 予測結果 (過半数: 172票)', font: { size: 18 } },
                    datalabels: {
                        display: true,
                        color: 'white',
                        font: {
                            weight: 'bold'
                        }
                    }
                }
             });
            document.querySelector('#runoff-analysis p').textContent = runoffCase.analysis;
        }


        // --- INITIALIZATION and EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            // Setup main tabs
            const mainTabs = document.getElementById('main-tabs');
            mainTabs.addEventListener('click', (e) => {
                if (e.target.classList.contains('main-tab-btn')) {
                    const tabName = e.target.dataset.tab;

                    // Update button styles
                    mainTabs.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active-main-tab'));
                    e.target.classList.add('active-main-tab');

                    // Show/hide content
                    document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));
                    document.getElementById(`${tabName}-content`).classList.remove('hidden');
                    
                    // Re-render views to ensure charts are drawn correctly if their container was hidden
                    if (tabName === 'policy') renderPolicyView();
                    if (tabName === 'sns') renderSnsView();
                    if (tabName === 'simulation') renderSimulationView();
                }
            });

            // Initial render
            renderPolicyView();
        });
    </script>
</body>
</html>
