<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Researcher - 自動スライド・レポート生成</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Print styles adjustment for preview and export */
        @media print {
            body { background: white !important; }
            .print\:hidden { display: none !important; }
            .print\:overflow-visible { overflow: visible !important; }
            .print\:p-0 { padding: 0 !important; }
            .print\:block { display: block !important; }
            .print\:w-\[100vw\] { width: 100vw !important; }
            .print\:h-\[100vh\] { height: 100vh !important; }
            .print\:aspect-auto { aspect-ratio: auto !important; }
            .print\:border-none { border: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:rounded-none { border-radius: 0 !important; }
            .print\:break-after-page { page-break-after: always !important; }
            .print\:color-adjust-exact { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .print\:space-y-0 > :not([hidden]) ~ :not([hidden]) { margin-top: 0 !important; }
        }
        /* Fix line clamp cross-browser compatibility */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ==========================================
        // Constants & Utilities
        // ==========================================
        const DEFAULT_ORG_NAME = "一般社団法人日本みらい研";

        const PRESET_CATEGORIES = [
            "政治・経済", "成長戦略・ビジネスモデル", "国際情勢・地政学", 
            "社会問題・少子高齢化", "教育・人材育成", "AI・人工知能", 
            "デジタルトランスフォーメーション(DX)", "気候変動・サステナビリティ", 
            "フィンテック・金融", "ヘルスケア・医療テクノロジー", "サイバーセキュリティ", 
            "宇宙産業・スペーステック", "Web3・ブロックチェーン", "自動運転・モビリティ", "再生可能エネルギー"
        ];

        const getDomain = (url) => {
            try { return new URL(url).hostname; } catch { return url; }
        };

        const THEME_COLORS = {
            indigo: { bg: 'bg-indigo-700', text: 'text-indigo-700', border: 'border-indigo-200', light: 'bg-indigo-50', icon: 'text-indigo-500' },
            slate: { bg: 'bg-slate-800', text: 'text-slate-800', border: 'border-slate-300', light: 'bg-slate-100', icon: 'text-slate-600' },
            emerald: { bg: 'bg-emerald-700', text: 'text-emerald-700', border: 'border-emerald-200', light: 'bg-emerald-50', icon: 'text-emerald-500' },
            rose: { bg: 'bg-rose-700', text: 'text-rose-700', border: 'border-rose-200', light: 'bg-rose-50', icon: 'text-rose-500' },
            sky: { bg: 'bg-sky-600', text: 'text-sky-700', border: 'border-sky-200', light: 'bg-sky-50', icon: 'text-sky-500' },
            amber: { bg: 'bg-amber-600', text: 'text-amber-700', border: 'border-amber-200', light: 'bg-amber-50', icon: 'text-amber-500' },
            violet: { bg: 'bg-violet-700', text: 'text-violet-700', border: 'border-violet-200', light: 'bg-violet-50', icon: 'text-violet-500' },
            teal: { bg: 'bg-teal-700', text: 'text-teal-700', border: 'border-teal-200', light: 'bg-teal-50', icon: 'text-teal-500' }
        };

        const THEME_COLORS_HTML = {
            indigo: '#4338ca', slate: '#1e293b', emerald: '#047857', rose: '#be123c',
            sky: '#0284c7', amber: '#d97706', violet: '#6d28d9', teal: '#0f766e'
        };

        const THEME_COLORS_HEX = {
            indigo: { main: '#4338ca', light: '#eef2ff', border: '#c7d2fe' },
            slate: { main: '#334155', light: '#f8fafc', border: '#e2e8f0' },
            emerald: { main: '#047857', light: '#ecfdf5', border: '#a7f3d0' },
            rose: { main: '#be123c', light: '#fff1f2', border: '#fecdd3' },
            sky: { main: '#0369a1', light: '#f0f9ff', border: '#bae6fd' },
            amber: { main: '#b45309', light: '#fffbeb', border: '#fde68a' },
            violet: { main: '#6d28d9', light: '#f5f3ff', border: '#ddd6fe' },
            teal: { main: '#0f766e', light: '#f0fdfa', border: '#99f6e4' }
        };

        const PPTX_COLORS = {
            indigo: '4338CA', slate: '1E293B', emerald: '047857', rose: 'BE123C',
            sky: '0284C7', amber: 'D97706', violet: '6D28D9', teal: '0F766E'
        };

        const fetchWithRetry = async (url, options, retries = 5) => {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errText = await response.text().catch(() => "");
                        const error = new Error(`HTTP error! status: ${response.status} ${errText}`);
                        error.status = response.status;
                        throw error;
                    }
                    return await response.json();
                } catch (error) {
                    if (error.status === 400 || error.status === 401 || error.status === 403 || error.status === 404) {
                        throw error;
                    }
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        };

        // Schema Definitions
        const searchResultSchema = {
            type: "OBJECT",
            properties: {
                results: { type: "ARRAY", items: { type: "OBJECT", properties: {
                    id: { type: "STRING" }, title: { type: "STRING" }, summary: { type: "STRING" },
                    sourceName: { type: "STRING" }, sourceUrl: { type: "STRING" }, date: { type: "STRING" },
                    reliability: { type: "STRING" }, reliabilityReason: { type: "STRING" },
                    files: { type: "ARRAY", items: { type: "OBJECT", properties: { type: { type: "STRING" }, name: { type: "STRING" }, url: { type: "STRING" } } } }
                } } }
            }
        };

        const slideSchema = {
            type: "OBJECT",
            properties: {
                slides: { type: "ARRAY", items: { type: "OBJECT", properties: {
                    page: { type: "INTEGER" }, title: { type: "STRING" }, layout: { type: "STRING" },
                    bullets: { type: "ARRAY", items: { type: "STRING" } },
                    diagramNodes: { type: "ARRAY", items: { type: "OBJECT", properties: { label: { type: "STRING" }, desc: { type: "STRING" } } } }
                } } }
            }
        };

        // レポート用スキーマ
        const reportSchema = {
            type: "OBJECT",
            properties: {
                title: { type: "STRING" },
                introduction: { type: "STRING", description: "レポートの導入・背景" },
                sections: {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            heading: { type: "STRING", description: "セクションの見出し" },
                            content: { type: "STRING", description: "セクションの詳細な本文（段落分けなどは改行で行う）" }
                        }
                    }
                },
                conclusion: { type: "STRING", description: "全体のまとめ・結論" }
            }
        };

        const callGeminiAPI = async (prompt, apiKeyToUse, useSearch = false, responseSchema = null, fileData = null) => {
            if (!apiKeyToUse) {
                const err = new Error("APIキーが設定されていません。左下の「設定」からGemini APIキーを入力してください。");
                err.status = 401; throw err;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKeyToUse}`;
            
            const buildPayload = (withSearch) => {
                const parts = [{ text: prompt }];
                if (fileData) {
                    parts.push({ inlineData: { mimeType: fileData.mimeType, data: fileData.base64 } });
                    parts[0].text = "【指示】提供されたドキュメントの内容を読み取り、サイト情報と同様に要約してJSON形式で出力してください。\n\n" + parts[0].text;
                }
                const payload = { contents: [{ role: "user", parts: parts }] };
                if (!fileData) {
                    payload.systemInstruction = { parts: [{ text: "あなたは情報を創作（自動組成）するAIではなく、Webサイトから実際の情報を集め、そのサイトの内容を正確に要約して表示するシステムです。" }] };
                }
                if (withSearch && !fileData) { payload.tools = [{ google_search: {} }]; }
                if (responseSchema) { payload.generationConfig = { responseMimeType: "application/json", responseSchema: responseSchema }; }
                return payload;
            };

            const extractData = (result) => {
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("レスポンスからテキストを抽出できませんでした。");
                let parsedData;
                try { parsedData = JSON.parse(text); } catch (e) { throw new Error("JSONのパースに失敗しました。"); }

                if (useSearch) {
                    const metadata = result.candidates?.[0]?.groundingMetadata || {};
                    const chunks = metadata.groundingChunks || [];
                    const attributions = metadata.groundingAttributions || [];
                    let groundedDocs = chunks.map(c => c.web).filter(Boolean);
                    if (groundedDocs.length === 0) groundedDocs = attributions.map(a => a.web).filter(Boolean);

                    if (groundedDocs.length > 0) {
                        const uniqueDocs = []; const seenUris = new Set();
                        for (const doc of groundedDocs) {
                            if (!seenUris.has(doc.uri)) { seenUris.add(doc.uri); uniqueDocs.push(doc); }
                        }

                        const finalResults = []; const aiResults = parsedData.results || [];
                        for (const doc of uniqueDocs.slice(0, 5)) {
                            let bestMatchItem = null; let maxScore = 0;
                            for (const item of aiResults) {
                                let score = 0;
                                if (item.sourceUrl) {
                                    const u1 = item.sourceUrl.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
                                    const u2 = doc.uri.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
                                    if (u1 === u2 || u2.includes(u1) || u1.includes(u2)) score += 10;
                                }
                                if (item.title && doc.title) {
                                    const t1 = item.title.toLowerCase(); const t2 = doc.title.toLowerCase();
                                    if (t1 === t2 || t2.includes(t1) || t1.includes(t2)) score += 5;
                                }
                                if (score > maxScore) { maxScore = score; bestMatchItem = item; }
                            }

                            if (bestMatchItem && maxScore > 0) {
                                finalResults.push({ ...bestMatchItem, title: doc.title, sourceUrl: doc.uri });
                                aiResults.splice(aiResults.indexOf(bestMatchItem), 1);
                            } else if (aiResults.length > 0) {
                                const fallbackItem = aiResults.shift();
                                finalResults.push({ ...fallbackItem, title: doc.title, sourceUrl: doc.uri });
                            } else {
                                let domain = ""; try { domain = new URL(doc.uri).hostname; } catch(e) {}
                                finalResults.push({
                                    title: doc.title, summary: "（検索結果に基づくサイト情報です。詳細はリンク先をご確認ください）",
                                    sourceName: domain, sourceUrl: doc.uri, date: new Date().toLocaleDateString('ja-JP'),
                                    reliability: "中", reliabilityReason: "検索エンジンからの情報取得", files: []
                                });
                            }
                        }
                        parsedData.results = finalResults;
                    } else if (parsedData.results) {
                        parsedData.results = parsedData.results.filter(item => item.sourceUrl && item.sourceUrl.startsWith('http') && !item.sourceUrl.includes('example.com'));
                    }
                }
                return parsedData;
            };

            try {
                const result = await fetchWithRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildPayload(useSearch)) });
                return extractData(result);
            } catch (error) {
                if (useSearch && (error.status === 400 || error.status === 401 || error.status === 403 || error.status === 404)) {
                    const fallbackResult = await fetchWithRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildPayload(false)) });
                    return extractData(fallbackResult);
                }
                throw error;
            }
        };

        const escapeHtml = (unsafe) => {
            if (!unsafe) return "";
            return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };

        const Icon = (name, size=24, className="") => `<i data-lucide="${name}" width="${size}" height="${size}" class="${className}"></i>`;

        // ==========================================
        // Application State & Actions
        // ==========================================
        const State = {
            userApiKey: "",
            organizationName: DEFAULT_ORG_NAME,
            isSettingsOpen: false,
            isManualOpen: false,
            keywords: [],
            newKeyword: "",
            researchData: [],
            selectedIds: new Set(),
            isResearching: false,
            researchError: null,
            // Slides
            slides: [],
            isGeneratingSlides: false,
            isExportingPDF: false,
            isExportingPPTX: false,
            slideConfig: { theme: 'indigo', detail: 'summary', style: 'standard' },
            // Report
            reportData: null,
            isGeneratingReport: false,
            isExportingReportPDF: false,
            reportConfig: { theme: 'slate', volume: 'detailed', tone: 'academic' },
            // Backups
            isBackupModalOpen: false,
            savedBackups: [],
            // UI
            activeTab: 'research', // 'research' | 'slides' | 'report'
            viewMode: 'card',
            isAnalyzingFile: false,
            fileUploadError: null
        };

        const updateState = (updates, shouldRender = true) => {
            Object.assign(State, updates);
            if (shouldRender) renderApp();
        };

        window.AppActions = {
            setSettingsOpen: (val) => updateState({ isSettingsOpen: val }),
            setBackupModalOpen: (val) => updateState({ isBackupModalOpen: val }),
            setManualOpen: (val) => updateState({ isManualOpen: val }),
            setUserApiKey: (val) => { State.userApiKey = val; }, 
            setOrganizationName: (val) => { State.organizationName = val; },
            resetOrganizationName: () => {
                State.organizationName = DEFAULT_ORG_NAME;
                const input = document.getElementById('org-name-input');
                if (input) input.value = DEFAULT_ORG_NAME;
            },
            setNewKeyword: (val) => { 
                State.newKeyword = val; 
                const btn = document.getElementById('add-keyword-btn');
                if (btn) btn.disabled = !val.trim();
            },
            handleSaveSettings: () => {
                localStorage.setItem('research_app_api_key', State.userApiKey);
                localStorage.setItem('research_app_org_name', State.organizationName || DEFAULT_ORG_NAME);
                if (!State.organizationName) State.organizationName = DEFAULT_ORG_NAME;
                updateState({ isSettingsOpen: false, researchError: null });
            },
            updateResearchData: (newData) => {
                localStorage.setItem('research_app_data', JSON.stringify(newData));
                updateState({ researchData: newData });
            },
            updateKeywords: (newKeywords) => {
                localStorage.setItem('research_app_keywords', JSON.stringify(newKeywords));
                updateState({ keywords: newKeywords });
            },
            handleAddKeyword: (inputStr) => {
                const trimmedInput = inputStr.trim();
                if (!trimmedInput) return;
                const andKeyword = trimmedInput.replace(/[\s、,]+/g, ' ');
                let updated = [...State.keywords];
                let hasNew = false;
                if (!updated.includes(andKeyword)) { updated.push(andKeyword); hasNew = true; }
                
                if (hasNew) {
                    AppActions.updateKeywords(updated);
                    if (State.researchData.length === 0) AppActions.fetchAdditionalResearch(updated);
                    else renderApp();
                } else {
                    renderApp();
                }
            },
            onSubmitKeywordForm: () => {
                AppActions.handleAddKeyword(State.newKeyword);
                State.newKeyword = "";
                renderApp();
            },
            onSelectPresetCategory: (val) => {
                if (val) { AppActions.handleAddKeyword(val); }
            },
            handleRemoveKeyword: (kwToRemove) => {
                AppActions.updateKeywords(State.keywords.filter(kw => kw !== kwToRemove));
            },
            handleClearAllKeywords: () => AppActions.updateKeywords([]),
            setActiveTab: (tab) => updateState({ activeTab: tab }),
            setViewMode: (mode) => updateState({ viewMode: mode }),
            updateSlideConfig: (key, val) => {
                State.slideConfig[key] = val; 
                localStorage.setItem('research_app_slide_config', JSON.stringify(State.slideConfig));
                renderApp();
            },
            updateReportConfig: (key, val) => {
                State.reportConfig[key] = val; 
                localStorage.setItem('research_app_report_config', JSON.stringify(State.reportConfig));
                renderApp();
            },
            handleClearSelection: () => updateState({ selectedIds: new Set() }),
            handleClearAllData: () => {
                localStorage.removeItem('research_app_data');
                localStorage.removeItem('research_app_slides');
                localStorage.removeItem('research_app_report_data');
                updateState({ researchData: [], selectedIds: new Set(), slides: [], reportData: null });
            },
            toggleSelection: (id) => {
                const newSelection = new Set(State.selectedIds);
                if (newSelection.has(id)) newSelection.delete(id);
                else newSelection.add(id);
                updateState({ selectedIds: newSelection });
            },
            handleDeleteItem: (id) => {
                const newData = State.researchData.filter(item => item.id !== id);
                const newSelection = new Set(State.selectedIds);
                if (newSelection.has(id)) newSelection.delete(id);
                localStorage.setItem('research_app_data', JSON.stringify(newData));
                updateState({ researchData: newData, selectedIds: newSelection });
            },

            // ==================
            // Project Export / Import & Backup
            // ==================
            restoreProjectData: (importedData) => {
                if (importedData.keywords) AppActions.updateKeywords(importedData.keywords);
                if (importedData.researchData) AppActions.updateResearchData(importedData.researchData);
                if (importedData.organizationName !== undefined) {
                    State.organizationName = importedData.organizationName || DEFAULT_ORG_NAME;
                    localStorage.setItem('research_app_org_name', State.organizationName);
                }
                if (importedData.slides) {
                    localStorage.setItem('research_app_slides', JSON.stringify(importedData.slides));
                    State.slides = importedData.slides;
                }
                if (importedData.reportData) {
                    localStorage.setItem('research_app_report_data', JSON.stringify(importedData.reportData));
                    State.reportData = importedData.reportData;
                }
                if (importedData.slideConfig) {
                    State.slideConfig = importedData.slideConfig;
                    localStorage.setItem('research_app_slide_config', JSON.stringify(State.slideConfig));
                }
                if (importedData.reportConfig) {
                    State.reportConfig = importedData.reportConfig;
                    localStorage.setItem('research_app_report_config', JSON.stringify(State.reportConfig));
                }
                updateState({ selectedIds: new Set() });
            },

            handleSaveToBrowser: () => {
                const projectData = {
                    keywords: State.keywords,
                    researchData: State.researchData,
                    slides: State.slides,
                    reportData: State.reportData,
                    slideConfig: State.slideConfig,
                    reportConfig: State.reportConfig,
                    organizationName: State.organizationName
                };
                
                const defaultTitle = State.keywords.length > 0 
                    ? State.keywords.join(', ') 
                    : 'キーワードなし';
                const dateStr = new Date().toLocaleString('ja-JP');
                const backupName = prompt("プロジェクトの保存名を入力してください", `${defaultTitle} - ${dateStr}`);
                
                if (backupName === null) return; // キャンセル

                const newBackup = {
                    id: Date.now().toString(),
                    title: backupName,
                    timestamp: Date.now(),
                    data: projectData
                };

                const updatedBackups = [newBackup, ...State.savedBackups];
                localStorage.setItem('research_app_manual_backups', JSON.stringify(updatedBackups));
                updateState({ savedBackups: updatedBackups });
                alert("プロジェクトを保存しました。");
            },

            handleRestoreFromBackup: (id) => {
                const backup = State.savedBackups.find(b => b.id === id);
                if (!backup) return;
                
                if (!confirm(`「${backup.title}」を復元しますか？\n現在の作業状態は上書きされます。`)) return;

                AppActions.restoreProjectData(backup.data);
                updateState({ isBackupModalOpen: false });
                alert("プロジェクトを復元しました。");
            },

            handleDeleteBackup: (id) => {
                if (!confirm("この保存済みプロジェクトを削除しますか？")) return;
                const updatedBackups = State.savedBackups.filter(b => b.id !== id);
                localStorage.setItem('research_app_manual_backups', JSON.stringify(updatedBackups));
                updateState({ savedBackups: updatedBackups });
            },

            handleExportProject: () => {
                const projectData = {
                    keywords: State.keywords,
                    researchData: State.researchData,
                    slides: State.slides,
                    reportData: State.reportData,
                    slideConfig: State.slideConfig,
                    reportConfig: State.reportConfig,
                    organizationName: State.organizationName
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projectData));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "Auto_Researcher_Backup_" + new Date().toISOString().split('T')[0] + ".json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            },

            handleImportProject: (event) => {
                const file = event.target.files?.[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        AppActions.restoreProjectData(importedData);
                        alert("プロジェクトデータを正常に復元しました。");
                    } catch (err) {
                        alert("ファイルの読み込みに失敗しました。正しいバックアップファイルを選択してください。");
                    } finally {
                        event.target.value = '';
                    }
                };
                reader.readAsText(file);
            },
            
            // Core Logic Functions
            handleFileUpload: async (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                updateState({ isAnalyzingFile: true, researchError: null, fileUploadError: null });

                try {
                    const ext = file.name.split('.').pop().toLowerCase();
                    const isTextFile = ['txt', 'html', 'htm', 'csv', 'md'].includes(ext);
                    let fileData = null; let fileContentText = "";

                    if (isTextFile) {
                        const text = await file.text();
                        fileContentText = text.substring(0, 30000);
                    } else {
                        let mimeType = file.type;
                        if (!mimeType) {
                            if (ext === 'pdf') mimeType = 'application/pdf';
                            else if (ext === 'docx') mimeType = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
                            else if (ext === 'doc') mimeType = 'application/msword';
                            else if (ext === 'pptx') mimeType = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
                            else if (ext === 'ppt') mimeType = 'application/vnd.ms-powerpoint';
                            else if (ext === 'xlsx') mimeType = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
                            else if (ext === 'xls') mimeType = 'application/vnd.ms-excel';
                            else mimeType = 'application/octet-stream';
                        }
                        const base64Data = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result.split(',')[1]);
                            reader.onerror = reject; reader.readAsDataURL(file);
                        });
                        fileData = { mimeType, base64: base64Data };
                    }

                    const prompt = `提供されたファイル（ファイル名: ${file.name}）の内容を詳細に分析し、重要な情報を抽出してください。
                    ${isTextFile ? `\n\n【ファイル内容】\n${fileContentText}\n\n` : ''}
                    出力は指定されたJSON形式に従い、以下の点に注意してください。
                    - 正常に読み取れた場合は、このファイルから読み取れる中核となる情報や要約を「summary」に記載すること。
                    - 情報の公開日や作成日がわかる場合は「date」に記載し、不明な場合は「${new Date().toLocaleDateString('ja-JP')}（取得日）」と記載すること。
                    - 明確な出典元として「アップロードファイル: ${file.name}」を含め、URLは「#」とすること。`;

                    const data = await callGeminiAPI(prompt, State.userApiKey, false, searchResultSchema, fileData);
                    
                    if (data && data.results && data.results.length > 0) {
                        const newResult = { ...data.results[0], id: `file-${Date.now()}`, sourceName: `アップロード: ${file.name}` };
                        const newData = [newResult, ...State.researchData];
                        const newSelectedIds = new Set(State.selectedIds).add(newResult.id);
                        localStorage.setItem('research_app_data', JSON.stringify(newData));
                        updateState({ researchData: newData, selectedIds: newSelectedIds });
                    } else {
                        throw new Error("情報の抽出に失敗しました。");
                    }
                } catch (err) {
                    let errMsg = "ファイルの分析に失敗しました。";
                    if (err.status === 401 || err.status === 403) errMsg = err.message || "APIキーが無効か、正しく設定されていません。";
                    else if (err.status === 400) errMsg += " 未対応のファイル形式です。";
                    else if (err.status === 404) errMsg = "指定されたAIモデルが見つかりません。";
                    updateState({ fileUploadError: errMsg });
                } finally {
                    updateState({ isAnalyzingFile: false });

            fetchAdditionalResearch: async (targetKeywords = State.keywords) => {
                if (targetKeywords.length === 0) return;
                if (!State.userApiKey) {
                    updateState({ researchError: "APIキーが設定されていません。左下の「設定」からGemini APIキーを入力してください。", isSettingsOpen: true });
                    return;
                }

                updateState({ isResearching: true, researchError: null });
                const formattedKeywords = targetKeywords.join(' ');
                const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });

                const prompt = `現在は${today}です。キーワード「${formattedKeywords}」について、検索した時点での最新の情勢や情報を参照し、詳しく分かりやすい回答を提供してください。
回答の文体は「だ・である」調（常体）で統一してください。
また、回答の最後には必ず「===SOURCES===」という行を追加し、その下に参考にしたWEBサイトのリストを以下のJSON形式で出力してください（Markdownブロックは使わず、直接JSON配列を記述してください）。
[
  { "url": "サイトのURL", "title": "サイト内の正確な記事タイトル", "description": "サイトの内容の3行程度の要約", "date": "情報が作成または更新された日付(YYYY/MM/DD形式。不明な場合は空文字)", "sourceName": "具体的なサイト元（メディア名など。正式名称を記載）", "reliability": "高、中、低のいずれか", "reliabilityReason": "信頼度の判定理由" }
]
【信頼度の判定基準】
- 高: 公的な機関、または民間企業のうち誰もが知る有名企業・大手メディア・報道機関の情報
- 中: 一般的な民間企業、一般的なニュースサイト・情報サイトの情報
- 低: 学者、有識者、個人のオピニオン記事、ブログなどの情報
【抽出件数】最大10件程度ピックアップしてください。`;

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${State.userApiKey}`;
                    const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }], tools: [{ google_search: {} }] };
                    const response = await fetchWithRetry(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

                    if (!response || !response.candidates || response.candidates.length === 0) throw new Error("回答の生成に失敗しました。");
                    
                    const candidate = response.candidates[0];
                    const rawText = candidate?.content?.parts?.[0]?.text || "";
                    let sourceData = {}; const sourcesMarker = "===SOURCES===";
                    
                    if (rawText.includes(sourcesMarker)) {
                        const partsArray = rawText.split(sourcesMarker);
                        const jsonStr = partsArray[1].match(/\[[\s\S]*\]/);
                        if (jsonStr) {
                            try {
                                const sourcesJson = JSON.parse(jsonStr[0]);
                                if (Array.isArray(sourcesJson)) sourcesJson.forEach(item => { if (item.url) sourceData[item.url.trim().replace(/\/$/, '')] = item; });
                            } catch(e) {}
                        }
                    }

                    const chunks = candidate.groundingMetadata?.groundingChunks || [];
                    const attributions = candidate.groundingMetadata?.groundingAttributions || [];
                    const uniqueSources = []; const seenUrls = new Set();
                    
                    const processSource = (uri, chunkTitle) => {
                        if (uri && !seenUrls.has(uri)) {
                            seenUrls.add(uri); 
                            const cleanUrl = uri.trim().replace(/\/$/, '');
                            let extData = sourceData[cleanUrl];
                            if (!extData) {
                                const domain = getDomain(uri);
                                const matchUrl = Object.keys(sourceData).find(k => getDomain(k) === domain);
                                if (matchUrl) extData = sourceData[matchUrl];
                            }
                            uniqueSources.push({
                                id: `res-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                                title: extData?.title || chunkTitle || getDomain(uri) || "ウェブページ",
                                summary: extData?.description || "このサイトの詳しい情報はリンク先をご覧ください。",
                                sourceName: extData?.sourceName || getDomain(uri),
                                sourceUrl: uri, date: extData?.date || "",
                                reliability: extData?.reliability || "中",
                                reliabilityReason: extData?.reliabilityReason || "Google検索結果（実際のページ）からの抽出",
                                files: []
                            });
                        }
                    };

                    for (const chunk of chunks) processSource(chunk.web?.uri, chunk.web?.title);
                    if (uniqueSources.length === 0) for (const attr of attributions) processSource(attr.web?.uri, attr.web?.title);
                    if (uniqueSources.length === 0) throw new Error("関連するWebサイト情報が見つかりませんでした。別のキーワードをお試しください。");

                    uniqueSources.sort((a, b) => {
                        const getTime = (dateStr) => {
                            if (!dateStr) return 0;
                            const d = new Date(dateStr.replace(/\//g, '-'));
                            return isNaN(d.getTime()) ? 0 : d.getTime();
                        };
                        return getTime(b.date) - getTime(a.date);
                    });

                    const newData = [...uniqueSources, ...State.researchData];
                    localStorage.setItem('research_app_data', JSON.stringify(newData));
                    updateState({ researchData: newData });
                } catch (err) {
                    let errMsg = err.message || "情報の取得に失敗しました。時間をおいて再度お試しください。";
                    if (err.status === 401 || err.status === 403 || err.message.includes("401") || err.message.includes("403")) {
                        errMsg = "API連携エラー: APIキーが正しく設定されていないか、無効です。設定を確認してください。";
                        updateState({ researchError: errMsg, isSettingsOpen: true, isResearching: false });
                        return;
                    } else if (err.status === 404 || err.message.includes("404")) {
                        errMsg = "APIモデルエラー: 指定されたモデルが利用できません。APIキーの権限等を確認してください。";
                    }
                    updateState({ researchError: errMsg });
                } finally {
                    updateState({ isResearching: false });
                }
            },

            handleExportReportPDF: async () => {
                updateState({ isExportingReportPDF: true });
                try {
                    await AppActions.loadPdfLibraries();
                    const { jsPDF } = window.jspdf;
                    
                    const element = document.getElementById('report-document');
                    if (!element) throw new Error("レポートが見つかりません。");

                    const currentThemeKey = State.reportConfig.theme || 'slate';
                    const currentTheme = THEME_COLORS[currentThemeKey] || THEME_COLORS.slate;
                    const hexColors = THEME_COLORS_HEX[currentThemeKey] || THEME_COLORS_HEX.slate;

                    const container = document.createElement('div');
                    container.style.position = 'absolute';
                    container.style.top = '0';
                    container.style.left = '0';
                    container.style.zIndex = '-9999';
                    container.style.opacity = '0.01';
                    container.style.pointerEvents = 'none';
                    container.style.width = '794px'; 
                    document.body.appendChild(container);

                    const r = State.reportData;
                    const blocks = [];
                    
                    // レポートの各要素をブロックごとに分割して配列に格納
                    blocks.push(`<h1 class="text-3xl font-bold mb-8 pb-4 border-b-4 ${currentTheme.border} ${currentTheme.text} leading-tight" style="border-bottom-color: ${hexColors.border}; color: ${hexColors.main}; margin-top: 0;">${escapeHtml(r.title)}</h1>`);
                    
                    if (r.introduction) {
                        blocks.push(`<div class="mb-10 text-lg leading-relaxed text-slate-700 whitespace-pre-wrap">${escapeHtml(r.introduction)}</div>`);
                    }
                    
                    if (r.sections) {
                        r.sections.forEach(sec => {
                            blocks.push(`
                                <h2 class="text-xl font-bold mt-6 mb-4 pb-2 border-b-2 ${currentTheme.border} ${currentTheme.text} flex items-center gap-2" style="border-bottom-color: ${hexColors.border}; color: ${hexColors.main};">
                                    <span class="w-1.5 h-6 ${currentTheme.bg} inline-block rounded-sm" style="background-color: ${hexColors.main};"></span>
                                    ${escapeHtml(sec.heading)}
                                </h2>
                            `);
                            
                            // 本文は改行ごとに段落として分割し、ページまたぎで切れないようにする
                            const paragraphs = sec.content.split('\n').filter(p => p.trim().length > 0);
                            paragraphs.forEach(p => {
                                blocks.push(`<p class="mb-4 leading-relaxed text-slate-700 whitespace-pre-wrap">${escapeHtml(p)}</p>`);
                            });
                        });
                    }
                    
                    if (r.conclusion) {
                        blocks.push(`
                            <div class="mt-8 pt-8 border-t border-slate-200">
                                <div class="${currentTheme.light} p-6 rounded-xl" style="background-color: ${hexColors.light};">
                                    <h3 class="text-lg font-bold mb-3 ${currentTheme.text} flex items-center gap-2" style="color: ${hexColors.main};">${Icon('info', 18)} まとめ・結論</h3>
                                    <p class="leading-relaxed text-slate-700 whitespace-pre-wrap m-0">${escapeHtml(r.conclusion)}</p>
                                </div>
                            </div>
                        `);
                    }

                    let currentContentDiv = null;
                    const PAGE_HEIGHT = 1122;
                    const PADDING = 50; 
                    const MAX_H = PAGE_HEIGHT - (PADDING * 2) - 40; // フッター領域を考慮した最大高さ

                    const createPage = () => {
                        const page = document.createElement('div');
                        page.className = 'pdf-page-element';
                        page.style.width = '794px';
                        page.style.height = '1122px';
                        page.style.backgroundColor = 'white';
                        page.style.padding = `${PADDING}px`;
                        page.style.position = 'relative';
                        page.style.boxSizing = 'border-box';
                        page.style.overflow = 'hidden';
                        page.style.fontFamily = 'sans-serif';

                        const content = document.createElement('div');
                        page.appendChild(content);
                        
                        const footer = document.createElement('div');
                        footer.style.position = 'absolute';
                        footer.style.bottom = '40px';
                        footer.style.right = '50px';
                        footer.style.fontSize = '12px';
                        footer.style.color = '#94a3b8';
                        footer.innerHTML = `${escapeHtml(State.organizationName)} - ${new Date().toLocaleDateString('ja-JP')}`;
                        page.appendChild(footer);

                        container.appendChild(page);
                        currentContentDiv = content;
                    };

                    createPage();

                    // 要素を1つずつページに詰め込み、高さを超えたら新しいページを作る
                    for (const blockHtml of blocks) {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = blockHtml;
                        const blockEl = tempDiv.firstElementChild;
                        
                        currentContentDiv.appendChild(blockEl);
                        
                        if (currentContentDiv.offsetHeight > MAX_H) {
                            currentContentDiv.removeChild(blockEl);
                            createPage();
                            currentContentDiv.appendChild(blockEl);
                        }
                    }

                    if (window.lucide) {
                        window.lucide.createIcons({ root: container });
                    }

                    // レンダリング待機
                    await new Promise(resolve => setTimeout(resolve, 800));

                    const pages = container.querySelectorAll('.pdf-page-element');
                    const pdf = new jsPDF({ unit: 'px', format: [794, 1122], orientation: 'portrait' });

                    for (let i = 0; i < pages.length; i++) {
                        const canvas = await window.html2canvas(pages[i], {
                            scale: 2,
                            useCORS: true,
                            logging: false,
                            backgroundColor: '#ffffff'
                        });
                        
                        const imgData = canvas.toDataURL('image/jpeg', 0.98);
                        
                        if (i > 0) pdf.addPage();
                        pdf.addImage(imgData, 'JPEG', 0, 0, 794, 1122);
                    }

                    pdf.save(`report_${new Date().getTime()}.pdf`);
                    document.body.removeChild(container);

                } catch (error) { 
                    console.error(error);
                    alert("PDFの生成に失敗しました。"); 
                } 
                finally { updateState({ isExportingReportPDF: false }); }
            },

                            <select onchange="AppActions.updateSlideConfig('detail', this.value)" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="summary" ${State.slideConfig.detail === 'summary' ? 'selected' : ''}>概要のみ (要点を絞ってシンプルに)</option>
                                <option value="detailed" ${State.slideConfig.detail === 'detailed' ? 'selected' : ''}>詳細 (背景や具体例を含めて詳述)</option>
                            </select>
                        </div>
                        <div>
                            <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 mb-2">${Icon('layout-template', 14)} スライドスタイル</label>
                            <select onchange="AppActions.updateSlideConfig('style', this.value)" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="standard" ${State.slideConfig.style === 'standard' ? 'selected' : ''}>標準 (テキスト箇条書きベース)</option>
                                <option value="visual" ${State.slideConfig.style === 'visual' ? 'selected' : ''}>ポンチ絵風 (図解ベース)</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end pt-2">
                        <button onclick="AppActions.handleGenerateSlides()" ${State.selectedIds.size === 0 || State.isGeneratingSlides ? 'disabled' : ''} class="flex items-center justify-center gap-2 w-full md:w-auto px-8 py-3 bg-indigo-600 text-white text-sm font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors shadow-sm">
                            ${State.isGeneratingSlides ? `${Icon('loader-2', 18, "animate-spin")} AIがスライドを構成中...` : `この設定でスライドを生成する`}
                        </button>
                    </div>
                </div>
            `;

            if (State.slides.length > 0 && !State.isGeneratingSlides) {
                content += `
                    <div class="flex flex-wrap items-center gap-3 mb-8 justify-end print:hidden">
                        <span class="text-sm font-bold text-slate-500 mr-2">エクスポート:</span>
                        <button onclick="AppActions.handleExportPDF()" ${State.isExportingPDF ? 'disabled' : ''} class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-lg transition-colors shadow-sm disabled:opacity-50">
                            ${State.isExportingPDF ? Icon('loader-2', 16, "text-slate-500 animate-spin") : Icon('printer', 16, "text-slate-500")} ${State.isExportingPDF ? "PDF生成中..." : "PDF出力"}
                        </button>
                        <button onclick="AppActions.handleExportHTML()" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-lg transition-colors shadow-sm">
                            ${Icon('globe', 16, "text-blue-500")} HTML
                        </button>
                        <button onclick="AppActions.handleExportPPTX()" ${State.isExportingPPTX ? 'disabled' : ''} class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-lg transition-colors shadow-sm disabled:opacity-50">
                            ${State.isExportingPPTX ? Icon('loader-2', 16, "text-orange-500 animate-spin") : Icon('monitor-play', 16, "text-orange-500")} ${State.isExportingPPTX ? "PPTX生成中..." : "PPTX出力"}
                        </button>
                    </div>
                `;
            }

            if (!State.isGeneratingSlides && State.slides.length === 0) {
                content += `
                    <div class="text-center py-16 bg-white border border-slate-200 border-dashed rounded-xl print:hidden">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-50 mb-4">${Icon('presentation', 32, "text-slate-300")}</div>
                        <h3 class="text-lg font-medium text-slate-900 mb-2">プレビュー準備完了</h3><p class="text-sm text-slate-500">上の「この設定でスライドを生成する」ボタンを押してください。</p>
                    </div>`;
            } else if (!State.isGeneratingSlides) {
                content += `<div class="space-y-10 print:space-y-0 print:block">` + State.slides.map((slide, idx) => {
                    const currentTheme = THEME_COLORS[State.slideConfig.theme] || THEME_COLORS.indigo;
                    let slideBody = "";
                    if (slide.layout === 'visual' && slide.diagramNodes && slide.diagramNodes.length > 0) {
                        slideBody = `<div class="grid grid-cols-2 gap-8 w-full">` + slide.diagramNodes.map((node, nIdx) => `
                            <div class="bg-white border-2 ${currentTheme.border} rounded-2xl p-6 shadow-sm flex flex-col items-center text-center relative">
                                <div class="w-14 h-14 ${currentTheme.light} ${currentTheme.text} rounded-full flex items-center justify-center font-bold text-2xl mb-4">${nIdx + 1}</div>
                                <h4 class="font-bold text-slate-800 text-xl mb-3">${escapeHtml(node.label)}</h4>
                                <p class="text-base text-slate-600 leading-relaxed">${escapeHtml(node.desc)}</p>
                            </div>`).join('') + `</div>`;
                    } else {
                        slideBody = `<ul class="space-y-6">` + (slide.bullets || []).map(bullet => `
                            <li class="flex items-start gap-5 text-slate-800 text-xl">
                                ${Icon('arrow-right', 28, `${currentTheme.icon} shrink-0 mt-1`)}
                                <span class="leading-relaxed">${escapeHtml(bullet)}</span>
                            </li>`).join('') + `</ul>`;
                    }

                    return `
                        <div class="relative bg-white rounded-xl shadow-xl border border-slate-200 overflow-hidden aspect-[16/9] flex flex-col print:w-[100vw] print:h-[100vh] print:aspect-auto print:border-none print:shadow-none print:rounded-none print:break-after-page print:color-adjust-exact">
                            <div class="${currentTheme.bg} text-white px-10 py-6 flex items-center justify-between">
                                <h3 class="text-3xl font-bold tracking-wide">${escapeHtml(slide.title)}</h3><span class="opacity-80 font-bold text-xl">${slide.page}</span>
                            </div>
                            <div class="flex-1 p-12 bg-slate-50 flex flex-col justify-center">${slideBody}</div>
                            <div class="bg-white border-t border-slate-200 px-10 py-4 flex justify-between items-center text-sm font-medium text-slate-500">
                                <span>${escapeHtml(State.organizationName)}</span><span>${new Date().toLocaleDateString('ja-JP')}</span>
                            </div>
                        </div>`;
                }).join('') + `</div>`;
            }

            return `<div class="max-w-4xl mx-auto">${content}</div>`;
        };

        const renderReportTab = () => {
            let content = `
                <div class="bg-white p-6 border border-slate-200 shadow-sm rounded-xl mb-8 flex flex-col gap-5 print:hidden">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">${Icon('book-open', 20, "text-indigo-600")} レポート生成設定</h2>
                        <span class="text-sm font-medium text-slate-500">選択中: <strong class="text-indigo-600">${State.selectedIds.size}</strong> 件のデータ</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 mb-2">${Icon('palette', 14)} テーマカラー</label>
                            <select onchange="AppActions.updateReportConfig('theme', this.value)" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="slate" ${State.reportConfig.theme === 'slate' ? 'selected' : ''}>ダークスレート (標準・シック)</option>
                                <option value="indigo" ${State.reportConfig.theme === 'indigo' ? 'selected' : ''}>インディゴ (知的・信頼)</option>
                                <option value="emerald" ${State.reportConfig.theme === 'emerald' ? 'selected' : ''}>エメラルド (自然・調和)</option>
                                <option value="rose" ${State.reportConfig.theme === 'rose' ? 'selected' : ''}>ローズ (情熱・温かみ)</option>
                                <option value="sky" ${State.reportConfig.theme === 'sky' ? 'selected' : ''}>スカイブルー (爽やか・クリア)</option>
                                <option value="amber" ${State.reportConfig.theme === 'amber' ? 'selected' : ''}>アンバー (活気・ポジティブ)</option>
                                <option value="violet" ${State.reportConfig.theme === 'violet' ? 'selected' : ''}>バイオレット (洗練・エレガント)</option>
                                <option value="teal" ${State.reportConfig.theme === 'teal' ? 'selected' : ''}>ティール (モダン・知的)</option>
                            </select>
                        </div>
                        <div>
                            <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 mb-2">${Icon('align-left', 14)} ボリューム (文字量)</label>
                            <select onchange="AppActions.updateReportConfig('volume', this.value)" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="detailed" ${State.reportConfig.volume === 'detailed' ? 'selected' : ''}>詳細 (背景や具体例を含めて詳述)</option>
                                <option value="concise" ${State.reportConfig.volume === 'concise' ? 'selected' : ''}>簡潔 (要点を絞って短く)</option>
                            </select>
                        </div>
                        <div>
                            <label class="flex items-center gap-1.5 text-xs font-bold text-slate-500 mb-2">${Icon('layout-template', 14)} 文体・トーン</label>
                            <select onchange="AppActions.updateReportConfig('tone', this.value)" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="academic" ${State.reportConfig.tone === 'academic' ? 'selected' : ''}>論文調 (客観的、だ・である調)</option>
                                <option value="business" ${State.reportConfig.tone === 'business' ? 'selected' : ''}>ビジネス調 (丁寧、です・ます調)</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end pt-2">
                        <button onclick="AppActions.handleGenerateReport()" ${State.selectedIds.size === 0 || State.isGeneratingReport ? 'disabled' : ''} class="flex items-center justify-center gap-2 w-full md:w-auto px-8 py-3 bg-indigo-600 text-white text-sm font-bold rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors shadow-sm">
                            ${State.isGeneratingReport ? `${Icon('loader-2', 18, "animate-spin")} AIがレポートを構成中...` : `この設定でレポートを生成する`}
                        </button>
                    </div>
                </div>
            `;

            if (State.reportData && !State.isGeneratingReport) {
                content += `
                    <div class="flex flex-wrap items-center gap-3 mb-8 justify-end print:hidden">
                        <span class="text-sm font-bold text-slate-500 mr-2">エクスポート:</span>
                        <button onclick="AppActions.handleExportReportPDF()" ${State.isExportingReportPDF ? 'disabled' : ''} class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-lg transition-colors shadow-sm disabled:opacity-50">
                            ${State.isExportingReportPDF ? Icon('loader-2', 16, "text-slate-500 animate-spin") : Icon('printer', 16, "text-slate-500")} ${State.isExportingReportPDF ? "PDF生成中..." : "PDF出力"}
                        </button>
                        <button onclick="AppActions.handleExportReportHTML('standard')" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-lg transition-colors shadow-sm">
                            ${Icon('file', 16, "text-slate-500")} HTML(標準)
                        </button>
                        <button onclick="AppActions.handleExportReportHTML('a4')" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold rounded-lg transition-colors shadow-sm" title="A4用紙サイズのデザインで出力します">
                            ${Icon('globe', 16, "text-blue-500")} HTML(A4スタイル)
                        </button>
                    </div>
                `;
            }

            if (!State.isGeneratingReport && !State.reportData) {
                content += `
                    <div class="text-center py-16 bg-white border border-slate-200 border-dashed rounded-xl print:hidden">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-50 mb-4">${Icon('book-open', 32, "text-slate-300")}</div>
                        <h3 class="text-lg font-medium text-slate-900 mb-2">プレビュー準備完了</h3><p class="text-sm text-slate-500">上の「この設定でレポートを生成する」ボタンを押してください。</p>
                    </div>`;
            } else if (!State.isGeneratingReport && State.reportData) {
                const r = State.reportData;
                const currentThemeKey = State.reportConfig.theme || 'slate';
                const currentTheme = THEME_COLORS[currentThemeKey] || THEME_COLORS.slate;
                const hexColors = THEME_COLORS_HEX[currentThemeKey] || THEME_COLORS_HEX.slate;
                
                content += `
                    <div id="report-document" class="max-w-3xl mx-auto bg-white p-10 md:p-16 shadow-xl rounded-xl text-slate-800 print:shadow-none print:p-0">
                        <h1 class="text-3xl font-bold mb-8 pb-4 border-b-4 ${currentTheme.border} ${currentTheme.text} leading-tight" style="border-bottom-color: ${hexColors.border}; color: ${hexColors.main};">${escapeHtml(r.title)}</h1>
                        
                        ${r.introduction ? `<div class="mb-10 text-lg leading-relaxed text-slate-700 whitespace-pre-wrap">${escapeHtml(r.introduction)}</div>` : ''}
                        
                        ${(r.sections || []).map(sec => `
                            <div class="mb-8">
                                <h2 class="text-xl font-bold mb-4 pb-2 border-b-2 ${currentTheme.border} ${currentTheme.text} flex items-center gap-2" style="border-bottom-color: ${hexColors.border}; color: ${hexColors.main};">
                                    <span class="w-1.5 h-6 ${currentTheme.bg} inline-block rounded-sm" style="background-color: ${hexColors.main};"></span>
                                    ${escapeHtml(sec.heading)}
                                </h2>
                                <p class="leading-relaxed text-slate-700 whitespace-pre-wrap">${escapeHtml(sec.content)}</p>
                            </div>
                        `).join('')}
                        
                        ${r.conclusion ? `
                            <div class="mt-10 pt-8 border-t border-slate-200">
                                <div class="${currentTheme.light} p-6 rounded-xl" style="background-color: ${hexColors.light};">
                                    <h3 class="text-lg font-bold mb-3 ${currentTheme.text} flex items-center gap-2" style="color: ${hexColors.main};">${Icon('info', 18)} まとめ・結論</h3>
                                    <p class="leading-relaxed text-slate-700 whitespace-pre-wrap">${escapeHtml(r.conclusion)}</p>
                                </div>
                            </div>
                        ` : ''}

                        <div class="mt-12 text-right text-sm font-medium text-slate-400">
                            ${escapeHtml(State.organizationName)} - ${new Date().toLocaleDateString('ja-JP')}
                        </div>
                    </div>
                `;
            }

            return `<div class="max-w-4xl mx-auto">${content}</div>`;
        };

        const renderApp = () => {
            const root = document.getElementById('root');
            
            // スクロール位置の保存
            const mainScrollArea = document.getElementById('main-scroll-area');
            const mainScrollTop = mainScrollArea ? mainScrollArea.scrollTop : 0;
            const sidebarScrollArea = document.getElementById('sidebar-scroll-area');
            const sidebarScrollTop = sidebarScrollArea ? sidebarScrollArea.scrollTop : 0;

            root.innerHTML = `
                <div class="flex h-screen bg-slate-50 font-sans text-slate-800">
                    ${renderSettingsModal()}
                    ${renderBackupModal()}
                    ${renderManualModal()}
                    ${renderSidebar()}
                    <main class="flex-1 flex flex-col overflow-hidden print:overflow-visible">
                        ${renderMainHeader()}
                        <div id="main-scroll-area" class="flex-1 overflow-y-auto p-6 print:overflow-visible print:p-0">
                            ${State.activeTab === 'research' ? renderResearchTab() : ''}
                            ${State.activeTab === 'slides' ? renderSlidesTab() : ''}
                            ${State.activeTab === 'report' ? renderReportTab() : ''}
                        </div>
                        <footer class="bg-white border-t border-slate-200 py-2.5 text-center print:hidden z-0 shrink-0">
                            <p class="text-xs font-medium text-slate-500">&copy; ${new Date().getFullYear()} 一般社団法人日本みらい研 All Rights Reserved.</p>
                        </footer>
                    </main>
                </div>
            `;
            lucide.createIcons();

            // スクロール位置の復元
            const newMainScrollArea = document.getElementById('main-scroll-area');
            if (newMainScrollArea) newMainScrollArea.scrollTop = mainScrollTop;
            const newSidebarScrollArea = document.getElementById('sidebar-scroll-area');
            if (newSidebarScrollArea) newSidebarScrollArea.scrollTop = sidebarScrollTop;
        };

        // ==========================================
        // Initialization
        // ==========================================
        window.onload = () => {
            const savedKey = localStorage.getItem('research_app_api_key');
            if (savedKey) State.userApiKey = savedKey;

            const savedOrgName = localStorage.getItem('research_app_org_name');
            if (savedOrgName) State.organizationName = savedOrgName;

            const savedKeywords = localStorage.getItem('research_app_keywords');
            if (savedKeywords) State.keywords = JSON.parse(savedKeywords);

            const savedData = localStorage.getItem('research_app_data');
            if (savedData) State.researchData = JSON.parse(savedData);

            const savedSlides = localStorage.getItem('research_app_slides');
            if (savedSlides) State.slides = JSON.parse(savedSlides);

            const savedReport = localStorage.getItem('research_app_report_data');
            if (savedReport) State.reportData = JSON.parse(savedReport);

            const savedSlideConfig = localStorage.getItem('research_app_slide_config');
            if (savedSlideConfig) State.slideConfig = JSON.parse(savedSlideConfig);

            const savedReportConfig = localStorage.getItem('research_app_report_config');
            if (savedReportConfig) State.reportConfig = JSON.parse(savedReportConfig);

            const savedBackups = localStorage.getItem('research_app_manual_backups');
            if (savedBackups) State.savedBackups = JSON.parse(savedBackups);

            renderApp();
        };
    </script>
</body>
</html>
