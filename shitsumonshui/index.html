<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国会質問主意書及び答弁書ダッシュボード - 第219回国会</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; }
  .fade-in { animation: fadeIn 0.2s ease-out; }

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-6 shadow-lg sticky top-0 z-20">
    <div class="max-w-7xl mx-auto flex items-center gap-3">
      <i data-lucide="book-open" class="w-10 h-10 text-blue-400"></i>
      <h1 class="text-3xl font-bold truncate">国会質問主意書及び答弁書ダッシュボード</h1>
    </div>
  </header>

  <!-- Info Bar (Added) -->
  <div class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-2 flex flex-col sm:flex-row sm:items-center justify-between text-sm text-slate-500 gap-2">
      <div class="flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 text-blue-500"></i>
        <span>対象: <span class="font-bold text-slate-700 text-base">第219回国会</span></span>
      </div>
      <div class="flex items-center gap-2">
        <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
        <span>データ読込日: 2025/12/17</span>
      </div>
    </div>
  </div>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6 flex-grow w-full">
    
    <!-- Stats Cards Container -->
    <div id="stats-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <!-- Filters & View Toggle -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col lg:flex-row gap-4 items-center sticky top-[130px] z-10 shadow-md">
      <div class="relative flex-1 w-full">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
        <input 
          type="text" 
          id="search-input"
          placeholder="キーワード検索（スペース区切りで複数指定可）..." 
          class="w-full pl-10 pr-10 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
        />
        <button id="clear-search" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition-colors hidden">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      
      <div class="flex gap-2 w-full lg:w-auto overflow-x-auto pb-1 md:pb-0 items-center">
        <div class="relative min-w-[120px]">
           <i data-lucide="filter" class="absolute left-3 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-500"></i>
           <select id="house-select" class="w-full pl-8 pr-4 py-2 border border-slate-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none appearance-none cursor-pointer">
             <option value="all">全ての院</option>
             <option value="衆議院">衆議院</option>
             <option value="参議院">参議院</option>
           </select>
        </div>

        <div class="relative min-w-[160px]">
           <i data-lucide="layout-dashboard" class="absolute left-3 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-500"></i>
           <select id="category-select" class="w-full pl-8 pr-4 py-2 border border-slate-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none appearance-none cursor-pointer">
             <option value="all">全ての分野</option>
           </select>
        </div>

        <button
          id="clear-all-filters"
          class="flex items-center px-3 py-2 text-sm text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 rounded-lg transition-colors whitespace-nowrap ml-1 hidden"
          title="全ての検索・絞り込み条件をクリア"
        >
          <i data-lucide="rotate-ccw" class="w-4 h-4 mr-1.5"></i>
          <span class="hidden sm:inline">クリア</span>
        </button>

        <div class="border-l pl-2 ml-2 flex bg-slate-100 p-1 rounded-lg">
          <button id="view-table" class="p-1.5 rounded-md transition-all bg-white shadow text-blue-600" title="リスト表示">
            <i data-lucide="list" class="w-5 h-5"></i>
          </button>

            <i data-lucide="grid" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Analysis Container -->
    <div id="analysis-container"></div>

    <!-- Data List Container -->
    <div id="data-container"></div>

    <div id="footer-info" class="text-center text-xs text-slate-400 mt-8"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm mt-auto">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2025 一般社団法人日本みらい研作成</p>
    </div>
  </footer>

  <!-- Modal -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm" onclick="closeModal(event)">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto flex flex-col fade-in" onclick="event.stopPropagation()">
      
      <!-- Modal Header -->
      <div class="p-6 border-b border-slate-100 flex justify-between items-start sticky top-0 bg-white z-10">
        <div>
          <div class="flex items-center gap-2 mb-2">
            <span id="modal-house-badge" class="px-2 py-0.5 rounded text-xs font-bold text-white"></span>
            <span id="modal-id" class="text-slate-400 text-sm font-mono"></span>
          </div>
          <h2 id="modal-title" class="text-xl font-bold text-slate-800 leading-snug"></h2>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 bg-slate-100 rounded-full transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <!-- Modal Content -->
      <div class="p-6 space-y-6">
        <!-- Info Grid -->
        <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-lg text-sm border border-slate-100">
          <div>
            <span class="block text-xs text-slate-500 mb-1">提出者</span>
            <span id="modal-questioner" class="font-medium text-slate-800"></span>
          </div>
          <div>
            <span class="block text-xs text-slate-500 mb-1">分野</span>
            <span id="modal-category" class="font-medium text-slate-800"></span>
          </div>
        </div>

        <!-- Summary -->
        <div>
          <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wide mb-2 flex items-center gap-2">
            <i data-lucide="file-text" class="w-4 h-4 text-blue-500"></i>
            答弁要約
          </h3>
          <div id="modal-summary" class="bg-blue-50/50 p-5 rounded-lg border border-blue-100 text-slate-700 leading-relaxed text-sm shadow-sm"></div>
        </div>

        <!-- Links -->
        <div>
          <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wide mb-3">公式リンク</h3>
          <div id="modal-links" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </div>
      </div>
      
      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
        <button onclick="closeModal()" class="w-full py-2 bg-white border border-slate-300 rounded-lg text-slate-700 font-medium hover:bg-slate-50 transition-colors">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <script>

    const ALL_DATA = [{"id":"衆-1","house":"衆議院","number":1,"title":"就労系障害福祉サービスにおける在宅支援に関する質問主意書","question_point":"就労系障害福祉サービスにおける在宅支援","questioner":"日野紗里亜君","category":"社会保障・医療・福祉","answer_point":"在宅支援の位置付けを制度・通知で整理した上で、具体的な運用は自治体・事業者の判断に委ねられる旨を説明。全国一律の基準策定や新たな制度創設は示さず、現行制度の枠内で対応する姿勢。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219001.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219001.pdf/$File/a219001.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219001.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219001.pdf/$File/b219001.pdf","answer_point_summary":"在宅支援の位置付けを制度・通知で整理した上で、具体的な運用は自治体・事業者の判断に委ねられる旨を説明。全国一律の基準策定や新たな制度創設は示さず、現行制度の枠内で対応する姿勢。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-2","house":"衆議院","number":2,"title":"事件報道における被疑者の疾患等のプライバシーに関する質問主意書","question_point":"事件報道における被疑者の疾患等のプライバシー","questioner":"早稲田ゆき君","category":"デジタル・情報・知財","answer_point":"疾病・障害への差別偏見はなくすべきとの一般論を述べつつ、事件報道の編集は放送事業者の自主自律で判断されると整理。疾患情報の取扱いを直接規定する法令・政府ガイドラインはなく、政府は網羅的把握もしていない旨を回答。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219002.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219002.pdf/$File/a219002.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219002.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219002.pdf/$File/b219002.pdf","answer_point_summary":"疾病・障害への差別偏見はなくすべきとの一般論を述べつつ、事件報道の編集は放送事業者の自主自律で判断されると整理。疾患情報の取扱いを直接規定する法令・政府ガイドラインはなく、政府は網羅的把握もしていない旨を回答。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。所管整理と法令解釈（個情法・著作権等）を中心に、運用・検討状況を回答。","is_full_summary":true},{"id":"衆-3","house 府の基本立場・制度枠組みを整理しつつ、外交・安保上の理由で個別詳細は差し控えとなりやすい。","is_full_summary":true},{"id":"衆-5","house":"衆議院","number":5,"title":"マンション価格抑制と投機的取引規制に関する質問主意書","question_point":"マンション価格抑制と投機的取引規制","questioner":"平岩征樹君","category":"経済・財政・税制","answer_point":"マンション価格上昇は建設コスト・用地費・再開発・人口流入等、供給需給の複合要因で一概に説明困難と整理。投機や外国保有の寄与を特定把握することは困難で、短期売買規制は実態把握の上で判断すると回答。空き家活用の税制措置等をまず推進する姿勢。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219005.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219005.pdf/$File/a219005.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219005.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219005.pdf/$File/b219005.pdf","answer_point_summary":"マンション価格上昇は建設コスト・用地費・再開発・人口流入等、供給需給の複合要因で一概に説明困難と整理。投機や外国保有の寄与を特定把握することは困難で、短期売買規制は実態把握の上で判断すると回答。空き家活用の税制措置等をまず推進する姿勢。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-6","house":"衆議院","number":6,"title":"護衛艦すずつきの意図しない中国領海侵入事案に関する質問主意書","question_point":"護衛艦すずつきの意図しない中国領海侵入事案","questioner":"平岩征樹君","category":"その他","answer_point":"外国軍艦の領海入域に事前通告を求める明文規定は国連海洋法条約上ないとの一般論を提示。ホットラインの個別使用状況や中国側発表に関する詳細は、自衛隊運用への影響等を理由に回答差控え。日中海空連絡メカニズムの適切・確実な運用確保を継続するとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219006.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219006.pdf/$File/a219006.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219006.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219006.pdf/$File/b219006.pdf","answer_point_summary":"外国軍艦の領海入域に事前通告を求める明文規定は国連海洋法条約上ないとの一般論を提示。ホットラインの個別使用状況や中国側発表に関する詳細は、自衛隊運用への影響等を理由に回答差控え。日中海空連絡メカニズムの適切・確実な運用確保を継続するとした。","answer_summary_status":"要約済（本文ベース） とは困難であるが、その上で申し上げれば、令和七年十月二十四日の所信表明演説において、高市内閣総理大臣が「「政治の安定」なくして、力強い経済政策も、力強い外交・安全保障政策も、推進していくことはできない。 むしろ、連立政権とはそのようなものではないかというふうに私は認識をしているところでございます。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219024.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219024.pdf/$File/a219024.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219024.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219024.pdf/$File/b219024.pdf","answer_point_summary":"三についてお尋ねの「連立内閣」については、一についてで述べたとおり、法令上の定義はなく、これを基にお答えすることは困難であるが、その上で申し上げれば、憲法第六十六条第一項は、「内閣は、法律の定めるところにより、その首長たる内閣総理大臣及びその他の国務大臣でこれを組織する。 二についてお尋ねの「連立政権」については、一についてで述べたとおり、法令上の定義はなく、これを基にお答２えすることは困難であるが、その上で申し上げれば、令和七年十月二十四日の所信表明演説において、高市内閣総理大臣が「「政治の安定」なくして、力強い経済政策も、力強い外交・安全保障政策も、推進していくことはできない。 むしろ、連立政権とはそのようなものではないかというふうに私は認識をしているところでございます。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-25","house":"衆議院","number":25,"title":"憲法の幾つかの規定に関する質問主意書","question_point":"憲法の幾つかの規定","questioner":"緒方林太郎君","category":"司法・治安・人権","answer_point":"三についてお尋ねの「必ず国内法を条約に適合させなくてはならない」の意味するところが必ずしも明らかではないが、政府は、一般に条約を締結するに当たっては、誠実にこれを履行するとの立場から、国内法制との２整合性を確保することとしている。 後段のお尋ねについては、確立された国際法規とは、国際慣習法を指す。 二について前段のお尋ねについては、条約及び確立された国際法規が法律に優位すると解される。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219025.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219025.pdf/$File/a219025.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219025.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219025.pdf/$File/b219025.pdf","answer_point_summary":"三についてお尋ねの「必ず国内法を条約に適合させなくてはならない」の意味するところが必ずしも明らかではないが、政府は、一般に条約を締結するに当たっては、誠実にこれを履行する "答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-27","house":"衆議院","number":27,"title":"外国人との秩序ある共生社会推進室に関する質問主意書","question_point":"外国人との秩序ある共生社会推進室","questioner":"櫛渕万里君","category":"行政・ガバナンス","answer_point":"三についてお尋ねの「専任職員」の意味するところが必ずしも明らかではないが、現時点において、外国人との秩序ある共生社会推進室に所属する職員は、八十七人であり、いずれも同室に併任されている。 二について外国人との秩序ある共生社会推進室に関する職務は、小野田紀美外国人との秩序ある共生社会推進担当大臣、鈴木隼人内閣府副大臣及び若山慎司内閣府大臣政務官が担当する。 法務省もいろいろ対応しているわけでありますけれども、この問題は非常に重い問題だと思って、私としても、この外国人労働者に対する差別や偏見の問題４については、実態把握に努めるとともに、関係機関と連携して個別に適切に対応しつつ、差別や偏見のない共生社会の実現に向けた取組を着実に進めていきたいというふうに考えています。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219027.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219027.pdf/$File/a219027.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219027.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219027.pdf/$File/b219027.pdf","answer_point_summary":"三についてお尋ねの「専任職員」の意味するところが必ずしも明らかではないが、現時点において、外国人との秩序ある共生社会推進室に所属する職員は、八十七人であり、いずれも同室に併任されている。 二について外国人との秩序ある共生社会推進室に関する職務は、小野田紀美外国人との秩序ある共生社会推進担当大臣、鈴木隼人内閣府副大臣及び若山慎司内閣府大臣政務官が担当する。 法務省もいろいろ対応しているわけでありますけれども、この問題は非常に重い問題だと思って、私としても、この外国人労働者に対する差別や偏見の問題４については、実態把握に努めるとともに、関係機関と連携して個別に適切に対応しつつ、差別や偏見のない共生社会の実現に向けた取組を着実に進めていきたいというふうに考えています。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-28","house":"衆議院","number":28,"title":"更生保護施設委託費減額に関する質問主意書","question_point":"更生保護施設委託費減額","questioner":"藤原規眞君","category":"その他","answer_point":"二についてお尋ねの「現状を改善する」の具体的に意味するところが必ずしも明らかではないが、保護観察対象者等の保護に係る措置を更生保護事業を営む者等に委託するに当たっては、予算の範囲内において、当該保護観察対象者等の保護の必要性に応じ、適切な内容及び期間の措置の委託を行っているところであり、引き続き、適切に実施してまいりたい。 三について２適当な住居が確保されていない保護観察対象者等に係る更生保護施設への入所の調整は、保護観察所の長において、当該保護観察対象者等の希望、各更生保護施設の特色、収容状況等を踏まえて適切に実施しており、引き続き、適切に実施してまいりたい。 その上で、更生保護施設においては、入所者の特性に応じ、日常の生活指導に加え、特定の犯罪的傾向を改善するための援助等を実施しているものと承知している。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219028.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219028.pdf/$File/a219028.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219028.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219028.pdf/$File/b219028.pdf","answer_point_summary":"二についてお尋ねの「現状を改善する」の具体的に意味するところが必ずしも明らかではないが、保護観察対象者等の保護に係る措置を更生保護事業を営む者等に委託するに当たっては、予算の範囲内において、当該保護観察対象者等の保護の必要性に応じ、適切な内容及び期間の措置の委託を行っているところであり、引き続き、適切に実施してまいりたい。 三について２適当な住居が確保されていない保護観察対象者等に係る更生保護施設への入所の調整は、保護観察所の長において、当該保護観察対象者等の希望、各更生保護施設の特色、収容状況等を踏まえて適切に実施しており、引き続き、適切に実施してまいりたい。 その上で、更生保護施設においては、入所者の特性に応じ、日常の生活指導に加え、特定の犯罪的傾向を改善するための援助等を実施しているものと承知している。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-29","house":"衆議院","number":29,"title":"身体障害者手帳の認定基準の透明性及び支援の在り方に関する質問主意書","question_point":"身体障害者手帳の認定基準の透明性及び支援の在り方","questioner":"八幡愛君","category":"社会保障・医療・福祉","answer_point":"なお、厚生労働省社会・援護局障害保健福祉部長が参集を求めて開催し４ていた、視覚機能等に関する専門的知見を有する有識者により構成される「視覚障害の認定基準に関する検討会」が平成三十年一月に取りまとめた「視覚障害の認定基準に関する検討会報告書」において、「当事者団体等から、視力障害および視野障害による視覚障害認定では障害認定されないが、見づらさを抱えている当事者への配慮を検討してほしいことなどの意見があり、視覚障害認定基準の改善のための調査研究の中で、これらについても検討を行い、その結果を踏まえ、検討する」とされたことを踏まえ、厚生労働行政推進調査事業費補助金により、平成三十年度から令和二年度まで「視機能障害認定のあり方に関する研究」を、令和四年度から令和六年度まで「見えづらさを来す様々な疾患の障害認定・支援の方法等の確立に向けた研究」を実施し、現在、これらの研究を踏まえ、令和七年度から令和九年度までの予定で「見えづらさを来す様々な疾患の障害認定・支援の確立に向けた研究」を実施しており、引き続き当該研究を進め、その結果を踏まえ、必要な検討を行っていくこととしている。 四の２について御指摘の「支援」については、地方自治体がそ…","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219029.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219029.pdf/$File/a219029.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/ 保策","questioner":"大石あきこ君","category":"社会保障・医療・福祉","answer_point":"ケアマネの更新制は、介護保険部会の過去の意見（研修強化・更新制導入の検討）等を踏まえて導入したものである。更新制・研修の見直しは、介護保険部会の議論も踏まえ具体的に検討するとした。受講負担の軽減（オンライン受講の推進、一定期間に分割受講できる環境整備等）や基金活用の周知を進め、処遇改善についても骨太方針2025等を踏まえ、効果を把握しつつ令和8年度予算編成過程で検討する（現時点で予断は困難）とした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219032.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219032.pdf/$File/a219032.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219032.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219032.pdf/$File/b219032.pdf","answer_point_summary":"ケアマネの更新制は、介護保険部会の過去の意見（研修強化・更新制導入の検討）等を踏まえて導入したものである。更新制・研修の見直しは、介護保険部会の議論も踏まえ具体的に検討するとした。受講負担の軽減（オンライン受講の推進、一定期間に分割受講できる環境整備等）や基金活用の周知を進め、処遇改善についても骨太方針2025等を踏まえ、効果を把握しつつ令和8年度予算編成過程で検討する（現時点で予断は困難）とした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-33","house":"衆議院","number":33,"title":"所信表明演説の幾つかの点に関する質問主意書","question_point":"所信表明演説の幾つかの点","questioner":"緒方林太郎君","category":"行政・ガバナンス","answer_point":"政府の基本的立場（所信表明演説の内容は閣議で検討し内閣として決定）を示した上で、財政指標として国・地方の債務残高や国債費、プライマリーバランス等を総合的に確認しつつ、債務残高対名目GDP比の安定的な引下げを目指すとの考え方を整理した。近年の同比率の変化については、名目GDPの動向、金利変動による国債の時価評価等を含む複合要因であり、単一要因で断定することは適当でないとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219033.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219033.pdf/$File/a219033.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219033.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219033.pdf/$File/b219033.pdf","answer_point_summary":"政府の基本的立場（所信表明演説の内容は閣議で検討し内閣として決定）を示した上で、財政指標として国・地方の債務残高や国債費、プライマリーバランス等を総合的に確認しつつ、債務残高対名目GDP比の安定的な引下げを目指すとの "歯科健診の義務化に関する質問主意書","question_point":"歯科健診の義務化","questioner":"長友よしひろ君","category":"社会保障・医療・福祉","answer_point":"歯科健診は乳幼児期（母子保健法の1歳6か月・3歳児健診等）、学齢期（学校保健安全法等）、成人期（健康増進事業・職域等）、後期高齢期（後期高齢者健診等）など現行制度を整理。『国民皆歯科健診』の必要性は認識し、基本的事項で「計画開始後10年（令和15年度）を目途に、過去1年の歯科健診受診割合95%」の目標を掲げ、制度設計・法制度整備は施策の実施状況等を踏まえ必要に応じ検討と回答。職域の法定健診項目への追加はエビデンス乏しく困難との建議を踏まえ現時点で考えず、事業者健診と任意の歯科健診同時実施のモデル事業で検証を継続。費用対効果はレセプト等で検証中で現時点で試算提示段階でなく、介護費・健康寿命効果の分析も未実施。体制整備は都道府県等事業で支援し、オンライン予約導入は未検討、ICT活用は必要に応じ検討とした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219068.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219068.pdf/$File/a219068.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219068.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219068.pdf/$File/b219068.pdf","answer_point_summary":"歯科健診は乳幼児期（母子保健法の1歳6か月・3歳児健診等）、学齢期（学校保健安全法等）、成人期（健康増進事業・職域等）、後期高齢期（後期高齢者健診等）など現行制度を整理。『国民皆歯科健診』の必要性は認識し、基本的事項で「計画開始後10年（令和15年度）を目途に、過去1年の歯科健診受診割合95%」の目標を掲げ、制度設計・法制度整備は施策の実施状況等を踏まえ必要に応じ検討と回答。職域の法定健診項目への追加はエビデンス乏しく困難との建議を踏まえ現時点で考えず、事業者健診と任意の歯科健診同時実施のモデル事業で検証を継続。費用対効果はレセプト等で検証中で現時点で試算提示段階でなく、介護費・健康寿命効果の分析も未実施。体制整備は都道府県等事業で支援し、オンライン予約導入は未検討、ICT活用は必要に応じ検討とした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-69","house":"衆議院","number":69,"title":"同性婚に関する違憲判決後の法務省の対応方針及び過去の民法違憲判決における検討・審議期間等に関する再質問主意書","question_point":"同性婚に関する違憲判決後の法務省の対応方針及び過去の民法違憲判決における検討・審議期間等に関する再質問主意書","questioner":"尾辻かな子君","category":"司法・治安・人権","answer_point":"同性婚違憲判決後対応に関する再質問について、2013年最高裁決定・2015年最高裁判決を受けた民法改正法案提出（2013年は11/12、2015年は2016年3/8）では、判決内容や改正案内容等を総合考慮し法制審諮問は行われなかったと回答。当時政府の考えの意味が不明として回答困難。与野党説明等の日程は趣旨不明で回答困難としつつ、内閣法制局の予備審査は2013年9月中旬頃、2015年12月中旬頃から開始し、継続的に法的・立法技術的検討を行ったとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219069.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219069.pdf/$File/a219069.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219069.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219069.pdf/$File/b219069.pdf","answer_point_summary":"同性婚違憲判決後対応に関する再質問について、2013年最高裁決定・2015年最高裁判決を受けた民法改正法案提出（2013年は11/12、2015年は2016年3/8）では、判決内容や改正案内容等を総合考慮し法制審諮問は行われなかったと回答。当時政府の考えの意味が不明として回答困難。与野党説明等の日程は趣旨不明で回答困難としつつ、内閣法制局の予備審査は2013年9月中旬頃、2015年12月中旬頃から開始し、継続的に法的・立法技術的検討を行ったとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。法令解釈・制度運用を整理し、捜査・個別事案は差し控え又は一般論で回答。","is_full_summary":true},{"id":"衆-70","house":"衆議院","number":70,"title":"仮装身分捜査の検挙実績等に関する質問主意書","question_point":"仮装身分捜査の検挙実績等","questioner":"藤原規眞君","category":"その他","answer_point":"仮装身分捜査について、警視庁が2025年5月に架空の本人確認書類等を用いる手法で詐欺未遂事件の被疑者を検挙した事実を示す一方、検挙実績の詳細や手法の運用等は捜査支障のおそれから回答差し控え。警察は仮装身分捜査を適切に実施し、実行者の検挙・被害未然防止と首謀者等特定に向けた捜査を推進すると回答。匿名・流動型犯罪グループの活動傾向と仮装身分捜査の因果関係は一概に答え困難とした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219070.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219070.pdf/$File/a219070.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219070.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219070.pdf/$File/b219070.pdf","answer_point_summary":"仮装身分捜査について、警視庁が2025年5月に架空の本人確認書類等を用いる手法で詐欺未遂事件の被疑者を検挙した事実を示す一方、検挙実績の詳細や手法の運用等は捜査支障のおそれから回答差し控え。警察は仮装身分捜査を適切に実施し、実行者の検挙・被害未然防止と首謀者等特定に向けた捜査を推進すると回答。匿名・流動型犯罪グループの活動傾向と仮装身分捜査の因果関係は一概に答え困難とした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-71","house":"衆議院","number":71,"title":"存立危機事態に関する質問主意書","question_point":"存立危機事態","questioner":"斉藤鉄夫君","category":"外交・安全保障","a gory":"経済・財政・税制","answer_point":"「責任ある積極財政」は経済あっての財政の下で戦略的な財政出動→所得増→消費改善→税収増の好循環を目指すが、成長率や数値目標は現時点で示せないと回答。所得格差拡大の有無は要因が多く一概に答えられないとしつつ、物価高対策（所得税減税・暫定税率廃止までの補助等）と賃上げ環境整備を説明。金利上昇局面でも債務残高対GDP比の引下げ等で信認を確保するとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219073.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219073.pdf/$File/a219073.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219073.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219073.pdf/$File/b219073.pdf","answer_point_summary":"「責任ある積極財政」は経済あっての財政の下で戦略的な財政出動→所得増→消費改善→税収増の好循環を目指すが、成長率や数値目標は現時点で示せないと回答。所得格差拡大の有無は要因が多く一概に答えられないとしつつ、物価高対策（所得税減税・暫定税率廃止までの補助等）と賃上げ環境整備を説明。金利上昇局面でも債務残高対GDP比の引下げ等で信認を確保するとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-74","house":"衆議院","number":74,"title":"ＳＯＲＡ２と著作権法第三十条の四に関する再質問主意書","question_point":"SORA2と著作権法第三十条の四に関する再質問主意書","questioner":"八幡愛君","category":"デジタル・情報・知財","answer_point":"「平デジタル大臣が記者会見でオプトイン方式に言及した」という事実はなく、その前提のお尋ねには答えられないと回答。AI関連技術の研究開発・活用推進に関する法の基本理念等を踏まえつつ、知財戦略推進事務局が権利侵害の懸念に配慮し、関係者の意見も踏まえ必要な調査・研究等を行う旨を説明。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219074.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219074.pdf/$File/a219074.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219074.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219074.pdf/$File/b219074.pdf","answer_point_summary":"「平デジタル大臣が記者会見でオプトイン方式に言及した」という事実はなく、その前提のお尋ねには答えられないと回答。AI関連技術の研究開発・活用推進に関する法の基本理念等を踏まえつつ、知財戦略推進事務局が権利侵害の懸念に配慮し、関係者の意見も踏まえ必要な調査・研究等を行う旨を説明。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。所管整理と法令解釈（個情法・著作権等）を中心に、運用・検討状況を回答。","is_full_summary":true},{"id":"衆-75","house":"衆議院","number":75,"title":"文化庁が「クリエーターや権利団体はＡＩ技術や契約の知見が乏しい」と発言したとの報道に関する再質問主意書","question_point":"文化庁が「クリエーターや権利団体はAI技術や契約の知見が乏しい」と発言したとの報道に関する再質問主意書","questioner":"八幡愛君","category":"歴史・文化・公文書","answer_point":"クリエーター／権利団体やAI技術・契約の種類は多様で、「知見が乏しい」と一概に評価できないと回答。「AIと著作権に関する考え方」や文化芸術分野の契約ガイドラインを引用し、共通理解や契約知識の促進が重要とした。行政内部で一般に『乏しい』とする部署の存在は承知せず、職員の見解把握も困難。仮に不適切発言が確認された場合の対応は個別具体に判断するとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219075.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219075.pdf/$File/a219075.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219075.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219075.pdf/$File/b219075.pdf","answer_point_summary":"クリエーター／権利団体やAI技術・契約の種類は多様で、「知見が乏しい」と一概に評価できないと回答。「AIと著作権に関する考え方」や文化芸術分野の契約ガイドラインを引用し、共通理解や契約知識の促進が重要とした。行政内部で一般に『乏しい』とする部署の存在は承知せず、職員の見解把握も困難。仮に不適切発言が確認された場合の対応は個別具体に判断するとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-76","house":"衆議院","number":76,"title":"食料品の消費税ゼロ化に係る「ＰＯＳレジシステム改修」を巡る説明の真偽に関する質問主意書","question_point":"食料品の消費税ゼロ化に係る「POSレジシステム改修」を巡る説明の真偽","questioner":"長友よしひろ君","category":"経済・財政・税制","answer_point":"軽減税率対応のレジでは食料品区分が設けられているとしつつ、消費税率引下げ（食料品ゼロ等）には、返品時の税額計算や在庫・顧客管理等と連携する周辺システムも含め改修・検証が必要で、事業者確認では少なくとも1年要する見込みもあると説明。費用は承知せず。改修内容にはPOS設定変更、会計・請求処理、価格表示・インボイス対応等を含むとし、先送りの有無など仮定の質問は差し控える一方、政府は検討結果を踏まえ適切に対応するとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219076.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219076.pdf/$File/a219076.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219076.htm","a_pdf_url":"https://www. n_point":"日米政府の戦略的投資イニシアティブにおけるキャッシュフロー分配","questioner":"大石あきこ君","category":"その他","answer_point":"日米の戦略的投資イニシアティブの覚書（パラグラフ13）に基づき、一定条件下ではキャッシュフローの半分が米国側にも同時分配され、元利相当が両国に分配された後の追加キャッシュフローは米90%・日10%で分配されると回答。分配割合は、米国側の土地リースやインフラ提供、オフテイク契約手配等の貢献を踏まえ協議の上で合意したとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219080.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219080.pdf/$File/a219080.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219080.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219080.pdf/$File/b219080.pdf","answer_point_summary":"日米の戦略的投資イニシアティブの覚書（パラグラフ13）に基づき、一定条件下ではキャッシュフローの半分が米国側にも同時分配され、元利相当が両国に分配された後の追加キャッシュフローは米90%・日10%で分配されると回答。分配割合は、米国側の土地リースやインフラ提供、オフテイク契約手配等の貢献を踏まえ協議の上で合意したとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-81","house":"衆議院","number":81,"title":"公益通報者保護法に関する再質問主意書","question_point":"公益通報者保護法に関する再質問主意書","questioner":"緒方林太郎君","category":"司法・治安・人権","answer_point":"公益通報者保護法の保護対象かは個別事案で判断されるが、行政不服審査法上の「不当な処分」該当性にかかわらず、同法2条3項各号に当たれば「通報対象事実」になるとの整理。要件判断が対立する場合は裁判所で個別判断されるとし、改正法で通報後1年以内の解雇等は通報を理由とするものと推定する規定を紹介。救済は労働審判・ADR等の制度や消費者庁相談ダイヤルの案内を説明。通報者探索禁止は「特定を目的とする行為」を禁止するもので、正当な調査は目的に当たらない限り該当しないとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219081.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219081.pdf/$File/a219081.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219081.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219081.pdf/$File/b219081.pdf","answer_point_summary":"公益通報者保護法の保護対象かは個別事案で判断されるが、行政不服審査法上の「不当な処分」該当性にかかわらず、同法2条3項各号に当たれば「通報対象事実」になるとの整理。要件判断が対立する場合は裁判所で個別判断されるとし、改正法で通報後1年以内の解雇等は通報を理由とするものと推定する規定を紹介。救済は労働審判・ADR等の制度や消費者庁相談ダイヤルの案内を説明。通報者探索禁止は「特定を目的とする行為」を禁止するもので、正当な調査は目的に当たらない限り該当しないとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。法令解釈・制度運用を整理し、捜査・個別事案は差し控え又は一般論で回答。","is_full_summary":true},{"id":"衆-82","house":"衆議院","number":82,"title":"日本国との平和条約第十一条に関する質問主意書","question_point":"日本国との平和条約第十一条","questioner":"緒方林太郎君","category":"外交・国際","answer_point":"平和条約11条に関連し、2010年答弁の趣旨として、通達・決議・法改正はいずれも「戦犯を赦免」したものではなく、通達は平和条約発効前の国内法適用解釈の変更、決議は赦免促進要望、法改正は遺族年金等の措置であると説明。A級戦犯の減刑はあったが赦免はないと整理。「刑」は極東国際軍事裁判所等が科した刑を指し、これらの措置は当該刑を科せられた者の赦免ではないとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219082.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219082.pdf/$File/a219082.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219082.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219082.pdf/$File/b219082.pdf","answer_point_summary":"平和条約11条に関連し、2010年答弁の趣旨として、通達・決議・法改正はいずれも「戦犯を赦免」したものではなく、通達は平和条約発効前の国内法適用解釈の変更、決議は赦免促進要望、法改正は遺族年金等の措置であると説明。A級戦犯の減刑はあったが赦免はないと整理。「刑」は極東国際軍事裁判所等が科した刑を指し、これらの措置は当該刑を科せられた者の赦免ではないとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。政府の基本立場・制度枠組みを整理しつつ、外交・安保上の理由で個別詳細は差し控えとなりやすい。","is_full_summary":true},{"id":"衆-83","house":"衆議院","number":83,"title":"太陽光発電と建築基準法に関する質問主意書","question_point":"太陽光発電と建築基準法","questioner":"島田洋一君","category":"環境・エネルギー・防災","answer_point":"建築基準法上、一定の要件（架台下に立ち入らず屋内用途に供さない等）を満たす自立設置型太陽光設備は屋根として機能する部分を有せず建築物に該当しないとする国交省通達の考え方は現在も不変で、見直し不要と回答。地域共生・規律強化の観点から不適切なメガソーラーの法的規制等を検討するため、関係省庁連絡会議で検討を進めている旨を説明。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219083.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219083.pdf/$File/a219083.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219083.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219083.pdf/$File/b219083.pdf","answer_point_summary":"建築基準法上、一定の要件（架台下に立ち入らず屋内用途に供さない等）を満たす自立設置型太陽光設備は屋根として機能する部分を有せず建築物に該当しないとする国交省通達の考え方は現在も不変で、見直し不要と回答。地域共生・規律強化の観点から不適切なメガソーラーの法的規制等を検討するため、関係省庁連絡会議で検討を進めている旨を説明。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-84","house":"衆議院","number":84,"title":"スルガ銀行及びＳＢＩアルヒの不正融資問題に関する行政横断的対応及び被害者救済の実効性確保に関する質問主意書","question_point":"スルガ銀行及びSBIアルヒの不正融資問題に関する行政横断的対応及び被害者救済の実効性確保","questioner":"上村英明君","category":"産業・企業・金融","answer_point":"スルガ銀行・SBIアルヒの不正融資問題について、関係省庁の「合同会議」は必要に応じ情報交換しているが、特別対策室・WG・省庁横断ワンストップ窓口の設置は検討していないと回答（金融庁には相談室あり）。警察捜査の再点検や検挙基準明確化は個別捜査に関わるため回答差し控え／検討しないとした。消費生活相談件数等の統計を示しつつ、個別事案の評価や新たな基金創設は検討していないとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219084.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219084.pdf/$File/a219084.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219084.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219084.pdf/$File/b219084.pdf","answer_point_summary":"スルガ銀行・SBIアルヒの不正融資問題について、関係省庁の「合同会議」は必要に応じ情報交換しているが、特別対策室・WG・省庁横断ワンストップ窓口の設置は検討していないと回答（金融庁には相談室あり）。警察捜査の再点検や検挙基準明確化は個別捜査に関わるため回答差し控え／検討しないとした。消費生活相談件数等の統計を示しつつ、個別事案の評価や新たな基金創設は検討していないとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-85","house":"衆議院","number":85,"title":"戦争史料が散逸しないための戦争博物館設立等に関する質問主意書","question_point":"戦争史料が散逸しないための戦争博物館設立等","questioner":"長妻昭君","category":"歴史・文化・公文書","answer_point":"戦争史料散逸防止に関し、昭和館・しょうけい館・平和祈念展示資料館の収蔵状況等について調査に着手し、収蔵庫面積、受入方針、過去5年の寄贈受入件数・断った例と理由等を調査項目として年内回答を求めていると回答。収納余裕は調査で確認中で現時点回答困難。受入は設立目的・展示内容との関連、所蔵資料との重複、収納状況等を勘案している。拒否件数の過去10年記録はなく網羅回答困難だが、調査で把握し補足聴取予定。大規模保管施設の在り方は調査を踏まえ検討するとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219085.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219085.pdf/$File/a219085.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219085.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219085.pdf/$File/b219085.pdf","answer_point_summary":"戦争史料散逸防止に関し、昭和館・しょうけい館・平和祈念展示資料館の収蔵状況等について調査に着手し、収蔵庫面積、受入方針、過去5年の寄贈受入件数・断った例と理由等を調査項目として年内回答を求めていると回答。収納余裕は調査で確認中で現時点回答困難。受入は設立目的・展示内容との関連、所蔵資料との重複、収納状況等を勘案している。拒否件数の過去10年記録はなく網羅回答困難だが、調査で把握し補足聴取予定。大規模保管施設の在り方は調査を踏まえ検討するとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-86","house":"衆議院","number":86,"title":"盛土規制法上の「土地の形質の変更」に関する質問主意書","question_point":"盛土規制法上の「土地の形質の変更」","questioner":"松尾明弘君","category":"その他","answer_point":"盛土規制法上の「土地の形質の変更」該当性は、工事内容等の個別状況に応じ都道府県知事が適切に判断すべきと回答。規制区域内の宅地造成等・特定盛土等は原則着手前に許可が必要で、無許可工事には停止命令や擁壁設置等の措置命令が可能である旨、法の規定を示して説明した。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219086.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219086.pdf/$File/a219086.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219086.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219086.pdf/$File/b219086.pdf","answer_point_summary":"盛土規制法上の「土地の形質の変更」該当性は、工事内容等の個別状況に応じ都道府県知事が適切に判断すべきと回答。規制区域内の宅地造成等・特定盛土等は原則着手前に許可が必要で、無許可工事には停止命令や擁壁設置等の措置命令が可能である旨、法の規定を示して説明した。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-87","house":"衆議院","number":87,"title":"国境を超える匿名・流動型犯罪グループの対応に関する質問主意書","question_point":"国境を超える匿名・流動型犯罪グループの対応","questioner":"藤原規眞君","category":"司法・治安・人権","answer_point":"海外拠点を持つ匿名・流動型犯罪グループへの対応として、逮捕人数は範囲不明で網羅回答困難としつつ、2025年にミャンマー・タイ国境付近で特殊詐欺関与として邦人8名がタイ当局に拘束されたことを在外公館援護で把握と回答。未成年の単身渡航には、旅券窓口や空港でポスター・リーフレット、主要空港出国審査場で映像・音声注意喚起を実施し、申出があれば入管と警察が連携対応。在外公館もメールやHPで注意喚起。韓国警察と同様の対応は趣旨不明で答え困難だが、生命身体の危険がある場合は現地警察等へ保護要請し、警察は二国間協議や国際会議等で連携を強化し摘発を推進するとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219087.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219087.pdf/$File/a219087.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219087.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219087.pdf/$File/b219087.pdf","answer_point_summary":"海外拠点を持つ匿名・流動型犯罪グループへの対応として、逮捕人数は範囲不明で網羅回答困難としつつ、2025年にミャンマー・タイ国境付近で特殊詐欺関与として邦人8名がタイ当局に拘束されたことを在外公館援護で把握と回答。未成年の単身渡航には、旅券窓口や空港でポスター・リーフレット、主要空港出国審査場で映像・音声注意喚起を実施し、申出があれば入管と警察が連携対応。在外公館もメールやHPで注意喚起。韓国警察と同様の対応は趣旨不明で答え困難だが、生命身体の危険がある場合は現地警察等へ保護要請し、警察は二国間協議や国際会議等で連携を強化し摘発を推進するとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。法令解釈・制度運用を整理し、捜査・個別事案は差し控え又は一般論で回答。","is_full_summary":true},{"id":"衆-88","house":"衆議院","number":88,"title":"戦没者等の遺族に対する特別弔慰金等に関する質問主意書","question_point":"戦没者等の遺族に対する特別弔慰金等","questioner":"上村英明君","category":"その他","answer_point":"特別弔慰金等に関連し、死因は戸籍に記載されず、死亡届添付の診断書等の死因情報は政府として把握しておらず、調査は膨大で困難と回答。追悼は毎年8/15の全国戦没者追悼式で総理が式辞で表明してきた（直近式辞の文言を例示）。遺族に十分届いているかは一概に答えられないが、遺族参列機会確保のため一般戦災死没者遺族代表の旅費支給等を実施。恩給は保存データの都合で過去5年分のみ算出可能で、元軍人・軍属向けは総額約200億円・延べ約9万人と回答済みで、それ以前は特定困難。決算ベースでは昭和28〜令和6で恩給総額約56.7兆円（全受給者）だが受給者総数は示せないとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219088.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219088.pdf/$File/a219088.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219088.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219088.pdf/$File/b219088.pdf","answer_point_summary":"特別弔慰金等に関連し、死因は戸籍に記載されず、死亡届添付の診断書等の死因情報は政府として把握しておらず、調査は膨大で困難と回答。追悼は毎年8/15の全国戦没者追悼式で総理が式辞で表明してきた（直近式辞の文言を例示）。遺族に十分届いているかは一概に答えられないが、遺族参列機会確保のため一般戦災死没者遺族代表の旅費支給等を実施。恩給は保存データの都合で過去5年分のみ算出可能で、元軍人・軍属向けは総額約200億円・延べ約9万人と回答済みで、それ以前は特定困難。決算ベースでは昭和28〜令和6で恩給総額約56.7兆円（全受給者）だが受給者総数は示せないとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-89","house":"衆議院","number":89,"title":"後発医薬品の品質及び先発医薬品の薬価見直しに関する質問主意書","question_point":"後発医薬品の品質及び先発医薬品の薬価見直し","questioner":"長友よしひろ君","category":"その他","answer_point":"長期収載品の選定療養（先発と後発の価格差の患者負担水準）を1/4相当から引上げる論点等が社保審・中医協で提示され、医薬品ライフサイクルの実現、保険制度持続性確保、創薬イノベーション推進、後発医薬品使用促進の観点で検討中で、導入時期は現段階で未定と回答。令和8年度薬価改定に向け長期収載品薬価の更なる適正化も検討中とした。後発品の有効性・安全性は生物学的同等性試験で先発と同等と判断できるとの一般的説明を示し、品質確保は無通告立入検査強化、改正薬機法で品質保証統括者設置や役員変更命令等を整備予定。供給安定化は増産等補助や産業構造報告を踏まえた基金創設・資金交付等で後押しするとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219089.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219089.pdf/$File/a219089.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219089.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219089.pdf/$File/b219089.pdf","answer_point_summary":"長期収載品の選定療養（先発と後発の価格差の患者負担水準）を1/4相当から引上げる論点等が社保審・中医協で提示され、医薬品ライフサイクルの実現、保険制度持続性確保、創薬イノベーション推進、後発医薬品使用促進の観点で検討中で、導入時期は現段階で未定と回答。令和8年度薬価改定に向け長期収載品薬価の更なる適正化も検討中とした。後発品の有効性・安全性は生物学的同等性試験で先発と同等と判断できるとの一般的説明を示し、品質確保は無通告立入検査強化、改正薬機法で品質保証統括者設置や役員変更命令等を整備予定。供給安定化は増産等補助や産業構造報告を踏まえた基金創設・資金交付等で後押しするとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-90","house":"衆議院","number":90,"title":"医療ＤＸと医療情報連携の全国標準化に関する質問主意書","question_point":"医療DXと医療情報連携の全国標準化","questioner":"長友よしひろ君","category":"デジタル・情報・知財","answer_point":"地域の医療情報連携は圏域・運営主体・共有情報等が多様で、政府は現状把握を進めているが体系的把握は未了と回答。医療DX工程表に基づき、オンライン資格確認ネットワークを活用した「全国医療情報プラットフォーム」構築と電子カルテ情報共有サービス整備を進め、標準規格対応電子カルテへの改修・更新も推進（支払基金が開発・運用主体の母体）。三文書六情報の標準化を図り、情報範囲拡大はユースケース等を踏まえ慎重に検討。地域連携との将来統合は現時点で想定せず、整合性・接続要否を検討し役割分担を図る。国は基盤整備、自治体は地域実情に応じ利活用検討、医療機関は自立的取組が期待されるとし、周知や基金による補助で支援。患者はマイナポータルで診療・処方情報等を閲覧可能で、検査結果も同様に閲覧できるよう検討中とした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219090.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219090.pdf/$File/a219090.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219090.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219090.pdf/$File/b219090.pdf","answer_point_summary":"地域の医療情報連携は圏域・運営主体・共有情報等が多様で、政府は現状把握を進めているが体系的把握は未了と回答。医療DX工程表に基づき、オンライン資格確認ネットワークを活用した「全国医療情報プラットフォーム」構築と電子カルテ情報共有サービス整備を進め、標準規格対応電子カルテへの改修・更新も推進（支払基金が開発・運用主体の母体）。三文書六情報の標準化を図り、情報範囲拡大はユースケース等を踏まえ慎重に検討。地域連携との将来統合は現時点で想定せず、整合性・接続要否を検討し役割分担を図る。国は基盤整備、自治体は地域実情に応じ利活用検討、医療機関は自立的取組が期待されるとし、周知や基金による補助で支援。患者はマイナポータルで診療・処方情報等を閲覧可能で、検査結果も同様に閲覧できるよう検討中とした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。所管整理と法令解釈（個情法・著作権等）を中心に、運用・検討状況を回答。","is_full_summary":true},{"id":"衆-91","house":"衆議院","number":91,"title":"法人版事業承継税制の特例措置に関する質問主意書","question_point":"法人版事業承継税制の特例措置","questioner":"長友よしひろ君","category":"その他","answer_point":"税制措置は企業の資産・負債状況や株主構成など条件が多様であり、数値目標（KPI）設定は困難と説明。「納税猶予の適用件数」「実行率」等は趣旨が明確でないため答えがたいとしつつ、特例承継計画の提出・認定件数等を年度別に提示（一部は集計中）。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219091.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219091.pdf/$File/a219091.pdf","a_html_url":"https:/ /itdb_shitsumon.nsf/html/shitsumon/b219095.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219095.pdf/$File/b219095.pdf","answer_point_summary":"政治活動の自由は憲法上の権利であり、屋外広告物法・条例の運用はそれを不当に侵害しないよう留意すべきとした上で、侵害に当たるかは個別具体の事案に即して判断されるため抽象的回答は困難とする。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"衆-96","house":"衆議院","number":96,"title":"非核三原則に対する高市内閣総理大臣及び高市内閣の見解に関する質問主意書","question_point":"非核三原則に対する高市内閣総理大臣及び高市内閣の見解","questioner":"櫛渕万里君","category":"外交・安全保障","answer_point":"政府として非核三原則を国是として堅持していると説明。首相答弁の撤回や「見直し指示文書」等は趣旨が明確でないとして個別回答を控えつつ、過去の関連答弁等も踏まえ政府として最善の努力を行うとする。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219096.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219096.pdf/$File/a219096.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219096.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219096.pdf/$File/b219096.pdf","answer_point_summary":"政府として非核三原則を国是として堅持していると説明。首相答弁の撤回や「見直し指示文書」等は趣旨が明確でないとして個別回答を控えつつ、過去の関連答弁等も踏まえ政府として最善の努力を行うとする。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。政府の基本立場・制度枠組みを整理しつつ、外交・安保上の理由で個別詳細は差し控えとなりやすい。","is_full_summary":true},{"id":"衆-97","house":"衆議院","number":97,"title":"高市首相の防衛国債についての国会答弁に関する質問主意書","question_point":"高市首相の防衛国債についての国会答弁","questioner":"長妻昭君","category":"外交・安全保障","answer_point":"「防衛国債」という新たな財源手法は考えていないとし、首相答弁に創設趣旨はないと説明。艦船建造等の一部を建設公債対象に整理したのは経費の整合の観点であり、防衛力強化を赤字国債で賄う考えではない。財政規律と両立させ必要財源を確保するとする。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219097.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219097.pdf/$File/a219097.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219097.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219097.pdf/$File/b219097.pdf","answer_point_summary":"「防衛国債」という新たな財源手法は考えていないとし、首相答弁に創設趣旨はないと説明。艦船建造等の一部を建設公債対象に整理したのは経費の整合の観点であり、防衛力強化を赤字国債で賄う考えではない。財政規律と両立させ必要財源を確保するとする。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。政府の基本立場・制度枠組みを整理しつつ、外交・安保上の理由で個別詳細は差し控えとなりやすい。","is_full_summary":true},{"id":"衆-98","house":"衆議院","number":98,"title":"トランプ大統領の最恵国薬価政策にかかる日本政府の対応に関する質問主意書","question_point":"トランプ大統領の最恵国薬価政策にかかる日本政府の対応","questioner":"福田玄君","category":"社会保障・医療・福祉","answer_point":"・政府は、米国側が用いる「医薬品価格」（平均卸売価格/平均販売価格等）の具体は把握しておらず、どの価格帯を基準にするかで高低評価が変わるため一概の判断は困難とした。\r\n・厚労省は退職後も含む守秘義務等の周知・研修を定期的に実施していると説明。\r\n・外国製薬団体等の個別発言への見解は差し控えつつ、ドラッグ・ラグ/ロス解消や創薬力強化のため、薬価上のイノベーション評価や官民協議会設置等を進め、市場の魅力向上に取り組むとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219098.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219098.pdf/$File/a219098.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219098.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219098.pdf/$File/b219098.pdf","answer_point_summary":"・政府は、米国側が用いる「医薬品価格」（平均卸売価格/平均販売価格等）の具体は把握しておらず、どの価格帯を基準にするかで高低評価が変わるため一概の判断は困難とした。\r\n・厚労省は退職後も含む守秘義務等の周知・研修を定期的に実施していると説明。\r\n・外国製薬団体等の個別発言への見解は差し控えつつ、ドラッグ・ラグ/ロス解消や創薬力強化のため、薬価上のイノベーション評価や官民協議会設置等を進め、市場の魅力向上に取り組むとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"（追加分）（本文要約に更新）","is_full_summary":true},{"id":"衆-99","house":"衆議院","number":99,"title":"児童発達支援管理責任者の現場運用の在り方に関する質問主意書","question_point":"児童発達支援管理責任者の現場運用の在り方","questioner":"八幡愛君","category":"社会保障・医療・福祉","answer_point":"・児童発達支援計画の作成に当たり、児童発達支援管理責任者は面接等により児童・保護者の状況を「直接」確認することが前提で、面接なしで計画作成することは想定していないとした。\r\n・同責任者は計画策定・評価等の重要業務を担うため、日常的な直接支援への従事や現場支援参加、管理業務との両立を必須とはしておらず、加配制度拡充も考えていないと説明。\r\n・計画の策定/評価はガイドラインに基づき随時・概ね6か月ごとのモニタリング等で行い、特定期間を固定する仕組みは想定せず。ICT導入補助等で一連管理は可能とした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219099.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219099.pdf/$File/a219099.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219099.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219099.pdf/$File/b219099.pdf","answer_point_summary":"・児童発達支援計画の作成に当たり、児童発達支援管理責任者は面接等により児童・保護者の状況を「直接」確認することが前提で、面接なしで計画作成することは想定していないとした。\r\n・同責任者は計画策定・評価等の重要業務を担うため、日常的な直接支援への従事や現場支援参加、管理業務との両立を必須とはしておらず、加配制度拡充も考えていないと説明。\r\n・計画の策定/評価はガイドラインに基づき随時・概ね6か月ごとのモニタリング等で行い、特定期間を固定する仕組みは想定せず。ICT導入補助等で一連管理は可能とした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"（追加分）（本文要約に更新）","is_full_summary":true},{"id":"衆-100","house":"衆議院","number":100,"title":"旅費法改正の理念と実効性に関する質問主意書","question_point":"旅費法改正の理念と実効性","questioner":"八幡愛君","category":"政治・行政/ガバナンス","answer_point":"・旅費法は経済社会情勢の変化への対応と事務負担軽減、国費の適正支出のため令和6年に改正したと説明。\r\n・宿泊費は実勢価格調査に基づく基準額を上限に実費支給が原則だが、国際会議で指定ホテルしか困難等の場合は基準額超でも実費支給が可能で、特別事情があれば財務大臣協議で別途支給も可能と整理。\r\n・宿泊先選定は宿泊料だけでなく用務先までの時間等も勘案され、円建て基準額でも支障はない。基準額は毎年度実勢価格等を確認し見直す方針とした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219100.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219100.pdf/$File/a219100.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219100.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219100.pdf/$File/b219100.pdf","answer_point_summary":"・旅費法は経済社会情勢の変化への対応と事務負担軽減、国費の適正支出のため令和6年に改正したと説明。\r\n・宿泊費は実勢価格調査に基づく基準額を上限に実費支給が原則だが、国際会議で指定ホテルしか困難等の場合は基準額超でも実費支給が可能で、特別事情があれば財務大臣協議で別途支給も可能と整理。\r\n・宿泊先選定は宿泊料だけでなく用務先までの時間等も勘案され、円建て基準額でも支障はない。基準額は毎年度実勢価格等を確認し見直す方針とした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"（追加分）（本文要約に更新）","is_full_summary":true},{"id":"衆-101","house":"衆議院","number":101,"title":"政府の経済財政運営の基本的な方針に関する質問主意書","question_point":"政府の経済財政運営の基本的な方針","questioner":"落合貴之君","category":"政治・行政/ガバナンス","answer_point":"・骨太方針2025のPB黒字化目標は「2025～2026年度を通じて可能な限り早期」を目指す一方、米国関税措置の影響が不透明なため検証し、必要に応じ目標年度の再確認を行うとしていると説明。\r\n・首相答弁として、既決定の目標を反故にする意図はなく、単年度ではなく数年単位でバランス確認する点を、予算編成・中長期試算を見極めつつ次の骨太に向け明確化するとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219101.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219101.pdf/$File/a219101.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219101.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219101.pdf/$File/b219101.pdf","answer_point_summary":"・骨太方針2025のPB黒字化目標は「2025～2026年度を通じて可能な限り早期」を目指す一方、米国関税措置の影響が不透明なため検証し、必要に応じ目標年度の再確認を行うとしていると説明。\r\n・首相答弁として、既決定の目標を反故にする意図はなく、単年度ではなく数年単位でバランス確認する点を、予算編成・中長期試算を見極めつつ次の骨太に向け明確化するとした。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"（追加分）（本文要約に更新）","is_full_summary":true},{"id":"衆-102","house":"衆議院","number":102,"title":"食品安全委員会事務局の在り方に関する質問主意書","question_point":"食品安全委員会事務局の在り方","questioner":"上村英明君","category":"農林水産","answer_point":"・食品安全委員会事務局を含む内閣府職員の任免・服務等の人事事務は大臣官房人事課が所掌すると説明。\r\n・事務局幹部を含む人事は能力等を総合判断し適材適所で行い、結果として農水省・厚労省出身が多い構成になっているとした。\r\n・設置以降の出身省庁別人数（職員/課長級以上）を年次で提示。\r\n・関係省庁からの出向であっても公務員として独立性をもって職務を行うため客観性・中立性への疑念は当たらず、プロパー採用拡大や出向比率低減は考えていないとした。","q_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a219102.htm","q_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_s.nsf/html/shitsumon/pdfS/a219102.pdf/$File/a219102.pdf","a_html_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b219102.htm","a_pdf_url":"https://www.shugiin.go.jp/internet/itdb_shitsumon_pdf_t.nsf/html/shitsumon/pdfT/b219102.pdf/$File/b "answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"参-21","house":"参議院","number":21,"title":"食料品に係る消費税率をゼロ％とする提案に関する質問主意書","question_point":"食料品に係る消費税率をゼロ%とする提案","questioner":"牧山　ひろえ君","category":"経済・財政・税制","answer_point":"食料品の消費税率をゼロにしても、可処分所得（手取り収入）の増減に直接影響するものではないとし、可処分所得増加を根拠とする成長戦略とは位置付けないとした。物価や消費への波及、GDPへの影響、生産者・供給者への効果は、価格設定やコスト等の要素が多く確たる回答は困難とした。消費者・生産者双方の理解を得た価格形成（コスト指標の作成・公表等）や、地方交付金等による生活者支援を進め、消費税減税は低所得者支援の効率性や準備期間等の課題があるとの従来説明を示した。","q_html_url":"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/219/syuh/s219021.htm","q_pdf_url":"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/219/syup/s219021.pdf","a_html_url":"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/219/touh/t219021.htm","a_pdf_url":"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/219/toup/t219021.pdf","answer_point_summary":"食料品の消費税率をゼロにしても、可処分所得（手取り収入）の増減に直接影響するものではないとし、可処分所得増加を根拠とする成長戦略とは位置付けないとした。物価や消費への波及、GDPへの影響、生産者・供給者への効果は、価格設定やコスト等の要素が多く確たる回答は困難とした。消費者・生産者双方の理解を得た価格形成（コスト指標の作成・公表等）や、地方交付金等による生活者支援を進め、消費税減税は低所得者支援の効率性や準備期間等の課題があるとの従来説明を示した。","answer_summary_status":"要約済（本文ベース）","answer_point_original":"答弁書（HTML/PDF）公表。現行制度・実態（データ）・政府方針を整理し、対応状況/検討方針を回答。","is_full_summary":true},{"id":"参-22","house":"参議院","number":22,"title":"国立公文書館によるＳＮＳ上での寄附の募集に関する質問主意書","question_point":"国立公文書館によるSNS上での寄附の募集","questioner":"石垣　のりこ君","category":"歴史・文化・公文書","answer_point":"国立公文書館の寄附募集は従来から行われているが、SNS活用の逐一は報告を求めておらず事前把握していないとした。寄附募集は運営費交付金に加え事業充実の財源確保のためで、予算が不十分との指摘は当たらないと整理した。政府は運営費交付金により引き続き支援する考えである。","q_html_url":"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/219/syuh/s219022.htm","q_pdf_url":"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/219/syup/s219022.pdf","a_html_url":"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/219/touh/t219022.htm","a_pdf_url":"https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/219/toup/t219022.pdf","answer_point_summary":"国立公文書館の寄附募集は従来から行われているが、SNS活用の逐     let state = {
      filterText: "",
      selectedHouse: "all",
      selectedCategory: "all",
      viewMode: "table"
    };

    // --- 初期化 ---
    document.addEventListener('DOMContentLoaded', () => {
      initCategories();
      renderDashboard();
      setupEventListeners();
      lucide.createIcons();
    });

    function initCategories() {
      const cats = new Set(ALL_DATA.map(d => d.category).filter(Boolean));
      const sortedCats = Array.from(cats).sort((a, b) => {
        if (a === "その他" || a === "その他・不明") return 1;
        if (b === "その他" || b === "その他・不明") return -1;
        return a.localeCompare(b, "ja");
      });
      const select = document.getElementById('category-select');
      sortedCats.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });
    }

    function renderDashboard() {
      const filteredData = filterData();
      const stats = calculateStats(filteredData);
      renderStats(stats, filteredData.length);
      renderAnalysis(filteredData, stats);
      renderDataList(filteredData);
      updateUIState(filteredData.length);
      lucide.createIcons();
    }

    function filterData() {
      const searchKeywords = state.filterText.replace(/　/g, ' ').trim().split(' ').filter(k => k !== '');
      return ALL_DATA.filter(item => {
        const targetText = [item.title, item.questioner, item.answer_point_summary, item.question_point, item.id, item.category].join(' ');
        const matchesText = searchKeywords.length === 0 || searchKeywords.every(keyword => targetText.includes(keyword));
        const matchesHouse = state.selectedHouse === "all" || item.house === state.selectedHouse;
        const matchesCategory = state.selectedCategory === "all" || item.category === state.selectedCategory;
        return matchesText && matchesHouse && matchesCategory;
      });
    }

    function calculateStats(data) {
      const houseCount = { '衆議院': 0, '参議院': 0 };
      const categoryCount = {};
      const questionerCount = {};
      data.forEach(item => {
        if (item.house) houseCount[item.house] = (houseCount[item.house] || 0) + 1;
        if (item.category) categoryCount[item.category] = (categoryCount[item.category] || 0) + 1;
        if (item.questioner) {
          const name = item.questioner.replace(/君|　/g, '').trim();
          questionerCount[name] = (questionerCount[name] || 0) + 1;
        }
      });
      return {
        houseCount,
        sortedCategories: Object.entries(categoryCount).sort(([, a], [, b]) => b - a).slice(0, 5),
        sortedQuestioners: Object.entries(questionerCount).sort(([, a], [, b]) => b - a).slice(0, 5)
      };
    }

    function renderStats(stats, totalCount) {
      const container = document.getElementById('stats-container');
      const totalDataCount = ALL_DATA.length;
      const houseBar = (count, color) => `<div class="w-full bg-slate-100 rounded-full h-2"><div class="${color} h-2 rounded-full" style="width: ${(count / totalCount) * 100 || 0}%"></div></div>`;
      const listHTML = (list, colorClass, bgClass) => list.length > 0 ? list.slice(0,3).map(([k, v]) => `<div class="flex items-center justify-between text-sm mb-2"><span class="truncate text-slate-600 w-2/3" title="${k}">${k || "未分類"}</span><span class="font-semibold ${bgClass} ${colorClass} px-2 py-0.5 rounded-full text-xs">${v}</span></div>`).join('') : '<span class="text-sm text-slate-400">データなし</span>';

      container.innerHTML = `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
          <div class="flex justify-between items-start mb-2"><h3 class="text-sm font-medium text-slate-500">表示中の質問総数</h3><i data-lucide="file-text" class="w-5 h-5 text-blue-500"></i></div>
          <div class="text-3xl font-bold text-slate-800">${totalCount} <span class="text-sm font-normal text-slate-500">件</span></div>
          <div class="mt-2 text-xs text-slate-400">全 ${totalDataCount} 件中</div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-start mb-4"><h3 class="text-sm font-medium text-slate-500">院別内訳</h3><i data-lucide="pie-chart" class="w-5 h-5 text-purple-500"></i></div>
          <div class="flex gap-4 items-end">
            <div class="flex-1"><div class="flex justify-between text-sm mb-1"><span>衆議院</span><span class="font-bold">${stats.houseCount['衆議院'] || 0}</span></div>${houseBar(stats.houseCount['衆議院'] || 0, 'bg-purple-500')}</div>
            <div class="flex-1"><div class="flex justify-between text-sm mb-1"><span>参議院</span><span class="font-bold">${stats.houseCount['参議院'] || 0}</span></div>${houseBar(stats.houseCount['参議院'] || 0, 'bg-indigo-500')}</div>
          </div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-start mb-2"><h3 class="text-sm font-medium text-slate-500">主要分野 (Top 3)</h3><i data-lucide="bar-chart" class="w-5 h-5 text-green-500"></i></div>
          <div class="mt-2">${listHTML(stats.sortedCategories, 'text-green-700', 'bg-green-50')}</div>
        </div>
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-start mb-2"><h3 class="text-sm font-medium text-slate-500">主要質問者 (Top 3)</h3><i data-lucide="users" class="w-5 h-5 text-orange-500"></i></div>
          <div class="mt-2">${listHTML(stats.sortedQuestioners, 'text-orange-700', 'bg-orange-50')}</div>
        </div>`;
    }

    function renderAnalysis(data, stats) {
      const container = document.getElementById('analysis-container');
      if (data.length === 0) { container.innerHTML = ''; return; }
      const total = data.length;
      const parts = [];
      if (stats.sortedCategories.length > 0) {
        const [topCat, topCount] = stats.sortedCategories[0];
        const ratio = Math.round((topCount / total) * 100);
        if (ratio >= 40) parts.push(`現在、**「${topCat}」**分野の質問が特に多く、全体の約${ratio}%を占めており、このテーマへの関心の高さがうかがえます。`);
        else parts.push(`分野別では**「${topCat}」**が最多ですが、特定の分野に偏りすぎず幅広いテーマで質問が提出されています。`);
      }
      const houseRatio = (stats.houseCount['衆議院'] || 0) / total;
      if (houseRatio > 0.7) parts.push("主に**衆議院**からの提出が中心となっています。");
      else if (houseRatio < 0.3) parts.push("主に**参議院**からの提出が中心となっています。");
      if (stats.sortedQuestioners.length > 0) {
        const [topName, topCount] = stats.sortedQuestioners[0];
        if (topCount > 1 && (topCount / total) > 0.15) parts.push(`提出者としては、**${topName}議員**による質問が目立ちます（${topCount}件）。`);
      }
      let counts = { consideration: 0, difficulty: 0, statusQuo: 0 };
      data.forEach(d => {
        const s = d.answer_point_summary || "";
        if (s.includes("検討") || s.includes("調査")) counts.consideration++;
        if (s.includes("困難") || s.includes("できない") || s.includes("慎重")) counts.difficulty++;
        if (s.includes("現行") || s.includes("枠内") || s.includes("理解")) counts.statusQuo++;
      });
      const maxK = Math.max(counts.consideration, counts.difficulty, counts.statusQuo);
      if (maxK > 0 && total > 0) {
        if (maxK === counts.consideration && (counts.consideration / total) > 0.2) parts.push("政府答弁では、**今後の検討や調査を示唆する姿勢**が比較的多く見受けられます。");
        else if (maxK === counts.difficulty && (counts.difficulty / total) > 0.2) parts.push("政府答弁では、制度上の課題や実施の**困難性を指摘する慎重な回答**が目立ちます。");
        else if (maxK === counts.statusQuo && (counts.statusQuo / total) > 0.2) parts.push("政府答弁では、**現行制度の枠内での対応や理解を求める**回答が多くなっています。");
      }
      let title = "データ分析インサイト";
      if (state.filterText) title = `「${state.filterText}」に関する検索分析`;
      else if (state.selectedCategory !== "all") title = `「${state.selectedCategory}」分野の傾向`;
      const formattedText = parts.join(" ").replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-800">$1</strong>');
      container.innerHTML = `<div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-xl p-4 shadow-sm flex items-start gap-4 mb-6"><div class="bg-white p-2 rounded-full shadow-sm border border-amber-100 hidden sm:block mt-1"><i data-lucide="lightbulb" class="w-5 h-5 text-amber-500"></i></div><div class="flex-1"><h3 class="text-sm font-bold text-amber-800 mb-1 flex items-center gap-2"><i data-lucide="trending-up" class="w-4 h-4"></i>${title}</h3><p class="text-sm text-slate-700 leading-relaxed">${formattedText}</p></div></div>`;
    }

    function renderDataList(data) {
      const container = document.getElementById('data-container');
      if (data.length === 0) {
        container.innerHTML = `<div class="bg-white p-12 rounded-xl shadow-sm border border-slate-200 text-center"><i data-lucide="search" class="w-12 h-12 text-slate-300 mx-auto mb-4 block"></i><h3 class="text-lg font-medium text-slate-700 mb-1">条件に一致するデータがありません</h3></div>`;
        return;
      }
      // IDを文字列として確実に渡すためにエスケープ
      const getClickAttr = (item) => `onclick="openModal('${String(item.id).replace(/'/g, "\'")}')"`;

      if (state.viewMode === 'table') {
        const rows = data.map(item => `
          <tr class="hover:bg-blue-50/50 transition-colors border-b border-slate-100 last:border-0 group">
            <td class="p-4 align-top"><span class="inline-block px-2 py-1 rounded bg-slate-100 text-slate-600 text-xs font-mono font-bold whitespace-nowrap">${item.id || item.number}</span></td>
            <td class="p-4 align-top text-sm"><div class="font-medium text-slate-700">${item.house}</div><div class="text-slate-500 text-xs mt-1 whitespace-nowrap">${(item.questioner || '').replace('君', '')}</div></td>
            <td class="p-4 align-top"><div class="font-bold text-blue-700 mb-1 cursor-pointer hover:underline" ${getClickAttr(item)}>${item.title}</div><div class="text-sm text-slate-600 line-clamp-2">${item.answer_point_summary || item.question_point || "要約なし"}</div></td>
            <td class="p-4 align-top hidden md:table-cell">${item.category ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">${item.category}</span>` : ''}</td>
            <td class="p-4 align-top text-center">
              <button ${getClickAttr(item)} class="text-slate-400 hover:text-blue-600 transition-colors p-2 rounded-full hover:bg-blue-100" title="詳細を表示"><i data-lucide="external-link" class="w-5 h-5"></i></button>
            </td>
          </tr>`).join('');
        container.innerHTML = `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500 font-semibold tracking-wider"><th class="p-4 w-20">ID</th><th class="p-4 w-24">院 / 提出者</th><th class="p-4">件名 / 概要</th><th class="p-4 w-32 hidden md:table-cell">分野</th><th class="p-4 w-24 text-center">操作</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
      } else {
        const cards = data.map(item => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden group hover:shadow-md transition-all cursor-pointer" ${getClickAttr(item)}>
            <div class="p-5 flex-1 flex flex-col">
              <div class="flex justify-between items-start mb-3"><div class="flex gap-2 items-center"><span class="px-2 py-0.5 rounded text-[10px] font-bold text-white ${item.house === '参議院' ? 'bg-indigo-500' : 'bg-purple-500'}">${item.house}</span><span class="text-xs font-mono text-slate-400 bg-slate-50 px-1.5 py-0.5 rounded">${item.id}</span></div>${item.category ? `<span class="text-[10px] font-medium bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full truncate max-w-[100px]">${item.category}</span>` : ''}</div>
              <h3 class="font-bold text-slate-800 mb-3 line-clamp-3 group-hover:text-blue-600 transition-colors">${item.title}</h3>
              <div class="mt-auto"><div class="flex items-center text-xs text-slate-500 mb-2"><span class="font-medium mr-2">提出:</span>${(item.questioner || '').replace('君', '')}</div><div class="bg-slate-50 p-3 rounded-lg text-xs text-slate-600 leading-relaxed line-clamp-4 border border-slate-100">${item.answer_point_summary || item.question_point || '<span class="text-slate-400 italic">要約なし</span>'}</div></div>
            </div>
            <div class="p-3 bg-slate-50 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500"><span>詳細を見る</span><i data-lucide="external-link" class="w-4 h-4 text-slate-400 group-hover:text-blue-500"></i></div>
          </div>`).join('');
        container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cards}</div>`;
      }
    }

    function updateUIState(count) {
      document.getElementById('footer-info').textContent = `${count} 件表示中 (全 ${ALL_DATA.length} 件) | 出力日時: 2025/12/17 13:18:43`;
      const btnTable = document.getElementById('view-table');
      const btnCard = document.getElementById('view-card');
      const activeClass = ['bg-white', 'shadow', 'text-blue-600'];
      const inactiveClass = ['text-slate-500', 'hover:text-slate-700'];
      if (state.viewMode === 'table') {
        btnTable.classList.add(...activeClass); btnTable.classList.remove(...inactiveClass);
        btnCard.classList.remove(...activeClass); btnCard.classList.add(...inactiveClass);
      } else {
        btnCard.classList.add(...activeClass); btnCard.classList.remove(...inactiveClass);
        btnTable.classList.remove(...activeClass); btnTable.classList.add(...inactiveClass);
      }
      const isFilterActive = state.filterText !== "" || state.selectedHouse !== "all" || state.selectedCategory !== "all";
      const clearBtn = document.getElementById('clear-all-filters');
      if (isFilterActive) clearBtn.classList.remove('hidden'); else clearBtn.classList.add('hidden');
      const searchClearBtn = document.getElementById('clear-search');
      if (state.filterText) searchClearBtn.classList.remove('hidden'); else searchClearBtn.classList.add('hidden');
    }

    // --- モーダル制御 ---
    function openModal(id) {
      const item = ALL_DATA.find(d => String(d.id) === id);
      if (!item) return;

      document.getElementById('modal-house-badge').textContent = item.house;
      document.getElementById('modal-house-badge').className = `px-2 py-0.5 rounded text-xs font-bold text-white ${item.house === '参議院' ? 'bg-indigo-500' : 'bg-purple-500'}`;
      document.getElementById('modal-id').textContent = item.id;
      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-questioner').textContent = item.questioner;
      document.getElementById('modal-category').textContent = item.category || 'なし';
      document.getElementById('modal-summary').textContent = item.answer_point_summary || '要約情報は登録されていません。';

      const linksContainer = document.getElementById('modal-links');
      linksContainer.innerHTML = '';
      
      const createLink = (url, text, color, iconClass) => {
        if (!url) return '';
        return `
          <a href="${url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between p-3 border border-slate-200 rounded-lg hover:border-${color}-400 hover:bg-${color}-50 transition-all group text-sm">
            <span class="font-medium text-slate-600 group-hover:text-${color}-700">${text}</span>
            <i data-lucide="${iconClass}" class="w-4 h-4 text-slate-400 group-hover:text-${color}-500"></i>
          </a>`;
      };

      let linksHtml = '';
      linksHtml += createLink(item.q_html_url, '質問本文 (HTML)', 'blue', 'external-link');
      linksHtml += createLink(item.a_html_url, '答弁本文 (HTML)', 'green', 'external-link');
      linksHtml += createLink(item.q_pdf_url, '質問本文 (PDF)', 'red', 'file-text');
      linksHtml += createLink(item.a_pdf_url, '答弁本文 (PDF)', 'red', 'file-text');
      linksContainer.innerHTML = linksHtml;

      document.getElementById('modal-overlay').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal(event) {
      if (event && event.target.id !== 'modal-overlay') return; // 背景クリック以外は無視 (閉じるボタンはonclickで直接呼ぶ)
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    function setupEventListeners() {
      document.getElementById('search-input').addEventListener('input', (e) => { state.filterText = e.target.value; renderDashboard(); });
      document.getElementById('house-select').addEventListener('change', (e) => { state.selectedHouse = e.target.value; renderDashboard(); });
      document.getElementById('category-select').addEventListener('change', (e) => { state.selectedCategory = e.target.value; renderDashboard(); });
      document.getElementById('view-table').addEventListener('click', () => { state.viewMode = 'table'; renderDashboard(); });
      document.getElementById('view-card').addEventListener('click', () => { state.viewMode = 'card'; renderDashboard(); });
      document.getElementById('clear-all-filters').addEventListener('click', () => {
        state.filterText = ""; state.selectedHouse = "all"; state.selectedCategory = "all";
        document.getElementById('search-input').value = ""; document.getElementById('house-select').value = "all"; document.getElementById('category-select').value = "all";
        renderDashboard();
      });
      document.getElementById('clear-search').addEventListener('click', () => { state.filterText = ""; document.getElementById('search-input').value = ""; renderDashboard(); });
    }
  </script>
</body>
</html>
