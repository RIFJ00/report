
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策リサーチ政策関連情報一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .audio-icon { cursor: pointer; }
        .playing i, #main-audio-control.playing i { color: #3b82f6; animation: pulse 1.2s infinite; }
        .paused i { color: #3b82f6; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }
        .sortable-header { cursor: pointer; user-select: none; }
        .sortable-header:hover { background-color: #4a5568; }
        .sort-icon { margin-left: 0.5rem; color: #a0aec0; width: 1em; display: inline-block; }
        .sortable-header.asc .sort-icon::after { content: '▲'; }
        .sortable-header.desc .sort-icon::after { content: '▼'; }
        .pagination-button { min-width: 2.5rem; }
        .pagination-button.active { z-index: 10; }
    </style>
</head>

                <span id="main-audio-control" class="audio-icon text-blue-500 hover:text-blue-700 text-xl ml-3 cursor-pointer" title="音声コントロール">
                    <i id="main-audio-icon-i" class="fas fa-volume-up"></i>
                </span>
            </h1>
        </header>
        <main class="flex-grow flex flex-col bg-white p-6 rounded-lg shadow-md">
            <!-- All the controls and table structure from the main data view screen -->
        </main>
    </div>
    <audio id="audioPlayer" style="display: none;"></audio>
    <script type="module">
        // All the JS logic from the main data view screen, adapted for the public page
        // with the specific Firestore query and local bookmarks.

</body>
</html>
