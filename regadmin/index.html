        // --- Component: Admin Dashboard ---
        function AdminDashboard({ user }) {
            const [registrations, setRegistrations] = useState([]);
            const [mails, setMails] = useState([]);
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [loading, setLoading] = useState(true);
            const [editingMember, setEditingMember] = useState(null);
            const [deleteConfirmationItem, setDeleteConfirmationItem] = useState(null);
            const [currentView, setCurrentView] = useState('list'); // 'list' or 'mail'
            
            // Mail Resend Modal State
            const [sendingMailData, setSendingMailData] = useState(null); // { registrationData, mailContent }
            const [resendTargetReg, setResendTargetReg] = useState(null);
            
            // Mail Status Detail Modal State
            const [statusDetailMail, setStatusDetailMail] = useState(null);
            
            // Message Modal State
            const [messageModal, setMessageModal] = useState({ isOpen: false, title: '', message: '', type: 'info' });

            const showMessage = (title, message, type = 'info') => {
                setMessageModal({ isOpen: true, title, message, type });
            };

            const closeMessageModal = () => {
                setMessageModal(prev => ({ ...prev, isOpen: false }));
            };

            // PDF Generation
            const pdfRef1 = useRef(null);
            const pdfRef2 = useRef(null);
            const [pdfData, setPdfData] = useState(null);
            const [isPdfGenerating, setIsPdfGenerating] = useState(false);

            useEffect(() => {
                if (!user) return;
                
                const qReg = query(collectionGroup(db, 'registrations'));
                const unsubReg = onSnapshot(qReg, (snapshot) => {
                    const data = snapshot.docs.map(doc => {
                        const d = doc.data();
                        return {
                            id: doc.id,
                            ...d,
                            createdAtDate: d.createdAt?.toDate() || new Date(),
                            applicationDate: d.createdAt?.toDate().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }) || '',
                            refPath: doc.ref.path 
                        };
                    });
                    data.sort((a, b) => b.createdAtDate - a.createdAtDate);
                    setRegistrations(data);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching registrations:", error);
                    setLoading(false);
                });

                const qMail = query(collection(db, 'mail'), orderBy('delivery.startTime', 'desc')); 
                const unsubMail = onSnapshot(collection(db, 'mail'), (snapshot) => {
                    const data = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setMails(data);
                }, (error) => {
                    console.warn("Error fetching mails (permission might be denied):", error);
                });

                return () => {
                    unsubReg();
                    unsubMail();
                };
            }, [user]);

            const registrationsWithMailStatus = useMemo(() => {
                return registrations.map(reg => {
                    let mailLog = mails.find(m => m.metadata?.registrationId === reg.id);
                    if (!mailLog) {
                        mailLog = mails.find(m => {
                            const toAddress = Array.isArray(m.to) ? m.to[0] : m.to;
                            return toAddress === reg.email;
                        });
                    }
                    return {
                        ...reg,
                        mailStatus: mailLog?.delivery?.state || 'MISSING', 
                        mailError: mailLog?.delivery?.error || null,
                        mailDocId: mailLog?.id,
                        mailSubject: mailLog?.message?.subject
                    };
                });
            }, [registrations, mails]);

            const toggleSelectAll = () => {
                if (selectedIds.size === registrationsWithMailStatus.length) {
                    setSelectedIds(new Set());
                } else {
                    setSelectedIds(new Set(registrationsWithMailStatus.map(r => r.id)));
                }
            };

            const toggleSelect = (id) => {
                const newSelected = new Set(selectedIds);
                if (newSelected.has(id)) {
                    newSelected.delete(id);
                } else {
                    newSelected.add(id);
                }
                setSelectedIds(newSelected);
            };

            const getTargetData = () => {
                if (selectedIds.size > 0) {
                    return registrationsWithMailStatus.filter(r => selectedIds.has(r.id));
                }
                return registrationsWithMailStatus;
            };
            
            // --- PDF Bulk Generation ---
            const generateBulkPDF = async () => {
                const targets = getTargetData();
                if (targets.length === 0) {
                    showMessage("通知", "PDFを出力するデータを選択してください。", 'info');
                    return;
                }

                if (!window.jspdf || !window.html2canvas) {
                    showMessage("準備中", "PDF生成ライブラリを読み込み中です。少々お待ちください。", 'info');
                    return;
                }

                setIsPdfGenerating(true);

                try {
                    const { jsPDF } = window.jspdf;
                    // p: portrait, mm: units, a4: format
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const scale = 4;
                    const imageFormat = 'image/jpeg';
                    const imageQuality = 0.95;

                    for (let i = 0; i < targets.length; i++) {
                        const data = targets[i];
                        
                        // Set data for rendering
                        setPdfData(data);
                        // Wait for render
                        await new Promise(resolve => setTimeout(resolve, 100));

                        // 1ページ目 (申込書)
                        if (pdfRef1.current) {
                            pdfRef1.current.style.display = 'block';
                            const canvas1 = await window.html2canvas(pdfRef1.current, { scale, useCORS: true });
                            pdfRef1.current.style.display = 'none';
                            const imgData1 = canvas1.toDataURL(imageFormat, imageQuality);
                            const imgProps1 = pdf.getImageProperties(imgData1);
                            const imgHeight1 = (imgProps1.height * pdfWidth) / imgProps1.width;
                            
                            if (i > 0) pdf.addPage();
                            pdf.addImage(imgData1, 'JPEG', 0, 0, pdfWidth, imgHeight1);
                        }

                        // 2ページ目 (規約) - 常にページ追加
                        if (pdfRef2.current) {
                            pdf.addPage();
                            pdfRef2.current.style.display = 'block';
                            const canvas2 = await window.html2canvas(pdfRef2.current, { scale, useCORS: true });
                            pdfRef2.current.style.display = 'none';
                            const imgData2 = canvas2.toDataURL(imageFormat, imageQuality);
                            const imgProps2 = pdf.getImageProperties(imgData2);
                            const imgHeight2 = (imgProps2.height * pdfWidth) / imgProps2.width;
                            if (imgHeight2 > pdfHeight) {
                                pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                            } else {
                                pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, imgHeight2);
                            }
                        }
                    }
                    
                    const filename = targets.length === 1 
                        ? `${targets[0].companyName}_${targets[0].fullName}_申込書.pdf` 
                        : `政策リサーチ申込書一括出力_${new Date().toISOString().slice(0,10)}.pdf`;
                        
                    pdf.save(filename);

                } catch (e) {
                    console.error("PDF generation error:", e);
                    showMessage("エラー", "PDF生成中にエラーが発生しました。\n" + e.message, 'error');
                } finally {
                    setIsPdfGenerating(false);
                    setPdfData(null); // Clear data to hide hidden elements
                }
            };

            const handleDeleteClick = (item) => {
                setDeleteConfirmationItem(item);
            };

            const confirmDelete = async () => {
                if (!deleteConfirmationItem) return;
                try {
                    await deleteDoc(doc(db, deleteConfirmationItem.refPath)); 
                    setDeleteConfirmationItem(null);
                } catch (e) {
                    console.error("Delete failed:", e);
                    showMessage("エラー", "削除に失敗しました: " + e.message, 'error');
                }
            };

            const handleUpdate = async (id, newData) => {
                const targetItem = registrations.find(r => r.id === id);
                if (!targetItem) return;

                try {
                    const updateData = { ...newData };
                    // 不要なUI用プロパティを削除
                    delete updateData.id;
                    delete updateData.createdAtDate;
                    delete updateData.applicationDate;
                    delete updateData.refPath;
                    delete updateData.mailStatus;
                    delete updateData.mailError;
                    delete updateData.mailDocId;
                    delete updateData.mailSubject;

                    if (updateData.lastName && updateData.firstName) {
                        updateData.fullName = `${updateData.lastName} ${updateData.firstName}`;
                    }
                    await updateDoc(doc(db, targetItem.refPath), updateData);
                    setEditingMember(null);
                } catch (e) {
                    console.error("Update failed:", e);
                    showMessage("エラー", "更新に失敗しました: " + e.message, 'error');
                }
            };

            // メール再送信処理（準備）
            const handlePrepareResendEmail = async (regData) => {
                // 再送信回数のチェック (モーダルを開く前にもチェック)
                const currentResendCount = regData.resendCount || 0;
                if (currentResendCount >= 3) {
                    showMessage("送信制限", "再送信の限度（3回）に達しました。これ以上は送信できません。", 'error');
                    return;
                }

                try {
                    let subject = "【政策リサーチ】利用お申し込みありがとうございます";
                    let body = ""; 

                    const templateDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mail_templates', 'registration'));
                    if (templateDoc.exists()) {
                        const template = templateDoc.data();
                        subject = template.subject || subject;
                        body = template.body;
                    } else {
                        // デフォルト本文の修正: resolveFullNameを使用
                        body = `${regData.companyName}\n${regData.department || ''}\n${resolveFullName(regData)} 様\n\nこの度は、「政策リサーチ」にお申し込みいただき、誠にありがとうございます。\n以下の内容で承りました。\n\nプラン: ${getOfficialPlanName(regData.plan, regData.paymentCycle)}\n金額: ${getPlanPrice(regData.plan, regData.paymentCycle)}円\n\nシステムへの登録完了後に、改めてアカウント有効通知のメールが送信されますので、パスワードを設定の上ご利用ください。\n\n--------------------------------------------------\n一般社団法人日本みらい研\n--------------------------------------------------`;
                    }

                    // プレースホルダーの置換: resolveFullNameを使用
                    const finalBody = body
                        .replace(/{{companyName}}/g, regData.companyName || '')
                        .replace(/{{department}}/g, regData.department || '')
                        .replace(/{{name}}/g, resolveFullName(regData))
                        .replace(/{{plan}}/g, getOfficialPlanName(regData.plan, regData.paymentCycle) || '')
                        .replace(/{{price}}/g, getPlanPrice(regData.plan, regData.paymentCycle) + '円' || '');

                    setResendTargetReg(regData);
                    setSendingMailData({
                        to: [regData.email],
                        cc: ['seisaku@rifj.jp'],
                        subject: subject,
                        body: finalBody,
                        currentResendCount: currentResendCount // 現在の回数を渡す
                    });

                } catch (e) {
                    console.error("Template fetch failed:", e);
                    showMessage("エラー", "メールテンプレートの読み込みに失敗しました。: " + e.message, 'error');
                }
            };

            // メール再送信実行（確定）
            const handleConfirmResendEmail = async (mailData) => {
                if (!resendTargetReg) return;

                // 再送信回数のチェック
                const currentResendCount = resendTargetReg.resendCount || 0;
                const maxResendCount = 3;
                
                if (currentResendCount >= maxResendCount) {
                    showMessage("送信制限", "再送信の限度に達しました。", 'error');
                    setSendingMailData(null);
                    setResendTargetReg(null);
                    return;
                }

                try {
                    // 文字列の場合はカンマ区切りで配列化し、空白除去と空要素のフィルタリングを行う
                    const toList = typeof mailData.to === 'string' 
                        ? mailData.to.split(',').map(s => s.trim()).filter(s => s !== '') 
                        : mailData.to;
                    const ccList = typeof mailData.cc === 'string' 
                        ? mailData.cc.split(',').map(s => s.trim()).filter(s => s !== '') 
                        : mailData.cc;

                    // 必須チェック
                    if (toList.length === 0) {
                        showMessage("入力エラー", "宛先(To)を入力してください。", 'error');
                        return; 
                    }

                    // 1. メール送信リクエスト (mailコレクションへの追加)
                    await addDoc(collection(db, 'mail'), {
                        to: toList,
                        cc: ccList,
                        message: {
                            subject: mailData.subject,
                            text: mailData.body
                        },
                        metadata: {
                            registrationId: resendTargetReg.id,
                            resend: true 
                        }
                    });

                    // 2. 再送信回数の更新 (registrationsコレクションの更新)
                    const newCount = currentResendCount + 1;
                    const remainingCount = maxResendCount - newCount;
                    
                    await updateDoc(doc(db, resendTargetReg.refPath), {
                        resendCount: newCount
                    });

                    // 送信モーダルを閉じる
                    setSendingMailData(null);
                    setResendTargetReg(null);

                    // 成功メッセージを表示
                    setTimeout(() => {
                        showMessage("送信完了", `送信が正常に完了しました。\n\n現在の送信回数: ${newCount}/${maxResendCount}\n残り送信可能回数: ${remainingCount}回`, 'success');
                    }, 100);

                } catch (e) {
                    console.error("Resend failed:", e);
                    setSendingMailData(null);
                    setResendTargetReg(null);
                    showMessage("送信エラー", "再送信リクエストの作成に失敗しました:\n" + e.message, 'error');
                }
            };

            const generateCSV = (headers, rows, filename) => {
                const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a'); link.href = url; link.setAttribute('download', filename); document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const downloadMemberCSV = () => {
                const targetData = getTargetData();
                if (targetData.length === 0) { showMessage("通知", "データがありません。", 'info'); return; }
                const headers = ["区分", "会社名", "部署", "姓", "名", "役職", "プラン", "メールアドレス", "電話番号", "郵便番号", "住所1", "住所2", "請求先名", "請求先部署", "請求先メール", "請求先電話", "備考", "登録日時"];
                const rows = targetData.map(reg => [
                    `"${reg.categoryCode || 'C00'}"`, `"${reg.companyName || ''}"`, `"${reg.department || ''}"`, `"${reg.lastName || ''}"`, `"${reg.firstName || ''}"`, `"${reg.position || ''}"`,
                    `"${getOfficialPlanName(reg.plan, reg.paymentCycle)}"`, `"${reg.email}"`, `"${reg.phone}"`, `"${reg.postalCode || ''}"`, `"${reg.address}"`, `"${reg.address2 || ''}"`,
                    `"${reg.billingName || ''}"`, `"${reg.billingDepartment || ''}"`, `"${reg.billingEmail || ''}"`, `"${reg.billingPhone || ''}"`, `"${(reg.notes || '').replace(/\n/g, ' ')}"`,
                    reg.createdAtDate.toLocaleString('ja-JP')
                ]);
                generateCSV(headers, rows, `政策リサーチ会員リスト_${new Date().toISOString().slice(0, 10)}.csv`);
            };

            const downloadBillingCSV = () => {
                const targetData = getTargetData();
                if (targetData.length === 0) { showMessage("通知", "データがありません。", 'info'); return; }
                const headers = ["区分", "請求先名", "請求先部署", "請求先メール", "請求先電話", "プラン", "金額(円)", "登録日時"];
                const rows = targetData.map(reg => [
                    `"${reg.categoryCode || 'C00'}"`, `"${reg.billingName || ''}"`, `"${reg.billingDepartment || ''}"`, `"${reg.billingEmail || ''}"`, `"${reg.billingPhone || ''}"`,
                    `"${getOfficialPlanName(reg.plan, reg.paymentCycle)}"`, `"${getPlanPrice(reg.plan, reg.paymentCycle)}"`, reg.createdAtDate.toLocaleString('ja-JP')
                ]);
                generateCSV(headers, rows, `政策リサーチ請求先リスト_${new Date().toISOString().slice(0, 10)}.csv`);
            };

            const downloadRegistrationCSV = () => {
                const targetData = getTargetData();
                if (targetData.length === 0) { showMessage("通知", "データがありません。", 'info'); return; }
                const headers = ["メールアドレス", "姓", "名", "携帯電話番号", "自宅電話番号", "会社名", "会社電話番号", "郵便番号", "国", "都道府県", "市町村", "番地", "ビル名", "区分", "プラン"];
                const rows = targetData.map(reg => {
                    const address = reg.address || '';
                    let prefecture = ''; let city = '';
                    const prefMatch = address.match(/^(.{2,3}[都道府県])(.*)/);
                    if (prefMatch) { prefecture = prefMatch[1]; city = prefMatch[2]; } else { city = address; }
                    return [
                        `"${reg.email}"`, `"${reg.lastName || ''}"`, `"${reg.firstName || ''}"`, `"${reg.phone}"`, `""`, `"${reg.companyName || ''}"`, `""`, `"${reg.postalCode || ''}"`, `"日本"`, `"${prefecture}"`, `"${city}"`, `""`, `"${reg.address2 || ''}"`, `"${reg.categoryCode || 'C00'}"`, `"${getOfficialPlanName(reg.plan, reg.paymentCycle)}"`
                    ];
                });
                generateCSV(headers, rows, `政策リサーチ登録用リスト_${new Date().toISOString().slice(0, 10)}.csv`);
            };

            if (loading) {
                return <div className="text-center py-10 text-slate-500">データを読み込み中...</div>;
            }

            return (
                <div className="space-y-6">
                    {/* Invisible PDF Components for Admin generation */}
                    <PdfPage1 ref={pdfRef1} data={pdfData} />
                    <PdfPage2 ref={pdfRef2} />

                    {editingMember && (
                        <EditMemberModal
                            member={editingMember}
                            onClose={() => setEditingMember(null)}
                            onUpdate={handleUpdate}
                        />
                    )}
                    {deleteConfirmationItem && (
                        <ConfirmModal
                            isOpen={true}
                            title="削除の確認"
                            message="本当にこのデータを削除しますか？この操作は取り消せません。"
                            confirmText="削除する"
                            isDanger={true}
                            onConfirm={confirmDelete}
                            onCancel={() => setDeleteConfirmationItem(null)}
                        />
                    )}
                    {sendingMailData && (
                        <SendMailModal
                            isOpen={true}
                            initialData={sendingMailData}
                            onClose={() => { setSendingMailData(null); setResendTargetReg(null); }}
                            onSend={handleConfirmResendEmail}
                        />
                    )}
                    {statusDetailMail && (
                        <MailStatusModal
                            isOpen={true}
                            mailData={statusDetailMail}
                            onClose={() => setStatusDetailMail(null)}
                        />
                    )}
                    {messageModal.isOpen && (
                        <MessageModal
                            isOpen={true}
                            onClose={closeMessageModal}
                            title={messageModal.title}
                            message={messageModal.message}
                            type={messageModal.type}
                        />
                    )}
                    
                    {/* Admin Nav */}
                    <div className="bg-white p-2 rounded-lg shadow-sm border border-slate-200 inline-flex gap-1 mb-2">
                        <button 
                            onClick={() => setCurrentView('list')}
                            className={`px-4 py-2 rounded-md text-sm font-bold transition-colors flex items-center gap-2 ${currentView === 'list' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}
                        >
                            <List size={18} />
                            申し込み一覧
                        </button>
                        <button 
                            onClick={() => setCurrentView('mail')}
                            className={`px-4 py-2 rounded-md text-sm font-bold transition-colors flex items-center gap-2 ${currentView === 'mail' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}
                        >
                            <Settings size={18} />
                            メール設定
                        </button>
                    </div>

                    {currentView === 'list' && (
                        <>
                            <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                                <div>
                                    <h2 className="text-xl font-bold text-slate-800">申し込み一覧</h2>
                                    <p className="text-slate-500 text-sm">
                                        {selectedIds.size > 0 ?
                                            <span className="text-indigo-600 font-bold">{selectedIds.size} 件選択中</span> :
                                            `全 ${registrationsWithMailStatus.length} 件`}
                                    </p>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    <button onClick={generateBulkPDF} disabled={isPdfGenerating} className={`bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm ${isPdfGenerating ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                        {isPdfGenerating ? <RefreshCw className="animate-spin" size={16} /> : <Printer size={16} />}
                                        <span>PDF一括出力</span>
                                    </button>
                                    <button onClick={downloadMemberCSV} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm"><FileSpreadsheet size={16} /><span>会員リスト出力</span></button>
                                    <button onClick={downloadBillingCSV} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm"><Receipt size={16} /><span>請求先リスト出力</span></button>
                                    <button onClick={downloadRegistrationCSV} className="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm"><UserPlus size={16} /><span>システム登録用出力</span></button>
                                </div>
                            </div>
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse whitespace-nowrap">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm uppercase tracking-wider">
                                                <th className="p-4 w-10">
                                                    <button onClick={toggleSelectAll} className="flex items-center text-slate-400 hover:text-slate-600">
                                                        {registrationsWithMailStatus.length > 0 && selectedIds.size === registrationsWithMailStatus.length ? <CheckSquare size={20} className="text-indigo-600" /> : <Square size={20} />}
                                                    </button>
                                                </th>
                                                <th className="p-4 font-semibold">操作</th>
                                                <th className="p-4 font-semibold text-center">メール</th>
                                                <th className="p-4 font-semibold">日時</th>
                                                <th className="p-4 font-semibold">区分</th>
                                                <th className="p-4 font-semibold">会社・部署</th>
                                                <th className="p-4 font-semibold">氏名・役職</th>
                                                <th className="p-4 font-semibold">プラン</th>
                                                <th className="p-4 font-semibold border-l border-slate-100 bg-slate-50/50">請求先情報</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {registrationsWithMailStatus.length === 0 ? (
                                                <tr>
                                                    <td colSpan="9" className="p-8 text-center text-slate-400">まだ登録データがありません。「申し込み」タブから登録してください。</td>
                                                </tr>
                                            ) : (
                                                registrationsWithMailStatus.map((reg) => (
                                                    <tr key={reg.id} className={`hover:bg-indigo-50/30 transition-colors ${selectedIds.has(reg.id) ? 'bg-indigo-50/50' : ''}`}>
                                                        <td className="p-4">
                                                            <button onClick={() => toggleSelect(reg.id)} className="flex items-center text-slate-400 hover:text-slate-600">
                                                                {selectedIds.has(reg.id) ? <CheckSquare size={20} className="text-indigo-600" /> : <Square size={20} />}
                                                            </button>
                                                        </td>
                                                        <td className="p-4">
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => setEditingMember(reg)} className="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded border border-indigo-200 hover:border-indigo-400 transition-colors" title="編集"><Edit size={16} /></button>
                                                                <button onClick={() => handleDeleteClick(reg)} className="p-1.5 text-red-600 hover:bg-red-50 rounded border border-red-200 hover:border-red-400 transition-colors" title="削除"><Trash2 size={16} /></button>
                                                            </div>
                                                        </td>
                                                        <td className="p-4 text-center">
                                                            <div className="flex flex-row items-center justify-center gap-3">
                                                                <button 
                                                                    onClick={() => setStatusDetailMail(reg)}
                                                                    className="hover:opacity-70 transition-opacity"
                                                                >
                                                                    {reg.mailStatus === 'SUCCESS' && <span className="text-green-600" title="送信成功"><CheckCircle size={20} /></span>}
                                                                    {reg.mailStatus === 'ERROR' && <span className="text-red-500" title={`送信エラー: ${reg.mailError || '詳細不明'}`}><MailWarning size={20} /></span>}
                                                                    {(reg.mailStatus === 'PENDING' || reg.mailStatus === 'PROCESSING') && <span className="text-amber-500 animate-pulse" title="送信処理中..."><RefreshCw size={20} /></span>}
                                                                    {reg.mailStatus === 'MISSING' && <span className="text-slate-300" title="送信記録なし"><Eye size={20} /></span>}
                                                                </button>
                                                                
                                                                <button 
                                                                    onClick={() => handlePrepareResendEmail(reg)}
                                                                    className={`text-xs px-2 py-1 rounded border transition-colors flex items-center gap-1 ${reg.mailStatus === 'SUCCESS' ? 'text-slate-400 border-slate-200 hover:bg-slate-50' : 'text-indigo-600 border-indigo-200 bg-indigo-50 hover:bg-indigo-100 font-bold'}`}
                                                                    title="再送信"
                                                                >
                                                                    <Send size={12} />
                                                                    再送信
                                                                </button>
                                                            </div>
                                                        </td>
                                                        <td className="p-4 text-slate-500 text-sm">
                                                            {reg.createdAtDate.toLocaleDateString('ja-JP')}
                                                            <div className="text-xs text-slate-400">{reg.createdAtDate.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</div>
                                                        </td>
                                                        <td className="p-4 text-sm text-slate-600">
                                                            <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">{reg.categoryCode || 'C00'}</span>
                                                        </td>
                                                        <td className="p-4 text-sm text-slate-800">
                                                            <div className="font-bold">{reg.companyName}</div>
                                                            <div className="text-slate-600 text-xs">{reg.department}</div>
                                                        </td>
                                                        <td className="p-4 text-sm text-slate-800">
                                                            <div className="font-medium">{resolveFullName(reg)}</div>
                                                            {reg.position && <div className="text-xs text-slate-500">{reg.position}</div>}
                                                        </td>
                                                        <td className="p-4">
                                                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${reg.plan === 'corporate' ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : reg.plan === 'personal' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-700 border-slate-200'}`}>
                                                                {getOfficialPlanName(reg.plan, reg.paymentCycle)}
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-sm text-slate-600 border-l border-slate-100 bg-slate-50/30">
                                                            <div className="font-medium truncate max-w-[150px]" title={reg.billingName}>{reg.billingName}</div>
                                                            <div className="text-xs text-slate-400 truncate max-w-[150px]" title={reg.billingDepartment}>{reg.billingDepartment}</div>
                                                            <div className="text-xs text-slate-400 mt-1">{reg.billingPhone}</div>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </>
                    )}

                    {currentView === 'mail' && (
                        <MailTemplateEditor />
                    )}
                </div>
            );
        }

        // --- App Component ---
        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('admin'); 
            const [authError, setAuthError] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false); // パスワード認証状態

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        // 独自のFirebase設定を使用しているため、Canvas環境のトークンは使用せず匿名認証を行います
                        await signInAnonymously(auth);
                    } catch (error) {
                        console.error("Auth error:", error);
                        setAuthError(error.message);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            if (authError) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border-l-4 border-red-500">
                            <div className="flex items-center gap-3 mb-4 text-red-600">
                                <AlertTriangle size={32} />
                                <h2 className="text-xl font-bold">システムエラー</h2>
                            </div>
                            <p className="text-gray-700 mb-4">データベースへの接続に失敗しました。</p>
                            <div className="bg-slate-100 p-3 rounded text-xs font-mono text-slate-600 mb-4 overflow-x-auto">{authError}</div>
                            <p className="text-sm text-gray-500">
                                管理者の方へ: Firebaseコンソールで <strong>Authentication</strong> の設定を確認してください。
                                <strong>匿名ログイン(Anonymous Auth)</strong> が有効になっている必要があります。
                            </p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 text-gray-600">
                        <div className="flex flex-col items-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
                            <p>システムを読み込み中...</p>
                        </div>
                    </div>
                );
            }

            // パスワード認証が完了していない場合、ログイン画面を表示
            if (!isAuthenticated) {
                return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
            }

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">
                    <header className="bg-indigo-800 text-white shadow-lg print:hidden">
                        <div className="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-2">
                                <Shield className="w-8 h-8 text-indigo-200" />
                                <h1 className="text-xl font-bold tracking-wide">
                                    {activeTab === 'admin' ? '政策リサーチ管理者画面' : '政策リサーチ申込画面'}
                                </h1>
                            </div>
                            <div className="flex bg-indigo-900/50 rounded-lg p-1">
                                <button
                                    onClick={() => setActiveTab('admin')}
                                    className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'admin' ? 'bg-white text-indigo-800 shadow-sm' : 'text-indigo-200 hover:text-white'}`}
                                >
                                    <div className="flex items-center gap-2">
                                        <List size={16} />
                                        <span>管理者</span>
                                    </div>
                                </button>
                                <button
                                    onClick={() => setActiveTab('form')}
                                    className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'form' ? 'bg-white text-indigo-800 shadow-sm' : 'text-indigo-200 hover:text-white'}`}
                                >
                                    <div className="flex items-center gap-2">
                                        <User size={16} />
                                        <span>申し込み</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </header>
                    <main className="max-w-5xl mx-auto px-4 py-8 w-full flex-grow">
                        {activeTab === 'form' ? <RegistrationForm user={user} /> : <AdminDashboard user={user} />}
                    </main>
                    <footer className="bg-slate-100 border-t border-slate-200 print:hidden">
                        <div className="max-w-5xl mx-auto px-4 py-8 flex flex-col items-center gap-4">
                            <CorporateFooter />
                            <div className="text-xs flex items-center justify-center gap-2 text-slate-400">
                                <span>© 2025 Policy Research Portal. Secure Data System.</span>
                                <span className="text-slate-300">|</span>
                                <a
                                    href="https://www.rifj.jp/privacypolicy/"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="hover:text-indigo-800 hover:underline transition-colors flex items-center gap-1"
                                >
                                    プライバシーポリシーについて
                                    <span className="text-xs">↗</span>
                                </a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
