                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleAdditionalChange = (index, field, value) => {
                const newAdditional = [...(formData.additionalMembers || [])];
                if (!newAdditional[index]) newAdditional[index] = {};
                newAdditional[index][field] = value;
                setFormData(prev => ({ ...prev, additionalMembers: newAdditional }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                const processedData = { ...formData };
                
                // 電話番号の正規化（編集時も適用）
                if (processedData.phone) {
                    processedData.phone = normalizePhoneNumber(processedData.phone);

                    processedData.additionalMembers = processedData.additionalMembers.map(m => ({

                        phone: m.phone ? normalizePhoneNumber(m.phone) : m.phone
                    }));

                onUpdate(member.id, processedData);

                        <form onSubmit={handleSubmit} className="p-6 space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">区分コード</label><input type="text" name="categoryCode" value={formData.categoryCode || 'C00'} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">会社名</label><input type="text" name="companyName" value={formData.companyName || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">部署名</label><input type="text" name="department" value={formData.department || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">役職</label><input type="text" name="position" value={formData.position || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">姓</label><input type="text" name="lastName" value={formData.lastName || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">名</label><input type="text" name="firstName" value={formData.firstName || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">メールアドレス</label><input type="email" name="email" value={formData.email || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">電話番号</label><input type="tel" name="phone" value={formData.phone || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1"><label className="text-sm font-bold text-slate-700">郵便番号</label><input type="text" name="postalCode" value={formData.postalCode || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1 md:col-span-2"><label className="text-sm font-bold text-slate-700">住所1</label><input type="text" name="address" value={formData.address || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                <div className="space-y-1 md:col-span-2"><label className="text-sm font-bold text-slate-700">住所2</label><input type="text" name="address2" value={formData.address2 || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                            </div>
                            
                            {formData.additionalMembers && formData.additionalMembers.length > 0 && (
                                <div className="border-t pt-4 mt-4">
                                    <h4 className="font-bold mb-4 text-slate-800">追加利用者情報</h4>
                                    <div className="space-y-4">
                                        {formData.additionalMembers.map((mem, i) => (
                                            <div key={i} className="p-3 bg-slate-50 rounded border border-slate-200">
                                                <div className="font-bold text-sm mb-2">利用者 {i + 1}</div>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <input placeholder="姓" value={mem.lastName || ''} onChange={(e) => handleAdditionalChange(i, 'lastName', e.target.value)} className="px-2 py-1 border rounded" />
                                                    <input placeholder="名" value={mem.firstName || ''} onChange={(e) => handleAdditionalChange(i, 'firstName', e.target.value)} className="px-2 py-1 border rounded" />
                                                    <input placeholder="Email" value={mem.email || ''} onChange={(e) => handleAdditionalChange(i, 'email', e.target.value)} className="px-2 py-1 border rounded col-span-2" />
                                                    <input placeholder="電話番号" value={mem.phone || ''} onChange={(e) => handleAdditionalChange(i, 'phone', e.target.value)} className="px-2 py-1 border rounded col-span-2" />
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="border-t pt-4 mt-4">
                                <h4 className="font-bold mb-4 text-slate-800">プラン情報</h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="space-y-1"><label className="text-sm font-bold text-slate-700">プラン</label><select name="plan" value={formData.plan} onChange={handleChange} className="w-full px-3 py-2 border rounded"><option value="trial">トライアル</option><option value="corporate">企業プラン</option><option value="personal">個人プラン</option></select></div>
                                    <div className="space-y-1"><label className="text-sm font-bold text-slate-700">支払いサイクル</label><select name="paymentCycle" value={formData.paymentCycle || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded"><option value="">(なし)</option><option value="monthly">月払い</option><option value="yearly">年払い</option></select></div>
                                </div>
                            </div>
                            <div className="border-t pt-4 mt-4">
                                <h4 className="font-bold mb-4 text-slate-800">請求先情報</h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="space-y-1"><label className="text-sm font-bold text-slate-700">請求先名</label><input type="text" name="billingName" value={formData.billingName || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                    <div className="space-y-1"><label className="text-sm font-bold text-slate-700">請求先部署</label><input type="text" name="billingDepartment" value={formData.billingDepartment || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                    <div className="space-y-1"><label className="text-sm font-bold text-slate-700">請求先メール</label><input type="email" name="billingEmail" value={formData.billingEmail || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                    <div className="space-y-1"><label className="text-sm font-bold text-slate-700">請求先電話</label><input type="tel" name="billingPhone" value={formData.billingPhone || ''} onChange={handleChange} className="w-full px-3 py-2 border rounded" /></div>
                                </div>
                            </div>
                            <div className="border-t pt-4 mt-4">
                                <label className="text-sm font-bold text-slate-700 block mb-1">備考</label>
                                <textarea name="notes" value={formData.notes || ''} onChange={handleChange} rows="3" className="w-full px-3 py-2 border rounded"></textarea>
                            </div>
                            <div className="flex justify-end gap-3 pt-4 border-t sticky bottom-0 bg-white">
                                <button type="button" onClick={onClose} className="px-4 py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-50">キャンセル</button>
                                <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 flex items-center gap-2"><Save size={18} /> 保存する</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- Main Components ---
        function RegistrationForm({ user }) {
            const [formData, setFormData] = useState({
                companyName: '', department: '', lastName: '', firstName: '', position: '',
                email: '', emailConfirm: '', phone: '', postalCode: '', address: '', address2: '',
                plan: 'trial', paymentCycle: '', notes: '',
                isBillingDifferent: false, billingName: '', billingDepartment: '',
                billingEmail: '', billingEmailConfirm: '', billingPhone: '',
                additionalMembers: [{}, {}, {}, {}] // 4名分
            });
            const [finalDataForPdf, setFinalDataForPdf] = useState(null);
            const [agreedToTerms, setAgreedToTerms] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null); 
            const [addressLoading, setAddressLoading] = useState(false);
            const [validationError, setValidationError] = useState('');
            const [useCreditCard, setUseCreditCard] = useState(false);
            
            // Modal State
            const [messageModal, setMessageModal] = useState({ isOpen: false, title: '', message: '', type: 'info' });

            const showMessage = (title, message, type = 'info') => {
                setMessageModal({ isOpen: true, title, message, type });
            };

            const closeMessageModal = () => {
                setMessageModal(prev => ({ ...prev, isOpen: false }));
            };
            
            const pdfRef1 = useRef(null);
            const pdfRef2 = useRef(null);
            const paymentMethodRef = useRef(null);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: type === 'checkbox' ? checked : value };
                    
                    // プランやサイクルが変わったらクレジット決済をリセット
                    if (name === 'plan' || name === 'paymentCycle') {
                        setUseCreditCard(false);
                        // クレジットによる強制上書きを解除（必要に応じて）
                        if (useCreditCard) {
                             newData.isBillingDifferent = false;
                             newData.billingName = '';
                             // 他のフィールドはユーザー入力のままかクリアするか判断が難しいが、一旦クリア
                             newData.billingEmail = '';
                             newData.billingEmailConfirm = '';
                             newData.billingPhone = '';
                        }
                    }

                    if (name === 'plan') {
                        if (value === 'trial') {
                            newData.paymentCycle = ''; 
                            newData.isBillingDifferent = false; 
                        } else {
                            newData.paymentCycle = ''; 
                        }
                    }
                    return newData;
                });
                if (validationError) setValidationError('');
            };

            const handleAdditionalMemberChange = (index, field, value) => {
                const newMembers = [...formData.additionalMembers];
                newMembers[index] = { ...newMembers[index], [field]: value };
                setFormData(prev => ({ ...prev, additionalMembers: newMembers }));
            };

            const searchAddress = async () => {
                if (!formData.postalCode || formData.postalCode.length < 7) {
                    setValidationError("郵便番号は7桁で入力してください（ハイフンなし）");
                    return;
                }
                setAddressLoading(true);
                setValidationError('');
                try {
                    const response = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${formData.postalCode}`);
                    const data = await response.json();
                    if (data.results) {
                        const result = data.results[0];
                        const fullAddress = `${result.address1}${result.address2}${result.address3}`;
                        setFormData(prev => ({ ...prev, address: fullAddress }));
                    } else {
                        setValidationError("住所が見つかりませんでした。郵便番号を確認してください。");
                    }
                } catch (error) {
                    console.error("Address search error:", error);
                    setValidationError("住所検索中にエラーが発生しました。手動で入力してください。");
                } finally {
                    setAddressLoading(false);
                }
            };

            const generatePDF = async () => {
                if (!window.jspdf || !window.html2canvas) {
                    showMessage("準備中", "PDF生成ライブラリを読み込み中です。少々お待ちください。", 'info');
                    return;
                }
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const scale = 4; 
                    const imageFormat = 'image/jpeg';
                    const imageQuality = 0.95;

                    // PdfPage1 の中身をセクションごとに分割して描画
                    if (pdfRef1.current) {
                        pdfRef1.current.style.display = 'block';
                        const sections = pdfRef1.current.querySelectorAll('.pdf-section');
                        
                        let currentY = 0;
                        
                        for (let i = 0; i < sections.length; i++) {
                            const section = sections[i];
                            const canvas = await window.html2canvas(section, { scale: scale, useCORS: true });
                            const imgData = canvas.toDataURL(imageFormat, imageQuality);
                            const imgProps = pdf.getImageProperties(imgData);
                            const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;

                            if (currentY + imgHeight > pdfHeight) {
                                pdf.addPage();
                                currentY = 0;
                            }

                            pdf.addImage(imgData, 'JPEG', 0, currentY, pdfWidth, imgHeight);
                            currentY += imgHeight;
                        }
                        pdfRef1.current.style.display = 'none';
                    }

                    if (pdfRef2.current) {
                        pdf.addPage();
                        pdfRef2.current.style.display = 'block';
                        const canvas2 = await window.html2canvas(pdfRef2.current, { scale: scale, useCORS: true });
                        pdfRef2.current.style.display = 'none';
                        const imgData2 = canvas2.toDataURL(imageFormat, imageQuality);
                        const imgProps2 = pdf.getImageProperties(imgData2);
                        const imgHeight2 = (imgProps2.height * pdfWidth) / imgProps2.width;
                        
                        if (imgHeight2 > pdfHeight) {
                             pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                        } else {
                             pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, imgHeight2);
                        }
                    }
                    pdf.save('登録情報_利用規約.pdf');
                } catch (error) {
                    console.error("PDF generation failed", error);
                    showMessage("エラー", "PDFの生成に失敗しました。", 'error');
                }
            };

            const handleFinish = () => {
                setSubmitStatus(null);
                setFinalDataForPdf(null);
                setFormData({
                    companyName: '', department: '', lastName: '', firstName: '', position: '',
                    email: '', emailConfirm: '', phone: '', postalCode: '', address: '', address2: '',
                    plan: 'trial', paymentCycle: '', notes: '',
                    isBillingDifferent: false, billingName: '', billingDepartment: '',
                    billingEmail: '', billingEmailConfirm: '', billingPhone: '',
                    additionalMembers: [{}, {}, {}, {}]
                });
                setUseCreditCard(false);
                setAgreedToTerms(false);
                window.scrollTo(0, 0);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return;
                
                if (formData.email !== formData.emailConfirm) {
                    setValidationError("メールアドレスが一致しません。");
                    window.scrollTo(0, 0);
                    return;
                }
                if (formData.plan !== 'trial' && !formData.paymentCycle) {
                    setValidationError("お支払い方法を選択してください。");
                    paymentMethodRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                
                // クレジット決済でない場合のみ、請求先の通常バリデーションを行う
                if (formData.isBillingDifferent && !useCreditCard) {
                    if (formData.billingEmail !== formData.billingEmailConfirm) {
                        setValidationError("請求先のメールアドレスが一致しません。");
                        return;
                    }
                    if (!formData.billingName || !formData.billingEmail || !formData.billingPhone) {
                        setValidationError("請求先情報の必須項目（名、メール、電話番号）を入力してください。");
                        return;
                    }
                }
                
                if (!agreedToTerms) {
                    setValidationError("利用規約への同意が必要です。");
                    return;
                }

                setIsSubmitting(true);
                setSubmitStatus(null);
                setValidationError('');

                try {
                    let processingData = JSON.parse(JSON.stringify(formData));

                    // 電話番号の正規化（代表者・請求先）
                    if (processingData.phone) {
                        processingData.phone = normalizePhoneNumber(processingData.phone);
                    }
                    if (processingData.billingPhone) {
                        processingData.billingPhone = normalizePhoneNumber(processingData.billingPhone);
                    }

                    // クレジット決済の場合の請求先情報補完
                    if (useCreditCard) {
                        processingData.isBillingDifferent = true;
                        processingData.billingName = 'クレジット決済';
                        // 必須項目を埋めるために利用者の情報をコピー（データとしては保持）
                        processingData.billingEmail = processingData.email;
                        processingData.billingPhone = processingData.phone;
                        processingData.billingDepartment = '';
                    }

                    if (processingData.plan === 'corporate') {
                        const mainEmailLocalPart = processingData.email.split('@')[0];
                        
                        processingData.additionalMembers = processingData.additionalMembers.map((member, index) => {
                            let newMember = { ...member };
                            const suffix = index + 1;

                            if (!newMember.lastName) {
                                newMember.lastName = processingData.companyName;
                            }
                            if (!newMember.firstName) {
                                newMember.firstName = String(suffix);
                            }

                            if (!newMember.email) {
                                newMember.email = `${mainEmailLocalPart}${suffix}@mailinator.com`;
                            }

                            // 追加メンバーの電話番号も正規化
                            if (newMember.phone) {
                                newMember.phone = normalizePhoneNumber(newMember.phone);
                            } else {
                                newMember.phone = processingData.phone;
                            }
                            
                            return newMember;
                        });
                    } else {
                        processingData.additionalMembers = [];
                    }

                    const { emailConfirm, billingEmailConfirm, isBillingDifferent, ...baseData } = processingData;
                    const fullName = `${baseData.lastName} ${baseData.firstName}`;
                    
                    const finalAdditionalMembers = baseData.plan === 'corporate' 
                        ? baseData.additionalMembers 
                        : [];

                    const finalData = {
                        ...baseData,
                        additionalMembers: finalAdditionalMembers,
                        billingName: isBillingDifferent ? baseData.billingName : fullName,
                        billingDepartment: isBillingDifferent ? baseData.billingDepartment : baseData.department,
                        billingEmail: isBillingDifferent ? baseData.billingEmail : baseData.email,
                        billingPhone: isBillingDifferent ? baseData.billingPhone : baseData.phone,
                        isBillingDifferent,
                        useCreditCard, // フラグ保存
                        categoryCode: 'C00',
                        userId: user.uid,
                        createdAt: serverTimestamp(),
                        status: 'pending'
                    };

                    const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    setFinalDataForPdf({ ...finalData, fullName, applicationDate: today });

                    let subject = "【政策リサーチ】利用お申し込みありがとうございます";
                    let body = `${finalData.companyName}\n${finalData.department || ''}\n${resolveFullName(finalData)} 様\n\nこの度は、「政策リサーチ」にお申し込みいただき、誠にありがとうございます。\n以下の内容で承りました。\n\nプラン: ${getOfficialPlanName(finalData.plan, finalData.paymentCycle, finalData.useCreditCard)}\n金額: ${getFormattedPrice(finalData.plan, finalData.paymentCycle)}\n\nシステムへの登録完了後に、改めてアカウント有効通知のメールが送信されますので、パスワードを設定の上ご利用ください。\n\n--------------------------------------------------\n一般社団法人日本みらい研\n--------------------------------------------------`;

                    try {
                        const templateDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mail_templates', 'registration'));
                        if (templateDoc.exists()) {
                            const template = templateDoc.data();
                            subject = template.subject || subject;
                            let templateBody = template.body || body;
                            
                            body = templateBody
                                .replace(/{{companyName}}/g, finalData.companyName || '')
                                .replace(/{{department}}/g, finalData.department || '')
                                .replace(/{{name}}/g, resolveFullName(finalData))
                                .replace(/{{plan}}/g, getOfficialPlanName(finalData.plan, finalData.paymentCycle, finalData.useCreditCard) || '')
                                .replace(/{{price}}/g, getFormattedPrice(finalData.plan, finalData.paymentCycle) || '');
                        }
                    } catch (e) {
                        console.warn("Template fetch failed, using default.");
                    }

                    // --- GASへのデータ送信処理 ---
                    const gasFormData = new URLSearchParams();
                    gasFormData.append('companyName', finalData.companyName || '');
                    gasFormData.append('lastName', finalData.lastName || '');
                    gasFormData.append('firstName', finalData.firstName || '');
                    gasFormData.append('email', finalData.email);
                    gasFormData.append('cc', 'seisaku@rifj.jp');
                    gasFormData.append('subject', subject);
                    gasFormData.append('message', body);

                    try {
                        await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: gasFormData
                        });
                    } catch (gasError) {
                        console.error("GAS Email Trigger Error:", gasError);
                    }

                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'registrations'), finalData);
                    
                    try {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mail'), {
                            to: [formData.email], 
                            cc: ['seisaku@rifj.jp'], 
                            message: {
                                subject: subject,
                                text: body
                            },
                            delivery: {
                                state: 'SUCCESS', // GASで送信したのでSUCCESS扱いにする
                                startTime: serverTimestamp()
                            },
                            metadata: {
                                registrationId: docRef.id,
                                method: 'GAS_WEBHOOK'
                            }
                        });
                    } catch (mailError) {
                        console.error("Firebase Mail Log Error:", mailError);
                        showMessage("送信エラー", "登録は完了しましたが、自動返信メールの送信履歴作成に失敗しました。\n管理者にお問い合わせください。\nエラー: " + mailError.message, 'error');
                    }

                    setSubmitStatus('success');
                    setAgreedToTerms(false);
                    window.scrollTo(0, 0);
                } catch (error) {
                    console.error("Error adding document: ", error);
                    setSubmitStatus('error');
                    showMessage("システムエラー", "登録処理中にエラーが発生しました。\nもう一度お試しください。", 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="max-w-3xl mx-auto relative">
                    <PdfPage1 ref={pdfRef1} data={finalDataForPdf} />
                    <PdfPage2 ref={pdfRef2} />
                    {messageModal.isOpen && (
                        <MessageModal
                            isOpen={true}
                            onClose={() => setMessageModal(prev => ({ ...prev, isOpen: false }))}
                            title={messageModal.title}
                            message={messageModal.message}
                            type={messageModal.type}
                        />
                    )}
                    
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-6 bg-indigo-50 border-b border-indigo-100">
                            <h2 className="text-xl font-bold text-indigo-900">利用申し込み</h2>
                            <p className="text-indigo-700 text-sm mt-1">こちらは政策リサーチのご利用申し込みフォームです。</p>
                        </div>
                        {submitStatus === 'success' ? (
                            <div className="p-6 space-y-8 animate-fade-in">
                                <div className="bg-green-50 border border-green-200 text-green-700 p-4 rounded-lg">
                                    <div className="flex items-start gap-3">
                                        <CheckCircle className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                        <div>
                                            <p className="font-bold">申し込みを受け付けました！</p>
                                            <p className="text-sm mt-1">ご入力いただいたメールアドレス宛に、自動確認メールを送信しました。</p>
                                        </div>
                                    </div>
                                    {(finalDataForPdf?.plan === 'corporate' || finalDataForPdf?.plan === 'personal') && (
                                        <div className="mt-4 pt-4 border-t border-green-200 space-y-3">
                                            <p className="text-sm text-green-800 font-bold">登録情報をPDFでダウンロードできます。必要のない場合は終了ボタンを押して下さい。</p>
                                            <div className="flex flex-wrap gap-3">
                                                <button type="button" onClick={generatePDF} className="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm font-bold">
                                                    <FileDown size={18} />
                                                    登録情報をPDFで保存
                                                </button>
                                                <button type="button" onClick={handleFinish} className="bg-white border border-green-700 text-green-700 hover:bg-green-50 px-4 py-2 rounded-lg shadow-sm flex items-center gap-2 transition-colors text-sm font-bold">
                                                    <LogOut size={18} />
                                                    終了（トップへ戻る）
                                                </button>
                                            </div>
                                        </div>
                                    )}

        // --- Component: Admin Dashboard ---
        function AdminDashboard({ user }) {
            const [registrations, setRegistrations] = useState([]);
            const [mails, setMails] = useState([]);
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [loading, setLoading] = useState(true);
            const [editingMember, setEditingMember] = useState(null);
            const [deleteConfirmationItem, setDeleteConfirmationItem] = useState(null);
            const [currentView, setCurrentView] = useState('list');
            
            const [sendingMailData, setSendingMailData] = useState(null);
            const [resendTargetReg, setResendTargetReg] = useState(null);
            const [statusDetailMail, setStatusDetailMail] = useState(null);
            const [messageModal, setMessageModal] = useState({ isOpen: false, title: '', message: '', type: 'info' });

            const [pdfData, setPdfData] = useState(null);
            const [isPdfGenerating, setIsPdfGenerating] = useState(false);
            const pdfRef1 = useRef(null);
            const pdfRef2 = useRef(null);

            const showMessage = (title, message, type = 'info') => {
                setMessageModal({ isOpen: true, title, message, type });
            };

            const closeMessageModal = () => {
                setMessageModal(prev => ({ ...prev, isOpen: false }));
            };

            useEffect(() => {
                if (!user) return;
                
                const qReg = query(collectionGroup(db, 'registrations'));
                const unsubReg = onSnapshot(qReg, (snapshot) => {
                    const data = snapshot.docs.map(doc => {
                        const d = doc.data();
                        return {
                            id: doc.id,
                            ...d,
                            createdAtDate: d.createdAt?.toDate() || new Date(),
                            applicationDate: d.createdAt?.toDate().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }) || '',
                            refPath: doc.ref.path 
                        };
                    });
                    data.sort((a, b) => b.createdAtDate - a.createdAtDate);
                    setRegistrations(data);
                    setLoading(false);
                }, (error) => {
                    console.error("Error fetching registrations:", error);
                    setLoading(false);
                });

                const qMail = query(collection(db, 'artifacts', appId, 'public', 'data', 'mail'), orderBy('delivery.startTime', 'desc')); 
                const unsubMail = onSnapshot(qMail, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setMails(data);
                }, (error) => {
                    console.warn("Error fetching mails:", error);
                });

                return () => {
                    unsubReg();
                    unsubMail();
                };
            }, [user]);

            const registrationsWithMailStatus = useMemo(() => {
                const mailByRegId = new Map();
                const mailByEmail = new Map();

                for (const mail of mails) {
                    const regId = mail.metadata?.registrationId;
                    if (regId && !mailByRegId.has(regId)) {
                        mailByRegId.set(regId, mail);
                    }
                    
                    const toAddress = Array.isArray(mail.to) ? mail.to[0] : mail.to;
                    if (toAddress && !mailByEmail.has(toAddress)) {
                        mailByEmail.set(toAddress, mail);
                    }
                }

                const regWithMails = registrations.map(reg => {
                    const mailLog = mailByRegId.get(reg.id) || mailByEmail.get(reg.email);
                    return {
                        ...reg,
                        mailStatus: mailLog?.delivery?.state || 'MISSING', 
                        mailError: mailLog?.delivery?.error || null,
                        mailDocId: mailLog?.id,
                        mailSubject: mailLog?.message?.subject
                    };
                });

                return regWithMails.sort((a, b) => b.createdAtDate - a.createdAtDate);
            }, [registrations, mails]);

            const toggleSelectAll = () => {
                if (selectedIds.size === registrationsWithMailStatus.length) {
                    setSelectedIds(new Set());
                } else {
                    setSelectedIds(new Set(registrationsWithMailStatus.map(r => r.id)));
                }
            };

            const toggleSelect = (id) => {
                const newSelected = new Set(selectedIds);
                if (newSelected.has(id)) {
                    newSelected.delete(id);
                } else {
                    newSelected.add(id);
                }
                setSelectedIds(newSelected);
            };

            const getTargetData = () => {
                if (selectedIds.size > 0) {
                    return registrationsWithMailStatus.filter(r => selectedIds.has(r.id));
                }
                return registrationsWithMailStatus;
            };
            
            const generateBulkPDF = async () => {
                const targets = getTargetData();
                if (targets.length === 0) {
                    showMessage("通知", "PDFを出力するデータを選択してください。", 'info');
                    return;
                }

                if (!window.jspdf || !window.html2canvas) {
                    showMessage("準備中", "PDF生成ライブラリを読み込み中です。少々お待ちください。", 'info');
                    return;
                }

                setIsPdfGenerating(true);

                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const scale = 4;
                    const imageFormat = 'image/jpeg';
                    const imageQuality = 0.95;

                    for (let i = 0; i < targets.length; i++) {
                        const data = targets[i];
                        setPdfData(data);
                        await new Promise(resolve => setTimeout(resolve, 100));

                        if (pdfRef1.current) {
                            pdfRef1.current.style.display = 'block';
                            const sections = pdfRef1.current.querySelectorAll('.pdf-section');
                            let currentY = 0;
                            
                            if (i > 0) {
                                pdf.addPage();
                            }

                            for (let j = 0; j < sections.length; j++) {
                                const section = sections[j];
                                const canvas = await window.html2canvas(section, { scale, useCORS: true });
                                const imgData = canvas.toDataURL(imageFormat, imageQuality);
                                const imgProps = pdf.getImageProperties(imgData);
                                const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;

                                if (currentY + imgHeight > pdfHeight) {
                                    pdf.addPage();
                                    currentY = 0;
                                }
                                
                                pdf.addImage(imgData, 'JPEG', 0, currentY, pdfWidth, imgHeight);
                                currentY += imgHeight;
                            }
                            pdfRef1.current.style.display = 'none';
                        }

                        if (pdfRef2.current) {
                            pdf.addPage();
                            pdfRef2.current.style.display = 'block';
                            const canvas2 = await window.html2canvas(pdfRef2.current, { scale, useCORS: true });
                            pdfRef2.current.style.display = 'none';
                            const imgData2 = canvas2.toDataURL(imageFormat, imageQuality);
                            const imgProps2 = pdf.getImageProperties(imgData2);
                            const imgHeight2 = (imgProps2.height * pdfWidth) / imgProps2.width;
                            if (imgHeight2 > pdfHeight) {
                                pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                            } else {
                                pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, imgHeight2);
                            }
                        }
                    }
                    
                    const filename = targets.length === 1 
                        ? `${targets[0].companyName}_${targets[0].fullName}_申込書.pdf` 
                        : `政策リサーチ申込書一括出力_${new Date().toISOString().slice(0,10)}.pdf`;
                        
                    pdf.save(filename);

                } catch (e) {
                    console.error("PDF generation error:", e);
                    showMessage("エラー", "PDF生成中にエラーが発生しました。\n" + e.message, 'error');
                } finally {
                    setIsPdfGenerating(false);
                    setPdfData(null);
                }
            };

            const handleDeleteClick = (item) => {
                setDeleteConfirmationItem(item);
            };

            const confirmDelete = async () => {
                if (!deleteConfirmationItem) return;
                try {
                    await deleteDoc(doc(db, deleteConfirmationItem.refPath)); 
                    setDeleteConfirmationItem(null);
                } catch (e) {
                    console.error("Delete failed:", e);
                    showMessage("エラー", "削除に失敗しました: " + e.message, 'error');
                }
            };

            const handleUpdate = async (id, newData) => {
                const targetItem = registrations.find(r => r.id === id);
                if (!targetItem) return;

                try {
                    const updateData = { ...newData };
                    delete updateData.id;
                    delete updateData.createdAtDate;
                    delete updateData.applicationDate;
                    delete updateData.refPath;
                    delete updateData.mailStatus;
                    delete updateData.mailError;
                    delete updateData.mailDocId;
                    delete updateData.mailSubject;

                    if (updateData.lastName && updateData.firstName) {
                        updateData.fullName = `${updateData.lastName} ${updateData.firstName}`;
                    }
                    await updateDoc(doc(db, targetItem.refPath), updateData);
                    setEditingMember(null);
                } catch (e) {
                    console.error("Update failed:", e);
                    showMessage("エラー", "更新に失敗しました: " + e.message, 'error');
                }
            };

            const handlePrepareResendEmail = async (regData) => {
                const currentResendCount = regData.resendCount || 0;
                if (currentResendCount >= 3) {
                    showMessage("送信制限", "再送信の限度（3回）に達しました。これ以上は送信できません。", 'error');
                    return;
                }

                try {
                    let subject = "【政策リサーチ】利用お申し込みありがとうございます";
                    let body = ""; 

                    const templateDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mail_templates', 'registration'));
                    if (templateDoc.exists()) {
                        const template = templateDoc.data();
                        subject = template.subject || subject;
                        body = template.body;
                    } else {
                        body = `${regData.companyName}\n${regData.department || ''}\n${resolveFullName(regData)} 様\n\nこの度は、「政策リサーチ」にお申し込みいただき、誠にありがとうございます。\n以下の内容で承りました。\n\nプラン: ${getOfficialPlanName(regData.plan, regData.paymentCycle)}\n金額: ${getFormattedPrice(regData.plan, regData.paymentCycle)}\n\nシステムへの登録完了後に、改めてアカウント有効通知のメールが送信されますので、パスワードを設定の上ご利用ください。\n\n--------------------------------------------------\n一般社団法人日本みらい研\n--------------------------------------------------`;
                    }

                    const finalBody = body
                        .replace(/{{companyName}}/g, regData.companyName || '')
                        .replace(/{{department}}/g, regData.department || '')
                        .replace(/{{name}}/g, resolveFullName(regData))
                        .replace(/{{plan}}/g, getOfficialPlanName(regData.plan, regData.paymentCycle) || '')
                        .replace(/{{price}}/g, getFormattedPrice(regData.plan, regData.paymentCycle) || '');

                    setResendTargetReg(regData);
                    setSendingMailData({
                        to: [regData.email],
                        cc: ['seisaku@rifj.jp'],
                        subject: subject,
                        body: finalBody,
                        currentResendCount: currentResendCount
                    });

                } catch (e) {
                    console.error("Template fetch failed:", e);
                    showMessage("エラー", "メールテンプレートの読み込みに失敗しました。: " + e.message, 'error');
                }
            };

            const handleConfirmResendEmail = async (mailData) => {
                if (!resendTargetReg) return;

                const currentResendCount = resendTargetReg.resendCount || 0;
                const maxResendCount = 3;
                
                if (currentResendCount >= maxResendCount) {
                    showMessage("送信制限", "再送信の限度に達しました。", 'error');
                    setSendingMailData(null);
                    setResendTargetReg(null);
                    return;
                }

                try {
                    const toList = typeof mailData.to === 'string' 
                        ? mailData.to.split(',').map(s => s.trim()).filter(s => s !== '') 
                        : mailData.to;
                    const ccList = typeof mailData.cc === 'string' 
                        ? mailData.cc.split(',').map(s => s.trim()).filter(s => s !== '') 
                        : mailData.cc;

                    if (toList.length === 0) {
                        showMessage("入力エラー", "宛先(To)を入力してください。", 'error');
                        return; 
                    }

                    // --- GASへのデータ送信処理 ---
                    const gasFormData = new URLSearchParams();
                    gasFormData.append('companyName', resendTargetReg.companyName || '');
                    gasFormData.append('lastName', resendTargetReg.lastName || '');
                    gasFormData.append('firstName', resendTargetReg.firstName || '');
                    gasFormData.append('email', toList.join(','));
                    gasFormData.append('cc', ccList.join(','));
                    gasFormData.append('subject', mailData.subject);
                    gasFormData.append('message', mailData.body);

                    try {
                        await fetch(GAS_WEB_APP_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: gasFormData
                        });
                    } catch (gasError) {
                        console.error("GAS Email Trigger Error:", gasError);
                    }

                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mail'), {
                        to: toList,
                        cc: ccList,
                        message: {
                            subject: mailData.subject,
                            text: mailData.body
                        },
                        delivery: {
                            state: 'SUCCESS', // GASで送信したのでSUCCESS扱いにする
                            startTime: serverTimestamp()
                        },
                        metadata: {
                            registrationId: resendTargetReg.id,
                            resend: true,
                            method: 'GAS_WEBHOOK'
                        }
                    });

                    const newCount = currentResendCount + 1;
                    const remainingCount = maxResendCount - newCount;
                    
                    await updateDoc(doc(db, resendTargetReg.refPath), {
                        resendCount: newCount
                    });

                    setSendingMailData(null);
                    setResendTargetReg(null);

                    setTimeout(() => {
                        showMessage("送信完了", `送信が正常に完了しました。\n\n現在の送信回数: ${newCount}/${maxResendCount}\n残り送信可能回数: ${remainingCount}回`, 'success');
                    }, 100);

                } catch (e) {
                    console.error("Resend failed:", e);
                    setSendingMailData(null);
                    setResendTargetReg(null);
                    showMessage("送信エラー", "再送信リクエストの作成に失敗しました:\n" + e.message, 'error');
                }
            };

            const generateCSV = (headers, rows, filename) => {
                const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a'); link.href = url; link.setAttribute('download', filename); document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const downloadMemberCSV = () => {
                const targetData = getTargetData();
                if (targetData.length === 0) { showMessage("通知", "データがありません。", 'info'); return; }
                const headers = ["区分", "会社名", "部署", "姓", "名", "役職", "プラン", "メールアドレス", "電話番号", "郵便番号", "住所1", "住所2", "請求先名", "請求先部署", "請求先メール", "請求先電話", "備考", "登録日時"];
                const rows = targetData.map(reg => [
                    `"${reg.categoryCode || 'C00'}"`, `"${reg.companyName || ''}"`, `"${reg.department || ''}"`, `"${reg.lastName || ''}"`, `"${reg.firstName || ''}"`, `"${reg.position || ''}"`,
                    `"${getOfficialPlanName(reg.plan, reg.paymentCycle, reg.useCreditCard)}"`, `"${reg.email}"`, `"${reg.phone}"`, `"${reg.postalCode || ''}"`, `"${reg.address}"`, `"${reg.address2 || ''}"`,
                    `"${reg.billingName || ''}"`, `"${reg.billingDepartment || ''}"`, `"${reg.billingEmail || ''}"`, `"${reg.billingPhone || ''}"`, `"${(reg.notes || '').replace(/\n/g, ' ')}"`,
                    reg.createdAtDate.toLocaleString('ja-JP')
                ]);
                generateCSV(headers, rows, `政策リサーチ会員リスト_${new Date().toISOString().slice(0, 10)}.csv`);
            };

            const downloadBillingCSV = () => {
                const targetData = getTargetData();
                if (targetData.length === 0) { showMessage("通知", "データがありません。", 'info'); return; }
                const headers = ["区分", "請求先名", "請求先部署", "請求先メール", "請求先電話", "プラン", "金額(円)", "登録日時"];
                const rows = targetData.map(reg => [
                    `"${reg.categoryCode || 'C00'}"`, `"${reg.billingName || ''}"`, `"${reg.billingDepartment || ''}"`, `"${reg.billingEmail || ''}"`, `"${reg.billingPhone || ''}"`,
                    `"${getOfficialPlanName(reg.plan, reg.paymentCycle, reg.useCreditCard)}"`, `"${getFormattedPrice(reg.plan, reg.paymentCycle)}"`, reg.createdAtDate.toLocaleString('ja-JP')
                ]);
                generateCSV(headers, rows, `政策リサーチ請求先リスト_${new Date().toISOString().slice(0, 10)}.csv`);
            };

            const downloadRegistrationCSV = () => {
                const targetData = getTargetData();
                if (targetData.length === 0) { showMessage("通知", "データがありません。", 'info'); return; }
                const headers = ["メールアドレス", "姓", "名", "携帯電話番号", "自宅電話番号", "会社名", "会社電話番号", "郵便番号", "国", "都道府県", "市町村", "番地", "ビル名", "区分", "プラン"];
                
                const rows = [];
                targetData.forEach(reg => {
                    const address = reg.address || '';
                    let prefecture = ''; let city = '';
                    const prefMatch = address.match(/^(.{2,3}[都道府県])(.*)/);
                    if (prefMatch) { prefecture = prefMatch[1]; city = prefMatch[2]; } else { city = address; }
                    
                    // 代表者
                    rows.push([
                        `"${reg.email}"`, `"${reg.lastName || ''}"`, `"${reg.firstName || ''}"`, `"${reg.phone}"`, `""`, `"${reg.companyName || ''}"`, `""`, `"${reg.postalCode || ''}"`, `"日本"`, `"${prefecture}"`, `"${city}"`, `""`, `"${reg.address2 || ''}"`, `"${reg.categoryCode || 'C00'}"`, `"${getOfficialPlanName(reg.plan, reg.paymentCycle, reg.useCreditCard)}"`
                    ]);

                    // 追加メンバー
                    if (reg.plan === 'corporate' && reg.additionalMembers) {
                        reg.additionalMembers.forEach(mem => {
                            if (mem.lastName || mem.email) {
                                rows.push([
                                    `"${mem.email}"`, `"${mem.lastName || ''}"`, `"${mem.firstName || ''}"`, `"${mem.phone}"`, `""`, `"${reg.companyName || ''}"`, `""`, `"${reg.postalCode || ''}"`, `"日本"`, `"${prefecture}"`, `"${city}"`, `""`, `"${reg.address2 || ''}"`, `"${reg.categoryCode || 'C00'}"`, `"${getOfficialPlanName(reg.plan, reg.paymentCycle, reg.useCreditCard)}"`
                                ]);
                            }
                        });
                    }
                });
                
                generateCSV(headers, rows, `政策リサーチ登録用リスト_${new Date().toISOString().slice(0, 10)}.csv`);
            };

            if (loading) {
                return <div className="text-center py-10 text-slate-500">データを読み込み中...</div>;
            }

            return (
                <div className="space-y-6">
                    {/* Invisible PDF Components for Admin generation */}
                    <PdfPage1 ref={pdfRef1} data={pdfData} />
                    <PdfPage2 ref={pdfRef2} />

                    {editingMember && (
                        <EditMemberModal
                            member={editingMember}
                            onClose={() => setEditingMember(null)}
                            onUpdate={handleUpdate}
                        />
                    )}
                    {deleteConfirmationItem && (
                        <ConfirmModal
                            isOpen={true}
                            title="削除の確認"
                            message="本当にこのデータを削除しますか？この操作は取り消せません。"
                            confirmText="削除する"
                            isDanger={true}
                            onConfirm={confirmDelete}
                            onCancel={() => setDeleteConfirmationItem(null)}
                        />
                    )}
                    {sendingMailData && (
                        <SendMailModal
                            isOpen={true}
                            initialData={sendingMailData}
                            onClose={() => { setSendingMailData(null); setResendTargetReg(null); }}
                            onSend={handleConfirmResendEmail}
                        />
                    )}
                    {statusDetailMail && (
                        <MailStatusModal
                            isOpen={true}
                            mailData={statusDetailMail}
                            onClose={() => setStatusDetailMail(null)}
                        />
                    )}
                    {messageModal.isOpen && (
                        <MessageModal
                            isOpen={true}
                            onClose={closeMessageModal}
                            title={messageModal.title}
                            message={messageModal.message}
                            type={messageModal.type}
                        />
                    )}
                    
                    {/* Admin Nav */}
                    <div className="bg-white p-2 rounded-lg shadow-sm border border-slate-200 inline-flex gap-1 mb-2">
                        <button 
                            onClick={() => setCurrentView('list')}
                            className={`px-4 py-2 rounded-md text-sm font-bold transition-colors flex items-center gap-2 ${currentView === 'list' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}
                        >
                            <List size={18} />
                            申し込み一覧
                        </button>
                        <button 
                            onClick={() => setCurrentView('mail')}
                            className={`px-4 py-2 rounded-md text-sm font-bold transition-colors flex items-center gap-2 ${currentView === 'mail' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}
                        >
                            <Settings size={18} />
                            メール設定
                        </button>
                    </div>

                    {currentView === 'list' && (
                        <>
                            <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                                <div>
                                    <h2 className="text-xl font-bold text-slate-800">申し込み一覧</h2>
                                    <p className="text-slate-500 text-sm">
                                        {selectedIds.size > 0 ?
                                            <span className="text-indigo-600 font-bold">{selectedIds.size} 件選択中</span> : 
                                            `全 ${registrationsWithMailStatus.length} 件`}
                                    </p>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    <button onClick={generateBulkPDF} disabled={isPdfGenerating} className={`bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm ${isPdfGenerating ? 'opacity-50 cursor-not-allowed' : ''}`}>
                                        {isPdfGenerating ? <RefreshCw className="animate-spin" size={16} /> : <Printer size={16} />}
                                        <span>PDF一括出力</span>
                                    </button>
                                    <button onClick={downloadMemberCSV} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm"><FileSpreadsheet size={16} /><span>会員リスト出力</span></button>
                                    <button onClick={downloadBillingCSV} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm"><Receipt size={16} /><span>請求先リスト出力</span></button>
                                    <button onClick={downloadRegistrationCSV} className="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm"><UserPlus size={16} /><span>システム登録用出力</span></button>
                                </div>
                            </div>
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse whitespace-nowrap">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm uppercase tracking-wider">
                                                <th className="p-4 w-10">
                                                    <button onClick={toggleSelectAll} className="flex items-center text-slate-400 hover:text-slate-600">
                                                        {registrationsWithMailStatus.length > 0 && selectedIds.size === registrationsWithMailStatus.length ? <CheckSquare size={20} className="text-indigo-600" /> : <Square size={20} />}
                                                    </button>
                                                </th>
                                                <th className="p-4 font-semibold">操作</th>
                                                <th className="p-4 font-semibold text-center">メール</th>
                                                <th className="p-4 font-semibold">日時</th>
                                                <th className="p-4 font-semibold">区分</th>
                                                <th className="p-4 font-semibold">会社・部署</th>
                                                <th className="p-4 font-semibold">氏名・役職</th>
                                                <th className="p-4 font-semibold">プラン</th>
                                                <th className="p-4 font-semibold">連絡先(メール/電話)</th>
                                                <th className="p-4 font-semibold border-l border-slate-100 bg-slate-50/50">請求先情報</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {registrationsWithMailStatus.length === 0 ? (
                                                <tr>
                                                    <td colSpan="10" className="p-8 text-center text-slate-400">まだ登録データがありません。「申し込み」タブから登録してください。</td>
                                                </tr>
                                            ) : (
                                                registrationsWithMailStatus.map((reg) => (
                                                    <tr key={reg.id} className={`hover:bg-indigo-50/30 transition-colors ${selectedIds.has(reg.id) ? 'bg-indigo-50/50' : ''} ${reg.useCreditCard ? 'text-red-600' : ''}`}>
                                                        <td className="p-4">
                                                            <button onClick={() => toggleSelect(reg.id)} className="flex items-center text-slate-400 hover:text-slate-600">
                                                                {selectedIds.has(reg.id) ? <CheckSquare size={20} className="text-indigo-600" /> : <Square size={20} />}
                                                            </button>
                                                        </td>
                                                        <td className="p-4">
                                                            <div className="flex items-center gap-2">
                                                                <button onClick={() => setEditingMember(reg)} className="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded border border-indigo-200 hover:border-indigo-400 transition-colors" title="編集"><Edit size={16} /></button>
                                                                <button onClick={() => handleDeleteClick(reg)} className="p-1.5 text-red-600 hover:bg-red-50 rounded border border-red-200 hover:border-red-400 transition-colors" title="削除"><Trash2 size={16} /></button>
                                                            </div>
                                                        </td>
                                                        <td className="p-4 text-center">
                                                            <div className="flex flex-row items-center justify-center gap-3">
                                                                <button 
                                                                    onClick={() => setStatusDetailMail(reg)}
                                                                    className="hover:opacity-70 transition-opacity"
                                                                >
                                                                    {reg.mailStatus === 'SUCCESS' && <span className="text-green-600" title="送信成功"><CheckCircle size={20} /></span>}
                                                                    {reg.mailStatus === 'ERROR' && <span className="text-red-500" title={`送信エラー: ${reg.mailError || '詳細不明'}`}><MailWarning size={20} /></span>}
                                                                    {(reg.mailStatus === 'PENDING' || reg.mailStatus === 'PROCESSING') && <span className="text-amber-500 animate-pulse" title="送信処理中..."><RefreshCw size={20} /></span>}
                                                                    {reg.mailStatus === 'MISSING' && <span className="text-slate-300" title="送信記録なし"><Eye size={20} /></span>}
                                                                </button>
                                                                
                                                                <button 
                                                                    onClick={() => handlePrepareResendEmail(reg)}
                                                                    className={`text-xs px-2 py-1 rounded border transition-colors flex items-center gap-1 ${reg.mailStatus === 'SUCCESS' ? 'text-slate-400 border-slate-200 hover:bg-slate-50' : 'text-indigo-600 border-indigo-200 bg-indigo-50 hover:bg-indigo-100 font-bold'}`}
                                                                    title="再送信"
                                                                >
                                                                    <Send size={12} />
                                                                    再送信
                                                                </button>
                                                            </div>
                                                        </td>
                                                        <td className="p-4 text-sm">
                                                            {reg.createdAtDate.toLocaleDateString('ja-JP')}
                                                            <div className="text-xs opacity-70">{reg.createdAtDate.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}</div>
                                                        </td>
                                                        <td className="p-4 text-sm">
                                                            <span className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">{reg.categoryCode || 'C00'}</span>
                                                        </td>
                                                        <td className="p-4 text-sm">
                                                            <div className="font-bold">{reg.companyName}</div>
                                                            <div className="opacity-70 text-xs">{reg.department || '-'}</div>
                                                        </td>
                                                        <td className="p-4 text-sm">
                                                            <div className="font-medium">{resolveFullName(reg)}</div>
                                                            {reg.position && <div className="text-xs opacity-70">{reg.position}</div>}
                                                        </td>
                                                        <td className="p-4">
                                                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${reg.plan === 'corporate' ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : reg.plan === 'personal' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-700 border-slate-200'}`}>
                                                                {getOfficialPlanName(reg.plan, reg.paymentCycle, reg.useCreditCard)}
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-sm">
                                                            <div className="font-mono text-xs truncate max-w-[200px]" title={reg.email}>{reg.email}</div>
                                                            <div className="text-xs opacity-70 mt-0.5">{reg.phone || '-'}</div>
                                                        </td>
                                                        <td className="p-4 text-sm border-l border-slate-100 bg-slate-50/30">
                                                            <div className="font-medium truncate max-w-[150px]" title={reg.billingName}>{reg.billingName || '-'}</div>
                                                            {!reg.useCreditCard && (
                                                                <>
                                                                    <div className="text-xs opacity-70 truncate max-w-[150px]" title={reg.billingDepartment}>{reg.billingDepartment}</div>
                                                                    <div className="text-xs opacity-70 mt-1">{reg.billingPhone}</div>
                                                                </>
                                                            )}
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </>
                    )}

                    {currentView === 'mail' && (
                        <MailTemplateEditor />
                    )}
                </div>
            );
        }

        // --- App Component ---
        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('form'); // デフォルトを申し込み画面に変更
            const [authError, setAuthError] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        console.error("Auth error:", error);
                        setAuthError(error.message);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            if (authError) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border-l-4 border-red-500">
                            <div className="flex items-center gap-3 mb-4 text-red-600">
                                <AlertTriangle size={32} />
                                <h2 className="text-xl font-bold">システムエラー</h2>
                            </div>
                            <p className="text-gray-700 mb-4">データベースへの接続に失敗しました。</p>
                            <div className="bg-slate-100 p-3 rounded text-xs font-mono text-slate-600 mb-4 overflow-x-auto">{authError}</div>
                            <p className="text-sm text-gray-500">
                                管理者の方へ: Firebaseコンソールで <strong>Authentication</strong> の設定を確認してください。
                                <strong>匿名ログイン(Anonymous Auth)</strong> が有効になっている必要があります。
                            </p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 text-gray-600">
                        <div className="flex flex-col items-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
                            <p>システムを読み込み中...</p>
                        </div>
                    </div>
                );
            }

            // 管理者画面の場合のみパスワード認証を要求
            if (activeTab === 'admin' && !isAuthenticated) {
                return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
            }

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">
                    <header className="bg-indigo-800 text-white shadow-lg print:hidden">
                        <div className="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-2">
                                <Shield className="w-8 h-8 text-indigo-200" />
                                <h1 className="text-xl font-bold tracking-wide">
                                    {activeTab === 'admin' ? '政策リサーチ管理者画面' : '政策リサーチ申込画面'}
                                </h1>
                            </div>
                            <div className="flex bg-indigo-900/50 rounded-lg p-1">
                                <button 
                                    onClick={() => setActiveTab('admin')}
                                    className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'admin' ? 'bg-white text-indigo-800 shadow-sm' : 'text-indigo-200 hover:text-white'}`}
                                >
                                    <div className="flex items-center gap-2">
                                        <List size={16} />
                                        <span>管理者</span>
                                    </div>
                                </button>
                                <button 
                                    onClick={() => setActiveTab('form')}
                                    className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${activeTab === 'form' ? 'bg-white text-indigo-800 shadow-sm' : 'text-indigo-200 hover:text-white'}`}
                                >
                                    <div className="flex items-center gap-2">
                                        <User size={16} />
                                        <span>申し込み</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </header>
                    <main className="max-w-5xl mx-auto px-4 py-8 w-full flex-grow">
                        {activeTab === 'form' ? <RegistrationForm user={user} /> : <AdminDashboard user={user} />}
                    </main>
                    <footer className="bg-slate-100 border-t border-slate-200 print:hidden">
                        <div className="max-w-5xl mx-auto px-4 py-8 flex flex-col items-center gap-4">
                            <CorporateFooter />
                            <div className="text-xs flex items-center justify-center gap-2 text-slate-400">
                                <span>© 2025 Policy Research Portal. Secure Data System.</span>
                                <span className="text-slate-300">|</span>
                                <a 
                                    href="https://www.rifj.jp/privacypolicy/" 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="hover:text-indigo-800 hover:underline transition-colors flex items-center gap-1"
                                >
                                    プライバシーポリシーについて
                                    <span className="text-xs">↗</span>
                                </a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
