<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政策リサーチ 申込フォーム</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel Standalone (JSXを実行するために必要) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out forwards;
        }

        /* 印刷時のスタイル調整 */
        @media print {
            header, footer, button, .no-print { 
                display: none !important; 
            }
            body { 
                background: white; 
            }
            .print-content {
                display: block !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root">
        <!-- React App Loading Placeholder -->
        <div class="min-h-screen flex items-center justify-center flex-col">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
            <p class="text-slate-500">システムを読み込み中...</p>
        </div>
    </div>

    <!-- React Application Script (BabelでJSXをコンパイル) -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        
        // Lucide Icons
        import { 
            User, FileSpreadsheet, Send, CheckCircle, List, Shield, Download, Mail, 
            Search, FileText, AlertCircle, Building2, Briefcase, CreditCard, Receipt, 
            CheckSquare, Square, UserPlus, FileCode, Edit, Trash2, X, Save, 
            AlertTriangle, FileDown, LogOut, Copy, Settings, Info, History, RefreshCw, MailWarning, Eye, Printer
        } from 'https://esm.sh/lucide-react@0.292.0';

        // Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            collectionGroup, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            getDoc,
            setDoc,
            query, 
            onSnapshot, 
            serverTimestamp, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration & Initialization ---
        const firebaseConfig = {
            apiKey: "AIzaSyAAI4aEAVRFCapIScHIsY7CeldYSA0hXHI",
            authDomain: "member-214a3.firebaseapp.com",
            projectId: "member-214a3",
            storageBucket: "member-214a3.firebasestorage.app",
            messagingSenderId: "596397889206",
            appId: "1:596397889206:web:8be83a3964ee3618a2f817",
            measurementId: "G-35V5LFFHHG"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // データの保存場所ID（新規登録用）
        const appId = "default-app-id";

        // --- Helper Functions ---
        const getOfficialPlanName = (plan, cycle) => {
            if (plan === 'trial') return 'Navi Plus Trial（10日間無料トライアル）';
            if (plan === 'corporate') return cycle === 'yearly' ? 'Navi Plus5（Fプラン5 年払）' : 'Navi Plus5（Fプラン5）';
            if (plan === 'personal') return cycle === 'yearly' ? 'Navi Plus1（Fプラン1 年払）' : 'Navi Plus1（Fプラン1）';
            return plan;
        };

        const getPlanPrice = (plan, cycle) => {
            if (plan === 'trial') return '0';
            if (plan === 'corporate') return cycle === 'yearly' ? '1,200,000' : '100,000';
            if (plan === 'personal') return cycle === 'yearly' ? '360,000' : '30,000';
            return '-';
        };

        // 安全な名前解決を行うヘルパー関数
        const resolveFullName = (data) => {
            // fullNameがあり、かつ空文字でない場合
            if (data.fullName && data.fullName.trim() !== '') {
                return data.fullName;
            }
            // lastName または firstName がある場合
            if (data.lastName || data.firstName) {
                return `${data.lastName || ''} ${data.firstName || ''}`.trim();
            }
            // どちらもない場合のフォールバック
            return 'お客様';
        };

        // --- Shared Components ---
        const CorporateFooter = () => (
            <div className="text-center text-sm text-slate-500 font-medium leading-relaxed">
                <p>一般社団法人日本みらい研 東京都千代田区平河町２−１６−６ jeⅤビル７F</p>
                <p>TEL : 03-5215-6071 ／FAX : 03-5215-6072</p>
                <p>
                    WEB: <a href="https://www.rifj.jp" target="_blank" rel="noopener noreferrer" className="hover:text-indigo-600 hover:underline">www.rifj.jp</a> ／
                    Mail：<a href="mailto:office@rifj.jp" className="hover:text-indigo-600 hover:underline">office@rifj.jp</a>
                </p>
            </div>
        );

        const TermsOfServiceText = () => (
            <div className="text-xs leading-relaxed text-slate-700">
                <h4 className="font-bold text-center mb-4 text-sm">「政策リサーチ」利用規約</h4>
                <p className="font-bold mt-2">第1条（目的）</p>
                <p>本規約は、「一般社団法人日本みらい研」（以下「日本みらい研」と称します）及び「株式会社角川アスキー総合研究所」（以下「角川アスキー総研」と称します）が共同開発した「政策リサーチ」（以下「本サービス」）と称します）の利用について定めるものです。</p>
                {/* 省略 */}
                <p className="font-bold mt-2">第2条（定義）</p>
                <p>本規約に同意のうえ、本規約第5条に基づく利用申込を行い、日本みらい研が承認した方をシステム利用者（以下「利用者」と称します）とします。</p>
                <p className="text-center my-4 text-slate-400">（...利用規約全文...）</p>
                <p className="font-bold mt-2">第20条（裁判管轄）</p>
                <p>日本みらい研および利用者との間で訴訟の必要が生じた場合には、第一審の専属的合意管轄裁判所を東京地方裁判所または東京簡易裁判所とします。</p>
            </div>
        );

        // --- UI Components ---
        
        function MessageModal({ isOpen, onClose, title, message, type = 'info' }) {
            if (!isOpen) return null;
            
            let icon, colorClass, bgClass;
            if (type === 'success') {
                icon = <CheckCircle size={32} className="text-green-600" />;
                bgClass = 'bg-green-50';
            } else if (type === 'error') {
                icon = <AlertTriangle size={32} className="text-red-600" />;
                bgClass = 'bg-red-50';
            } else {
                icon = <Info size={32} className="text-blue-600" />;
                bgClass = 'bg-blue-50';
            }

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[80] p-4">
                    <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 animate-fade-in">
                        <div className="flex flex-col items-center text-center space-y-4">
                            <div className={`p-3 rounded-full ${bgClass}`}>
                                {icon}
                            </div>
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                            <p className="text-slate-600 whitespace-pre-wrap text-sm leading-relaxed">{message}</p>
                            <button 
                                onClick={onClose} 
                                className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg font-bold transition-colors"
                            >
                                閉じる
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ isOpen, title, message, onConfirm, onCancel, confirmText = "OK", cancelText = "キャンセル", isDanger = false }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[60] p-4">
                    <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 animate-fade-in">
                        <h3 className="text-lg font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-6">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-4 py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-50 font-medium">{cancelText}</button>
                            <button onClick={onConfirm} className={`px-4 py-2 text-white rounded font-bold shadow-sm ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700'}`}>{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function LoginScreen({ onLogin }) {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === 'miraiken@1') {
                    onLogin();
                } else {
                    setError('パスワードが違います');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                    <div className="bg-white p-8 rounded-xl shadow-lg max-w-sm w-full animate-fade-in">
                        <div className="flex flex-col items-center mb-6">
                            <div className="bg-indigo-100 p-3 rounded-full mb-4">
                                <Shield className="w-8 h-8 text-indigo-600" />
                            </div>
                            <h2 className="text-xl font-bold text-slate-800">政策リサーチ</h2>
                            <p className="text-sm text-slate-500">システムログイン</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => {
                                        setPassword(e.target.value);
                                        setError('');
                                    }}
                                    className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
                                    placeholder="パスワードを入力"
                                    autoFocus
                                />
                            </div>
                            {error && <div className="text-red-500 text-sm text-center font-medium bg-red-50 py-2 rounded flex items-center justify-center gap-1"><AlertTriangle size={14} />{error}</div>}
                            <button
                                type="submit"
                                className="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow transition-colors flex justify-center items-center gap-2"
                            >
                                ログイン
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- PDF Components ---
        const PdfPage1 = React.forwardRef(({ data }, ref) => {
            if (!data) return null;
            return (
                <div className="absolute top-0 left-0 w-[210mm] bg-white p-8 text-slate-800" ref={ref} style={{ zIndex: -1000, display: 'none' }}>
                    <div className="space-y-6">
                        <div className="relative border-b pb-4 mb-6">
                            <h1 className="text-2xl font-bold text-center">政策リサーチ利用申込控え</h1>
                            <div className="absolute right-0 bottom-4 text-sm">申込日: {data.applicationDate}</div>
                        </div>
                        <div className="grid grid-cols-1 gap-4">
                            <div className="p-4 bg-slate-50 rounded border border-slate-200">
                                <h3 className="font-bold text-lg mb-2">契約プラン</h3>
                                <p>プラン名: {getOfficialPlanName(data.plan, data.paymentCycle)}</p>
                                <p>金額: {getPlanPrice(data.plan, data.paymentCycle)} 円</p>
                            </div>
                            <div className="p-4 bg-slate-50 rounded border border-slate-200">
                                <h3 className="font-bold text-lg mb-2">利用者情報</h3>
                                <p>会社名: {data.companyName}</p>
                                <p>部署名: {data.department}</p>
                                <p>氏名: {resolveFullName(data)}</p>
                                <p>役職: {data.position || '-'}</p>
                                <p>住所: 〒{data.postalCode} {data.address} {data.address2}</p>
                                <p>電話番号: {data.phone}</p>
                                <p>Email: {data.email}</p>
                            </div>
                            <div className="p-4 bg-slate-50 rounded border border-slate-200">
                                <h3 className="font-bold text-lg mb-2">請求先情報</h3>
                                <p>請求先名（氏名）: {data.billingName}</p>
                                <p>部署名: {data.billingDepartment}</p>
                                <p>Email: {data.billingEmail}</p>
                                <p>電話番号: {data.billingPhone}</p>
                            </div>
                            {data.notes && (
                                <div className="p-4 bg-slate-50 rounded border border-slate-200">
                                    <h3 className="font-bold text-lg mb-2">備考</h3>
                                    <p className="whitespace-pre-wrap">{data.notes}</p>
                                </div>
                            )}
                        </div>
                        <div className="mt-12 pt-8 border-t">
                            <CorporateFooter />
                        </div>
                    </div>
                </div>
            );
        });

        const PdfPage2 = React.forwardRef((props, ref) => (
            <div className="absolute top-0 left-0 w-[210mm] bg-white py-8 px-14 text-slate-800" ref={ref} style={{ zIndex: -1000, display: 'none' }}>
                <h1 className="text-xl font-bold text-center border-b pb-4 mb-4">利用規約</h1>
                <div className="text-xs">
                    <TermsOfServiceText />
                </div>
                <div className="mt-8 pt-4 border-t">
                    <CorporateFooter />
                </div>
            </div>
        ));

        // --- Admin Sub-Components ---

        function MailStatusModal({ isOpen, onClose, mailData }) {
            if (!isOpen || !mailData) return null;

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[70] p-4">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
                        <div className="p-6 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white z-10">
                            <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <Info size={24} className="text-indigo-600" />
                                メール送信詳細情報
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X size={24} /></button>
                        </div>
                        <div className="p-6 space-y-4 text-sm">
                            <div className={`p-4 rounded border ${mailData.mailStatus === 'SUCCESS' ? 'bg-green-50 border-green-200 text-green-800' : mailData.mailStatus === 'ERROR' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-slate-50 border-slate-200 text-slate-800'}`}>
                                <p className="font-bold text-lg mb-1">Status: {mailData.mailStatus}</p>
                                {mailData.mailError && <p className="font-mono text-xs mt-2 p-2 bg-white rounded border border-red-100">{mailData.mailError}</p>}
                            </div>
                            
                            <div className="grid grid-cols-[100px_1fr] gap-4">
                                <div className="font-bold text-slate-500">Doc ID</div>
                                <div className="font-mono">{mailData.mailDocId || 'N/A'}</div>
                                
                                <div className="font-bold text-slate-500">Email</div>
                                <div>{mailData.email}</div>

                                <div className="font-bold text-slate-500">Subject</div>
                                <div>{mailData.mailSubject || '(不明)'}</div>
                            </div>
                            
                            {/* 原因調査のヒント */}
                            {mailData.mailStatus === 'ERROR' && (
                                <div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded text-yellow-800 text-xs">
                                    <p className="font-bold mb-1">トラブルシューティング:</p>
                                    <ul className="list-disc pl-4 space-y-1">
                                        <li><strong>Invalid login</strong>: SMTP設定（Gmailアプリパスワードなど）が間違っている可能性があります。</li>
                                        <li><strong>Missing "to"</strong>: 宛先が正しく設定されていません。</li>
                                        <li><strong>Quota exceeded</strong>: 送信制限を超えている可能性があります。</li>
                                    </ul>
                                </div>
                            )}
                            
                            {mailData.mailStatus === 'MISSING' && (
                                <div className="mt-4 p-4 bg-blue-50 border border-blue-200 rounded text-blue-800 text-xs">
                                    <p>送信記録が見つかりません。以下を確認してください。</p>
                                    <ul className="list-disc pl-4 space-y-1 mt-1">
                                        <li>Extensionがインストールされていない可能性があります。</li>
                                        <li>データベースの書き込み権限がない可能性があります。</li>
                                        <li>過去のデータで、メール送信機能実装前のものかもしれません。</li>
                                    </ul>
                                </div>
                            )}
                        </div>
                        <div className="p-6 border-t border-slate-200 flex justify-end">
                            <button onClick={onClose} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded text-slate-700">閉じる</button>
                        </div>
                    </div>
                </div>
            );
        }

        function SendMailModal({ isOpen, onClose, onSend, initialData }) {
            const [mailData, setMailData] = useState({
                to: '',
                cc: '',
                subject: '',
                body: ''
            });
            const [isSending, setIsSending] = useState(false);

            // 残り回数の計算
            const maxResendLimit = 3;
            const currentResendCount = initialData?.currentResendCount || 0;
            const totalSentCount = currentResendCount + 1;
            const remainingCount = maxResendLimit - currentResendCount;

            useEffect(() => {
                if (initialData) {
                    setMailData({
                        to: Array.isArray(initialData.to) ? initialData.to.join(', ') : initialData.to,
                        cc: Array.isArray(initialData.cc) ? initialData.cc.join(', ') : (initialData.cc || 'seisaku@rifj.jp'),
                        subject: initialData.subject,
                        body: initialData.body
                    });
                }
            }, [initialData]);

            const handleSendClick = async () => {
                setIsSending(true);
                await onSend(mailData);
                setIsSending(false);
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[70] p-4">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto animate-fade-in">
                        <div className="p-6 border-b border-slate-200 flex justify-between items-center sticky top-0 bg-white z-10">
                            <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <Mail size={24} className="text-indigo-600" />
                                メール送信内容の確認
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><X size={24} /></button>
                        </div>
                        <div className="p-6 space-y-4">
                            {/* 残り回数の表示エリア */}
                            <div className="flex items-center justify-between bg-indigo-50 border border-indigo-200 p-4 rounded-lg">
                                <div>
                                    <p className="text-sm font-bold text-indigo-900">送信ステータス</p>
                                    <p className="text-xs text-indigo-700 mt-1">これまでの送信回数: <span className="font-bold text-lg">{totalSentCount}</span> 回</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-xs text-indigo-600 font-bold uppercase tracking-wide">残り再送信可能回数</p>
                                    <p className="text-2xl font-bold text-indigo-600">{remainingCount} <span className="text-sm font-normal text-indigo-500">回</span></p>
                                </div>
                            </div>

                            <div className="bg-blue-50 border border-blue-200 text-blue-800 p-3 rounded text-sm mb-4">
                                <p>以下の内容でメール送信リクエストを作成します。内容を確認・編集して「送信」ボタンを押してください。</p>
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">宛先 (To) <span className="text-xs font-normal text-slate-500">※カンマ区切りで複数可</span></label>
                                <input 
                                    type="text" 
                                    value={mailData.to} 
                                    onChange={(e) => setMailData({...mailData, to: e.target.value})}
                                    className="w-full px-3 py-2 border rounded border-slate-300"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">Cc <span className="text-xs font-normal text-slate-500">※カンマ区切りで複数可</span></label>
                                <input 
                                    type="text" 
                                    value={mailData.cc} 
                                    onChange={(e) => setMailData({...mailData, cc: e.target.value})}
                                    className="w-full px-3 py-2 border rounded border-slate-300"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">件名</label>
                                <input 
                                    type="text" 
                                    value={mailData.subject} 
                                    onChange={(e) => setMailData({...mailData, subject: e.target.value})}
                                    className="w-full px-3 py-2 border rounded border-slate-300"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-700 mb-1">本文</label>
                                <textarea 
                                    value={mailData.body} 
                                    onChange={(e) => setMailData({...mailData, body: e.target.value})}
                                    rows="10"
                                    className="w-full px-3 py-2 border rounded border-slate-300 font-mono text-sm leading-relaxed"
                                ></textarea>
                            </div>
                        </div>
                        <div className="p-6 border-t border-slate-200 flex justify-end gap-3 sticky bottom-0 bg-white">
                            <button onClick={onClose} disabled={isSending} className="px-4 py-2 border border-slate-300 rounded text-slate-600 hover:bg-slate-50 disabled:bg-slate-100">キャンセル</button>
                            <button 
                                onClick={handleSendClick} 
                                disabled={isSending}
                                className={`px-6 py-2 text-white rounded font-bold shadow-md flex items-center gap-2 ${isSending ? 'bg-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                            >
                                {isSending ? (
                                    <>
                                        <RefreshCw className="animate-spin" size={18} />
                                        送信中...
                                    </>
                                ) : (
                                    <>

        // --- Main Components ---
        function RegistrationForm({ user }) {
            const [formData, setFormData] = useState({
                companyName: '', department: '', lastName: '', firstName: '', position: '',
                email: '', emailConfirm: '', phone: '', postalCode: '', address: '', address2: '',
                plan: 'trial', paymentCycle: '', notes: '',
                isBillingDifferent: false, billingName: '', billingDepartment: '',
                billingEmail: '', billingEmailConfirm: '', billingPhone: ''
            });
            const [finalDataForPdf, setFinalDataForPdf] = useState(null);
            const [agreedToTerms, setAgreedToTerms] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null); 
            const [addressLoading, setAddressLoading] = useState(false);
            const [validationError, setValidationError] = useState('');
            
            // Modal State
            const [messageModal, setMessageModal] = useState({ isOpen: false, title: '', message: '', type: 'info' });

            const showMessage = (title, message, type = 'info') => {
                setMessageModal({ isOpen: true, title, message, type });
            };

            const closeMessageModal = () => {
                setMessageModal(prev => ({ ...prev, isOpen: false }));
            };
            
            const pdfRef1 = useRef(null);
            const pdfRef2 = useRef(null);
            const paymentMethodRef = useRef(null);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: type === 'checkbox' ? checked : value };
                    if (name === 'plan') {
                        if (value === 'trial') {
                            newData.paymentCycle = ''; 
                            newData.isBillingDifferent = false; 
                        } else {
                            newData.paymentCycle = ''; 
                        }
                    }
                    return newData;
                });
                if (validationError) setValidationError('');
            };

            const searchAddress = async () => {
                if (!formData.postalCode || formData.postalCode.length < 7) {
                    setValidationError("郵便番号は7桁で入力してください（ハイフンなし）");
                    return;
                }
                setAddressLoading(true);
                setValidationError('');
                try {
                    const response = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${formData.postalCode}`);
                    const data = await response.json();
                    if (data.results) {
                        const result = data.results[0];
                        const fullAddress = `${result.address1}${result.address2}${result.address3}`;
                        setFormData(prev => ({ ...prev, address: fullAddress }));
                    } else {
                        setValidationError("住所が見つかりませんでした。郵便番号を確認してください。");
                    }
                } catch (error) {
                    console.error("Address search error:", error);
                    setValidationError("住所検索中にエラーが発生しました。手動で入力してください。");
                } finally {
                    setAddressLoading(false);
                }
            };

            const generatePDF = async () => {
                if (!window.jspdf || !window.html2canvas) {
                    showMessage("準備中", "PDF生成ライブラリを読み込み中です。少々お待ちください。", 'info');
                    return;
                }
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const scale = 4; 
                    const imageFormat = 'image/jpeg';
                    const imageQuality = 0.95;

                    if (pdfRef1.current) {
                        pdfRef1.current.style.display = 'block';
                        const canvas1 = await window.html2canvas(pdfRef1.current, { scale: scale, useCORS: true });
                        pdfRef1.current.style.display = 'none';
                        const imgData1 = canvas1.toDataURL(imageFormat, imageQuality);
                        const imgProps1 = pdf.getImageProperties(imgData1);
                        const imgHeight1 = (imgProps1.height * pdfWidth) / imgProps1.width;
                        pdf.addImage(imgData1, 'JPEG', 0, 0, pdfWidth, imgHeight1);
                    }

                    if (pdfRef2.current) {
                        pdf.addPage();
                        pdfRef2.current.style.display = 'block';
                        const canvas2 = await window.html2canvas(pdfRef2.current, { scale: scale, useCORS: true });
                        pdfRef2.current.style.display = 'none';
                        const imgData2 = canvas2.toDataURL(imageFormat, imageQuality);
                        const imgProps2 = pdf.getImageProperties(imgData2);
                        const imgHeight2 = (imgProps2.height * pdfWidth) / imgProps2.width;
                        if (imgHeight2 > pdfHeight) {
                            pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                        } else {
                            pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, imgHeight2);
                        }
                    }
                    pdf.save('登録情報_利用規約.pdf');
                } catch (error) {
                    console.error("PDF generation failed", error);
                    showMessage("エラー", "PDFの生成に失敗しました。", 'error');
                }
            };

            const handleFinish = () => {
                setSubmitStatus(null);
                setFinalDataForPdf(null);
                setFormData({
                    companyName: '', department: '', lastName: '', firstName: '', position: '',
                    email: '', emailConfirm: '', phone: '', postalCode: '', address: '', address2: '',
                    plan: 'trial', paymentCycle: '', notes: '',
                    isBillingDifferent: false, billingName: '', billingDepartment: '',
                    billingEmail: '', billingEmailConfirm: '', billingPhone: ''
                });
                setAgreedToTerms(false);
                window.scrollTo(0, 0);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return;
                
                if (formData.email !== formData.emailConfirm) {
                    setValidationError("メールアドレスが一致しません。");
                    window.scrollTo(0, 0);
                    return;
                }
                if (formData.plan !== 'trial' && !formData.paymentCycle) {
                    setValidationError("お支払い方法を選択してください。");
                    paymentMethodRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                if (formData.isBillingDifferent) {
                    if (formData.billingEmail !== formData.billingEmailConfirm) {
                        setValidationError("請求先のメールアドレスが一致しません。");
                        return;
                    }
                    if (!formData.billingName || !formData.billingEmail || !formData.billingPhone) {
                        setValidationError("請求先情報の必須項目（名、メール、電話番号）を入力してください。");
                        return;
                    }
                }
                if (!agreedToTerms) {
                    setValidationError("利用規約への同意が必要です。");
                    return;
                }

                setIsSubmitting(true);
                setSubmitStatus(null);
                setValidationError('');

                try {
                    const { emailConfirm, billingEmailConfirm, isBillingDifferent, ...baseData } = formData;
                    const fullName = `${formData.lastName} ${formData.firstName}`;
                    
                    const finalData = {
                        ...baseData,
                        billingName: isBillingDifferent ? formData.billingName : fullName,
                        billingDepartment: isBillingDifferent ? formData.billingDepartment : formData.department,
                        billingEmail: isBillingDifferent ? formData.billingEmail : formData.email,
                        billingPhone: isBillingDifferent ? formData.billingPhone : formData.phone,
                        isBillingDifferent,
                        categoryCode: 'C00',
                        userId: user.uid,
                        createdAt: serverTimestamp(),
                        status: 'pending'
                    };

                    const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    setFinalDataForPdf({ ...finalData, fullName, applicationDate: today });

                    // 1. メール本文の生成
                    let subject = "【政策リサーチ】利用お申し込みありがとうございます";
                    // デフォルト本文の修正: resolveFullNameを使用
                    let body = `${finalData.companyName}\n${finalData.department || ''}\n${resolveFullName(finalData)} 様\n\nこの度は、「政策リサーチ」にお申し込みいただき、誠にありがとうございます。\n以下の内容で承りました。\n\nプラン: ${getOfficialPlanName(finalData.plan, finalData.paymentCycle)}\n金額: ${getPlanPrice(finalData.plan, finalData.paymentCycle)}円\n\nシステムへの登録完了後に、改めてアカウント有効通知のメールが送信されますので、パスワードを設定の上ご利用ください。\n\n--------------------------------------------------\n一般社団法人日本みらい研\n--------------------------------------------------`;

                    try {
                        const templateDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mail_templates', 'registration'));
                        if (templateDoc.exists()) {
                            const template = templateDoc.data();
                            subject = template.subject || subject;
                            let templateBody = template.body || body;
                            
                            // プレースホルダーの置換: resolveFullNameを使用
                            body = templateBody
                                .replace(/{{companyName}}/g, finalData.companyName || '')
                                .replace(/{{department}}/g, finalData.department || '')
                                .replace(/{{name}}/g, resolveFullName(finalData))
                                .replace(/{{plan}}/g, getOfficialPlanName(finalData.plan, finalData.paymentCycle) || '')
                                .replace(/{{price}}/g, getPlanPrice(finalData.plan, finalData.paymentCycle) + '円' || '');
                        }
                    } catch (e) {
                        console.warn("Template fetch failed, using default.");
                    }

                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'registrations'), finalData);
                    
                    try {
                        await addDoc(collection(db, 'mail'), {
                            to: [formData.email], 
                            cc: ['seisaku@rifj.jp'], 
                            message: {
                                subject: subject,
                                text: body
                            },
                            metadata: {
                                registrationId: docRef.id
                            }
                        });
                    } catch (mailError) {
                        console.error("Trigger Email Error:", mailError);
                        showMessage("送信エラー", "登録は完了しましたが、自動返信メールの送信リクエストに失敗しました。\n管理者にお問い合わせください。\nエラー: " + mailError.message, 'error');
                    }

                    setSubmitStatus('success');
                    setAgreedToTerms(false);
                    window.scrollTo(0, 0);
                } catch (error) {
                    console.error("Error adding document: ", error);
                    setSubmitStatus('error');
                    showMessage("システムエラー", "登録処理中にエラーが発生しました。\nもう一度お試しください。", 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="max-w-3xl mx-auto relative">
