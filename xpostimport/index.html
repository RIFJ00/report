  <!-- アプリケーションのコード -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from 'firebase/firestore';

    const { useState, useEffect, useRef } = React;

    // Firebase 初期化
    let app, auth, db;
    try {
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Firebase config initialization error:", e);
    }

    // 文字列から一意のハッシュ文字列を生成する関数（重複チェック用）
    const generateHash = (str) => {
      let hash = 0;
      if (str.length === 0) return '0';
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return Math.abs(hash).toString(36);
    };

    // 2次元配列データから投稿オブジェクトの配列を抽出する共通関数
    const extractDataFromRows = (rows) => {
      if (rows.length <= 1) return [];
      const headers = rows[0];

      const getColumnIndex = (possibleNames) => {
         for (let i = 0; i < headers.length; i++) {
           const headerStr = String(headers[i]).toLowerCase().trim();
           if (possibleNames.some(name => headerStr.includes(name))) {
             return i;
           }
         }
         return -1;
      };

      const colMap = {
        id: getColumnIndex(['id', '番号', 'no']),
        date: getColumnIndex(['日時', '日付', 'date', '時間']),
        title: getColumnIndex(['タイトル', '件名', 'title']),
        text: getColumnIndex(['本文', '内容', 'テキスト', 'text', '投稿内容']),
        url: getColumnIndex(['url', 'リンク', 'link']),
        category: getColumnIndex(['区分', 'カテゴリ', '分類', 'category']),
        evaluation: getColumnIndex(['評価', '重要度', '星', 'evaluation']),
        postType: getColumnIndex(['タイプ', '種類', '発信タイプ', 'type', 'メディア'])
      };

      const parsedData = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0 || row.every(cell => !cell || String(cell).trim() === '')) continue;
        
        const dateVal = colMap.date !== -1 ? String(row[colMap.date] || '') : '';
        const textVal = colMap.text !== -1 ? String(row[colMap.text] || '') : '';
        const urlVal = colMap.url !== -1 ? String(row[colMap.url] || '') : '';

        let id = colMap.id !== -1 && row[colMap.id] ? String(row[colMap.id]) : null;
        
        if (!id) {
           const uniqueStr = `${dateVal}-${textVal.substring(0, 50)}-${urlVal}`;
           id = `post-${generateHash(uniqueStr)}`;
        }
        
        parsedData.push({
          id: id,
          date: dateVal,
          title: colMap.title !== -1 ? String(row[colMap.title] || '') : '',
          text: textVal,
          url: urlVal,
          category: colMap.category !== -1 ? String(row[colMap.category] || '') : '',
          evaluation: colMap.evaluation !== -1 ? String(row[colMap.evaluation] || '') : '',
          postType: colMap.postType !== -1 ? String(row[colMap.postType] || '') : ''
        });
      }
      return parsedData;
    };

    // CSVをパースして2次元配列にする関数
    const parseCSVToArray = (csvText) => {
      const lines = csvText.split(/\r?\n/);
      const result = [];
      
      const parseLine = (line) => {
        const row = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' && line[i + 1] === '"') {
            current += '"';
            i++;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(current);
            current = '';
          } else {
            current += char;
          }
        }
        row.push(current);
        return row;
      };

      for (const line of lines) {
        if (line.trim()) {
          result.push(parseLine(line));
        }
      }
      return result;
    };

    // CDNからXLSXライブラリを動的に読み込む関数
    const loadXlsxLibrary = () => {
      return new Promise((resolve, reject) => {
        if (window.XLSX) {
          resolve(window.XLSX);
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        script.onload = () => resolve(window.XLSX);
        script.onerror = () => reject(new Error('Excel解析ライブラリの読み込みに失敗しました。'));
        document.head.appendChild(script);
      });
    };

    // Excelファイル(.xlsx)を読み込む関数
    const processExcelFile = async (file) => {
      const XLSX = await loadXlsxLibrary();
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, defval: '' });
            const parsedData = extractDataFromRows(jsonData);
            resolve(parsedData);
          } catch (error) {
            reject(error);
          }
        };
        reader.onerror = (error) => reject(error);
        reader.readAsArrayBuffer(file);
      });
    };

    // CSVファイルを読み込む関数
    const processCSVFile = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            const rows = parseCSVToArray(text);
            const data = extractDataFromRows(rows);
            resolve(data);
          } catch (error) {
            reject(error);
          }
        };
        reader.onerror = (error) => reject(error);
        reader.readAsText(file);
      });
    };

    const isTwitterUrl = (url) => {
      if (!url) return false;
      return url.includes('twitter.com') || url.includes('x.com');
    };

    function PrimeMinisterXViewer() {
      const [user, setUser] = useState(null);
      const [posts, setPosts] = useState([]);
      const [selectedPost, setSelectedPost] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [uploadMessage, setUploadMessage] = useState({ text: '', type: '' });
      const [selectedFileName, setSelectedFileName] = useState('');
      const [pasteText, setPasteText] = useState(''); // 追加: テキスト貼り付け用のstate
      
      const [lastUpdatedTime, setLastUpdatedTime] = useState('');
      const [accessTime, setAccessTime] = useState('');

      // 管理者認証状態
      const [isAdmin, setIsAdmin] = useState(false);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState('');
      
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
      const [isDeleting, setIsDeleting] = useState(false);
      
      const [isEditing, setIsEditing] = useState(false);
      const [editFormData, setEditFormData] = useState(null);
      
      const [selectedCategory, setSelectedCategory] = useState('すべて');
      const [selectedEvaluation, setSelectedEvaluation] = useState('すべて');
      const [searchDate, setSearchDate] = useState('');
      const [searchKeyword, setSearchKeyword] = useState('');
      const [sortOrder, setSortOrder] = useState('desc');
      
      const [currentPage, setCurrentPage] = useState(1);
      const itemsPerPage = 15;
      
      const fileInputRef = useRef(null);

      // アクセス日時の設定（初回レンダリング時）
      useEffect(() => {
        const now = new Date();
        const formattedDate = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        setAccessTime(formattedDate);
      }, []);

      // アップロード完了メッセージの自動非表示（約3秒後）
      useEffect(() => {
        if (uploadMessage.text) {
          const timer = setTimeout(() => {
            setUploadMessage({ text: '', type: '' });
          }, 3000);
          return () => clearTimeout(timer);
        }
      }, [uploadMessage]);

      const categories = ['すべて', ...Array.from(new Set(posts.map(p => p.category).filter(Boolean)))];
      const evaluations = ['すべて', ...Array.from(new Set(posts.map(p => p.evaluation).filter(Boolean)))];

      const processedPosts = posts
        .filter(post => {
          const matchCategory = selectedCategory === 'すべて' || post.category === selectedCategory;
          const matchEvaluation = selectedEvaluation === 'すべて' || post.evaluation === selectedEvaluation;
          const matchDate = searchDate === '' || (post.date && post.date.startsWith(searchDate));
          
          const keyword = searchKeyword.toLowerCase();
          const matchKeyword = keyword === '' || (
            (post.title && post.title.toLowerCase().includes(keyword)) ||
            (post.text && post.text.toLowerCase().includes(keyword)) ||
            (post.category && post.category.toLowerCase().includes(keyword)) ||
            (post.evaluation && post.evaluation.toLowerCase().includes(keyword)) ||
            (post.postType && post.postType.toLowerCase().includes(keyword)) ||
            (post.date && post.date.toLowerCase().includes(keyword))
          );

          return matchCategory && matchEvaluation && matchDate && matchKeyword;
        })
        .sort((a, b) => {
          const dateA = new Date(a.date);
          const dateB = new Date(b.date);
          return sortOrder === 'desc' ? dateB - dateA : dateA - dateB;
        });

      useEffect(() => {
        setCurrentPage(1);
      }, [selectedCategory, selectedEvaluation, searchDate, searchKeyword, sortOrder]);

      const totalPages = Math.ceil(processedPosts.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const currentPosts = processedPosts.slice(startIndex, endIndex);

      useEffect(() => {
        const script = document.createElement("script");
        script.src = "https://platform.twitter.com/widgets.js";
        script.async = true;
        script.charset = "utf-8";
        document.body.appendChild(script);
      }, []);

      useEffect(() => {
        if (selectedPost && !isEditing && window.twttr) {
          setTimeout(() => {
            if (window.twttr && window.twttr.widgets) {
              window.twttr.widgets.load();
            }
          }, 100);
        }
      }, [selectedPost, isEditing]);

      // 匿名ログイン
      useEffect(() => {
        if (!auth) return;
        signInAnonymously(auth).catch((err) => {
          console.warn("Firebase Anonymous Auth issue:", err.message);
        });
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      // Firestore リアルタイム同期（投稿一覧 + メタ情報）
      useEffect(() => {
        if (!db) return;

        try {
          const postsRef = collection(db, 'x_posts');
          const unsubscribePosts = onSnapshot(postsRef, (snapshot) => {
            const fetchedPosts = [];
            snapshot.forEach(doc => {
              fetchedPosts.push({ id: doc.id, ...doc.data() });
            });
            setPosts(fetchedPosts);
          }, (error) => {
            console.error("Firestoreリアルタイム取得エラー:", error);
            setUploadMessage({ 
              text: `Firestore通信エラー: ${error.message}`, 
              type: 'error' 
            });
          });

          // メタデータ（最終更新日時）の取得
          const metaRef = doc(db, 'x_posts_meta', 'info');
          const unsubscribeMeta = onSnapshot(metaRef, (docSnap) => {
            if (docSnap.exists() && docSnap.data().lastUpdated) {
              setLastUpdatedTime(docSnap.data().lastUpdated);
            }
          });

          return () => {
            unsubscribePosts();
            unsubscribeMeta();
          };
        } catch(e) {
          console.warn("Firestore listener failed:", e);
        }
      }, [db]);

      // 管理設定ボタンクリック時の処理
      const handleOpenSettings = () => {
        if (isAdmin) {
          setShowSettingsModal(true);
        } else {
          setPasswordInput('');
          setPasswordError('');
          setShowPasswordModal(true);
        }
      };

      // パスワード認証処理
      const handlePasswordSubmit = (e) => {
        if (e) e.preventDefault();
        if (passwordInput === 'miraiken@1') {
          setIsAdmin(true);
          setShowPasswordModal(false);
          setPasswordInput('');
          setPasswordError('');
          setShowSettingsModal(true);
        } else {
          setPasswordError('パスワードが正しくありません。');
        }
      };

      // 管理者ログアウト
      const handleAdminLogout = () => {
        setIsAdmin(false);
        setShowSettingsModal(false);
        setUploadMessage({ text: '管理者モードをログアウトしました。', type: 'info' });
      };

      // 貼り付けテキストの解析と追加処理
      const handlePastedTextSubmit = async () => {
        if (!pasteText.trim()) {
           setUploadMessage({ text: 'テキストが入力されていません。', type: 'error' });
           return;
        }

        setIsUploading(true);
        setUploadMessage({ text: 'テキストを解析中...', type: 'info' });

        try {
          const lines = pasteText.split(/\r?\n/).filter(line => line.trim() !== '');
          const parsedData = [];

          for (const line of lines) {
            // タブ区切りを想定。カンマやスペース区切りが混ざる場合は正規表現の調整が必要になる場合があります。
            // ユーザー指定フォーマット: 日付(2026/09/XX)	タイトル	URL	主分類	副分類	発信タイプ	評価(★★)	確認状況	要約テキスト
            const parts = line.split('\t').map(s => s.trim());
            
            if (parts.length < 3) continue; // 最低限必要な情報（日付、タイトル、URL）がない場合はスキップ

            const dateVal = parts[0] || '';
            const titleVal = parts[1] || '';
            const urlVal = parts[2] || '';
            const categoryVal = parts[3] || ''; // 主分類をカテゴリとして扱う
            // parts[4] (副分類) は現在使っていない
            const postTypeVal = parts[5] || '';
            const evaluationVal = parts[6] || '';
            // parts[7] (URL・本文照合済等のフラグ) は現在使っていない
            const textVal = parts[8] || parts[parts.length - 1] || ''; // 最後の要素または9番目をテキストとする

            const uniqueStr = `${dateVal}-${textVal.substring(0, 50)}-${urlVal}`;
            const id = `post-${generateHash(uniqueStr)}`;

            parsedData.push({
              id: id,
              date: dateVal,
              title: titleVal,
              text: textVal,
              url: urlVal,
              category: categoryVal,
              evaluation: evaluationVal,
              postType: postTypeVal
            });
          }

          if (parsedData.length === 0) {
             setUploadMessage({ text: '有効なデータが抽出できませんでした。フォーマットを確認してください。', type: 'error' });
             setIsUploading(false);
             return;
          }

          await saveToFirestore(parsedData);
          setPasteText('');

        } catch (error) {
          console.error("Text parsing error:", error);
          setUploadMessage({ text: `解析エラー: ${error.message}`, type: 'error' });
          setIsUploading(false);
        }
      };

      // Firestoreへの保存処理を共通化
      const saveToFirestore = async (importedData) => {
          const currentNow = new Date();
          const updateTimestampStr = `${currentNow.getFullYear()}/${String(currentNow.getMonth() + 1).padStart(2, '0')}/${String(currentNow.getDate()).padStart(2, '0')} ${String(currentNow.getHours()).padStart(2, '0')}:${String(currentNow.getMinutes()).padStart(2, '0')}`;

          if (!db) {
            setPosts(prev => [...importedData, ...prev]);
            setLastUpdatedTime(updateTimestampStr);
            setCurrentPage(1);
            setUploadMessage({ text: `ローカルに ${importedData.length} 件表示しています。`, type: 'success' });
            setIsUploading(false);
            setShowSettingsModal(false);
            return;
          }

          const currentIds = new Set(posts.map(post => post.id));
          let newCount = 0;
          let duplicateCount = 0;

          // Firestore に投稿データを保存
          const savePromises = importedData.map(async (post) => {
            if (!currentIds.has(post.id)) {
              const postRef = doc(db, 'x_posts', post.id);
              await setDoc(postRef, post);
              newCount++;
              currentIds.add(post.id);
            } else {
               duplicateCount++;
            }
          });
          
          await Promise.all(savePromises);

          // メタデータ（最終更新日時）を Firestore に保存
          await setDoc(doc(db, 'x_posts_meta', 'info'), { lastUpdated: updateTimestampStr }, { merge: true });
          setLastUpdatedTime(updateTimestampStr);

          setCurrentPage(1);
          setUploadMessage({ 
            text: `保存完了！ 新規追加: ${newCount}件、重複スキップ: ${duplicateCount}件`, 
            type: 'success' 
          });

          setShowSettingsModal(false);
          setIsUploading(false);
      };

      const handleFileUpload = async (event) => {
        const file = event.target.files[0];
        if (!file) {
          setSelectedFileName('');
          return;
        }

        setSelectedFileName(file.name);
        const fileNameLower = file.name.toLowerCase();

        if (!fileNameLower.endsWith('.csv') && !fileNameLower.endsWith('.xlsx')) {
            setUploadMessage({ text: 'CSV (.csv) または Excel (.xlsx) ファイルを選択してください。', type: 'error' });
            if (fileInputRef.current) fileInputRef.current.value = '';
            setSelectedFileName('');
            return;
        }

        setIsUploading(true);
        setUploadMessage({ text: `${file.name} を読み込み中...`, type: 'info' });

        try {
          let importedData = [];
          if (fileNameLower.endsWith('.xlsx')) {
            importedData = await processExcelFile(file);
          } else {
            importedData = await processCSVFile(file);
          }
          
          if (importedData.length === 0) {
             setUploadMessage({ text: 'ファイルからデータを読み取れませんでした。', type: 'error' });
             setIsUploading(false);
             return;
          }

          await saveToFirestore(importedData);

        } catch (error) {
          console.error("File processing / Firebase write error:", error);
          setUploadMessage({ text: `保存エラー: ${error.message}`, type: 'error' });
        } finally {
          setIsUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
          setSelectedFileName('');
        }
      };

      const handlePostClick = (post) => {
        setSelectedPost(post);
        setIsEditing(false);
      };

      const closeModal = () => {
        setSelectedPost(null);
        setIsEditing(false);
      };

      const handleClearFilters = () => {
        setSelectedCategory('すべて');
        setSelectedEvaluation('すべて');
        setSearchDate('');
        setSearchKeyword('');
        setSortOrder('desc');
        setCurrentPage(1);
      };

      const handleBulkDelete = async () => {
        if (posts.length === 0) return;
        setIsDeleting(true);

        if (!db) {
          setPosts([]);
          setLastUpdatedTime('');
          setShowDeleteConfirm(false);
          setShowSettingsModal(false);
          setUploadMessage({ text: 'ローカル表示データをクリアしました。', type: 'success' });
          setIsDeleting(false);
          return;
        }

        try {
          const deletePromises = posts.map(post => {
            const postRef = doc(db, 'x_posts', post.id);
            return deleteDoc(postRef);
          });
          await Promise.all(deletePromises);
          await setDoc(doc(db, 'x_posts_meta', 'info'), { lastUpdated: '' }, { merge: true });
          
          setLastUpdatedTime('');
          setShowDeleteConfirm(false);
          setShowSettingsModal(false);
          setUploadMessage({ text: 'Firebase上のすべてのデータを削除しました。', type: 'success' });
        } catch (error) {
          console.error("Bulk delete error:", error);
          setUploadMessage({ text: `削除エラー: ${error.message}`, type: 'error' });
        } finally {
          setIsDeleting(false);
        }
      };

      const handleDeletePost = async (postId, e) => {
        e.stopPropagation();
        
        if (!db) {
           setPosts(prev => prev.filter(p => p.id !== postId));
           if (selectedPost && selectedPost.id === postId) {
             setSelectedPost(null);
             setIsEditing(false);
           }
           return;
        }
        
        try {
          const postRef = doc(db, 'x_posts', postId);
          await deleteDoc(postRef);
          
          if (selectedPost && selectedPost.id === postId) {
            setSelectedPost(null);
            setIsEditing(false);
          }
        } catch (error) {
          console.error("Delete error:", error);
        }
      };

      const handleEditClick = (post, e) => {
        if (e) e.stopPropagation();
        setSelectedPost(post);
        setEditFormData({ ...post });
        setIsEditing(true);
      };

      const handleSaveEdit = async () => {
        if (!db) {
           setPosts(prev => prev.map(p => p.id === editFormData.id ? editFormData : p));
           setSelectedPost(editFormData);
           setIsEditing(false);
           return;

                               <option value="★">★</option>
                            </select>
                         </div>
                         <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">発信タイプ</label>
                            <select
                               name="postType"
                               value={editFormData.postType || ''}
                               onChange={handleInputChange}
                               className="w-full border border-gray-300 rounded-md px-3 h-[42px] focus:ring-blue-500 focus:border-blue-500 outline-none bg-white shadow-sm transition-shadow box-border"
                            >
                               <option value="">未指定</option>
                               <option value="テキスト">テキスト</option>
                               <option value="画像付き">画像付き</option>
                               <option value="動画付き">動画付き</option>
                               <option value="引用RP">引用RP</option>
                            </select>
                         </div>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">テキスト内容</label>
                        <textarea
                          name="text"
                          value={editFormData.text || ''}
                          onChange={handleInputChange}
                          rows="8"
                          className="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 outline-none shadow-sm transition-shadow"
                        ></textarea>
                      </div>
                      
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">URL (リンク先)</label>
                        <input
                          type="text"
                          name="url"
                          value={editFormData.url || ''}
                          onChange={handleInputChange}
                          className="w-full border border-gray-300 rounded-md px-3 h-[42px] focus:ring-blue-500 focus:border-blue-500 outline-none shadow-sm transition-shadow box-border"
                        />
                      </div>

                      <div className="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-200">
                        <button
                          onClick={() => setIsEditing(false)}
                          className="px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors font-medium shadow-sm"
                        >
                          キャンセル
                        </button>
                        <button
                          onClick={handleSaveEdit}
                          className="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors font-medium shadow-sm"
                        >
                          保存する
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {selectedPost.title && (
                        <div className="border-b border-gray-100 pb-3 mb-3">
                          <h2 className="text-xl font-bold text-gray-900 leading-snug">{selectedPost.title}</h2>
                        </div>
                      )}
                      
                      <div className="text-sm text-gray-500 font-medium flex items-center mb-4">
                        📅 {selectedPost.date}
                      </div>
                      
                      <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                        <p className="text-gray-800 whitespace-pre-wrap leading-relaxed text-sm md:text-base">
                          {selectedPost.text}
                        </p>
                      </div>
                      
                      {selectedPost.url && (
                        <div className="mt-6 flex flex-col">
                          {isTwitterUrl(selectedPost.url) ? (
                             <div className="border-t border-gray-100 pt-4">
                                <h4 className="text-sm font-bold text-gray-700 mb-3 flex items-center">
                                  𝕏 実際のポスト (URLから自動表示)
                                </h4>
                                <div className="flex justify-center bg-white border border-gray-200 rounded-xl p-4 min-h-[200px] overflow-hidden shadow-sm">
                                  <blockquote className="twitter-tweet" data-dnt="true" data-theme="light">
                                    <a href={selectedPost.url.replace('x.com', 'twitter.com')}></a>
                                  </blockquote>
                                </div>
                             </div>
                          ) : (
                            <a 
                              href={selectedPost.url} 
                              target="_blank" 
                              rel="noopener noreferrer" 
                              className="inline-flex items-center w-fit text-blue-600 hover:text-blue-800 font-medium transition-colors bg-blue-50 hover:bg-blue-100 px-4 py-2 rounded-md"
                            >
                              🔗 リンク先を開く
                            </a>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </div>
                
                {!isEditing && (
                  <div className="p-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 flex-shrink-0">
                    <button
                      onClick={() => {
                        setEditFormData({ ...selectedPost });
                        setIsEditing(true);
                      }}
                      className="px-5 py-2 border border-gray-300 text-gray-700 bg-white rounded-md hover:bg-gray-50 font-medium transition-colors shadow-sm flex items-center"
                    >
                      ✏️ 編集する
                    </button>
                    <button
                      onClick={closeModal}
                      className="px-5 py-2 bg-blue-900 text-white rounded-md hover:bg-blue-800 font-medium transition-colors shadow-sm"
                    >
                      閉じる
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 一括削除確認モーダル */}
          {showDeleteConfirm && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black bg-opacity-60 transition-opacity">
               <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden animate-in fade-in zoom-in duration-200 p-6">
                  <div className="flex items-center justify-center w-12 h-12 rounded-full bg-red-100 mb-4 mx-auto text-xl">
                    ⚠️
                  </div>
                  <h3 className="text-lg font-bold text-center text-gray-900 mb-2">すべてのデータを削除しますか？</h3>
                  <p className="text-sm text-gray-500 text-center mb-6">
                      Firestore上のすべての投稿データが削除されます。この操作は取り消せません。
                  </p>
                  <div className="flex justify-center gap-3">
                     <button 
                       onClick={() => setShowDeleteConfirm(false)}
                       disabled={isDeleting}
                       className="px-4 py-2 border border-gray-300 text-gray-700 bg-white rounded-md hover:bg-gray-50 font-medium transition-colors"
                     >
                       キャンセル
                     </button>
                     <button 
                       onClick={handleBulkDelete}
                       disabled={isDeleting}
                       className="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 font-medium transition-colors flex items-center"
                     >
                       {isDeleting ? "削除中..." : "一括削除する"}
                     </button>
                  </div>
               </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PrimeMinisterXViewer />);
  </script>
</body>
</html>
