<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直近の内閣・政党支持率ダッシュボード</title>
    
    <!-- スタイルシートとフォント -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
        }
    </style>

    <!-- 必要なJavaScriptライブラリの読み込み -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase モジュールのインポートマップ -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
            }
        }
    </script>

</head>
<body class="bg-gray-50">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot } from 'firebase/firestore';

        const { useState, useEffect, useMemo } = React;

        // 指定された Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyCzxK80B7Tl2EoBemiWq2_rKFPHhr1vkVI",
            authDomain: "election-fe317.firebaseapp.com",
            projectId: "election-fe317",
            storageBucket: "election-fe317.firebasestorage.app",
            messagingSenderId: "3312762738",
            appId: "1:3312762738:web:9f7c1430d5f5ceaacee7eb",
            measurementId: "G-B102SLVDK5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // データベース上のローマ字キーと、曖昧な政党名の表記揺れを日本語表示名に吸収するマッピング辞書
        const partyNameMap = {
            // --- データベース（Firestore）のフィールド名 ---
            'jimin': '自民党',
            'chudo': '中道改革連合',
            'kokumin': '国民民主党',
            'ishin': '維新',
            'komei': '公明党（参考）',
            'kyosan': '共産党',
            'reiwa': 'れいわ',
            'shamin': '社民党',
            'hoshu': '保守党',
            'sansei': '参政党',
            'mirai': 'みらい',
            'none': '支持なし',
            'cabinetSupport': '内閣支持率',
            'cabinetNonsupport': '内閣不支持率',

            // --- 漢字表記の揺れ吸収 ---
            '自民': '自民党', '自由民主党': '自民党', '自民党': '自民党',
            '立憲': '中道改革連合', '立民': '中道改革連合', '立憲民主党': '中道改革連合', '中道連合': '中道改革連合', '中道改革連合': '中道改革連合',
            '国民': '国民民主党', '国民民主党': '国民民主党', '国民党': '国民民主党',
            '維新': '維新', '日本維新の会': '維新', '維新の会': '維新',
            '公明': '公明党（参考）', '公明党': '公明党（参考）', '公明党（参考）': '公明党（参考）',
            '共産': '共産党', '共産党': '共産党', '日本共産党': '共産党',
            'れいわ': 'れいわ', 'れいわ新選組': 'れいわ',
            '社民': '社民党', '社民党': '社民党', '社会民主党': '社民党',
            '保守': '保守党', '保守党': '保守党', '日本保守党': '保守党',
            '参政': '参政党', '参政党': '参政党',
            'みらい': 'みらい', 'その他': 'みらい', 'その他の政党': 'みらい',
            '無党派': '支持なし', '支持政党なし': '支持なし', '支持なし': '支持なし', 'わからない': '支持なし', '答えない': '支持なし',
            '内閣支持': '内閣支持率', '内閣支持率': '内閣支持率',
            '内閣不支持': '内閣不支持率', '内閣不支持率': '内閣不支持率'
        };

        // 日付を「〇年〇月〇日」にフォーマット
        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            if (dateStr.includes('年')) return dateStr; 
            const parts = dateStr.split(/[-/]/);
            if (parts.length === 3) {
                return `${parts[0]}年${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日`;
            }
            return dateStr;
        };

        // データベースの全ドキュメントを月ごとに集計して平均を出す
        const processData = (docs) => {
            const monthlyData = {};
            let latestDateStr = '';

            // 1. 月ごとにグループ化し、最新日付を取得
            docs.forEach(doc => {
                const data = doc;
                // dateフィールドの探し方を強化
                const dateStr = data.date || data.createdAt || data.日付 || data.調査日 || ''; 
                
                if (dateStr && dateStr > latestDateStr) {
                    latestDateStr = dateStr;
                }

                if (dateStr) {
                    const monthKey = dateStr.substring(0, 7); // "YYYY-MM"
                    if (!monthlyData[monthKey]) monthlyData[monthKey] = [];
                    monthlyData[monthKey].push(data);
                }
            });

            // 降順（新しい月順）にソート
            const months = Object.keys(monthlyData).sort().reverse(); 
            if (months.length === 0) return null;

            const currentMonthKey = months[0];
            const previousMonthKey = months.length > 1 ? months[1] : null;

            // 特定の月の平均値を計算する関数
            const calculateAverage = (records) => {
                const sums = {};
                const counts = {};
                
                records.forEach(record => {
                    // データが { data: { 自民党: 30 } } のようにネストされている場合と、直接配置されている場合の両方に対応
                    const targetData = (record.data && typeof record.data === 'object' && !record.data.seconds) ? record.data : record;

                    for (const key in targetData) {
                        // メタデータや日付に関するフィールドは集計から除外
                        if (['date', 'createdAt', 'updatedAt', 'id', '日付', '調査日', 'media'].includes(key)) continue;
                        
                        const mappedKey = partyNameMap[key] || key;
                        const value = parseFloat(targetData[key]);
                        
                        if (!isNaN(value)) {
                            sums[mappedKey] = (sums[mappedKey] || 0) + value;
                            counts[mappedKey] = (counts[mappedKey] || 0) + 1;
                        }
                    }
                });

                const averages = {};
                for (const key in sums) {
                    averages[key] = Number((sums[key] / counts[key]).toFixed(1));
                }
                return averages;
            };

            return {
                latestDate: formatDate(latestDateStr),
                currentData: calculateAverage(monthlyData[currentMonthKey]),
                previousData: previousMonthKey ? calculateAverage(monthlyData[previousMonthKey]) : {}
            };
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            
            // データ取得前やデータがない場合の初期値（すべてゼロに設定）
            const defaultDashboardData = {
                latestDate: '----年--月--日',
                currentData: {
                    '内閣支持率': 0, '内閣不支持率': 0, '自民党': 0, '中道改革連合': 0,
                    '国民民主党': 0, '維新': 0, '公明党（参考）': 0, '共産党': 0,
                    'れいわ': 0, '社民党': 0, '保守党': 0, '参政党': 0, 'みらい': 0, '支持なし': 0
                },
                previousData: { 
                    '内閣支持率': 0, '内閣不支持率': 0, '自民党': 0, '中道改革連合': 0,
                    '国民民主党': 0, '維新': 0, '公明党（参考）': 0, '共産党': 0,
                    'れいわ': 0, '社民党': 0, '保守党': 0, '参政党': 0, 'みらい': 0, '支持なし': 0
                }
            };

            const [dashboardData, setDashboardData] = useState(defaultDashboardData);

            // 1. 匿名認証の初期化
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        console.error("Authentication error:", error);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 2. Firestoreからのリアルタイムデータ取得
            useEffect(() => {
                if (!user) return;

                // データベースの正しいパスを指定
                const pollsRef = collection(db, 'artifacts', 'election_analyzer_main', 'public', 'data', 'polls');

                const unsubscribe = onSnapshot(pollsRef, (snapshot) => {
                    const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    
                    if (docs.length > 0) {
                        const processed = processData(docs);
                        if (processed) {
                            setDashboardData(processed);
                        }
                    }
                }, (error) => {
                    console.error("Firestore fetch error:", error);
                });

                return () => unsubscribe();
            }, [user]);

            // 3. 最新データと前月比の差分を計算
            const supportData = useMemo(() => {
                const combined = { ...dashboardData.currentData };
                combined['調査期間'] = `各社平均（${dashboardData.latestDate}）`;

                for (const key in dashboardData.previousData) {
                    if (combined[key] !== undefined) {
                        const diff = combined[key] - dashboardData.previousData[key];
                        combined[`${key}_diff`] = diff.toFixed(1);
                    }
                }
                return combined;
            }, [dashboardData]);

            
            // 表示する政党のリストと表示順を調整
            const partyData = [
                { displayName: '自民党', dataKey: '自民党', color: 'bg-blue-600' }, 
                { displayName: '中道改革連合', dataKey: '中道改革連合', color: 'bg-green-600' },
                { displayName: '国民民主党', dataKey: '国民民主党', color: 'bg-indigo-500' },
                { displayName: '維新', dataKey: '維新', color: 'bg-yellow-500' },
                { displayName: '参政党', dataKey: '参政党', color: 'bg-teal-500' },
                { displayName: 'みらい', dataKey: 'みらい', color: 'bg-cyan-600' },
                { displayName: '共産党', dataKey: '共産党', color: 'bg-pink-600' },
                { displayName: 'れいわ', dataKey: 'れいわ', color: 'bg-purple-600' },
                { displayName: '保守党', dataKey: '保守党', color: 'bg-blue-800' },
                { displayName: '社民党', dataKey: '社民党', color: 'bg-pink-800' },
                { displayName: '公明党（参考）', dataKey: '公明党（参考）', color: 'bg-red-600' },
                { displayName: '無党派', dataKey: '支持なし', color: 'bg-gray-700' },
            ];
            
            // 前月比を描画するヘルパーコンポーネント
            const DiffLabel = ({ diff }) => {
                if (diff === undefined || diff === null || isNaN(diff)) {
                    return null;
                }
                const value = parseFloat(diff);
                const isNegative = value < 0;
                const isPositive = value > 0;
                
                let colorClass = 'text-gray-500';
                if (isNegative) colorClass = 'text-red-500';
                if (isPositive) colorClass = 'text-green-500';
                
                const sign = isPositive ? '+' : '';

                return (
                    <span className={`ml-2 text-lg font-normal ${colorClass}`}>
                        ({sign}{value.toFixed(1)})
                    </span>
                );
            };

            const renderDashboard = () => (
                <div className="p-4 md:p-8 bg-gray-50 min-h-screen">
                    <header className="text-center mb-6">
                        <h1 className="text-3xl md:text-4xl font-bold text-gray-800">
                            直近の内閣・政党支持率ダッシュボード
                        </h1>
                    </header>
                    
                    <div className="text-center mb-8">
                         <p className="text-gray-600">{supportData['調査期間']}</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-xl shadow-md flex flex-col items-center justify-center">
                            <h2 className="text-xl font-semibold text-center mb-2">内閣支持率</h2>
                            <p className="text-6xl font-bold text-center text-green-500 flex items-baseline justify-center">
                                {supportData['内閣支持率'] !== undefined ? Number(supportData['内閣支持率']).toFixed(1) : '-'}
                                <span className="text-3xl ml-2">%</span>
                                <DiffLabel diff={supportData['内閣支持率_diff']} />
                            </p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-md flex flex-col items-center justify-center">
                            <h2 className="text-xl font-semibold text-center mb-2">内閣不支持率</h2>
                            <p className="text-6xl font-bold text-center text-red-500 flex items-baseline justify-center">
                                {supportData['内閣不支持率'] !== undefined ? Number(supportData['内閣不支持率']).toFixed(1) : '-'}
                                <span className="text-3xl ml-2">%</span>
                                <DiffLabel diff={supportData['内閣不支持率_diff']} />
                            </p>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-md">
                        <h2 className="text-xl font-semibold text-center mb-6">各党支持率</h2>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6">
                            {partyData.map(party => (
                                <div key={party.displayName} className="border rounded-lg">
                                    <div className={`p-2 text-center text-white font-bold ${party.color} rounded-t-md truncate`}>
                                        {party.displayName}
                                    </div>
                                    <div className="p-4 text-center">
                                        <div className="flex items-baseline justify-center">
                                            <p className="text-3xl font-bold">{supportData[party.dataKey] !== undefined ? Number(supportData[party.dataKey]).toFixed(1) : '0.0'}</p>
                                            <span className="text-lg ml-1">%</span>
                                            <DiffLabel diff={supportData[`${party.dataKey}_diff`]} />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <footer className="mt-12 text-center">
                        <div className="flex justify-center gap-4 flex-wrap">
                            <button onClick={() => setView('opinion')} className="bg-blue-600 text-white font-bold py-3 px-6 md:px-8 rounded-lg hover:bg-blue-700 transition-transform transform hover:scale-105 shadow-lg">支持率分析</button>
                            <button onClick={() => setView('election')} className="bg-green-600 text-white font-bold py-3 px-6 md:px-8 rounded-lg hover:bg-green-700 transition-transform transform hover:scale-105 shadow-lg">参院選分析</button>
                            <button onClick={() => setView('election_lower')} className="bg-purple-600 text-white font-bold py-3 px-6 md:px-8 rounded-lg hover:bg-purple-700 transition-transform transform hover:scale-105 shadow-lg">衆院選分析</button>
                            <button onClick={() => setView('general')} className="bg-orange-600 text-white font-bold py-3 px-6 md:px-8 rounded-lg hover:bg-orange-700 transition-transform transform hover:scale-105 shadow-lg">総合分析</button>
                        </div>
                    </footer>

                    <div className="mt-16 pt-8 border-t text-center text-sm text-gray-500">
                        <p className="mb-2 px-4">
                            このダッシュボードは、報道機関各社の世論調査の結果等をベースに、一般社団法人日本みらい研が独自にまとめたものとなる（更新: {dashboardData.latestDate}）。
                        </p>
                        <p>
                            ©️一般社団法人日本みらい研 2025
                        </p>
                    </div>
                </div>
            );
            
            const renderAnalysisView = (url) => (
                <div className="w-full h-screen flex flex-col bg-gray-100">
                    <header className="p-4 bg-white shadow-md flex items-center">
                        <button onClick={() => setView('dashboard')} className="bg-gray-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-gray-700">&larr; ダッシュボードに戻る</button>
                    </header>
                    <iframe src={url} className="w-full flex-grow border-none" title="Analysis View"></iframe>
                </div>
            );
            
            switch (view) {
                case 'opinion': return renderAnalysisView('https://report.rifj.jp/opinion4/');
                case 'election': return renderAnalysisView('https://report.rifj.jp/election2025');
                case 'election_lower': return renderAnalysisView('https://report.rifj.jp/election2026');
                case 'general': return renderAnalysisView('https://report.rifj.jp/election0000/');
                default: return renderDashboard();
            }
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<React.StrictMode><App /></React.StrictMode>);
    </script>
</body>
</html>
