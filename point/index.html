ked ? 'checked' : ''} aria-label="ブックマーク"></td><td class="w-24 sm:w-28 px-2 py-3 text-sm"><p class="whitespace-nowrap ${dateClass}">${date}</p></td><td class="kaigi-date-col w-24 sm:w-28 px-2 py-3 text-sm"><p class="whitespace-nowrap text-gray-900">${kaigiDate}</p></td><td class="px-2 py-3 text-sm min-w-0"><div><div class="flex items-center">${titlePrefixHtml}<a href="${url2 || '#'}" target="_blank" rel="noopener noreferrer" class="text-blue-600 font-bold hover:underline" title="${originalTitle}">${displayTitle}</a></div><p class="text-xs text-gray-500 mt-1">${bikou}</p></div></td><td class="w-12 sm:w-16 px-2 py-3 text-sm text-center">${audioIconHtml}</td>`; return row; }

            })({"tableData":[{"日付":"2025/06/11","開催日":"2025/06/10","タイトル名":"持続可能な開発目標(SDGs)推進本部（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/持続可能な開発目標推進本部会合.m4a","URL2":"https://www.kantei.go.jp/jp/singi/sdgs/dai16/gijisidai.html","備考":"SDGs推進本部第16回会合で、3回目となるSDGsに関する自発的国家レビュー（VNR）報告書が決定された。この報告書は、少子高齢化や地方創生、防災といった課題先進国日本の取組と課題、及び大阪・関西万博等を紹介している。総理は、複合的危機に直面する世界情勢の中、ぶれることなくSDGs達成を推進し、「誰一人取り残さない」社会の実現に向けた一層の加速を関係閣僚に指示した。","会議":"会議","isBookmarked":false,"_originalIndex":0},{"日付":"2025/06/11","開催日":"2025/06/10","タイトル名":"アジアでのトランジション・ファイナンス推進のあり方に関するSW（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/アジアでのトランジション・ファイナンス推進のあり方に関するSW.m4a","URL2":"https://www.meti.go.jp/shingikai/energy_environment/transition_finance/asia_sub_wg/004.html","備考":"経済産業省などのサブワーキングでは、アジアでのトランジション・ファイナンス推進について議論している。アジアは人口・経済成長によりエネルギー需要が増大し、脱炭素化が不可欠であることから、グリーン投資のみならず経済全体の移行への資金供給が重要であるとされた。トランジション・ファイナンスは「ラベル付き」だけでなく、より広い概念で捉え、多様な時間軸やアセット/プロジェクトを考慮する必要がある。その拡大には、当事国の明確な道筋提示や政策、日本の支援や対話が不可欠である。","会議":"会議","isBookmarked":false,"_originalIndex":1},{"日付":"2025/06/11","開催日":"2025/06/10","タイトル名":"デジタル空間における情報流通の諸課題への対処に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタル空間における情報流通の諸課題への対処に関する検討会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_shokadai/02ryutsu02_04000551.html","備考":"デジタル空間において、著名人なりすまし等の「偽広告」や商標権等侵害広告による詐欺被害が急速に拡大している。これに対処するため、総務省はSNS等の大規模プラットフォーム事業者を対象とした、デジタル広告の流通を巡る課題への対応に関するモニタリング指針（案）を策定した。本指針に基づき、事業者の広告出稿時の事前審査や事後的な削除等の対応状況を継続的に把握し、改善を促す。また、広告主が意図しない媒体へ広告が配信されることによるブランド毀損等のリスクに対し、広告主向けガイダンスも公表されている。これらの取り組みは、デジタル情報空間の健全性確保と利用者の保護を目的としている。","会議":"会議","isBookmarked":false,"_originalIndex":2},{"日付":"2025/06/11","開催日":"2025/06/10","タイトル名":"情報通信審議会・情報通信政策部会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/情報通信審議会・情報通信政策部会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/02tsushin10_04000666.html","備考":"情報通信政策部会答申案は、少子高齢化や災害等に直面する地域社会の課題解決のため、AIを含むデジタル技術を徹底活用する地域社会DX推進策を示すものである。地域課題起点のソリューション創出、AI等活用強化、実装・事業化・普及支援、新たなデジタルインフラ活用を四つの柱とし、実証から社会実装、海外展開へ繋げる方策を提示している。デジタルインフラ整備とソリューション創出は一体的な支援が重要であるとしている。","会議":"会議","isBookmarked":false,"_originalIndex":3},{"日付":"2025/06/11","開催日":"2025/06/10","タイトル名":"総合資源エネルギー調査会・資源・燃料分科会・脱炭素燃料政策小委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/総合資源エネルギー調査会・資源・燃料分科会・脱炭素燃料政策小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/enecho/shigen_nenryo/nenryo_seisaku/019.html","備考":"運輸部門の脱炭素化のため、ガソリンへのバイオエタノール導入拡大が主要議題である。2030年度までにE10供給開始、早期にE20対応車普及を目指す方針で、調達・品質・車両・インフラの課題解決へ向けたアクションプランが策定中だ。石油精製業者の判断基準改正で調達先拡大も図り、IMOのGHG対策や次世代燃料支援策も提示された。","会議":"会議","isBookmarked":false,"_originalIndex":4},{"日付":"2025/06/03","開催日":"2025/06/02","タイトル名":"総合資源エネルギー調査会・基本政策分科会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/総合資源エネルギー調査会・基本政策分科会.m4a","URL2":"https://www.enecho.meti.go.jp/committee/council/basic_policy_subcommittee/2025/069/","備考":"世界のエネルギー情勢は激変しており、米国は化石燃料利用を重視し、欧州は産業競争力強化と脱炭素の両立を図っている。日本は、2035年度に温室効果ガス60%、2040年度に73%削減目標達成に向け、GX投資を加速する。具体的には、脱炭素電源の拡大（原子力、再エネ）、省エネルギー・非化石転換、次世代燃料確保、資源循環強化、重要鉱物の安定供給確保、そして国際協力を通じて、エネルギー安全保障と経済成長の同時実現を目指している。","会議":"会議","isBookmarked":false,"_originalIndex":5},{"日付":"2025/06/03","開催日":"2025/06/02","タイトル名":"温室効果ガス排出量算定・報告・公表制度における算定⽅法検討会（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/温室効果ガス排出量算定・報告・公表制度.m4a","URL2":"https://policies.env.go.jp/earth/ghg-santeikohyo/study.html","備考":"温室効果ガス排出量算定・報告・公表制度（SHK制度）に関する検討会では、電気・熱の排出係数見直しやカーボンリサイクル燃料の排出削減価値の反映について議論された。また、森林吸収や木材製品の炭素蓄積変化量を調整後排出量に任意で報告可能とする方針が示された。二重計上防止やトレーサビリティ確保が重要課題とされている。","会議":"会議","isBookmarked":false,"_originalIndex":6},{"日付":"2025/06/03","開催日":"2025/06/02","タイトル名":"スチュワードシップ・コード及びコーポレートガバナンス・コードのフォローアップ会議(金融庁)","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/スチュワードシップ・コード及びコーポレートガバナンス・コードのフォローアップ会議.m4a","URL2":"https://www.fsa.go.jp/singi/follow-up/siryou/20250602.html","備考":"金融庁は、スチュワードシップ・コードとコーポレートガバナンス・コードの実質化に向け、企業の「稼ぐ力」向上、投資家との建設的な対話、取締役会の機能強化を推進している。情報開示の充実（人的資本、サステナビリティ、総会前有価証券報告書等）や、政策保有株式・親子上場の課題解決にも取り組んでいる。また、大量保有報告制度の見直し等、関連する法制度の整備も進んでいる。","会議":"会議","isBookmarked":false,"_originalIndex":7},{"日付":"2025/06/04","開催日":"2025/06/03","タイトル名":"税制のEBPMに関する専⾨家会合（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/税制EBPM専門家会合.m4a","URL2":"https://www.cao.go.jp/zei-cho/gijiroku/ebpm/2025/7ebpm4kai.html","備考":"研究開発税制は、企業の研究開発費を法人税から控除する制度であり、一般型とオープンイノベーション型がある。制度改正により適用額は増加してきたが、研究費総額は横ばいであり、その効果や恩恵の偏りが課題とされている。国際的な論文では、R&D投資への正の効果が示されている。","会議":"会議","isBookmarked":false,"_originalIndex":8},{"日付":"2025/06/04","開催日":"2025/06/02","タイトル名":"AI戦略会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/AI戦略会議.m4a","URL2":"https://www8.cao.go.jp/cstp/ai/ai_senryaku/14kai/14kai.html","備考":"日本で令和7年5月28日にAI法が成立した。これは、イノベーション促進とリスク対応を両立させ、「世界で最もAIの研究開発・実装がしやすい国」を目指すものである。本年秋までにAI戦略本部と有識者会議が設置され、本年冬までにAI基本計画が策定される。計画には地方の変化やフィジカルAI強化策が盛り込まれ、AI指針の整備も進められる。国民の権利侵害事案には、国が調査・指導する体制が整えられる。","会議":"会議","isBookmarked":false,"_originalIndex":9},{"日付":"2025/06/04","開催日":"2025/06/02","タイトル名":"男⼥共同参画会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/男女共同参画会議.m4a","URL2":"https://www.gender.go.jp/kaigi/danjo_kaigi/gijisidai/ka75-s.html","備考":"男女共同参画会議にて、「女性活躍・男女共同参画の重点方針2025」と「新・女性デジタル人材育成プラン」が議論された。重点方針は、女性の活躍と安心安全な社会実現を目指す。新プランは、デジタルスキルによる女性の経済的自立と多様な働き方を推進する。芳野議員からは選択的夫婦別氏制度導入等の意見もあったが、政府はこれらを近く決定する予定である。","会議":"会議","isBookmarked":false,"_originalIndex":10},{"日付":"2025/06/04","開催日":"2025/06/03","タイトル名":"産業構造審議会・経済産業政策新機軸部会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/産業構造審議会経済産業政策新機軸部会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/shin_kijiku/20250603_report.html","備考":"日本経済の長期停滞に「潮目の変化」が起き、コストカット型から投資と賃上げが牽引する成長思考への転換が不可欠である。政府は、実質賃金向上と交易条件改善のため高付加価値化を促し、製造業X化や情報通信業・専門サービス業の成長産業化等、産業構造転換を目指す。この実現に向け、GX・DX推進や地方経済強化等の新機軸政策を総動員し、人口減少下でも豊かな2040年社会の実現を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":11},{"日付":"2025/06/04","開催日":"2025/06/03","タイトル名":"産業構造審議会・商務流通情報分科会・次世代半導体等⼩委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/次世代半導体等小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/shomu_ryutsu/next_generation_semiconductor/003.html","備考":"経済産業省は、生成AI拡大に伴う情報処理高度化のため、次世代半導体等小委員会を開催した。情促法に基づき、指定高速情報処理用半導体の生産・設備導入支援、デジタル人材育成、IPA業務追加、新公債発行で財源確保を図る。2030年度までに10兆円超の官民投資を誘発し、半導体・AI産業の国際競争力強化とサプライチェーン再構築を目指す。支援は厳しく監督され、高い透明性が求められる。","会議":"会議","isBookmarked":false,"_originalIndex":12},{"日付":"2025/06/04","開催日":"2025/06/03","タイトル名":"基幹ロケット開発に係る有識者検討会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/新しい地方経済・生活環境創生会議.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/kaihatu/031/siryo/mext_00007.html","備考":"基幹ロケット開発検討会は、H3ロケットの国際競争力強化、高頻度打上げ、開発アプローチを議論した。JAXAは宇宙基本計画に基づき、再使用や有人輸送を見据えた次世代輸送システムの基盤技術研究を進め、民間連携で産業・人材基盤の底上げを図っている。","会議":"会議","isBookmarked":false,"_originalIndex":13},{"日付":"2025/06/04","開催日":"2025/06/03","タイトル名":"産業構造審議会・地域経済産業分科会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/就職氷河期世代等支援プログラム会議.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/chiiki_keizai/025.html","備考":"産業構造審議会地域経済産業分科会では、地方創生2.0を踏まえ、地域経済産業政策の方向性を議論した。産業用地確保、産業インフラ整備、地域を牽引する中堅・中小企業支援、地域産業振興・企業誘致、地域人材育成・確保の５つの政策領域における課題と対応を重点的に検討した。これにより、人口減少や人材ミスマッチといった構造的な課題に対応し、地域が自律的に成長し稼げる強い経済の実現を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":14},{"日付":"2025/06/04","開催日":"2025/06/03","タイトル名":"就職氷河期世代等⽀援に関する関係閣僚会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/就職氷河期世代等支援プログラム会議.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/shushoku_hyogaki_shien/kankeikakuryokaigi/dai2/gijisidai.html","備考":"令和7年6月3日、第2回就職氷河期世代等支援に関する関係閣僚会議で「新たな就職氷河期世代等支援プログラムの基本的な枠組み」が決定された。これは、就職氷河期世代の就労・処遇改善、社会参加、高齢期を見据えた3本柱の支援を継続・拡充するもので、今後約3年間集中的な取組が想定されている。","会議":"会議","isBookmarked":false,"_originalIndex":15},{"日付":"2025/06/05","開催日":"2025/06/04","タイトル名":"建築物のライフサイクルカーボンの算定・評価等を促進する制度に関する検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/建築物LCA制度検討会.m4a","URL2":"https://www.mlit.go.jp/jutakukentiku/house/jutakukentiku_house_tk4_000302.html","備考":"日本は2050年カーボンニュートラル実現へ、建築物の計画から解体までライフサイクル全体でCO2排出量を算定・評価するLCA制度を2028年度目途に開始を目指す。この制度は、建築生産者や建材製造業者の脱炭素化を可視化・促進し、好循環を生む社会を目指すものである。現在、関係省庁と有識者で構成する検討会が設置され、表示促進や原単位整備を含め制度構築の議論が進められている。","会議":"会議","isBookmarked":false,"_originalIndex":16},{"日付":"2025/06/05","開催日":"2025/06/04","タイトル名":"産業構造審議会・知的財産分科会・財政点検⼩委員会（特許庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/知的財産分科会財政点検小委員会.m4a","URL2":"https://www.jpo.go.jp/resources/shingikai/sangyo-kouzou/shousai/zaiseitenken_shoi/10-shiryou.html","備考":"産業構造審議会知的財産分科会財政点検小委員会では、令和6年度特許特別会計の決算見込と剰余金、各種出願動向が報告された。剰余金は増加しており、将来のシステム刷新や庁舎改修に充てる投資資金やリスクバッファー確保の必要性が議論された。令和8年度概算要求ではePCT活用や庁舎改修経費を計上する方針。情報公開も進める。","会議":"会議","isBookmarked":false,"_originalIndex":17},{"日付":"2025/06/05","開催日":"2025/06/04","タイトル名":"産業構造審議会・知的財産分科会・特許制度⼩委員会（特許庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/特許制度小委員会.m4a","URL2":"https://www.jpo.go.jp/resources/shingikai/sangyo-kouzou/shousai/tokkyo_shoi/54-shiryou.html","備考":"産業構造審議会特許制度小委員会は、AI技術発達を踏まえ、発明該当性、発明者、引用発明適格性の早期検討を進めている。国際的なネットワーク関連発明の国内実施要件明文化も議論しており、ePCT導入、国内優先権見直し、公報のプライバシー保護、知財侵害抑止策も検討対象である。","会議":"会議","isBookmarked":false,"_originalIndex":18},{"日付":"2025/06/05","開催日":"2025/06/04","タイトル名":"国⼟強靱化推進会議（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/国土強靱化計画.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/suisinkaigi/joukyou_dai14/index.html","備考":"国土強靱化は、頻発する自然災害やインフラ老朽化に対応するため、対策を加速深化させる。防災庁を司令塔とし、デジタル技術や予防保全型メンテナンスを推進する。今後5年間で約20兆円強の事業規模を目途とし、資材価格や人件費の高騰も適切に反映する方針である。","会議":"会議","isBookmarked":false,"_originalIndex":19},{"日付":"2025/06/05","開催日":"2025/06/03","タイトル名":"新しい地⽅経済・⽣活環境創⽣会議（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/新しい地方経済・生活環境創生会議.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/atarashii_chihousousei/yusikishakaigi/dai10/gijisidai.html","備考":"地方創生2.0は、人口減少を直視し、若者や女性に選ばれる「稼げる」地方の創出を目指す構想である。AI・デジタル技術の徹底活用、異なる要素の「新結合」、都市と地方の交流、広域連携を推進し、「新しい日本・楽しい日本」の実現を図る。","会議":"会議","isBookmarked":false,"_originalIndex":20},{"日付":"2025/06/05","開催日":"2025/06/03","タイトル名":"⾃動運航船検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/自動運航船検討会.m4a","URL2":"https://www.mlit.go.jp/maritime/maritime_fr7_000046.html","備考":"自動運航船検討会は、2030年頃の本格商用運航実現に向け、安全基準、検査方法、船員の役割分担、責任・保険等を検討している。システムの安全性、運航会社の安全管理体制、船長・船員による安全運航の担保が不可欠とされており、リスクアセスメントに基づく検査、船員の教育訓練、実証運航による検証を通じて、制度化を進めている。","会議":"会議","isBookmarked":false,"_originalIndex":21},{"日付":"2025/06/05","開催日":"2025/06/03","タイトル名":"知的財産戦略本部（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/知的財産戦略本部会合.m4a","URL2":"https://www.kantei.go.jp/jp/singi/titeki2/250603/gijisidai.html","備考":"知的財産推進計画2025は、日本の競争力強化とIPトランスフォーメーションを目指す。AI活用や知財・無形資産投資、国際標準化、創造人材育成を重点に置き、技術流出防止や海賊版対策も強化する。新たな国際標準戦略ではAIや環境等で日本が主導を狙う。クールジャパン戦略は地方創生と連携し、海外展開50兆円を目標とし、デジタルアーカイブも推進する。","会議":"会議","isBookmarked":false,"_originalIndex":22},{"日付":"2025/06/05","開催日":"2025/06/03","タイトル名":"⼀般投資家の参加拡⼤を踏まえた不動産特定共同事業のあり⽅についての検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/不動産特定共同事業のあり方検討会.m4a","URL2":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/tochi_fudousan_kensetsugyo_tk5_000001_00034.html","備考":"不動産特定共同事業の一般投資家参加拡大を受け、国土交通省の検討会が開催された。投資家保護のため、情報開示の拡充、取引価格の公正性確保、行政監督の充実が議論され、業界団体が自主ルール策定や政策提言を進めている。","会議":"会議","isBookmarked":false,"_originalIndex":23},{"日付":"2025/06/06","開催日":"2025/06/05","タイトル名":"⽶の安定供給等実現関係閣僚会議（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/米安定供給実現関係閣僚会議.m4a","URL2":"https://www.kantei.go.jp/jp/singi/nousui/kome_anteikyokyujitsugen_kaigi/dai1/gijishidai.html","備考":"米価高騰により消費者の不安が高まっており、政府は米の安定供給と価格安定のため関係閣僚会議を設置した。備蓄米の迅速な売渡しや流通改善を図り、生産性向上を通じた持続的生産を推進する。会議では価格高騰要因の検証と短期・中長期の対応策が議論され、令和７年産米の生産見込みも示された。","会議":"会議","isBookmarked":false,"_originalIndex":24},{"日付":"2025/06/06","開催日":"2025/06/05","タイトル名":"⾦融審議会サステナビリティ情報の開⽰と保証のあり⽅に関するWG（金融庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/金融審議会サステナビリティ.m4a","URL2":"https://www.fsa.go.jp/singi/singi_kinyu/sustainability_disclose_wg/shiryou/20250605.html","備考":"金融庁は、有価証券報告書におけるサステナビリティ情報の保証制度構築を進めている。保証業務実施者には登録制度や質の高い業務管理体制が求められ、サステナビリティ情報は将来予測が多く、保証は限定的保証から開始する方針である。SSBJ基準の適用は2027年3月期から段階的に導入され、見積り情報の取り扱いについても検討が進められている。","会議":"会議","isBookmarked":false,"_originalIndex":25},{"日付":"2025/06/06","開催日":"2025/06/05","タイトル名":"副⾸都推進本部（⼤阪府市）会議（大阪）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/副首都推進本部会議.m4a","URL2":"https://www.city.osaka.lg.jp/fukushutosuishin/page/0000654373.html","備考":"令和7年6月5日開催の第16回副首都推進本部会議にて、夢洲第2期区域マスタープランVer.2.0（案）が議題となった。本案は約50haの大阪・関西万博跡地を国際観光拠点として整備する方針であり、大屋根リングや静けさの森など、万博のハードレガシー継承・活用を目指す。開発事業者募集は2025年度後半に開始される予定である。","会議":"会議","isBookmarked":false,"_originalIndex":26},{"日付":"2025/06/06","開催日":"2025/06/04","タイトル名":"総合科学技術・イノベーション会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/総合科学技術・イノベーション会議.m4a","URL2":"https://www8.cao.go.jp/cstp/siryo/haihui078/haihu-078.html","備考":"第77回総合科学技術・イノベーション会議は、第6期基本計画総仕上げと第7期を見据え、科学技術・イノベーション政策の方向性を議論した。AI、量子、フュージョンエネルギー等の重要技術推進、研究力・人材育成強化、イノベーションエコシステム形成、経済安全保障との連携、社会課題解決への貢献を強調した。","会議":"会議","isBookmarked":false,"_originalIndex":27},{"日付":"2025/06/06","開催日":"2025/06/04","タイトル名":"⽔際検疫の強化に向けた検討会（農林水産省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/水際検疫検討会.m4a","URL2":"https://www.maff.go.jp/j/syouan/douei/250324.html","備考":"家畜伝染病や病害虫の侵入リスク増大を受け、日本は食料安定供給のため水際検疫体制の強化を検討している。CIQ機関との連携強化、AIや探知犬の活用、制度の周知徹底、および国内での違法輸入物取締強化に向けた家畜伝染病予防法改正がその柱である。","会議":"会議","isBookmarked":false,"_originalIndex":28},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"経済財政諮問会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/経済財政諮問会議-2.m4a","URL2":"https://www5.cao.go.jp/keizai-shimon/kaigi/minutes/2025/0606agenda.html","備考":"経済財政諮問会議で議論された骨太方針2025原案は、賃上げを起点とした成長型経済の実現を掲げ、地方創生2.0や投資立国・資産運用立国を推進する方針である。また、人口減少下の経済社会の持続可能性と財政健全化を目指し、2025年度から2026年度にかけてプライマリーバランスの早期黒字化を目標としている。国民の安心・安全の確保にも取り組むとされている。","会議":"会議","isBookmarked":false,"_originalIndex":29},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"新しい資本主義実現会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/新しい資本主義実現会議.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/atarashii_sihonsyugi/kaigi/dai35/gijisidai.html","備考":"第35回新しい資本主義実現会議では、2025年改訂版案が決定された。本計画は、賃上げと投資がけん引する成長型経済の実現を目指し、2029年度までに実質賃金年1%上昇を社会通念として定着させる。具体的には、中小企業の賃金向上推進5か年計画に基づき、官民で60兆円の生産性向上投資を実現する。また、最低賃金は2020年代に全国平均1,500円達成に向けた努力を継続し、デフレ時代に固定化されたあらゆる制度の見直しを進めるとしている。","会議":"会議","isBookmarked":false,"_originalIndex":30},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"ワット・ビット連携官⺠懇談会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/ワット・ビット連携官民懇談会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/wattbit/02kiban04_04000346.html","備考":"ワット・ビット連携官民懇談会は、地方創生2.0実現のため、AI等のデジタル技術社会実装を支えるデータセンター（DC）の迅速かつ効率的な整備を目指している。既存電力インフラの最大限活用に加え、GW級の新たなDC集積拠点の形成、地方分散の推進、DC運用の高度化、そして省エネルギー化を官民連携で進める方針である。","会議":"会議","isBookmarked":false,"_originalIndex":31},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"デジタルライフライン全国総合整備実現会議・⾃動運転サービス⽀援道普及戦略WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタルライフライン全国総合整備実現会議・自動運転サービス支援道普及戦略WG.m4a","URL2":"https://www.meti.go.jp/policy/mono_info_service/digital_architecture/lifeline.html","備考":"デジタルライフライン全国総合整備計画は、人手不足解消のため、約10年で自動運転支援道を整備する計画である。第2回自動運転サービス支援道普及戦略ワーキンググループでは、高速道FOT、共同輸送、V2N技術検討、自動運転バスのサービス実装、安全性評価シミュレーションに関する25年度事業方針や課題を議論し、ロードマップが示された。","会議":"会議","isBookmarked":false,"_originalIndex":32},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"国⼟強靱化推進本部（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/国土強靱化推進本部.m4a","URL2":"https://www.kantei.go.jp/jp/singi/kokudo_kyoujinka/kaisai/dai23/index.html","備考":"令和７年６月６日、国土強靱化推進本部において、第１次国土強靱化実施中期計画（案）と国土強靱化年次計画２０２５が決定された。これは改正国土強靱化基本法等に基づく法定計画であり、５か年加速化対策に続くものである。計画期間は令和８年度から５年間で、事業規模はおおむね２０兆円強程度を目途とする。上下水道施設の戦略的維持管理・更新や防災庁の設置など、１１４の施策が特に必要として重点的・集中的に推進される。南海トラフ地震等の大規模災害に備え、災害情報や資機材の充実、避難所環境整備の早期完了を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":33},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"広域⼤規模災害を想定した放送サービスの維持・確保⽅策の充実・強化検討チーム（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/広域大規模災害を想定した放送サービスの維持・確保方策の充実・強化検討チーム.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_hososeido/02ryutsu08_04000589.html","備考":"広域大規模災害時の放送サービス維持・確保策を議論する検討チームの議事概要と論点整理案である。放送事業者と関係機関の連携強化、ネットワーク強靭化、ローカル局停波時の代替手段、被災者視聴環境確保など多岐にわたる課題が検討された。","会議":"会議","isBookmarked":false,"_originalIndex":34},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"ICTサービスの利⽤環境の整備に関する研究会・通信ログ保存のあり⽅に関するWG（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/誹謗中傷ログ保存の重要性.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/ICT_services/02kiban18_02000413.html","備考":"通信ログの保存期間が短いため、発信者情報開示請求が不奏功となる事例がある。郵送手続きの遅延や事業者側の事務負担も影響し、ログ期間経過で加害者を特定できない問題が生じている。警察はログ1年半保存で捜査上の障害が概ね解消されるとし、弁護士も期間延長を求めている。","会議":"会議","isBookmarked":false,"_originalIndex":35},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"ICTサービスの利⽤環境の整備に関する研究会・不適正利⽤対策に関するWG（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/不適正利用対策に関するWG.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/ICT_services/02kiban18_02000410.html","備考":"ICTサービスの利用環境における諸問題への対策が議論されている。SIMの不正転売、法人の在籍確認、他社の本人確認結果への依拠、追加回線、上限契約台数、データSIMといった課題が挙げられ、それぞれ詐欺防止や利便性の観点から効果的な対策が検討されている。","会議":"会議","isBookmarked":false,"_originalIndex":36},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"こども政策推進会議）（こども家庭庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/こども政策推進会議.m4a","URL2":"https://www.cfa.go.jp/councils/suishinkaigi/75cf51c2","備考":"「こどもまんなか実行計画2025」は、こども大綱に基づき、少子化や困難を抱えるこどもへの支援強化、質の高い育ちの環境提供、そして「こどもまんなか社会」の基礎となる環境づくりを重点に、政府一体でその実現を目指す計画である。","会議":"会議","isBookmarked":false,"_originalIndex":37},{"日付":"2025/06/09","開催日":"2025/06/06","タイトル名":"労働政策審議会・労働条件分科会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/労働条件分科会-議事次第.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_58588.html","備考":"本資料は、労働政策審議会労働条件分科会の議題と関連資料をまとめたものである。労働時間制度の実態調査結果が示され、賃金のデジタル払い制度の要件や利用状況が議論された。また、休日・連続勤務規制、勤務間インターバル、つながらない権利、年次有給休暇など、労働時間法制の課題が詳細に検討された。","会議":"会議","isBookmarked":false,"_originalIndex":38},{"日付":"2025/06/10","開催日":"2025/06/09","タイトル名":"ゲノムデータの個⼈識別性に関する検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/ゲノムデータ識別性検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_58644.html","備考":"ゲノムデータは個人情報保護法で個人識別符号に位置づけられるが、その識別性は多様であり、体細胞変異や一部の単一遺伝子疾患バリアントは識別性が低いとされる。包括的データの匿名化は困難なため、利活用促進にはガイドライン明確化、新法整備、社会受容性の向上が不可欠である。","会議":"会議","isBookmarked":false,"_originalIndex":39},{"日付":"2025/06/10","開催日":"2025/06/09","タイトル名":"デジタル時代における放送制度の在り⽅に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタル時代の放送制度検討会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_hososeido/02ryutsu07_04000536.html","備考":"本報告書は、デジタル時代の放送制度を検討するものである。テレビ視聴は減少しネット利用が増加する中、放送産業は広告収入減で経営が厳しく、特に地方局は困難に直面している。生活者は放送に信頼と役割を期待するが、情報空間の健全性や偽情報対策が課題である。諸外国の状況も踏まえ、放送の将来像と制度を再検討する必要がある。","会議":"会議","isBookmarked":false,"_originalIndex":40},{"日付":"2025/06/10","開催日":"2025/06/09","タイトル名":"社会保障審議会・福祉部会・福祉⼈材確保専⾨委員会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/福祉人材確保専門委員会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_58608.html","備考":"社会保障審議会福祉人材確保専門委員会は、喫緊の介護人材不足対策を議論。処遇改善、資格信頼性向上、キャリアパス明確化、多様な人材確保を提提言した。介護福祉士専門性活用、養成校支援、外国人材活用、職場環境改善が強調され、学生は待遇と実習経験を重視すると示された。","会議":"会議","isBookmarked":false,"_originalIndex":41},{"日付":"2025/06/12","開催日":"2025/06/11","タイトル名":"経済社会のデジタル化への対応と納税環境整備専門家会合（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタル税制・納税環境整備専門家会合.m4a","URL2":"https://www.cao.go.jp/zei-cho/gijiroku/digital-noukan/2025/7digital-noukan3kai.html","備考":"経済社会のデジタル化・グローバル化を踏まえ、専門家会合では、国境を越えたEC取引の適正課税と競争不均衡の是正、税務調査における資料提出拒否対策、事業者のデジタル化促進、e-Tax利用拡大、そして個人住民税の現年課税化の課題と対応が検討された。","会議":"会議","isBookmarked":false,"_originalIndex":42},{"日付":"2025/06/12","開催日":"2025/06/11","タイトル名":"産業構造審議会通商・貿易分科会不公正貿易政策・措置調査⼩委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/貿易分科会不公正貿易政策・措置小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/tsusho_boeki/fukosei_boeki/report_2025/index.html","備考":"2025年版不公正貿易報告書を受け、日本はWTO紛争解決制度の機能不全に対し、MPIA活用等で対応している。多角的自由貿易体制を維持するため、非市場的措置や経済的威圧への懸念をG7等で共有。中国の輸出管理法や米国の追加関税、EUの環境規制など個別案件について、二国間・多国間協議やWTO紛争解決手続を通じて問題解決とルール形成を推進している。","会議":"会議","isBookmarked":false,"_originalIndex":43},{"日付":"2025/06/12","開催日":"2025/06/11","タイトル名":"産業構造審議会通商・製造産業分科会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/産業構造審議会・製造産業分科会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/seizo_sangyo/018.html","備考":"産業構造審議会は、過去10年で日本のGDPシェア半減や国際的な産業政策競争の激化など、国際情勢と国内経済の潮目の変化を受け、製造業政策を議論する。GX、経済安全保障、DX、航空・宇宙といった先端分野を重点とし、予算増額や制度整備で政策を強化している。今後の国際情勢下での重要政策や官民協力のあり方が論点である。","会議":"会議","isBookmarked":false,"_originalIndex":44},{"日付":"2025/06/12","開催日":"2025/06/11","タイトル名":"総合資源エネルギー調査会資源・燃料分科会カーボンマネジメント⼩委員会CCS事業の⽀援措置に関するWG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/CCSパイプライン支援WG.m4a","URL2":"https://www.meti.go.jp/shingikai/enecho/shigen_nenryo/carbon_management/ccs_wg/005.html","備考":"CCS事業の支援措置中間整理である。脱炭素困難分野に不可欠だが予見性が低いため、CCSコストとCO2対策コストの差に着目した支援が検討されている。分離回収と輸送貯留が支援対象で、輸送貯留料金はオークションで決まる。中長期の支援で自立化を促し、クロスチェーンリスクにも対応。2026年度投資決定、2030年代初頭の事業開始を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":45},{"日付":"2025/06/12","開催日":"2025/06/11","タイトル名":"グリーン製品の需要創出等によるバリューチェーン全体の脱炭素化に向けた検討会（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/グリーン製品の需要創出等によるバリューチェーン全体の脱炭素化に向けた検討会.m4a","URL2":"https://www.env.go.jp/council/valuechain_decarbonization/page_03.html","備考":"グリーン製品の需要創出等によるバリューチェーン全体の脱炭素化に向けた検討会は、供給側の投資と需要側の購買が好循環する市場形成が不可欠であると考える。中小企業の排出量算定・データ連携負担、消費者の情報不足や価格抵抗、購買行動への結びつきの弱さ等が課題である。CFP等の「見える化」、認証・ラベル活用、サプライチェーン連携、消費者教育・啓発、インセンティブ付与、価格転嫁などが対策方向性として議論されており、企業の取り組みが報われる仕組みの構築が特に重要である。","会議":"会議","isBookmarked":false,"_originalIndex":46},{"日付":"2025/06/12","開催日":"2025/06/11","タイトル名":"介護保険福祉⽤具・住宅改修評価検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/介護保険福祉用具・住宅改修評価検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_58606.html","備考":"介護保険制度は、要介護者等が居宅で自立した生活を送るため、福祉用具の貸与・販売や住宅改修に保険給付を行う制度である。対象品目や改修種類、支給限度額は定められており、利用者の状況に応じた計画に基づき提供される。現在、通信機能を備えた福祉用具の給付対象範囲が見直されており、利用者の安全確保や適切な使用に資する機能が検討されているが、通信費用等は給付対象外である。","会議":"会議","isBookmarked":false,"_originalIndex":47},{"日付":"2025/06/12","開催日":"2025/06/10","タイトル名":"国家戦略特別区域諮問会議（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/国家戦略特区諮問会議.m4a","URL2":"https://www.chisou.go.jp/tiiki/kokusentoc/dai66/shiryou.html","備考":"地方創生2.0に向け、国家戦略特区制度は地方の課題を起点とする大胆な規制改革のため再起動された。令和6年度指定区域の評価が行われ、東京圏には千葉県全域が追加され、スーパーシティのつくば市と大阪府・大阪市も区域方針を改定した。特区制度と連携したGX産業立地政策の推進が図られ、ドローンや水素など多岐にわたる規制改革が進められている。成果の全国普遍化や提案から方針決定までの期間の短縮、新たなチャレンジへのサポート強化が図られている。","会議":"会議","isBookmarked":false,"_originalIndex":48},{"日付":"2025/06/13","開催日":"2025/06/11","タイトル名":"地理空間情報活用推進会議（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/地理空間情報活用推進会議.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/sokuitiri/20250611/index.html","備考":"令和7年6月11日の地理空間情報活用推進会議では、地理空間情報の社会実装を加速する「地理空間情報の活用推進に関する行動計画（G空間行動プラン）2025（案）」と、技術・法制度変化に対応し二次利用を促進する「地理空間情報の二次利用促進に関するガイドライン」の一部改正案が主要議題であった。新プランは国際展開や産業活性化を拡充し、改正ガイドラインはオープンデータ原則や著作権法の写り込み規定等を反映したものである。。","会議":"会議","isBookmarked":false,"_originalIndex":49},{"日付":"2025/06/13","開催日":"2025/06/12","タイトル名":"東京都税制調査会・小委員会（東京都）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/都税制調査会小委員会.m4a","URL2":"https://www.tax.metro.tokyo.lg.jp/basic/report/material/r07/tzc_r7_2","備考":"東京都税制調査会第1回小委員会は、令和7年6月12日に開催された。不安定な国際情勢や少子高齢化・人口減少等の社会経済変化を受け、地方税財源の拡充と安定的な税体系のあり方を念頭に、個人所得課税（「ふるさと納税」、二地域居住等）と高齢化と税制について検討が行われたものである。","会議":"会議","isBookmarked":false,"_originalIndex":50},{"日付":"2025/06/13","開催日":"2025/06/12","タイトル名":"厚生科学審議会・臨床研究部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/厚生科学審議会・臨床研究部会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_58747.html","備考":"第43回厚生科学審議会臨床研究部会では、「治験・臨床試験の推進に関する今後の方向性について2025年版とりまとめ（案）」を審議した。これは、国際競争力のある治験・臨床試験体制の強化、症例集積力の向上、手続きの効率化、コストの透明化、研究従事者や研究支援人材の育成・インセンティブ、国民・患者の理解・参画促進を主要な柱とするものである。また、臨床研究中核病院の今後のあり方も見直す方針が示された。これらを通じ、日本の創薬力向上と医療全体の発展を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":51},{"日付":"2025/06/13","開催日":"2025/06/11","タイトル名":"特定技能制度及び育成就労制度の基本方針及び分野別運用方針に関する有識者会議（法務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/特定技能・育成就労制度有識者会議議事.m4a","URL2":"https://www.moj.go.jp/isa/03_00143.html","備考":"特定技能・育成就労制度における受入れ対象分野の拡大と詳細を示すものである。リネンサプライ、物流倉庫、資源循環といった新分野が追加され、工業製品製造業、鉄道、航空、自動車整備、飲食料品製造業などで業務範囲が拡大または切り分けられる。各分野では高齢化や若年層の敬遠等により深刻な人手不足に直面しており、生産性向上、国内人材確保、労働環境改善の取り組みが強化されている。特にバス・タクシー運転者については日本語能力要件の緩和が提案されており、これに伴い関連する技能評価試験も新規整備・変更される予定である。","会議":"会議","isBookmarked":false,"_originalIndex":52},{"日付":"2025/06/13","開催日":"2025/06/12","タイトル名":"関税・外国為替等審議会・関税分科会・急増する少額輸⼊貨物への対応に関するWG（財務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/少額輸入貨物ワーキンググループ.m4a","URL2":"https://www.mof.go.jp/about_mof/councils/syogakuyunyuwg/syogakuyunyuwg_gijihaihu/index.html","備考":"少額輸入貨物の現状と課題に関する資料の本体は、少額貨物増加による水際取締り上の懸念を背景に、輸入貨物の課税制度の概要と課題、そして少額貨物増加により生じる水際取締り上の課題の三部で構成されている。","会議":"会議","isBookmarked":false,"_originalIndex":53},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"新しい地方経済・生活環境創生本部（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/新しい地方経済・生活環境創生本部.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/atarashii_chihousousei/honbukaigi/dai4/gijisidai.html","備考":"令和7年6月13日、新しい地方経済・生活環境創生本部第4回会議が開かれた。今後10年間を見据えた「地方創生2.0基本構想」が取りまとめられた。人口減少を正面から受け止め、「民」の力を最大限に活かす官民連携を強化し、「令和の日本列島改造」として持続可能な「稼げる地方」と「新しい日本・楽しい日本」の実現を目指している。","会議":"会議","isBookmarked":false,"_originalIndex":54},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"次世代電⼒・ガス事業基盤構築⼩委員会・電⼒システム改⾰の検証を踏まえた制度設計WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/電力システム改革の検証を踏まえた制度設計WG.m4a","URL2":"https://www.meti.go.jp/shingikai/enecho/denryoku_gas/jisedai_kiban/system_design_wg/001.html","備考":"「電力システム改革の検証を踏まえた制度設計WG」では、電力システム改革の成果と課題が議論された。広域融通や需要家の選択肢拡大は進んだ一方、供給力不足や価格変動が顕在化している。今後は安定供給、脱炭素化、安定価格の実現を目指し、燃料確保、系統整備、市場改革、小売事業者の責任、投資ファイナンスなど多岐にわたる制度設計を検討する。","会議":"会議","isBookmarked":false,"_originalIndex":55},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"取引デジタルプラットフォーム官⺠協議会（消費者庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/取引デジタルプラットフォーム官民協議会.m4a","URL2":"https://www.caa.go.jp/policies/policy/consumer_transaction/meeting_materials/review_meeting_003/042528.html","備考":"取引デジタルプラットフォーム消費者保護法の運用状況が報告された。法第3条・5条の事業者努力義務は着実に進展し、法第4条に基づく虚偽表示対策も実施された。CtoC取引では多くの「隠れB」が推定され、フリマサービス関連の消費者相談が多数を占める。これを受け、ガイドライン改正により「販売業者等」の判断基準が明確化された。","会議":"会議","isBookmarked":false,"_originalIndex":56},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"ファミリービジネスのガバナンスの在り方に関する研究会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/ファミリービジネス研究会.m4a","URL2":"https://www.meti.go.jp/shingikai/economy/family_business/002.html","備考":"ファミリービジネスのガバナンスに関する研究会は、成長志向の非上場中堅・中小企業向けに規範策定を進めている。これはファミリービジネスの強みを生かし課題に対応することを目的とし、理念・価値観、公私混同防止、事業承継を基本項目とする。意思決定の仕組みや従業員への情報発信も任意項目として重要である。","会議":"会議","isBookmarked":false,"_originalIndex":57},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"科学技術・学術審議会・宇宙開発利⽤部会・国際宇宙ステーション・国際宇宙探査⼩委員会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/宇宙開発利用部会委員名簿.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu2/071/shiryo/1420983_00036.htm","備考":"宇宙開発利用部会国際宇宙ステーション・国際宇宙探査小委員会は、国際宇宙ステーション（ISS）の運用延長、ポストISSの地球低軌道活動、アルテミス計画等の国際宇宙探査を推進している。日本は、民間主導の地球低軌道利用と有人月面探査に注力し、宇宙戦略基金も活用しながら、長期的な宇宙活動シナリオを策定中である。","会議":"会議","isBookmarked":false,"_originalIndex":58},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"科学技術・学術審議会・海洋開発分科会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/科学技術・学術審議会・海洋開発分科会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu5/siryo/1421827_00015.html","備考":"科学技術・学術審議会海洋開発分科会では、深海・海溝域の探査・採取プラットフォーム構築、JAMSTECの深海探査システム老朽化対策と新探査機開発、海洋・地球科学分野における質量分析技術報告、及びJpGU2025報告と分科会スケジュールが審議された。","会議":"会議","isBookmarked":false,"_originalIndex":59},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"産業構造審議会・知的財産分科会・商標制度⼩委員会（特許庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/産業構造審議会・知的財産分科会・商標制度小委員会.m4a","URL2":"https://www.jpo.go.jp/resources/shingikai/sangyo-kouzou/shousai/shohyo_shoi/t_mark_paper12new.html","備考":"特許庁は、公報におけるプライバシー保護のため、出願人等の住所概略表記への制度改正を検討している。商標制度では、出願件数が減少傾向にあり、インターネット上の越境使用、仮想空間での保護、生成AIによる商標の扱いについて、現行制度で一定の整理が可能であると示された。","会議":"会議","isBookmarked":false,"_originalIndex":60},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"東日本大震災復興構想会議・復興推進委員会（復興庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/復興推進委員会.m4a","URL2":"https://www.reconstruction.go.jp/topics/main-cat7/sub-cat7-2/20250609164826.html","備考":"復興推進委員会は福島、岩手、宮城の復興現状と課題を議論した。特に福島原子力災害被災地域では、廃炉、帰還・移住促進、産業再生、風評払拭に国が前面に立ち、長期的な支援が必要である。第3期復興・創生期間の方針と財源も提示された。","会議":"会議","isBookmarked":false,"_originalIndex":61},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"国土交通省DX推進本部（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/国土交通省DXビジョン.m4a","URL2":"https://www.mlit.go.jp/sogoseisaku/jouhouka/sosei_jouhouka_tk1_000029.html","備考":"国土交通省DXビジョンは、2025年6月11日に策定された。AI・IoT等のデジタル技術を活用し、行政サービスのデジタル化、データを活用したEBPM、オープンイノベーションを強化。国民の安全・安心確保、持続的な経済成長、個性をいかした地域づくり・分散型国づくりを実現する羅針盤である。","会議":"会議","isBookmarked":false,"_originalIndex":62},{"日付":"2025/06/16","開催日":"2025/06/12","タイトル名":"医療インバウンドの適切な推進の在り⽅に関する検討会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/医療インバウンドの適切な推進の在り方に関する検討会.m4a","URL2":"https://www.meti.go.jp/shingikai/mono_info_service/medical_inbound/20250612_report.html","備考":"日本の医療機関経営が悪化する中、医療インバウンド推進は経営基盤強化や医療提供体制の持続可能性確保に不可欠である。しかし、現状は海外先進国に比べ医療渡航者数が著しく少なく、政府の推進体制や戦略が不足している状況である。医療滞在ビザの手続きの複雑さや医療機関の価格設定、公的保険加入に関する課題も存在する。今後は、国民医療への悪影響を避けつつ、「日本WAY」を構築するため、政府主導のマーケティング強化やモデル医療機関の特定・支援、関係省庁連携による制度改善を進める必要がある。","会議":"会議","isBookmarked":false,"_originalIndex":63},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"デジタル行財政改革会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタル行財政改革への提言.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/digital_gyozaikaikaku/kaigi11/gijishidai11.html","備考":"第11回デジタル行財政改革会議は、デジタル行財政改革取りまとめ2025とデータ利活用制度の基本方針を決定した。地方創生2.0加速、各分野でのDX推進と規制見直し、データとAIの好循環社会構築が三本柱である。自治体情報システムの標準化・ガバメントクラウド移行後の運用経費増加への総合対策も議論された。","会議":"会議","isBookmarked":false,"_originalIndex":64},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"経済財政諮問会議（骨太の方針2025）（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/経済財政諮問会議.m4a","URL2":"https://www5.cao.go.jp/keizai-shimon/kaigi/minutes/2025/0613agenda.html","備考":"経済財政運営と改革の基本方針2025（案）は、新しい資本主義の実現を目指し、賃上げを起点とした成長型経済への移行を主眼としている。また、地方創生2.0の推進や投資・資産運用立国の強化、人口減少下における持続可能な経済社会の構築、国民の安心・安全の確保も基本方針として掲げている。","会議":"会議","isBookmarked":false,"_originalIndex":65},{"日付":"2025/06/16","開催日":"2025/06/13","タイトル名":"新しい資本主義実現会議(新しい資本主義のグランドデザイン及び実行計画2025)（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/新しい資本主義実現会議-1.m4a","URL2":"https://www5.cao.go.jp/keizai-shimon/kaigi/minutes/2025/0613agenda.html","備考":"「新しい資本主義のグランドデザイン及び実行計画2025年改訂版（案）」は、デフレからの完全脱却と賃上げ・投資が牽引する成長型経済への移行を目指すものである。2029年度までに実質賃金年1%上昇のノルム（社会通念）定着を図り、中小企業支援、投資立国、人への投資、資産運用立国、地方経済高度化などを官民連携で推進する。","会議":"会議","isBookmarked":false,"_originalIndex":66},{"日付":"2025/06/17","開催日":"2025/06/16","タイトル名":"中央教育審議会・初等中等教育分科会・教育課程部会・教育課程企画特別部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/教育課程企画特別部会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo3/101/siryo/mext_00009.html","備考":"文部科学省の教育課程企画特別部会における、余白の創出を通じた教育の質の向上、持続可能な学校の実現、柔軟な教育課程編成、教員の働き方改革、ICT活用、個別最適・協働的学習の推進に関する議論をまとめたものである。","会議":"会議","isBookmarked":false,"_originalIndex":67},{"日付":"2025/06/18","開催日":"2025/06/17","タイトル名":"ダイビング船の安全対策検討委員会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/ダイビング船安全対策ガイドライン検討委員会.m4a","URL2":"https://www.mlit.go.jp/maritime/maritime_mn6_000027.html","備考":"国土交通省の委員会は、海難事故多発を受け、ダイビング船の運航判断、緊急対応、器材積載、船舶検査等の安全対策ガイドライン案を検討した。関係者が「安全最優先」を徹底し、ボートダイビングの安全な発展を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":68},{"日付":"2025/06/18","開催日":"2025/06/17","タイトル名":"文化審議会・文化施設部会・博物館WG（文化庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/博物館WG.m4a","URL2":"https://www.bunka.go.jp/seisaku/bunkashingikai/bunka_shisetsu/hakubutukan_working/02/02/index.html","備考":"文化審議会博物館WG第2回会議で、博物館の設置・運営基準改正案を議論した。健全な発展と地域貢献に向け、経営、資料管理、展示、調査研究、職員育成など運営全般の強化を提示した。財政・人材不足やデジタル化の遅れが課題である。","会議":"会議","isBookmarked":false,"_originalIndex":69},{"日付":"2025/06/18","開催日":"2025/06/17","タイトル名":"国土審議会・北海道開発分科会・計画推進部会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/北海道開発計画推進部会.m4a","URL2":"https://www.mlit.go.jp/policy/shingikai/hok01_sg_000143.html","備考":"国土審議会北海道開発分科会計画推進部会は、第9期北海道総合開発計画の推進を審議した。同計画は2024年度から約10年間、北海道の価値を最大化し国の課題解決に貢献する。官民共創、DX・GX推進を柱とし、68の指標で進捗を管理する。","会議":"会議","isBookmarked":false,"_originalIndex":70},{"日付":"2025/06/18","開催日":"2025/06/17","タイトル名":"農林水産物・食品輸出本部会合（農林水産省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/農林水産物・食品輸出本部.m4a","URL2":"https://www.maff.go.jp/j/shokusan/hq/i-2/index-3.html","備考":"農林水産物・食品輸出本部は、令和7年6月17日に会合を開き、基本方針と実行計画の変更を決定した。これは、改訂された「輸出拡大実行戦略」を反映したものであり、2030年までに輸出額5兆円、食品産業の海外収益3兆円、インバウンド食関連消費4.5兆円の達成を目指す。そのために「海外から稼ぐ力」を強化し、輸出構造の強靭化やマーケットインへの転換等を推進する方針である。","会議":"会議","isBookmarked":false,"_originalIndex":71},{"日付":"2025/06/18","開催日":"2025/06/17","タイトル名":"財政制度等審議会・国有財産分科会（財務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/財政制度等審議会・国有財産分科会.m4a","URL2":"https://www.mof.go.jp/about_mof/councils/fiscal_system_council/sub-of_national_property/proceedings_np/material/zaisan20250617.html","備考":"国有財産の管理・処分に関する現状と課題、今後の対応方向を示すものである。相続土地国庫帰属の急増、留保財産の運用の円滑化、老朽化する庁舎や国家公務員宿舎の最適化、国有財産監査結果と改善策、処分価格客観性の確保等が報告された。また、株式会社商工組合中央金庫の株式処分についても言及されている。","会議":"会議","isBookmarked":false,"_originalIndex":72},{"日付":"2025/06/18","開催日":"2025/06/17","タイトル名":"国立大学法人等の機能強化に向けた検討会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/国立大学機能強化検討会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/koutou/128/siryo/mext_00009.html","備考":"国立大学法人等の機能強化に向けた検討をまとめている。法人化後20年の財務・人事・組織改革の現状を分析し、社会の大きな転換期に対応するため、ガバナンス強化、財源多様化、教育研究の質向上、再編統合、高度人材育成等を通じ、未来志向の経営体への変革を推進する必要があると示されている。","会議":"会議","isBookmarked":false,"_originalIndex":73},{"日付":"2025/06/19","開催日":"2025/06/18","タイトル名":"防災・減災対策本部（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/防災・減災対策本部.m4a","URL2":"https://www.mlit.go.jp/river/bousai/bousai-gensaihonbu/12kai/index.html","備考":"令和7年6月18日の国土交通省防災・減災対策本部会議は、「令和7年度総力戦で挑む防災・減災プロジェクト」と「国土交通省防災業務計画の修正」を決定した。能登半島地震を踏まえ、災害対応力強化のための体制強化と多様な主体との連携推進がプロジェクトのテーマである。業務計画は、迅速な被害認定調査連携、上下水道一体対応、道路被害情報収集強化等を盛り込み修正された。","会議":"会議","isBookmarked":false,"_originalIndex":74},{"日付":"2025/06/19","開催日":"2025/06/18","タイトル名":"科学技術・学術審議会・大学研究力強化部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/大学研究力強化部会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu35/index.html","備考":"科学技術・学術審議会大学研究力強化部会第1回は、大学研究力強化と多様な研究大学群形成を議論した。国際卓越研究大学の申請状況を共有し、連携拡大、人材国際循環、世界水準大学実現、地域大学振興を検討課題とした。","会議":"会議","isBookmarked":false,"_originalIndex":75},{"日付":"2025/06/19","開催日":"2025/06/18","タイトル名":"メタネーション推進官民協議会（資源エネルギー庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/メタネーション推進協議会.m4a","URL2":"https://www.meti.go.jp/shingikai/energy_environment/methanation_suishin/014.html","備考":"ガス業界は「ガスビジョン2050」と「アクションプラン2030」を策定し、e-メタンやバイオガスを中心に2050年カーボンニュートラル化を目指す。既存インフラを活用しつつ、安全・安定供給、レジリエンス強化、革新的技術開発、国際連携、クリーンガス証書による環境価値移転を推進している。","会議":"会議","isBookmarked":false,"_originalIndex":76},{"日付":"2025/06/19","開催日":"2025/06/18","タイトル名":"金融庁AI官民フォーラム（金融庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/AI官民フォーラム.m4a","URL2":"https://www.fsa.go.jp/singi/ai_forum/siryou/20250618.html","備考":"金融庁は金融分野でのAI利活用推進のため、AI官民フォーラムを開催した。金融機関は業務効率化等にAIを活用する一方、情報漏洩やハルシネーション、法規制などの課題を抱える。フォーラムでは規制明確化や事例共有を通じて健全な活用を後押し、AIディスカッションペーパーの更新を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":77},{"日付":"2025/06/19","開催日":"2025/06/18","タイトル名":"デジタル行財政改革会議・データ利活用制度・システム検討会（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/データ利活用制度検討会.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/digital_gyozaikaikaku/data12/data12.html","備考":"「データ利活用制度の在り方に関する基本方針」は、人口減少を克服し豊かな社会を実現するため、データとAIの社会実装を推進するものである。信頼性確保、データ連携基盤・標準化の推進、データ提供インセンティブ確保が重要であり、医療や金融等の個別分野での改革も進められる。次期通常国会での法改正を目指すとしている。","会議":"会議","isBookmarked":false,"_originalIndex":78},{"日付":"2025/06/19","開催日":"2025/06/18","タイトル名":"2040年を見据えて社会とともに歩む私立大学の在り方検討会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/2040年を見据えて社会とともに歩む私立大学の在り方検討会議.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/koutou/132/siryo/mext_00005.html","備考":"日本の国際競争力強化には私立大学の研究力向上が不可欠である。理系人材育成や学術研究で重要な役割を担うが、国立大学との財政格差や若手研究者支援に課題がある。産学連携や研究基盤整備への抜本的支援が必要である。","会議":"会議","isBookmarked":false,"_originalIndex":79},{"日付":"2025/06/20","開催日":"2025/06/19","タイトル名":"デジタル時代における放送制度の在り方に関する検討会・放送・配信コンテンツ産業戦略検討チーム（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタル時代における放送制度の在り方に関する検討会・放送・配信コンテンツ産業戦略検討チーム.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_hososeido/02ryutsu04_04000278.html","備考":"総務省の「放送・配信コンテンツ産業戦略検討チーム」は、市場変化に対応し、国内産業の競争力強化と海外展開を推進するため、企画・製作・権利処理・流通・人材・DXの課題と官民連携の対応策を議論し、好循環の実現を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":80},{"日付":"2025/06/20","開催日":"2025/06/19","タイトル名":"産業構造審議会・グリーンイノベーションプロジェクト部会・グリーン電力の普及促進等分野WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/産業構造審議会・グリーンイノベーションプロジェクト部会・グリーン電力の普及促進等分野WG.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/green_innovation/green_power/011.html","備考":"産業構造審議会グリーンイノベーションプロジェクト部会では、廃棄物・資源循環分野のカーボンニュートラル実現を目指している。この目的のため、日鉄エンジニアリング株式会社、カナデビア株式会社、JFEエンジニアリング株式会社、水ingエンジニアリング株式会社などの企業が、CO2分離回収を前提とした廃棄物焼却処理、高効率熱分解処理、高効率バイオメタン転換などの技術開発を進めている。プロジェクトは概ね計画通りに進捗しており、ラボ試験や小型実証設備の建設が進められている。社会実装に向けた取り組みも進められており、経営者によるコミットメントの確認や事業推進体制の確保、モニタリングが実施されている。また、必要に応じて改善点の指摘や事業中止に関する意見の決議も行われる。","会議":"会議","isBookmarked":false,"_originalIndex":81},{"日付":"2025/06/20","開催日":"2025/06/19","タイトル名":"グリーンファイナンスに関する検討会（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/グリーンファイナンスに関する検討会.m4a","URL2":"https://www.env.go.jp/page_00007.html","備考":"環境省の第14回グリーンファイナンス検討会は、国内グリーンファイナンス市場の急速な成長動向、米国の気候変動・関税政策、EUのサステナビリティ規制簡素化提案、そしてグリーンローン原則などの国際原則改訂について議論された。また、中長期的な市場発展に向けた報告案が検討された。","会議":"会議","isBookmarked":false,"_originalIndex":82},{"日付":"2025/06/20","開催日":"2025/06/19","タイトル名":"デジタル社会における消費取引研究会（消費者庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタル社会における消費取引研究会.m4a","URL2":"https://www.caa.go.jp/policies/policy/consumer_transaction/meeting_materials/review_meeting_004/","備考":"デジタル社会における消費取引研究会は、デジタル化が進む消費取引の現状と課題を分析した。EC市場拡大やAI技術の進化により、取引は複雑化し、従来の法規制では対応が困難な問題が顕在化している。消費者の相対的脆弱性、情報の価値化、取引形態の変容を踏まえ、信頼基盤の整備、消費者被害を防ぐためのデジタル活用、適応型ルール形成、行政のデジタル対応力強化の必要性が提言された。","会議":"会議","isBookmarked":false,"_originalIndex":83},{"日付":"2025/06/20","開催日":"2025/06/19","タイトル名":"自動車整備技術の高度化検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/自動車整備技術の高度化検討会.m4a","URL2":"https://www.mlit.go.jp/jidosha/jidosha_tk9_000023.html","備考":"自動車整備技術の高度化を目指し、OBD情報提供の新ルール案が策定された。これは第三者機関が自動車メーカーから情報を一元購入・提供し、汎用スキャンツールの開発と機能向上を促すことをねらいとしている。また、整備マニュアルの提供における課題解決や、自動車整備士の働きやすい職場環境の改善も検討が進められている。","会議":"会議","isBookmarked":false,"_originalIndex":84},{"日付":"2025/06/23","開催日":"2025/06/20","タイトル名":"経済社会情勢の変化に対応したキャリアコンサルティングの実現に関する研究会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/経済社会情勢の変化に対応したキャリアコンサルティングの実現に関する研究会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_58999.html","備考":"「経済社会情勢の変化に対応したキャリアコンサルティングの実現に関する研究会」第5回会合で中間とりまとめ案を検討した。キャリアコンサルタントが変化に対応し活躍できるよう、キャリア自律支援能力、企業内支援、能力開発促進、活用促進策が議論された。","会議":"会議","isBookmarked":false,"_originalIndex":85},{"日付":"2025/06/23","開催日":"2025/06/20","タイトル名":"有料老人ホームにおける望ましいサービス提供のあり方に関する検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/有料老人ホームにおける望ましいサービス提供のあり方に関する検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59007.html","備考":"有料老人ホーム検討会は、サービスの質確保、利用者選択の適正化、紹介事業の透明化、指導監督強化を議論した。特に「囲い込み」や不透明な紹介料が課題であり、高齢者の尊厳ある生活と安全確保のため、現行制度の見直しが求められている。","会議":"会議","isBookmarked":false,"_originalIndex":86},{"日付":"2025/06/23","開催日":"2025/06/20","タイトル名":"サステナブルファイナンス有識者会議（金融庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/サステナブルファイナンス有識者会議.m4a","URL2":"https://www.fsa.go.jp/singi/sustainable_finance/siryou/20250620.html","備考":"金融庁サステナブルファイナンス有識者会議の第五次報告書案は、持続可能な社会実現へサステナブルファイナンス推進の意義を再確認した。幅広い投資家、特に個人のサステナビリティ投資に関する認知・理解不足や投資方法の不明瞭さが課題とされた。今後、認知向上とサステナビリティ投資商品の組成・提供における更なる取組を進めることが示唆されている。","会議":"会議","isBookmarked":false,"_originalIndex":87},{"日付":"2025/06/23","開催日":"2025/06/20","タイトル名":"オンラインカジノに係るアクセス抑止の在り方に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/オオンラインカジノに係るアクセス抑止の在り方に関する検討会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/online_casino/02kiban18_02000418.html","備考":"オンラインカジノの深刻な弊害に対し、アクセス抑止策が包括的に検討されている。特にブロッキングは、通信の秘密や知る自由を制約するため、他の対策を尽くした上での必要性、得られる利益と失われる利益の均衡、法的安定性確保のための新規立法、および独立機関の関与を含む適切な枠組みを、4つのステップで検証すべきであるとされている。ブロッキングには技術的回避策が指摘される一方、依存症の予防効果も期待されている。","会議":"会議","isBookmarked":false,"_originalIndex":88},{"日付":"2025/06/23","開催日":"2025/06/20","タイトル名":"航空機製造事業法における無人機規制の在り方に関する検討会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/航空機製造事業法における無人機規制の在り方に関する検討会.m4a","URL2":"https://www.meti.go.jp/shingikai/mono_info_service/mujinki_kisei/004.html","備考":"航空機製造事業法における無人機規制検討会の第4回会議では、空飛ぶクルマ等の電動航空機量産を見据え、電動機を新たな航空機用機器に追加し、その製造・修理に必要な特定設備を定める方針が議論された。バッテリーは今後の検討課題である。省令改正は2025年9月を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":89},{"日付":"2025/06/23","開催日":"2025/06/20","タイトル名":"関税・外国為替等審議会・関税分科会・特殊関税部会（財務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/関税・外国為替等審議会・関税分科会・特殊関税部会.m4a","URL2":"https://www.mof.go.jp/about_mof/councils/customs_foreign_exchange/sub-of_customs/proceedings_tokusyu/material/kanb20250620.html","備考":"中国産黒鉛電極に対する不当廉売関税の課税について調査が行われた。その結果、中国からの不当廉売輸入の事実、本邦産業への実質的な損害、および両者の因果関係が認められた。これにより、税率95.2%の不当廉売関税を5年間課すことが妥当と結論付けられた。","会議":"会議","isBookmarked":false,"_originalIndex":90},{"日付":"2025/06/23","開催日":"2025/06/20","タイトル名":"医療用医薬品の流通改善に関する懇談会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/医療用医薬品流通改善懇談会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_58986.html","備考":"医療用医薬品の流通改善に関する懇談会では、改訂ガイドラインに基づく取引状況が議論された。単品単価交渉は個別では進んだが、一括交渉では低い状況である。返品や急配は改善が見られたが、頻繁な価格交渉や流通コストの理解には依然として課題が残ることが報告された。","会議":"会議","isBookmarked":false,"_originalIndex":91},{"日付":"2025/06/24","開催日":"2025/06/23","タイトル名":"グリーン社会実現推進本部（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/グリーン社会実現推進本部.m4a","URL2":"https://www.mlit.go.jp/sogoseisaku/environment/sosei_environment_fr_000148.html","備考":"国土交通省は環境行動計画を改定し、脱炭素、自然共生、循環経済、気候変動適応を重点に掲げた。徹底した省エネ・クリーンエネルギー移行、再生資源利用、グリーンインフラ活用などを通じ、グリーン社会実現を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":92},{"日付":"2025/06/24","開催日":"2025/06/23","タイトル名":"産業構造審議会・イノベーション・環境分科会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/産業構造審議会・イノベーション・環境分科会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sangyo_gijutsu/016.html","備考":"産業構造審議会イノベーション・環境分科会では、科学とビジネスの近接化時代におけるイノベーション推進、日本の科学力向上、スタートアップ支援、戦略技術分野への一気通貫支援を議論した。また、GX政策として脱炭素化と経済成長の両立を目指し、カーボンプライシングやGX経済移行債、資源循環経済政策を推進することが示された。","会議":"会議","isBookmarked":false,"_originalIndex":93},{"日付":"2025/06/24","開催日":"2025/06/23","タイトル名":"中堅企業・中小企業・小規模事業者の活力向上のための関係省庁連絡会議・中堅企業等の成長促進に関するWG（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/中堅企業等の成長促進に関するWG.m4a","URL2":"https://www.kantei.go.jp/jp/singi/katsuryoku_kojyo/seichou_sokushin_wg/dai10/gijisidai.html","備考":"2025年6月23日開催のWGでは、中堅企業等地域円卓会議の開催報告と、成長促進パッケージの周知状況が報告された。地域への波及効果が大きい企業を重点支援企業として選定する体制が構築され、その選定基準案も提示された。選定企業は売上高10億円以上、従業員2,000人以下で、地域経済への貢献度と雇用の質が重視される。支援期間は5年間である。","会議":"会議","isBookmarked":false,"_originalIndex":94},{"日付":"2025/06/24","開催日":"2025/06/23","タイトル名":"デジタル空間における情報流通の諸課題への対処に関する検討会・デジタル空間における情報流通に係る制度WG（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタル空間情報流通制度WG.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_shokadai/02ryutsu02_04000554.html","備考":"総務省制度WGは、デジタル空間の違法・有害情報対策を議論した。情プラ法に基づき、権利侵害情報への迅速対応を強化。法令違反情報への行政要請対応や免責、有害情報の違法化も検討。サービス設計では、リスク軽減策、情報表示透明化、本人確認のあり方が論点となった。","会議":"会議","isBookmarked":false,"_originalIndex":95},{"日付":"2025/06/24","開催日":"2025/06/23","タイトル名":"インターネットの利用を巡る青少年の保護の在り方に関するWG（こども家庭庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/インターネットの利用を巡る青少年の保護の在り方に関するWG.m4a","URL2":"https://www.cfa.go.jp/councils/internet-kaigi/746a851e","備考":"「インターネット利用を巡る青少年の保護の在り方に関するWG」は、インターネットにおける多様なリスクに対し、保護と活用双方のバランスを重視した多角的対応の必要性を議論した。年齢認証やフィルタリングの強化、法整備、そして子ども自身の意見も踏まえ、課題解決を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":96},{"日付":"2025/06/25","開催日":"2025/06/24","タイトル名":"エンタメ・クリエイティブ産業政策研究会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/エンタメ・クリエイティブ産業政策研究会.m4a","URL2":"https://www.meti.go.jp/shingikai/mono_info_service/entertainment_creative/20250624_report.html","備考":"経済産業省は、コンテンツ産業の海外売上高を2033年までに20兆円に拡大する「エンタメ・クリエイティブ産業戦略」を公表した。従来のライセンスアウト型から、海外で直接ファンダムを形成する「コンテンツ海外展開2.0」を推進する。クリエイター不足や供給力不足などの「8つの不足」を解消するため、「10分野100のアクション」を官民連携で実施する方針である。","会議":"会議","isBookmarked":false,"_originalIndex":97},{"日付":"2025/06/25","開催日":"2025/06/23","タイトル名":"デジタルライフライン全国総合整備実現会議（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタルライフライン全国総合整備実現会議.m4a","URL2":"https://www.meti.go.jp/policy/mono_info_service/digital_architecture/lifeline.html","備考":"デジタルライフライン全国総合整備計画は、人手不足や災害対応といった社会課題を解決するため、自動運転、ドローン、インフラDX等のハード・ソフト・ルールを約10年で全国整備する官民一体の計画である。2024年度は先行地域で実証・社会実装を開始し、2025年度は適合性認証制度の実証、相互乗り入れ、国際標準化、データ整備、実証地域の拡大などを進める。各省庁が連携し、技術・制度両面から社会実装を加速する。","会議":"会議","isBookmarked":false,"_originalIndex":98},{"日付":"2025/06/25","開催日":"2025/06/23","タイトル名":"全世代型社会保障構築会議（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/全世代型社会保障構築会議.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/zensedai_hosyo/dai21/gijisidai.html","備考":"第21回全世代型社会保障構築会議では、年金制度改正、医療・介護提供体制のあり方、地域共生社会の実現、高額療養費制度の見直し、および地域働き方改革について議論が交わされた。人口構造の変化に対応し、将来にわたる持続可能な社会保障制度の構築を目指すことが確認された。","会議":"会議","isBookmarked":false,"_originalIndex":99},{"日付":"2025/06/25","開催日":"2025/06/24","タイトル名":"総合資源エネルギー調査会・電力・ガス事業分科会・原子力小委員会（資源エネルギー庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/総合資源エネルギー調査会・電力・ガス事業分科会・原子力小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/enecho/denryoku_gas/genshiryoku/045.html","備考":"総合資源エネルギー調査会原子力小委員会では、原発の現状、国際動向、データセンターによる電力需要増が報告された。核燃料サイクル推進、高レベル放射性廃棄物の最終処分、既設炉の最大限活用、次世代革新炉の開発・設置、サプライチェーンや人材育成、電力システム改革の検証など、多岐にわたる原子力政策の具体化が進められている。","会議":"会議","isBookmarked":false,"_originalIndex":100},{"日付":"2025/06/25","開催日":"2025/06/24","タイトル名":"科学技術・学術審議会・学術分科会・研究環境基盤部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/科学技術・学術審議会・学術分科会・研究環境基盤部会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu4/010/siryo/1417785_00008.html","備考":"日本の研究力低下を踏まえ、AI時代に適合した科学研究の革新が求められている。そのため、数億円から数十億円規模の中規模・大規模研究設備の戦略的な整備、共用、自動化・遠隔化を進める。また、AI活用を前提とした情報基盤を強化し、技術職員や研究マネジメント人材を含む多様な科学技術人材の育成と確保を一体的に推進することで、研究者の創造性と効率性を最大化し、イノベーション創出を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":101},{"日付":"2025/06/25","開催日":"2025/06/24","タイトル名":"今後の医学教育の在り方に関する検討会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/今後の医学教育の在り方に関する検討会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/koutou/124/mext_00022.html","備考":"大学病院は財政難や医師の働き方改革等に直面しており、持続可能な医療・教育・研究体制の維持が喫緊の課題である。このため、経営改革、医療DX推進、タスクシフト、地域医療への貢献、人材育成、研究力強化に向けた多角的な支援と改革が国に求められている。","会議":"会議","isBookmarked":false,"_originalIndex":102},{"日付":"2025/06/25","開催日":"2025/06/24","タイトル名":"安心・安全なメタバースの実現に関する研究会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/安心・安全なメタバースの実現に関する研究会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/metaverse2/15_siryou.html","備考":"本報告書は、安心・安全なメタバースの実現に向けた市場、技術、国内外の政策・制度の動向を分析し、メタバースの原則（第2.0版）の検討を進めている。利用拡大に伴う課題への対応策と、民主的価値に基づく利活用促進、そして今後の課題を提示している。","会議":"会議","isBookmarked":false,"_originalIndex":103},{"日付":"2025/06/26","開催日":"2025/06/25","タイトル名":"金融審議会・総会・金融分科会合同会合（金融庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/金融審議会総会・金融分科会合同会合.m4a","URL2":"https://www.fsa.go.jp/singi/singi_kinyu/soukai/siryou/20250625.html","備考":"金融審議会総会では、投資対象化が進む暗号資産の利用者保護と情報開示の強化、不公正取引規制の拡充、サステナビリティ開示を含む企業情報開示のあり方、地域金融機関の経営基盤強化と地域貢献力向上について議論された。","会議":"会議","isBookmarked":false,"_originalIndex":104},{"日付":"2025/06/26","開催日":"2025/06/25","タイトル名":"同時市場の在り方等に関する検討会（資源エネルギー庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/同時市場検討会：委員等名簿.m4a","URL2":"https://www.meti.go.jp/shingikai/energy_environment/doji_shijo_kento/017.html","備考":"同時市場の検討会では、kWhとΔkWを同時最適化する市場制度が議論された。電力系統の安定供給のため、TSO想定需要と小売入札需要の連携方法や、調整力・分散型エネルギー源の市場参入、送電ロスの考慮など、多岐にわたる論点について技術的・制度的側面から検討が進められている。","会議":"会議","isBookmarked":false,"_originalIndex":105},{"日付":"2025/06/26","開催日":"2025/06/25","タイトル名":"総合資源エネルギー調査会・電力・ガス事業分科会・次世代電力・ガス事業基盤構築小委員会・制度検討作業部会（資源エネルギー庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/総合資源エネルギー調査会・電力・ガス事業分科会・次世代電力・ガス事業基盤構築小委員会・制度検討作業部会.m4a","URL2":"https://www.meti.go.jp/shingikai/enecho/denryoku_gas/jisedai_kiban/system_review/105.html","備考":"電力の安定供給と脱炭素化のため、長期脱炭素電源オークションを通じ、脱炭素電源への新規投資を促進し、費用変動リスクへの対応や対象電源の拡充を進める。また、需給調整市場のコスト抑制や容量市場の公平性確保と合わせ、電力市場全体の整備を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":106},{"日付":"2025/06/26","開催日":"2025/06/25","タイトル名":"情報通信審議会・情報通信技術分科会・電波有効利用委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/電波有効利用委員会の今後のスケジュール.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/denpa_yukoriyo/02kiban09_04000660.html","備考":"情報通信審議会電波有効利用委員会では、人材育成やミリ波・NTN活用、電波利用料、電波監視等について議論がされた。特に26GHz帯の早期割当てに向けた価額競争実施方法の検討が開始され、各事業者から周波数利用意向や制度改善の要望が提出された。また、地域BWAやローカル5Gの普及促進、災害時対応、およびビジネス実用化に向けた課題と提案も話し合われた。","会議":"会議","isBookmarked":false,"_originalIndex":107},{"日付":"2025/06/26","開催日":"2025/06/25","タイトル名":"接続料の算定等に関する研究会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/接続料の算定等に関する研究会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/access-charge_calculation/02kiban03_04001113.html","備考":"本報告書は、電気通信事業における接続料や卸役務の適正化を目的とし、モバイル接続料、MNO・MVNO間の公平性、光サービス卸、トラヒック・ポンピング対策など、多岐にわたる論点での検討結果と今後の方向性を示すものである。","会議":"会議","isBookmarked":false,"_originalIndex":108},{"日付":"2025/06/26","開催日":"2025/06/25","タイトル名":"持続可能な航空燃料（SAF）の導入促進に向けた官民協議会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/持続可能な航空燃料（SAF）の導入促進に向けた官民協議会.m4a","URL2":"https://www.meti.go.jp/shingikai/energy_environment/saf/007.html","備考":"SAF官民協議会は、高コスト・供給不足を課題とし、SAFの導入促進を議論した。2030年目標達成へ、国産SAFの最終投資決定（FID）には安定した需要確保とコスト低減が急務である。欧州型義務化への批判を踏まえ、市場創出や支援拡充が求められ、今後はタスクフォースで詳細を検討する。","会議":"会議","isBookmarked":false,"_originalIndex":109},{"日付":"2025/06/26","開催日":"2025/06/25","タイトル名":"一般投資家の参加拡大を踏まえた不動産特定共同事業のあり方についての検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/一般投資家の参加拡大を踏まえた不動産特定共同事業のあり方についての検討会.m4a","URL2":"https://www.mlit.go.jp/tochi_fudousan_kensetsugyo/tochi_fudousan_kensetsugyo_tk5_000001_00034.html","備考":"不動産特定共同事業検討会は、一般投資家の参加拡大を受け、市場整備の必要性を認識した。投資家保護のため、情報開示の充実、対象不動産売却価格の公正性確保、行政監督強化、業界団体との連携による自主ルール導入の方向性が中間整理として示された。","会議":"会議","isBookmarked":false,"_originalIndex":110},{"日付":"2025/06/27","開催日":"2025/06/26","タイトル名":"宇宙開発利用部会・国際宇宙ステーション・国際宇宙探査小委員会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/国際宇宙ステーション・国際宇宙探査小委員会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu2/071/shiryo/1420983_00037.html","備考":"宇宙開発利用部会では、ポストISS時代の地球低軌道活動における民間主導の物資補給サービス（HTV-XC）開発、JAXAによるラボ・ハブ機能を通じた科学利用・社会実装が検討された。また、月・火星・小天体探査での官民連携の取り組み、および国際宇宙探査とISSの最新動向が報告された。","会議":"会議","isBookmarked":false,"_originalIndex":111},{"日付":"2025/06/27","開催日":"2025/06/26","タイトル名":"産業構造審議会・イノベーション・環境分科会・資源循環経済小委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/資源循環経済小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sangyo_gijutsu/resource_circulation/011.html","備考":"産業構造審議会資源循環経済小委員会は、改正資源法の円滑な施行に向け、新たなワーキンググループを設置する。再生資源利用義務化、環境配慮設計促進、GX原材料等再資源化促進、CEコマース促進の制度詳細を議論し、再生プラスチックや小型蓄電池の循環利用を強化する。","会議":"会議","isBookmarked":false,"_originalIndex":112},{"日付":"2025/06/27","開催日":"2025/06/26","タイトル名":"農福連携等推進会議（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/農福連携等推進会議.m4a","URL2":"https://www.kantei.go.jp/jp/singi/nousui/noufuku_suishin_kaigi/dai4/gijisidai.html","備考":"「農福連携等推進ビジョン」に基づき、障害者だけでなく高齢者や生活困窮者、ひきこもり、犯罪をした者等、多様な人々の農業分野での社会参加と就労を促進している。地域協議会設立、専門人材育成、特別支援学校連携、国民的運動の展開等、多岐にわたる取り組みが進められており、安芸市では多機関連携による就労定着支援が進み、埼玉の特別支援学校や企業も具体的な実践を重ねている。","会議":"会議","isBookmarked":false,"_originalIndex":113},{"日付":"2025/06/27","開催日":"2025/06/26","タイトル名":"自動物流道路の実装に向けたコンソーシアム・オペレーション分科会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/自動物流道路の実装に向けたコンソーシアム・オペレーション分科会.m4a","URL2":"https://www.mlit.go.jp/road/ir/ir-council/autoflowroad_consortium/operation_bunkakai02.html","備考":"自動物流道路の実装に向けた第2回オペレーション分科会の議事次第と資料である。令和7年度実証実験の概要、目的、場所、期間、6つのユースケース、役割分担、費用負担が示されている。また、オペレーション分科会で議論すべき多岐にわたる論点や、今年度の実証実験で検証する項目が詳細に記載されている。","会議":"会議","isBookmarked":false,"_originalIndex":114},{"日付":"2025/06/27","開催日":"2025/06/26","タイトル名":"創薬力向上のための官民協議会（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/創薬力向上のための第1回官民協議会.m4a","URL2":"https://www8.cao.go.jp/iryou/kanmin_kyogikai.html","備考":"創薬力向上のための官民協議会は、ドラッグロス解消と医薬品産業強化を目指し開催された。投資促進、薬価制度改革、臨床試験体制整備、人材育成が主要課題であり、政府は医薬品産業を基幹産業と位置付け、予算確保を約束し、官民連携でエコシステム構築を進める方針である。","会議":"会議","isBookmarked":false,"_originalIndex":115},{"日付":"2025/06/30","開催日":"2025/06/27","タイトル名":"総合資源エネルギー調査会・省エネルギー・新エネルギー分科会・再生可能エネルギー大量導入・次世代電力ネットワーク小委員会・電力・ガス事業分科会・電力・ガス基本政策小委員会・次世代電力系統WG（資源エネルギー庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/次世代電力系統WG.m4a","URL2":"https://www.meti.go.jp/shingikai/enecho/denryoku_gas/saisei_kano/smart_power_grid_wg/003.html","備考":"再生可能エネルギー出力制御が全国で増加し、地域系統の混雑対策とシステム運用が進む。データセンター等の大規模需要による電力容量確保問題に対し、接続規律強化や費用負担、用地確認等の対策が検討されている。系統用蓄電池の迅速な接続へ、充電側ノンファーム型接続の導入も議論中である。","会議":"会議","isBookmarked":false,"_originalIndex":116},{"日付":"2025/06/30","開催日":"2025/06/27","タイトル名":"金融審議会・サステナビリティ情報の開示と保証のあり方に関するWG（金融庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/サステナビリティ情報の開示と保証のあり方に関するWG.m4a","URL2":"https://www.fsa.go.jp/singi/singi_kinyu/sustainability_disclose_wg/shiryou/20250627.html","備考":"金融審議会は、有価証券報告書におけるSSBJ基準に基づくサステナビリティ情報開示と第三者保証制度の導入ロードマップを議論した。プライム市場企業に段階的に適用し、保証水準は限定的である。当初範囲はGHG排出量等に限定され、虚偽記載責任の明確化や提出期限延長も検討中である。","会議":"会議","isBookmarked":false,"_originalIndex":117},{"日付":"2025/06/30","開催日":"2025/06/27","タイトル名":"放送事業者におけるガバナンス確保に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/放送事業者ガバナンス確保検討会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/hosojigyoshan_governance/02ryutsu08_04000591.html","備考":"「放送事業者におけるガバナンス確保に関する検討会」は、民間放送事業者での問題発生を受け、放送の公共性と国民の信頼回復のため、ガバナンスの具体的内容とその実効性確保策を検討するものである。フジテレビ事案や人権尊重、ビジネスと人権に関するガイドラインの議論を踏まえて進められる。","会議":"会議","isBookmarked":false,"_originalIndex":118},{"日付":"2025/06/30","開催日":"2025/06/27","タイトル名":"基幹ロケット開発に係る有識者検討会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/基幹ロケット開発有識者検討会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/kaihatu/031/siryo/mext_00008.html","備考":"基幹ロケット開発有識者検討会は、日本の宇宙活動の自立性確保を目的とし、H3ロケットの高度化と年間6～8機以上の高頻度打上げを目指す。2030年代の次期基幹ロケット運用に向け、再使用技術や有人輸送技術の検討も進めている。開発のスピード感、射場設備の維持・拡充、リソース確保、国際競争力強化が重要課題である。","会議":"会議","isBookmarked":false,"_originalIndex":119},{"日付":"2025/06/30","開催日":"2025/06/27","タイトル名":"電気通信市場検証会議（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/電気通信市場検証会議.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/denkitsushin_shijo/02kiban02_04000800.html","備考":"総務省は、公正競争確保のため、電気通信市場の動向分析と事業者の業務適正性確認を継続的に行う。非電気通信サービス連携の影響や固定・移動通信の代替性、NTTの研究開発状況などを検証した。また、市場支配的事業者の法令遵守やリスク管理、電柱貸与状況も確認し、概ね問題はないものの、引き続き注視する方針である。","会議":"会議","isBookmarked":false,"_originalIndex":120},{"日付":"2025/06/30","開催日":"2025/06/27","タイトル名":"水循環施策の推進に関する有識者会議（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/水循環施策有識者会議.m4a","URL2":"https://www.kantei.go.jp/jp/singi/mizu_junkan/yuushikisha/dai16/gijisidai.html","備考":"水循環政策本部事務局は、新たな水循環基本計画に基づき、流域水循環計画の策定・深化を推進している。特に地下水と水を活用した地域振興に注力し、水循環の概念図や評価指標の見直しも進める。能登半島地震を踏まえた災害対策強化、水循環企業との連携、教育・普及啓発活動等、多岐にわたる施策を展開している。","会議":"会議","isBookmarked":false,"_originalIndex":121},{"日付":"2025/06/30","開催日":"2025/06/27","タイトル名":"医療事故調査制度等の医療安全に係る検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/医療事故調査制度検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59044.html","備考":"本検討会は、国内の重大医療事故を受け、医療安全施策の経緯と現状、課題を概説している。医療機関内の事故報告義務化や医療事故調査制度が導入され、院内での情報収集・分析と組織的改善が重要である。横浜市立大学附属病院の事例は、報告制度と幹部連携による改善の歩みを示しており、過少報告や分析資源の不足が医療安全システムの共通課題として指摘されている。","会議":"会議","isBookmarked":false,"_originalIndex":122},{"日付":"2025/06/30","開催日":"2025/06/27","タイトル名":"通商白書2025〜国際経済秩序の転換期における日本の通商戦略（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/通商白書2025.m4a","URL2":"https://www.meti.go.jp/report/tsuhaku2025/index.html","備考":"通商白書2025では、米国関税による通商政策を巡る不確実性が、世界経済の見通しを押し下げているとの分析を示しており、根底にある構造的問題を、米中を始めとする各国内の格差の拡大、中国からの輸入の急増、中国の過小消費構造の3つであると指摘している。","会議":"会議","isBookmarked":false,"_originalIndex":123},{"日付":"2025/07/01","開催日":"2025/06/27","タイトル名":"新しい地方経済・生活環境創生本部・民主導による新たなまちづくり推進会議（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/民主導のまちづくり推進会議.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/atarashii_chihousousei/suisinkaigi/dai1/gijisidai.html","備考":"民主導による新たなまちづくり推進会議では、民間活力を生かした地方創生2.0の推進が議論された。前橋市やジャパネットの事例が紹介され、民間資金や熱意を引き出す制度や環境整備の必要性が強調された。会議資料は原則公表され、議事要旨も公開される。","会議":"会議","isBookmarked":false,"_originalIndex":124},{"日付":"2025/07/01","開催日":"2025/06/27","タイトル名":"GX実現に向けたカーボンフットプリント活⽤に関する研究会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/GX実現に向けたカーボンフットプリント活用研究会.m4a","URL2":"https://www.meti.go.jp/shingikai/energy_environment/gx_carbon_footprint/20250627_report.html","備考":"GX実現に向け、脱炭素と産業競争力強化を両立する「GX価値」指標の製品単位での活用が検討されている。従来のCFPの課題を踏まえ、日本の強みを反映した算定・評価ルールを国際展開し、GX投資促進と需要創出を図る方針である。各産業の現状と対策方向性も整理された。","会議":"会議","isBookmarked":false,"_originalIndex":125},{"日付":"2025/07/01","開催日":"2025/06/30","タイトル名":"アルコール健康障害対策関係者会議（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/アルコール健康障害対策関係者会議.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59198.html","備考":"警察庁、法務省、国土交通省は飲酒運転防止のため、指導や依存回復プログラムなどを推進している。現行計画の改定では、飲酒運転者への指導に加え、依存症の親を持つヤングケアラーなど家族への相談支援の強化が議論の焦点である。調査からヤングケアラーが過度な情緒的ケアを担う実態が示された。","会議":"会議","isBookmarked":false,"_originalIndex":126},{"日付":"2025/07/01","開催日":"2025/06/30","タイトル名":"日本企業の海外展開動向を踏まえた国際課税制度のあり方に関する研究会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/日本企業の海外展開動向を踏まえた国際課税制度のあり方に関する研究会.m4a","URL2":"https://www.meti.go.jp/shingikai/external_economy/qdmtt/20250630_report.html","備考":"日本企業の海外展開加速と国際課税制度の激変を受け、外国子会社合算税制（CFC税制）が国際競争力阻害要因となる懸念がある。制度趣旨の不明確さ、過剰課税、事務負担増大が主な課題であり、グローバル・ミニマム課税導入を踏まえ、これらの課題解決と制度見直しが必要である。","会議":"会議","isBookmarked":false,"_originalIndex":127},{"日付":"2025/07/01","開催日":"2025/06/30","タイトル名":"産業構造審議会・知的財産分科会・意匠制度小委員会（特許庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/意匠制度小委員会.m4a","URL2":"https://www.jpo.go.jp/resources/shingikai/sangyo-kouzou/shousai/isho_shoi/20-shiryou.html","備考":"産業構造審議会意匠制度小委員会は、仮想空間におけるデザイン保護で、仮想物品等の形状画像を保護対象とし、実施行為や類否判断を検討している。また、生成AIデザインについては、人が実質的に関与すれば意匠となり得るが、AI自体は創作者とせず、新規性等の判断でAI利用有無を直接基準としない方向で議論を進めている。","会議":"会議","isBookmarked":false,"_originalIndex":128},{"日付":"2025/07/01","開催日":"2025/06/30","タイトル名":"デジタルプラットフォームの透明性・公正性に関するモニタリング会合（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/デジタルプラットフォームモニタリング会合.m4a","URL2":"https://www.meti.go.jp/shingikai/mono_info_service/digital_platform_monitoring/index.html","備考":"デジタルプラットフォーム各社は、苦情・紛争解決、取引条件開示、相互理解促進、自己評価を通じて透明性と公正性の向上に努めている。アプリや広告の審査・停止措置、規約変更、データ利用に関する透明性を高め、利用者との対話やフィードバックを重視している。","会議":"会議","isBookmarked":false,"_originalIndex":129},{"日付":"2025/07/01","開催日":"2025/06/30","タイトル名":"高額療養費制度の在り方に関する専門委員会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/高額療養費制度の在り方に関する専門委員会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59240.html","備考":"高額療養費制度に関する専門委員会で、アレルギーやCML患者団体が意見表明された。自己負担上限引き上げやOTC類似薬保険除外案に対し、患者は高額治療の継続困難や生活への深刻な影響を懸念している。高額な新薬は生活の質改善に不可欠であり、患者は制度維持を要望している。また、制度の持続可能性も課題である。","会議":"会議","isBookmarked":false,"_originalIndex":130},{"日付":"2025/07/01","開催日":"2025/06/30","タイトル名":"研究開発税制等の在り方に関する研究会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/研究開発税制等の在り方に関する研究会.m4a","URL2":"https://www.meti.go.jp/shingikai/economy/r_and_d_tax_system/003.html","備考":"総合科学技術・イノベーション会議は重要技術領域検討WGを設置した。研究開発税制の研究会では、高度研究人材活用、中長期投資促進、試験研究費対象範囲が議論された。繰越控除や給付付き税額控除の導入、非製造業や文理融合研究への適用拡大、既存要件の緩和・撤廃などが主要論点である。","会議":"会議","isBookmarked":false,"_originalIndex":131},{"日付":"2025/07/01","開催日":"2025/06/30","タイトル名":"厚生科学審議会・臨床研究部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/06/厚生科学審議会・臨床研究部会-1.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59245.html","備考":"厚生科学審議会臨床研究部会は、治験・臨床試験の推進に向けた2025年版とりまとめを公表した。このとりまとめは、国際競争力ある治験・臨床試験体制の強化、症例集積力の向上、手続きの効率化、治験コストの透明化、研究従事者・支援人材の育成とインセンティブ、国民・患者の理解・参画促進を主要な方向性としている。また、臨床研究中核病院の承認要件見直しや「国際拠点型臨床研究中核病院」（仮称）の新設、生成AI等の新たな技術への対応も含まれる。","会議":"会議","isBookmarked":false,"_originalIndex":132},{"日付":"2025/07/02","開催日":"2025/06/30","タイトル名":"デジタル関連産業のグローバル化促進のための関係閣僚会議（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/デジタル関連産業のグローバル化促進のための関係閣僚会議.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/digital_global_kakuryokaigi/dai1/siryou.html","備考":"デジタル関連産業のグローバル化促進のため、関係閣僚会議が開催された。日本のデジタルサービス収支は赤字であり、海外展開が課題である。政府はデジタルインフラ強化やAI人材育成、国際連携等を通じ、AI・製造DX企業等のグローバル展開を支援する。松尾研のエコシステムも海外へ展開している。","会議":"会議","isBookmarked":false,"_originalIndex":133},{"日付":"2025/07/02","開催日":"2025/06/30","タイトル名":"健康・医療戦略推進本部・健康・医療グローバル協議会（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/健康・医療戦略推進本部・健康・医療グローバル協議会.m4a","URL2":"https://www.kantei.go.jp/jp/singi/kenkouiryou/global_health/globalcouncil_dai1/gijisidai.html","備考":"日本政府は、アジア健康構想、アフリカ健康構想、グローバルヘルス戦略を一体的に推進している。これは、国際的な保健課題解決と国内産業の活性化、経済安全保障強化を目指すものであり、UHC達成やパンデミックへの備え・対応を強化する。国内外の多様な関係者と連携し、三方得の実現を図る。","会議":"会議","isBookmarked":false,"_originalIndex":134},{"日付":"2025/07/02","開催日":"2025/07/01","タイトル名":"文化審議会・文化政策部会（文化庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/文化審議会・文化政策部会.m4a","URL2":"https://www.bunka.go.jp/seisaku/bunkashingikai/seisaku/23/01/index.html","備考":"文化審議会は、文化芸術、文化財、国語、著作権など多岐にわたる文化政策を審議する。クリエイター支援、国際展開、地域活性化、デジタル化、文化財保護、就業環境改善を推進し、政策効果の評価も重視している。文化を通じた経済成長と国際交流の深化を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":135},{"日付":"2025/07/02","開催日":"2025/06/30","タイトル名":"こども政策DX推進チーム（こども家庭庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/こども政策DX推進チーム.m4a","URL2":"https://www.cfa.go.jp/councils/kodomo_seisaku_DX/6cfab22c","備考":"こども政策DXは、子育て家庭や支援現場の負担を軽減し、質の高い支援を実現するため、出産から子育ての各ステージでデジタル技術を活用するものである。子育て支援情報のプッシュ型配信、出生届オンライン化、母子保健DX、保育DX、こどもデータ連携などを推進し、国民の利便性向上を目指す。国は共通基盤構築やデータ標準化を進め、民間事業者がサービス品質を競い合う形が基本となる。","会議":"会議","isBookmarked":false,"_originalIndex":136},{"日付":"2025/07/02","開催日":"2025/07/01","タイトル名":"自動運転時代の次世代のITS通信研究会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/自動運転時代のITS通信研究会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/Next_Generation_ITS/02kiban14_04001234.html","備考":"総務省の「次世代ITS通信研究会」は、自動運転時代に向けたV2X・V2N通信のあり方を検討している。5.9GHz帯の利用や既存周波数の移行、新東名高速でのトラック実証実験を通じ、通信環境の整備と国際調和を図り、自動運転の社会実装を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":137},{"日付":"2025/07/02","開催日":"2025/07/01","タイトル名":"国立大学法人等の機能強化に向けた検討会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/国立大学法人機能強化検討会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/koutou/128/siryo/mext_00012.html","備考":"国立大学法人等は、法人化20年を経て、運営費交付金減少や少子化、グローバル化などの社会変化に直面している。これに対応するため、財務、人事、組織、教育、研究、施設の多岐にわたる改革を進め、自律的で戦略的な経営体への転換を目指す方針が示されている。","会議":"会議","isBookmarked":false,"_originalIndex":138},{"日付":"2025/07/02","開催日":"2025/07/01","タイトル名":"医療DX令和ビジョン2030厚生労働省推進チーム（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/医療DX令和ビジョン2030推進チーム.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59229.html","備考":"厚生労働省は、医療DXを推進している。全国医療情報プラットフォーム構築に向け、マイナ保険証、電子処方箋、電子カルテの標準化と共有、診療報酬改定DX、介護情報基盤整備、病院システムクラウド化などを推進中である。2030年までに概ね全ての医療機関で電子カルテ導入を目指している。","会議":"会議","isBookmarked":false,"_originalIndex":139},{"日付":"2025/07/02","開催日":"2025/07/01","タイトル名":"米の安定供給等実現関係閣僚会議（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/米の安定供給等実現関係閣僚会議.m4a","URL2":"https://www.kantei.go.jp/jp/singi/nousui/kome_anteikyokyujitsugen_kaigi/dai2/gijishidai.html","備考":"農林水産省は米対策集中対応チームを設置し、随意契約による政府備蓄米の販売を加速的に拡大している。これにより米の小売価格は下落し、平均価格は3,801円となっている。政府は作況指数の公表廃止やふるい目の実態への合致など統計見直し、全届出事業者への調査による流通実態把握強化、生産者への今後の生産意向アンケートを実施中である。首相は、価格高騰の要因検証を進めつつ、令和7年産からの増産と新たな米政策への転換を指示した。","会議":"会議","isBookmarked":false,"_originalIndex":140},{"日付":"2025/07/02","開催日":"2025/07/01","タイトル名":"サイバーセキュリティ戦略本部（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/サイバーセキュリティ戦略本部.m4a","URL2":"https://www.nisc.go.jp/council/cs/index.html","備考":"サイバー攻撃の巧妙化・深刻化を受け、日本はサイバー対処能力強化法を制定した。サイバーセキュリティ戦略本部を改組し、国家サイバー統括室を中心とした司令塔機能を強化。政府機関の監視体制強化や重要インフラ施策の新基準策定を進める。年内に新戦略を策定し、官民・国際連携で社会全体のサイバーセキュリティ向上を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":141},{"日付":"2025/07/03","開催日":"2025/07/02","タイトル名":"科学技術・学術審議会・学術分科会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/科学技術・学術審議会・学術分科会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/mext_02133.html","備考":"日本の研究力低下が喫緊の課題であり、AI活用による学術研究の革新が求められる。大規模研究基盤の整備、情報基盤強化、人材育成、産学連携、国際頭脳循環の促進が不可欠で、大学共同利用機関が中心となり、研究環境の高効率化と創造性最大化を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":142},{"日付":"2025/07/03","開催日":"2025/07/02","タイトル名":"産業構造審議会・イノベーション・環境分科会・排出量取引制度小委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/産業構造審議会・イノベーション・環境分科会・排出量取引制度小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sangyo_gijutsu/emissions_trading/001.html","備考":"産業構造審議会排出量取引制度小委員会は、改正GX推進法に基づき2026年度から義務化される排出量取引制度の詳細設計を審議する。CO2直接排出量10万トン以上の事業者が対象となり、算定・確認方法、排出枠割当、上下限価格等が主要論点である。今後、割当方法等の技術的検討を進め、関連省令や告示を策定する方針である。","会議":"会議","isBookmarked":false,"_originalIndex":143},{"日付":"2025/07/03","開催日":"2025/07/02","タイトル名":"建築物のライフサイクルカーボンの算定・評価等を促進する制度に関する検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/建築物LCA制度検討会.m4a","URL2":"https://www.mlit.go.jp/jutakukentiku/build/jutakukentiku_house_tk4_000302.html","備考":"建築物ライフサイクルカーボン算定・評価促進制度の検討が行われた。その目的・必要性や制度設計の前提が示され、段階的導入、表示の仕組み、CO2排出原単位の整備が主な論点である。鉄鋼、空調、セメント、木材業界の取り組みと課題も共有され、EPD/CFPの活用と国際整合の重要性が議論された。","会議":"会議","isBookmarked":false,"_originalIndex":144},{"日付":"2025/07/03","開催日":"2025/07/02","タイトル名":"消費者保護ルール実施状況のモニタリング定期会合・消費者保護ルールの在り方に関する検討会合同会合（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/消費者保護ルールの在り方に関する検討会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/shouhisha_hogorule/02kiban08_04000504.html","備考":"電気通信サービスに関する苦情相談は増加しており、特にFTTHやMNOで解約や不適切な勧誘、料金の問題が目立っている。総務省は苦情分析や覆面調査で実態を把握し、高齢者保護を含めた多角的な消費者保護の改善策を進めている。","会議":"会議","isBookmarked":false,"_originalIndex":145},{"日付":"2025/07/03","開催日":"2025/07/02","タイトル名":"健康・医療戦略推進本部・健康・医療戦略参与会合（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/健康・医療戦略推進本部・健康・医療戦略参与会合.m4a","URL2":"https://www.kantei.go.jp/jp/singi/kenkouiryou/sanyokaigou/dai26/gijisidai.html","備考":"日本は、第3期健康・医療戦略に基づき、超高齢社会の課題解決と産業競争力強化を目指す。医療DXとAIを駆使し、リアルワールドデータ活用や新規モダリティ創薬を加速。ドラッグ・ラグ解消や国際連携推進へ、産学官共創で持続可能な医療エコシステムを構築する。","会議":"会議","isBookmarked":false,"_originalIndex":146},{"日付":"2025/07/04","開催日":"2025/07/03","タイトル名":"教育・学習の質向上に向けた新たな評価の在り方WG（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/教育・学習の質向上に向けた新たな評価の在り方WG.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo4/056/giji_list/1422801_00004.html","備考":"大学評価制度の質向上に向け、高校生側の認知度や活用の低さが課題であると認識された。英国TEFや米国のアクレディテーションなど諸外国の事例を参考に、大学の教育・学習の質保証と向上を目指し、段階評価の導入、学習成果の適切な把握、および高等学校生徒や指導者向けの分かりやすい情報公開の改善が議論された。評価実施に伴う負担軽減も重要な検討課題である。","会議":"会議","isBookmarked":false,"_originalIndex":147},{"日付":"2025/07/04","開催日":"2025/07/03","タイトル名":"令和6年育児・介護休業法改正を踏まえた実務的な介護両立支援の具体化に関する研究会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/令和6年育児・介護休業法改正を踏まえた実務的な介護両立支援の具体化に関する研究会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_58152.html","備考":"令和6年育児・介護休業法改正を踏まえ、企業は社員の介護離職を防ぎキャリア継続を支援するため、具体的な方策が示されている。予測困難な介護に対し、制度周知、相談窓口、柔軟な働き方、早期の情報提供、社会資源の活用を促し、社員が一人で抱え込まない職場風土の醸成が重要であると、各資料で強調されている。","会議":"会議","isBookmarked":false,"_originalIndex":148},{"日付":"2025/07/04","開催日":"2025/07/03","タイトル名":"ICTサービスの利用環境の整備に関する研究会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/ICTサービスの利用環境の整備に関する研究会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/ICT_services/02kiban18_02000422.html","備考":"ICTサービス利用環境整備研究会は、闇バイトや特殊詐欺対策として、携帯電話の本人確認強化を提言した。通信ログは犯罪捜査や被害者救済のため、少なくとも3～6か月保存が望ましいとしている。また、スマートフォンプライバシーセキュリティイニシアティブ（SPSI）を改定し青少年保護を強化、ウェブサイトへの適用も検討中である。","会議":"会議","isBookmarked":false,"_originalIndex":149},{"日付":"2025/07/04","開催日":"2025/07/03","タイトル名":"繊維産地におけるサプライチェーン強靱化に向けた対応検討会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/繊維産地サプライチェーン強靱化検討会.m4a","URL2":"https://www.meti.go.jp/shingikai/mono_info_service/textile_production_area/005.html","備考":"繊維産地のサプライチェーン強靱化に向け、企業の収益構造硬直化、後継者不足、認知度不足等の課題が指摘された。これに対し、産地内・産地間の連携強化、外需獲得、中核企業の変革推進が重要である。国、地方公共団体、組合、金融機関等、多様な主体の連携により繊維産業全体の持続可能な発展を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":150},{"日付":"2025/07/07","開催日":"2025/07/04","タイトル名":"医療上の必要性の高い未承認薬・適応外薬検討会議（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/医療上の必要性の高い未承認薬・適応外薬検討会議.m4a","URL2":"https://www.mhlw.go.jp/stf/shingi2/0000198856_00042.html","備考":"医療上の必要性が高い未承認薬・適応外薬検討会議は、未承認薬等の評価と開発促進を行う[1,Ref.1]。重篤な疾患に対する有用性[2,Ref.4-1]や国内外エビデンスを基に公知申請や治験の必要性を判断し、多数の医薬品の検討を進めている。","会議":"会議","isBookmarked":false,"_originalIndex":151},{"日付":"2025/07/07","開催日":"2025/07/04","タイトル名":"こども家庭審議会・障害児支援部会（こども家庭庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/こども家庭審議会・障害児支援部会.m4a","URL2":"https://www.cfa.go.jp/councils/shingikai/shougaiji_shien/ef74d5c7","備考":"こども家庭審議会障害児支援部会では、第2期計画実績と第3期計画目標を議論した。また、障害児通所給付決定事務の見直し、障害児入所施設の在り方、療育手帳の検討状況、2040年に向けたサービス提供体制等が議題となった。地域差是正や共生社会推進が中心である。","会議":"会議","isBookmarked":false,"_originalIndex":152},{"日付":"2025/07/07","開催日":"2025/07/03","タイトル名":"東京都再エネ実装専門家ボード（東京都）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/東京都再エネ実装専門家ボード.m4a","URL2":"https://www.kankyo.metro.tokyo.lg.jp/climate/renewable_energy/200100a20230614231953660/","備考":"東京都は2035年までに温室効果ガス60%削減、再エネ利用割合60%達成を目標とする。既存技術の徹底活用と次世代太陽電池、浮体式洋上風力などの先進技術社会実装を推進。GXスタートアップ支援も強化し、データセンターによる電力需要増など都市特性を踏まえ、政策に左右されない技術導入を重視している。","会議":"会議","isBookmarked":false,"_originalIndex":153},{"日付":"2025/07/07","開催日":"2025/07/04","タイトル名":"文化審議会・文化施設部会（文化庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/文化審議会・文化施設部会.m4a","URL2":"https://www.bunka.go.jp/seisaku/bunkashingikai/bunka_shisetsu/02/02/index.html","備考":"文化施設は、人口減少や資源制約に対応すべく、他分野連携やネットワーク化を推進している。専門人材不足や運営課題を抱え、育成・派遣の取り組みを進める。文化経済の好循環実現へ向け、新たな資金調達や場の活性化、人材育成策が複合的に検討されている。","会議":"会議","isBookmarked":false,"_originalIndex":154},{"日付":"2025/07/07","開催日":"2025/07/04","タイトル名":"経済社会情勢の変化に対応したキャリアコンサルティングの実現に関する研究会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/経済社会情勢の変化に対応したキャリアコンサルティングの実現に関する研究会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59319.html","備考":"経済社会変化を受け、労働者のキャリア自律が不可欠となり、キャリアコンサルタントの役割が拡大している。彼らには、解決型だけでなく労働者の能力を育む開発型支援や、企業内での経営層との連携が求められる。活動領域に応じた専門性向上と能力開発、活用促進のための意義周知が課題である。","会議":"会議","isBookmarked":false,"_originalIndex":155},{"日付":"2025/07/07","開催日":"2025/07/04","タイトル名":"科学技術・学術審議会・研究計画・評価分科会・宇宙開発利用部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/宇宙開発利用部会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu2/059/shiryo/1422108_00053.html","備考":"宇宙開発利用部会では、H-IIAロケット50号機打上げ成功と成果が報告された。また、スターダストプログラムによる衛星オンボードPPPや次世代電源システムの実証成果が発表された。ロケットの再使用化技術に関する世界動向とJAXAのRV-X、CALLISTOプロジェクトへの取り組み、JAXA第5期中長期計画における衛星地球観測の重点テーマ（自然資本把握、海洋状況把握、水災害・水資源管理、インフラ管理・防災DX）、JAXAの民間共創・事業促進策、および民間等による今後の宇宙開発利用の方向性についても議論された。","会議":"会議","isBookmarked":false,"_originalIndex":156},{"日付":"2025/07/07","開催日":"2025/07/04","タイトル名":"産業構造審議会・商務流通情報分科会・次世代半導体等小委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/次世代半導体等小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/shomu_ryutsu/next_generation_semiconductor/004.html","備考":"次世代半導体等小委員会は、計画の記載事項や技術・事業・財務・ガバナンス審査基準を議論した。また、金融支援の考え方と、2ナノ以下のロジック半導体等を指定高速情報処理用半導体とする案が示された。","会議":"会議","isBookmarked":false,"_originalIndex":157},{"日付":"2025/07/07","開催日":"2025/07/04","タイトル名":"中央教育審議会・大学分科会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中央教育審議会・大学分科会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo4/siryo/mext_00004.html","備考":"中央教育審議会大学分科会では、医学部臨時定員増の継続、専門職高等教育質保証機構の新規分野における認証、学校教育法施行規則の改正案が諮問・議論された。また、「Global×Innovation人材育成フォーラム」最終まとめ、高等教育の質向上・質保証システム、国立大学法人等施設整備の次期5か年計画中間まとめについても審議が行われた。","会議":"会議","isBookmarked":false,"_originalIndex":158},{"日付":"2025/07/08","開催日":"2025/07/07","タイトル名":"産業構造審議会・グリーンイノベーションプロジェクト部会・エネルギー構造転換分野WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/グリーンイノベーションプロジェクト部会・エネルギー構造転換分野WG.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/green_innovation/energy_structure/029.html","備考":"グリーンイノベーション基金事業は、水素・アンモニアの供給コスト削減と利用拡大を目指す。水素混焼発電や燃料アンモニア電解合成は中止された一方、水電解・水素輸送技術開発は進展し、SOEC開発も追加された。関連予算も変更された。","会議":"会議","isBookmarked":false,"_originalIndex":159},{"日付":"2025/07/08","開催日":"2025/07/07","タイトル名":"東京都水道事業運営戦略検討会議・施設整備に関する専門部会（東京都）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/東京都水道事業運営戦略検討会議.m4a","URL2":"https://www.waterworks.metro.tokyo.lg.jp/suidojigyo/torikumi/senryaku/kekka_senmon_r701","備考":"東京都水道事業運営戦略検討会議施設整備に関する専門部会では、マスタープラン策定後の社会変化や能登半島地震を踏まえ、施設整備方針を検証した。水道需要見通しは維持しつつ、水源確保、施設能力向上、予防保全型長寿命化、管路更新の強化を検討中である。","会議":"会議","isBookmarked":false,"_originalIndex":160},{"日付":"2025/07/08","開催日":"2025/07/04","タイトル名":"削減義務実施に向けた専門的事項等検討会（東京都）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/削減義務実施に向けた専門的事項等検討会.m4a","URL2":"https://www.kankyo.metro.tokyo.lg.jp/climate/large_scale/overview/ex-gts/2025-1","備考":"東京都は、国の排出量取引制度（GX-ETS）の本格稼働（2026年度～）に伴い、都のキャップ＆トレード制度との規制重複を避けるため、「削減義務実施に向けた専門的事項等検討会」を設置した。本検討会では、国制度の対象事業所における直接排出量（Scope1）を都の削減義務対象外とすること、および基準排出量や年度排出量から当該排出量を除外する算出方法の調整について検討する。改正条例は2026年4月の施行を目指している。","会議":"会議","isBookmarked":false,"_originalIndex":161},{"日付":"2025/07/08","開催日":"2025/07/07","タイトル名":"外国人児童生徒等の教育の充実に関する有識者会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/外国人児童生徒等の教育の充実に関する有識者会議.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/shotou/196/siryo/1418919_00004.html","備考":"外国人児童生徒教育充実のため有識者会議が設置され、日本語指導が必要な児童生徒の急増に対応する。会議は、指導内容や指導体制の深化・充実、日本語指導担当教師等の指導力向上、就学・進学・就職機会の確保等を検討し、多様性を長所として活かす共生社会の実現を目指す。群馬県による包括的な支援策の取り組みも議論の参考にされる。","会議":"会議","isBookmarked":false,"_originalIndex":162},{"日付":"2025/07/08","開催日":"2025/07/07","タイトル名":"学校安全の推進に関する有識者会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/学校安全の推進に関する有識者会議.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/shougai/047/siryo/1412213_00012.htm","備考":"第3次学校安全の推進に関する計画は、児童生徒の安全確保、死亡事故の限りないゼロ化、負傷・疾病の減少を目指し、2022年度から5年間実施される計画である。この計画に基づき、学校安全の推進に関する有識者会議が設置され、2025年度から2026年度にかけて、計画の進捗管理や政策推進について検討する。特に令和7年度は、「学校事故の予防に向けたデータの活用と施策の検証」、「危機管理マニュアル等の見直し・実効性を高める方策」、「学校における安全教育の取組のさらなる充実」の3つの検討事項を中心に協議を進める予定である。","会議":"会議","isBookmarked":false,"_originalIndex":163},{"日付":"2025/07/09","開催日":"2025/07/08","タイトル名":"オンラインカジノに係るアクセス抑止の在り方に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/オンラインカジノに係るアクセス抑止の在り方に関する検討会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/online_casino/02kiban18_02000418.html","備考":"オンラインカジノの深刻な弊害を受け、総務省の検討会はアクセス抑止策としてのブロッキングを議論している。ブロッキングは通信の秘密を侵害する恐れがあるため、その必要性・有効性、許容性、実施根拠、妥当性を検証中である。法的安定性を確保するため、法解釈でなく法的担保が必要であり、諸外国の事例も参考に検討を深める方針である。","会議":"会議","isBookmarked":false,"_originalIndex":164},{"日付":"2025/07/09","開催日":"2025/07/08","タイトル名":"環境審査顧問会・風力部会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/環境審査顧問会・風力部会.m4a","URL2":"https://www.meti.go.jp/shingikai/safety_security/kankyo_shinsa/furyoku/2025_009.html","備考":"会議で提示された資料は、「宗谷丘陵南」と「つがる洋上」両風力発電事業の環境影響評価方法書関連資料をまとめたものである。風車計画、環境調査、イトウ等希少種や景観への影響、それらに対する住民・知事・事業者の見解が示され、環境影響回避・低減策が検討中である。","会議":"会議","isBookmarked":false,"_originalIndex":165},{"日付":"2025/07/09","開催日":"2025/07/08","タイトル名":"令和7年版情報通信白書（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/令和7年版情報通信白書.m4a","URL2":"https://www.soumu.go.jp/johotsusintokei/whitepaper/","備考":"「令和7年情報通信白書」は、デジタルが社会基盤化しAIも進展するが、日本はAI利用や国際競争力で他国に遅れ、デジタル関連収支は赤字であると概観した。信頼性あるデジタル基盤確保や偽情報対応が課題とされ、総務省は地域DX、インフラ整備、技術競争力強化、偽情報対策を進め、デジタルによる社会課題解決を目指す方針である。","会議":"会議","isBookmarked":false,"_originalIndex":166},{"日付":"2025/07/09","開催日":"2025/07/08","タイトル名":"米国の関税措置に関する総合対策本部（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/米国の関税措置に関する総合対策本部.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/tariff_measures/dai5/gijisidai.html","備考":"米国は日本を含む国々に対し新たな関税措置を発表し、日本製品には2025年8月1日より一律25%の関税を課すことになった。これを受け、2025年5月の対米輸出は自動車を中心に前年同月比11.1%減少し、企業からは資金繰りや今後の受注に対する懸念が表明されている。日米間では継続して協議が行われている状況である。","会議":"会議","isBookmarked":false,"_originalIndex":167},{"日付":"2025/07/10","開催日":"2025/07/07","タイトル名":"東京の観光振興を考える有識者会議（東京都）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/東京観光振興有識者会議.m4a","URL2":"https://www.sangyo-rodo.metro.tokyo.lg.jp//basic/tourism/kaigi/250707","備考":"東京都の観光振興有識者会議は、観光環境の変化に対応する施策検討を目的に設置された。会議では、江戸文化活用や観光DX、人手不足、財源、オーバーツーリズム等が議論された。訪日・訪都外国人旅行者数と消費額の回復と増加傾向が報告されている。","会議":"会議","isBookmarked":false,"_originalIndex":168},{"日付":"2025/07/10","開催日":"2025/07/09","タイトル名":"中央教育審議会・初等中等教育分科会・教育課程部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中央教育審議会・教育課程部会-.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo3/004/siryo/mext_00013.html","備考":"文部科学省は、教師の長時間勤務是正と処遇改善、学習指導要領の質向上と柔軟化、デジタル学習基盤活用、多様な子供への個別対応、教員養成・採用制度改革、および現職教師の能力向上を総合的に推進している。","会議":"会議","isBookmarked":false,"_originalIndex":169},{"日付":"2025/07/10","開催日":"2025/07/09","タイトル名":"高齢者医薬品適正使用検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/高齢者医薬品適正使用検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59156.html","備考":"高齢者の医薬品適正使用指針は、加齢に伴う生理的変化や多剤服用による安全性問題への対策を目的とする。薬物有害事象の回避、服薬アドヒアランスの改善、過少医療の回避を目指し、医師、歯科医師、薬剤師を中心に、看護師や他職種との連携を推進する。ポリファーマシーは、単に薬剤数が多いだけでなく、薬物有害事象や服薬過誤等につながる状態であ
