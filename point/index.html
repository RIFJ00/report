る。対策として、薬剤見直し、非薬物療法、地域での多職種協働が重要とされ、地域ポリファーマシーコーディネーター等の役割を定め対策を進める。","会議":"会議","isBookmarked":false,"_originalIndex":170},{"日付":"2025/07/10","開催日":"2025/07/09","タイトル名":"デジタル時代における放送制度の在り方に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/デジタル時代における放送制度の在り方に関する検討会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_hososeido/02ryutsu07_04000538.html","備考":"デジタル時代の放送制度を検討する会合が開かれた。テレビ視聴時間の減少や若年層のテレビ離れが顕著な一方で、配信サービスの利用は増加傾向にある。このような状況下、情報空間の健全性維持のため、信頼性の高い放送コンテンツの価値向上とネット配信促進が重要課題とされた。データ活用、TVerとNHKプラスの統合を含む仮想プラットフォームの構築、放送コンテンツの顕著性（プロミネンス）確保に向けた様々な施策の検証が進められている。利用者は、信頼性の高い情報や災害時の情報をコネクテッドTVのホーム画面で目立つように表示することを強く希望している。","会議":"会議","isBookmarked":false,"_originalIndex":171},{"日付":"2025/07/11","開催日":"2025/07/10","タイトル名":"広域大規模災害を想定した放送サービスの維持・確保方策の充実・強化検討チーム（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/広域大規模災害を想定した放送サービスの維持・確保方策の充実・強化検討チーム.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_hososeido/02ryutsu11_04000124.html","備考":"広域大規模災害時の放送サービス維持・強化策の取りまとめ案が公表された。官民連携の充実、放送ネットワークの強靭化、衛星・インターネットによる代替手段確保、臨時災害放送局の活用促進、被災者の視聴環境確保が主な柱である。総務省は財政支援や手続き簡素化に取り組む方針である。","会議":"会議","isBookmarked":false,"_originalIndex":172},{"日付":"2025/07/11","開催日":"2025/07/10","タイトル名":"産業構造審議会・保安・消費生活用品安全分科会・二酸化炭素貯留事業等安全小委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/二酸化炭素貯留事業等安全小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/hoan_shohi/carbon_dioxide/004.html","備考":"二酸化炭素貯留事業等安全小委員会では、CCS事業の保安措置が議論された。貯留事業者は、土地掘削、二酸化炭素の貯蔵、工作物の工事・維持・運用に関する保安措置義務を負う。リスクマネジメントの実施が求められ、作業監督者の選任要件や、坑井、圧送機、導管などの工作物の技術基準の方向性も示された。","会議":"会議","isBookmarked":false,"_originalIndex":173},{"日付":"2025/07/11","開催日":"2025/07/09","タイトル名":"ネイチャーポジティブ経済研究会（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/ネイチャーポジティブ経済研究会.m4a","URL2":"https://www.env.go.jp/page_00024.html","備考":"環境省は、2030年までのネイチャーポジティブ経済実現へ向け、企業が自然へ貢献し、TNFD開示で価値向上を図る施策を推進する。自然共生サイト認定で地域価値も高め、ネイチャーファイナンス拡大や国際ルール形成も図る。データ・技術開発も基盤を支える。","会議":"会議","isBookmarked":false,"_originalIndex":174},{"日付":"2025/07/11","開催日":"2025/07/10","タイトル名":"中央教育審議会・初等中等教育分科会・デジタル教科書推進WG（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中央教育審議会・初等中等教育分科会・デジタル教科書推進WG.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo3/100/mext_00014.html","備考":"デジタル教科書推進WGは、デジタル教科書の現状と課題を議論している。デジタル教科書は学習支援機能やアクセシビリティで効果がある一方、導入や教員指導、ICT環境が課題である。今後は段階的導入と紙との併用が進み、経済財政基本方針でも教育DXの一環として推進される。","会議":"会議","isBookmarked":false,"_originalIndex":175},{"日付":"2025/07/11","開催日":"2025/07/10","タイトル名":"2030年度に向けた総合物流施策大綱に関する検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/2030年度に向けた総合物流施策大綱に関する検討会.m4a","URL2":"https://www.mlit.go.jp/seisakutokatsu/freight/seisakutokatsu_freight_tk1_000278.html","備考":"2030年度に向けた総合物流施策大綱検討会では、現行施策のKPI達成に課題が多いと報告された。輸送力不足やCN実現へ、自動化・DX、商慣行見直し、人材確保など、持続可能な物流に向け多様な施策が議論された。","会議":"会議","isBookmarked":false,"_originalIndex":176},{"日付":"2025/07/14","開催日":"2025/07/11","タイトル名":"中央最低賃金審議会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中央最低賃金審議会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59482.html","備考":"中央最低賃金審議会は、令和7年7月11日に開催され、令和7年度地域別最低賃金額改定の目安について諮問された。政府は、2020年代に全国平均1,500円達成、実質賃金年1%上昇を目標とし、新しい資本主義のグランドデザインに基づき、中小企業の価格転嫁や生産性向上等を支援する方針である。","会議":"会議","isBookmarked":false,"_originalIndex":177},{"日付":"2025/07/14","開催日":"2025/07/11","タイトル名":"中央最低賃金審議会・目安に関する小委員会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中央最低賃金審議会・目安に関する小委員会.m4a","URL2":"https://www.mhlw.go.jp/stf/shingi/shingi-tingin_127941.html","備考":"日本政府は、デフレ脱却と成長型経済への移行を目指し、賃上げを成長戦略の要と位置付ける。中小企業の賃上げ促進と最低賃金引き上げを柱とし、価格転嫁、生産性向上、人材育成など多岐にわたる政策を総動員している。実質賃金年1%上昇、全国平均最低賃金1,500円達成を目標とするものである。","会議":"会議","isBookmarked":false,"_originalIndex":178},{"日付":"2025/07/14","開催日":"2025/07/11","タイトル名":"中小企業政策審議会・中小企業経営支援分科会・取引問題小委員会（中小企業庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中小企業政策審議会・中小企業経営支援分科会・取引問題小委員会.m4a","URL2":"https://www.chusho.meti.go.jp/koukai/shingikai/torihikimondai/022/022.html","備考":"下請法・振興法の改正に伴い、中小企業政策審議会は振興基準を改定した。これは「下請」等を「受託」等に用語見直し、約束手形払いや一方的な対価決定を禁止し、サプライチェーン全体での共存共栄を促進するものである。中小受託事業者が活用しやすいよう構成も整理され、パートナーシップ構築宣言のひな形も改正された。","会議":"会議","isBookmarked":false,"_originalIndex":179},{"日付":"2025/07/14","開催日":"2025/07/10","タイトル名":"NISAに関する有識者会議（金融庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/NISA有識者会議.m4a","URL2":"https://www.fsa.go.jp/singi/nisa_kaigi/siryou/20250710.html","備考":"NISA有識者会議では、家計の安定的な資産形成促進が政策目的と再確認された。新NISA開始後、口座数や買付額は増加し、幅広い世代・年収層が利用している。今後は効果検証の継続、対象商品の多様化、金融経済教育の重要性等が議論されている。","会議":"会議","isBookmarked":false,"_originalIndex":180},{"日付":"2025/07/15","開催日":"2025/07/14","タイトル名":"中央教育審議会・大学分科会・質向上・質保証システム部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中央教育審議会・大学分科会・質向上・質保証システム部会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo4/055/giji_list/1422801_00004.html","備考":"日本の高等教育制度の現状と、AIの教育活用における影響・課題が詳述されている。ミネルバ大学の汎用的能力育成モデルも紹介され、日本のデジタル競争力向上へ情報活用能力の抜本的強化が提言される。","会議":"会議","isBookmarked":false,"_originalIndex":181},{"日付":"2025/07/15","開催日":"2025/07/09","タイトル名":"自動運転インフラ検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/自動運転インフラ検討会.m4a","URL2":"https://www.mlit.go.jp/road/ir/ir-council/jido-infra/doc03.html","備考":"自動運転実現に向け、高速道路や一般道でインフラ連携の取り組みが進められている。V2X/V2N通信の活用、費用負担、信号情報提供のルール等が検討課題であり、実証実験を通じ技術基準やガイドライン策定を目指す。AIベースの自動運転技術発展も踏まえ、インフラとの役割分担が議論されている。","会議":"会議","isBookmarked":false,"_originalIndex":182},{"日付":"2025/07/15","開催日":"2025/07/14","タイトル名":"今後の医学教育の在り方に関する検討会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/今後の医学教育の在り方に関する検討会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/koutou/124/toushin/mext_00005.html","備考":"大学病院は物価高騰等で経営が厳しく、役割・機能の重点化が求められている。医師の働き方改革や処遇改善、研究環境の整備、質の高い教育提供、地域貢献を進め、持続可能な運営を目指す必要がある。国や各大学が連携し、財政支援や人材確保に取り組むべきである。","会議":"会議","isBookmarked":false,"_originalIndex":183},{"日付":"2025/07/15","開催日":"2025/07/14","タイトル名":"全国的な学力調査に関する専門家会議・CBT化検討WG合同会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/全国的な学力調査に関する専門家会議・CBT化検討WG合同会議.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/shotou/200/siryo/mext_00001.html","備考":"令和7年度全国学力・学習状況調査は、児童生徒の学力や学習状況を把握し、教育施策や学校での学習指導の改善に役立てることを目的とする。今年度は中学校理科でCBT（コンピュータ使用型調査）が導入され、IRT（項目反応理論）に基づいた結果が公表された。IRTは異なる問題でも学力比較を可能にする理論である。今後、2026年度には中学校英語、2027年度には小学校・中学校の全教科でCBTに全面移行する予定である。","会議":"会議","isBookmarked":false,"_originalIndex":184},{"日付":"2025/07/15","開催日":"2025/07/14","タイトル名":"文化審議会・国語分科会（文化庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/文化審議会・国語分科会.m4a","URL2":"https://www.bunka.go.jp/seisaku/bunkashingikai/kokugo/kokugo/kokugo_91/94242501.html","備考":"文化審議会はローマ字のつづり方を見直し、社会に定着しない現行告示を改定した。将来の安定、表記機能向上、慣用整理が目的である。社会で多用されるつづりを採用し、長音表記に新方式を導入した。各慣用を尊重しつつ、一般社会の指針を示すものである。","会議":"会議","isBookmarked":false,"_originalIndex":185},{"日付":"2025/07/16","開催日":"2025/07/15","タイトル名":"GXリーグにおけるサプライチェーンでの取組のあり方に関する研究会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/GXリーグサプライチェーン研究会.m4a","URL2":"https://www.meti.go.jp/shingikai/energy_environment/gx_league/002.html","備考":"GXリーグは、サプライチェーンでの排出削減を通じたGX市場創造を目指している。第2回研究会では、優良事例の横展開や中小企業への取り組み浸透の重要性が議論された。Scope3排出量の可視化や算定の困難さ、脱炭素化に伴うコスト負担、消費者への価値訴求が共通課題とされており、各企業は具体的な削減事例を共有しつつ、政府による支援策や制度整備の必要性を訴えている。","会議":"会議","isBookmarked":false,"_originalIndex":186},{"日付":"2025/07/16","開催日":"2025/07/15","タイトル名":"エコツーリズム推進基本方針に関する検討会（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/エコツーリズム推進基本方針に関する検討会.m4a","URL2":"https://www.env.go.jp/press/press_00206.html","備考":"令和7年度エコツーリズム推進基本方針に関する検討会が開催された。本検討会は、エコツーリズム推進法に基づきおおむね5年ごとに行われる基本方針見直しの一環である。会議では、方針見直しの経緯や今後のスケジュールが示され、日本におけるエコツーリズム推進の現状と課題について議論された。特に、エコツーリズム推進全体構想認定地域の課題（財源・人材確保、目に見える成果の不足）や、ガイドの低収入、オーバーツーリズムへの対応などが挙げられた。環境省を含む関係省庁の取り組みや支援策も提示された。","会議":"会議","isBookmarked":false,"_originalIndex":187},{"日付":"2025/07/16","開催日":"2025/07/15","タイトル名":"科学技術・学術審議会研究計画・評価分科会・宇宙開発利用部会・国際宇宙ステーション・国際宇宙探査小委員会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/宇宙開発利用部会・国際宇宙ステーション・国際宇宙探査小委員会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu2/071/shiryo/1420983_00001.html","備考":"宇宙資源利用の経済性と月・小惑星探査の動向、JAXAがポストISS時代に向けてラボ機能とハブ機能を強化し、地球低軌道利用を拡大する計画を説明する。また、月面活動に必要な通信技術開発や、米国議会での宇宙予算案、各国の宇宙ステーション計画など、国際的な宇宙探査の最新動向が詳述されている。","会議":"会議","isBookmarked":false,"_originalIndex":188},{"日付":"2025/07/16","開催日":"2025/07/15","タイトル名":"温泉資源の保護に関するガイドライン検討会（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/温泉資源の保護に関するガイドライン検討会.m4a","URL2":"https://www.env.go.jp/nature/onsen/council/guide/06.html","備考":"温泉資源の保護に関するガイドラインは、都道府県の温泉行政における許可事務の判断基準を示す総合的な指針である。令和7年度に設置された検討会は、2020年に更新されたガイドラインを総点検し、掘削等の原則禁止区域の設定、モニタリング、公益侵害の類型、大深度掘削等に関する専門的な詳細検討を行う。","会議":"会議","isBookmarked":false,"_originalIndex":189},{"日付":"2025/07/16","開催日":"2025/07/15","タイトル名":"スポーツ審議会・総会（スポーツ庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/スポーツ審議会・総会.m4a","URL2":"https://www.mext.go.jp/sports/b_menu/shingi/001_index/shiryo/jsa_00054.html","備考":"スポーツ基本法改正により、ウェルビーイング向上、共生社会、地域経済活性化が目指される。第3期スポーツ基本計画は、多様な参画、DX、国際競技力向上を柱とし、少子化を踏まえ部活動の地域展開やアスリート支援を推進。社会変化に応じた政策を展開中である。","会議":"会議","isBookmarked":false,"_originalIndex":190},{"日付":"2025/07/16","開催日":"2025/07/15","タイトル名":"中山間地域等直接支払制度に関する第三者委員会（農林水産省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中山間地域等直接支払制度に関する第三者委員会.m4a","URL2":"https://www.maff.go.jp/j/nousin/tyusan/siharai_seido/s_daisan_6ki/1.html","備考":"中山間地域等直接支払制度は、不利な農業生産条件を補正し、多面的機能の維持や農用地の減少防止を図るため、国が実施する制度である。高齢化や人材不足といった課題に対応するため、集落協定のネットワーク化やスマート農業導入を推進し、持続的な農業活動体制の構築を目指している。第三者委員会は、この交付金の交付状況の点検や効果の評価、特認地域等の調整を行う中立的な機関である。","会議":"会議","isBookmarked":false,"_originalIndex":191},{"日付":"2025/07/16","開催日":"2025/07/15","タイトル名":"科学技術・学術審議会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/科学技術・学術審議会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu0/shiryo/mext_00021.html","備考":"日本の研究力向上に向け、先端研究基盤の刷新が進められている。全国的な研究設備や技術専門人材の共用ネットワークを構築し、AIを活用した科学研究を推進。競争的研究費の使途を変革し、データ利活用や機器開発を強化する。これにより、研究の創造性・効率性を最大化し、多様な人材を育成する方針である。","会議":"会議","isBookmarked":false,"_originalIndex":192},{"日付":"2025/07/16","開催日":"2025/07/15","タイトル名":"情報通信審議会・総会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/情報通信審議会総会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/sokai/02tsushin10_04000675.html","備考":"新たな情報通信技術戦略は、人手不足や災害激甚化などの社会課題を踏まえ、2030年代に目指すべき社会像の実現に向けたNICTの役割を示したものである。AI・Beyond5G・量子情報通信・サイバーセキュリティの4つを戦略領域とし、基礎的・基盤的研究開発分野の重点的推進と、社会実装・外部連携機能の強化を進める。","会議":"会議","isBookmarked":false,"_originalIndex":193},{"日付":"2025/07/17","開催日":"2025/07/16","タイトル名":"障害者政策委員会（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/障害者政策委員会.m4a","URL2":"https://www8.cao.go.jp/shougai/suishin/seisaku_iinkai/k_84/index.html","備考":"障害者差別解消に向けた相談窓口「つなぐ窓口」の試行結果が報告され、手話が言語として促進される手話施策推進法が施行された。また、障害の有無に関わらず交流を深める「ともともフェスタ2025」が開催され、共生社会実現に向けた取り組みが進められていることが示された。","会議":"会議","isBookmarked":false,"_originalIndex":194},{"日付":"2025/07/17","開催日":"2025/07/15","タイトル名":"消費者委員会（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/消費者委員会.m4a","URL2":"https://www.cao.go.jp/consumer/iinkai/2025/466/shiryou/index.html","備考":"消費者委員会は2025年7月15日に「国民を詐欺から守るための総合対策2.0」を議論した。令和6年の詐欺被害額は4,000億円を超え、平成元年以降で過去最高であり、特にSNS型投資・ロマンス詐欺の被害が急増し、極めて憂慮すべき状況である。このため、国民を詐欺から守るべく、被害防止、犯行加担防止、犯罪ツールの奪取、犯罪者の検挙という四つの柱のもと、官民一体となった総合対策が進められている。","会議":"会議","isBookmarked":false,"_originalIndex":195},{"日付":"2025/07/17","開催日":"2025/07/16","タイトル名":"2025年6月の訪日外客数（観光庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/2025年6月訪日外客数.m4a","URL2":"https://www.jnto.go.jp/news/press/20250716_monthly.html","備考":"2025年6月の訪日外客数は337万7,800人となり、6月として過去最高を記録した。上半期の累計は2,151万8,100人に達し、過去最速で2,000万人を突破した。米国が単月で過去最高を更新したほか、韓国や台湾、シンガポールを含む15市場で6月として過去最高を記録した。2025年4月から6月期の訪日外国人旅行消費額は2兆5,250億円と推計され、前年同期比で18.0%増加した。消費額は中国が最も大きく、次いで米国、台湾、韓国の順であった。費目別では宿泊費が最多を占めた。","会議":"会議","isBookmarked":false,"_originalIndex":196},{"日付":"2025/07/18","開催日":"2025/07/16","タイトル名":"九州地方火山情報アドバイザリー会議（気象庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/九州地方火山情報アドバイザリー会議.m4a","URL2":"https://www.jma.go.jp/jma/kishou/shingikai/kazan/volcano_advisory/meeting/20250716/20250716.html","備考":"本資料は、霧島山（新燃岳）の噴火シナリオと過去の活動実績が示されている。2025年6月以降の活動状況、特に地殻変動や火山灰組成の分析結果を詳述し、過去のマグマ噴火との比較や今後の活動推移、情報提供の改善が九州地方火山情報アドバイザリー会議で議論されている。","会議":"会議","isBookmarked":false,"_originalIndex":197},{"日付":"2025/07/18","開催日":"2025/07/16","タイトル名":"ALPS処理水に係る海域モニタリング専門家会議（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/ALPS処理水に係る海域モニタリング専門家会議.m4a","URL2":"https://www.env.go.jp/water/shorisui/committee/015.html","備考":"ALPS処理水放出後、水産庁、福島県、東京電力、環境省、原子力規制委員会が連携し、海水や海洋生物の放射性物質モニタリングを実施している。迅速分析と精密分析により、トリチウムやセシウム137等の核種が測定され、その結果は全て検出下限値未満か、海洋放出開始前の変動範囲と同程度であり、WHO飲料水ガイドラインや国の安全規制の基準を大幅に下回っている。これらの結果から、人や環境への影響はないと評価されている。IAEAは日本の分析機関が高い正確性と能力を有すると評価している。","会議":"会議","isBookmarked":false,"_originalIndex":198},{"日付":"2025/07/18","開催日":"2025/07/17","タイトル名":"産業構造審議会・通商・貿易分科会・特殊貿易措置小委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/産業構造審議会・通商・貿易分科会・特殊貿易措置小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/tsusho_boeki/tokushu_boeki/034.html","備考":"中国産黒鉛電極に対する不当廉売関税の課税調査が実施された。調査の結果、不当廉売された貨物の輸入の事実、および当該輸入が本邦の産業に実質的な損害を与えている事実が認められた。これにより、95.2%の不当廉売関税が5年間賦課されることが決定された。本調査は、多岐にわたる利害関係者への質問状送付、サンプリング、現地調査など、慎重な手続きを経て行われた。","会議":"会議","isBookmarked":false,"_originalIndex":199},{"日付":"2025/07/18","開催日":"2025/07/17","タイトル名":"日本のクルーズ市場の持続的発展に向けた有識者検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/日本のクルーズ市場の持続的発展に向けた有識者検討会.m4a","URL2":"https://www.mlit.go.jp/maritime/maritime_tk2_000018.html","備考":"日本のクルーズ市場は、富裕層中心で普及が遅れている。コロナ禍から回復し、新造船投入で多様化が進む。2030年までに日本人クルーズ人口100万人を目標とし、価格・期間の手頃な商品開発、販売・情報提供の強化、新規顧客層獲得を通じ、持続的な発展と新たな産業・雇用の創出を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":200},{"日付":"2025/07/18","開催日":"2025/07/17","タイトル名":"情報通信審議会・情報通信技術分科会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/情報通信審議会・情報通信技術分科会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/bunkakai/02tsushin10_04000676.html","備考":"提示された情報通信審議会の資料は、主に43GHz帯鉄道用無線通信システムの技術条件検討、6/6.5/7.5GHz帯固定通信システムの高速大容量化に係る技術条件、高高度プラットフォーム(HAPS)、および電気通信事業におけるパブリッククラウド利用に関する検討の開始について述べている。","会議":"会議","isBookmarked":false,"_originalIndex":201},{"日付":"2025/07/22","開催日":"2025/07/18","タイトル名":"東京の雇用就業を考える有識者会議（東京都）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/東京の雇用就業を考える有識者会議.m4a","URL2":"https://www.hataraku.metro.tokyo.lg.jp/plan/yuushikisya_kaigi/06/index.html","備考":"東京の雇用就業を考える有識者会議は、人手不足が深刻化する中、フリーランス、副業、スキマバイトを含む多様な働き方の有効活用を議論した。東京都の雇用現状や労使関係、賃上げ、障害者雇用、ハラスメント対策等、幅広い雇用課題の方向性を検討している。","会議":"会議","isBookmarked":false,"_originalIndex":202},{"日付":"2025/07/22","開催日":"2025/07/17","タイトル名":"金融審議会・サステナビリティ情報の開示と保証のあり方に関するWG（金融庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/金融審議会・サステナビリティ情報の開示と保証のあり方に関するWG.m4a","URL2":"https://www.fsa.go.jp/singi/singi_kinyu/tosin/20250717.html","備考":"金融審議会は、プライム市場上場企業を対象に、時価総額に応じ2027年3月期からSSBJ基準の適用を義務化するロードマップを提示した。保証は翌期から限定的保証水準でScope1・2、ガバナンス、リスク管理を対象とする。","会議":"会議","isBookmarked":false,"_originalIndex":203},{"日付":"2025/07/22","開催日":"2025/07/18","タイトル名":"健康経営推進検討会・日本健康会議・健康経営・健康宣言15万社WG合同開催（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/健康経営推進検討会・日本健康会議・健康経営・健康宣言15万社WG合同開催.m4a","URL2":"https://www.meti.go.jp/shingikai/mono_info_service/health_management/003.html","備考":"健康経営優良法人認定制度の令和7年度改訂が報告された。性差・年代別対策、サプライチェーン連携、両立支援の要件追加など多様な企業対応を強化。中小企業普及やコンサル質向上も図り、制度の社会浸透を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":204},{"日付":"2025/07/22","開催日":"2025/07/18","タイトル名":"情報通信審議会・情報通信技術分科会・電波有効利用委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/情報通信審議会・情報通信技術分科会・電波有効利用委員会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/denpa_yukoriyo/02kiban09_04000662.html","備考":"情報通信審議会電波有効利用委員会は、社会変化に対応した電波有効利用推進のため、電波安全性研究の見直し、ワイヤレス電力伝送（WPT）制度運用、情報発信のあり方を検討した。無線設備の認証制度対応や、携帯事業者の周波数、免許、インフラシェアリング、電波利用料に関する提言も議論された。","会議":"会議","isBookmarked":false,"_originalIndex":205},{"日付":"2025/07/22","開催日":"2025/07/18","タイトル名":"情報通信審議会・電気通信事業政策部会・電気通信番号政策委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/情報通信審議会・電気通信事業政策部会・電気通信番号政策委員会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/bango_seisaku/02kiban06_04000191.html","備考":"令和7年改正法に基づき、電話番号の犯罪利用対策として電気通信番号使用計画の認定基準に「申請者の役務継続性」が追加された。詐欺罪等に利用されるおそれが高い者の要件や、卸元事業者の確認義務も具体化される。特殊詐欺に悪用が多い固定電話番号、特定IP電話番号、音声伝送携帯電話番号が規律の対象であり、役務継続性には6ヶ月の事業継続期間などが考慮され、50番号以下の提供は確認義務の適用除外とする方向性である。関係団体はおおむね賛同している。","会議":"会議","isBookmarked":false,"_originalIndex":206},{"日付":"2025/07/23","開催日":"2025/07/22","タイトル名":"情報通信審議会・情報通信技術分科会・新世代モバイル通信システム委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/新世代モバイル通信システム委員会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/5th_generation/02kiban14_04001236.html","備考":"高高度プラットフォームステーション（HAPS）は、高度約20kmの成層圏を飛行する無人航空機に携帯電話基地局を搭載し、離島や災害時を含む広域での通信を可能にする技術である。主に2GHz帯と39GHz帯を利用し、既存の携帯電話端末との直接通信が想定されている。令和8年（2026年）以降の導入を目指し、現在、技術的条件の検討が進められており、NTTドコモやソフトバンクなどが、その事業推進に取り組んでいる。","会議":"会議","isBookmarked":false,"_originalIndex":207},{"日付":"2025/07/23","開催日":"2025/07/22","タイトル名":"定置用蓄電システム普及拡大検討会（資源エネルギー庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/定置用蓄電システム普及拡大検討会.m4a","URL2":"https://www.meti.go.jp/shingikai/energy_environment/storage_system/2025_001.html","備考":"2025年度定置用蓄電システム普及拡大検討会は、開催目的や議事運営を共有した。系統用蓄電池のサイバーセキュリティリスクと対策、業務・産業用蓄電システムのユースケースや収益性を議論した。現状の課題は投資回収の困難さやサイバーセキュリティ対策であり、安全性確保や普及拡大に向けた取り組みが重要である。","会議":"会議","isBookmarked":false,"_originalIndex":208},{"日付":"2025/07/23","開催日":"2025/07/22","タイトル名":"総合資源エネルギー調査会・電力・ガス事業分科会・次世代電力・ガス事業基盤構築小委員会・電力システム改革の検証を踏まえた制度設計WG（資源エネルギー庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/電力システム改革の検証を踏まえた制度設計WG.m4a","URL2":"https://www.meti.go.jp/shingikai/enecho/denryoku_gas/jisedai_kiban/system_design_wg/003.html","備考":"電力システム改革後、電源投資の予見性低下や燃料・人材確保が課題であり、脱炭素化と安定供給の両立へ、国は投資促進や燃料確保を支援し、電力と調整力を同時取引する市場導入を進めることが重要である。","会議":"会議","isBookmarked":false,"_originalIndex":209},{"日付":"2025/07/23","開催日":"2025/07/22","タイトル名":"総合資源エネルギー調査会・電力・ガス事業分科会・次世代電力・ガス事業基盤構築小委員会・制度検討作業部会（資源エネルギー庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/次世代電力・ガス事業基盤構築小委員会・制度検討作業部会.m4a","URL2":"https://www.meti.go.jp/shingikai/enecho/denryoku_gas/jisedai_kiban/system_review/106.html","備考":"総合資源エネルギー調査会では、2025年度容量市場メインオークションの需要曲線原案が審議された。目標調達量は1億8,997万kW、指標価格NetCONEは10,075円/kWと算定された。これは前年度比約2.0%の増加で、物価上昇がNetCONE増に影響した。本原案は広域機関が策定し、審議を経て2025年7月末から8月上旬に公表される予定である。","会議":"会議","isBookmarked":false,"_originalIndex":210},{"日付":"2025/07/24","開催日":"2025/07/22","タイトル名":"中央最低賃金審議会・目安に関する小委員会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中央最低賃金審議会・目安に関する小委員会2.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59745.html","備考":"中央最低賃金審議会・目安に関する小委員会は、消費者物価指数、諸外国の最低賃金制度、賃金改定状況、賃金分布、生活保護との関係、及び最新の経済指標が示した。","会議":"会議","isBookmarked":false,"_originalIndex":211},{"日付":"2025/07/24","開催日":"2025/07/23","タイトル名":"産業構造審議会・グリーンイノベーションプロジェクト部会・グリーン電力の普及促進等分野WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/グリーン電力推進WG.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/green_innovation/green_power/012.html","備考":"産業構造審議会グリーンイノベーションプロジェクト部会・グリーン電力の普及促進等分野WGは、洋上風力と次世代太陽電池の開発を推進している。洋上風力は2040年までに30-45GW導入を目指し、コスト低減、サプライチェーン強化、国際連携を図る。次世代太陽電池は20GW導入、低コスト化、量産化、タンデム型開発を通じ、脱炭素化と産業競争力強化に貢献するものである。","会議":"会議","isBookmarked":false,"_originalIndex":212},{"日付":"2025/07/24","開催日":"2025/07/23","タイトル名":"情報通信行政・郵政行政審議会・電気通信事業部会・市場検証委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/情報通信行政・郵政行政審議会・電気通信事業部会・市場検証委員会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/yusei/shijokensho/index.html","備考":"電気通信事業分野の公正競争確保のため、総務省が毎年、競争状況や規制遵守状況を調査・評価する方針案である。NTT東西の規制緩和やNTTデータグループの完全子会社化なども検証対象とし、市場環境変化に対応した制度見直しに活用される.","会議":"会議","isBookmarked":false,"_originalIndex":213},{"日付":"2025/07/24","開催日":"2025/07/23","タイトル名":"安心・安全なメタバースの実現に関する研究会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/安心・安全なメタバースの実現に関する研究会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/metaverse2/16_siryou.html","備考":"「安心・安全なメタバースの実現に関する研究会」の報告書2025案は、拡大するメタバース市場と多様化する利用者の動向を分析している。ハプティクスやAIなどの先端技術の活用動向と、それに伴うデータ取得や身体・感情への影響に関する課題を整理した。国内外の政策・制度、ソフトローの動向を概説し、「メタバースの原則（第2.0版）」の検討状況を詳述した。さらに、安心・安全なメタバースの実現と利活用促進に向けた今後の課題が提示された。","会議":"会議","isBookmarked":false,"_originalIndex":214},{"日付":"2025/07/24","開催日":"2025/07/23","タイトル名":"労働政策審議会・職業安定分科会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/労働政策審議会・職業安定分科会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_030127159_001_00088.html","備考":"働き方改革関連法に基づく同一労働同一賃金制度は、非正規雇用労働者の待遇改善を推進している。パートタイム・有期雇用・派遣労働者に対し、均等・均衡待遇確保、説明義務強化、行政ADRの整備が図られた。賃金格差は縮小傾向にあるものの、更なる労使の取り組み促進と行政による履行確保が課題である。","会議":"会議","isBookmarked":false,"_originalIndex":215},{"日付":"2025/07/25","開催日":"2025/07/24","タイトル名":"スポーツ審議会・健康スポーツ部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/スポーツ審議会_-健康スポーツ部会.m4a","URL2":"https://www.mext.go.jp/sports/b_menu/shingi/001_index/bunkabukai002/gijiroku/1422867_00039.html","備考":"スポーツ審議会では、女性の健康課題や経済損失、妊産婦や高齢者の運動不足への多角的支援が議題に挙がった。女子学生のスポーツ習慣化、熱中症予防を含む安全確保、障害者スポーツ指導、スポーツと宇宙連携なども議論された。","会議":"会議","isBookmarked":false,"_originalIndex":216},{"日付":"2025/07/25","開催日":"2025/07/24","タイトル名":"地域医療構想及び医療計画等に関する検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/地域医療構想及び医療計画等に関する検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59892.html","備考":"地域医療構想及び医療計画等に関する検討会は、2040年を見据え、人口減少・高齢化に対応する医療提供体制の構築を目的としている。この検討会では、必要病床数の推計、医療機関機能の分化・連携、医師偏在対策、さらに救急・周産期・小児・在宅・災害・新興感染症医療など多岐にわたる事項が議論される。","会議":"会議","isBookmarked":false,"_originalIndex":217},{"日付":"2025/07/25","開催日":"2025/07/24","タイトル名":"産業構造審議会・イノベーション・環境分科会・排出量取引制度小委員会・製造業ベンチマーク検討WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/排出量取引制度小委員会・製造業ベンチマーク検討WG.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sangyo_gijutsu/emissions_trading/benchmark_wg/001.html","備考":"経済産業省の製造業ベンチマーク検討ワーキンググループは、2026年度に開始する排出量取引制度に向け、製造業の排出量ベンチマークを検討している。各業種の複雑なプロセス、連産品、多様な燃料構成等の特性を考慮し、公平な割当量を算定する方針である。炭素漏洩回避と産業競争力の維持も重視される。","会議":"会議","isBookmarked":false,"_originalIndex":218},{"日付":"2025/07/25","開催日":"2025/07/24","タイトル名":"社会保障審議会・障害者部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/社会保障審議会・障害者部会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59913.html","備考":"2040年に向け、人口減少と高齢化に対応すべく地域包括ケアシステムを深化させる。地域特性に応じた医療・介護・障害福祉・こどもサービスの提供体制を構築し、人材確保、生産性向上、経営支援、多分野連携を通じ地域共生社会の実現を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":219},{"日付":"2025/07/25","開催日":"2025/07/24","タイトル名":"2040年に向けたサービス提供体制等のあり方検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/2040年に向けたサービス提供体制等のあり方検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59876.html","備考":"2040年に向け、高齢化と人口減少が進む中、地域包括ケアシステムを深化させ、医療・介護・予防・生活支援を確保する必要がある。地域の実情に応じたサービス提供体制を構築し、人材確保、職場環境改善、経営支援、事業者連携、既存施設活用、多機能化、ICT導入、広域連携等を進め、分野横断的な連携で地域共生社会を実現するものである","会議":"会議","isBookmarked":false,"_originalIndex":220},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"がん診療提供体制のあり方に関する検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/セルフケア・セルフメディケーション推進に関する有識者検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59971.html","備考":"「がん診療提供体制のあり方に関する検討会」は、全国どこでも質の高いがん医療を持続的に提供するため、2040年を見据えた体制の均てん化と集約化を検討している。三大療法（手術、放射線、薬物）の需要変化や医師の偏在に対応し、拠点病院の役割分担や地域連携を強化する方針である。特に、手術療法では医師不足に対応した集約化、放射線療法では高額機器の効率的配置、薬物療法ではアクセス確保と遠隔医療の活用が課題とされている。がんゲノム医療の体制構築も進め、都道府県協議会が中心となり住民理解を得ながら進めることが重要である。","会議":"会議","isBookmarked":false,"_originalIndex":221},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"グリーン製品の需要創出等によるバリューチェーン全体の脱炭素化に向けた検討会（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/グリーン製品の需要創出等によるバリューチェーン全体の脱炭素化に向けた検討会.m4a","URL2":"https://www.env.go.jp/council/valuechain_decarbonization/page_03_00002.html","備考":"「グリーン製品の需要創出等によるバリューチェーン全体の脱炭素化に向けた検討会」は、2050年ネット・ゼロ達成を目指し、多角的な課題に取り組んでいる。グリーン製品の最終需要喚起、バリューチェーン内の企業連携強化、そして中堅・中小企業の脱炭素経営浸透・定着が主要な焦点である。これらの実現のため、政府・企業・消費者間の協力、CFP（カーボンフットプリント）算定・表示支援、サプライヤーエンゲージメント、地域単位での支援施策等が推進されている。全体として、市場創出と排出削減の同時実現が目標である。","会議":"会議","isBookmarked":false,"_originalIndex":222},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"セルフケア・セルフメディケーション推進に関する有識者検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/セルフケア・セルフメディケーション推進に関する有識者検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_16365.html","備考":"「セルフケア・セルフメディケーション推進に関する有識者検討会」は、国民の健康増進と医療資源の有効活用を目指し、セルフメディケーション税制のあり方を議論している。アレルギー性鼻炎薬市場の分析結果によると、同税制導入は患者の医療機関受診を減少させたが、医師の処方量を増加させた。結果として薬剤費はわずかに抑制されたものの、政策の効果をさらに高めるための見直しが提言されている。","会議":"会議","isBookmarked":false,"_originalIndex":223},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"中央教育審議会・生涯学習分科会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/中央教育審議会・生涯学習分科会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo2/siryou/1422064_00036.htm","備考":"人生100年時代とデジタル社会に対応し、ウェルビーイング実現へ生涯学習・リカレント教育が推進されている。社会教育人材の育成強化や高等教育システムの再構築（質の向上、規模適正化、アクセス確保）、専修学校制度の見直し、外国人日本語学習支援など、多岐にわたる施策が進められている。","会議":"会議","isBookmarked":false,"_originalIndex":224},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"産業構造審議会・イノベーション・環境分科会・資源循環経済小委員会・脱炭素化再生資源利用WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/脱炭素化再生資源利用WG.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sangyo_gijutsu/resource_circulation/decarbonization_recycled_wg/001.html","備考":"産業構造審議会は、脱炭素化のため再生プラスチックの利用を促進する新法を計画している。容器包装、家電4品目、自動車を対象に、生産・販売量が一定以上の事業者に再生材利用計画と定期報告を義務付ける。各業界は賛同しつつ、再生材の品質・供給不足、コスト、国際的な定義の調整、報告体制構築に課題があることを指摘し、政府の支援を要望している。","会議":"会議","isBookmarked":false,"_originalIndex":225},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"経済社会情勢の変化に対応したキャリアコンサルティングの実現に関する研究会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/経済社会情勢の変化に対応したキャリアコンサルティングの実現に関する研究会2.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59917.html","備考":"経済社会情勢が変化する中、キャリアコンサルタントには労働市場や産業構造の変化に対応した能力が求められている。個人が自律的にキャリアを築く開発型支援の重要性が強調され、企業内での活用促進、教育・需給調整といった各領域での専門性向上が議論されている。特に、スキル可視化、データ活用、組織への働きかけが今後の課題である。","会議":"会議","isBookmarked":false,"_originalIndex":226},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"食品衛生基準審議会・新開発食品調査部会（消費者庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/食品衛生基準審議会・新開発食品調査部会.m4a","URL2":"https://www.caa.go.jp/policies/council/fssc/meeting_materials/review_meeting_004/043034.html","備考":"細胞培養食品の安全性確保のため、細胞調達、生産工程、食品加工の各段階における懸念点やハザードを整理し、確認ポイントを策定する方針である。ハザードには細胞培養食品特有のものや従来食品と共通のものが想定されており、これらを特定し、最終的にガイドライン策定に繋げる。併せて、組換えDNA技術応用食品やゲノム編集技術応用食品の安全性審査・届出制度も参照しつつ、細胞培養食品の規制のあり方も議論される予定である。","会議":"会議","isBookmarked":false,"_originalIndex":227},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"外国人児童生徒等の教育の充実に関する有識者会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/外国人児童生徒等の教育の充実に関する有識者会議2.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/shotou/196/siryo/1418919_00005.html","備考":"外国人児童生徒教育有識者会議は、日本語指導が必要な児童生徒の大幅な増加を受け、質の高い教育提供と共生社会実現のため、指導内容・体制の充実、教師の指導力向上、就学・進学・就職機会の確保等を検討している。多様性を強みと捉え、デジタル技術の活用も図り、包括的支援を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":228},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"科学技術・学術審議会・研究計画・評価分科会・宇宙開発利用部会・調査・安全小委員会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/宇宙開発利用部会：調査・安全小委員会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu2/060/shiryo/1421907_00021.html","備考":"科学技術・学術審議会宇宙開発利用部会調査・安全小委員会（第55回）では、第13期の委員会活動と、JAXAが新型宇宙ステーション補給機HTV-X1の係留フェーズに関する安全対策を講じ、その安全性を確認した結果について審議された。JAXAはNASAとの共同有人安全審査会やJAXA安全審査委員会を経て、HTV-X1初号機の安全性が確認され、所定の安全指針に合致していることを報告している。","会議":"会議","isBookmarked":false,"_originalIndex":229},{"日付":"2025/07/28","開催日":"2025/07/25","タイトル名":"米国の関税措置に関する総合対策本部（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/米国の関税措置に関する総合対策本部20250725.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/tariff_measures/dai6/gijisidai.html","備考":"日米は米国の関税措置に関し合意した。相互関税と自動車関税は15%に半減され、半導体や医薬品では日本が他国に劣後しない確約を得た。日本は自国関税の引き下げなしに、米国農産品やエネルギー、半導体などの米国製品購入を拡大。また、経済安全保障上重要な9分野のサプライチェーン構築のため、日本は米国に最大5500億ドル規模の投資を行い、利益の90%は米国に還元される。これは「関税より投資」の原則に基づく。","会議":"会議","isBookmarked":false,"_originalIndex":230},{"日付":"2025/07/29","開催日":"2025/07/28","タイトル名":"情報通信審議会情報通信技術分科会・IPネットワーク設備委員会・電気通信事業におけるパブリッククラウドシステム利用に関する検討作業班（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/電気通信事業におけるパブリッククラウドシステム利用に関する検討作業班.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/02kiban05_04000734.html","備考":"電気通信事業では、設備の安全・信頼性確保のため法令や基準が定められている。特に、クラウド利用が広がる中で、交換機能などの「コア機能」に他者設備が関わる場合も技術基準の適用対象となった。現在、総務省の作業班がクラウド利用における課題と対策を検討している。","会議":"会議","isBookmarked":false,"_originalIndex":231},{"日付":"2025/07/29","開催日":"2025/07/28","タイトル名":"2040年を見据えて社会とともに歩む私立大学の在り方検討会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/2040年を見据えて社会とともに歩む私立大学の在り方検討会議.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/koutou/132/siryo/mext_00007.html","備考":"日本の私立大学は少子化、地域偏在、文理偏重、経営悪化に直面している。これに対し国は、地域貢献、理工農系人材育成、研究力強化に重点を置いた支援へ転換する方針である。大学経営の改革、再編・統合の促進、設置認可の厳格化を通じ、社会のニーズに応じた大学の構造転換が求められている。","会議":"会議","isBookmarked":false,"_originalIndex":232},{"日付":"2025/07/29","開催日":"2025/07/28","タイトル名":"中央環境審議会・地球環境部会・地球温暖化対策計画フォローアップ専門委員会・産業構造審議会・イノベーション・環境分科会・地球環境小委員会合同会合（経済産業省・環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/産業構造審議会・イノベーション・環境分科会・地球環境小委員会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sangyo_gijutsu/chikyu_kankyo/ondanka_follow_up/003.html","備考":"地球温暖化対策計画は、温室効果ガス削減目標の進捗、GX政策、研究力強化、地域脱炭素化、循環経済移行、農林水産業の変革、国際協力を軸に進む。新たな資金投入、技術開発、産学官連携、国際貢献を通じて、2050年ネットゼロ社会の実現を目指している。","会議":"会議","isBookmarked":false,"_originalIndex":233},{"日付":"2025/07/29","開催日":"2025/07/28","タイトル名":"障害児支援における人材育成に関する検討会（こども家庭庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/障害児支援における人材育成に関する検討会.m4a","URL2":"https://www.cfa.go.jp/councils/support-personnel/04","備考":"障害児支援における人材育成検討会は、全国で質の高い支援を実現するため、研修体系の構築を提言した。こども・若者や子育て当事者の意見を反映し、基礎・実践、リーダー、コア人材の三段階研修と標準カリキュラムを整備した。地域での学び合いを通じ、共生社会の実現を目指す。","会議":"会議","isBookmarked":false,"_originalIndex":234},{"日付":"2025/07/29","開催日":"2025/07/28","タイトル名":"若い世代視点からのライフデザインに関する検討会（こども家庭庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/若い世代視点からのライフデザインに関する検討会.m4a","URL2":"https://www.cfa.go.jp/councils/wakaisedaishiten/26e9c565","備考":"若い世代視点からのライフデザイン検討会は、多様化する人生で自分らしい選択を可能にする支援を議論する。若者が親世代と異なる価値観の中で人生の「解像度」を高め、ウェルビーイング実現へ導く意義がある。現状、ライフ関連情報は不足しており、学校・企業など多様な場での支援拡充が求められる。","会議":"会議","isBookmarked":false,"_originalIndex":235},{"日付":"2025/07/29","開催日":"2025/07/28","タイトル名":"科学技術・学術審議会・学術分科会・研究費部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/科学技術・学術審議会・学術分科会・研究費部会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu4/053/siryo/mext_00002.html","備考":"日本の科学技術・学術振興に関し、研究費部会の議論内容をまとめた資料群である。産学連携、研究トピックの先進性、創発的研究支援事業の現状と成果、新興・分野融合的研究の振興策が示されており、若手研究者支援や研究力強化の重要性が強調されている。","会議":"会議","isBookmarked":false,"_originalIndex":236},{"日付":"2025/07/29","開催日":"2025/07/28","タイトル名":"経済財政諮問会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/経済財政諮問会議-令和7年第9回議事要録.m4a","URL2":"https://www5.cao.go.jp/keizai-shimon/kaigi/minutes/2025/0728agenda.html","備考":"経済財政諮問会議は、国際環境の不確実性や物価高に対応し、安定的な経済財政運営を議論した。賃上げを起点に2040年名目GDP1,000兆円を目指す成長型経済への移行を掲げ、日米連携によるサプライチェーン強靱化、GX・DX、AI活用、社会保障改革等を通じた潜在成長力向上と財政健全化を推進する。","会議":"会議","isBookmarked":false,"_originalIndex":237},{"日付":"2025/07/30","開催日":"2025/07/29","タイトル名":"労災保険制度の在り方に関する研究会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/労災保険制度の在り方に関する研究会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60107.html","備考":"労災保険制度の研究会は、社会変化を踏まえ、制度の適用、給付、徴収の各分野を検証したものである。家事使用人への強制適用や暫定任意適用事業の見直し、特別加入の拡大を議論した。遺族年金の受給要件、遅発性疾病の給付基礎日額、消滅時効、社会復帰促進等事業の処分性、メリット制の評価、事業主への情報提供も検討し、今後の議論や検証が必要な課題を整理した。","会議":"会議","isBookmarked":false,"_originalIndex":238},{"日付":"2025/07/30","開催日":"2025/07/29","タイトル名":"同時市場の在り方等に関する検討会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/同時市場の在り方等に関する検討会.m4a","URL2":"https://www.meti.go.jp/shingikai/energy_environment/doji_shijo_kento/018.html","備考":"同時市場検討会は、電力のkWhと調整力ΔkWを同時に約定する市場設計を進めている。本資料は、電源起動・出力配分ロジック（検証A）と価格算定方法（検証B）に関する第二次中間取りまとめであり、SCUC/SCED最適化、地内混雑時の価格、ΔkWの対価、調整力kWhのシングルプライス化、TSOと小売の需要予測差分対応等の詳細な技術的・制度的課題と検証結果が示されている。","会議":"会議","isBookmarked":false,"_originalIndex":239},{"日付":"2025/07/30","開催日":"2025/07/29","タイトル名":"情報通信審議会・情報通信政策部会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/情報通信審議会・情報通信政策部会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/02tsushin10_04000679.html","備考":"「地域社会DXの推進に向けた情報通信政策の在り方」では、少子高齢化や人口減少など多様な地域課題解決のため、AIを含むデジタル技術や新たな情報通信インフラの活用を強化する方針が示されている。地域ニーズを起点としたソリューション創出、実装支援が柱である。一方で、AIの権利侵害、情報漏洩、環境負荷、信頼性、法整備の遅れに対する懸念意見も多く寄せられている。","会議":"会議","isBookmarked":false,"_originalIndex":240},{"日付":"2025/07/30","開催日":"2025/07/29","タイトル名":"放送事業者におけるガバナンス確保に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/放送事業者におけるガバナンス確保に関する検討会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/hosojigyoshan_governance/02ryutsu09_04000272.html","備考":"放送事業者のガバナンス確保に関し、総務省は民放連等と連携し、経営基盤強化、情報開示、公正な取引、人権尊重、組織風土改革等を議論している。アンケートやガイドライン策定、モニタリングを通じ、事業者の自律的・持続的な社会貢献を目指している。","会議":"会議","isBookmarked":false,"_originalIndex":241},{"日付":"2025/07/30","開催日":"2025/07/29","タイトル名":"日本版包装前面栄養表示に関する検討会（消費者庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/日本版包装前面栄養表示に関する検討会.m4a","URL2":"https://www.caa.go.jp/policies/policy/food_labeling/meeting_materials/review_meeting_013/042598.html","会議":"会議","isBookmarked":false,"_originalIndex":242},{"日付":"2025/07/30","開催日":"2025/07/28","タイトル名":"2030年度に向けた総合物流施策大綱に関する検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/2030年度に向けた総合物流施策大綱に関する検討会2.m4a","URL2":"https://www.mlit.go.jp/seisakutokatsu/freight/seisakutokatsu_freight_tk1_000279.html","備考":"2024年問題を見据え、海運・鉄道・航空各分野でモーダルシフトを推進する。担い手確保に向けた処遇改善、DX化、インフラ整備が急務である。また、荷主の行動変容促進や国による多角的な支援も求められる。","会議":"会議","isBookmarked":false,"_originalIndex":243},{"日付":"2025/07/30","開催日":"2025/07/29","タイトル名":"文化審議会・世界文化遺産部会（文化庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/世界文化遺産部会審議概要.m4a","URL2":"https://www.bunka.go.jp/seisaku/bunkashingikai/isanbukai/sekaiisanbukai_nittei/9_02/94248001.html","備考":"文化審議会世界文化遺産部会は第47回ユネスコ世界遺産委員会について議論した。同委員会では、26件が新たに世界遺産に記載され、総計1,248件となった。危機遺産リストから3件が削除され、現行53件である。また、「佐渡島の金山」含む13件の顕著な普遍的価値の言明が採択された。次回は2026年に韓国で開催される予定だ。","会議":"会議","isBookmarked":false,"_originalIndex":244},{"日付":"2025/07/30","開催日":"2025/07/29","タイトル名":"産業構造審議会・総会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/産業構造審議会総会.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sokai/034.html","備考":"経済産業省は、高付加価値型経済への転換を目指し、成長投資、賃上げ、強靱な経済基盤構築を重点政策とする。米国関税・物価高・人手不足等の課題に対応し、政策評価と産官学連携を通じ、社会課題解決と成長を図る方針である。","会議":"会議","isBookmarked":false,"_originalIndex":245},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"デジタル時代における放送制度の在り方に関する検討会・衛星放送WG（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/衛星放送WG-.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_hososeido/02ryutsu09_04000273.html","備考":"デジタル時代における放送制度の在り方を検討する衛星放送ワーキンググループの資料である。インフラコスト低減や4K放送普及促進、多様なコンテンツ提供等が目的である。インターネット利用増大や若年層のテレビ離れが進む中、衛星放送の広告市場における存在感低下や視聴者層の高齢化が課題であり、新たな視聴環境への対応が求められている。","会議":"会議","isBookmarked":false,"_originalIndex":246},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"食料・農業・農村政策審議会・食糧部会（農林水産省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/食料・農業・農村政策審議会・食糧部会-.m4a","URL2":"https://www.maff.go.jp/j/council/seisaku/syokuryo/250730/0730.html","備考":"食糧部会では、米の需給均衡や備蓄の機動的運営、生産調整の見直しと米粉用米・飼料用米等の生産拡大を詳述している。また、政府備蓄米の放出基準や運営手法、豪州からの輸入米への対応も示され、民間在庫や価格動向、統計調査の見直し、各種支援事業についても言及されている。","会議":"会議","isBookmarked":false,"_originalIndex":247},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"産業構造審議会・イノベーション・環境分科会・資源循環経済小委員会・指定再資源化製品WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/産業構造審議会-イノベーション・環境分科会-資源循環経済小委員会・指定再資源化製品WG.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sangyo_gijutsu/resource_circulation/designated_recycled_products_wg/001.html","備考":"資源循環と安全性の両立を目指し、小型家電やリチウム蓄電池の回収・再資源化が推進されている。携帯電話のMRNや充電式電池のJBRCが回収を進めるものの、発火事故増加や回収率低迷が課題である。今後は加熱式たばこデバイス等を指定再資源化製品に追加し、製品設計の改善や消費者への周知強化を通じて、回収率向上を図る方針である。","会議":"会議","isBookmarked":false,"_originalIndex":248},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"中央環境審議会・循環型社会部会・小型家電リサイクル小委員会・リチウム蓄電池使用製品の回収・リサイクルWG（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/産業構造審議会-イノベーション・環境分科会-資源循環経済小委員会・指定再資源化製品WG.m4a","URL2":"https://www.env.go.jp/council/03recycle/page_00011.html","備考":"資源循環と安全性の両立を目指し、小型家電やリチウム蓄電池の回収・再資源化が推進されている。携帯電話のMRNや充電式電池のJBRCが回収を進めるものの、発火事故増加や回収率低迷が課題である。今後は加熱式たばこデバイス等を指定再資源化製品に追加し、製品設計の改善や消費者への周知強化を通じて、回収率向上を図る方針である。","会議":"会議","isBookmarked":false,"_originalIndex":249},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"自殺総合対策の推進に関する有識者会議（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/自殺総合対策の推進に関する有識者会議.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60248.html","備考":"自殺者数の高止まりを受け、政府は自殺対策基本法を改正し、子供や若者対策を強化している。地域連携、相談体制、人材育成、精神保健、ネット対策、遺族支援など多角的な施策を進めている。","会議":"会議","isBookmarked":false,"_originalIndex":250},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"薬局・薬剤師の機能強化等に関する検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/薬局・薬剤師の機能強化等に関する検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60318.html","備考":"薬局・薬剤師は対物から対人業務へ転換し、かかりつけ機能や地域連携を推進してきたが、健康サポート薬局等の認知度やメリットが不明確な課題がある。このため、検討会は薬局の役割・機能を整理し、地域連携薬局、健康サポート薬局の機能と位置付けを明確化する。個々の薬局の基本機能と地域・拠点で確保すべき機能の基準にメリハリをつけ、実効性のある制度構築を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":251},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"情報通信審議会・電気通信事業政策部会・接続政策委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/情報通信審議会・電気通信事業政策部会・接続政策委員会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/setsuzoku_seisaku/02kiban03_04001117.html","備考":"モバイル接続料の検証と精緻化に関する報告書である。接続料は適正な原価に適正な利潤を加えたものを上限として設定され、その算定方法や適正性が総務省で検証されている。費用配賦の見直し、4G・5G(NSA方式)と5G(SA方式)の一体算定、予測値と実績値の乖離、MVNOへの情報開示などが主な議論点である。公正な競争環境の確保を目指し、算定方法の精緻化が図られている。","会議":"会議","isBookmarked":false,"_originalIndex":252},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"歯科衛生士の業務のあり方等に関する検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/歯科衛生士の業務のあり方等に関する検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60317.html","備考":"歯科衛生士は就業者の半数未満で地域偏在があり、在宅医療等多様化するニーズに対応するため、人材確保と業務内容の見直しが喫緊の課題である。局所麻酔行為は卒前教育が不十分だが、安全確保に向け研修プログラムが策定され、需給や復職支援も検討されている。","会議":"会議","isBookmarked":false,"_originalIndex":253},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"宇宙通信アドバイザリーボード（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/宇宙通信アドバイザリーボード.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/Space_Communications/02tsushin05_04000175.html","備考":"日本の宇宙政策強化の重点事項、宇宙戦略基金の進捗、および宇宙通信分野の現状と研究開発課題を詳述している。宇宙安全保障の確保、国土強靱化・地球規模課題への対応、宇宙科学・探査における新たな知と産業の創造、宇宙活動を支える総合的基盤の強化を重点分野とし、速やかに１兆円規模の宇宙戦略基金で民間企業や大学等による技術開発・実証を加速する方針である。特に、衛星通信の耐妨害性・耐傍受性の確保、高周波数帯の利用促進、および地上側の通信技術の小型化・汎用化の重要性が強調されている。","会議":"会議","isBookmarked":false,"_originalIndex":254},{"日付":"2025/07/31","開催日":"2025/07/30","タイトル名":"特定複合観光施設区域整備計画審査委員会（観光庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/特定複合観光施設区域整備計画審査委員会.m4a","URL2":"https://www.mlit.go.jp/kankocho/seisaku_seido/kihonkeikaku/inbound_kaifuku/ir/tokuteifukugokanko/shinsaiinkai_2025_00001.html","備考":"特定複合観光施設区域整備計画審査委員会で、認定区域整備計画の実施状況評価が行われた。国際MICE、観光客誘致、カジノ規制、地域連携、財務健全性等について、委員会からの質問に対し大阪府・市・IR事業者が説明した。評価は公平性・透明性を重視する。","会議":"会議","isBookmarked":false,"_originalIndex":255},{"日付":"2025/08/01","開催日":"2025/07/31","タイトル名":"暗号資産制度に関するWG（金融庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/暗号資産制度に関するWG.m4a","URL2":"https://www.fsa.go.jp/singi/singi_kinyu/angoshisanseido_wg/gijishidai/20250731.html","備考":"金融庁は、国内外で暗号資産が投資対象となる状況を踏まえ、利用者保護とイノベーション促進を両立させる制度見直しを検討している。詐欺被害対策、情報開示強化、インサイダー取引規制の導入が課題であり、金融商品取引法等の既存法制活用も視野に、暗号資産の特性に応じた規制再編が進められる方針である。","会議":"会議","isBookmarked":false,"_originalIndex":256},{"日付":"2025/08/01","開催日":"2025/07/31","タイトル名":"社会保障審議会・年金数理部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/社会保障審議会・年金数理部会.m4a","URL2":"https://www.mhlw.go.jp/stf/shingi2/0000198131_00053.html","備考":"社会保障審議会年金数理部会資料は、2024年財政検証について詳述している。これは保険料固定方式の下、おおむね100年間の年金財政の持続性や給付水準を検証するものだ。人口や社会経済前提を基に基礎数・基礎率を設定して将来を見通しており、今回は年金額の分布推計も導入された。","会議":"会議","isBookmarked":false,"_originalIndex":257},{"日付":"2025/08/01","開催日":"2025/07/31","タイトル名":"長期脱炭素電源オークションにおけ他市場収益の監視の在り方に関する検討会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/長期脱炭素電源オークションにおけ他市場収益の監視の在り方に関する検討会.m4a","URL2":"https://www.egc.meti.go.jp/activity/emsc_decarbonization/02_haifu.html","備考":"長期脱炭素電源オークションの他市場収益監視では、落札事業者が実際の収益の約9割を広域機関へ還付するため、不当な収益調整を防ぐ監視方法が検討されています。相対契約は無差別規律か市場価格規律のいずれかを満たす必要があり、可変費の不当な高額計上も監視されます。監視結果の通知や異議申立プロセスも明確化されます。","会議":"会議","isBookmarked":false,"_originalIndex":258},{"日付":"2025/08/01","開催日":"2025/07/30","タイトル名":"産業サイバーセキュリティ研究会・WG1・サイバー・フィジカル・セキュリティ確保に向けたソフトウェア管理手法等検討TF（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/産業サイバーセキュリティ研究会・WG1・サイバー・フィジカル・セキュリティ確保に向けたソフトウェア管理手法等検討TF.m4a","URL2":"https://www.meti.go.jp/shingikai/mono_info_service/sangyo_cyber/wg_seido/wg_bunyaodan/software/016.html","備考":"サイバー・フィジカル・セキュリティ確保に向けたタスクフォースは、SSDFの活用促進のため、導入ガイダンス拡充や自己適合宣言仕組みの検討を行う。海外のソフトウェアセキュリティ動向やAIコーディングのリスクも考慮し、SSDFの調査・実証を進めている。","会議":"会議","isBookmarked":false,"_originalIndex":259},{"日付":"2025/08/01","開催日":"2025/07/30","タイトル名":"食品表示へのデジタルツール活用検討分科会（消費者庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/食品表示へのデジタルツール活用検討分科会.m4a","URL2":"https://www.caa.go.jp/policies/policy/food_labeling/meeting_materials/review_meeting_014/043078.html","備考":"食品表示へのデジタルツール活用検討分科会は、消費者への情報開示充実のため、容器包装表示のデジタル代替を検討中である。技術的課題は、データ管理、アクセス、一対一対応、監視が主要論点である。実証では消費者の利便性が確認されたが、データ統一性や正確性確保が課題である。","会議":"会議","isBookmarked":false,"_originalIndex":260},{"日付":"2025/08/01","開催日":"2025/07/30","タイトル名":"社会資本整備審議会・住宅宅地分科会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/社会資本整備審議会・住宅宅地分科会.m4a","URL2":"https://www.mlit.go.jp/policy/shingikai/house02_sg_000254.html","備考":"住生活基本計画の見直しが進められている。2050年を見据え、人口や世帯構成の変化に対応し、住まう人、モノ、プレイヤーの3つの視点から、豊かな住生活の実現を目指す。高齢者世帯や子育て世帯への支援、空き家対策、災害対策、担い手確保、DX推進が主な論点である。","会議":"会議","isBookmarked":false,"_originalIndex":261},{"日付":"2025/08/01","開催日":"2025/07/31","タイトル名":"自動物流道路に関する検討会（国土交通省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/自動物流道路に関する検討会.m4a","URL2":"https://www.mlit.go.jp/road/ir/ir-council/buturyu_douro/doc10.html","備考":"自動物流道路に関する検討会は、トラック運転手不足とCO2削減に対応するため、道路に物流専用空間を設け、無人・自動輸送で需要平準化を図る新システムを検討している。東京～大阪間を中心に標準パレット輸送を想定し、2027年までの実証実験を経て、10年後の社会実装を目指す。これにより、将来の輸送力不足を補い、CO2削減に寄与すると試算されている。","会議":"会議","isBookmarked":false,"_originalIndex":262},{"日付":"2025/08/01","開催日":"2025/07/31","タイトル名":"文化審議会・文化施設部会・博物館WG（文化庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/07/文化審議会・文化施設部会・博物館WG.m4a","URL2":"https://www.bunka.go.jp/seisaku/bunkashingikai/bunka_shisetsu/hakubutukan_working/02/03/index.html","備考":"文化審議会博物館WGは、博物館の望ましい基準の改正案を議論している。これは、博物館の健全な発達と社会貢献のため、経営、デジタル化、多様な利用者対応、地域連携、危機管理、人材育成の強化を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":263},{"日付":"2025/08/04","開催日":"2025/08/01","タイトル名":"中央最低賃金審議会・目安に関する小委員会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/中央最低賃金審議会・目安に関する小委員会3.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_59989.html","備考":"令和7年8月1日、中央最低賃金審議会目安に関する小委員会が開催され、令和7年度地域別最低賃金額改定の目安が議論された。会議では主要統計資料が用いられ、民間主要企業の2025年春季賃上げ額・率は前年を上回ったと公表されている。","会議":"会議","isBookmarked":false,"_originalIndex":264},{"日付":"2025/08/04","開催日":"2025/08/01","タイトル名":"環境保全型農業直接支払制度に関する第三者委員会（農林水産省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/環境保全型農業直接支払制度に関する第三者委員会.m4a","URL2":"https://www.maff.go.jp/j/seisan/kankyo/sansya_3_1.html","備考":"環境保全型農業直接支払制度は、地球温暖化防止や生物多様性保全に資する農業生産活動の推進を支援するものである。国や都道府県は、中立的な第三者機関を設置し、交付状況の点検と事業の効果評価を実施している。評価結果は制度全体の点検・見直しに活用され、令和7年度からは第3期が開始された。令和6年度には約17.4万トンCO2/年の温室効果ガス削減効果が確認されている。","会議":"会議","isBookmarked":false,"_originalIndex":265},{"日付":"2025/08/04","開催日":"2025/08/01","タイトル名":"産業構造審議会・グリーンイノベーションプロジェクト部会・産業構造転換分野WG（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/産業構造審議会・グリーンイノベーションプロジェクト部会・産業構造転換分野WG.m4a","URL2":"https://www.meti.go.jp/shingikai/sankoshin/green_innovation/industrial_restructuring/033.html","備考":"グリーンイノベーション基金事業では、2050年海運カーボンニュートラル達成へ向け、水素・アンモニア燃料船及びLNGメタンスリップ削減技術の開発・社会実装を推進している。実証運航や陸上試験が進む一方で、技術・コスト・国際競争、安全対策が課題である。経営者の関与、標準化、国際ルール形成も重要視されている。","会議":"会議","isBookmarked":false,"_originalIndex":266},{"日付":"2025/08/04","開催日":"2025/08/01","タイトル名":"科学技術・学術審議会・海洋開発分科会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/科学技術・学術審議会・海洋開発分科会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu5/siryo/1421827_00016.html","備考":"科学技術・学術審議会海洋開発分科会では、老朽化した探査機の後継となる深海・海溝域の探査・採取プラットフォーム構築が提言された。また、全球海洋観測システムOneArgoの現状と課題、ユネスコIOC総会の成果、海洋生物ビッグデータ活用に関するシンポジウムについて報告された。これらは日本の海洋科学能力維持・強化に不可欠であるとされている。","会議":"会議","isBookmarked":false,"_originalIndex":267},{"日付":"2025/08/04","開催日":"2025/07/31","タイトル名":"渇水対策関係省庁会議・幹事会（内閣官房）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/渇水対策関係省庁会議・幹事会.m4a","URL2":"https://www.cas.go.jp/jp/seisaku/kassui/dai9k/gijisidai.html","備考":"渇水対策関係省庁会議幹事会が開催され、全国15水系で取水制限が行われている状況が報告された。新潟県上越市では40%以上の節水要請が出され、給水スポットも設置されている。北上川水系の鳴子ダムや御所ダムでは貯水率が0%となり、堆砂容量内の貯留水が補給されている。農林水産省と国土交通省はそれぞれ渇水対策本部を設置した。今後の降水は、8月前半に雨の可能性があるもののこれまでの少雨を解消するほどではなく、8月後半は高気圧に覆われて晴れる日が多くなるとの見込みが示された。会議では、今後も密接な情報共有を行い、状況に応じ会議を開催することに合意した。","会議":"会議","isBookmarked":false,"_originalIndex":268},{"日付":"2025/08/05","開催日":"2025/08/04","タイトル名":"こども家庭審議会・子ども・子育て支援等分科会（こども家庭庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/こども家庭審議会・子ども・子育て支援等分科会.m4a","URL2":"https://www.cfa.go.jp/councils/shingikai/kodomo_kosodate/8500e055","備考":"こども家庭審議会では、こども政策DX、教育・保育施設事故報告、こども性暴力防止法や児童福祉法改正、こども誰でも通園制度の本格実施、保育経営情報の可視化、2040年を見据えた福祉サービス提供体制等の検討が進められた。","会議":"会議","isBookmarked":false,"_originalIndex":269},{"日付":"2025/08/05","開催日":"2025/08/04","タイトル名":"文化審議会・国語分科会・言語資源小委員会（文化庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/文化審議会・国語分科会・言語資源小委員会.m4a","URL2":"https://www.bunka.go.jp/seisaku/bunkashingikai/kokugo/gengo/gengo_08/","備考":"文化審議会は、我が国の言語文化を伝えるデジタル言語資源、特に言語コーパスの重要性を報告した。BCCWJのような基盤的コーパスの継続的整備・拡充に加え、話し言葉やSNSデータを含む多様な言語コーパスの構築が求められている。これらは、言語研究や教育だけでなく、社会課題の解決や生成AIの基盤としても活用されるべきであり、その普及と社会実装を推進する必要がある。","会議":"会議","isBookmarked":false,"_originalIndex":270},{"日付":"2025/08/05","開催日":"2025/08/04","タイトル名":"教育・学習の質向上に向けた新たな評価の在り方WG（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/教育・学習の質向上に向けた新たな評価の在り方WG3.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo4/056/giji_list/1422801_00006.html","備考":"日本の高等教育の質保証は、認証評価制度の課題を踏まえ新たな評価システムへと改革される。この改革は「知の総和」向上を目指し、学生一人ひとりの能力を最大限高める「教育の質」に焦点を当てるものである。学修者本位の教育を促進し、社会へのアカウンタビリティ強化と評価の効率化を図るため、評価主体、学部・研究科単位での評価対象、学修成果の可視化、データ活用による手続き効率化、そして評価結果の分かりやすい公表と活用が抜本的に見直される。","会議":"会議","isBookmarked":false,"_originalIndex":271},{"日付":"2025/08/05","開催日":"2025/08/04","タイトル名":"食料・農業・農村政策審議会・食料産業部会（農林水産省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/食料・農業・農村政策審議会・食料産業部会.m4a","URL2":"https://www.maff.go.jp/j/council/seisaku/syokusan/250804/250804-02.html","備考":"農林水産省は、食料システム法に基づき、食料の持続的な供給と取引適正化のため、食品等事業者の事業活動促進に関する基本方針や卸売市場の基本方針変更について審議会に諮問した。計画認定制度により、安定取引、流通合理化、環境負荷低減、消費者選択支援などの取り組みを支援し、食料安全保障の強化を目指すものである。","会議":"会議","isBookmarked":false,"_originalIndex":272},{"日付":"2025/08/05","開催日":"2025/08/01","タイトル名":"全国的な学力調査に関する専門家会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/全国的な学力調査に関する専門家会議.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/shotou/200/siryo/mext_00002.html","備考":"令和7年度全国学力・学習状況調査では、各教科の課題やICT活用状況等が示された。令和6年度経年変化分析調査では、一部教科で学力低下が見られ、社会経済的背景や家庭での学習・デジタル機器使用時間との関連が分析された。令和8年度以降、調査はMEXCBTと項目反応理論（IRT）を活用したCBT方式へ段階的に移行する計画である。","会議":"会議","isBookmarked":false,"_originalIndex":273},{"日付":"2025/08/05","開催日":"2025/08/04","タイトル名":"情報通信審議会・情報通信技術分科会・IPネットワーク設備委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/情報通信審議会・情報通信技術分科会・IPネットワーク設備委員会.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/ipnet/02kiban05_04000736.html","備考":"情報通信審議会では、電気通信事故報告制度および端末機器の技術基準見直しが議論された。インターネットサービスやIoT機器の社会的重要性の高まりを受け、データ通信・無料インターネットサービスの事故報告基準の厳格化、IoTセキュリティ強化、モバイル網固定電話の技術基準策定、および事業者負担軽減策等が検討されている。デジタルライフ推進協会(DLPA)からも関連意見が提出されている。","会議":"会議","isBookmarked":false,"_originalIndex":274},{"日付":"2025/08/05","開催日":"2025/08/04","タイトル名":"特定技能制度及び育成就労制度の基本方針及び分野別運用方針に関する有識者会議（法務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/特定技能制度及び育成就労制度の基本方針及び分野別運用方針に関する有識者会議.m4a","URL2":"https://www.moj.go.jp/isa/03_00148.html","備考":"本資料は、一般労働者、特定技能外国人、技能実習生の賃金データや産業別推移を提示する。育成就労制度の対象分野や技能要件、技能実習制度との相違点を詳述し、各産業の生産性向上と国内人材確保の取り組みとその成果をまとめている。また、特定技能外国人材の在留状況や、水産加工業の区分、バス・タクシー運転手の日本語能力要件などの論点も示している。","会議":"会議","isBookmarked":false,"_originalIndex":275},{"日付":"2025/08/06","開催日":"2025/08/05","タイトル名":"学校施設の在り方に関する調査研究協力者会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/学校施設の在り方に関する調査研究協力者会議.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/shisetu/074/siryo/mext_00001.html","備考":"学校施設のバリアフリー化は、2020年のバリアフリー法改正により公立小中学校で義務化されたが、2025年度末の整備目標達成は困難な見込みである。障害のある児童生徒増加や災害対応の重要性を踏まえ、2030年度末までに既存施設の計画的整備、当事者参画の推進、多様なバリアへの対応を継続して進める必要がある。","会議":"会議","isBookmarked":false,"_originalIndex":276},{"日付":"2025/08/06","開催日":"2025/08/05","タイトル名":"情報通信行政・郵政行政審議会・電気通信事業部会・市場検証委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/市場検証委員会：電気通信事業部会-第二回.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/yusei/shijokensho/02kiban02_04000815.html","備考":"NTTデータの完全子会社化が公正競争に与える影響が議論されている。国内ITサービス市場で首位のNTTデータと通信市場で支配的なNTT東西・ドコモの一体化により、他社は情報流出や市場競争阻害を懸念し、規制強化を求めている。","会議":"会議","isBookmarked":false,"_originalIndex":277},{"日付":"2025/08/06","開催日":"2025/08/04","タイトル名":"中央最低賃金審議会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/中央最低賃金審議会：地域別最低賃金額改定の目安.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60781.html","備考":"中央最低賃金審議会は、令和7年度地域別最低賃金額改定の目安を答申した。労使の意見は一致しなかったが、公益委員は過去最高の全国加重平均6.0%（63円）の引き上げが適当であると提示した。これは労働者の生計費、賃金、事業者の支払い能力などを総合的に考慮した結果である。地方審議会はこれを参考に地域の実情を踏まえて最終決定する。","会議":"会議","isBookmarked":false,"_originalIndex":278},{"日付":"2025/08/06","開催日":"2025/08/05","タイトル名":"米の安定供給等実現関係閣僚会議（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/米の安定供給等実現関係閣僚会議（首相官邸）.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60781.html","備考":"米の価格高騰は、需要見通しの不足、高温障害による精米歩留まりの低下、民間在庫の機能不全、政府備蓄米放出の遅延が要因である。渇水への対応として、国土交通省と農林水産省が連携し、排水ポンプ車等を用いた給水やダムの底水活用を行い、渇水調整協議会で取水制限等に取り組んでいる。","会議":"会議","isBookmarked":false,"_originalIndex":279},{"日付":"2025/08/06","開催日":"2025/08/05","タイトル名":"デジタル時代における放送制度の在り方に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/デジタル時代における放送制度の在り方に関する検討会2.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/digital_hososeido/02ryutsu07_04000540.html","備考":"本資料は、デジタル時代の放送制度のあり方を検討したもので、主に三つの課題を扱っている。広域大規模災害時の放送維持・早期復旧のため官民連携強化や多重的な情報伝達手段の活用を提言している。また、放送・配信コンテンツ産業の競争力強化と海外展開を促す施策、そして視聴データ活用による経営安定化と公益貢献の重要性も論じられている。","会議":"会議","isBookmarked":false,"_originalIndex":280},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"再資源化事業等の高度化に関する認定基準検討WG（環境省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/再資源化事業等の高度化に関する認定基準検討WG.m4a","URL2":"https://www.env.go.jp/page_01603.html","備考":"本資料は、再資源化事業等の高度化に関する認定基準の検討を目的としたケーススタディである。PETボトル、金属、廃プラスチック、PVパネル等のリサイクル事業を事例に、高度な事業形態、分離・回収技術、工程の導入が温室効果ガス排出削減と資源循環効果に与える影響を定量的に評価した。新たな法に基づき、脱炭素と資源循環を一体的に進めるための認定指標が議論されている。","会議":"会議","isBookmarked":false,"_originalIndex":281},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"歯科技工士の業務のあり方等に関する検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/歯科技工士の業務のあり方等に関する検討会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60936.html","備考":"超高齢社会における質の高い歯科医療提供体制構築のため、歯科技工士の業務のあり方が検討されている。就業歯科技工士の減少と高齢化、歯科技術の高度化・デジタル化を踏まえ、デジタル技術活用やチェアサイド業務、必要な教育内容、人材確保策、歯科技工所の質確保などが主な検討事項である。","会議":"会議","isBookmarked":false,"_originalIndex":282},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"中央社会保険医療協議会・薬価専門部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/中央社会保険医療協議会・薬価専門部会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60775.html","備考":"中央社会保険医療協議会薬価専門部会は、薬価算定組織の意見として新薬のイノベーション評価や薬価算定の妥当性・透明性向上を検討した。令和8年度薬価改定に向け、イノベーション、国民皆保険の持続性、安定供給確保、薬価ルール等の課題が整理された。また、薬剤費の年次推移や薬価改定の歴史も提示された。","会議":"会議","isBookmarked":false,"_originalIndex":283},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"中央社会保険医療協議会・保険医療材料専門部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/中央社会保険医療協議会・保険医療材料専門部会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60774.html","備考":"中央社会保険医療協議会で、令和8年度診療報酬改定に向けた保険医療材料等の評価が議論された。革新的な医療機器やプログラム医療機器の適切な評価、内外価格差の是正、機能区分の見直し、小児用医療機器への対応、不採算品の安定供給確保などが主な検討事項である。","会議":"会議","isBookmarked":false,"_originalIndex":284},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"中央社会保険医療協議会・費用対効果評価専門部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/中央社会保険医療協議会・費用対効果評価専門部会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60773.html","備考":"費用対効果評価制度について、主に製薬・医療機器業界からの意見をまとめたものである。費用対効果評価が薬価引き下げツールとして機能し、ドラッグ・ラグやドラッグ・ロスの悪化を招くとの懸念が示されており、制度の拡大ではなく、現行運用の客観的な検証と改善が不可欠であると主張されている。具体的な課題として、価格調整の要件、不確実性の高い分析結果の取り扱い、比較対照技術の選定、追加的有用性の定義の曖昧さ、そして医療機器特有のエビデンス事情などが挙げられている。業界は、本制度を保険償還の可否判断に使用せず、価格調整範囲を拡大しないよう求めている。","会議":"会議","isBookmarked":false,"_originalIndex":285},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"情報通信審議会・情報通信技術分科会・新世代モバイル通信システム委員会・HAPS検討作業班（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/情報通信審議会・情報通信技術分科会・新世代モバイル通信システム委員会・HAPS検討作業班.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/5th_generation/haps/02kiban14_04001247.html","備考":"本資料は、情報通信審議会が高高度プラットフォーム（HAPS）の技術的条件と他システムとの共用条件を検討した結果である。HAPSは高度20～50kmで運用され、2GHz帯（サービスリンク）と39GHz帯（フィーダリンク）を使用する。2026年以降の導入を目指し、5G、スペースセルラー、FWA、衛星受動センサ、公共業務など既存無線システムとの干渉評価や、国内・隣国保護のための技術基準策定が進められている。","会議":"会議","isBookmarked":false,"_originalIndex":286},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"情報通信審議会・情報通信技術分科会・電波有効利用委員会価額競争の実施方法に関する検討作業班（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/情報通信審議会・情報通信技術分科会・電波有効利用委員会-価額競争の実施方法に関する検討作業班.m4a","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/denpa_yukoriyo/kagakukyoso/02kiban14_04001251.html","備考":"米国の周波数オークション事例を紹介しつつ、日本で初めて実施される26GHz帯オークションの詳細な方式検討を示す。SMRA/CA方式を軸に、最低落札価格算出、保証金、新規参入促進、落札者条件、そして談合抑止策など、多岐にわたる設計論点が検討されている。","会議":"会議","isBookmarked":false,"_originalIndex":287},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"科学技術・学術審議会・研究計画・評価分科会・ライフサイエンス委員会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/ライフサイエンス委員会.m4a","URL2":"https://www.mext.go.jp/b_menu/shingi/gijyutu/gijyutu2/044/giji_list/mext_00011.html","備考":"科学技術・学術審議会ライフサイエンス委員会は、次世代医療実現に向け、バイオバンクやゲノム情報等のデータ基盤を強化し、AIを積極的に活用した研究推進を目指すものである。これには脳科学、感染症、基礎研究の各分野強化、創薬・予防・診断への応用、倫理的課題への対応、人材育成、国際連携が含まれる。","会議":"会議","isBookmarked":false,"_originalIndex":288},{"日付":"2025/08/07","開催日":"2025/08/06","タイトル名":"中央社会保険医療協議会・総会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/中央社会保険医療協議会・総会.m4a","URL2":"https://www.mhlw.go.jp/stf/newpage_60772.html","備考":"中央社会保険医療協議会総会では、令和8年度診療報酬改定に向けた検討状況が報告された。入院・外来医療、DPC制度における高額医薬品への対応、医薬品・医療機器の新規保険適用や薬価、費用対効果評価が議題となった。高齢者医療、リハビリテーション、医療従事者の働き方改革やICT活用、かかりつけ医機能強化も議論された。","会議":"会議","isBookmarked":false,"_originalIndex":289},{"日付":"2025/08/08","開催日":"2025/08/06","タイトル名":"情報通信審議会・情報通信技術分科会・電波有効利用委員会・無線設備の認証の在り方検討作業班（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/情報通信審議会・情報通信技術分科会・電波有効利用委員会・無線設備の認証の在り方検討作業班.3gp","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/denpa_yukoriyo/ninshousagyo/02kiban16_kaigidai01kai.html","備考":"無線設備の認証の在り方検討作業班は、無線技術の高度化、製造・流通のグローバル化に伴う認証課題を検討する。現状、OpenRANやソフトウェア制御による更新が認証や技適マーク表示の負担となっており、不適合機器流通も発生している。効率的な審査・表示方法の見直しが求められている。","会議":"会議","isBookmarked":false,"_originalIndex":290},{"日付":"2025/08/08","開催日":"2025/08/07","タイトル名":"労働政策審議会・労働条件分科会・労災保険部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/労働政策審議会・労働条件分科会・労災保険部会.3gp","URL2":"https://www.mhlw.go.jp/stf/newpage_60973.html","備考":"令和7年8月7日、労働政策審議会労災保険部会が開催された。ここでは特定フリーランス事業の特別加入団体へのヒアリングを実施。また、労災保険制度の適用、給付、徴収に関する現代的課題を議論した研究会中間報告書が報告された。","会議":"会議","isBookmarked":false,"_originalIndex":291},{"日付":"2025/08/08","開催日":"2025/08/07","タイトル名":"放送事業者におけるガバナンス確保に関する検討会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/放送事業者におけるガバナンス確保に関する検討会2.3gp","URL2":"https://www.soumu.go.jp/main_sosiki/kenkyu/hosojigyoshan_governance/02ryutsu09_04000276.html","備考":"放送事業者におけるガバナンス確保に関する検討会では、デジタル広告市場の課題と広告主向けガイダンス、民放連会員社の現況、職場ハラスメント対策、金融庁の自主規制、スポーツ団体のガバナンスコードについて提示した。特に、放送事業者が公共性を持つ免許事業であることから、そのガバナンスを強化し、経営基盤の整備や信頼性の確保を進める必要性が強調されている。","会議":"会議","isBookmarked":false,"_originalIndex":292},{"日付":"2025/08/08","開催日":"2025/08/07","タイトル名":"産業構造審議会・イノベーション・環境分科会・排出量取引制度小委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/産業構造審議会・イノベーション・環境分科会・排出量取引制度小委員会2.3gp","URL2":"https://www.meti.go.jp/shingikai/sankoshin/sangyo_gijutsu/emissions_trading/002.html","備考":"排出量取引制度小委員会で、GX-ETS排出枠の算定方法が議論された。ベンチマーク・グランドファザリングでの割当量計算、基準活動量・排出量の算定方法、事業所の新設・廃止、活動量変動、事業譲渡等の調整方法が詳細に検討された。今後の議論事項も提示された。","会議":"会議","isBookmarked":false,"_originalIndex":293},{"日付":"2025/08/08","開催日":"2025/08/06","タイトル名":"2025年大阪・関西万博予算執行監視委員会（経済産業省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/2025年大阪・関西万博予算執行監視委員会.3gp","URL2":"https://www.meti.go.jp/shingikai/mono_info_service/expo_budget_monitoring/008.html","備考":"2025年大阪・関西万博予算執行監視委員会では、ジャパンデーや花火、ブルーインパルスの再飛行など万博の最新状況が報告された。ユスリカ、レジオネラ菌、暑熱対策等の運営課題や来場者増加に向けた取り組みも進められている。大屋根リングのリユース方針、会場建設費・運営費の執行状況、博覧会協会の管理体制強化についても報告があった。","会議":"会議","isBookmarked":false,"_originalIndex":294},{"日付":"2025/08/08","開催日":"2025/08/07","タイトル名":"熱中症対策推進会議（首相官邸）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/熱中症対策推進会議.3gp","URL2":"https://www.wbgt.env.go.jp/pdf/ic_rma/R0702/","備考":"令和7年夏は記録的な猛暑となり、熱中症による救急搬送が過去最多を更新した。これを受け、熱中症対策推進会議が開催された。会議では、環境省が熱中症警戒アラート運用や指定暑熱避難施設（クーリングシェルター）の指定支援、普及啓発を推進し、文部科学省が学校での熱中症対策強化や体育館への空調設備整備を進めるなど、関係省庁が連携して熱中症対策に取り組んでいる。","会議":"会議","isBookmarked":false,"_originalIndex":295},{"日付":"2025/08/08","開催日":"2025/08/07","タイトル名":"中央教育審議会・初等中等教育分科会・教員養成部会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/中央教育審議会・初等中等教育分科会・教員養成部会.3gp","URL2":"https://www.mext.go.jp/b_menu/shingi/chukyo/chukyo3/002/siryo/mext_00032.html","備考":"教師の質向上と多様な人材確保に向け、教員養成・採用・研修の一貫改革が進む。教職課程の柔軟化、ICT活用、採用試験の共同実施、社会人の教職参入促進を推進。学習指導要領見直しと教育課程の柔軟化を通じ、教師と子供双方に「余白」を生み、質の高い学びを実現するべきである。","会議":"会議","isBookmarked":false,"_originalIndex":296},{"日付":"2025/08/08","開催日":"2025/08/07","タイトル名":"情報通信審議会・電気通信事業政策部会・ユニバーサルサービス政策委員会（総務省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/情報通信審議会・電気通信事業政策部会・ユニバーサルサービス政策委員会.3gp","URL2":"https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/joho_tsusin/usf_seisaku/02kiban02_04000813.html","備考":"情報通信審議会で、ユニバーサルサービス制度の見直しが議論された。最終保障提供責務の導入に伴い、ワイヤレス固定電話やモバイル網固定電話、ワイヤレス固定ブロードバンドが新たに追加される。事業者からは、必要十分な交付金や運用コスト抑制、提供地域の要件撤廃、技術基準の明確化、国民負担軽減に関する様々な意見が出された。","会議":"会議","isBookmarked":false,"_originalIndex":297},{"日付":"2025/08/08","開催日":"2025/08/07","タイトル名":"経済財政諮問会議（内閣府）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/経済財政諮問会議.3gp","URL2":"https://www5.cao.go.jp/keizai-shimon/kaigi/minutes/2025/0807agenda.html","備考":"2025年8月7日の経済財政諮問会議で、内閣府は経済・財政試算を報告した。2025年度実質GDPは0.7%成長を見込み、賃上げや政策が下支えする。2026年度PB黒字化と債務残高比率の改善を目標とし、賃上げ・投資による成長型経済への移行と財政健全化を推進する。","会議":"会議","isBookmarked":false,"_originalIndex":298},{"日付":"2025/08/11","開催日":"2025/08/08","タイトル名":"令和の日本型学校教育を推進する学校の適正規模・適正配置の在り方に関する調査研究協力者会議（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/令和の日本型学校教育を推進する学校の適正規模・適正配置の在り方に関する調査研究協力者会議.3gp","URL2":"https://www.mext.go.jp/b_menu/shingi/chousa/shotou/195/giji_list/mext_00005.html","備考":"学校の適正規模・適正配置に関する議論が整理されている。小学生の通学手段では家族送迎が最も多く、長距離通学や地域環境、安全不安と関連すると分析された。また、学校と公民館等の公共施設との複合化・共用化の現状と成功事例が提示されている。","会議":"会議","isBookmarked":false,"_originalIndex":299},{"日付":"2025/08/11","開催日":"2025/08/08","タイトル名":"労働政策審議会・職業安定分科会・雇用環境・均等分科会・同一労働同一賃金部会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/雇用環境・均等分科会・同一労働同一賃金部会.3gp","URL2":"https://www.mhlw.go.jp/stf/newpage_59527.html","備考":"「同一労働同一賃金」の施行５年後見直しが議論されている。非正規雇用労働者の待遇改善は進んでいるものの、賃金格差、説明義務、公正な評価などに課題が残っている。ガイドラインの見直しや無期雇用フルタイム労働者への考え方の波及、労使交渉の促進が焦点である。派遣労働においては、労使協定方式が主流となっている。","会議":"会議","isBookmarked":false,"_originalIndex":300},{"日付":"2025/08/11","開催日":"2025/08/08","タイトル名":"地域医療構想及び医療計画等に関する検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/地域医療構想及び医療計画等に関する検討会2.3gp","URL2":"https://www.mhlw.go.jp/stf/newpage_61146.html","備考":"地域医療構想及び医療計画等に関する検討会は、2040年を見据え、医療機関機能と医療従事者の確保を議論するものである。医療機関は急性期拠点や在宅医療等で役割分担を明確化し、連携・再編・集約化を進める。特に人口減少地域では医療資源の効率的活用が課題である。医師や看護師、薬剤師、歯科医師など医療従事者の偏在是正と確保も喫緊の課題であり、働き方改革やDX化推進が求められる。","会議":"会議","isBookmarked":false,"_originalIndex":301},{"日付":"2025/08/11","開催日":"2025/08/08","タイトル名":"医療事故調査制度等の医療安全に係る検討会（厚生労働省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/医療事故調査制度等の医療安全に係る検討会.3gp","URL2":"https://www.mhlw.go.jp/stf/newpage_61130.html","備考":"医療事故調査制度等の検討会では、医療事故調査制度と医療安全対策全般の現状と課題が議論された。制度は医療事故の再発防止を目的とするが、想定より報告件数が少なく、医療機関間の安全対策に差がある。人材・費用面での課題解決、管理者リーダーシップ、教育を通じた改善推進が求められている。","会議":"会議","isBookmarked":false,"_originalIndex":302},{"日付":"2025/08/11","開催日":"2025/08/08","タイトル名":"文化審議会・文化施設部会・博物館WG（文化庁）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/文化審議会・文化施設部会・博物館WG1.3gp","URL2":"https://www.bunka.go.jp/seisaku/bunkashingikai/bunka_shisetsu/hakubutukan_working/02/04/index.html","備考":"本資料は、博物館の設置・運営に関する望ましい基準の改正案を提示している。博物館法改正の附帯決議では、新登録制度活用、非営利性、学芸員・館長の処遇改善、財政支援等が重要視されている。また、私立博物館の青少年向け学習機会充実基準も含まれる。","会議":"会議","isBookmarked":false,"_originalIndex":303},{"日付":"2025/08/11","開催日":"2025/08/08","タイトル名":"産業構造審議会・製造産業分科会・宇宙産業小委員会（文部科学省）","URL1":"https://www.rifj.jp/wp/wp-content/uploads/2025/08/産業構造審議会・製造産業分科会・宇宙産業小委員会.3gp","URL2":"https://www.meti.go.jp/shingikai/sankoshin/seizo_sangyo/space_industry/005.html","備考":"宇宙産業基盤の強化に向け、民間イノベーションを最大限に活用し、市場獲得と宇宙インフラ構築を加速させることを目指す。高頻度打上げ可能な民間ロケット
