<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日本みらい研｜政策リサーチ｜コラム・ブログ</title><link rel="stylesheet" href="../legacy-html-assets/app.css?v=1_8"><meta name="rifj-viewer-fix" content="v1.8.1"><link rel="stylesheet" href="../legacy-html-assets/bookmark-subtle.css?v=1_8_2"></head>
<body data-mode="viewer" data-view="columns"><header class="top"><div><h1>日本みらい研｜政策リサーチ</h1><small>コラム・ブログ一覧（note・アメブロ）</small></div><div class="nav"><span class="public-tag">一般公開</span></div></header>
<div id="workspace" class="wrap">
<section class="panel" aria-label="記事検索と一覧"><div class="pad stack"><div class="row"><h2 style="margin:0">コラム・ブログ記事</h2><span class="soft" id="total"></span></div>
<div class="search-input"><input type="search" id="query" placeholder="タイトル・本文のキーワード" aria-label="検索キーワード"><button id="clear" class="button secondary small" type="button">クリア</button></div>
<div class="filtergrid">
<div class="stack"><label for="kind">掲載元</label><select id="kind"><option value="">note・アメブロ（両方）</option><option value="note">note</option><option value="ameblo">アメブロ</option></select></div>
<div class="stack"><label for="scope">検索対象</label><select id="scope"><option value="all">タイトル・本文・URL</option><option value="title">タイトルのみ</option><option value="body">本文のみ</option></select></div>
<div class="stack"><label for="sort">並べ替え</label><select id="sort"><option value="date">公表日（新しい順）</option><option value="ministry">掲載元順</option><option value="input">入力順</option></select></div>
<div class="stack"><label for="pageSize">一覧表示件数</label><select id="pageSize"><option value="10">10件</option><option value="30">30件</option><option value="50">50件</option></select></div></div>
<label class="rifj-bookmark-filter"><input id="bookmarksOnly" type="checkbox" aria-label="ブックマークのみ表示"><span>☆ ブックマークのみ</span><span class="rifj-bookmark-count" id="bookmarkCount">0</span></label>
<button id="searchButton" class="button secondary" type="button">検索する</button><div id="status" class="status" role="status"></div>
</div><div id="list" class="list" aria-label="記事一覧" tabindex="0"></div><div class="pad list-footer"><button id="more" class="button secondary small hide" type="button">続きを表示</button></div></section>
<section class="panel viewer-panel" aria-label="記事全文"><iframe id="preview" class="preview hide" title="記事本文のプレビュー" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe><div id="previewEmpty" class="empty">左側の記事を選択してください。</div><div class="viewer-actions"><button id="bookmarkCurrent" class="button secondary small hide" type="button" aria-pressed="false">☆ ブックマーク</button><button id="export" class="button secondary small viewer-export hide" type="button"> <span aria-hidden="true">↓</span> HTMLを出力</button></div></section>
</div><dialog id="rifjImageDialog" class="rifj-image-dialog" aria-label="代表画像の拡大表示">
  <div class="rifj-image-toolbar"><span>画像を拡大表示</span><button class="button secondary small" data-close type="button" aria-label="拡大画像を閉じる">× 閉じる</button></div>
  <div class="rifj-image-content"><img data-image alt="拡大画像" referrerpolicy="no-referrer"><p data-caption></p></div>
</dialog>
<script type="module" src="../legacy-html-assets/viewer-public.js?v=v1_10_3"></script></body></html>
