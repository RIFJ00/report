name: Inspect legacy Firebase HTML app (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-original-three-pages.yml'
      - 'html-viewer/tools/prepare-firebase-ui-mirror.py'
      - 'html-viewer/tools/test-original-mirror.py'
      - 'legacy-html-assets/**'
      - 'html-admin/index.html'
      - 'html-viewer/index.html'
      - 'column/index.html'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect page source and required assets without modification
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          base='https://html-viewer-703b6.web.app/'
          for path in ['admin.html','viewer.html','columns.html','app.css','app.js']:
              url=base+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw=r.read(4000000)
                      data=raw.decode('utf-8','replace')
                      print('ASSET',path,'STATUS',r.status,'BYTES',len(raw),'TYPE',r.headers.get('content-type'),'CSP',r.headers.get('content-security-policy'),'XFRAME',r.headers.get('x-frame-options'))
                      if path.endswith('html'):
                          print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',data,re.S|re.I)[:2])
                          print('REFS',re.findall(r'(?:src|href)=[\\"\']([^\\"\']+)',data)[:35])
                          print('TEXT',re.sub('<[^>]*>',' ',data)[:1500])
                      elif path=='app.js':
                          print('JS_HEAD',data[:300])
                          print('JS_IMPORTS',re.findall(r'(?:import|from)\\s*[(]?\\s*[\\"\']([^\\"\']+)',data)[:45])
                          print('API_PATHS',sorted(set(re.findall(r'[\\"\'](/api/[^\\"\']+)',data)))[:20])
                          for needle in ['firebaseConfig','initializeApp','signInWithEmailAndPassword','cloudfunctions.net','firebaseapp.com','fetch(','/app.css','/viewer.html','/columns.html','/admin.html']:
                              print('JS_TOKEN',needle,data.find(needle))
              except Exception as e:print('ERROR',path,type(e).__name__,str(e))
          PY
          python3 - <<'PY'
          import urllib.request,urllib.error
          base='https://html-viewer-703b6.web.app'
          for method,path in [('GET','/api/articles'),('GET','/api/articles?limit=1'),('OPTIONS','/api/articles')]:
              headers={'Origin':'https://report.rifj.jp','User-Agent':'Mozilla/5.0'}
              if method=='OPTIONS':headers.update({'Access-Control-Request-Method':'GET','Access-Control-Request-Headers':'authorization,content-type'})
              request=urllib.request.Request(base+path,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      print('API',method,path,'STATUS',response.status,'CORS_ORIGIN',response.headers.get('Access-Control-Allow-Origin'),'CORS_HEADERS',response.headers.get('Access-Control-Allow-Headers'),'TYPE',response.headers.get('Content-Type'),'SAMPLE',response.read(200)[:100])
              except urllib.error.HTTPError as err:
                  print('API',method,path,'STATUS',err.code,'CORS_ORIGIN',err.headers.get('Access-Control-Allow-Origin'),'CORS_HEADERS',err.headers.get('Access-Control-Allow-Headers'),'TYPE',err.headers.get('Content-Type'),'SAMPLE',err.read(100)[:80])
              except Exception as e:print('API_ERROR',method,path,str(e))
          PY
          python3 - <<'PY'
          import urllib.request,re
          base='https://html-viewer-703b6.web.app/'
          for name in ['app.js','viewer-public.js','article-preview-interactions.js','bookmark-subtle.css','app.css']:
              src=urllib.request.urlopen(base+name,timeout=20).read().decode('utf8','replace')
              print('===',name,'size',len(src),'===')
              print('IMPORT_LINES',[x.strip()[:200] for x in src.splitlines() if x.lstrip().startswith('import ')][:30])
              print('URL_TOKENS',sorted(set(re.findall(r'[a-zA-Z0-9_.-]+\\.(?:html|js|css|json)(?:\\?[^\\s\\\x27\\\x22]*)?',src)))[:65])
              print('HOSTNAMES',sorted(set(re.findall(r'https?://[a-z0-9.-]+',src)))[:25])
              for needle in ['firebaseConfig','authDomain','getFunctions','getStorage','fetch(','/api/','/app/','functions','new URL','location.pathname','location.origin','location.hostname']:
                  print('TOKEN',needle,src.find(needle))
              print('HEAD',src[:1200])
              if name in ('app.js','viewer-public.js'):
                  for token in ['fetch(','.cloudfunctions.net','/api/','/generate','apiBase','apiUrl','callable','functionsUrl','const API','https://']:
                      positions=[m.start() for m in re.finditer(re.escape(token),src)]
                      for pos in positions[:5]:print('CONTEXT',token,repr(src[max(0,pos-130):pos+220]))

          PY

  build-review-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download and rewrite original HTML, CSS and JS into review package
        run: python3 html-viewer/tools/prepare-firebase-ui-mirror.py "$RUNNER_TEMP/original-ui-mirror"
      - name: Verify all three paths contain original UI and no redirect
        run: |
          for route in html-admin html-viewer column; do
            test -f "$RUNNER_TEMP/original-ui-mirror/$route/index.html"
            if grep -Eiq 'location\\.(replace|assign)\\(' "$RUNNER_TEMP/original-ui-mirror/$route/index.html"; then
              echo "::error::Unexpected redirect in $route"; exit 1
            fi
          done
          python3 - <<'PY'
          import os,json
          p=os.environ['RUNNER_TEMP']+'/original-ui-mirror'
          data=json.load(open(p+'/MIGRATION_AUDIT.json'))
          assert data['notProductionReady'] and data['requiresReverseProxy']
          assert len(data['routes'])==3 and data['assetCount']==6
          PY
      - name: Validate mirrored UI bundle source dependencies (read-only)
        run: python3 -m unittest discover -s html-viewer/tools -p 'test-original-mirror.py'
      - name: Upload original UI migration source (review only; NOT deployed)
        uses: actions/upload-artifact@v4
        with:
          name: original-ui-three-routes-review-only
          path: ${{ runner.temp }}/original-ui-mirror/
          retention-days: 7
          if-no-files-found: error
