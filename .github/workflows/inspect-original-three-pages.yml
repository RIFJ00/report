name: Inspect legacy Firebase HTML app (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-original-three-pages.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect page source and required assets without modification
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          base='https://html-viewer-703b6.web.app/'
          for path in ['admin.html','viewer.html','columns.html','app.css','app.js']:
              url=base+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw=r.read(4000000)
                      data=raw.decode('utf-8','replace')
                      print('ASSET',path,'STATUS',r.status,'BYTES',len(raw),'TYPE',r.headers.get('content-type'),'CSP',r.headers.get('content-security-policy'),'XFRAME',r.headers.get('x-frame-options'))
                      if path.endswith('html'):
                          print('TITLE',re.findall(r'<title[^>]*>(.*?)</title>',data,re.S|re.I)[:2])
                          print('REFS',re.findall(r'(?:src|href)=[\\"\']([^\\"\']+)',data)[:35])
                          print('TEXT',re.sub('<[^>]*>',' ',data)[:1500])
                      elif path=='app.js':
                          print('JS_HEAD',data[:300])
                          print('JS_IMPORTS',re.findall(r'(?:import|from)\\s*[(]?\\s*[\\"\']([^\\"\']+)',data)[:45])
                          print('API_PATHS',sorted(set(re.findall(r'[\\"\'](/api/[^\\"\']+)',data)))[:20])
                          for needle in ['firebaseConfig','initializeApp','signInWithEmailAndPassword','cloudfunctions.net','firebaseapp.com','fetch(','/app.css','/viewer.html','/columns.html','/admin.html']:
                              print('JS_TOKEN',needle,data.find(needle))
              except Exception as e:print('ERROR',path,type(e).__name__,str(e))
          PY
          python3 - <<'PY'
          import urllib.request,re
          base='https://html-viewer-703b6.web.app/'
          for name in ['app.js','viewer-public.js','article-preview-interactions.js','bookmark-subtle.css','app.css']:
              src=urllib.request.urlopen(base+name,timeout=20).read().decode('utf8','replace')
              print('===',name,'size',len(src),'===')
              print('IMPORT_LINES',[x.strip()[:200] for x in src.splitlines() if x.lstrip().startswith('import ')][:30])
              print('URL_TOKENS',sorted(set(re.findall(r'[a-zA-Z0-9_.-]+\\.(?:html|js|css|json)(?:\\?[^\\s\\\x27\\\x22]*)?',src)))[:65])
              print('HOSTNAMES',sorted(set(re.findall(r'https?://[a-z0-9.-]+',src)))[:25])
              for needle in ['firebaseConfig','authDomain','getFunctions','getStorage','fetch(','/api/','/app/','functions','new URL','location.pathname','location.origin','location.hostname']:
                  print('TOKEN',needle,src.find(needle))
              print('HEAD',src[:1200])
          PY
