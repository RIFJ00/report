name: Combined Firebase pre-release gate (read-only, never deploy)
on:
  workflow_dispatch:
  push:
    branches: ['feature/map-original-html-three-routes']
    paths:
      - '.github/workflows/combined-firebase-release-gate.yml'
      - 'html-viewer/tools/combine-firebase-release-gates.py'
      - 'html-viewer/tools/test-combine-firebase-release-gates.py'
permissions:
  contents: read
  id-token: write
jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify safety matrix behavior (offline)
        run: python3 html-viewer/tools/test-combine-firebase-release-gates.py
      - name: Live 9-file UI hash parity and API CORS status (no writes)
        run: |
          python3 html-viewer/tools/audit-live-firebase-release.py "$RUNNER_TEMP/firebase-ui-api.json" || true
      - name: Authenticate with read-only Cloud Functions source reader
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: html-viewer-703b6
          token_format: access_token
      - name: In-memory deployed Python CORS patch attestation (never deploy)
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 html-viewer/tools/attest-live-python-cors-patch.py --output "$RUNNER_TEMP/deployed-python-attest.json" || true
      - name: Produce release blockers and facts from evidence
        run: |
          python3 html-viewer/tools/combine-firebase-release-gates.py \
            --live "$RUNNER_TEMP/firebase-ui-api.json" \
            --patch "$RUNNER_TEMP/deployed-python-attest.json" \
            --output "$RUNNER_TEMP/firebase-release-matrix.json"
      - name: Upload hash/status evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-safe-release-evidence
          path: |
            ${{ runner.temp }}/firebase-ui-api.json
            ${{ runner.temp }}/deployed-python-attest.json
            ${{ runner.temp }}/firebase-release-matrix.json
          retention-days: 7
          if-no-files-found: ignore
