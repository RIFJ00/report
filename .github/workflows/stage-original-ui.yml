name: Stage original Firebase UI source on feature branch
on:
  push:
    branches: ['feature/map-original-html-three-routes']
    paths:
      - '.github/workflows/stage-original-ui.yml'
      - 'html-viewer/tools/prepare-firebase-ui-mirror.py'
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/feature/map-original-html-three-routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/map-original-html-three-routes
          persist-credentials: true
      - name: Verify CORS preflight parser rejects permissive or incomplete headers
        run: python3 -m unittest discover -s html-viewer/tools -p 'test-original-api-cors.py'
      - name: Check original API current CORS headers (GET/OPTIONS only)
        run: python3 html-viewer/tools/check-original-api-cors.py "$RUNNER_TEMP/original-api-cors.json"
      - name: Upload read-only API CORS findings
        uses: actions/upload-artifact@v4
        with:
          name: original-api-cors-current-state
          path: ${{ runner.temp }}/original-api-cors.json
          retention-days: 7
          if-no-files-found: error
      - name: Mirror exact Firebase UI assets to temporary directory
        run: python3 html-viewer/tools/prepare-firebase-ui-mirror.py "$RUNNER_TEMP/original-ui-mirror"
      - name: Copy reviewed runtime files into feature branch only
        run: |
          cp "$RUNNER_TEMP/original-ui-mirror/html-admin/index.html" html-admin/index.html
          cp "$RUNNER_TEMP/original-ui-mirror/html-viewer/index.html" html-viewer/index.html
          mkdir -p column legacy-html-assets
          cp "$RUNNER_TEMP/original-ui-mirror/column/index.html" column/index.html
          cp "$RUNNER_TEMP/original-ui-mirror/legacy-html-assets/"* legacy-html-assets/
          git add html-admin/index.html html-viewer/index.html column/index.html legacy-html-assets/
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "stage: import original Firebase UI three routes (API proxy pending)"
            git push origin HEAD:feature/map-original-html-three-routes
          fi
