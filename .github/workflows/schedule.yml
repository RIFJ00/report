# ファイルパス: .github/workflows/schedule.yml
name: Meeting Checker Cron Job

on:
  schedule:
    # 毎日 日本時間の朝8:00 (UTC 23:00) に実行
    - cron: '0 23 * * *'
  # 手動実行用トリガー
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    
    # 【変更点1】 `defaults: working-directory` の指定を削除しました（ファイルが一番上にあるため）

    steps:
      # 【変更点2】警告を消すため、v3 を v4 にバージョンアップしました
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20' # または '24'

      - name: 依存関係のインストール
        run: npm ci || npm install

      - name: チェック用スクリプトの実行
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node checker-backend.js
