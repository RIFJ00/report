
name: Firebase Authentication Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  authentication-test:
    name: Test Google Cloud Authentication
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/676217106371/locations/global/workloadIdentityPools/rifj-github-hosting-deploy/providers/github-rifj-hosting-deploy'
          service_account: 'rifj-firebase-hosting-deployer@html-viewer-703b6.iam.gserviceaccount.com'
          token_format: 'access_token'
          project_id: 'html-viewer-703b6'

      - name: Authentication successful
        run: echo "Google Cloud authentication succeeded."
