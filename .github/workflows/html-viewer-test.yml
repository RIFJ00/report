name: HTML Viewer Unit Tests
on:
  pull_request:
    paths:
      - 'html-viewer/**'
      - 'html-admin/**'
      - '.github/workflows/html-viewer-test.yml'
  workflow_dispatch:
jobs:
  existing-routes-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block edits outside the isolated viewer and admin paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" HEAD > /tmp/rifj-changed.txt
          echo "Files changed in this PR:"
          cat /tmp/rifj-changed.txt
          while IFS= read -r file; do
            case "$file" in
              html-viewer/*|html-admin/*|docs/html-viewer-integration-plan.md|docs/html-viewer-hosting-preflight.md|.github/workflows/html-viewer-test.yml) ;;
              *) echo "::error::Protected existing route or repository file changed: $file"; exit 1 ;;
            esac
          done < /tmp/rifj-changed.txt
      - name: Ensure no deployment config or workflow was introduced
        run: |
          for path in firebase.json .firebaserc .github/workflows/firebase-hosting-merge.yml .github/workflows/firebase-hosting-pull-request.yml; do
            if [ -e "$path" ]; then echo "::error::Unexpected production deployment file: $path"; exit 1; fi
          done
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax validation
        run: |
          node --check html-viewer/article-utils.mjs
          node --check html-viewer/html-import.mjs
          node --check html-viewer/firebase-data.mjs
          node --check html-admin/firebase-admin.mjs
      - name: Validate Firebase configuration is disabled by default
        run: node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('html-viewer/firebase-config.json')); if(c.enabled!==false || c.firebaseConfig!==null)process.exit(1)"
      - name: Unit tests (no production secrets)
        run: node --test html-viewer/article-utils.test.mjs
      - name: Verify additive overlay keeps existing site files untouched
        run: node --test html-viewer/tools/prepare-overlay.test.mjs
  firestore-emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firestore test dependencies
        working-directory: html-viewer/tests
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test HTML import with simulated browser DOM
        working-directory: html-viewer/tests
        run: npm run test:html
      - name: Test security rules in Firestore Emulator
        working-directory: html-viewer/tests
        run: npx firebase emulators:exec --only firestore --project demo-rifj-html --config firebase.json "npm run test:rules"
  preview-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Assemble isolated preview bundle (no deploy)
        run: |
          mkdir -p preview/html-viewer preview/html-admin
          cp html-viewer/index.html html-viewer/articles.json html-viewer/article-utils.mjs html-viewer/html-import.mjs html-viewer/firebase-data.mjs html-viewer/firebase-config.json preview/html-viewer/
          cp html-admin/index.html html-admin/firebase-admin.mjs preview/html-admin/
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('preview/html-viewer/firebase-config.json','utf8')); if(c.enabled!==false || c.firebaseConfig!==null)throw Error('Unsafe preview Firebase configuration')"
      - name: Reject private articles and backups in public preview
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const f=JSON.parse(fs.readFileSync('preview/html-viewer/articles.json','utf8')); if(!Array.isArray(f)||f.some(a=>a.status!=='published'))throw Error('Non-public article in static feed')"
          if find preview -type f \( -iname '*backup*' -o -iname '*PRIVATE*' \) | grep .; then
            echo "::error::Private backup found in public preview"; exit 1
          fi
      - name: Upload downloadable preview package
        uses: actions/upload-artifact@v4
        with:
          name: html-viewer-preview
          path: preview/
          retention-days: 14
          if-no-files-found: error
  browser-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        working-directory: html-viewer/tests
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: html-viewer/tests
        run: npx playwright install --with-deps chromium
      - name: Test viewer and admin in real browser without Firebase
        working-directory: html-viewer/tests
        run: npm run test:browser
