<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Text Miner Ultra - AI & Cloud Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap');
        
        :root {
            --bg-main: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --accent: #3b82f6;
        }

        body.theme-midnight {
            --bg-main: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-main: #f1f5f9;
            --accent: #22d3ee;
            color: var(--text-main);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        #cloud-container {
            width: 100%;
            height: 70vh;
            position: relative;
            background: transparent;
            border-radius: 1.25rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* パネル切り替えモード */
        body.fullscreen-mode #sidebar { display: none !important; }
        body.fullscreen-mode #main-content { grid-column: span 12 / span 12 !important; width: 100% !important; max-width: 100% !important; }
        body.fullscreen-mode #cloud-container { height: 85vh; }

        #modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            backdrop-filter: blur(25px);
            display: none;
            flex-direction: column;
            padding: 1.5rem;
            animation: fadeIn 0.25s ease-out;
            transition: background-color 0.4s ease;
        }

        #modal-overlay.light-modal { color: #1e293b; }
        #modal-overlay.dark-modal { color: #ffffff; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #modal-canvas-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #tooltip, #modal-tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            z-index: 1100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        canvas { cursor: pointer; }

        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        .summary-text-container, .original-text-container {
            line-height: 2;
            font-size: 1rem;
        }
        .summary-text-container p, .original-text-container p { margin-bottom: 1.5rem; }
        .summary-text-container h3 { 
            font-weight: 800; 
            color: var(--accent); 
            margin-top: 2.5rem; 
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.2rem;
        }
        
        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .source-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(59, 130, 246, 0.1);
            color: #2563eb;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }
        .source-tag:hover { background: rgba(59, 130, 246, 0.2); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        body.theme-midnight .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

        /* 小型化されたスタイルアイコン */
        .style-card {
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            border-radius: 0.6rem;
            overflow: hidden;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .style-card.active { 
            border-color: var(--accent); 
            transform: translateY(-1px); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .palette-solid {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 0.3rem;
        }
        .palette-rainbow {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 0.3rem;
            background: linear-gradient(45deg, #f43f5e, #f59e0b, #10b981, #3b82f6);
        }

        #drop-zone.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">

    <div class="max-w-[1600px] mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight flex items-center gap-3 text-slate-900 dark:text-inherit">
                    <span class="bg-blue-600 text-white p-2 rounded-xl shadow-lg"><i data-lucide="brain-circuit"></i></span>
                    Visual Miner <span class="text-blue-600">Ultra</span>
                </h1>
                <p class="text-slate-500 mt-1 font-medium italic text-sm text-slate-400">高精度な文書解析 ＆ クラウド共有 v4.1</p>
            </div>
            <div class="flex gap-3">
                <button id="toggle-fullscreen" class="flex items-center gap-2 px-4 py-2.5 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition shadow-sm font-bold text-sm text-slate-600">
                    <i data-lucide="layout-template" class="w-4 h-4"></i> パネル切替
                </button>
                <button id="open-modal" class="flex items-center gap-2 px-5 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200 font-bold text-sm">
                    <i data-lucide="maximize" class="w-4 h-4"></i> 拡大表示
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Sidebar -->
            <div id="sidebar" class="lg:col-span-4 space-y-6">
                <div id="drop-zone" class="glass-card p-6 text-center cursor-pointer shadow-sm border-2 border-dashed border-slate-200 group transition-all duration-300">
                    <input type="file" id="file-input" class="hidden" accept=".pdf,.docx">
                    <div class="bg-blue-50 w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition pointer-events-none">
                        <i data-lucide="upload-cloud" class="text-blue-600 w-6 h-6"></i>
                    </div>
                    <p class="text-sm font-bold pointer-events-none">ファイルをドロップ、またはクリック</p>
                    <p class="text-[10px] text-slate-400 mt-1 uppercase tracking-widest font-bold pointer-events-none">PDF / DOCX 分析 ＆ 要約</p>
                </div>

                <div class="glass-card p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-4 gap-4 overflow-hidden">
                        <h3 class="text-sm font-bold flex-shrink-0">解析設定</h3>
                        <span id="file-status" class="text-[9px] bg-slate-100 px-3 py-1 rounded-full font-bold text-slate-600 italic truncate max-w-[280px] border border-slate-200 shadow-sm" title="待機中">待機中</span>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-[11px] mb-1 font-bold text-slate-400 uppercase"><span>分野フィルタ</span></div>
                            <select id="field-filter" class="w-full bg-blue-50/50 border border-blue-100 rounded-lg px-2 py-2 text-xs font-bold outline-none focus:ring-2 focus:ring-blue-500 transition text-slate-700">
                                <option value="all">すべての単語</option>
                                <option value="tech">IT・テクノロジー</option>
                                <option value="business">ビジネス・経済</option>
                                <option value="politics">政治・行政</option>
                                <option value="medical">医療・福祉</option>
                                <option value="academic">学術・科学</option>
                                <option value="society">社会・教育</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <div class="flex justify-between text-[11px] mb-1 font-bold text-slate-400 uppercase"><span>表示数</span><span id="count-val" class="text-blue-600 font-black">80</span></div>
                                <input type="range" id="word-count" min="10" max="400" value="80" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] mb-1 font-bold text-slate-400 uppercase"><span>拡大率</span><span id="scale-val" class="text-blue-600 font-black">1.0x</span></div>
                                <input type="range" id="font-scale" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <div class="flex justify-between text-[11px] mb-1 font-bold text-slate-400 uppercase"><span>方向</span></div>
                                <select id="layout-orientation" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold outline-none text-slate-700">
                                    <option value="mixed">混合</option>
                                    <option value="horizontal">横のみ</option>
                                </select>
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] mb-1 font-bold text-slate-400 uppercase"><span>形状</span></div>
                                <select id="cloud-shape" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold outline-none text-slate-700">
                                    <option value="square" selected>正方形</option>
                                    <option value="circle">円形</option>
                                    <option value="cardioid">ハート</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <div class="flex justify-between text-[11px] mb-1 font-bold text-slate-400 uppercase"><span>太さ</span></div>
                                <select id="font-weight-select" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold outline-none text-slate-700">
                                    <option value="normal">標準</option>
                                    <option value="bold" selected>太字</option>
                                </select>
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] mb-2 font-bold text-slate-400 uppercase"><span>クラウド共有</span></div>
                                <button id="share-summary-btn" disabled class="w-full bg-blue-50 text-blue-600 border border-blue-100 py-1.5 rounded-lg font-bold text-[10px] flex items-center justify-center gap-1 hover:bg-blue-100 transition disabled:opacity-30">
                                    <i data-lucide="share" class="w-3 h-3"></i> 公開URL発行
                                </button>
                            </div>
                        </div>

                        <button id="refresh-btn" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-black transition shadow-md active:scale-95">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> 解析再実行
                        </button>
                    </div>
                </div>

                <!-- スタイルアイコンセクション: 6列構成で小型化 -->
                <div class="glass-card p-6 shadow-sm">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">ビジュアル・スタイル</h3>
                    <div class="grid grid-cols-6 gap-2" id="style-selector">
                        <div class="style-card active p-1 border-slate-200" data-style="ocean" title="Ocean Blue">
                            <div class="palette-solid" style="background: #2563eb"></div>
                        </div>
                        <div class="style-card p-1 border-slate-200" data-style="midnight" title="Midnight Neon">
                            <div class="palette-solid" style="background: #22d3ee"></div>
                        </div>
                        <div class="style-card p-1 border-slate-200" data-style="organic" title="Organic Garden">
                            <div class="palette-solid" style="background: #059669"></div>
                        </div>
                        <div class="style-card p-1 border-slate-200" data-style="berry" title="Berry Pop">
                            <div class="palette-solid" style="background: #db2777"></div>
                        </div>
                        <div class="style-card p-1 border-slate-200" data-style="academic" title="Academic Ink">
                            <div class="palette-solid" style="background: #0f172a"></div>
                        </div>
                        <!-- 一番右のみグラデーションアイコン -->
                        <div class="style-card p-1 border-slate-200" data-style="colorful" title="Colorful Mix">
                            <div class="palette-rainbow"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div id="main-content" class="lg:col-span-8 space-y-6">
                <div class="glass-card shadow-xl overflow-hidden min-h-[850px] flex flex-col">
                    <div class="flex border-b border-slate-200/50 bg-white/50 px-6 py-1 items-center overflow-x-auto custom-scrollbar">
                        <button class="tab-btn active px-4 py-3 text-sm font-bold flex items-center gap-2 whitespace-nowrap transition" data-tab="cloud"><i data-lucide="cloud" class="w-4 h-4"></i> クラウド</button>
                        <button class="tab-btn px-4 py-3 text-sm font-bold flex items-center gap-2 whitespace-nowrap transition" data-tab="analysis"><i data-lucide="database" class="w-4 h-4"></i> 数値分析</button>
                        <button class="tab-btn px-4 py-3 text-sm font-bold flex items-center gap-2 whitespace-nowrap transition" data-tab="summary"><i data-lucide="sparkles" class="w-4 h-4"></i> AI要約</button>
                        <button class="tab-btn px-4 py-3 text-sm font-bold flex items-center gap-2 whitespace-nowrap transition" data-tab="original"><i data-lucide="file-text" class="w-4 h-4"></i> 原文表示</button>
                        <div class="flex-grow"></div>
                        <div class="flex gap-2">
                            <button id="fit-btn" class="px-3 py-1.5 text-[10px] font-bold border rounded-lg bg-white shadow-sm hover:bg-slate-50 transition">フィット</button>
                            <button id="download-btn" class="p-2 text-slate-400 hover:text-blue-600 transition" title="画像保存"><i data-lucide="download" class="w-5 h-5"></i></button>
                        </div>
                    </div>

                    <div class="p-6 flex-grow relative flex flex-col">
                        <div id="tab-content-cloud" class="tab-pane flex-grow">
                            <div id="cloud-container">
                                <canvas id="cloud-canvas"></canvas>
                                <div id="tooltip"></div>
                            </div>
                        </div>
                        <div id="tab-content-analysis" class="tab-pane hidden flex-grow space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="bg-white/50 p-5 rounded-2xl h-64 relative shadow-inner"><canvas id="chart-freq"></canvas></div>
                                <div class="bg-white/50 p-5 rounded-2xl h-64 relative shadow-inner"><canvas id="chart-ratio"></canvas></div>
                            </div>
                            <div class="bg-white/50 p-5 rounded-2xl border flex-grow overflow-hidden shadow-sm">
                                <div class="overflow-y-auto max-h-[500px] custom-scrollbar">
                                    <table class="w-full text-xs text-left text-slate-700">
                                        <thead><tr class="text-slate-400 border-b">
                                            <th class="py-3 px-3">順位</th><th class="py-3">ワード</th><th class="py-3">分野</th><th class="py-3 text-right pr-6">回数</th>
                                        </tr></thead>
                                        <tbody id="data-table-body"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div id="tab-content-summary" class="tab-pane hidden flex-grow">
                            <div id="summary-loading" class="hidden flex flex-col items-center justify-center h-[500px] space-y-4">
                                <div class="w-16 h-1 bg-slate-100 rounded-full overflow-hidden relative">
                                    <div class="absolute inset-0 bg-blue-500 loading-shimmer"></div>
                                </div>
                                <p class="text-xs font-bold text-slate-400 animate-pulse">AIが文書を解読中...</p>
                            </div>
                            <div id="summary-content" class="bg-white/60 p-8 md:p-12 rounded-3xl min-h-[700px] border border-blue-50/50 shadow-inner summary-text-container overflow-y-auto max-h-[900px] custom-scrollbar text-slate-700">
                                <div class="flex flex-col items-center justify-center h-full text-slate-300">
                                    <i data-lucide="sparkles" class="w-16 h-16 mb-4 opacity-20"></i>
                                    <p class="font-bold text-center text-slate-400">解析後に要約が表示されます</p>
                                </div>
                            </div>
                        </div>
                        <div id="tab-content-original" class="tab-pane hidden flex-grow">
                            <div id="original-content" class="bg-white/60 p-8 md:p-12 rounded-3xl min-h-[700px] border border-slate-100 shadow-inner original-text-container overflow-y-auto max-h-[900px] custom-scrollbar text-slate-700 whitespace-pre-wrap selection:bg-blue-100">
                                <div class="flex flex-col items-center justify-center h-full text-slate-300">
                                    <i data-lucide="file-text" class="w-16 h-16 mb-4 opacity-20"></i>
                                    <p class="font-bold text-center text-slate-400">読み込んだファイルの全文が表示されます</p>
                                </div>
                            </div>
                        </div>
                        <div id="loading-overlay" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center bg-white/95 rounded-2xl">
                            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                            <p class="mt-4 font-bold text-slate-800 tracking-tight">ドキュメントを読み込み中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Share Modal -->
    <div id="share-modal" class="fixed inset-0 z-[2000] bg-slate-900/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6 text-slate-800">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 p-3 rounded-2xl text-blue-600"><i data-lucide="link"></i></div>
                <h3 class="text-xl font-bold">要約の公開リンク</h3>
            </div>
            <p class="text-sm text-slate-500 font-medium">外部端末からでもアクセスできるURLです。</p>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 break-all text-xs font-mono text-blue-600" id="share-url-display">---</div>
            <div class="flex gap-3">
                <button id="copy-share-url" class="flex-grow bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">URLをコピー</button>
                <button id="close-share-btn" class="px-6 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold hover:bg-slate-200 transition">閉じる</button>
            </div>
        </div>
    </div>

    <!-- Context Panel -->
    <div id="context-panel" class="glass-card shadow-2xl p-6 border-blue-200">
        <div class="flex justify-between items-center mb-4 text-slate-800">
            <h4 class="text-sm font-black text-blue-600 flex items-center gap-2"><i data-lucide="search" class="w-4 h-4"></i>文脈解析</h4>
            <button id="close-context" class="p-1 hover:bg-slate-100 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="mb-3 border-b border-slate-100 pb-2">
            <div id="selected-word-display" class="text-xl font-extrabold text-slate-800">---</div>
        </div>
        <div id="context-results" class="space-y-3 overflow-y-auto max-h-[350px] pr-2 text-xs leading-relaxed text-slate-600 custom-scrollbar"></div>
    </div>

    <!-- Popup Modal -->
    <div id="modal-overlay" class="dark-modal">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3 text-inherit text-white">
                <h2 class="text-xl font-extrabold tracking-tight text-inherit">Full View</h2>
                <span id="modal-file-name" class="text-xs opacity-50 italic"></span>
            </div>
            <div class="flex gap-4">
                <button id="modal-download" class="px-5 py-2.5 bg-white/10 hover:bg-white/20 rounded-xl transition text-sm font-bold border border-white/10 text-inherit text-white">画像保存</button>
                <button id="close-modal" class="px-5 py-2.5 bg-red-500 text-white rounded-xl transition text-sm font-bold shadow-lg">閉じる</button>
            </div>
        </div>
        <div id="modal-canvas-container"><canvas id="modal-canvas"></canvas><div id="modal-tooltip"></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Global Settings
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'text-miner-ultra-standalone';
        const apiKey = ""; 
        let firebaseConfig = {};
        
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) { console.warn("Firebase config missing."); }

        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        // Variables
        let elements = {};
        let currentWords = [];
        let sentences = [];
        let activeTheme = 'ocean';
        let rawText = "";
        let charts = {};
        let db, auth, user;

        const THEMES = {
            ocean: { colors: ['#1d4ed8', '#2563eb', '#3b82f6', '#60a5fa', '#93c5fd'], bg: '#ffffff', bodyClass: '' },
            midnight: { colors: ['#22d3ee', '#818cf8', '#c084fc', '#fb7185', '#38bdf8'], bg: '#0f172a', bodyClass: 'theme-midnight' },
            organic: { colors: ['#065f46', '#059669', '#10b981', '#fbbf24', '#d97706'], bg: '#f0fdf4', bodyClass: '' },
            berry: { colors: ['#db2777', '#c026d3', '#9333ea', '#7c3aed', '#f472b6'], bg: '#fff1f2', bodyClass: '' },
            academic: { colors: ['#0f172a', '#334155', '#475569', '#64748b', '#94a3b8'], bg: '#f8fafc', bodyClass: '' },
            colorful: { colors: ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#d946ef'], bg: '#ffffff', bodyClass: '' }
        };

        const FIELD_MAP = {
            tech: ['システム', 'データ', '開発', 'AI', 'プログラミング', 'ネットワーク', 'サーバー', '技術', 'デジタル', 'クラウド'],
            business: ['ビジネス', '経済', '市場', '投資', '戦略', '顧客', 'サービス', '利益', '経営', 'マーケティング'],
            politics: ['政治', '行政', '政府', '法律', '予算', '選挙', '外交', '国会', '地方', '自治', '政策'],
            medical: ['医療', '福祉', '病院', 'クリニック', '医師', '看護', '介護', '健康', '疾患', '治療', '薬品'],
            academic: ['研究', '理論', '科学', '実験', '解析', '手法', '論文', 'データ', '分析', '仮説'],
            society: ['教育', '社会', '学習', '学校', '文化', '生活', '環境', '地域', '市民', '福祉', '高齢者']
        };

        // --- functions with "function" declaration to be hoisted ---

        async function initAuth() {
            if (!auth) return;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else { 
                    await signInAnonymously(auth); 
                }
                user = auth.currentUser;
            } catch (e) { console.error("Auth Error", e); }
        }

        async function initFirebase() {
            if (!firebaseConfig.apiKey) return;
            try {
                const appInstance = initializeApp(firebaseConfig);
                db = getFirestore(appInstance);
                auth = getAuth(appInstance);
            } catch (e) { console.error("Firebase Init Error", e); }
        }

        function getElements() {
            return {
                fileInput: document.getElementById('file-input'),
                dropZone: document.getElementById('drop-zone'),
                cloudCanvas: document.getElementById('cloud-canvas'),
                cloudContainer: document.getElementById('cloud-container'),
                loadingOverlay: document.getElementById('loading-overlay'),
                summaryContent: document.getElementById('summary-content'),
                summaryLoading: document.getElementById('summary-loading'),
                originalContent: document.getElementById('original-content'),
                tabBtns: document.querySelectorAll('.tab-btn'),
                fieldFilter: document.getElementById('field-filter'),
                wordCountRange: document.getElementById('word-count'),
                fontScaleRange: document.getElementById('font-scale'),
                shareBtn: document.getElementById('share-summary-btn'),
                shareModal: document.getElementById('share-modal'),
                shareUrlDisplay: document.getElementById('share-url-display'),
                copyBtn: document.getElementById('copy-share-url'),
                orientationSelect: document.getElementById('layout-orientation'),
                shapeSelect: document.getElementById('cloud-shape'),
                fontWeightSelect: document.getElementById('font-weight-select'),
                modalOverlay: document.getElementById('modal-overlay'),
                modalCanvas: document.getElementById('modal-canvas'),
                modalCanvasContainer: document.getElementById('modal-canvas-container'),
                tooltip: document.getElementById('tooltip'),
                modalTooltip: document.getElementById('modal-tooltip'),
                contextPanel: document.getElementById('context-panel'),
                contextResults: document.getElementById('context-results'),
                selectedWordDisplay: document.getElementById('selected-word-display'),
                fileStatus: document.getElementById('file-status'),
                modalFileName: document.getElementById('modal-file-name'),
                countValLabel: document.getElementById('count-val'),
                scaleValLabel: document.getElementById('scale-val'),
                downloadBtn: document.getElementById('download-btn'),
                modalDownload: document.getElementById('modal-download'),
                fitBtn: document.getElementById('fit-btn'),
                refreshBtn: document.getElementById('refresh-btn'),
                toggleFullscreen: document.getElementById('toggle-fullscreen'),
                openModal: document.getElementById('open-modal'),
                closeModal: document.getElementById('close-modal'),
                closeContext: document.getElementById('close-context')
            };
        }

        function applyTheme() {
            const theme = THEMES[activeTheme];
            document.body.classList.remove('theme-midnight');
            if (theme.bodyClass) document.body.classList.add(theme.bodyClass);
            if (elements.cloudContainer) elements.cloudContainer.style.background = theme.bg;
        }

        function drawCloud() {
            const data = getFilteredWords();
            if (data.length === 0 || !elements.cloudCanvas) return;
            elements.cloudCanvas.width = elements.cloudContainer.offsetWidth;
            elements.cloudCanvas.height = elements.cloudContainer.offsetHeight;
            WordCloud(elements.cloudCanvas, getCommonOptions(elements.cloudCanvas, data, elements.cloudContainer, elements.tooltip));
        }

        function getFilteredWords() {
            const filter = elements.fieldFilter?.value || 'all';
            const count = parseInt(elements.wordCountRange?.value || 80);
            let data = filter === 'all' ? currentWords : currentWords.filter(w => w.field === filter);
            return data.slice(0, count).map(w => [w.word, w.count]);
        }

        function getCommonOptions(canvas, data, container, tip, isModal = false) {
            const theme = THEMES[activeTheme];
            const orient = elements.orientationSelect?.value || 'mixed';
            const shape = elements.shapeSelect?.value || 'square';
            const weight = elements.fontWeightSelect?.value || 'bold';
            const scale = parseFloat(elements.fontScaleRange?.value || 1.0);
            return {
                list: data, gridSize: isModal ? 12 : 10,
                weightFactor: (s) => (s / data[0][1]) * (canvas.width / (isModal ? 10 : 9)) * scale,
                fontFamily: 'Plus Jakarta Sans, Noto Sans JP, sans-serif', fontWeight: weight,
                color: () => theme.colors[Math.floor(Math.random() * theme.colors.length)],
                rotateRatio: orient === 'mixed' ? 0.45 : 0, rotationSteps: 5, shape: shape,
                backgroundColor: 'transparent', shrinkToFit: true, drawOutOfBound: false,
                click: (item) => { showContext(item[0]); if (isModal) elements.modalOverlay.style.display = 'none'; },
                hover: (item, dim, event) => {
                    if (!item) { tip.style.display = 'none'; return; }
                    tip.style.display = 'block';
                    const rect = container.getBoundingClientRect();
                    tip.style.left = (event.pageX - rect.left + 15) + 'px';
                    tip.style.top = (event.pageY - rect.top - 50) + 'px';
                    tip.innerHTML = `<div class="font-bold text-xs mb-1 text-white">${item[0]}</div><div class="text-[10px] opacity-80 text-white">出現数: ${item[1]}回</div>`;
                }
            };
        }

        async function fetchSummary(text) {
            if (!text || text.length < 50 || !apiKey) return;
            elements.summaryLoading.classList.remove('hidden');
            elements.summaryContent.innerHTML = "";
            elements.shareBtn.disabled = true;
            try {
                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `詳細な分析要約を作成してください(日本語)：\n\n${text.substring(0, 15000)}` }] }],
                        systemInstruction: { parts: [{ text: "プロのアナリストとして文書を構造的に要約してください。" }] },
                        tools: [{ "google_search": {} }]
                    })
                });
                const res = await response.json();
                const out = res.candidates?.[0]?.content?.parts?.[0]?.text;
                if (out) {
                    elements.summaryContent.innerHTML = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                    elements.shareBtn.disabled = false;
                    lucide.createIcons();
                }
            } catch (e) { elements.summaryContent.innerHTML = "要約生成エラー。APIキーを確認してください。"; }
            finally { elements.summaryLoading.classList.add('hidden'); }
        }

        async function handleFile(file) {
            if (!file) return;
            elements.loadingOverlay.classList.remove('hidden');
            elements.fileStatus.textContent = file.name;
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                const ab = await file.arrayBuffer();
                rawText = ext === 'pdf' ? await extractPDF(ab) : await extractDocx(ab);
                processText(rawText);
                elements.originalContent.textContent = rawText;
                elements.tabBtns[0].click(); 
                drawCloud();
                fetchSummary(rawText);
            } catch (e) { alert("解析失敗"); }
            finally { elements.loadingOverlay.classList.add('hidden'); }
        }

        async function extractPDF(data) {
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(data) }).promise;
            let text = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(it => it.str).join(' ') + "\n";
            }
            return text;
        }

        async function extractDocx(ab) { return (await mammoth.extractRawText({ arrayBuffer: ab })).value; }

        function processText(text) {
            sentences = text.split(/[。！？\n]/).filter(s => s.trim().length > 4);
            const regex = /[\u4E00-\u9FFF]{2,}|[\u30A0-\u30FF]{2,}/g;
            const matches = text.match(regex) || [];
            const freq = {};
            matches.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
            currentWords = Object.entries(freq).map(([word, count]) => {
                let f = 'others';
                for (const [k, v] of Object.entries(FIELD_MAP)) {
                    if (v.some(kw => word.includes(kw))) { f = k; break; }
                }
                return { word, count, field: f };
            }).sort((a,b) => b.count - a.count);
        }

        function initCharts() {
            Object.values(charts).forEach(c => c && c.destroy());
            const top10 = currentWords.slice(0, 10);
            const theme = THEMES[activeTheme];
            const ctxF = document.getElementById('chart-freq');
            if (ctxF) charts.freq = new Chart(ctxF.getContext('2d'), { type: 'bar', data: { labels: top10.map(d => d.word), datasets: [{ label: '回数', data: top10.map(d => d.count), backgroundColor: theme.colors[0], borderRadius: 6 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false } });
        }

        function showContext(word) {
            elements.selectedWordDisplay.textContent = word;
            elements.contextResults.innerHTML = '';
            const matches = sentences.filter(s => s.includes(word)).slice(0, 10);
            matches.forEach(s => {
                const div = document.createElement('div');
                div.className = "bg-blue-50/50 p-3 rounded-xl border border-blue-100/50 text-[11px] mt-2 leading-relaxed text-slate-700";
                div.innerHTML = s.trim().replace(new RegExp(word, 'g'), `<mark class="bg-blue-600 text-white px-1 rounded">${word}</mark>`);
                elements.contextResults.appendChild(div);
            });
            elements.contextPanel.classList.add('open');
        }

        function saveImage(canvas, name) {
            const temp = document.createElement('canvas');
            const ctx = temp.getContext('2d');
            temp.width = canvas.width; temp.height = canvas.height;
            ctx.fillStyle = THEMES[activeTheme].bg;
            ctx.fillRect(0,0,temp.width,temp.height);
            ctx.drawImage(canvas, 0,0);
            temp.toBlob(b => {
                const url = URL.createObjectURL(b);
                const a = document.createElement('a');
                a.href = url; a.download = name;
                document.body.appendChild(a); a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
            }, 'image/png');
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', async () => {
            await initFirebase();
            await initAuth();
            
            elements = getElements();
            applyTheme();
            lucide.createIcons();

            // Setup Listeners
            if (elements.dropZone) {
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(name => {
                    elements.dropZone.addEventListener(name, (e) => { 
                        e.preventDefault(); 
                        e.stopPropagation(); 
                    }, false);
                });
                elements.dropZone.addEventListener('dragover', () => elements.dropZone.classList.add('active'));
                elements.dropZone.addEventListener('dragleave', () => elements.dropZone.classList.remove('active'));
                elements.dropZone.addEventListener('drop', (e) => {
                    elements.dropZone.classList.remove('active');
                    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
                });
                elements.dropZone.addEventListener('click', () => elements.fileInput.click());
            }

            elements.fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
            elements.refreshBtn.addEventListener('click', drawCloud);
            elements.toggleFullscreen.addEventListener('click', () => { document.body.classList.toggle('fullscreen-mode'); setTimeout(drawCloud, 500); });
            elements.openModal.addEventListener('click', () => {
                if (currentWords.length === 0) return alert("解析するファイルを選択してください");
                elements.modalOverlay.style.display = 'flex';
                setTimeout(() => {
                    elements.modalCanvas.width = elements.modalCanvasContainer.offsetWidth;
                    elements.modalCanvas.height = elements.modalCanvasContainer.offsetHeight;
                    WordCloud(elements.modalCanvas, getCommonOptions(elements.modalCanvas, getFilteredWords(), elements.modalCanvasContainer, elements.modalTooltip, true));
                }, 250);
            });
            elements.closeModal.addEventListener('click', () => elements.modalOverlay.style.display = 'none');
            elements.downloadBtn.addEventListener('click', () => saveImage(elements.cloudCanvas, 'mining.png'));
            elements.modalDownload.addEventListener('click', () => saveImage(elements.modalCanvas, 'mining_full.png'));
            elements.closeContext.addEventListener('click', () => elements.contextPanel.classList.remove('open'));
            
            elements.shareBtn.addEventListener('click', async () => {
                if (!db || !user) return alert("Firebaseが設定されていないか、認証に失敗しました。");
                const id = crypto.randomUUID().substring(0, 8);
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'summaries', id), { content: elements.summaryContent.innerHTML, createdAt: new Date().toISOString() });
                elements.shareUrlDisplay.textContent = `${window.location.origin}${window.location.pathname}?summaryId=${id}`;
                elements.shareModal.classList.remove('hidden');
            });

            elements.tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    elements.tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const t = btn.dataset.tab;
                    ['cloud', 'analysis', 'summary', 'original'].forEach(x => {
                        const target = document.getElementById(`tab-content-${x}`);
                        if (target) target.classList.toggle('hidden', x !== t);
                    });
                    if (t === 'cloud') setTimeout(drawCloud, 50);
                    if (t === 'analysis') setTimeout(initCharts, 50);
                });
            });

            document.querySelectorAll('.style-card').forEach(c => {
                c.addEventListener('click', () => {
                    document.querySelectorAll('.style-card').forEach(x => x.classList.remove('active'));
                    c.classList.add('active');
                    activeTheme = c.dataset.style;
                    applyTheme();
                    drawCloud();
                });
            });

            elements.wordCountRange.addEventListener('input', e => elements.countValLabel.textContent = e.target.value);
            elements.fontScaleRange.addEventListener('input', e => elements.scaleValLabel.textContent = parseFloat(e.target.value).toFixed(1) + 'x');
            
            const closeShare = document.getElementById('close-share-btn');
            if (closeShare) closeShare.addEventListener('click', () => elements.shareModal.classList.add('hidden'));
            
            const copyShare = document.getElementById('copy-share-url');
            if (copyShare) copyShare.addEventListener('click', () => {
                navigator.clipboard.writeText(elements.shareUrlDisplay.textContent).then(() => alert("コピーしました"));
            });

            // Handle Shared Summary
            const params = new URLSearchParams(window.location.search);
            const sharedId = params.get('summaryId');
            if (sharedId && db) {
                const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'summaries', sharedId));
                if (snap.exists()) {
                    elements.tabBtns[2].click(); 
                    elements.summaryContent.innerHTML = snap.data().content;
                }
            }
        });
    </script>
</body>
</html>
