<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Text Miner Ultra - Pro Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        :root {
            --bg-main: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --accent: #3b82f6;
        }

        body.theme-midnight {
            --bg-main: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text-main: #f1f5f9;
            --accent: #22d3ee;
            color: var(--text-main);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        #cloud-container {
            width: 100%;
            height: 70vh;
            position: relative;
            background: transparent;
            border-radius: 1.25rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.fullscreen-mode #sidebar { display: none !important; }
        body.fullscreen-mode #main-content { grid-column: span 12 / span 12 !important; width: 100% !important; }

        #modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 5000;
            backdrop-filter: blur(25px);
            background-color: rgba(15, 23, 42, 0.98);
            display: none;
            flex-direction: column;
            padding: 1.5rem;
            animation: fadeIn 0.3s ease-out;
        }

        #modal-overlay.light-modal { background-color: rgba(255, 255, 255, 0.98); color: #1e293b; }
        #modal-overlay.dark-modal { background-color: rgba(15, 23, 42, 0.98); color: #ffffff; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #modal-canvas-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #tooltip, #modal-tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 13px;
            display: none;
            z-index: 10000;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
        }

        canvas { cursor: pointer; }

        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

        .style-card {
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            border-radius: 0.6rem;
            overflow: hidden;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .style-card.active { border-color: var(--accent); transform: translateY(-1px); }
        .palette-solid { width: 100%; aspect-ratio: 1/1; border-radius: 0.3rem; }
        .palette-rainbow {
            width: 100%; aspect-ratio: 1/1; border-radius: 0.3rem;
            background: linear-gradient(45deg, #f43f5e, #f59e0b, #10b981, #3b82f6);
        }

        #context-panel {
            position: fixed;
            top: 50%;
            right: 2rem;
            transform: translateY(-50%);
            z-index: 6000;
            display: none;
            width: 480px;
            max-width: 95vw;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            /* 高さ制限とスクロール設定 */
            max-height: 70vh;
            flex-direction: column;
        }
        #context-panel.open { display: flex; }

        .ai-word-usage-summary {
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.6;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            border-radius: 0.75rem;
            border-left: 4px solid var(--accent);
            margin-top: 0.5rem;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        body.theme-midnight .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

        #message-box {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 5000;
            display: none;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .citation-box {
            position: relative;
            background: rgba(255,255,255,0.5);
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(0,0,0,0.05);
            margin-bottom: 0.75rem;
        }
        .theme-midnight .citation-box { background: rgba(30,41,59,0.5); }
        .citation-box::before {
            content: '"';
            position: absolute;
            top: 0.25rem;
            left: 0.5rem;
            font-size: 1.5rem;
            color: var(--accent);
            opacity: 0.3;
            font-family: serif;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 text-slate-800">

    <!-- Modal Overlay for Fullscreen Cloud -->
    <div id="modal-overlay">
        <div class="flex justify-between items-center mb-4 text-white">
            <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="maximize"></i> 拡大表示</h2>
            <div class="flex gap-3">
                <button id="modal-download-btn" class="p-2 bg-white/10 hover:bg-white/20 rounded-full transition" title="画像を保存">
                    <i data-lucide="download" class="w-6 h-6"></i>
                </button>
                <button id="close-modal-btn" class="p-2 bg-white/10 hover:bg-white/20 rounded-full transition"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
        </div>
        <div id="modal-canvas-container">
            <canvas id="modal-canvas"></canvas>
            <div id="modal-tooltip"></div>
        </div>
    </div>

    <div class="max-w-[1600px] mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
            <div>
                <h1 class="text-3xl font-extrabold flex items-center gap-3">
                    <span class="bg-blue-600 text-white p-2 rounded-xl shadow-lg"><i data-lucide="brain-circuit"></i></span>
                    Visual Miner <span class="text-blue-600">Ultra</span>
                </h1>
                <p class="text-slate-400 mt-1 italic text-sm">プロフェッショナルな文書解析・文脈エクスプローラー v6.7</p>
            </div>
            <div class="flex gap-3">
                <button id="toggle-fullscreen" class="flex items-center gap-2 px-4 py-2.5 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition shadow-sm font-bold text-sm text-slate-600">
                    <i data-lucide="layout-template" class="w-4 h-4"></i> パネル切替
                </button>
                <button id="open-modal" class="flex items-center gap-2 px-5 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200 font-bold text-sm">
                    <i data-lucide="maximize" class="w-4 h-4"></i> 拡大表示
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Sidebar -->
            <div id="sidebar" class="lg:col-span-4 space-y-6">
                <div id="drop-zone" class="glass-card p-8 text-center cursor-pointer border-2 border-dashed border-slate-200 hover:border-blue-400 transition-all">
                    <input type="file" id="file-input" class="hidden" accept=".pdf,.docx">
                    <div class="bg-blue-50 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="upload-cloud" class="text-blue-600 w-8 h-8"></i>
                    </div>
                    <p class="text-sm font-bold text-slate-700 text-center">ドロップ、またはクリック</p>
                </div>

                <div class="glass-card p-6 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-bold text-slate-700">解析設定</h3>
                        <span id="file-status" class="text-[9px] bg-slate-100 px-3 py-1 rounded-full font-bold text-slate-500 italic truncate max-w-[200px]">待機中</span>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-[11px] mb-1 font-bold text-slate-400 uppercase">分野フィルタ (大分類対応)</label>
                            <select id="field-filter" class="w-full bg-blue-50/50 border border-blue-100 rounded-lg px-2 py-2 text-xs font-bold text-slate-700 outline-none">
                                <option value="all">全カテゴリを表示</option>
                                <optgroup label="大分類: ビジネス・経済">
                                    <option value="group_business">ビジネス・経済全体</option>
                                    <option value="business">経営・戦略</option>
                                    <option value="economy">経済・金融</option>
                                </optgroup>
                                <optgroup label="大分類: IT・テクノロジー">
                                    <option value="group_tech">IT・科学全体</option>
                                    <option value="tech">IT・AI技術</option>
                                    <option value="science">科学・研究</option>
                                </optgroup>
                                <optgroup label="大分類: 社会・環境">
                                    <option value="group_society">社会全体</option>
                                    <option value="politics">政治・行政</option>
                                    <option value="nature">環境・エネルギー</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <div class="flex justify-between text-[11px] mb-1 font-bold text-slate-400 uppercase"><span>表示ワード</span><span id="count-val" class="text-blue-600">80</span></div>
                                <input type="range" id="word-count" min="10" max="400" value="80" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                            </div>
                            <div>
                                <div class="flex justify-between text-[11px] mb-1 font-bold text-slate-400 uppercase"><span>拡大率</span><span id="scale-val" class="text-blue-600">1.0x</span></div>
                                <input type="range" id="font-scale" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] mb-1 font-bold text-slate-400 uppercase">配置方向</label>
                                <select id="layout-orientation" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700 outline-none">
                                    <option value="mixed" selected>混合</option>
                                    <option value="horizontal">横のみ</option>
                                    <option value="cross">十字</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 font-bold text-slate-400 uppercase">形状</label>
                                <select id="cloud-shape" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700 outline-none">
                                    <option value="square" selected>正方形</option>
                                    <option value="circle">円形</option>
                                    <option value="cardioid">ハート</option>
                                    <option value="star">星型</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] mb-1 font-bold text-slate-400 uppercase">太さ</label>
                                <select id="font-weight-select" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700 outline-none">
                                    <option value="normal">標準</option>
                                    <option value="bold" selected>太字</option>
                                    <option value="900">極太</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] mb-1 font-bold text-slate-400 uppercase">拡大背景</label>
                                <select id="modal-bg-style" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs font-bold outline-none text-slate-700">
                                    <option value="midnight" selected>ミッドナイト</option>
                                    <option value="glass">ホワイト</option>
                                    <option value="black">ブラック</option>
                                </select>
                            </div>
                        </div>

                        <button id="refresh-btn" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-black transition shadow-md active:scale-95">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> 解析再実行
                        </button>
                    </div>
                </div>

                <div class="glass-card p-6 shadow-sm">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">スタイル選択</h3>
                    <div class="grid grid-cols-6 gap-2" id="style-selector">
                        <div class="style-card active p-1 border-slate-200" data-style="ocean"><div class="palette-solid" style="background: #2563eb"></div></div>
                        <div class="style-card p-1 border-slate-200" data-style="midnight"><div class="palette-solid" style="background: #22d3ee"></div></div>
                        <div class="style-card p-1 border-slate-200" data-style="organic"><div class="palette-solid" style="background: #059669"></div></div>
                        <div class="style-card p-1 border-slate-200" data-style="berry"><div class="palette-solid" style="background: #db2777"></div></div>
                        <div class="style-card p-1 border-slate-200" data-style="academic"><div class="palette-solid" style="background: #0f172a"></div></div>
                        <div class="style-card p-1 border-slate-200" data-style="colorful"><div class="palette-rainbow"></div></div>
                    </div>
                </div>
            </div>

            <!-- Main Area -->
            <div id="main-content" class="lg:col-span-8 space-y-6">
                <div class="glass-card shadow-xl overflow-hidden min-h-[850px] flex flex-col">
                    <div class="flex border-b border-slate-200/50 bg-white/50 px-6 py-1 items-center overflow-x-auto custom-scrollbar">
                        <button class="tab-btn active px-4 py-3 text-sm font-bold flex items-center gap-2 transition" data-tab="cloud"><i data-lucide="cloud" class="w-4 h-4"></i> クラウド</button>
                        <button class="tab-btn px-4 py-3 text-sm font-bold flex items-center gap-2 transition" data-tab="analysis"><i data-lucide="database" class="w-4 h-4"></i> 数値分析</button>
                        <button class="tab-btn px-4 py-3 text-sm font-bold flex items-center gap-2 transition" data-tab="summary"><i data-lucide="sparkles" class="w-4 h-4"></i> AI要約</button>
                        <button class="tab-btn px-4 py-3 text-sm font-bold flex items-center gap-2 transition" data-tab="original"><i data-lucide="file-text" class="w-4 h-4"></i> 原文表示</button>
                        <div class="flex-grow"></div>
                        <div class="flex gap-2">
                            <button id="download-btn" class="p-2 text-slate-400 hover:text-blue-600 transition" title="画像を保存"><i data-lucide="download" class="w-5 h-5"></i></button>
                        </div>
                    </div>

                    <div class="p-6 flex-grow relative flex flex-col">
                        <div id="tab-content-cloud" class="tab-pane flex-grow">
                            <div id="cloud-container"><canvas id="cloud-canvas"></canvas></div>
                        </div>
                        <div id="tab-content-analysis" class="tab-pane hidden flex-grow space-y-6 bg-white/40 p-2 rounded-xl">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="bg-white/50 p-5 rounded-2xl h-72 relative border border-slate-100 shadow-inner"><canvas id="chart-freq"></canvas></div>
                                <div class="bg-white/50 p-5 rounded-2xl h-72 relative border border-slate-100 shadow-inner"><canvas id="chart-ratio"></canvas></div>
                            </div>
                            <div class="bg-white/50 p-5 rounded-2xl border flex-grow overflow-hidden shadow-sm">
                                <div class="overflow-y-auto max-h-[500px] custom-scrollbar">
                                    <table class="w-full text-xs text-left text-slate-700">
                                        <thead><tr class="text-slate-400 border-b">
                                            <th class="py-3 px-3">順位</th><th class="py-3">ワード</th><th class="py-3">分野</th><th class="py-3 text-right pr-6">回数</th>
                                        </tr></thead>
                                        <tbody id="data-table-body"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        <div id="tab-content-summary" class="tab-pane hidden flex-grow">
                            <div id="summary-loading" class="hidden flex flex-col items-center justify-center h-[500px] space-y-4">
                                <div class="w-12 h-1 bg-slate-100 rounded-full overflow-hidden relative">
                                    <div class="absolute inset-0 bg-blue-500 loading-shimmer"></div>
                                </div>
                                <p class="text-xs font-bold text-slate-400 animate-pulse text-center">AI分析中...</p>
                            </div>
                            <div id="summary-content" class="bg-white/60 p-8 md:p-12 rounded-3xl min-h-[700px] border border-blue-50/50 summary-text-container overflow-y-auto max-h-[900px] custom-scrollbar text-slate-700 leading-relaxed text-base"></div>
                        </div>
                        <div id="tab-content-original" class="tab-pane hidden flex-grow">
                            <div id="original-content" class="bg-white/60 p-8 md:p-12 rounded-3xl min-h-[700px] border border-slate-100 original-text-container overflow-y-auto max-h-[900px] custom-scrollbar text-slate-700 whitespace-pre-wrap leading-relaxed text-base"></div>
                        </div>
                        <div id="loading-overlay" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center bg-white/95 rounded-2xl text-slate-800">
                            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                            <p class="mt-4 font-bold tracking-tight text-slate-800 text-center">文書を解析中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- UI Overlays -->
    <div id="tooltip"></div>
    <div id="message-box"></div>

    <!-- Context Panel -->
    <div id="context-panel" class="glass-card shadow-2xl border-blue-200 overflow-hidden">
        <!-- Header -->
        <div class="flex justify-between items-center p-6 pb-2 text-slate-800 flex-shrink-0">
            <h4 class="text-sm font-black text-blue-600 flex items-center gap-2"><i data-lucide="search" class="w-4 h-4"></i>文脈解析</h4>
            <button id="close-context" class="p-1 hover:bg-slate-100 rounded-lg transition text-slate-400"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        
        <!-- Scrollable Content -->
        <div class="p-6 pt-2 overflow-y-auto custom-scrollbar flex-grow">
            <div class="mb-4 border-b border-slate-100 pb-4">
                <div id="selected-word-display" class="text-2xl font-black text-blue-600">---</div>
                <div id="word-usage-summary" class="ai-word-usage-summary">AI注釈を生成中...</div>
            </div>
            <div class="mb-2 text-[10px] font-black text-slate-400 uppercase tracking-widest">ファイル内での引用</div>
            <div id="context-results" class="space-y-4 text-slate-700 text-xs"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // CONFIG & Engine Constants
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'text-miner-ultra-v6';
        // セキュリティのためAPI Keyを空に設定（環境変数から自動注入されます）
        const apiKey = ""; 
        let firebaseConfig = {};
        try { if (typeof __firebase_config !== 'undefined' && __firebase_config) firebaseConfig = JSON.parse(__firebase_config); } catch (e) {}

        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // GLOBAL State
        let elements = {};
        let currentWords = [];
        let sentences = [];
        let activeTheme = 'ocean';
        let rawText = "";
        let charts = {};
        let db, auth, user;

        const stops = new Set(['こと', 'もの', 'それ', 'これ', 'ため', 'よう', 'ところ', 'そう', 'あり', 'なし', 'とき', 'など', 'において', 'について', 'という', 'ます', 'です', 'ある', 'いる', 'なる', 'れる', 'して', 'から', 'まで', 'への', 'より', 'にて', 'および', 'また', 'ない', 'した', 'れる', 'られる', 'いる', 'ある', 'この', 'その', 'あの']);

        const THEMES = {
            ocean: { colors: ['#1d4ed8', '#2563eb', '#3b82f6', '#60a5fa', '#93c5fd'], bg: '#ffffff' },
            midnight: { colors: ['#22d3ee', '#818cf8', '#c084fc', '#fb7185', '#38bdf8'], bg: '#0f172a', bodyClass: 'theme-midnight' },
            organic: { colors: ['#065f46', '#059669', '#10b981', '#fbbf24', '#d97706'], bg: '#f0fdf4' },
            berry: { colors: ['#db2777', '#c026d3', '#9333ea', '#7c3aed', '#f472b6'], bg: '#fff1f2' },

        function showMessage(text, isError = false) {
            const box = document.getElementById('message-box');
            if(!box) return;
            box.textContent = text;
            box.style.background = isError ? '#ef4444' : '#2563eb';
            box.style.color = '#ffffff';
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 3000);
        }

        function applyTheme() {
            const theme = THEMES[activeTheme];
            document.body.classList.remove('theme-midnight');
            if (theme.bodyClass) document.body.classList.add(theme.bodyClass);
            const container = document.getElementById('cloud-container');
            if (container) container.style.background = theme.bg;
        }

        function getFilteredWords() {
            const filter = elements.fieldFilter?.value || 'all';
            const count = parseInt(elements.wordCountRange?.value || 80);
            let data = currentWords;
            if (filter !== 'all') {
                if (filter.startsWith('group_')) {
                    const children = FIELD_GROUPS[filter];
                    data = currentWords.filter(w => children.includes(w.field));
                } else {
                    data = currentWords.filter(w => w.field === filter);
                }
            }
            return data.slice(0, count).map(w => [w.word, w.count, w.field]);
        }

        function getCommonOptions(canvas, data, container, tip) {
            const theme = THEMES[activeTheme];
            const orient = elements.orientationSelect?.value || 'mixed';
            const shape = elements.shapeSelect?.value || 'square';
            const weight = elements.fontWeightSelect?.value || 'bold';
            const scale = parseFloat(elements.fontScaleRange?.value || 1.0);
            let rotateRatio = 0.5; let rotationSteps = 2;
            if(orient === 'mixed') { rotateRatio = 0.45; rotationSteps = 5; }
            else if(orient === 'horizontal') { rotateRatio = 0; }
            return {
                list: data.map(d => [d[0], d[1]]), gridSize: 10,
                weightFactor: (s) => (s / data[0][1]) * (canvas.width / 10) * scale,
                fontFamily: 'Noto Sans JP, sans-serif', fontWeight: weight,
                color: () => theme.colors[Math.floor(Math.random() * theme.colors.length)],
                rotateRatio: rotateRatio, rotationSteps: rotationSteps, shape: shape,
                backgroundColor: 'transparent', shrinkToFit: true, drawOutOfBound: false,
                click: (item) => showContext(item[0]),
                hover: (item, dim, event) => {
                    if (!item) { tip.style.display = 'none'; return; }
                    tip.style.display = 'block';
                    const rect = container.getBoundingClientRect();
                    tip.style.left = (event.clientX - rect.left + 15) + 'px'; 
                    tip.style.top = (event.clientY - rect.top - 50) + 'px';
                    tip.innerHTML = `<div class="font-black text-xs mb-1 text-white">${item[0]}</div><div class="text-[10px] opacity-80 text-white font-bold">出現数: ${item[1]}回</div>`;
                }
            };
        }

        function drawCloud() {
            const data = getFilteredWords();
            if (data.length === 0 || !elements.cloudCanvas || !elements.cloudContainer) return;
            elements.cloudCanvas.width = elements.cloudContainer.offsetWidth;
            elements.cloudCanvas.height = elements.cloudContainer.offsetHeight;
            WordCloud(elements.cloudCanvas, getCommonOptions(elements.cloudCanvas, data, elements.cloudContainer, elements.tooltip));
        }

        async function fetchWordAiSummary(word) {
            const summaryEl = elements.wordUsageSummary;
            if (summaryEl) {
                summaryEl.textContent = "このファイル内での役割を分析中...";
                summaryEl.classList.add('animate-pulse');
            }
            
            try {
                const contextSentences = sentences.filter(s => s.includes(word)).slice(0, 10).join('\n');
                const prompt = `このファイルにおいて「${word}」という言葉はどのような意図、役割、文脈で使われていますか？専門的な注釈として、ファイル内特有の使われ方を3行程度で端的にサマリーしてください。`;
                
                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: prompt + `\n\n対象テキスト引用：\n${contextSentences}` }] }], 
                        systemInstruction: { parts: [{ text: "高度な文章解析AIとして、文書内の具体的な使われ方に特化して日本語で解説してください。" }] } 
                    })
                });
                const res = await response.json();
                const out = res.candidates?.[0]?.content?.parts?.[0]?.text;
                if (summaryEl && out) {
                    summaryEl.classList.remove('animate-pulse');
                    summaryEl.innerHTML = `<div class="font-black text-blue-600 mb-1 flex items-center gap-1 text-[11px]"><i data-lucide="sparkles" class="w-3 h-3"></i> AI注釈：文脈上の意味</div><div>${out.replace(/\n/g, '<br>')}</div>`;
                    lucide.createIcons();
                }
            } catch (e) { 
                if(summaryEl) summaryEl.textContent = "文脈分析に失敗しました。";
            }
        }

        async function showContext(word) {
            if (!elements.selectedWordDisplay) return;
            elements.selectedWordDisplay.textContent = word;
            elements.contextResults.innerHTML = '';
            
            // AI注釈を取得
            fetchWordAiSummary(word);

            const matches = sentences.filter(s => s.includes(word)).slice(0, 15);
            if (matches.length === 0) elements.contextResults.innerHTML += '<p class="text-center py-4 text-slate-400 text-xs">データなし</p>';
            else matches.forEach(s => {
                const div = document.createElement('div');
                div.className = "citation-box text-[11px] leading-relaxed text-slate-700 shadow-sm transition hover:bg-white";
                div.innerHTML = s.trim().replace(new RegExp(word, 'g'), `<mark class="bg-blue-600 text-white px-1 rounded font-bold">${word}</mark>`);
                elements.contextResults.appendChild(div);
            });
            elements.contextPanel.classList.add('open');
        }

        function processText(text) {
            sentences = text.split(/[。！？\n]/).filter(s => s.trim().length > 4);
            const regex = /[\u4E00-\u9FFF]{2,}|[\u30A0-\u30FF]{2,}/g;
            const matches = text.match(regex) || [];
            const freq = {};
            matches.forEach(w => { if(!stops.has(w)) freq[w] = (freq[w] || 0) + 1; });
            currentWords = Object.entries(freq).map(([word, count]) => {
                let f = 'others';
                for (const [k, v] of Object.entries(FIELD_MAP)) { if (v.some(kw => word.includes(kw) || kw.includes(word))) { f = k; break; } }
                return { word, count, field: f };
            }).sort((a,b) => b.count - a.count);
        }

        async function fetchSummary(text) {
            if (text.length < 100) return;
            elements.summaryLoading.classList.remove('hidden');
            elements.summaryContent.innerHTML = "";
            try {
                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `この文書を構造的に要約し、日本語で専門的な視点から解説してください：\n\n${text.substring(0, 15000)}` }] }],
                        systemInstruction: { parts: [{ text: "詳細な構造的要約を作成するプロのアナリストAIです。" }] }
                    })
                });
                const res = await response.json();
                const out = res.candidates?.[0]?.content?.parts?.[0]?.text;
                if (out) elements.summaryContent.innerHTML = out.replace(/\*\*(.*?)\*\*/g, '<strong class="text-blue-600 font-black">$1</strong>').replace(/\n/g, '<br>');
            } catch (e) {}
            finally { elements.summaryLoading.classList.add('hidden'); lucide.createIcons(); }
        }

        async function handleFile(file) {
            if (!file) return;
            elements.loadingOverlay.classList.remove('hidden');
            elements.fileStatus.textContent = file.name;
            const ext = file.name.split('.').pop().toLowerCase();
            try {
                const ab = await file.arrayBuffer();
                let extractedText = "";
                if (ext === 'pdf') {
                    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(ab) }).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        extractedText += content.items.map(it => it.str).join(' ') + "\n";
                    }
                } else {
                    extractedText = (await mammoth.extractRawText({ arrayBuffer: ab })).value;
                }
                if (!extractedText || extractedText.length < 5) throw new Error("Empty content");
                rawText = extractedText;
                processText(rawText);
                elements.originalContent.textContent = rawText;
                drawCloud(); fetchSummary(rawText);
                showMessage("解析成功");
            } catch (err) { console.error(err); showMessage("解析失敗", true); }
            finally { elements.loadingOverlay.classList.add('hidden'); }
        }

        function initCharts() {
            if (currentWords.length === 0) return;
            const filteredData = getFilteredWords();
            const top10 = filteredData.slice(0, 10);
            Object.values(charts).forEach(c => c && c.destroy());
            const theme = THEMES[activeTheme];
            const ctxF = document.getElementById('chart-freq');
            if (ctxF) charts.freq = new Chart(ctxF.getContext('2d'), { 
                type: 'bar', data: { labels: top10.map(d => d[0]), datasets: [{ label: '頻度', data: top10.map(d => d[1]), backgroundColor: theme.colors[0], borderRadius: 6 }] }, 
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } 
            });
            const fs = filteredData.reduce((acc, w) => { acc[w[2]] = (acc[w[2]] || 0) + 1; return acc; }, {});
            const ctxR = document.getElementById('chart-ratio');
            if (ctxR) charts.ratio = new Chart(ctxR.getContext('2d'), {
                type: 'doughnut', data: { labels: Object.keys(fs).map(k => FIELD_DISPLAY[k] || '他'), datasets: [{ data: Object.values(fs), backgroundColor: theme.colors }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } } } }
            });
            const tbody = document.getElementById('data-table-body');
            if (tbody) {
                tbody.innerHTML = filteredData.slice(0, 100).map((w, i) => `
                    <tr class="border-b border-slate-50 hover:bg-blue-50 transition cursor-pointer text-[11px] text-slate-700 group" data-word="${w[0]}">

                tbody.querySelectorAll('tr').forEach(row => { row.addEventListener('click', () => showContext(row.dataset.word)); });
            }
        }

        function initApp() {
            elements = getElementsRefs();
            applyTheme();
            lucide.createIcons();
            initFirebase(); 
            initAuth();

            if (elements.dropZone) {
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(n => elements.dropZone.addEventListener(n, (e) => { e.preventDefault(); e.stopPropagation(); }));
                elements.dropZone.addEventListener('dragover', () => elements.dropZone.classList.add('active'));
                elements.dropZone.addEventListener('dragleave', () => elements.dropZone.classList.remove('active'));
                elements.dropZone.addEventListener('drop', (e) => { 
                    elements.dropZone.classList.remove('active'); 
                    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]); 
                });
                elements.dropZone.addEventListener('click', () => elements.fileInput.click());
            }

            elements.fileInput?.addEventListener('change', e => handleFile(e.target.files[0]));
            elements.refreshBtn?.addEventListener('click', () => { if (rawText) { processText(rawText); drawCloud(); if(document.querySelector('.tab-btn[data-tab="analysis"]').classList.contains('active')) initCharts(); } });
            elements.toggleFullscreen?.addEventListener('click', () => { document.body.classList.toggle('fullscreen-mode'); setTimeout(drawCloud, 500); });
            
            elements.fieldFilter?.addEventListener('change', () => {
                drawCloud();
                if(document.querySelector('.tab-btn[data-tab="analysis"]').classList.contains('active')) {
                    initCharts();
                }
            });

            elements.openModal?.addEventListener('click', () => {
                if (currentWords.length === 0) return showMessage("解析するファイルを選択してください", true);
                elements.modalOverlay.style.display = 'flex';
                elements.modalBgStyleSelect?.dispatchEvent(new Event('change'));
                setTimeout(() => {
                    const container = elements.modalCanvasContainer;
                    elements.modalCanvas.width = container.offsetWidth;
                    elements.modalCanvas.height = container.offsetHeight;
                    WordCloud(elements.modalCanvas, getCommonOptions(elements.modalCanvas, getFilteredWords(), container, elements.modalTooltip));
                }, 400);
            });
            
            elements.closeModalBtn?.addEventListener('click', () => { elements.modalOverlay.style.display = 'none'; });
            elements.closeContext?.addEventListener('click', () => { elements.contextPanel.classList.remove('open'); });
            
            elements.tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    elements.tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const t = btn.dataset.tab;
                    ['cloud', 'analysis', 'summary', 'original'].forEach(x => {
                        const target = document.getElementById(`tab-content-${x}`);
                        if (target) target.classList.toggle('hidden', x !== t);
                    });
                    
                    // Update button title based on context
                    if(elements.downloadBtn) {
                        if (t === 'summary' || t === 'original') {
                            elements.downloadBtn.title = "テキストを保存";
                        } else {
                            elements.downloadBtn.title = "画像を保存";
                        }
                    }

                    if (t === 'cloud') setTimeout(drawCloud, 50);
                    if (t === 'analysis') setTimeout(initCharts, 50);
                });
            });

            document.querySelectorAll('.style-card').forEach(c => c.addEventListener('click', () => {
                document.querySelectorAll('.style-card').forEach(x => x.classList.remove('active'));
                c.classList.add('active');
                activeTheme = c.dataset.style; applyTheme(); drawCloud();
                if(document.querySelector('.tab-btn[data-tab="analysis"]').classList.contains('active')) initCharts();
            }));

            elements.wordCountRange?.addEventListener('input', e => { if(elements.countValLabel) elements.countValLabel.textContent = e.target.value; });
            elements.fontScaleRange?.addEventListener('input', e => { if(elements.scaleValLabel) elements.scaleValLabel.textContent = parseFloat(e.target.value).toFixed(1) + 'x'; });
            
            elements.modalBgStyleSelect?.addEventListener('change', () => {
                const style = elements.modalBgStyleSelect?.value;
                if(!style) return;
                elements.modalOverlay.classList.remove('light-modal', 'dark-modal');
                if (style === 'midnight') { elements.modalOverlay.style.backgroundColor = 'rgba(15, 23, 42, 0.98)'; elements.modalOverlay.classList.add('dark-modal'); }
                else if (style === 'glass') { elements.modalOverlay.style.backgroundColor = 'rgba(255, 255, 255, 0.95)'; elements.modalOverlay.classList.add('light-modal'); }
                else if (style === 'black') { elements.modalOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0.99)'; elements.modalOverlay.classList.add('dark-modal'); }
            });

            // --- IMPROVED DOWNLOAD LOGIC (BLOB BASED + HTML2CANVAS + TEXT) ---
            const downloadCanvas = (canvas, bgHex, prefix) => {
                if (!canvas || !currentWords.length) {
                    showMessage("保存するデータがありません", true);
                    return;
                }
                try {
                    const composite = document.createElement('canvas');
                    composite.width = canvas.width;
                    composite.height = canvas.height;
                    const ctx = composite.getContext('2d');
                    ctx.fillStyle = bgHex;
                    ctx.fillRect(0, 0, composite.width, composite.height);
                    ctx.drawImage(canvas, 0, 0);

                    composite.toBlob((blob) => {
                        if(!blob) return showMessage("画像生成に失敗しました", true);
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.download = `${prefix}-${Date.now()}.png`;
                        link.href = url;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        showMessage("画像を保存しました");
                    }, 'image/png');
                } catch (e) {
                    console.error(e);
                    showMessage("保存エラーが発生しました", true);
                }
            };

            const downloadText = (text, prefix) => {
                if (!text || text.trim().length === 0) {
                    showMessage("保存するテキストがありません", true);
                    return;
                }
                try {
                    const blob = new Blob([text], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = `${prefix}-${Date.now()}.txt`;
                    link.href = url;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showMessage("テキストファイルを保存しました");
                } catch (e) {
                    console.error(e);
                    showMessage("保存エラーが発生しました", true);
                }
            };

            // Enhanced download handler for multiple tabs
            elements.downloadBtn?.addEventListener('click', async () => {
                const activeTabBtn = document.querySelector('.tab-btn.active');
                const activeTab = activeTabBtn ? activeTabBtn.dataset.tab : 'cloud';

                if (activeTab === 'cloud') {
                    // Cloud -> Image
                    const theme = THEMES[activeTheme];
                    downloadCanvas(elements.cloudCanvas, theme.bg, `text-mining-${activeTheme}`);
                } 
                else if (activeTab === 'summary') {
                    // Summary -> Text
                    downloadText(elements.summaryContent.innerText, 'ai-summary');
                }
                else if (activeTab === 'original') {
                    // Original -> Text
                    downloadText(rawText || elements.originalContent.innerText, 'original-text');
                }
                else {
                    // Analysis -> Image (html2canvas)
                    const targetId = `tab-content-${activeTab}`;
                    const targetElement = document.getElementById(targetId);
                    
                    if (!targetElement || targetElement.classList.contains('hidden')) {
                        showMessage("保存するコンテンツが見つかりません", true);
                        return;
                    }

                    showMessage("画像を生成中...", false);

                    try {
                        const isDark = document.body.classList.contains('theme-midnight');
                        const bgColor = isDark ? '#0f172a' : '#f8fafc'; 

                        const canvas = await html2canvas(targetElement, {
                            backgroundColor: bgColor,
                            scale: 2, 
                            logging: false,
                            useCORS: true,
                            ignoreElements: (element) => element.id === 'summary-loading'
                        });

                        canvas.toBlob((blob) => {
                            if(!blob) return showMessage("画像生成に失敗しました", true);
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.download = `text-mining-${activeTab}-${Date.now()}.png`;
                            link.href = url;
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                            showMessage("画像を保存しました");
                        }, 'image/png');
                    } catch (e) {
                        console.error(e);
                        showMessage("保存エラーが発生しました", true);
                    }
                }
            });

            elements.modalDownloadBtn?.addEventListener('click', () => {
                const style = elements.modalBgStyleSelect?.value || 'midnight';
                let bgColor = '#0f172a';
                if (style === 'glass') bgColor = '#ffffff';
                if (style === 'black') bgColor = '#000000';
                downloadCanvas(elements.modalCanvas, bgColor, `text-mining-modal-${style}`);
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
