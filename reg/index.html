        const getOfficialPlanName = (plan, cycle, useCreditCard = false) => {
            if (plan === 'trial') return 'Navi Plus Trial（10日間無料トライアル）';
            if (plan === 'corporate') return cycle === 'yearly' ? 'Navi Plus5（Fプラン5 年払）' : 'Navi Plus5（Fプラン5）';
            if (plan === 'personal') {
                if (cycle === 'yearly') return 'Navi Plus1（Fプラン1 年払）';
                // 月払いの場合、クレジット決済かどうかで分岐
                if (useCreditCard) return 'Navi All';
                return 'Navi Plus1（Fプラン1）';
            }
            return plan;
        };

        // 金額フォーマット関数（税込表記追加）
        const getFormattedPrice = (plan, cycle) => {
            if (plan === 'trial') return '0円';
            
            let price = 0;
            let unit = '';
            
            if (plan === 'corporate') {
                price = cycle === 'yearly' ? 1200000 : 100000;
                unit = cycle === 'yearly' ? '/年' : '/月';
            } else if (plan === 'personal') {
                price = cycle === 'yearly' ? 360000 : 30000;
                unit = cycle === 'yearly' ? '/年' : '/月';
            }
            
            if (price === 0) return '-';

            const taxIncluded = Math.floor(price * 1.1);
            return `${price.toLocaleString()}円 (税込${taxIncluded.toLocaleString()}円) ${unit}`;
        };

        const resolveFullName = (data) => {
            if (data.fullName && data.fullName.trim() !== '') {
                return data.fullName;
            }
            if (data.lastName || data.firstName) {
                return `${data.lastName || ''} ${data.firstName || ''}`.trim();
            }
            return 'お客様';
        };

        const normalizePhoneNumber = (str) => {
            if (!str) return '';
            // 全角数字を半角に変換
            const halfWidth = str.replace(/[０-９]/g, (s) => {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            });
            // 数字以外をすべて削除
            return halfWidth.replace(/[^0-9]/g, '');

                            <p>氏名: {resolveFullName(data)}</p>
                            <p>役職: {data.position || '-'}</p>
                            <p>住所: 〒{data.postalCode} {data.address} {data.address2}</p>
                            <p>電話番号: {data.phone}</p>
                            <p>Email: {data.email}</p>
                        </div>
                    </div>

                    {data.additionalMembers && data.additionalMembers.some(m => m.lastName || m.email) && (
                        <div className="pdf-section px-8 py-2">
                            <div className="p-4 bg-slate-50 rounded border border-slate-200">
                                <h3 className="font-bold text-lg mb-2">追加利用者情報</h3>
                                <div className="space-y-3">
                                    {data.additionalMembers.map((member, index) => (
                                        (member.lastName || member.firstName || member.email) && (
                                            <div key={index} className="text-sm border-b border-slate-200 pb-2 last:border-0 last:pb-0">
                                                <p className="font-bold">利用者 {index + 1}</p>
                                                <p>氏名: {member.lastName} {member.firstName}</p>
                                                <p>Email: {member.email}</p>
                                                <p>電話番号: {member.phone}</p>
                                            </div>
                                        )
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="pdf-section px-8 py-2">
                        <div className="p-4 bg-slate-50 rounded border border-slate-200">
                            <h3 className="font-bold text-lg mb-2">請求先情報</h3>
                            <p>請求先名（氏名）: {data.billingName}</p>
                            {!data.useCreditCard && (
                                <>
                                    <p>部署名: {data.billingDepartment}</p>
                                    <p>Email: {data.billingEmail}</p>
                                    <p>電話番号: {data.billingPhone}</p>
                                </>
                            )}
                        </div>
                    </div>

                    {data.notes && (
                        <div className="pdf-section px-8 py-2">
                            <div className="p-4 bg-slate-50 rounded border border-slate-200">
                                <h3 className="font-bold text-lg mb-2">備考</h3>
                                <p className="whitespace-pre-wrap">{data.notes}</p>
                            </div>
                        </div>
                    )}

                    <div className="pdf-section p-8 pt-4">
                        <div className="mt-4 pt-8 border-t">
                            <CorporateFooter />
                        </div>
                    </div>
                </div>
            );
        });

        const PdfPage2 = React.forwardRef((props, ref) => (
            <div className="absolute top-0 left-0 w-[210mm] bg-white text-slate-800" ref={ref} style={{ zIndex: -1000, display: 'none' }}>
                <div className="pdf-section py-8 px-14">
                    <h1 className="text-xl font-bold text-center border-b pb-4 mb-4">利用規約</h1>
                    <div className="text-xs">
                        <TermsOfServiceText />
                    </div>
                    <div className="mt-8 pt-4 border-t">
                        <CorporateFooter />
                    </div>
                </div>
            </div>
        ));

        // --- Main Components ---
        function RegistrationForm({ user }) {
            const [formData, setFormData] = useState({
                companyName: '', department: '', lastName: '', firstName: '', position: '',
                email: '', emailConfirm: '', phone: '', postalCode: '', address: '', address2: '',
                plan: 'trial', paymentCycle: '', notes: '',
                isBillingDifferent: false, billingName: '', billingDepartment: '',
                billingEmail: '', billingEmailConfirm: '', billingPhone: '',
                additionalMembers: [{}, {}, {}, {}] // 4名分
            });
            const [finalDataForPdf, setFinalDataForPdf] = useState(null);
            const [agreedToTerms, setAgreedToTerms] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null); 
            const [addressLoading, setAddressLoading] = useState(false);
            const [validationError, setValidationError] = useState('');
            const [useCreditCard, setUseCreditCard] = useState(false);
            
            // Modal State
            const [messageModal, setMessageModal] = useState({ isOpen: false, title: '', message: '', type: 'info' });

            const showMessage = (title, message, type = 'info') => {
                setMessageModal({ isOpen: true, title, message, type });
            };

            const closeMessageModal = () => {
                setMessageModal(prev => ({ ...prev, isOpen: false }));
            };
            
            const pdfRef1 = useRef(null);
            const pdfRef2 = useRef(null);
            const paymentMethodRef = useRef(null);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => {
                    const newData = { ...prev, [name]: type === 'checkbox' ? checked : value };
                    
                    // プランやサイクルが変わったらクレジット決済をリセット
                    if (name === 'plan' || name === 'paymentCycle') {
                        setUseCreditCard(false);
                        // クレジットによる強制上書きを解除
                        if (useCreditCard) {
                             newData.isBillingDifferent = false;
                             newData.billingName = '';
                             newData.billingEmail = '';
                             newData.billingEmailConfirm = '';
                             newData.billingPhone = '';
                             newData.billingDepartment = ''; 
                        }
                    }

                    if (name === 'plan') {
                        if (value === 'trial') {
                            newData.paymentCycle = ''; 
                            newData.isBillingDifferent = false; 
                        } else {
                            newData.paymentCycle = ''; 
                        }
                    }
                    return newData;
                });
                if (validationError) setValidationError('');
            };

            const handleAdditionalMemberChange = (index, field, value) => {
                const newMembers = [...formData.additionalMembers];
                newMembers[index] = { ...newMembers[index], [field]: value };
                setFormData(prev => ({ ...prev, additionalMembers: newMembers }));
            };

            const searchAddress = async () => {
                if (!formData.postalCode || formData.postalCode.length < 7) {
                    setValidationError("郵便番号は7桁で入力してください（ハイフンなし）");
                    return;
                }
                setAddressLoading(true);
                setValidationError('');
                try {
                    const response = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${formData.postalCode}`);
                    const data = await response.json();
                    if (data.results) {
                        const result = data.results[0];
                        const fullAddress = `${result.address1}${result.address2}${result.address3}`;
                        setFormData(prev => ({ ...prev, address: fullAddress }));
                    } else {
                        setValidationError("住所が見つかりませんでした。郵便番号を確認してください。");
                    }
                } catch (error) {
                    console.error("Address search error:", error);
                    setValidationError("住所検索中にエラーが発生しました。手動で入力してください。");
                } finally {
                    setAddressLoading(false);
                }
            };

            const generatePDF = async () => {
                if (!window.jspdf || !window.html2canvas) {
                    showMessage("準備中", "PDF生成ライブラリを読み込み中です。少々お待ちください。", 'info');
                    return;
                }
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    const scale = 4; 
                    const imageFormat = 'image/jpeg';
                    const imageQuality = 0.95;

                    // PdfPage1 の中身をセクションごとに分割して描画
                    if (pdfRef1.current) {
                        pdfRef1.current.style.display = 'block';
                        const sections = pdfRef1.current.querySelectorAll('.pdf-section');
                        
                        let currentY = 0;
                        
                        for (let i = 0; i < sections.length; i++) {
                            const section = sections[i];
                            const canvas = await window.html2canvas(section, { scale: scale, useCORS: true });
                            const imgData = canvas.toDataURL(imageFormat, imageQuality);
                            const imgProps = pdf.getImageProperties(imgData);
                            const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;

                            if (currentY + imgHeight > pdfHeight) {
                                pdf.addPage();
                                currentY = 0;
                            }

                            pdf.addImage(imgData, 'JPEG', 0, currentY, pdfWidth, imgHeight);
                            currentY += imgHeight;
                        }
                        pdfRef1.current.style.display = 'none';
                    }

                    if (pdfRef2.current) {
                        pdf.addPage();
                        pdfRef2.current.style.display = 'block';
                        const canvas2 = await window.html2canvas(pdfRef2.current, { scale: scale, useCORS: true });
                        pdfRef2.current.style.display = 'none';
                        const imgData2 = canvas2.toDataURL(imageFormat, imageQuality);
                        const imgProps2 = pdf.getImageProperties(imgData2);
                        const imgHeight2 = (imgProps2.height * pdfWidth) / imgProps2.width;
                        
                        if (imgHeight2 > pdfHeight) {
                             pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                        } else {
                             pdf.addImage(imgData2, 'JPEG', 0, 0, pdfWidth, imgHeight2);
                        }
                    }
                    pdf.save('登録情報_利用規約.pdf');
                } catch (error) {
                    console.error("PDF generation failed", error);
                    showMessage("エラー", "PDFの生成に失敗しました。", 'error');
                }
            };

            const handleFinish = () => {
                setSubmitStatus(null);
                setFinalDataForPdf(null);
                setFormData({
                    companyName: '', department: '', lastName: '', firstName: '', position: '',
                    email: '', emailConfirm: '', phone: '', postalCode: '', address: '', address2: '',
                    plan: 'trial', paymentCycle: '', notes: '',
                    isBillingDifferent: false, billingName: '', billingDepartment: '',
                    billingEmail: '', billingEmailConfirm: '', billingPhone: '',
                    additionalMembers: [{}, {}, {}, {}]
                });
                setUseCreditCard(false);
                setAgreedToTerms(false);
                window.scrollTo(0, 0);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!user) return;
                
                if (formData.email !== formData.emailConfirm) {
                    setValidationError("メールアドレスが一致しません。");
                    window.scrollTo(0, 0);
                    return;
                }
                if (formData.plan !== 'trial' && !formData.paymentCycle) {
                    setValidationError("お支払い方法を選択してください。");
                    paymentMethodRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                
                // クレジット決済でない場合のみ、請求先の通常バリデーションを行う
                if (formData.isBillingDifferent && !useCreditCard) {
                    if (formData.billingEmail !== formData.billingEmailConfirm) {
                        setValidationError("請求先のメールアドレスが一致しません。");
                        return;
                    }
                    if (!formData.billingName || !formData.billingEmail || !formData.billingPhone) {
                        setValidationError("請求先情報の必須項目（名、メール、電話番号）を入力してください。");
                        return;
                    }
                }
                
                if (!agreedToTerms) {
                    setValidationError("利用規約への同意が必要です。");
                    return;
                }

                setIsSubmitting(true);
                setSubmitStatus(null);
                setValidationError('');

                try {
                    let processingData = JSON.parse(JSON.stringify(formData));

                    // 電話番号の正規化（代表者・請求先）
                    if (processingData.phone) {
                        processingData.phone = normalizePhoneNumber(processingData.phone);
                    }
                    if (processingData.billingPhone) {
                        processingData.billingPhone = normalizePhoneNumber(processingData.billingPhone);
                    }

                    // クレジット決済の場合の請求先情報補完
                    if (useCreditCard) {
                        processingData.isBillingDifferent = true;
                        processingData.billingName = 'クレジット決済';
                        // 必須項目を埋めるために利用者の情報をコピー（データとしては保持）
                        processingData.billingEmail = processingData.email;
                        processingData.billingPhone = processingData.phone;
                        processingData.billingDepartment = '';
                    }

                    if (processingData.plan === 'corporate') {
                        const mainEmailLocalPart = processingData.email.split('@')[0];
                        
                        processingData.additionalMembers = processingData.additionalMembers.map((member, index) => {
                            let newMember = { ...member };
                            const suffix = index + 1;

                            if (!newMember.lastName) {
                                newMember.lastName = processingData.companyName;
                            }
                            if (!newMember.firstName) {
                                newMember.firstName = String(suffix);
                            }

                            if (!newMember.email) {
                                newMember.email = `${mainEmailLocalPart}${suffix}@mailinator.com`;
                            }

                            // 追加メンバーの電話番号も正規化
                            if (newMember.phone) {
                                newMember.phone = normalizePhoneNumber(newMember.phone);
                            } else {
                                newMember.phone = processingData.phone;
                            }
                            
                            return newMember;
                        });
                    } else {
                        processingData.additionalMembers = [];
                    }

                    const { emailConfirm, billingEmailConfirm, isBillingDifferent, ...baseData } = processingData;
                    const fullName = `${baseData.lastName} ${baseData.firstName}`;
                    
                    const finalAdditionalMembers = baseData.plan === 'corporate' 
                        ? baseData.additionalMembers 
                        : [];

                    const finalData = {
                        ...baseData,
                        additionalMembers: finalAdditionalMembers,
                        billingName: isBillingDifferent ? baseData.billingName : fullName,
                        billingDepartment: isBillingDifferent ? baseData.billingDepartment : baseData.department,
                        billingEmail: isBillingDifferent ? baseData.billingEmail : baseData.email,
                        billingPhone: isBillingDifferent ? baseData.billingPhone : baseData.phone,
                        isBillingDifferent,
                        useCreditCard, // フラグ保存
                        categoryCode: 'C00',
                        userId: user.uid,
                        createdAt: serverTimestamp(),
                        status: 'pending'
                    };

                    const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    setFinalDataForPdf({ ...finalData, fullName, applicationDate: today });

                    let subject = "【政策リサーチ】利用お申し込みありがとうございます";
                    let body = `${finalData.companyName}\n${finalData.department || ''}\n${resolveFullName(finalData)} 様\n\nこの度は、「政策リサーチ」にお申し込みいただき、誠にありがとうございます。\n以下の内容で承りました。\n\nプラン: ${getOfficialPlanName(finalData.plan, finalData.paymentCycle, finalData.useCreditCard)}\n金額: ${getFormattedPrice(finalData.plan, finalData.paymentCycle)}\n\nシステムへの登録完了後に、改めてアカウント有効通知のメールが送信されますので、パスワードを設定の上ご利用ください。\n\n--------------------------------------------------\n一般社団法人日本みらい研\n--------------------------------------------------`;

                    try {
                        const templateDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mail_templates', 'registration'));
                        if (templateDoc.exists()) {
                            const template = templateDoc.data();
                            subject = template.subject || subject;
                            let templateBody = template.body || body;
                            
                            body = templateBody
                                .replace(/{{companyName}}/g, finalData.companyName || '')
                                .replace(/{{department}}/g, finalData.department || '')
                                .replace(/{{name}}/g, resolveFullName(finalData))
                                .replace(/{{plan}}/g, getOfficialPlanName(finalData.plan, finalData.paymentCycle, finalData.useCreditCard) || '')
                                .replace(/{{price}}/g, getFormattedPrice(finalData.plan, finalData.paymentCycle) || '');
                        }
                    } catch (e) {
                        console.warn("Template fetch failed, using default.");
                    }

                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'registrations'), finalData);
                    
                    try {
                        await addDoc(collection(db, 'mail'), {
                            to: [formData.email], 
                            cc: ['seisaku@rifj.jp'], 
                            message: {
                                subject: subject,
                                text: body
                            },
                            metadata: {
                                registrationId: docRef.id
                            }
                        });
                    } catch (mailError) {
                        console.error("Trigger Email Error:", mailError);
                        showMessage("送信エラー", "登録は完了しましたが、自動返信メールの送信リクエストに失敗しました。\n管理者にお問い合わせください。\nエラー: " + mailError.message, 'error');
                    }

                    setSubmitStatus('success');
                    setAgreedToTerms(false);
                    window.scrollTo(0, 0);
                } catch (error) {
                    console.error("Error adding document: ", error);
                    setSubmitStatus('error');
                    showMessage("システムエラー", "登録処理中にエラーが発生しました。\nもう一度お試しください。", 'error');
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="max-w-3xl mx-auto relative">
                    <PdfPage1 ref={pdfRef1} data={finalDataForPdf} />
                    <PdfPage2 ref={pdfRef2} />
                    {messageModal.isOpen && (
                        <MessageModal
                            isOpen={true}
                            onClose={() => setMessageModal(prev => ({ ...prev, isOpen: false }))}
                            title={messageModal.title}
                            message={messageModal.message}
                            type={messageModal.type}
                        />
                    )}
                    
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="p-6 bg-indigo-50 border-b border-indigo-100">
                            <h2 className="text-xl font-bold text-indigo-900">利用申し込み</h2>
                            <p className="text-indigo-700 text-sm mt-1">こちらは政策リサーチのご利用申し込みフォームです。</p>
                        </div>
                        {submitStatus === 'success' ? (
                            <div className="p-6 space-y-8 animate-fade-in">
                                <div className="bg-green-50 border border-green-200 text-green-700 p-4 rounded-lg">
                                    <div className="flex items-start gap-3">
                                        <CheckCircle className="w-5 h-5 flex-shrink-0 mt-0.5" />
                                        <div>
                                            <p className="font-bold">申し込みを受け付けました！</p>
                                            <p className="text-sm mt-1">ご入力いただいたメールアドレス宛に、自動確認メールを送信しました。</p>
                                        </div>
                                    </div>
                                    {(finalDataForPdf?.plan === 'corporate' || finalDataForPdf?.plan === 'personal') && (
                                        <div className="mt-4 pt-4 border-t border-green-200 space-y-3">
                                            <p className="text-sm text-green-800 font-bold">登録情報をPDFでダウンロードできます。必要のない場合は終了ボタンを押して下さい。</p>
                                            <div className="flex flex-wrap gap-3">
                                                <button type="button" onClick={generatePDF} className="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm font-bold">
                                                    <FileDown size={18} />
                                                    登録情報をPDFで保存
                                                </button>
                                                <button type="button" onClick={handleFinish} className="bg-white border border-green-700 text-green-700 hover:bg-green-50 px-4 py-2 rounded-lg shadow-sm flex items-center gap-2 transition-colors text-sm font-bold">
                                                    <LogOut size={18} />
                                                    終了（トップへ戻る）
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                    {!(finalDataForPdf?.plan === 'corporate' || finalDataForPdf?.plan === 'personal') && (
                                        <div className="mt-4">
                                            <button type="button" onClick={handleFinish} className="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition-colors text-sm font-bold">
                                                <LogOut size={18} />
                                                終了してトップへ戻る
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="p-6 space-y-8">
                                {submitStatus === 'error' && (
                                    <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg">
                                        <p>エラーが発生しました。もう一度お試しください。</p>
                                    </div>
                                )}
                                {validationError && (
                                    <div className="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-lg flex items-center gap-2">
                                        <AlertCircle size={20} />
                                        <p>{validationError}</p>
                                    </div>
                                )}
                                <div className="space-y-6">
                                    <h3 className="flex items-center gap-2 text-lg font-bold text-slate-800 border-b pb-2">
                                        <Building2 className="text-indigo-600" size={20} />
                                        利用者情報
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">会社名（個人利用の場合は、個人と記入） <span className="text-red-500">*</span></label>
                                            <input required type="text" name="companyName" value={formData.companyName} onChange={handleChange} placeholder="株式会社政策総研" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">部署名 <span className="text-slate-400 font-normal text-xs">（任意）</span></label>
                                            <input type="text" name="department" value={formData.department} onChange={handleChange} placeholder="調査部" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">お名前（姓） <span className="text-red-500">*</span></label>
                                            <input required type="text" name="lastName" value={formData.lastName} onChange={handleChange} placeholder="山田" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">お名前（名） <span className="text-red-500">*</span></label>
                                            <input required type="text" name="firstName" value={formData.firstName} onChange={handleChange} placeholder="太郎" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">役職 <span className="text-slate-400 font-normal text-xs">（任意）</span></label>
                                            <input type="text" name="position" value={formData.position} onChange={handleChange} placeholder="部長" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-6">
                                    <h3 className="flex items-center gap-2 text-lg font-bold text-slate-800 border-b pb-2">
                                        <Mail className="text-indigo-600" size={20} />
                                        連絡先情報
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">メールアドレス <span className="text-red-500">*</span></label>
                                            <input required type="email" name="email" value={formData.email} onChange={handleChange} placeholder="taro@example.com" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">メールアドレス（確認） <span className="text-red-500">*</span></label>
                                            <input required type="email" name="emailConfirm" value={formData.emailConfirm} onChange={handleChange} placeholder="確認のため再入力" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">郵便番号 <span className="text-slate-400 text-xs font-normal">（ハイフンなし7桁）</span></label>
                                            <div className="flex gap-2">
                                                <input type="text" name="postalCode" value={formData.postalCode} onChange={(e) => setFormData(prev => ({ ...prev, postalCode: e.target.value.replace(/[^0-9]/g, '') }))} maxLength={7} placeholder="1000001" className="w-32 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                                <button type="button" onClick={searchAddress} disabled={addressLoading || !formData.postalCode} className="bg-slate-700 hover:bg-slate-800 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-1 transition-colors disabled:bg-slate-300">
                                                    {addressLoading ? '...' : <><Search size={14} /> 住所検索</>}
                                                </button>
                                            </div>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-sm font-semibold text-slate-700">電話番号（携帯可） <span className="text-red-500">*</span></label>
                                            <input required type="tel" name="phone" value={formData.phone} onChange={handleChange} placeholder="090-1234-5678" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                        <div className="space-y-2 md:col-span-2">
                                            <label className="text-sm font-semibold text-slate-700">ご住所1</label>
                                            <input type="text" name="address" value={formData.address} onChange={handleChange} placeholder="東京都千代田区..." className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-slate-50 outline-none" />
                                        </div>
                                        <div className="space-y-2 md:col-span-2">
                                            <label className="text-sm font-semibold text-slate-700">ご住所2（ビル名、マンション名等）</label>
                                            <input type="text" name="address2" value={formData.address2} onChange={handleChange} placeholder="〇〇ビル 5F" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
                                        </div>
                                    </div>
                                </div>
                                <div className="space-y-6">
                                    <h3 className="flex items-center gap-2 text-lg font-bold text-slate-800 border-b pb-2">
                                        <Briefcase className="text-indigo-600" size={20} />
                                        ご利用プラン
                                    </h3>
                                    <div className="space-y-2">
                                        <label className="text-sm font-semibold text-slate-700">プラン選択</label>
                                        <select name="plan" value={formData.plan} onChange={handleChange} className="w-full px-3 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white font-medium">
                                            <option value="trial">トライアル（無料10日間）</option>
                                            <option value="corporate">企業プラン（5ID）</option>
                                            <option value="personal">個人プラン（1ID）</option>
                                        </select>
                                    </div>
                                    
                                    {formData.plan === 'corporate' && (
                                        <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-4 space-y-4 animate-fade-in">
                                            <div className="flex items-center gap-2 text-indigo-900 font-bold border-b border-indigo-200 pb-2">
                                                <Users size={20} />
                                                <span>追加利用者情報（最大4名）</span>
                                            </div>
                                            <p className="text-xs text-indigo-700">
                                                企業プランでは代表者様を含め最大5名までご利用いただけます。追加利用者の情報を入力してください。<br/>
                                                <span className="font-bold">追加利用者が未定の場合は空白でも構いません。その場合は自動的に名前が割り振られますが、利用者確定後にご連絡をいただければ、いつでも変更できます。</span>
                                            </p>
                                            
                                            {formData.additionalMembers.map((member, index) => (
                                                <div key={index} className="bg-white p-3 rounded border border-indigo-100 shadow-sm">
                                                    <p className="text-sm font-bold text-indigo-800 mb-2">利用者 {index + 1}</p>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        <div>
                                                            <label className="text-xs font-semibold text-slate-600">姓</label>
                                                            <input type="text" value={member.lastName || ''} onChange={(e) => handleAdditionalMemberChange(index, 'lastName', e.target.value)} className="w-full px-2 py-1.5 border border-slate-300 rounded text-sm" placeholder="姓" />
                                                        </div>
                                                        <div>
                                                            <label className="text-xs font-semibold text-slate-600">名</label>
                                                            <input type="text" value={member.firstName || ''} onChange={(e) => handleAdditionalMemberChange(index, 'firstName', e.target.value)} className="w-full px-2 py-1.5 border border-slate-300 rounded text-sm" placeholder="名" />
                                                        </div>
                                                        <div>
                                                            <label className="text-xs font-semibold text-slate-600">メールアドレス</label>
                                                            <input type="email" value={member.email || ''} onChange={(e) => handleAdditionalMemberChange(index, 'email', e.target.value)} className="w-full px-2 py-1.5 border border-slate-300 rounded text-sm" placeholder="email@example.com" />
                                                        </div>
                                                        <div>
                                                            <label className="text-xs font-semibold text-slate-600">電話番号</label>
                                                            <input type="tel" value={member.phone || ''} onChange={(e) => handleAdditionalMemberChange(index, 'phone', e.target.value)} className="w-full px-2 py-1.5 border border-slate-300 rounded text-sm" placeholder="03-1234-5678" />
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {formData.plan !== 'trial' && (
                                        <div className="space-y-6 animate-fade-in" ref={paymentMethodRef}>
                                            <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
                                                <label className="text-sm font-semibold text-indigo-900 block mb-3">お支払い方法（必ずどちらかを選択して下さい） <span className="text-red-500">*</span></label>
                                                <div className="flex flex-col sm:flex-row gap-4 mb-4">
                                                    <label className={`relative flex-1 p-4 border-2 rounded-lg cursor-pointer transition-all ${formData.paymentCycle === 'monthly' ? 'border-indigo-600 bg-white shadow-md' : 'border-slate-200 bg-white/50'}`}>
                                                        <input type="radio" name="paymentCycle" value="monthly" checked={formData.paymentCycle === 'monthly'} onChange={handleChange} className="absolute opacity-0 w-full h-full cursor-pointer top-0 left-0" />
                                                        <div className="flex items-center gap-2 mb-1"><span className="font-bold text-slate-800">月払い</span></div>
                                                        <div className="text-xs text-slate-500 pl-6">{getFormattedPrice(formData.plan, 'monthly')}</div>
                                                    </label>
                                                    <label className={`relative flex-1 p-4 border-2 rounded-lg cursor-pointer transition-all ${formData.paymentCycle === 'yearly' ? 'border-indigo-600 bg-white shadow-md' : 'border-slate-200 bg-white/50'}`}>
                                                        <input type="radio" name="paymentCycle" value="yearly" checked={formData.paymentCycle === 'yearly'} onChange={handleChange} className="absolute opacity-0 w-full h-full cursor-pointer top-0 left-0" />
                                                        <div className="flex items-center gap-2 mb-1"><span className="font-bold text-slate-800">年払い</span></div>
                                                        <div className="text-xs text-slate-500 pl-6">{getFormattedPrice(formData.plan, 'yearly')}</div>
                                                    </label>
                                                </div>
                                                <div className="text-xs text-slate-600 bg-white p-3 rounded border border-indigo-100">請求は、メールでの電子形式で行います。郵送による請求を希望される場合は、備考欄にその旨をご記載下さい。</div>
                                            </div>

                                            {/* クレジット決済オプション (個人プランかつ月払いのみ) */}
                                            {formData.plan === 'personal' && formData.paymentCycle === 'monthly' && (
                                                <div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg animate-fade-in">
                                                    <label className="flex items-start gap-3 cursor-pointer">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={useCreditCard} 
                                                            onChange={(e) => {
                                                                const checked = e.target.checked;
                                                                setUseCreditCard(checked);
                                                                if (checked) {
                                                                    setFormData(prev => ({
                                                                        ...prev,
                                                                        isBillingDifferent: true,
                                                                        billingName: 'クレジット決済',
                                                                        // 便宜上コピー
                                                                        billingEmail: prev.email,
                                                                        billingEmailConfirm: prev.emailConfirm,
                                                                        billingPhone: prev.phone,
                                                                        billingDepartment: '' 
                                                                    }));
                                                                } else {
                                                                    setFormData(prev => ({
                                                                        ...prev,
                                                                        isBillingDifferent: false,
                                                                        billingName: '',
                                                                        billingEmail: '',
                                                                        billingEmailConfirm: '',
                                                                        billingPhone: '',
                                                                        billingDepartment: ''
                                                                    }));
                                                                }
                                                            }} 
                                                            className="w-5 h-5 mt-0.5 border-2 border-yellow-500 rounded text-yellow-600 cursor-pointer" 
                                                        />
                                                        <div>
                                                            <span className="font-bold text-yellow-800">クレジット決済を希望する場合は、チェックして下さい。</span>
                                                            <p className="text-sm text-yellow-700 mt-1 leading-relaxed">
                                                                利用登録終了後のアカウント有効通知メールからシステムにログインすると、NaviDataのトライアル画面が表示されます。その画面から決済手続きを完了しますと、政策リサーチをご利用いただけるようになります。
                                                            </p>
                                                        </div>
                                                    </label>
                                                </div>
                                            )}

                                            {!useCreditCard && (
                                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 animate-fade-in">
                                                    <label className="flex items-center gap-3 cursor-pointer select-none mb-4">
                                                        <input type="checkbox" name="isBillingDifferent" checked={formData.isBillingDifferent} onChange={handleChange} className="w-5 h-5 border-2 border-indigo-500 rounded text-indigo-600 cursor-pointer" />
                                                        <span className="font-bold text-slate-800">請求先が利用者情報と異なる場合はチェック</span>
                                                    </label>
                                                    {formData.isBillingDifferent && (
                                                        <div className="space-y-4 pt-2 border-t border-slate-200 animate-fade-in">
                                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                                <div className="space-y-2"><label className="text-sm font-semibold text-slate-700">請求先名 <span className="text-red-500">*</span></label><input required type="text" name="billingName" value={formData.billingName} onChange={handleChange} placeholder="氏名（例：山田 太郎）" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                                                                <div className="space-y-2"><label className="text-sm font-semibold text-slate-700">請求先部署 <span className="text-slate-400 font-normal text-xs">（任意）</span></label><input type="text" name="billingDepartment" value={formData.billingDepartment} onChange={handleChange} placeholder="経理部" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                                                                <div className="space-y-2"><label className="text-sm font-semibold text-slate-700">メールアドレス <span className="text-red-500">*</span></label><input required type="email" name="billingEmail" value={formData.billingEmail} onChange={handleChange} placeholder="keiri@example.com" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                                                                <div className="space-y-2"><label className="text-sm font-semibold text-slate-700">メールアドレス（確認） <span className="text-red-500">*</span></label><input required type="email" name="billingEmailConfirm" value={formData.billingEmailConfirm} onChange={handleChange} placeholder="確認のため再入力" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                                                                <div className="space-y-2"><label className="text-sm font-semibold text-slate-700">電話番号 <span className="text-red-500">*</span></label><input required type="tel" name="billingPhone" value={formData.billingPhone} onChange={handleChange} placeholder="03-9876-5432" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" /></div>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    <div className="space-y-2">
                                        <label className="text-sm font-semibold text-slate-700">備考</label>
                                        <textarea name="notes" value={formData.notes} onChange={handleChange} rows="3" placeholder="その他ご要望等ございましたらご記入ください。" className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                                    </div>
                                </div>
                                <div className="border border-slate-200 rounded-lg p-4 bg-slate-50">
                                    <div className="flex items-center gap-2 mb-2 text-slate-800 font-semibold">
                                        <FileText size={18} />
                                        <h3>利用規約</h3>
                                    </div>
                                    <div className="h-60 overflow-y-auto bg-white border border-slate-200 rounded p-4 text-xs text-slate-600 leading-relaxed mb-3 shadow-inner">
                                        <TermsOfServiceText />
                                    </div>
                                    <label className="flex items-center gap-3 cursor-pointer select-none hover:bg-slate-100 p-2 rounded transition-colors">
                                        <div className="relative flex items-center">
                                            <input type="checkbox" checked={agreedToTerms} onChange={(e) => setAgreedToTerms(e.target.checked)} className="w-5 h-5 border-2 border-indigo-500 rounded text-indigo-600 focus:ring-indigo-500 cursor-pointer" />
                                        </div>
                                        <span className={`text-sm font-medium ${agreedToTerms ? 'text-indigo-900' : 'text-slate-600'}`}>利用規約の内容を確認し、同意します</span>
                                    </label>
                                </div>
                                <div className="pt-2">
                                    <div className="bg-orange-50 border border-orange-200 text-orange-800 p-3 rounded mb-3 text-sm flex items-start gap-2">
                                        <AlertCircle size={18} className="flex-shrink-0 mt-0.5" />
                                        <p>こちらの<strong>登録情報</strong>は、政策リサーチの登録にそのまま反映されます。特にメールアドレスは間違いのないよう再度ご確認の上、申し込みボタンを送信して下さい。</p>
                                    </div>
                                    <button
                                        type="submit"
                                        disabled={isSubmitting || !agreedToTerms}
                                        className={`w-full py-3 px-4 rounded-lg text-white font-bold text-lg shadow-md flex items-center justify-center gap-2 transition-all ${isSubmitting || !agreedToTerms ? 'bg-slate-400 cursor-not-allowed transform-none shadow-none' : 'bg-indigo-600 hover:bg-indigo-700 hover:shadow-lg active:transform active:scale-[0.98]'}`}
                                    >
                                        {isSubmitting ? '処理中...' : <><Send size={20} />申し込みを送信</>}
                                    </button>
                                    {!agreedToTerms && (
                                        <p className="text-center text-xs text-slate-400 mt-2">※送信するには利用規約への同意が必要です。また、@rifj.jpのドメインからのメールは受信可能な状態にしておいて下さい。</p>
                                    )}
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        }

        // --- App Component ---
        function App() {
            const [user, setUser] = useState(null);
            const [authError, setAuthError] = useState(null);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        console.error("Auth error:", error);
                        setAuthError(error.message);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            if (authError) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border-l-4 border-red-500">
                            <div className="flex items-center gap-3 mb-4 text-red-600">
                                <AlertTriangle size={32} />
                                <h2 className="text-xl font-bold">システムエラー</h2>
                            </div>
                            <p className="text-gray-700 mb-4">データベースへの接続に失敗しました。</p>
                            <div className="bg-slate-100 p-3 rounded text-xs font-mono text-slate-600 mb-4 overflow-x-auto">{authError}</div>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50 text-gray-600">
                        <div className="flex flex-col items-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
                            <p>システムを読み込み中...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">
                    <header className="bg-indigo-800 text-white shadow-lg print:hidden">
                        <div className="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-2">
                                <Shield className="w-8 h-8 text-indigo-200" />
                                <h1 className="text-xl font-bold tracking-wide">
                                    政策リサーチ 申込フォーム
                                </h1>
                            </div>
                        </div>
                    </header>
                    <main className="max-w-5xl mx-auto px-4 py-8 w-full flex-grow">
                        <RegistrationForm user={user} />
                    </main>
                    <footer className="bg-slate-100 border-t border-slate-200 print:hidden">
                        <div className="max-w-5xl mx-auto px-4 py-8 flex flex-col items-center gap-4">
                            <CorporateFooter />
                            <div className="text-xs flex items-center justify-center gap-2 text-slate-400">
                                <span>© 2025 Policy Research Portal. Secure Data System.</span>
                                <span className="text-slate-300">|</span>
                                <a 
                                    href="https://www.rifj.jp/privacypolicy/" 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="hover:text-indigo-800 hover:underline transition-colors flex items-center gap-1"
                                >
                                    プライバシーポリシーについて
                                    <span className="text-xs">↗</span>
                                </a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
