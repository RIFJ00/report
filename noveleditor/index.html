<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小説エディター＆ビューワー</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (ブラウザ上でJSXを変換) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 縦書き用のスタイル */
    .vertical-rl {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    .text-combine {
      text-combine-upright: all;
      -webkit-text-combine: horizontal;
    }
    /* スクロールバーの非表示（縦書き時の横スクロールを綺麗にするため） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* フォント設定 */
    body {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- アイコンコンポーネント (lucide-reactの代替) ---
    const IconPlay = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
    const IconPause = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
    const IconStop = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>;
    const IconChevronLeft = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const IconChevronRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
    const IconSun = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>;
    const IconMoon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>;
    const IconDownload = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;

    // 初期テキストを空（ブランク）に設定
    const initialText = ``;

    const NovelEditor = () => {
      const [text, setText] = useState(initialText);
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [currentPage, setCurrentPage] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      
      const CHARS_PER_PAGE = 400; // 1ページあたりの文字数目安
      const pages = [];
      for (let i = 0; i < text.length; i += CHARS_PER_PAGE) {
        pages.push(text.slice(i, i + CHARS_PER_PAGE));
      }
      const totalPages = Math.max(1, pages.length);

      // --- エクスポート機能 ---
      const handleExportWord = () => {
        const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML To Doc</title></head><body>";
        const footer = "</body></html>";
        const sourceHTML = header + "<div style='writing-mode: vertical-rl;'>" + text.replace(/\n/g, "<br>") + "</div>" + footer;
        const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
        const fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload);
        fileDownload.href = source;
        fileDownload.download = '小説.doc';
        fileDownload.click();
        document.body.removeChild(fileDownload);
      };

      const handleExportCSV = () => {
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const csvContent = text.split('\n').map(line => `"${line.replace(/"/g, '""')}"`).join('\n');
        const blob = new Blob([bom, csvContent], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '小説.csv';
        a.click();
        window.URL.revokeObjectURL(url);
      };

      // --- 読み上げ機能 (TTS) ---
      const speak = () => {
        if (!window.speechSynthesis) return alert("お使いのブラウザは音声読み上げに対応していません。");
        window.speechSynthesis.cancel();
        
        // 現在のページ以降のテキストを読み上げる
        const textToRead = pages.slice(currentPage).join('');
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'ja-JP';
        utterance.rate = 1.0;
        
        utterance.onend = () => {
          setIsPlaying(false);
          setIsPaused(false);
        };

        window.speechSynthesis.speak(utterance);
        setIsPlaying(true);
        setIsPaused(false);
      };

      const pause = () => {
        window.speechSynthesis.pause();
        setIsPaused(true);
      };

      const resume = () => {
        window.speechSynthesis.resume();
        setIsPaused(false);
      };

      const stop = () => {
        window.speechSynthesis.cancel();
        setIsPlaying(false);
        setIsPaused(false);
      };

      // --- 縦書きフォーマット整形 ---
      const formatVerticalText = (content) => {
        if (!content) return null;
        return content.split('\n').map((paragraph, idx) => {
          const trimmed = paragraph.trim();
          // 冒頭行（idx===0 または最初のページ）かつ『』で囲まれている場合をタイトルとして判定
          const isTitle = (currentPage === 0 && idx === 0) && trimmed.startsWith('『') && trimmed.endsWith('』');
          
          // エディターで改行のみ（空行）が入力された場合、HTML上で潰れないように全角スペースを入れて1行分の空きを作る
          if (paragraph === '') {
            return <p key={idx} className="leading-loose" style={{ minWidth: '1em', minHeight: '1em' }}>　</p>;
          }
          
          const formattedP = paragraph.split(/(……|——)/g).map((part, i) => {
            if (part === '……' || part === '——') {
              return <span key={i} style={{ fontVariantEastAsian: 'vertical' }}>{part}</span>;
            }
            return part;
          });
          
          // タイトルの場合は上部から約6文字分下げ、次の行（本文）との間に1行分の余白（左マージン）を設ける
          if (isTitle) {
            return (
              <p 
                key={idx} 
                className="text-2xl font-bold" 
                style={{ marginTop: '6em', marginLeft: '2.5em' }}
              >
                {formattedP}
              </p>
            );
          }
          
          return <p key={idx} className="leading-loose">{formattedP}</p>;
        });
      };

      return (
        <div className={`min-h-screen flex flex-col ${isDarkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-100 text-gray-900'}`}>
          
          {/* ヘッダー */}
          <header className={`p-4 border-b flex justify-between items-center ${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
            <h1 className="text-xl font-bold tracking-wider">小説エディター＆ビューワー</h1>
            <div className="flex gap-2">
              <button onClick={() => setIsDarkMode(!isDarkMode)} className={`p-2 rounded ${isDarkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-100 hover:bg-gray-200'}`}>
                {isDarkMode ? <IconSun /> : <IconMoon />}
              </button>
              <div className="relative group">
                <button className={`px-4 py-2 rounded flex items-center ${isDarkMode ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-blue-500 hover:bg-blue-600 text-white'}`}>
                  <IconDownload /> 出力
                </button>
                <div className="absolute right-0 mt-2 w-32 bg-white rounded-md shadow-lg hidden group-hover:block border border-gray-200 z-10">
                  <button onClick={handleExportWord} className="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Word</button>
                  <button onClick={handleExportCSV} className="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">CSV (Excel用)</button>
                </div>
              </div>
            </div>
          </header>

          {/* メインレイアウト */}
          <main className="flex-1 flex overflow-hidden">
            {/* 左側：エディター */}
            <div className={`w-1/2 p-4 flex flex-col border-r ${isDarkMode ? 'border-gray-700' : 'border-gray-300'}`}>
              <textarea
                className={`flex-1 p-4 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-800 text-gray-100' : 'bg-white text-gray-900'}`}
                value={text}
                onChange={(e) => {
                  setText(e.target.value);
                  setCurrentPage(0);
                }}
                placeholder="ここに小説のテキストを入力してください。&#13;&#10;一行目を『タイトル』と入力すると、ビューワー上でタイトルとして上部から少し下がり、1行空けて表示されます。"
              />
            </div>

            {/* 右側：ビューワー＆コントローラー */}
            <div className={`w-1/2 flex flex-col ${isDarkMode ? 'bg-[#1a1a1a]' : 'bg-[#fdfbf7]'}`}>
              
              {/* コントロールパネル */}
              <div className={`p-3 flex justify-between items-center border-b ${isDarkMode ? 'border-gray-700 bg-gray-800' : 'border-gray-300 bg-white'}`}>
                {/* 読み上げ機能 */}
                <div className="flex gap-2">
                  {!isPlaying ? (
                    <button onClick={speak} className="p-2 rounded bg-green-500 text-white hover:bg-green-600" title="再生"><IconPlay /></button>
                  ) : isPaused ? (
                    <button onClick={resume} className="p-2 rounded bg-green-500 text-white hover:bg-green-600" title="再開"><IconPlay /></button>
                  ) : (
                    <button onClick={pause} className="p-2 rounded bg-yellow-500 text-white hover:bg-yellow-600" title="一時停止"><IconPause /></button>
                  )}
                  <button onClick={stop} className="p-2 rounded bg-red-500 text-white hover:bg-red-600" title="停止"><IconStop /></button>
                </div>
                
                {/* ページネーション */}
                <div className="flex items-center gap-4">
                  <button 
                    onClick={() => setCurrentPage(p => Math.max(0, p - 1))}
                    disabled={currentPage === 0}
                    className="p-1 rounded disabled:opacity-30 hover:bg-gray-200 dark:hover:bg-gray-700"
                  >
                    <IconChevronLeft />
                  </button>
                  <span className="text-sm">{text.length === 0 ? "0 / 0" : `${currentPage + 1} / ${totalPages}`}</span>
                  <button 
                    onClick={() => setCurrentPage(p => Math.min(totalPages - 1, p + 1))}
                    disabled={currentPage === totalPages - 1 || text.length === 0}
                    className="p-1 rounded disabled:opacity-30 hover:bg-gray-200 dark:hover:bg-gray-700"
                  >
                    <IconChevronRight />
                  </button>
                </div>
              </div>

              {/* 縦書きプレビュー領域 */}
              <div className="flex-1 overflow-auto p-8 lg:p-12 text-center no-scrollbar">
                <div 
                  className={`inline-block vertical-rl text-lg tracking-widest text-left ${isDarkMode ? 'text-gray-300' : 'text-gray-800'}`}
                  style={{ height: '75vh' }}
                >
                  {text.length === 0 ? (
                    <p className="text-gray-400 mt-10">テキストを入力すると、ここに縦書きでプレビューされます。</p>
                  ) : (
                    formatVerticalText(pages[currentPage] || "")
                  )}
                </div>
              </div>

            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NovelEditor />);
  </script>
</body>
</html>
