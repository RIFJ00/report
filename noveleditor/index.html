<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小説エディター＆ビューワー</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (ブラウザ上でJSXを変換) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 縦書き用のスタイル */
    .vertical-rl {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    /* スクロールバーの完全非表示（レイアウト崩れ防止用） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* フォント設定 */
    body {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- アイコンコンポーネント ---
    const IconPlay = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
    const IconPause = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>;
    const IconStop = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>;
    const IconChevronLeft = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const IconChevronRight = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
    const IconSun = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>;
    const IconMoon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>;
    const IconDownload = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
    const IconSave = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
    const IconFolder = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>;
    const IconSettings = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
    const IconTrash = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const IconClose = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

    const NovelEditor = () => {
      // --- テキストと表示設定のステート ---
      const [text, setText] = useState(() => localStorage.getItem('currentDraft') || '');
      const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('isDarkMode') === 'true');
      const [fontSize, setFontSize] = useState(() => Number(localStorage.getItem('fontSize')) || 18);
      const [lineHeight, setLineHeight] = useState(() => Number(localStorage.getItem('lineHeight')) || 2.0);
      const [savedNovels, setSavedNovels] = useState(() => JSON.parse(localStorage.getItem('savedNovels') || '[]'));
      
      // --- 音声読み上げ（TTS）関連のステート ---
      const [voices, setVoices] = useState([]);
      const [selectedVoiceURI, setSelectedVoiceURI] = useState(() => localStorage.getItem('selectedVoiceURI') || '');
      const [speechRate, setSpeechRate] = useState(() => Number(localStorage.getItem('speechRate')) || 1.0);
      const [speechPitch, setSpeechPitch] = useState(() => Number(localStorage.getItem('speechPitch')) || 1.0);

      // --- UI開閉とページ管理のステート ---
      const [isExportMenuOpen, setIsExportMenuOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isLibraryOpen, setIsLibraryOpen] = useState(false);

      const [currentPage, setCurrentPage] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isPaused, setIsPaused] = useState(false);
      const [pageSplits, setPageSplits] = useState([]);
      
      const viewerRef = useRef(null);
      const isPlayingRef = useRef(false);

      // --- 初期化・設定保存 ---
      useEffect(() => {
        const timeoutId = setTimeout(() => {
          localStorage.setItem('currentDraft', text);
        }, 500);
        return () => clearTimeout(timeoutId);
      }, [text]);

      useEffect(() => {
        localStorage.setItem('isDarkMode', isDarkMode);
        localStorage.setItem('fontSize', fontSize);
        localStorage.setItem('lineHeight', lineHeight);
        localStorage.setItem('savedNovels', JSON.stringify(savedNovels));
      }, [isDarkMode, fontSize, lineHeight, savedNovels]);

      useEffect(() => {
        localStorage.setItem('selectedVoiceURI', selectedVoiceURI);
        localStorage.setItem('speechRate', speechRate);
        localStorage.setItem('speechPitch', speechPitch);
      }, [selectedVoiceURI, speechRate, speechPitch]);

      useEffect(() => {
        const populateVoices = () => {
          const availableVoices = window.speechSynthesis.getVoices();
          const jpVoices = availableVoices.filter(voice => voice.lang.includes('ja'));
          setVoices(jpVoices);
          
          if (jpVoices.length > 0 && !selectedVoiceURI) {
            setSelectedVoiceURI(jpVoices[0].voiceURI);
          }
        };

        populateVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = populateVoices;
        }
      }, []);

      const handleSaveNovel = () => {
        if (!text.trim()) return alert('テキストが入力されていません。');
        let title = "無題の小説";
        const firstLine = text.trim().split('\n')[0];
        if (firstLine.startsWith('『') && firstLine.endsWith('』')) {
          title = firstLine.slice(1, -1);
        } else if (firstLine.length > 0) {
          title = firstLine.slice(0, 15) + (firstLine.length > 15 ? "..." : "");
        }
        const newNovel = {
          id: Date.now(),
          title: title,
          content: text,
          date: new Date().toLocaleString()
        };
        setSavedNovels([newNovel, ...savedNovels]);
        alert(`「${title}」を保存しました。`);
      };

      const handleLoadNovel = (novel) => {
        if (confirm(`「${novel.title}」を読み込みますか？\n（現在の入力内容は上書きされます）`)) {
          setText(novel.content);
          setIsLibraryOpen(false);
          setCurrentPage(0);
        }
      };

      const handleDeleteNovel = (id, title) => {
        if (confirm(`「${title}」を本当に削除しますか？`)) {
          setSavedNovels(savedNovels.filter(n => n.id !== id));
        }
      };

      // --- 文字切れ防止＆ページ分割計算 ---
      useEffect(() => {
        let timeoutId = null;
        const calculatePages = () => {
          if (!viewerRef.current) return;
          if (text.length === 0) {
            setPageSplits([]);
            return;
          }

          const container = viewerRef.current;
          const availableWidth = container.clientWidth;
          const availableHeight = container.clientHeight;
          
          const actualLineHeight = fontSize * lineHeight;
          const charHeight = fontSize * 1.55; 
          
          const maxLines = Math.max(1, Math.floor((availableWidth - 10) / actualLineHeight));
          const maxCharsPerLine = Math.max(1, Math.floor((availableHeight - 20) / charHeight));
          
          const newPages = [];
          let currentPageText = "";
          let currentLineCount = 0;
          const paragraphs = text.split('\n');
          
          for (let i = 0; i < paragraphs.length; i++) {
            const p = paragraphs[i];
            const trimmed = p.trim();
            const isTitle = (i === 0 && trimmed.startsWith('『') && trimmed.endsWith('』'));
            
            if (p === "") {
              if (currentLineCount + 1 > maxLines && currentPageText !== "") {
                newPages.push(currentPageText);
                currentPageText = "\n";
                currentLineCount = 1;
              } else {
                currentPageText += "\n";
                currentLineCount += 1;
              }
              continue;
            }
            
            let charIndex = 0;
            while (charIndex < p.length) {
              let chunk = p.slice(charIndex, charIndex + maxCharsPerLine);
              let linesCost = isTitle ? 3 : 1; 
              
              if (currentLineCount + linesCost > maxLines && currentPageText !== "") {
                newPages.push(currentPageText);
                currentPageText = "";
                currentLineCount = 0;
              }
              
              currentPageText += chunk;
              currentLineCount += linesCost;
              charIndex += maxCharsPerLine;
            }
            
            if (i < paragraphs.length - 1) {
              currentPageText += '\n';
            }
          }
          if (currentPageText) newPages.push(currentPageText);
          setPageSplits(newPages);
        };

        calculatePages();
        const handleResize = () => {
          clearTimeout(timeoutId);
          timeoutId = setTimeout(calculatePages, 150);
        };
        window.addEventListener('resize', handleResize);
        return () => {
          window.removeEventListener('resize', handleResize);
          clearTimeout(timeoutId);
        };
      }, [text, fontSize, lineHeight]);

      const pages = pageSplits.length > 0 ? pageSplits : [];
      const totalPages = Math.max(1, pages.length);

      useEffect(() => {
        if (currentPage >= totalPages && totalPages > 0) {
          setCurrentPage(totalPages - 1);
        }
      }, [totalPages, currentPage]);

      // --- エクスポート機能 ---
      const getDocumentTitle = () => {
        const firstLine = text.trim().split('\n')[0];
        if (firstLine && firstLine.startsWith('『') && firstLine.endsWith('』')) {
          return firstLine.slice(1, -1);
        }
        return '小説';
      };

      const downloadFile = (content, fileName, mimeType) => {
        const blob = new Blob([content], { type: mimeType });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        setIsExportMenuOpen(false);
      };

      const handleExportWord = () => {
        const title = getDocumentTitle();
        const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>小説</title></head><body>";
        const footer = "</body></html>";
        const sourceHTML = header + `<div style='writing-mode: vertical-rl; font-family: sans-serif; font-size: ${fontSize}px; line-height: ${lineHeight};'>` + text.replace(/\n/g, "<br>") + "</div>" + footer;
        downloadFile('\ufeff' + sourceHTML, `${title}.doc`, 'application/msword');
      };

      const handleExportCSV = () => {
        const title = getDocumentTitle();
        const csvContent = text.split('\n').map(line => `"${line.replace(/"/g, '""')}"`).join('\n');
        downloadFile('\ufeff' + csvContent, `${title}.csv`, 'text/csv');
      };

      const handleExportText = () => {
        const title = getDocumentTitle();
        downloadFile(text, `${title}.txt`, 'text/plain');
      };

      // --- スムーズな読み上げ機能 ---
      const speak = () => {
        if (!window.speechSynthesis) return alert("お使いのブラウザは音声読み上げに対応していません。");
        window.speechSynthesis.cancel();
        
        isPlayingRef.current = true;
        setIsPlaying(true);
        setIsPaused(false);
        readFromCurrentPage(currentPage);
      };

      const readFromCurrentPage = (pageIdx) => {
        if (!isPlayingRef.current) return;
        if (pageIdx >= pages.length) {
          stop();
          return;
        }

        setCurrentPage(pageIdx);
        
        const textToRead = pages[pageIdx];
        if (!textToRead || textToRead.trim() === '') {
          readFromCurrentPage(pageIdx + 1);
          return;
        }

        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'ja-JP';
        utterance.rate = speechRate;
        utterance.pitch = speechPitch;
        
        const selectedVoice = voices.find(v => v.voiceURI === selectedVoiceURI);
        if (selectedVoice) {
          utterance.voice = selectedVoice;
        }

        utterance.onend = () => {
          if (isPlayingRef.current) {
            readFromCurrentPage(pageIdx + 1);
          }
        };

        utterance.onerror = (e) => {
          if (e.error !== 'canceled') {
            stop();
          }
        };

        window.speechSynthesis.speak(utterance);
      };

      const pause = () => { 
        window.speechSynthesis.pause(); 
        setIsPaused(true); 
      };
      
      const resume = () => { 
        window.speechSynthesis.resume(); 
        setIsPaused(false); 
      };
      
      const stop = () => { 
        isPlayingRef.current = false;
        window.speechSynthesis.cancel(); 
        setIsPlaying(false); 
        setIsPaused(false); 
      };

      // --- 縦書きフォーマット整形 ---
      const formatVerticalText = (content) => {
        if (!content) return null;
        return content.split('\n').map((paragraph, idx) => {
          const trimmed = paragraph.trim();
          const isTitle = (currentPage === 0 && idx === 0) && trimmed.startsWith('『') && trimmed.endsWith('』');
          
          if (paragraph === '') {
            return <p key={idx} className="m-0" style={{ minWidth: '1em', minHeight: '1em', lineHeight: lineHeight }}> </p>;
          }
          
          const formattedP = paragraph.split(/(……|——)/g).map((part, i) => {
            if (part === '……' || part === '——') {
              return <span key={i} style={{ fontVariantEastAsian: 'vertical' }}>{part}</span>;
            }
            return part;
          });
          
          if (isTitle) {
            return (
              <p 
                key={idx} 
                className="font-bold m-0" 
                style={{ fontSize: `${fontSize * 1.5}px`, marginTop: '4em', marginLeft: '2em', lineHeight: lineHeight }}
              >
                {formattedP}
              </p>
            );
          }
          
          return <p key={idx} className="m-0" style={{ fontSize: `${fontSize}px`, lineHeight: lineHeight }}>{formattedP}</p>;
        });
      };

      return (
        <div className={`h-screen w-screen flex flex-col overflow-hidden relative ${isDarkMode ? 'bg-gray-900 text-gray-100' : 'bg-gray-100 text-gray-900'}`}>
          
          <header className={`p-4 border-b shrink-0 flex justify-between items-center ${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
            <h1 className="text-xl font-bold tracking-wider hidden sm:block">小説エディター＆ビューワー</h1>
            <div className="flex gap-2 ml-auto">
              <button onClick={handleSaveNovel} className={`p-2 rounded flex items-center gap-1 ${isDarkMode ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-emerald-500 hover:bg-emerald-600 text-white'}`} title="名前を付けて保存">
                <IconSave /> <span className="hidden md:inline text-sm font-bold">保存</span>
              </button>
              <button onClick={() => setIsLibraryOpen(true)} className={`p-2 rounded flex items-center gap-1 ${isDarkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`} title="保存した一覧">
                <IconFolder /> <span className="hidden md:inline text-sm font-bold">一覧</span>
              </button>

              <div className="w-px h-8 bg-gray-300 dark:bg-gray-600 mx-1"></div>

              {/* 設定ボタンとドロップダウン */}
              <div className="relative">
                <button onClick={() => setIsSettingsOpen(!isSettingsOpen)} className={`p-2 rounded ${isDarkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`} title="各種設定">
                  <IconSettings />
                </button>
                {isSettingsOpen && (
                  <div className={`absolute right-0 mt-2 w-72 p-4 rounded-md shadow-xl border z-20 max-h-[80vh] overflow-y-auto ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-white border-gray-200'}`}>
                    
                    <h3 className="font-bold mb-3 border-b pb-1 border-gray-500">表示設定</h3>
                    <div className="mb-4">
                      <label className="text-sm block mb-1">文字サイズ: {fontSize}px</label>
                      <input type="range" min="12" max="36" value={fontSize} onChange={e => setFontSize(Number(e.target.value))} className="w-full accent-blue-500" />
                    </div>
                    <div className="mb-6">
                      <label className="text-sm block mb-1">行間 (行数調整): {lineHeight}</label>
                      <input type="range" min="1.5" max="3.5" step="0.1" value={lineHeight} onChange={e => setLineHeight(Number(e.target.value))} className="w-full accent-blue-500" />
                    </div>

                    <h3 className="font-bold mb-3 border-b pb-1 border-gray-500">読み上げ（TTS）設定</h3>
                    <div className="mb-4">
                      <label className="text-sm block mb-1">音声の種類:</label>
                      <select 
                        value={selectedVoiceURI} 
                        onChange={e => setSelectedVoiceURI(e.target.value)}
                        className="w-full p-2 border rounded text-sm bg-gray-50 text-gray-900 border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        {voices.length === 0 ? <option value="">読み込み中...</option> : null}
                        {voices.map(v => (
                          <option key={v.voiceURI} value={v.voiceURI}>{v.name}</option>
                        ))}
                      </select>
                    </div>
                    <div className="mb-4">
                      <label className="text-sm block mb-1">声の高さ: {speechPitch.toFixed(1)}</label>
                      <input type="range" min="0.5" max="2.0" step="0.1" value={speechPitch} onChange={e => setSpeechPitch(Number(e.target.value))} className="w-full accent-green-500" />
                    </div>
                    <div className="mb-2">
                      <label className="text-sm block mb-1">読み上げ速度: {speechRate.toFixed(1)}</label>
                      <input type="range" min="0.5" max="3.0" step="0.1" value={speechRate} onChange={e => setSpeechRate(Number(e.target.value))} className="w-full accent-green-500" />
                    </div>
                  </div>
                )}
              </div>

              <button onClick={() => setIsDarkMode(!isDarkMode)} className={`p-2 rounded ${isDarkMode ? 'bg-gray-700 hover:bg-gray-600' : 'bg-gray-200 hover:bg-gray-300'}`}>
                {isDarkMode ? <IconSun /> : <IconMoon />}
              </button>
              
              <div className="relative">
                <button onClick={() => setIsExportMenuOpen(!isExportMenuOpen)} className={`px-4 py-2 rounded flex items-center ${isDarkMode ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-blue-500 hover:bg-blue-600 text-white'}`}>
                  <IconDownload /> <span className="text-sm font-bold ml-1">出力</span>
                </button>
                {isExportMenuOpen && (
                  <div className={`absolute right-0 mt-2 w-40 rounded-md shadow-lg border z-20 ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-white border-gray-200'}`}>
                    <button onClick={handleExportWord} className={`block w-full text-left px-4 py-3 text-sm hover:bg-gray-200 ${isDarkMode ? 'text-gray-100 hover:text-gray-900' : 'text-gray-700'}`}>Word出力 (.doc)</button>
                    <button onClick={handleExportText} className={`block w-full text-left px-4 py-3 text-sm border-t hover:bg-gray-200 ${isDarkMode ? 'text-gray-100 border-gray-700 hover:text-gray-900' : 'text-gray-700 border-gray-100'}`}>テキスト出力 (.txt)</button>
                    <button onClick={handleExportCSV} className={`block w-full text-left px-4 py-3 text-sm border-t hover:bg-gray-200 ${isDarkMode ? 'text-gray-100 border-gray-700 hover:text-gray-900' : 'text-gray-700 border-gray-100'}`}>CSV出力 (.csv)</button>
                  </div>
                )}
              </div>
            </div>
          </header>

          {isLibraryOpen && (
            <div className="absolute inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
              <div className={`w-full max-w-2xl rounded-lg shadow-2xl flex flex-col max-h-full ${isDarkMode ? 'bg-gray-800 text-gray-100' : 'bg-white text-gray-900'}`}>
                <div className="p-4 border-b flex justify-between items-center shrink-0">
                  <h2 className="text-xl font-bold flex items-center gap-2"><IconFolder /> 保存済み小説一覧</h2>
                  <button onClick={() => setIsLibraryOpen(false)} className="p-1 hover:bg-red-500 hover:text-white rounded text-gray-500"><IconClose /></button>
                </div>
                <div className="p-4 overflow-y-auto flex-1">
                  {savedNovels.length === 0 ? (
                    <p className="text-gray-500 text-center py-10">保存された作品はありません。</p>
                  ) : (
                    <ul className="space-y-3">
                      {savedNovels.map(novel => (
                        <li key={novel.id} className={`p-4 rounded border flex justify-between items-center ${isDarkMode ? 'border-gray-700 bg-gray-700' : 'border-gray-200 bg-gray-50'}`}>
                          <div className="flex-1 overflow-hidden">
                            <h3 className="font-bold text-lg truncate">{novel.title}</h3>
                            <p className="text-sm text-gray-500 truncate">{novel.date} - {novel.content.length}文字</p>
                          </div>
                          <div className="flex gap-2 ml-4 shrink-0">
                            <button onClick={() => handleLoadNovel(novel)} className="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">読み込む</button>
                            <button onClick={() => handleDeleteNovel(novel.id, novel.title)} className="p-1 bg-red-100 text-red-600 rounded hover:bg-red-200" title="削除"><IconTrash /></button>
                          </div>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            </div>
          )}

          <main className="flex-1 flex overflow-hidden relative z-0">
            <div className={`w-1/2 p-4 flex flex-col border-r ${isDarkMode ? 'border-gray-700' : 'border-gray-300'}`}>
              <textarea
                className={`flex-1 p-4 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 ${isDarkMode ? 'bg-gray-800 text-gray-100' : 'bg-white text-gray-900'}`}
                value={text}
                onChange={(e) => {
                  setText(e.target.value);
                  setCurrentPage(0);
                }}
                placeholder="ここに小説のテキストを入力してください。&#13;&#10;一行目を『タイトル』と入力すると、ビューワー上でタイトルとして上部から少し下がり、1行空けて表示されます。&#13;&#10;&#13;&#10;※入力した内容は自動でブラウザに保存されます。"
              />
            </div>

            <div className={`w-1/2 flex flex-col ${isDarkMode ? 'bg-[#1a1a1a]' : 'bg-[#fdfbf7]'}`}>
              
              <div className={`p-3 border-b shrink-0 flex justify-between items-center ${isDarkMode ? 'border-gray-700 bg-gray-800' : 'border-gray-300 bg-white'}`}>
                <div className="flex gap-2">
                  {!isPlaying ? (
                    <button onClick={speak} className="p-2 rounded bg-green-500 text-white hover:bg-green-600" title="再生"><IconPlay /></button>
                  ) : isPaused ? (
                    <button onClick={resume} className="p-2 rounded bg-green-500 text-white hover:bg-green-600" title="再開"><IconPlay /></button>
                  ) : (
                    <button onClick={pause} className="p-2 rounded bg-yellow-500 text-white hover:bg-yellow-600" title="一時停止"><IconPause /></button>
                  )}
                  <button onClick={stop} className="p-2 rounded bg-red-500 text-white hover:bg-red-600" title="停止"><IconStop /></button>
                </div>
                
                <div className="flex items-center gap-4">
                  <button 
                    onClick={() => { setCurrentPage(p => Math.max(0, p - 1)); stop(); }}
                    disabled={currentPage === 0}
                    className="p-1 rounded disabled:opacity-30 hover:bg-gray-200 dark:hover:bg-gray-700"
                  >
                    <IconChevronLeft />
                  </button>
                  <span className="text-sm">{text.length === 0 ? "0 / 0" : `${currentPage + 1} / ${totalPages}`}</span>
                  <button 
                    onClick={() => { setCurrentPage(p => Math.min(totalPages - 1, p + 1)); stop(); }}
                    disabled={currentPage === totalPages - 1 || text.length === 0}
                    className="p-1 rounded disabled:opacity-30 hover:bg-gray-200 dark:hover:bg-gray-700"
                  >
                    <IconChevronRight />
                  </button>
                </div>
              </div>

              {/* 【修正】overflow-y-auto と no-scrollbar を追加し、縦スクロール可能かつ横ズレなしに */}
              <div className="flex-1 relative overflow-hidden" style={{ minHeight: 0 }}>
                <div 
                  ref={viewerRef} 
                  className="absolute top-8 bottom-8 left-8 right-8 md:top-12 md:bottom-12 md:left-12 md:right-12 overflow-y-auto overflow-x-hidden no-scrollbar flex justify-center"
                >
                  <div 
                    className={`vertical-rl tracking-widest text-left ${isDarkMode ? 'text-gray-300' : 'text-gray-800'}`}
                    style={{ height: '100%', wordBreak: 'break-all' }}
                  >
                    {text.length === 0 ? (
                      <p className="text-gray-400 mt-10">テキストを入力すると、ここに縦書きでプレビューされます。</p>
                    ) : (
                      formatVerticalText(pages[currentPage] || "")
                    )}
                  </div>
                </div>
              </div>

            </div>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NovelEditor />);
  </script>
</body>
</html>
