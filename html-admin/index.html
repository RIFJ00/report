<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="noindex,nofollow" name="robots"/><title>日本みらい研｜政策リサーチ</title><link href="../legacy-html-assets/app.css?v=1_8" rel="stylesheet"/><meta name="rifj-viewer-fix" content="v1.8.1"></head><body data-mode="admin"><header class="top"><div><h1>日本みらい研｜政策リサーチ</h1><small>HTML管理画面</small></div><div class="nav"><span id="who"></span><button class="button secondary small hide" id="logout">ログアウト</button></div></header><div class="login-layout" id="login"><form class="login-card stack" id="loginForm"><h2>管理者ログイン</h2><p class="soft">Firebase Authenticationに登録済みのメールアドレスでログインします。</p><input autocomplete="username" id="email" placeholder="メールアドレス" required="" type="email"/><input autocomplete="current-password" id="password" placeholder="パスワード" required="" type="password"/><button class="button" type="submit">ログイン</button><div class="status" id="loginStatus"></div></form></div>
<div class="wrap hide" id="workspace"><section class="panel"><div class="pad stack"><div class="row"><h2 style="margin:0">記事を登録・管理</h2><span class="soft" id="total"></span></div><div class="stack"><label for="url">記事URL</label><div class="url-input-row"><input id="url" placeholder="https://note.com/... など" type="url"/><button aria-label="記事URLをクリア" class="button secondary small" id="clearURL" type="button">クリア</button></div><button class="button" id="importURL">URLからHTML生成・上書き</button><details class="details"><summary>URL取得できない場合：元HTMLを読み込む</summary><p>Safari等で保存した元記事のHTMLを選択してください。URLとともに登録し、同一URLは上書きします。</p><input accept=".html,.htm,text/html" id="htmlFile" type="file"/><button class="button secondary small" id="importFile" style="margin-top:8px">HTMLファイルを登録</button></details></div><div class="divider"></div><h2 style="margin:0">保存済み記事を検索</h2><div class="search-input"><input id="query" placeholder="タイトル・本文のキーワード" type="search"/><button class="button secondary small" id="clear">クリア</button></div><div class="filtergrid"><div class="stack"><label for="kind">掲載元</label><select id="kind"><option value="">すべて</option><option value="kantei">首相官邸</option><option value="soumu">総務省</option><option value="mofa">外務省</option><option value="mof">財務省</option><option value="mext">文部科学省</option><option value="mhlw">厚生労働省</option><option value="maff">農林水産省</option><option value="meti">経済産業省</option><option value="mlit">国土交通省</option><option value="env">環境省</option><option value="note">note</option><option value="ameblo">アメブロ</option></select></div><div class="stack"><label for="scope">検索対象</label><select id="scope"><option value="all">タイトル・本文・URL</option><option value="title">タイトルのみ</option><option value="body">本文のみ</option></select></div><div class="stack"><label for="sort">並べ替え</label><select id="sort"><option value="date">公表日（新しい順）</option><option value="ministry">掲載元順</option><option value="input">入力順</option></select></div><div class="stack"><label for="pageSize">一覧表示件数</label><select id="pageSize"><option value="10">10件</option><option value="30">30件</option><option value="50">50件</option></select></div></div><button class="button secondary" id="searchButton">検索する</button><div class="status" id="status"></div></div><div aria-label="記事一覧" class="list" id="list"></div><div class="pad row"><button class="button secondary small hide" id="more">続きを表示</button></div></section><section class="panel"><div class="previewHead"><div class="row wraprow"><button class="button secondary small hide" id="edit">記事情報を編集</button><button class="button danger small hide" id="remove">削除</button><button class="button secondary small hide" id="export">HTMLを出力</button></div></div><iframe class="preview" id="preview" referrerpolicy="no-referrer" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" title="記事本文のプレビュー"></iframe><div class="empty" id="previewEmpty">左側の記事を選択してください。</div></section></div><div class="foot">©政策リサーチ | 一般社団法人日本みらい研</div>
<dialog id="editDialog"><div class="dialogTop"><b>記事情報を編集</b><button class="button secondary small" id="closeDialog">閉じる</button></div><form class="dialogMain stack" id="editForm"><div class="fields"><div><label for="editTitle">正式タイトル</label><input id="editTitle"/></div><div><label for="editHeader">ヘッダー用短縮タイトル</label><input id="editHeader"/></div><div><label for="editDate">公開日（YYYY-MM-DD）</label><input id="editDate" type="date"/></div></div><label for="editBody">本文HTML（必要な場合のみ変更）</label><textarea class="editbody" id="editBody"></textarea><p class="soft">手動編集は同じURLを再取得しても維持されます。元記事の公表日時と取込日は別管理します。</p><div class="buttonline"><button class="button" type="submit">保存してHTMLを更新</button></div></form></dialog>
<dialog id="rifjImageDialog" class="rifj-image-dialog" aria-label="代表画像の拡大表示">
  <div class="rifj-image-toolbar"><span>画像を拡大表示</span><button class="button secondary small" data-close type="button" aria-label="拡大画像を閉じる">× 閉じる</button></div>
  <div class="rifj-image-content"><img data-image alt="拡大画像" referrerpolicy="no-referrer"><p data-caption></p></div>
</dialog>
<script src="../legacy-html-assets/app.js?v=v1_10_3" type="module"></script></body></html>
