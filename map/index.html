    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
        #map { height: 60vh; width: 100%; z-index: 0; }
        .slider-container { position: relative; width: 100%; padding-bottom: 20px; }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }
        .year-mark {
            position: absolute;
            top: 20px;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #6b7280;
            white-space: nowrap;
        }
        .year-mark::before {
            content: '|';
            display: block;
            text-align: center;
            font-size: 0.6rem;
            margin-bottom: 2px;
            color: #d1d5db;
        }
        .legend-item { display: flex; align-items: center; margin-right: 12px; margin-bottom: 4px; }
        .color-box { width: 12px; height: 12px; margin-right: 4px; border: 1px solid #fff; opacity: 0.6; }
        .leaflet-popup-content-wrapper { border-radius: 8px; padding: 0; }
        .leaflet-popup-content { margin: 0; width: 260px !important; }

<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-800 text-white p-4 shadow-md z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold">🌏 世界の主要な勢力図の推移</h1>
            <button id="helpBtn" class="text-sm bg-slate-600 px-3 py-1 rounded hover:bg-slate-500">解説</button>
        </div>
    </header>

    <!-- Map Container -->
    <div id="map" class="flex-grow border-b-4 border-slate-300"></div>

    <!-- Controls & Info Panel -->

            <!-- Timeline Controls -->
            <div class="mb-2">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <span id="currentYearDisplay" class="text-4xl font-bold text-slate-800">1000 BC</span>
                        <span id="jpEraDisplay" class="text-xl font-bold text-red-700 ml-2"></span>
                    </div>
                    <span id="eraNameDisplay" class="text-lg md:text-xl font-semibold text-slate-600 ml-4 text-right">古代</span>
                </div>
                
                <div class="slider-container">
                    <input type="range" id="yearSlider" min="0" max="100" value="0" step="0.1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer z-10 relative">
                    
                    <!-- Absolute Positioned Labels based on logic -->
                    <!-- 0% = -1000 -->
                    <div class="year-mark" style="left: 0%">1000BC</div>
                    <!-- 11.7% = 0 AD (Approx) -->
                    <div class="year-mark" style="left: 11.7%">0</div>
                    <!-- 23.5% = 1000 AD (Approx) -->
                    <div class="year-mark" style="left: 23.5%">1000</div>
                    <!-- 33% = 1800 AD (Break Point) -->
                    <div class="year-mark" style="left: 33%">1800</div>
                    <!-- 63% = 1900 AD -->
                    <div class="year-mark" style="left: 63%">1900</div>
                    <!-- 100% = 2024 AD -->
                    <div class="year-mark" style="left: 100%">2024</div>
                </div>
            </div>

            <!-- Controls Row -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4 mt-6">
                <div class="flex items-center space-x-2 shrink-0 flex-wrap">
                    <button id="playPauseBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full transition shadow flex items-center mr-2 mb-2 md:mb-0">
                        <span id="playIcon">▶ 再生</span>
                    </button>
                    
                    <select id="loopModeSelect" class="bg-gray-100 border border-gray-300 text-gray-700 py-1 px-2 rounded text-sm mr-2">
                        <option value="loop">ループ再生</option>
                        <option value="once">一回のみ</option>
                    </select>

                    <select id="speedSelect" class="bg-gray-100 border border-gray-300 text-gray-700 py-1 px-2 rounded text-sm">
                        <option value="50">最速</option>
                        <option value="100">速い</option>
                        <option value="200" selected>普通</option>
                        <option value="500">遅い</option>
                    </select>
                </div>

                <!-- Legend -->

                    <div class="legend-item"><div class="color-box bg-red-600"></div><span class="text-xs">日本</span></div>
                    <div class="legend-item"><div class="color-box bg-yellow-500"></div><span class="text-xs">中国</span></div>
                    <div class="legend-item"><div class="color-box bg-blue-600"></div><span class="text-xs">ロシア</span></div>
                    <div class="legend-item"><div class="color-box bg-orange-500"></div><span class="text-xs">インド</span></div>

                    <div class="legend-item"><div class="color-box bg-cyan-600"></div><span class="text-xs">エジプト</span></div>

                    <div class="legend-item"><div class="color-box" style="background:#0055ff"></div><span class="text-xs">仏</span></div>

            </div>
        </div>

        // --- Application Logic ---

        let map;
        let layers = {};
        Object.keys(COUNTRY_DEFS).forEach(k => layers[k] = []);
        let isPlaying = false;
        let animationInterval;

        function sliderToYear(val) {
            if (val <= 33) {
                const percent = val / 33;
                return Math.round(-1000 + percent * (1800 - (-1000)));
            } else {
                const percent = (val - 33) / (100 - 33);
                return Math.round(1800 + percent * (2024 - 1800));
            }
        }

        function getDataForYear(year) {
            const sorted = TIMELINE.sort((a, b) => a.year - b.year);
            let selected = sorted[0];
            for (let i = 0; i < sorted.length; i++) {
                if (sorted[i].year <= year) {
                    selected = sorted[i];
                } else {
                    break;
                }
            }
            return selected;
        }

        function initMap() {
            map = L.map('map').setView([40, 50], 2); // Wider View

            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OSM contributors &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            updateVisualization(0); 
        }

        function drawCountry(countryCode, zoneIds, timelineData, currentYear) {
            layers[countryCode].forEach(layer => map.removeLayer(layer));
            layers[countryCode] = [];
            
            const def = COUNTRY_DEFS[countryCode];
            const color = def.color;
            if (!zoneIds) return;

            let popupTitle = def.name;
            let popupText = "";
            let eraName = "";
            
            // Get predefined data from TIMELINE
            if (timelineData.details && timelineData.details[countryCode]) {
                const detail = timelineData.details[countryCode];
                eraName = detail.name; 
                popupText = detail.text;
            } else {
                popupText = `${Math.abs(timelineData.year)}年頃の${def.name}の勢力圏です。`;
            }

            // Japan specific logic for popup era name dynamic calculation
            if (countryCode === 'jp') {
                const calculatedEra = getJapaneseEra(currentYear);
                if (calculatedEra) {
                    if (eraName && eraName !== calculatedEra) {
                        eraName = `${eraName} (${calculatedEra})`;
                    } else if (!eraName) {
                        eraName = calculatedEra;
                    }
                }
            }

            zoneIds.forEach(zoneId => {
                const coords = ZONES[zoneId];
                if (coords) {
                    const polygon = L.polygon(coords, {
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.4,
                        weight: 1,
                        dashArray: null
                    }).addTo(map);
                    
                    const regionName = ZONE_NAMES[zoneId] || "詳細な地域名不明";
                    
                    const popupContent = `
                        <div class="p-3 bg-white">
                            <h3 class="font-bold text-lg text-slate-800 border-b pb-1 mb-2" style="border-color:${color}">
                                ${popupTitle}
                                ${eraName ? `<span class="block text-sm font-normal text-gray-600">時代: ${eraName}</span>` : ''}
                            </h3>
                            <p class="text-sm text-gray-600 font-bold mb-1">${timelineData.era}</p>
                            <p class="text-sm text-gray-700 leading-relaxed">${popupText}</p>
                            <p class="text-xs text-slate-500 mt-2 border-t pt-1">地域: ${regionName}</p>
                        </div>
                    `;
                    
                    polygon.bindPopup(popupContent);
                    layers[countryCode].push(polygon);
                }
            });
        }

        function updateVisualization(sliderVal) {
            const currentYear = sliderToYear(sliderVal);
            const data = getDataForYear(currentYear);
            
            const yearText = currentYear < 0 ? `紀元前 ${Math.abs(currentYear)}年` : `${currentYear}年`;
            document.getElementById('currentYearDisplay').innerText = yearText;
            document.getElementById('eraNameDisplay').innerText = data.era.split(':')[1] || data.era; // Simplify
            document.getElementById('descriptionText').innerText = data.desc;

            // JP Era
            const jpEra = getJapaneseEra(currentYear);
            document.getElementById('jpEraDisplay').innerText = jpEra ? `(${jpEra})` : '';

            // Update Era List
            const eraListEl = document.getElementById('eraList');
            eraListEl.innerHTML = ''; 

            if (data.details) {
                Object.keys(COUNTRY_DEFS).forEach(code => {
                     if (data.details[code]) {
                         const detail = data.details[code];
                         const def = COUNTRY_DEFS[code];
                         
                         const item = document.createElement('div');
                         item.className = 'flex items-center space-x-2 text-xs md:text-sm bg-gray-50 p-2 rounded border border-gray-100 shadow-sm';
                         item.innerHTML = `
                            <div class="w-3 h-3 rounded-full flex-shrink-0" style="background-color:${def.color}"></div>
                            <div class="flex flex-col overflow-hidden">
                                <span class="font-bold text-gray-700 truncate">${def.name}</span>
                                <span class="text-gray-600 text-xs truncate" title="${detail.name}">${detail.name}</span>
                            </div>
                         `;
                         eraListEl.appendChild(item);
                     }
                });
            }

            // Draw all countries with currentYear for dynamic era calculation
            Object.keys(COUNTRY_DEFS).forEach(code => {
                drawCountry(code, data[code], data, currentYear);
            });
        }

        // Controls
        const slider = document.getElementById('yearSlider');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const speedSelect = document.getElementById('speedSelect');
        const loopModeSelect = document.getElementById('loopModeSelect');

        slider.addEventListener('input', (e) => {
            updateVisualization(parseFloat(e.target.value));
            if(isPlaying) stopAnimation();
        });

        function startAnimation() {
            isPlaying = true;
            playIcon.innerText = "⏸ 停止";
            
            let currentVal = parseFloat(slider.value);
            const maxVal = parseFloat(slider.max);
            const step = 0.3; 

            animationInterval = setInterval(() => {
                currentVal += step;
                if (currentVal > maxVal) {
                    if (loopModeSelect.value === 'loop') {
                        currentVal = parseFloat(slider.min);
                    } else {
                        currentVal = maxVal;
                        stopAnimation();
                    }
                }
                slider.value = currentVal;
                updateVisualization(currentVal);
            }, parseInt(speedSelect.value));
        }

        function stopAnimation() {
            isPlaying = false;
            playIcon.innerText = "▶ 再生";
            clearInterval(animationInterval);
        }

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopAnimation();
            } else {
                startAnimation();
            }
        });

        const helpBtn = document.getElementById('helpBtn');
        const helpModal = document.getElementById('helpModal');
        const closeHelpBtn = document.getElementById('closeHelpBtn');
        helpBtn.addEventListener('click', () => helpModal.classList.remove('hidden'));
        closeHelpBtn.addEventListener('click', () => helpModal.classList.add('hidden'));

        window.onload = initMap;

    </script>
</body>
</html>
