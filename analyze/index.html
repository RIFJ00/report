<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Data Analyzer - Master Edition (26 Tools)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- SheetJS for Excel/CSV Import & Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Plotly.js for Advanced Charting -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <!-- jStat for Statistical Tests -->
  <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- html2pdf for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f8fafc; color: #1e293b; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    .animate-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .cell-input { width: 100%; border: none; background: transparent; outline: none; padding: 6px 10px; transition: background 0.2s; font-size: 0.875rem; min-height: 36px; }
    .cell-input:focus { background: #eff6ff; box-shadow: inset 0 0 0 2px #3b82f6; border-radius: 2px; }
    .header-input { font-weight: bold; text-align: left; color: #0f172a; background: #f1f5f9; border-radius: 4px; }
    input[type="date"].cell-input { cursor: pointer; }
    
    .markdown-content p { margin-bottom: 0.75rem; line-height: 1.6; }
    .markdown-content strong { color: #2563eb; font-weight: 800; }
    .modal-overlay { background-color: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Fragment } = React;

    // ==========================================
    // 1. 定数定義 & 設定
    // ==========================================

    const ANALYSIS_TYPES = [
      { id: 'summary', name: '1. 基本統計量 (表)', group: '基礎', desc: '平均、標準偏差、最小、最大、中央値などを一覧表示します。' },
      { id: 'timeseries', name: '2. 時系列推移 (折れ線)', group: '推移・傾向', desc: '時間の経過に伴う数値の変化を示します。' },
      { id: 'bumpchart', name: '3. バンプチャート (順位推移)', group: '推移・傾向', desc: '数値ではなく「順位」の変動を折れ線で追います。' },
      { id: 'comparison', name: '4. カテゴリ別平均 (棒グラフ)', group: '比較', desc: 'カテゴリごとの平均を算出し、棒グラフで比較します。' },
      { id: 'radar', name: '5. レーダーチャート (多変量比較)', group: '比較', desc: '複数の項目を放射状の軸で多角形表示します。' },
      { id: 'boxplot', name: '6. 分布・ばらつき (箱ひげ図)', group: '分布', desc: 'データの四分位数や外れ値を表現します。' },
      { id: 'histogram', name: '7. 全体分布 (ヒストグラム)', group: '分布', desc: '階級ごとのデータ数を棒グラフで示します。' },
      { id: 'violin', name: '8. バイオリンプロット (密度分布)', group: '分布', desc: '箱ひげ図に密度分布を組み合わせたグラフです。' },
      { id: 'stripplot', name: '9. ストリッププロット (散布)', group: '分布', desc: '生のデータ点を散らして配置します。' },
      { id: 'ridgeline', name: '10. リッジラインプロット', group: '分布', desc: 'グループごとの分布を、山の稜線のように重ねて並べます。' },
      { id: 'contour', name: '11. 2D密度等高線', group: '分布', desc: 'データの密集度合いを等高線や色の濃淡で示します。' },
      { id: 'correlation', name: '12. 変数間相関 (ヒートマップ)', group: '関係性', desc: '数値データ間の連動性を色の濃淡で示します。' },
      { id: 'scatter', name: '13. 散布図 (2変数比較)', group: '関係性', desc: '縦軸と横軸に数値を設定し、点を表示します。' },
      { id: 'bubble', name: '14. バブルチャート (3変数比較)', group: '関係性', desc: '散布図に加え、点の大きさで3つ目の数値を表現します。' },
      { id: 'splom', name: '15. 散布図行列 (多変数相関)', group: '関係性', desc: '数値変数の全組み合わせの散布図をマトリックス表示します。' },
      { id: 'scatter3d', name: '16. 3D散布図', group: '関係性', desc: '3つの数値をXYZ軸にプロットします。' },
      { id: 'stackedbar', name: '17. 積み上げ棒グラフ (構成比)', group: '構成比', desc: '数値を積み上げて1本の棒にします。' },
      { id: 'pie', name: '18. 円グラフ (構成比)', group: '構成比', desc: '合計値や件数の割合を円グラフで表示します。' },
      { id: 'treemap', name: '19. ツリーマップ (階層構成比)', group: '構成比', desc: '複数カテゴリの階層を面積で表現します。', needsMultiX: true },
      { id: 'sunburst', name: '20. サンバースト (多階層構成比)', group: '構成比', desc: '複数のカテゴリ階層を円状に表現します。', needsMultiX: true },
      { id: 'parcoords', name: '21. 平行座標プロット (多次元)', group: '高度な分析', desc: '複数の縦軸を平行に並べて描画します。' },
      { id: 'crosstab_heatmap', name: '22. クロス集計ヒートマップ', group: '高度な分析', desc: '2つのカテゴリの掛け合わせを集計します。' },
      { id: 'stat_test', name: '23. 統計的検定 (分散分析)', group: '高度な分析', desc: '平均値の差が統計的に有意であるかを計算します。' },
      { id: 'candlestick', name: '24. ローソク足チャート', group: '株式・金融', desc: 'X軸に日付、Y軸(数値)に「始値・高値・安値・終値」の4項目を選択してください。' },
      { id: 'normalized_line', name: '25. 基準化推移 (リターン比較)', group: '株式・金融', desc: '最初の値を100として、複数項目の成長率・変動率を比較します。' },
      { id: 'waterfall', name: '26. ウォーターフォール (増減)', group: '株式・金融', desc: '損益などの数値の増減を滝のように表現します。' }
    ];

    // ==========================================
    // 2. ユーティリティ関数
    // ==========================================

    const excelSerialToDateString = (serial) => {
      if (typeof serial !== 'number' || serial < 20000 || serial > 60000) return serial;
      try {
        const utc_days = Math.floor(serial - 25569);
        const d = new Date(utc_days * 86400 * 1000);
        if (isNaN(d.getTime())) return serial;
        return d.toISOString().split('T')[0];
      } catch(e) { return serial; }
    };

    const smartFormatDate = (val, header = "") => {
      if (val === undefined || val === null || val === "") return "";
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (typeof val === 'number') {
        const dateKeywords = ["日付", "日", "date", "day", "年", "year", "月", "month"];
        if (dateKeywords.some(kw => header.toLowerCase().includes(kw)) || (val > 40000 && val < 50000)) {
          const res = excelSerialToDateString(val);
          if (typeof res === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(res)) return res;
        }
      }
      if (/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(s) || /^\d{4}年\d{1,2}月\d{1,2}日$/.test(s)) {
        const clean = s.replace(/年|月/g, '-').replace(/日/g, '').replace(/\//g, '-').replace(/\./g, '-');
        const d = new Date(clean);
        return isNaN(d.getTime()) ? s : d.toISOString().split('T')[0];
      }
      return s;
    };

    const analyzeColumns = (data) => {
      if(!data || data.length === 0) return { numeric: [], categorical: [], date: [], all: [] };
      const keys = Object.keys(data[0]);
      const num = [], cat = [], dt = [];
      const dateKeywords = ["日付", "日", "date", "day", "年", "year", "月", "month", "調査日"];
      keys.forEach(k => {
        let nC = 0, vC = 0, dC = 0;
        for(let i = 0; i < Math.min(data.length, 50); i++) {
          const v = data[i][k];
          if(v !== undefined && v !== null && v !== '') {
            vC++;
            const fmt = smartFormatDate(v, k);
            if (/^\d{4}-\d{2}-\d{2}$/.test(fmt)) dC++;
            else if (!isNaN(Number(v))) nC++;
          }
        }
        if (vC > 0) {
          if (dC / vC > 0.4 || (dateKeywords.some(kw => k.toLowerCase().includes(kw)) && dC > 0)) dt.push(k);
          else if (nC / vC > 0.7) num.push(k);
          else cat.push(k);
        }
      });
      return { numeric: num, categorical: cat, date: dt, all: keys };
    };

    const callGemini = async (prompt) => {
      const apiKey = localStorage.getItem('gemini_api_key');
      let aiModel = localStorage.getItem('gemini_api_model') || 'gemini-2.5-flash';
      
      if (aiModel.includes('1.5') || aiModel === 'gemini-pro') {
        aiModel = 'gemini-2.5-flash';
        localStorage.setItem('gemini_api_model', aiModel);
      }
      
      if (!apiKey) {
        throw new Error("APIキーが設定されていません。右上の「API設定」からGemini APIキーを登録してください。");
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${aiModel}:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "あなたはプロの金融・データアナリストです。提供された実際の集計データや統計量に基づいて、主要な傾向や示唆を日本語で提供してください。一般的な説明は避け、必ず具体的な「数値（平均、変動率、差分など）」を引用し、推測ではなくデータに基づいた実践的な洞察を、箇条書きと太字を活用して分かりやすく記述してください。" }] }
      };
      
      let delay = 1000;
      let lastErrorMsg = "";
      for (let attempt = 1; attempt <= 3; attempt++) {
          try {
              const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
              if (!response.ok) {
                  let errDetail = "";
                  try {
                      const errObj = await response.json();
                      errDetail = errObj.error?.message || JSON.stringify(errObj);
                  } catch(e) {}
                  throw new Error(`APIエラー (${response.status}): ${errDetail}`);
              }
              const result = await response.json();
              if (result.candidates && result.candidates[0]?.content?.parts?.[0]?.text) {
                  return result.candidates[0].content.parts[0].text;
              } else {
                  throw new Error("AIから有効なテキストが返却されませんでした。");
              }
          } catch (error) {
              lastErrorMsg = error.message;
              if (attempt === 3 || error.message.includes("APIエラー (400)") || error.message.includes("APIエラー (403)")) {
                  throw new Error(lastErrorMsg);
              }
              await new Promise(resolve => setTimeout(resolve, delay));
              delay *= 2;
          }
      }
      throw new Error(`AI分析失敗: ${lastErrorMsg}`);
    };

    // ==========================================
    // 3. UIコンポーネント & アイコン
    // ==========================================

    const SvgIcon = ({ d, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d={d} /></svg>
    );

    const Icons = {
      Upload: (p) => <SvgIcon d="M16 16l-4-4-4 4 M12 12v9 M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" {...p}/>,
      Sheet: (p) => <SvgIcon d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z M14 2v6h6 M8 13h2 M8 17h2 M14 13h2 M14 17h2" {...p}/>,
      Play: (p) => <SvgIcon d="M5 3l14 9-14 9V3z" {...p}/>,
      Info: (p) => <SvgIcon d="M12 12m-10 0a10 10 0 1 0 20 0 10 10 0 1 0-20 0 M12 16v-4 M12 8h.01" {...p}/>,
      Alert: (p) => <SvgIcon d="M12 12m-10 0a10 10 0 1 0 20 0 10 10 0 1 0-20 0 M12 8v4 M12 16h.01" {...p}/>,
      Left: (p) => <SvgIcon d="M19 12H5 M12 19l-7-7 7-7" {...p}/>,
      Plus: (p) => <SvgIcon d="M12 5v14 M5 12h14" {...p}/>,
      Trash: (p) => <SvgIcon d="M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" {...p}/>,
      Table: (p) => <SvgIcon d="M3 3h18v18H3z M3 9h18 M3 15h18 M9 3v18 M15 3v18" {...p}/>,
      Chart: (p) => <SvgIcon d="M18 20V10 M12 20V4 M6 20v-6" {...p}/>,
      X: (p) => <SvgIcon d="M18 6L6 18 M6 6l12 12" {...p}/>,
      Sparkles: (p) => <SvgIcon d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z" {...p}/>,
      Send: (p) => <SvgIcon d="M22 2L11 13 M22 2l-7 20-4-9-9-4 20-7z" {...p}/>,
      Transpose: (p) => <SvgIcon d="M17 1l4 4-4 4 M3 5h18 M11 13l-4 4 4 4 M21 17H3" {...p}/>,
      Download: (p) => <SvgIcon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3" {...p}/>,
      Key: (p) => <SvgIcon d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" {...p}/>,
      History: (p) => <SvgIcon d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" {...p}/>
    };

    const AxisOptions = ({ cols }) => (
      <Fragment>
        <optgroup label="日付ベース集計 (拡張)">{cols.dateExtended.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
        <optgroup label="カテゴリー列">{cols.categorical.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
        <optgroup label="数値データ列">{cols.numeric.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
        <optgroup label="生の日付列">{cols.date.map(c => <option key={c} value={c}>{c}</option>)}</optgroup>
      </Fragment>
    );

    const AnalysisDescription = ({ typeId }) => {
      const info = ANALYSIS_TYPES.find(t => t.id === typeId);
      if (!info) return null;
      return (
        <div className="bg-blue-50/50 border border-blue-100 rounded-lg p-4 mb-5 shadow-sm animate-in text-slate-700">
          <h4 className="font-bold text-blue-800 flex items-center mb-1"><Icons.Info className="w-4 h-4 mr-1.5" />{info.name.split('. ')[1]}</h4>
          <p className="text-xs mb-2 leading-relaxed">{info.desc}</p>
        </div>
      );
    };

    // ==========================================
    // 4. モーダル: API設定
    // ==========================================
    const SettingsModal = ({ isOpen, onClose }) => {
      const [apiKey, setApiKey] = useState('');
      const [aiModel, setAiModel] = useState('gemini-2.5-flash');
      
      useEffect(() => { 
        if(isOpen) {
          setApiKey(localStorage.getItem('gemini_api_key') || ''); 
          let savedModel = localStorage.getItem('gemini_api_model') || 'gemini-2.5-flash';
          if (savedModel.includes('1.5') || savedModel === 'gemini-pro') savedModel = 'gemini-2.5-flash';
          setAiModel(savedModel);
        }
      }, [isOpen]);
      
      const handleSave = () => { 
        localStorage.setItem('gemini_api_key', apiKey.trim()); 
        localStorage.setItem('gemini_api_model', aiModel.trim() || 'gemini-2.5-flash'); 
        onClose(); 
      };

      if(!isOpen) return null;
      
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-overlay animate-in">
          <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div className="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
              <h3 className="font-bold text-slate-800 flex items-center"><Icons.Key className="w-5 h-5 mr-2 text-blue-600"/> APIキー設定</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 transition-colors"><Icons.X className="w-5 h-5"/></button>
            </div>
            <div className="p-6">
              <p className="text-xs text-slate-500 mb-4 leading-relaxed">
                AIアナリスト機能を利用するには、<a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline font-bold">Google AI Studio</a>で取得したAPIキーを設定してください。<br/>
                ※入力したキーはお使いのブラウザ(ローカル)にのみ保存され、外部に送信されることはありません。
              </p>
              
              <label className="block text-sm font-bold text-slate-700 mb-2">Gemini API Key</label>
              <input 
                type="password" 
                value={apiKey} 
                onChange={e=>setApiKey(e.target.value)} 
                placeholder="AIzaSy..." 
                className="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none mb-4 font-mono shadow-inner" 
              />
              
              <label className="block text-sm font-bold text-slate-700 mb-2">AI モデル名</label>
              <select 
                value={aiModel} 
                onChange={e=>setAiModel(e.target.value)} 
                className="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-600 outline-none mb-6 font-mono shadow-inner bg-white cursor-pointer" 
              >
                <option value="gemini-2.5-flash">gemini-2.5-flash (最新・推奨)</option>
                <option value="gemini-2.0-flash">gemini-2.0-flash (安定版)</option>
                <option value="gemini-2.5-pro">gemini-2.5-pro (高性能)</option>
              </select>

              <div className="flex justify-end space-x-3">
                <button onClick={onClose} className="px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">閉じる</button>
                <button onClick={handleSave} className="px-4 py-2 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors shadow-sm">保存する</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ==========================================
    // 5. メイン分析パネル コンポーネント
    // ==========================================

    const AnalysisPanel = ({ processedData, cols, gridData }) => {
      const [analysisType, setAnalysisType] = useState('summary');
      
      const [xAxis, setXAxis] = useState('');
      const [xAxisChk, setXAxisChk] = useState([]); // カテゴリ複数選択用
      
      const [yAxis, setYAxis] = useState('');
      const [yAxisChk, setYAxisChk] = useState([]); // 数値複数選択用
      
      const [bins, setBins] = useState(20);
      const [noDataMsg, setNoDataMsg] = useState('');
      const [summaryData, setSummaryData] = useState(null);
      const [chartDataForAI, setChartDataForAI] = useState(null);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [showExportMenu, setShowExportMenu] = useState(false);
      const [aiLoading, setAiLoading] = useState(false);
      const [chatHistory, setChatHistory] = useState([]);
      const [userInput, setUserInput] = useState("");
      
      // --- AI履歴保存用のState ---
      const [savedReports, setSavedReports] = useState([]);
      const [currentSessionId, setCurrentSessionId] = useState(null);
      const [currentReportTitle, setCurrentReportTitle] = useState("");
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      
      const chatEndRef = useRef(null);
      const modalScrollRef = useRef(null);

      // --- 期間フィルター用State ---
      const [dateFilterCol, setDateFilterCol] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');

      const typeInfo = useMemo(() => ANALYSIS_TYPES.find(t => t.id === analysisType), [analysisType]);

      // 履歴のロード
      useEffect(() => {
        try {
          const loaded = JSON.parse(localStorage.getItem('universal_analyzer_ai_reports') || '[]');
          setSavedReports(loaded);
        } catch (e) {}
      }, []);

      // 履歴のセーブ
      useEffect(() => {
        if (currentSessionId && chatHistory.length > 0) {
          setSavedReports(prev => {
            const existing = [...prev];
            const idx = existing.findIndex(r => r.id === currentSessionId);
            const reportObj = {
              id: currentSessionId,
              title: currentReportTitle,
              date: new Date().toLocaleString(),
              history: chatHistory
            };
            if (idx >= 0) { existing[idx] = reportObj; } 
            else { existing.unshift(reportObj); }
            const limited = existing.slice(0, 30);
            localStorage.setItem('universal_analyzer_ai_reports', JSON.stringify(limited));
            return limited;
          });
        }
      }, [chatHistory, currentSessionId, currentReportTitle]);

      const handleDateColChange = (col) => {
        setDateFilterCol(col);
        if (!col) return;
        let min = '9999-12-31', max = '0000-01-01';
        processedData.forEach(d => {
          let v = d[col];
          if (v && typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
            if (v < min) min = v;
            if (v > max) max = v;
          }
        });
        setStartDate(min !== '9999-12-31' ? min : '');
        setEndDate(max !== '0000-01-01' ? max : '');
      };

      useEffect(() => {
        if (cols.date && cols.date.length > 0 && !dateFilterCol) {
          handleDateColChange(cols.date[0]);
        }
      }, [cols.date]);

      const filteredData = useMemo(() => {
        if (!dateFilterCol || (!startDate && !endDate)) return processedData;
        return processedData.filter(d => {
          const v = d[dateFilterCol];
          if (!v || typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return true;
          if (startDate && v < startDate) return false;
          if (endDate && v > endDate) return false;
          return true;
        });
      }, [processedData, dateFilterCol, startDate, endDate]);

      // 項目初期化
      useEffect(() => {
        if (!cols.all.length) return;
        const c1 = cols.dateExtended[0] || cols.categorical[0] || cols.all[0];
        const n1 = cols.numeric[0] || cols.all[0];
        setXAxis(c1); 
        setXAxisChk([c1]);
        setYAxis(n1); 
        setYAxisChk(cols.numeric.length ? cols.numeric.slice(0, 3) : [cols.all[0]]);
      }, [cols.all]);

      const toNum = (v) => { const n = Number(v); return isNaN(n) || v === null || v === '' ? null : n; };

      // 複数カテゴリによる階層データ生成用 (Treemap, Sunburst)
      const buildHierarchy = (data, catKeys, valKey) => {
        let labels = [], parents = [], values = [], ids = [];
        let agg = {};
        data.forEach(d => {
            let path = catKeys.map(k => String(d[k] || '不明'));
            let v = valKey ? (toNum(d[valKey]) || 0) : 1;
            let currentPath = "";
            path.forEach((p, i) => {
                let parentPath = currentPath;
                currentPath = currentPath ? currentPath + " - " + p : p;
                if (!agg[currentPath]) agg[currentPath] = { label: p, parent: parentPath, value: 0 };
                agg[currentPath].value += v;
            });
        });
        Object.keys(agg).forEach(id => {
            ids.push(id); labels.push(agg[id].label); parents.push(agg[id].parent); values.push(agg[id].value);
        });
        return { ids, labels, parents, values };
      };

      const runAnalysis = () => {
        setNoDataMsg(''); setSummaryData(null); setChartDataForAI(null);
        const chartArea = document.getElementById('chart-area');
        if (chartArea && window.Plotly) window.Plotly.purge(chartArea);

        if (filteredData.length === 0) {
           setNoDataMsg('指定された期間に該当するデータが存在しません。');
           return;
        }

        let extractedDataForAI = null;

        try {
          switch (analysisType) {
            case 'summary': {
              let res = yAxisChk.map(c => {
                let vls = filteredData.map(d => toNum(d[c])).filter(v => v !== null).sort((a,b)=>a-b);
                if (!vls.length) return null;
                return { col: c, count: vls.length, mean: vls.reduce((a,b)=>a+b,0)/vls.length, min: vls[0], median: vls[Math.floor(vls.length/2)], max: vls[vls.length-1] };
              }).filter(Boolean);
              setSummaryData(res);
              extractedDataForAI = res;
              break;
            }
            case 'timeseries': {
              let sorted = [...filteredData].sort((a,b) => a[xAxis] < b[xAxis] ? -1 : 1);
              let traces = yAxisChk.map(c => ({ x: sorted.map(d=>d[xAxis]), y: sorted.map(d=>toNum(d[c])), type: 'scatter', mode: 'lines+markers', name: c }));
              window.Plotly.newPlot('chart-area', traces, { margin: {t:40}, autosize: true }, {responsive:true});
              extractedDataForAI = traces.map(t => ({ name: t.name, data_points: t.x.length, min_y: Math.min(...t.y.filter(v=>v!==null)), max_y: Math.max(...t.y.filter(v=>v!==null)) }));
              break;
            }
            case 'candlestick': {
              if (yAxisChk.length < 4) throw new Error('ローソク足を描画するには、分析対象(数値)で「始値」「高値」「安値」「終値」の順に4つの項目を選択してください。');
              let sorted = [...filteredData].sort((a,b) => a[xAxis] < b[xAxis] ? -1 : 1);
              let trace = {
                x: sorted.map(d => d[xAxis]),
                open: sorted.map(d => toNum(d[yAxisChk[0]])),
                high: sorted.map(d => toNum(d[yAxisChk[1]])),
                low: sorted.map(d => toNum(d[yAxisChk[2]])),
                close: sorted.map(d => toNum(d[yAxisChk[3]])),
                type: 'candlestick',
                xaxis: 'x', yaxis: 'y'
              };
              window.Plotly.newPlot('chart-area', [trace], { margin: {t:40}, xaxis: {rangeslider: {visible: false}} }, {responsive:true});
              extractedDataForAI = { type: 'candlestick', data_points: sorted.length, metrics: yAxisChk.slice(0,4) };
              break;
            }
            case 'normalized_line': {
              let sorted = [...filteredData].sort((a,b) => a[xAxis] < b[xAxis] ? -1 : 1);
              let traces = yAxisChk.map(c => {
                let yVals = sorted.map(d => toNum(d[c]));
                let firstVal = yVals.find(v => v !== null && v !== 0);
                let normY = yVals.map(v => (v !== null && firstVal) ? (v / firstVal) * 100 : null);
                return { x: sorted.map(d=>d[xAxis]), y: normY, type: 'scatter', mode: 'lines', name: c };
              });
              window.Plotly.newPlot('chart-area', traces, { margin: {t:40} }, {responsive:true});
              extractedDataForAI = { type: 'normalized', count: sorted.length };
              break;
            }
            case 'waterfall': {
              if(yAxisChk.length === 0) throw new Error("数値を1つ以上選択してください");
              let trace = {
                type: "waterfall",
                x: filteredData.map(d => d[xAxis]),
                y: filteredData.map(d => toNum(d[yAxisChk[0]])),
                connector: { line: { color: "rgb(63, 63, 63)" } },
              };
              window.Plotly.newPlot('chart-area', [trace], { margin: {t:40} }, {responsive:true});
              break;
            }
            case 'sunburst':
            case 'treemap': {
              if (xAxisChk.length === 0) throw new Error('階層/カテゴリを1つ以上選択してください。');
              let { ids, labels, parents, values } = buildHierarchy(filteredData, xAxisChk, yAxisChk[0]);
              window.Plotly.newPlot('chart-area', [{ 
                  type: analysisType, 
                  ids, labels, parents, values, 
                  branchvalues: "total"
              }], {margin:{t:40, l:0, r:0, b:0}}, {responsive:true});
              extractedDataForAI = { type: analysisType, categories_count: labels.length };
              break;
            }
            case 'comparison':
            case 'stackedbar': {
              let g = {}; filteredData.forEach(r => {
                let k = String(r[xAxis] || '不明'); if(!g[k]) { g[k]={c:0, s:{}}; yAxisChk.forEach(y=>g[k].s[y]=0); }
                yAxisChk.forEach(y => { let v=toNum(r[y]); if(v!==null) g[k].s[y]+=v; }); g[k].c++;
              });
              let ks = Object.keys(g).sort();
              let traces = yAxisChk.map(y => ({ x: ks, y: ks.map(k=>g[k].c>0 ? g[k].s[y]/g[k].c : 0), type: 'bar', name: y }));
              window.Plotly.newPlot('chart-area', traces, { margin: {t:40}, barmode: analysisType==='stackedbar'?'stack':'group' }, {responsive:true});
              extractedDataForAI = traces.map(t => ({ name: t.name, categories: t.x, values: t.y }));
              break;
            }
            case 'boxplot':
            case 'violin':
            case 'stripplot': {
              let g = {}; filteredData.forEach(r => { let k=String(r[xAxis]||'不明'), v=toNum(r[yAxis]); if(v!==null){ if(!g[k])g[k]=[]; g[k].push(v); }});
              let traces = Object.keys(g).sort().map(k => ({ y: g[k], name: k, type: analysisType==='violin'?'violin':'box', boxpoints: analysisType==='stripplot'?'all':'outliers' }));
              window.Plotly.newPlot('chart-area', traces, { margin: {t:40} }, {responsive:true});
              break;
            }
            case 'correlation': {
              let z = yAxisChk.map(c1 => yAxisChk.map(c2 => {
                let x=[], y=[]; filteredData.forEach(d=>{ let v1=toNum(d[c1]), v2=toNum(d[c2]); if(v1!==null && v2!==null){ x.push(v1); y.push(v2); }});
                if(!x.length) return 0;
                let n=x.length, sx=x.reduce((a,b)=>a+b,0), sy=y.reduce((a,b)=>a+b,0), sxy=x.reduce((a,v,i)=>a+v*y[i],0), sx2=x.reduce((a,v)=>a+v*v,0), sy2=y.reduce((a,v)=>a+v*v,0);
                let nm = n*sxy-sx*sy, dn = Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));
                return dn===0?0:nm/dn;
              }));
              window.Plotly.newPlot('chart-area', [{ z, x: yAxisChk, y: yAxisChk, type: 'heatmap', colorscale: 'RdBu' }], { margin: {t:40} }, {responsive:true});
              extractedDataForAI = { x: yAxisChk, y: yAxisChk, z_matrix: z };
              break;
            }
            default: {
                let traces = [{ x: filteredData.map(d=>toNum(d[xAxis])), y: filteredData.map(d=>toNum(d[yAxis])), mode: 'markers', type: analysisType==='scatter3d' ? 'scatter3d' : 'scatter' }];
                window.Plotly.newPlot('chart-area', traces, { margin: {t:40} }, {responsive:true});
            }
          }
          
          if (!extractedDataForAI) {
              extractedDataForAI = filteredData.slice(0, 50).map(d => {
                  let obj = {}; 
                  if (typeInfo?.needsMultiX) { xAxisChk.forEach(x => obj[x] = d[x]); } else { obj[xAxis] = d[xAxis]; }
                  yAxisChk.forEach(y => obj[y] = d[y]); 
                  return obj;
              });
          }
          setChartDataForAI(extractedDataForAI);

        } catch (e) { setNoDataMsg(e.message); }
      };

      const handleAIAnalysis = async () => {
        setIsModalOpen(true);
        setAiLoading(true);
        setChatHistory([]);
        setShowExportMenu(false);
        
        const newSessionId = Date.now();
        setCurrentSessionId(newSessionId);
        const titleSuffix = yAxisChk.length > 0 ? ` (${yAxisChk.slice(0,2).join(', ')}${yAxisChk.length > 2 ? '...' : ''})` : '';
        const reportTitle = `${typeInfo ? typeInfo.name.split('. ')[1] : 'データ分析'}${titleSuffix}`;
        setCurrentReportTitle(reportTitle);
        
        let dataStr = "";
        if (chartDataForAI) {
            try {
                dataStr = JSON.stringify(chartDataForAI);
                if (dataStr.length > 20000) dataStr = dataStr.substring(0, 20000) + "...(省略)";
            } catch(e) {}
        }

        let overallStats = yAxisChk.map(c => {
          let vls = filteredData.map(d => toNum(d[c])).filter(v => v !== null).sort((a,b)=>a-b);
          if (!vls.length) return null;
          return { 
            "列名": c, 
            "有効データ数": vls.length, 
            "平均値": Number((vls.reduce((a,b)=>a+b,0)/vls.length).toFixed(2)), 
            "最小値": vls[0], 
            "中央値": vls[Math.floor(vls.length/2)], 
            "最大値": vls[vls.length-1] 
          };
        }).filter(Boolean);
        
        let statsStr = JSON.stringify(overallStats);
        let dateFilterInfo = dateFilterCol ? `\n期間指定: ${dateFilterCol} (${startDate || '指定なし'} 〜 ${endDate || '指定なし'})` : '';
        let currentXAxisInfo = typeInfo?.needsMultiX ? xAxisChk.join(", ") : xAxis;

        let aiPrompt = `【分析条件】\n分析手法: ${analysisType}\nX軸(カテゴリ): ${currentXAxisInfo}\nY軸(数値): ${yAxisChk.join(", ")}\n対象データ件数: ${filteredData.length}${dateFilterInfo}\n\n【対象項目の基本統計量】\n${statsStr}\n\n【グラフ表示用の集計・サンプリングデータ】\n${dataStr}\n\n上記データと条件に基づいて、データから読み取れる主要な傾向や示唆を日本語で提供してください。必ず「基本統計量」や「集計データ」の実際の数値を引用して具体的に分析してください。`;
        
        try {
          const res = await callGemini(aiPrompt);
          setChatHistory([{ role: "assistant", text: res }]);
        } catch (e) {
          setChatHistory([{ role: "assistant", text: e.message || "AI分析中にエラーが発生しました。" }]);
        } finally { 
          setAiLoading(false); 
          setTimeout(() => {
            if (modalScrollRef.current) modalScrollRef.current.scrollTo({ top: 0, behavior: 'smooth' });
          }, 100);
        }
      };

      const askAI = async () => {
        if (!userInput.trim()) return;
        const msg = userInput; setUserInput("");
        setChatHistory(p => [...p, { role: "user", text: msg }]);
        setAiLoading(true);
        setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);

        try {
          const res = await callGemini(`文脈を踏まえて質問に答えてください: ${msg}`);
          setChatHistory(p => [...p, { role: "assistant", text: res }]);
        } catch (e) {
          setChatHistory(p => [...p, { role: "assistant", text: e.message || "エラーが発生しました。" }]);
        } finally { 
          setAiLoading(false); 
          setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
        }
      };

      const downloadBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const exportResult = (format) => {
        setShowExportMenu(false);
        if (chatHistory.length === 0) return;
        
        const dateStr = new Date().toISOString().split('T')[0];
        const filename = `AI_Analysis_Report_${dateStr}`;
        
        if (format === 'md') {
          let content = `# データ分析レポート\n生成日時: ${new Date().toLocaleString()}\n\n`;
          content += chatHistory.map(m => `### ${m.role === 'user' ? '👤 ユーザーの質問' : '✨ AIによる分析'}\n${m.text}\n`).join('\n---\n\n');
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
          downloadBlob(blob, `${filename}.md`);
        } 
        else if (format === 'txt') {
          let content = `データ分析レポート\n生成日時: ${new Date().toLocaleString()}\n\n`;
          content += chatHistory.map(m => `[${m.role === 'user' ? 'ユーザーの質問' : 'AIによる分析'}]\n${m.text.replace(/\*\*(.*?)\*\*/g, '$1')}\n`).join('\n------------------------\n\n');
          const blob = new Blob([content], { type: 'text/plain;charset=utf-8;' });
          downloadBlob(blob, `${filename}.txt`);
        } 
        else if (format === 'doc') {
          const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Report</title></head><body>";
          const footer = "</body></html>";
          const htmlContent = `<h1>データ分析レポート</h1><p style="color:#666;">生成日時: ${new Date().toLocaleString()}</p><hr>` + 
            chatHistory.map(m => `<h3>${m.role === 'user' ? 'ユーザーの質問' : 'AIによる分析'}</h3><div>${m.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}</div>`).join('<hr>');
          const blob = new Blob(['\ufeff', header + htmlContent + footer], { type: 'application/msword' });
          downloadBlob(blob, `${filename}.doc`);
        } 
        else if (format === 'pdf') {
          if (!window.html2pdf) {
            alert('PDF生成ライブラリを読み込み中です。数秒待ってから再度お試しください。');
            return;
          }
          const element = document.createElement('div');
          element.innerHTML = `
            <div style="font-family: sans-serif; padding: 20px;">
              <h2 style="color: #1e293b;">データ分析レポート</h2>
              <p style="color: #64748b; font-size: 12px;">生成日時: ${new Date().toLocaleString()}</p>
              <hr style="border: none; border-top: 1px solid #cbd5e1; margin: 20px 0;" />
              ${chatHistory.map(m => `
                <div style="margin-bottom: 20px;">
                  <h4 style="color: ${m.role === 'user' ? '#475569' : '#3b82f6'}; margin-bottom: 10px;">
                    ${m.role === 'user' ? '👤 ユーザーの質問' : '✨ AIによる分析'}
                  </h4>
                  <div style="font-size: 14px; line-height: 1.6; color: #334155;">
                    ${m.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}
                  </div>
                </div>
              `).join('<hr style="border: none; border-top: 1px dashed #e2e8f0; margin: 20px 0;" />')}
            </div>
          `;
          const opt = {
            margin:       15,
            filename:     `${filename}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };
          window.html2pdf().set(opt).from(element).save();
        }
      };

      return (
        <div className="flex h-full overflow-hidden relative">
          <div className="w-80 border-r p-5 overflow-y-auto bg-slate-50 shrink-0 custom-scrollbar">
            <label className="block text-sm font-bold text-slate-700 mb-2">分析手法の選択</label>
            <select value={analysisType} onChange={e => setAnalysisType(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg p-2 bg-white mb-4 outline-none">
              {['基礎', '推移・傾向', '比較', '分布', '関係性', '構成比', '高度な分析', '株式・金融'].map(g => (
                <optgroup key={g} label={`--- ${g} ---`}>
                  {ANALYSIS_TYPES.filter(t => t.group === g).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                </optgroup>
              ))}
            </select>
            <AnalysisDescription typeId={analysisType} />

            {cols.date && cols.date.length > 0 && (
              <div className="mb-4 bg-white p-3 rounded-lg border border-slate-200 shadow-sm animate-in">
                <label className="block text-xs font-bold text-slate-500 mb-2 flex items-center"><Icons.Table className="w-3 h-3 mr-1" /> 期間フィルター</label>
                <select value={dateFilterCol} onChange={e => handleDateColChange(e.target.value)} className="w-full text-xs border border-slate-300 rounded p-1.5 mb-2 bg-slate-50 outline-none text-slate-700 font-bold">
                  {cols.date.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <div className="flex items-center space-x-1">
                  <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full text-xs border border-slate-300 rounded p-1.5 outline-none text-slate-700 bg-white" />
                  <span className="text-slate-400 text-xs font-bold">〜</span>
                  <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full text-xs border border-slate-300 rounded p-1.5 outline-none text-slate-700 bg-white" />
                </div>
              </div>
            )}

            <div className="space-y-4">
              
              {/* --- X軸 (単一 または 複数選択) の切り替え表示 --- */}
              {typeInfo?.needsMultiX ? (
                <div>
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-tight">階層/カテゴリ (複数選択)</label>
                    <button onClick={()=>setXAxisChk([])} className="text-[9px] bg-slate-100 text-slate-500 px-1 py-0.5 rounded font-bold">クリア</button>
                  </div>
                  <div className="max-h-32 overflow-y-auto border rounded-lg p-2 bg-white shadow-inner custom-scrollbar">
                    {cols.allExtended.map(c => (
                      <label key={c} className="flex items-center space-x-2 p-1 hover:bg-slate-50 cursor-pointer text-xs">
                        <input type="checkbox" checked={xAxisChk.includes(c)} onChange={()=>setXAxisChk(p=>p.includes(c)?p.filter(x=>x!==c):[...p,c])} className="rounded text-blue-600" />
                        <span className="truncate font-medium text-slate-700">{c}</span>
                      </label>
                    ))}
                  </div>
                </div>
              ) : (
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">軸 / カテゴリ</label>
                  <select value={xAxis} onChange={e=>setXAxis(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg p-2 bg-white outline-none shadow-sm"><AxisOptions cols={cols}/></select>
                </div>
              )}

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="text-xs font-bold text-slate-500 uppercase tracking-tight">分析対象 (数値)</label>
                  <div className="flex space-x-1">
                    <button onClick={()=>setYAxisChk(cols.allExtended)} className="text-[9px] bg-blue-50 text-blue-600 px-1 py-0.5 rounded font-bold">全て選択</button>
                    <button onClick={()=>setYAxisChk([])} className="text-[9px] bg-slate-100 text-slate-500 px-1 py-0.5 rounded font-bold">クリア</button>
                  </div>
                </div>
                <div className="max-h-40 overflow-y-auto border rounded-lg p-2 bg-white shadow-inner custom-scrollbar">
                  {cols.allExtended.map(c => (
                    <label key={c} className="flex items-center space-x-2 p-1 hover:bg-slate-50 cursor-pointer text-xs">
                      <input type="checkbox" checked={yAxisChk.includes(c)} onChange={()=>setYAxisChk(p=>p.includes(c)?p.filter(x=>x!==c):[...p,c])} className="rounded text-blue-600" />
                      <span className="truncate font-medium text-slate-700">{c}</span>
                    </label>
                  ))}
                </div>
              </div>
            </div>
            <button onClick={runAnalysis} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 mt-6 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center">
              <Icons.Play className="w-4 h-4 mr-2" /> 分析を実行
            </button>
          </div>

          <div className="flex-1 flex flex-col min-w-0 bg-white p-6 overflow-auto">
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 min-h-[500px] flex flex-col">
              <div className="flex justify-between items-center mb-6 border-b pb-3">
                <h2 className="font-bold text-slate-800 text-lg">可視化結果</h2>
                <div className="flex space-x-2">
                  <button onClick={() => setShowHistoryModal(true)} className="bg-white text-slate-600 hover:bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-sm font-bold flex items-center transition-all shadow-sm">
                    <Icons.History className="w-4 h-4 mr-2" /> 履歴を見る ({savedReports.length})
                  </button>
                  <button onClick={handleAIAnalysis} className="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center transition-all shadow-sm border border-indigo-100">
                    <Icons.Sparkles className="w-4 h-4 mr-2" /> 新規AI分析を実行
                  </button>
                </div>
              </div>

              {noDataMsg && <div className="bg-red-50 text-red-600 p-4 rounded-lg border font-bold text-sm mb-4"><Icons.Alert className="w-4 h-4 mr-2 inline" />{noDataMsg}</div>}
              <div id="chart-area" className={`flex-1 w-full min-h-[400px] ${summaryData ? 'hidden' : ''}`}></div>
              
              {summaryData && (
                <div className="overflow-x-auto rounded-xl border animate-in"><table className="min-w-full text-sm text-right whitespace-nowrap"><thead className="bg-slate-50 text-slate-600 font-bold border-b"><tr><th className="px-4 py-3 text-left">項目名</th><th>数</th><th>平均</th><th>最小</th><th>中央</th><th>最大</th></tr></thead>
                  <tbody className="bg-white divide-y">{summaryData.map(r => (<tr key={r.col} className="hover:bg-slate-50"><td className="px-4 py-3 font-bold text-slate-800 text-left">{r.col}</td><td>{r.count}</td><td className="font-bold text-blue-600">{r.mean.toFixed(2)}</td><td>{r.min}</td><td>{r.median}</td><td>{r.max}</td></tr>))}</tbody></table></div>
              )}
            </div>
          </div>

          {/* AI分析結果 モーダル */}
          {isModalOpen && (
            <div className="fixed inset-0 z-[50] flex items-center justify-center p-4 modal-overlay animate-in">
              <div className="bg-white w-full max-w-4xl rounded-3xl shadow-2xl flex flex-col h-[85vh] overflow-hidden border border-white/20 relative">
                <div className="bg-indigo-900 px-6 py-4 flex items-center justify-between text-white relative z-20 shadow-sm">
                  <div className="flex items-center space-x-2 font-bold"><Icons.Sparkles className="w-5 h-5 text-indigo-300" /><span>AI データアドバイザー</span></div>
                  <div className="flex items-center space-x-3">
                    <div className="relative">
                      <button onClick={() => setShowExportMenu(!showExportMenu)} disabled={chatHistory.length === 0 || aiLoading} className="bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center disabled:opacity-50">
                        <Icons.Download className="w-3.5 h-3.5 mr-1" /> 出力
                      </button>
                      {showExportMenu && (
                        <div className="absolute right-0 top-full mt-2 w-48 bg-white rounded-xl shadow-xl overflow-hidden text-slate-800 border border-slate-100 py-1 z-50 animate-in">
                          <button onClick={() => exportResult('md')} className="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 font-medium">Markdown (.md)</button>
                          <button onClick={() => exportResult('txt')} className="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 font-medium">テキスト (.txt)</button>
                          <button onClick={() => exportResult('doc')} className="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 font-medium">Word (.doc)</button>
                          <button onClick={() => exportResult('pdf')} className="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 font-medium text-red-600">PDF (.pdf)</button>
                        </div>
                      )}
                    </div>
                    <button onClick={() => setIsModalOpen(false)} className="hover:bg-white/20 p-1 rounded-full transition-all"><Icons.X className="w-6 h-6" /></button>
                  </div>
                </div>
                
                <div ref={modalScrollRef} className="flex-1 overflow-y-auto p-6 space-y-5 bg-slate-50 custom-scrollbar relative z-10" onClick={() => setShowExportMenu(false)}>
                  {aiLoading && chatHistory.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-slate-400 space-y-4"><div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div><p className="font-bold text-slate-600">AIがデータを解析しています...</p></div>
                  ) : (
                    chatHistory.map((m, i) => (
                      <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[95%] px-5 py-4 rounded-2xl text-sm shadow-sm ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white border border-slate-200 text-slate-800 rounded-tl-none markdown-content'}`}>
                          {m.text.split('\n').map((t, idx) => (
                             <p key={idx} dangerouslySetInnerHTML={{ __html: t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') }}></p>
                          ))}
                        </div>
                      </div>
                    ))
                  )}
                  {aiLoading && chatHistory.length > 0 && <div className="flex justify-start"><div className="bg-white border px-4 py-2 rounded-2xl animate-pulse text-slate-400 text-xs shadow-sm">AIが入力中...</div></div>}
                  <div ref={chatEndRef} />
                </div>
                
                <div className="p-4 border-t bg-white relative z-20" onClick={() => setShowExportMenu(false)}>
                  <div className="relative flex items-center max-w-4xl mx-auto">
                    <input type="text" value={userInput} onChange={(e)=>setUserInput(e.target.value)} onKeyDown={(e)=>e.key==='Enter' && askAI()} placeholder="AIにこのデータの傾向をさらに質問する..." className="w-full pl-4 pr-12 py-3 bg-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 text-sm" />
                    <button onClick={askAI} disabled={aiLoading || !userInput.trim()} className="absolute right-2 p-2 text-indigo-600 disabled:opacity-30 transition-all"><Icons.Send className="w-5 h-5" /></button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 履歴モーダル */}
          {showHistoryModal && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay animate-in">
              <div className="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col h-[75vh] overflow-hidden border border-white/20">
                <div className="bg-slate-100 px-6 py-4 border-b flex justify-between items-center">
                  <div className="flex items-center space-x-2 font-bold text-slate-800"><Icons.History className="w-5 h-5 text-slate-500" /><span>AI分析レポートの履歴</span></div>
                  <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-600 transition-colors"><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className="p-6 overflow-y-auto flex-1 bg-slate-50 custom-scrollbar">
                  {savedReports.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-slate-400">
                      <Icons.History className="w-12 h-12 mb-3 opacity-20" /><p className="font-bold text-sm">保存された分析履歴はありません</p><p className="text-xs mt-1">AI分析を実行すると自動的にここに保存されます</p>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {savedReports.map(r => (
                        <div key={r.id} className="bg-white border border-slate-200 p-4 rounded-xl flex justify-between items-center shadow-sm hover:border-indigo-200 transition-colors group">
                          <div className="min-w-0 pr-4"><h4 className="font-bold text-slate-800 text-sm mb-1 truncate">{r.title}</h4><p className="text-xs text-slate-500">{r.date} · 💬 {r.history.length}ターンのやり取り</p></div>
                          <div className="flex space-x-2 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity md:opacity-100">
                            <button onClick={() => { setCurrentSessionId(r.id); setCurrentReportTitle(r.title); setChatHistory(r.history); setShowHistoryModal(false); setIsModalOpen(true); }} className="px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white rounded-lg text-xs font-bold transition-colors border border-indigo-100">開く</button>
                            <button onClick={() => { const updated = savedReports.filter(x => x.id !== r.id); setSavedReports(updated); localStorage.setItem('universal_analyzer_ai_reports', JSON.stringify(updated)); }} className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors border border-transparent hover:border-red-100" title="削除"><Icons.Trash className="w-4 h-4"/></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // 6. ワークスペースラッパー コンポーネント
    // ==========================================
    const AnalysisWorkspaceWrapper = ({ rawData, fileName, onReset, onOpenSettings }) => {
      const initialGrid = useMemo(() => rawData.map(r => {
        const nr = {...r}; Object.keys(nr).forEach(k => { const f = smartFormatDate(nr[k], k); if(/^\d{4}-\d{2}-\d{2}$/.test(f)) nr[k]=f; }); return nr;
      }), [rawData]);
      const [gridData, setGridData] = useState(initialGrid);
      const [viewMode, setViewMode] = useState('analysis');

      const cols = useMemo(() => {
        const c = analyzeColumns(gridData);
        const ext = [];
        gridData.forEach(row => c.date.forEach(dk => {
          const d = new Date(row[dk]); if(!isNaN(d.getTime())){
            const yk = `${dk} (年)`, ymk = `${dk} (年月)`;
            if(!ext.includes(yk)) ext.push(yk); if(!ext.includes(ymk)) ext.push(ymk);
          }
        }));
        return { ...c, dateExtended: ext, allExtended: [...c.all, ...ext] };
      }, [gridData]);

      const processedData = useMemo(() => gridData.map(r => {
        const nr = {...r}; cols.date.forEach(dk => {
          const d = new Date(r[dk]); if(!isNaN(d.getTime())){
            nr[`${dk} (年)`] = d.getFullYear() + "年";
            nr[`${dk} (年月)`] = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
          }
        }); return nr;
      }), [gridData, cols]);

      const transposeData = () => {
        if (!gridData.length) return;
        const h = Object.keys(gridData[0]), f = h[0];
        const nh = ["項目", ...gridData.map((r, i) => String(r[f] || i + 1))];
        setGridData(h.slice(1).map(k => {
          const nr = { "項目": k }; gridData.forEach((or, i) => nr[nh[i+1]] = smartFormatDate(or[k], k)); return nr;
        }));
      };

      const deleteColumn = (colKey) => {
        if (Object.keys(gridData[0] || {}).length <= 1) return;
        setGridData(prev => prev.map(row => { const newRow = { ...row }; delete newRow[colKey]; return newRow; }));
      };

      const deleteRow = (rIdx) => {
        if (gridData.length <= 1) return; 
        setGridData(prev => prev.filter((_, i) => i !== rIdx));
      };

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-slate-50">
          <header className="h-16 bg-slate-900 text-white flex items-center justify-between px-6 shrink-0 z-30">
            <div className="flex items-center space-x-4">
              <button onClick={onReset} className="p-2 hover:bg-white/10 rounded-full transition-colors"><Icons.Left className="w-5 h-5"/></button>
              <div>
                <h1 className="font-black text-xl text-blue-400 leading-none truncate max-w-[150px] sm:max-w-xs">Universal Analyzer</h1>
                <p className="text-[10px] text-slate-400 mt-1 uppercase tracking-widest truncate max-w-[150px] sm:max-w-xs">{fileName}</p>
              </div>
            </div>
            
            <div className="flex bg-slate-800 rounded-xl p-1 border border-white/10 flex-shrink-0 mx-2">
              <button onClick={() => setViewMode('analysis')} className={`flex items-center px-4 sm:px-6 py-2 rounded-lg text-sm font-bold transition-all ${viewMode === 'analysis' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                <Icons.Chart className="w-4 h-4 sm:mr-2" /> <span className="hidden sm:inline">分析</span>
              </button>
              <button onClick={() => setViewMode('editor')} className={`flex items-center px-4 sm:px-6 py-2 rounded-lg text-sm font-bold transition-all ${viewMode === 'editor' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                <Icons.Table className="w-4 h-4 sm:mr-2" /> <span className="hidden sm:inline">編集</span>
              </button>
            </div>
            
            <div className="flex items-center space-x-3">
              <div className="hidden md:block font-black text-blue-500 text-[10px] animate-pulse tracking-tighter border border-blue-500/30 px-2 py-1 rounded bg-blue-500/10">AI READY</div>
              <button onClick={onOpenSettings} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors flex items-center text-slate-300 hover:text-white text-xs font-bold border border-white/10 shadow-sm whitespace-nowrap">
                <Icons.Key className="w-4 h-4 md:mr-1.5"/> <span className="hidden md:inline">API設定</span>
              </button>
            </div>
          </header>
          <main className="flex-1 overflow-hidden">
            {viewMode === 'analysis' ? <AnalysisPanel processedData={processedData} cols={cols} gridData={gridData} /> : (
              <div className="flex flex-col h-full bg-white animate-in">
                <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                  <div className="flex items-center space-x-2 text-slate-600 font-bold"><Icons.Table className="w-5 h-5"/><span>データ編集 & 転置</span></div>
                  <div className="flex space-x-2">
                    <button onClick={transposeData} className="bg-orange-50 text-orange-600 hover:bg-orange-100 px-3 py-2 rounded-lg text-sm font-bold flex items-center border border-orange-200 transition-all"><Icons.Transpose className="w-4 h-4 mr-1" />行列を入替</button>
                    <button onClick={() => { const nr = {}; Object.keys(gridData[0]||{}).forEach(k=>nr[k]=""); setGridData([...gridData, nr]); }} className="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-2 rounded-lg text-sm font-bold flex items-center border border-emerald-200 transition-all"><Icons.Plus className="w-4 h-4 mr-1" />行追加</button>
                    <button onClick={() => { const ws = XLSX.utils.json_to_sheet(gridData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data"); XLSX.writeFile(wb, "data.xlsx"); }} className="bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold flex items-center shadow-md transition-all"><Icons.Download className="w-4 h-4 mr-1" />保存</button>
                  </div>
                </div>
                <div className="flex-1 overflow-auto custom-scrollbar">
                  <table className="min-w-full text-sm border-collapse">
                    <thead className="bg-slate-100 sticky top-0 z-20 shadow-sm">
                      <tr><th className="w-16 border-b bg-slate-100 min-w-[4rem]"></th>
                        {Object.keys(gridData[0] || {}).map(k => (
                          <th key={k} className="border border-slate-200 px-2 py-3 bg-slate-50 min-w-[150px] relative group">
                            <div className="flex items-center w-full">
                              <input type="text" defaultValue={k} onBlur={(e) => { const nk = e.target.value; if(!nk || nk===k) return; setGridData(prev => prev.map(r => { const nr = {}; Object.keys(r).forEach(x=>nr[x===k?nk:x]=r[x]); return nr; })); }} className="cell-input header-input flex-1 min-w-0 mr-1 text-left px-1" />
                              <button onClick={() => deleteColumn(k)} className="shrink-0 flex-none text-red-300 hover:text-red-600 p-1 opacity-0 group-hover:opacity-100 transition-opacity" title="この列を削除"><Icons.Trash className="w-4 h-4"/></button>
                            </div>
                          </th>
                        ))}
                        <th className="w-12 border-b bg-slate-100"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {gridData.map((row, rIdx) => (
                        <tr key={rIdx} className="hover:bg-slate-50 border-b group">
                          <td className="bg-slate-50 border-r w-16 p-0 min-w-[4rem]">
                            <div className="flex justify-between items-center px-2">
                              <button onClick={() => deleteRow(rIdx)} className="text-red-300 hover:text-red-600 p-1 opacity-0 group-hover:opacity-100 transition-opacity" title="この行を削除"><Icons.Trash className="w-4 h-4"/></button>
                              <span className="text-slate-400 font-mono text-[10px]">{rIdx + 1}</span>
                            </div>
                          </td>
                          {Object.keys(row).map(k => (
                            <td key={k} className="border-r border-slate-200 p-0">
                              {cols.date.includes(k) ? (<input type="date" value={smartFormatDate(row[k], k)} onChange={(e) => { const nd = [...gridData]; nd[rIdx][k] = e.target.value; setGridData(nd); }} className="cell-input" />) : (<input type="text" value={row[k]} onChange={(e) => { const nd = [...gridData]; nd[rIdx][k] = e.target.value; setGridData(nd); }} className="cell-input" />)}
                            </td>
                          ))}
                          <td className="text-center">
                            <button onClick={() => deleteRow(rIdx)} className="text-red-300 hover:text-red-600 p-2 opacity-0 group-hover:opacity-100 transition-opacity" title="この行を削除"><Icons.Trash className="w-4 h-4"/></button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    };

    // ==========================================
    // 7. メイン App コンポーネント
    // ==========================================
    const App = () => {
      const [data, setData] = useState([]);
      const [fileName, setFileName] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isDragging, setIsDragging] = useState(false);

      useEffect(() => {
        const handlePaste = (e) => {
          if (data.length > 0) return; 
          const clipboardData = e.clipboardData || window.clipboardData;
          if (!clipboardData) return;
          const htmlData = clipboardData.getData('text/html');
          const textData = clipboardData.getData('text/plain');
          if (!textData && !htmlData) return;
          try {
            let wb;
            if (htmlData && htmlData.includes('<table')) {
              const doc = new DOMParser().parseFromString(htmlData, 'text/html');
              const table = doc.querySelector('table');
              if (table) {
                const ws = window.XLSX.utils.table_to_sheet(table);
                wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
              } else { wb = window.XLSX.read(textData, {type: 'string'}); }
            } else if (textData) { wb = window.XLSX.read(textData, {type: 'string'}); }

            if (wb) {
               const jsonData = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
               if (jsonData.length > 0) { setData(jsonData); setFileName('ペーストされたデータ'); setErrorMsg(''); } 
               else { setErrorMsg('ペーストされたテキストからデータを抽出できませんでした。'); }
            }
          } catch (err) { setErrorMsg('ペーストされたデータの読み込みに失敗しました。'); }
        };
        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [data.length]);

      const processFile = (file) => {
        if (!file) return;
        const validExt = ['.csv', '.xlsx', '.xls'];
        if (!validExt.some(ext => file.name.toLowerCase().endsWith(ext))) { setErrorMsg('CSVまたはExcelファイル(.csv, .xlsx, .xls)を選択してください。'); return; }
        setErrorMsg(''); setFileName(file.name);
        const reader = new FileReader();
        reader.onload = (evt) => {
          try { 
            const wb = window.XLSX.read(evt.target.result, {type:'binary'}); 
            const jsonData = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            if(jsonData.length > 0) setData(jsonData); else setErrorMsg('データが見つかりませんでした。');
          } catch(err) { setErrorMsg('読み込みに失敗しました。'); }
        }; reader.readAsBinaryString(file);
      };

      if (data.length > 0) {
        return (
          <Fragment>
            <AnalysisWorkspaceWrapper rawData={data} fileName={fileName} onReset={() => setData([])} onOpenSettings={() => setIsSettingsOpen(true)} />
            <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} />
          </Fragment>
        );
      }

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-50 text-slate-800 relative">
          <div className="absolute top-4 right-4">
            <button onClick={() => setIsSettingsOpen(true)} className="flex items-center px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm font-bold shadow-sm hover:bg-slate-50 transition-colors">
              <Icons.Key className="w-4 h-4 mr-2 text-slate-500" /> API設定
            </button>
          </div>
          
          <div 
            className={`max-w-md w-full bg-white rounded-3xl shadow-2xl p-10 text-center animate-in border-4 transition-colors duration-200 ${isDragging ? 'border-blue-400 bg-blue-50' : 'border-transparent'}`}
            onDragOver={(e)=>{e.preventDefault(); e.stopPropagation(); setIsDragging(true);}}
            onDragEnter={(e)=>{e.preventDefault(); e.stopPropagation(); setIsDragging(true);}}
            onDragLeave={(e)=>{e.preventDefault(); e.stopPropagation(); setIsDragging(false);}}
            onDrop={(e)=>{e.preventDefault(); e.stopPropagation(); setIsDragging(false); if (e.dataTransfer.files && e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);}}
          >
            <div className={`w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-8 shadow-inner transition-colors duration-200 ${isDragging ? 'bg-blue-600 text-white' : 'bg-blue-100 text-blue-600'}`}>
              <Icons.Upload className="w-12 h-12" />
            </div>
            <h1 className="text-3xl font-black text-slate-900 mb-3 tracking-tighter">Data Analyzer</h1>
            <p className="text-slate-500 text-sm mb-10 leading-relaxed font-medium">
              CSV/Excelをインポートして分析を開始<br/>
              <span className="text-xs text-slate-400 mt-1 block">（ドラッグ＆ドロップ、または <strong className="font-bold text-slate-500">Ctrl+V / Cmd+V</strong> で貼り付け）</span>
            </p>
            {errorMsg && <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-bold mb-8 border border-red-100">{errorMsg}</div>}
            <div className="relative group">
              <input type="file" accept=".csv,.xlsx,.xls" onChange={e=>processFile(e.target.files[0])} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"/>
              <div className={`text-white font-black py-5 rounded-2xl shadow-xl flex items-center justify-center transition-all active:scale-95 pointer-events-none ${isDragging ? 'bg-blue-700' : 'bg-blue-600 group-hover:bg-blue-700'}`}>
                <Icons.Sheet className="w-6 h-6 mr-3" /> ファイルを選択する
              </div>
            </div>
          </div>
          <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
