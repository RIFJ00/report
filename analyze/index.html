    // ==========================================
    // 2. ユーティリティ関数
    // ==========================================

    const excelSerialToDateString = (serial) => {
      let num = Number(serial);
      if (isNaN(num) || num < 10000 || num > 90000) return serial;
      try {
        const utc_days = Math.floor(num - 25569);
        const d = new Date(utc_days * 86400 * 1000);
        if (isNaN(d.getTime())) return serial;
        return d.toISOString().split('T')[0];
      } catch(e) { return serial; }
    };

    const smartFormatDate = (val, header = "") => {
      if (val === undefined || val === null || val === "") return "";
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (typeof val === 'number') {
        const dateKeywords = ["日付", "日", "date", "day", "年", "year", "月", "month"];
        if (dateKeywords.some(kw => header.toLowerCase().includes(kw)) || (val > 40000 && val < 50000)) {
          const res = excelSerialToDateString(val);
          if (typeof res === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(res)) return res;
        }
      }
      if (/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(s) || /^\d{4}年\d{1,2}月\d{1,2}日$/.test(s)) {
        const clean = s.replace(/年|月/g, '-').replace(/日/g, '').replace(/\//g, '-').replace(/\./g, '-');
        const d = new Date(clean);
        return isNaN(d.getTime()) ? s : d.toISOString().split('T')[0];
      }
      return s;
    };

    const analyzeColumns = (data, columnOrder = null) => {
      if(!data || data.length === 0) return { numeric: [], categorical: [], date: [], all: [] };
      const keys = columnOrder || Object.keys(data[0]);
      const num = [], cat = [], dt = [];
      const dateKeywords = ["日付", "日", "date", "day", "年", "year", "月", "month", "調査日"];
      keys.forEach(k => {
        let nC = 0, vC = 0, dC = 0;
        for(let i = 0; i < Math.min(data.length, 50); i++) {
          const v = data[i][k];
          if(v !== undefined && v !== null && v !== '') {
            vC++;
            const fmt = smartFormatDate(v, k);
            if (/^\d{4}-\d{2}-\d{2}$/.test(fmt)) dC++;
            else if (!isNaN(Number(v))) nC++;
          }
        }
        if (vC > 0) {
          if (dC / vC > 0.4 || (dateKeywords.some(kw => k.toLowerCase().includes(kw)) && dC > 0)) dt.push(k);
          else if (nC / vC > 0.7) num.push(k);
          else cat.push(k);
        }
      });
      return { numeric: num, categorical: cat, date: dt, all: keys };
    };

    const callGemini = async (prompt) => {
      const apiKey = localStorage.getItem('gemini_api_key');
      let aiModel = localStorage.getItem('gemini_api_model') || 'gemini-2.5-flash';
      
      if (aiModel.includes('1.5') || aiModel === 'gemini-pro') {
        aiModel = 'gemini-2.5-flash';
        localStorage.setItem('gemini_api_model', aiModel);
      }
      
      if (!apiKey) {
        throw new Error("APIキーが設定されていません。右上の「API設定」からGemini APIキーを登録してください。");
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${aiModel}:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "あなたはプロの金融・データアナリストです。提供された実際の集計データや統計量に基づいて、主要な傾向や示唆を日本語で提供してください。一般的な説明は避け、必ず具体的な「数値（平均、変動率、差分など）」を引用し、推測ではなくデータに基づいた実践的な洞察を、箇条書きと太字を活用して分かりやすく記述してください。" }] }
      };
      
      let delay = 1000;
      let lastErrorMsg = "";
      for (let attempt = 1; attempt <= 3; attempt++) {
          try {
              const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
              if (!response.ok) {
                  let errDetail = "";
                  try {
                      const errObj = await response.json();
                      errDetail = errObj.error?.message || JSON.stringify(errObj);
                  } catch(e) {}
                  throw new Error(`APIエラー (${response.status}): ${errDetail}`);
              }
              const result = await response.json();
              if (result.candidates && result.candidates[0]?.content?.parts?.[0]?.text) {
                  return result.candidates[0].content.parts[0].text;
              } else {
                  throw new Error("AIから有効なテキストが返却されませんでした。");
              }
          } catch (error) {
              lastErrorMsg = error.message;
              if (attempt === 3 || error.message.includes("APIエラー (400)") || error.message.includes("APIエラー (403)")) {
                  throw new Error(lastErrorMsg);
              }
              await new Promise(resolve => setTimeout(resolve, delay));
              delay *= 2;
          }
      }
      throw new Error(`AI分析失敗: ${lastErrorMsg}`);
    };

    const AnalysisPanel = forwardRef(({ processedData, cols, gridData, keyColumn, onResetGrid, fileName }, ref) => {
      const [analysisType, setAnalysisType] = useState('summary');
      const [chartTitle, setChartTitle] = useState('');
      
      const [xAxis, setXAxis] = useState('デフォルト（行/データ順）'); // 単一選択
      const [yAxisChk, setYAxisChk] = useState([]); // 数値複数選択用
      
      const [bins, setBins] = useState(20);
      const [noDataMsg, setNoDataMsg] = useState('');
      const [summaryData, setSummaryData] = useState(null);
      const [chartDataForAI, setChartDataForAI] = useState(null);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [showExportMenu, setShowExportMenu] = useState(false);
      const [aiLoading, setAiLoading] = useState(false);
      const [chatHistory, setChatHistory] = useState([]);
      const [userInput, setUserInput] = useState("");
      
      const [showTooltip, setShowTooltip] = useState(false); // ツールチップ用
      const [showDataSource, setShowDataSource] = useState(true); // データ元と日付の表示トグル
      const [colorPalette, setColorPalette] = useState('default'); // カラーパレット
      const [bgColor, setBgColor] = useState('white'); // 背景色

      // --- AI履歴保存用のState ---
      const [savedReports, setSavedReports] = useState([]);
      const [currentSessionId, setCurrentSessionId] = useState(null);
      const [currentReportTitle, setCurrentReportTitle] = useState("");
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      
      const chatEndRef = useRef(null);
      const modalScrollRef = useRef(null);

      // --- 期間 & カテゴリ フィルター用State ---
      const [dateFilterCol, setDateFilterCol] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [activeFilters, setActiveFilters] = useState({}); // { colName: [val1, val2] }

      const typeInfo = useMemo(() => ANALYSIS_TYPES.find(t => t.id === analysisType), [analysisType]);

      // 外部から関数を呼べるようにする
      useImperativeHandle(ref, () => ({
        runAnalysis,
        resetConditions
      }));

      // 履歴のロード
      useEffect(() => {
        try {
          const loaded = JSON.parse(localStorage.getItem('universal_analyzer_ai_reports') || '[]');
          setSavedReports(loaded);
        } catch (e) {}
      }, []);

      // 履歴のセーブ
      useEffect(() => {
        if (currentSessionId && chatHistory.length > 0) {
          setSavedReports(prev => {
            const existing = [...prev];
            const idx = existing.findIndex(r => r.id === currentSessionId);
            const reportObj = {
              id: currentSessionId,
              title: currentReportTitle,
              date: new Date().toLocaleString(),
              history: chatHistory
            };
            if (idx >= 0) { existing[idx] = reportObj; } 
            else { existing.unshift(reportObj); }
            const limited = existing.slice(0, 30);
            localStorage.setItem('universal_analyzer_ai_reports', JSON.stringify(limited));
            return limited;
          });
        }
      }, [chatHistory, currentSessionId, currentReportTitle]);

      const handleDateColChange = (col) => {
        setDateFilterCol(col);
        if (!col) return;
        let min = '9999-12-31', max = '0000-01-01';
        processedData.forEach(d => {
          let v = d[col];
          if (v && typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
            if (v < min) min = v;
            if (v > max) max = v;
          }
        });
        setStartDate(min !== '9999-12-31' ? min : '');
        setEndDate(max !== '0000-01-01' ? max : '');
      };

      useEffect(() => {
        if (cols.date && cols.date.length > 0 && !dateFilterCol) {
          handleDateColChange(cols.date[0]);
        }
      }, [cols.date]);

      const filteredData = useMemo(() => {
        let result = processedData;
        if (!result || result.length === 0) return [];

        // 1. 期間フィルター
        if (dateFilterCol && (startDate || endDate)) {
          result = result.filter(d => {
            const v = d[dateFilterCol];
            if (!v || typeof v !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return true;
            if (startDate && v < startDate) return false;
            if (endDate && v > endDate) return false;
            return true;
          });
        }

        // 2. 項目(カテゴリ)フィルター
        const filterCols = Object.keys(activeFilters);
        if (filterCols.length > 0) {
           result = result.filter(d => {
              return filterCols.every(col => {
                 const allowed = activeFilters[col];
                 if (!allowed || allowed.length === 0) return false; // 1つも選択されていなければ除外
                 const val = String(d[col] || '');
                 return allowed.includes(val);
              });
           });
        }

        return result;
      }, [processedData, dateFilterCol, startDate, endDate, activeFilters]);

      // 列の構成が変わった時のみ初期化するための依存文字列
      const colsAllStr = cols.all.join(',');

      // 項目初期化 (行列入れ替えなど、列構成が変わった時のみリセット)
      useEffect(() => {
        if (!cols.all.length) return;
        setXAxis('デフォルト（行/データ順）');
        setYAxisChk(cols.numeric.length ? cols.numeric.slice(0, 3) : [cols.all[0]]);
        setActiveFilters({});
      }, [colsAllStr]);

      // キーカラムが変更されたらフィルターをリセット
      useEffect(() => {
        setActiveFilters({});
      }, [keyColumn]);

      const filterCandidates = useMemo(() => {
        const defaultFilterCol = cols.categorical[0] || cols.all[0];
        const candidates = new Set();
        if (defaultFilterCol) candidates.add(defaultFilterCol);
        if (keyColumn) candidates.add(keyColumn);
        return Array.from(candidates);
      }, [cols, keyColumn]);

      const toNum = (v) => { const n = Number(v); return isNaN(n) || v === null || v === '' ? null : n; };

      // 複数カテゴリによる階層データ生成用 (Treemap, Sunburst)
      const buildHierarchy = (data, catKeys, valKey) => {
        let labels = [], parents = [], values = [], ids = [];
        let agg = {};
        data.forEach(d => {
            let path = catKeys.map(k => String(d[k] || '不明'));
            let v = valKey ? (toNum(d[valKey]) || 0) : 1;
            let currentPath = "";
            path.forEach((p, i) => {
                let parentPath = currentPath;
                currentPath = currentPath ? currentPath + " - " + p : p;
                if (!agg[currentPath]) agg[currentPath] = { label: p, parent: parentPath, value: 0 };
                agg[currentPath].value += v;
            });
        });
        Object.keys(agg).forEach(id => {
            ids.push(id); labels.push(agg[id].label); parents.push(agg[id].parent); values.push(agg[id].value);
        });
        return { ids, labels, parents, values };
      };

      const runAnalysis = () => {
        setNoDataMsg(''); setSummaryData(null); setChartDataForAI(null);
        const chartArea = document.getElementById('chart-area');
        if (chartArea && window.Plotly) window.Plotly.purge(chartArea);

        if (filteredData.length === 0) {
           setNoDataMsg('指定された期間や条件に該当するデータが存在しません。');
           return;
        }

        if (yAxisChk.length === 0) {
           setNoDataMsg('分析対象(縦軸・数値)を1つ以上選択してください。');
           return;
        }

        let extractedDataForAI = null;
        let currentBg = BACKGROUND_COLORS[bgColor];
        
        let baseLayout = {
            title: chartTitle ? { text: chartTitle, font: { color: currentBg.font, size: 18 } } : undefined,
            margin: { t: chartTitle ? 60 : 40 },
            colorway: COLOR_PALETTES[colorPalette].colorway,
            plot_bgcolor: currentBg.plot,
            paper_bgcolor: currentBg.paper,
            font: { color: currentBg.font },
            xaxis: { gridcolor: currentBg.grid, zerolinecolor: currentBg.grid },
            yaxis: { gridcolor: currentBg.grid, zerolinecolor: currentBg.grid }
        };
        let currentColorscale = COLOR_PALETTES[colorPalette].colorscale;
        let plotConfig = { 
            responsive: true, 
            toImageButtonOptions: { 
                filename: chartTitle || 'Analysis_Chart', 
                format: 'png', 
                scale: 2 
            } 
        };

        try {
          switch (analysisType) {
            case 'summary': {
              let res = yAxisChk.map(c => {
                let vls = filteredData.map(d => toNum(d[c])).filter(v => v !== null).sort((a,b)=>a-b);
                if (!vls.length) return null;
                return { col: c, count: vls.length, mean: vls.reduce((a,b)=>a+b,0)/vls.length, min: vls[0], median: vls[Math.floor(vls.length/2)], max: vls[vls.length-1] };
              }).filter(Boolean);
              setSummaryData(res);
              extractedDataForAI = res;
              break;
            }
            case 'gauge': {
              if (yAxisChk.length === 0) throw new Error("数値を1つ以上選択してください");
              let val = toNum(filteredData[0][yAxisChk[0]]);
              let gaugeTitle = chartTitle || yAxisChk[0];
              let gaugeLayout = { ...baseLayout, margin: { t: 60, b: 40 } };
              // gauge自身にもタイトル設定機能があるため上書き
              if(chartTitle) gaugeLayout.title = undefined; 
              
              window.Plotly.newPlot('chart-area', [{ type: "indicator", mode: "gauge+number", value: val, title: { text: gaugeTitle, font: { color: currentBg.font } }, gauge: { bar: { color: COLOR_PALETTES[colorPalette].colorway[0] } } }], gaugeLayout, plotConfig);
              extractedDataForAI = { type: 'gauge', metric: yAxisChk[0], value: val };
              break;
            }
            case 'timeseries': {
              let sorted = [...filteredData].sort((a,b) => {
                  let vA = a[xAxis];
                  let vB = b[xAxis];
                  return vA < vB ? -1 : 1;
              });
              let traces = yAxisChk.map(c => ({ x: sorted.map(d=>d[xAxis]), y: sorted.map(d=>toNum(d[c])), type: 'scatter', mode: 'lines+markers', name: c }));
              window.Plotly.newPlot('chart-area', traces, { ...baseLayout, autosize: true }, plotConfig);
              extractedDataForAI = traces.map(t => ({ name: t.name, data_points: t.x.length, min_y: Math.min(...t.y.filter(v=>v!==null)), max_y: Math.max(...t.y.filter(v=>v!==null)) }));
              break;
            }
            case 'candlestick': {
              if (yAxisChk.length < 4) throw new Error('ローソク足を描画するには、分析対象(数値)を4つ（始値、高値、安値、終値）選択してください。');
              
              // 1. 列名から「始値」「高値」「安値」「終値」を自動判定（見つからなければ選択順）
              let openCol = yAxisChk.find(c => /始値|open|初値/i.test(c)) || yAxisChk[0];
              let highCol = yAxisChk.find(c => /高値|high|最高/i.test(c)) || yAxisChk[1];
              let lowCol = yAxisChk.find(c => /安値|low|最低/i.test(c)) || yAxisChk[2];
              let closeCol = yAxisChk.find(c => /終値|close/i.test(c)) || yAxisChk[3];

              let sorted = [...filteredData].sort((a,b) => {
                  let vA = a[xAxis];
                  let vB = b[xAxis];
                  return vA < vB ? -1 : 1;
              });

              let xVals = [], oVals = [], hVals = [], lVals = [], cVals = [];
              
              sorted.forEach(d => {
                  let o = toNum(d[openCol]);
                  let h = toNum(d[highCol]);
                  let l = toNum(d[lowCol]);
                  let c = toNum(d[closeCol]);
                  
                  if (o !== null && h !== null && l !== null && c !== null) {
                      xVals.push(d[xAxis]);
                      oVals.push(o);
                      cVals.push(c);
                      // 2. 自動補正: 4つの値のうち最大値を確実に「上ヒゲ(High)」、最小値を「下ヒゲ(Low)」にする
                      hVals.push(Math.max(o, h, l, c));
                      lVals.push(Math.min(o, h, l, c));
                  }
              });

              let trace = {
                x: xVals,
                open: oVals,
                high: hVals,
                low: lVals,
                close: cVals,
                type: 'candlestick',
                xaxis: 'x', yaxis: 'y',
                name: '価格',
                increasing: { line: { color: '#ef4444' } }, // 陽線を赤色に（日本式）
                decreasing: { line: { color: '#3b82f6' } }  // 陰線を青色に（日本式）
              };
              
              let layout = { ...baseLayout, xaxis: { rangeslider: {visible: false}, gridcolor: currentBg.grid, zerolinecolor: currentBg.grid } };
              window.Plotly.newPlot('chart-area', [trace], layout, plotConfig);
              extractedDataForAI = { type: 'candlestick', data_points: xVals.length, metrics: [openCol, highCol, lowCol, closeCol] };
              break;
            }
            case 'normalized_line': {
              let sorted = [...filteredData].sort((a,b) => {
                  let vA = a[xAxis];
                  let vB = b[xAxis];
                  return vA < vB ? -1 : 1;
              });
              let traces = yAxisChk.map(c => {
                let yVals = sorted.map(d => toNum(d[c]));
                let firstVal = yVals.find(v => v !== null && v !== 0);
                let normY = yVals.map(v => (v !== null && firstVal) ? (v / firstVal) * 100 : null);
                return { x: sorted.map(d=>d[xAxis]), y: normY, type: 'scatter', mode: 'lines', name: c };
              });
              window.Plotly.newPlot('chart-area', traces, baseLayout, plotConfig);
              extractedDataForAI = { type: 'normalized', count: sorted.length };
              break;
            }
            case 'waterfall': {
              let trace = {
                type: "waterfall",
                x: filteredData.map(d => d[xAxis]),
                y: filteredData.map(d => toNum(d[yAxisChk[0]])),
                connector: { line: { color: "rgb(63, 63, 63)" } },
                decreasing: { marker: { color: COLOR_PALETTES[colorPalette].colorway[1] || '#3b82f6' } },
                increasing: { marker: { color: COLOR_PALETTES[colorPalette].colorway[0] || '#ef4444' } },
                totals: { marker: { color: COLOR_PALETTES[colorPalette].colorway[2] || '#10b981' } }
              };
              window.Plotly.newPlot('chart-area', [trace], baseLayout, plotConfig);
              break;
            }
            case 'sunburst':
            case 'treemap': {
              let { ids, labels, parents, values } = buildHierarchy(filteredData, [xAxis], yAxisChk[0]);
              let layout = { ...baseLayout };
              if(!chartTitle) layout.margin = {t:40, l:0, r:0, b:0};
              window.Plotly.newPlot('chart-area', [{ 
                  type: analysisType, 
                  ids, labels, parents, values, 
                  branchvalues: "total"
              }], layout, plotConfig);
              extractedDataForAI = { type: analysisType, categories_count: labels.length };
              break;
            }
            case 'comparison':
            case 'stackedbar': {
              let g = {}; filteredData.forEach(r => {
                let k = r[xAxis] !== undefined ? String(r[xAxis]) : '未選択';
                if(!g[k]) { g[k]={c:0, s:{}}; yAxisChk.forEach(y=>g[k].s[y]=0); }
                yAxisChk.forEach(y => { let v=toNum(r[y]); if(v!==null) g[k].s[y]+=v; }); g[k].c++;
              });
              let ks = Object.keys(g).sort();
              let traces = yAxisChk.map(y => ({ x: ks, y: ks.map(k=>g[k].c>0 ? g[k].s[y]/g[k].c : 0), type: 'bar', name: y }));
              window.Plotly.newPlot('chart-area', traces, { ...baseLayout, barmode: analysisType==='stackedbar'?'stack':'group' }, plotConfig);
              extractedDataForAI = traces.map(t => ({ name: t.name, categories: t.x, values: t.y }));
              break;
            }
            case 'pie': {
              let g = {}; 
              filteredData.forEach(r => {
                let k = r[xAxis] !== undefined ? String(r[xAxis]) : '未選択';
                let v = toNum(r[yAxisChk[0]]);
                if (v !== null) {
                  if(!g[k]) g[k] = 0;
                  g[k] += v;
                }
              });
              let ks = Object.keys(g).sort();
              let vs = ks.map(k => g[k]);
              window.Plotly.newPlot('chart-area', [{ labels: ks, values: vs, type: 'pie', textinfo: 'label+percent', hoverinfo: 'label+value' }], baseLayout, plotConfig);
              extractedDataForAI = { type: 'pie', labels: ks, values: vs };
              break;
            }
            case 'pareto': {
              let key = xAxis === 'デフォルト（行/データ順）' ? yAxisChk[0] : xAxis;
              let agg = {}; 
              filteredData.forEach(d => { let k = String(d[key] || '不明'); agg[k] = (agg[k] || 0) + (toNum(d[yAxisChk[0]]) || 0); });
              let sortedKeys = Object.keys(agg).sort((a,b) => agg[b] - agg[a]);
              let vals = sortedKeys.map(k => agg[k]);
              let total = vals.reduce((a,b) => a+b, 0);
              if (total === 0) throw new Error("合計値が0のため計算できません");
              let cumSum = 0;
              let cumPerc = vals.map(v => { cumSum += v; return (cumSum/total) * 100; });
              window.Plotly.newPlot('chart-area', [
                { x: sortedKeys, y: vals, type: 'bar', name: '個別値', marker: { color: COLOR_PALETTES[colorPalette].colorway[0] } },
                { x: sortedKeys, y: cumPerc, type: 'scatter', mode: 'lines+markers', name: '累積構成比', yaxis: 'y2', line: { color: COLOR_PALETTES[colorPalette].colorway[1] } }
              ], { ...baseLayout, yaxis2: { overlaying: 'y', side: 'right', range: [0, 105], title: '%' } }, plotConfig);
              extractedDataForAI = { type: 'pareto', labels: sortedKeys, values: vals, cumulative_percentages: cumPerc };
              break;
            }
            case 'funnel': {
              let xLabels = xAxis === 'デフォルト（行/データ順）' ? yAxisChk : [xAxis];
              let values = yAxisChk.map(c => filteredData.reduce((acc, d) => acc + (toNum(d[c]) || 0), 0));
              let layout = { ...baseLayout };
              if (!chartTitle) layout.margin = { l: 150 };
              window.Plotly.newPlot('chart-area', [{ type: 'funnel', y: yAxisChk, x: values, textinfo: "value+percent initial" }], layout, plotConfig);
              extractedDataForAI = { type: 'funnel', stages: yAxisChk, values: values };
              break;
            }
            case 'boxplot':
            case 'violin':
            case 'stripplot': {
              let g = {}; filteredData.forEach(r => { 
                let k = r[xAxis] !== undefined ? String(r[xAxis]) : '未選択';
                let v = toNum(r[yAxisChk[0]]); 
                if(v!==null){ if(!g[k])g[k]=[]; g[k].push(v); }
              });
              let traces = Object.keys(g).sort().map(k => ({ y: g[k], name: k, type: analysisType==='violin'?'violin':'box', boxpoints: analysisType==='stripplot'?'all':'outliers' }));
              window.Plotly.newPlot('chart-area', traces, baseLayout, plotConfig);
              break;
            }
            case 'correlation': {
              let z = yAxisChk.map(c1 => yAxisChk.map(c2 => {
                let x=[], y=[]; filteredData.forEach(d=>{ let v1=toNum(d[c1]), v2=toNum(d[c2]); if(v1!==null && v2!==null){ x.push(v1); y.push(v2); }});
                if(!x.length) return 0;
                let n=x.length, sx=x.reduce((a,b)=>a+b,0), sy=y.reduce((a,b)=>a+b,0), sxy=x.reduce((a,v,i)=>a+v*y[i],0), sx2=x.reduce((a,v)=>a+v*v,0), sy2=y.reduce((a,v)=>a+v*v,0);
                let nm = n*sxy-sx*sy, dn = Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));
                return dn===0?0:nm/dn;
              }));
              window.Plotly.newPlot('chart-area', [{ z, x: yAxisChk, y: yAxisChk, type: 'heatmap', colorscale: currentColorscale }], baseLayout, plotConfig);
              extractedDataForAI = { x: yAxisChk, y: yAxisChk, z_matrix: z };
              break;
            }
            case 'trendline': {
              if (yAxisChk.length < 2 && xAxis === 'デフォルト（行/データ順）') throw new Error('数値を2つ以上選択するか、X軸とY軸に数値を設定してください。');
              let xKey = xAxis === 'デフォルト（行/データ順）' ? yAxisChk[0] : xAxis;
              let yKey = yAxisChk[1] || yAxisChk[0];
              
              let pairedData = filteredData.map(d => ({xVal: toNum(d[xKey]), yVal: toNum(d[yKey])})).filter(d => d.xVal !== null && d.yVal !== null);
              let x = pairedData.map(d => d.xVal);
              let y = pairedData.map(d => d.yVal);

              if(x.length < 2) throw new Error('近似線を引くための有効なデータペアが不足しています。');

              let n = x.length;
              let sx=0, sy=0, sxy=0, sx2=0;
              for(let i=0; i<n; i++) { sx+=x[i]; sy+=y[i]; sxy+=x[i]*y[i]; sx2+=x[i]*x[i]; }
              
              let slope = 0, intercept = 0;
              let denominator = (n*sx2 - sx*sx);
              if (denominator !== 0) {
                 slope = (n*sxy - sx*sy) / denominator;
                 intercept = (sy - slope*sx) / n;
              }

              let xMin = Math.min(...x), xMax = Math.max(...x);
              let yMin = slope*xMin+intercept, yMax = slope*xMax+intercept;
              
              window.Plotly.newPlot('chart-area', [
                 { x: x, y: y, mode: 'markers', name: 'データ', type: 'scatter', marker: { color: COLOR_PALETTES[colorPalette].colorway[0] } },
                 { x: [xMin, xMax], y: [yMin, yMax], mode: 'lines', name: '回帰直線', type: 'scatter', line: { color: COLOR_PALETTES[colorPalette].colorway[1] } }
              ], { ...baseLayout, xaxis: { title: xKey, gridcolor: currentBg.grid, zerolinecolor: currentBg.grid }, yaxis: { title: yKey, gridcolor: currentBg.grid, zerolinecolor: currentBg.grid } }, plotConfig);
              extractedDataForAI = { type: 'trendline', slope: slope, intercept: intercept, data_points: n };
              break;
            }
            case 'bubble': {
              if (yAxisChk.length < 2 && xAxis === 'デフォルト（行/データ順）') {
                  throw new Error('バブルチャートを描画するには、分析対象(数値)を2つ以上選択してください。');
              }
              let xKey = xAxis !== 'デフォルト（行/データ順）' ? xAxis : yAxisChk[0];
              let yKey = xAxis !== 'デフォルト（行/データ順）' ? yAxisChk[0] : yAxisChk[1];
              let sizeKey = xAxis !== 'デフォルト（行/データ順）' ? (yAxisChk[1] || yAxisChk[0]) : (yAxisChk[2] || yAxisChk[1]);
              
              let xVals = filteredData.map(d => cols.numeric.includes(xKey) ? toNum(d[xKey]) : d[xKey]);
              let yVals = filteredData.map(d => toNum(d[yKey]));
              let sizeVals = filteredData.map(d => toNum(d[sizeKey]));
              
              let maxSize = Math.max(...sizeVals.filter(v=>v!==null));
              let markerSizes = sizeVals.map(v => v !== null && maxSize > 0 ? (v / maxSize) * 40 + 5 : 5);
              
              let trace = { x: xVals, y: yVals, mode: 'markers', marker: { size: markerSizes, sizemode: 'diameter', opacity: 0.6, color: sizeVals, colorscale: currentColorscale }, type: 'scatter' };
              window.Plotly.newPlot('chart-area', [trace], { ...baseLayout, xaxis: { title: xKey, gridcolor: currentBg.grid, zerolinecolor: currentBg.grid }, yaxis: { title: yKey, gridcolor: currentBg.grid, zerolinecolor: currentBg.grid } }, plotConfig);
              extractedDataForAI = { type: 'bubble' };
              break;
            }
            case 'splom': {
              if (yAxisChk.length < 2) throw new Error('散布図行列を描画するには、分析対象(数値)を2つ以上選択してください。');
              let dimensions = yAxisChk.map(c => ({ label: c, values: filteredData.map(d=>toNum(d[c])) }));
              let trace = { type: 'splom', dimensions: dimensions, marker: { size: 5, opacity: 0.6, color: COLOR_PALETTES[colorPalette].colorway[0] } };
              window.Plotly.newPlot('chart-area', [trace], baseLayout, plotConfig);
              extractedDataForAI = { type: 'splom' };
              break;
            }
            case 'parcoords': {
              if (yAxisChk.length < 2) throw new Error('平行座標プロットを描画するには、分析対象(数値)を2つ以上選択してください。');
              let dimensions = yAxisChk.map(c => ({ label: c, values: filteredData.map(d=>toNum(d[c])) }));
              let trace = { type: 'parcoords', line: {color: COLOR_PALETTES[colorPalette].colorway[0]}, dimensions: dimensions };
              window.Plotly.newPlot('chart-area', [trace], baseLayout, plotConfig);
              extractedDataForAI = { type: 'parcoords' };
              break;
            }
            case 'bumpchart': {
              let sorted = [...filteredData].sort((a,b) => {
                  let vA = a[xAxis];
                  let vB = b[xAxis];
                  return vA < vB ? -1 : 1;
              });
              let timePoints = [...new Set(sorted.map(d=>String(d[xAxis])))];
              let rankData = yAxisChk.map(c => ({ name: c, x: [], y: [] }));
              timePoints.forEach(t => {
                  let valsAtTime = yAxisChk.map(c => {
                      let d = sorted.find(row => String(row[xAxis]) === t);
                      return { col: c, val: d ? toNum(d[c]) : null };
                  }).filter(v => v.val !== null).sort((a,b) => b.val - a.val);
                  valsAtTime.forEach((v, idx) => {
                      let trace = rankData.find(r => r.name === v.col);
                      if (trace) { trace.x.push(t); trace.y.push(idx + 1); }
                  });
              });
              let traces = rankData.map(r => ({ x: r.x, y: r.y, type: 'scatter', mode: 'lines+markers', name: r.name }));
              window.Plotly.newPlot('chart-area', traces, { ...baseLayout, yaxis: { autorange: 'reversed', tickdtick: 1, gridcolor: currentBg.grid, zerolinecolor: currentBg.grid } }, plotConfig);
              break;
            }
            case 'radar': {
              let g = {}; filteredData.forEach(r => {
                let k = r[xAxis] !== undefined ? String(r[xAxis]) : '全体';
                if(!g[k]) { g[k]={c:0, s:{}}; yAxisChk.forEach(y=>g[k].s[y]=0); }
                yAxisChk.forEach(y => { let v=toNum(r[y]); if(v!==null) g[k].s[y]+=v; }); g[k].c++;
              });
              let ks = Object.keys(g).sort();
              let traces = ks.map(k => ({
                  type: 'scatterpolar',
                  r: yAxisChk.map(y => g[k].c>0 ? g[k].s[y]/g[k].c : 0),
                  theta: yAxisChk,
                  fill: 'toself',
                  name: k
              }));
              window.Plotly.newPlot('chart-area', traces, { ...baseLayout, polar: { radialaxis: { visible: true, rangemode: 'tozero', gridcolor: currentBg.grid }, angularaxis: { gridcolor: currentBg.grid } } }, plotConfig);
              break;
            }
            case 'histogram': {
              let traces = yAxisChk.map(c => ({ x: filteredData.map(d=>toNum(d[c])), type: 'histogram', name: c, opacity: 0.7 }));
              window.Plotly.newPlot('chart-area', traces, { ...baseLayout, barmode: 'overlay' }, plotConfig);
              break;
            }
            case 'ridgeline': {
              let g = {}; filteredData.forEach(r => { 
                let k = r[xAxis] !== undefined ? String(r[xAxis]) : '全体';
                let v = toNum(r[yAxisChk[0]]); 
                if(v!==null){ if(!g[k])g[k]=[]; g[k].push(v); }
              });
              let traces = Object.keys(g).sort().map(k => ({ x: g[k], name: k, type: 'violin', side: 'positive', orientation: 'h' }));
              window.Plotly.newPlot('chart-area', traces, baseLayout, plotConfig);
              break;
            }
            case 'contour': {
              if(yAxisChk.length < 2) throw new Error('2D密度等高線を描画するには、分析対象(数値)を2つ以上選択してください。');
              let trace = { x: filteredData.map(d=>toNum(d[yAxisChk[0]])), y: filteredData.map(d=>toNum(d[yAxisChk[1]])), type: 'histogram2dcontour', colorscale: currentColorscale };
              window.Plotly.newPlot('chart-area', [trace], baseLayout, plotConfig);
              break;
            }
            case 'sankey': {
              let selectedCats = [];
              if (xAxis !== 'デフォルト（行/データ順）') selectedCats.push(xAxis);
              
              // Y軸で選択されたカテゴリ（と日付）を追加
              let yCats = yAxisChk.filter(c => cols.categorical.includes(c) || cols.date.includes(c) || cols.dateExtended.includes(c));
              yCats.forEach(c => { if (!selectedCats.includes(c)) selectedCats.push(c); });

              if (selectedCats.length < 2) {
                 let available = cols.categorical.filter(c => !selectedCats.includes(c));
                 if (selectedCats.length === 0 && available.length >= 2) {
                     selectedCats.push(available[0], available[1]);
                 } else if (selectedCats.length === 1 && available.length >= 1) {
                     selectedCats.push(available[0]);
                 } else {
                     throw new Error("サンキーダイアグラムを描画するには、横軸と縦軸のリストから最低2つのカテゴリーを選択してください。");
                 }
              }

              let flowCol = yAxisChk.find(c => cols.numeric.includes(c));

              let nodeLabels = [];
              let nodeIds = [];
              let links = [];

              selectedCats.forEach(cat => {
                 filteredData.forEach(d => {
                     let val = String(d[cat]);
                     if (val && val !== 'undefined' && val !== 'null' && val !== '') {
                         let id = `${cat}::${val}`;
                         if (!nodeIds.includes(id)) {
                             nodeIds.push(id);
                             nodeLabels.push(val);
                         }
                     }
                 });
              });

              for (let i = 0; i < selectedCats.length - 1; i++) {
                  let sourceCat = selectedCats[i];
                  let targetCat = selectedCats[i+1];
                  
                  filteredData.forEach(d => {
                     let sVal = String(d[sourceCat]);
                     let tVal = String(d[targetCat]);
                     
                     if (sVal && tVal && sVal !== 'undefined' && tVal !== 'undefined' && sVal !== '' && tVal !== '') {
                         let val = flowCol ? (toNum(d[flowCol]) || 0) : 1;
                         if (val > 0) {
                             let sIdx = nodeIds.indexOf(`${sourceCat}::${sVal}`);
                             let tIdx = nodeIds.indexOf(`${targetCat}::${tVal}`);
                             
                             if (sIdx !== -1 && tIdx !== -1) {
                                 let existingLink = links.find(l => l.source === sIdx && l.target === tIdx);
                                 if (existingLink) {
                                     existingLink.value += val;
                                 } else {
                                     links.push({ source: sIdx, target: tIdx, value: val });
                                 }
                             }
                         }
                     }
                  });
              }

              if (links.length === 0) throw new Error("有効なデータの繋がりがありませんでした。");

              window.Plotly.newPlot('chart-area', [{
                type: "sankey",
                node: { label: nodeLabels, pad: 15, thickness: 20 },
                link: { source: links.map(l=>l.source), target: links.map(l=>l.target), value: links.map(l=>l.value) }
              }], baseLayout, plotConfig);
              extractedDataForAI = { type: 'sankey', categories: selectedCats, total_links: links.length };
              break;
            }
            case 'crosstab_heatmap': {
              if(yAxisChk.length === 0) throw new Error('クロス集計するには、縦軸(カテゴリまたは数値)を1つ以上選択してください。');
              let cat1 = xAxis, cat2 = yAxisChk[0];
              let g = {}; let xLabels = new Set(), yLabels = new Set();
              filteredData.forEach(r => {
                  let k1 = String(r[cat1]||'不明'), k2 = String(r[cat2]||'不明');
                  xLabels.add(k1); yLabels.add(k2);
                  if(!g[k2]) g[k2] = {};
                  if(!g[k2][k1]) g[k2][k1] = 0;
                  g[k2][k1] += 1;
              });
              let xArr = Array.from(xLabels).sort(), yArr = Array.from(yLabels).sort();
              let z = yArr.map(y => xArr.map(x => g[y][x] || 0));
              window.Plotly.newPlot('chart-area', [{ z: z, x: xArr, y: yArr, type: 'heatmap', colorscale: currentColorscale }], baseLayout, plotConfig);
              break;
            }
            case 'stat_test': {
                if(!xAxis || yAxisChk.length === 0) throw new Error('検定を行うには、横軸にカテゴリ、縦軸に数値を1つ以上選択してください。');
                let groups = {};
                filteredData.forEach(r => {
                    let k = String(r[xAxis]);
                    let v = toNum(r[yAxisChk[0]]);
                    if (v !== null) { if(!groups[k]) groups[k] = []; groups[k].push(v); }
                });
                let validGroups = Object.values(groups).filter(arr => arr.length > 1);
                if (validGroups.length < 2) throw new Error('比較可能なグループが2つ以上必要です。各グループには2つ以上の数値データが必要です。');
                let pValue = 1; let testName = "";
                try {
                    pValue = window.jStat.anovaftest(...validGroups);
                    testName = "一元配置分散分析 (ANOVA)";
                } catch(e) { throw new Error("検定計算中にエラーが発生しました。"); }
                let summary = Object.keys(groups).map(k => {
                     let arr = groups[k]; let mean = arr.reduce((a,b)=>a+b,0) / arr.length;
                     return { group: k, count: arr.length, mean: mean.toFixed(2) };
                });
                let ks = summary.map(s => s.group); let vs = summary.map(s => parseFloat(s.mean));
                let statTitle = `${chartTitle ? chartTitle + ' - ' : ''}【${testName}】 p値 = ${pValue < 0.001 ? '< 0.001' : pValue.toFixed(4)} ${pValue < 0.05 ? '(有意差あり)' : '(有意差なし)'}`;
                
                window.Plotly.newPlot('chart-area', [{ x: ks, y: vs, type: 'bar', marker: {color: COLOR_PALETTES[colorPalette].colorway[0] || 'lightblue'} }], { 
                    ...baseLayout, margin: {t:80}, title: { text: statTitle, font: { color: currentBg.font, size: 16 } }
                }, plotConfig);
                extractedDataForAI = { test_type: testName, p_value: pValue, group_summary: summary };
                break;
            }
            default: {
                let traces = [];
                if (analysisType === 'scatter3d') {
                  let xKey = xAxis !== 'デフォルト（行/データ順）' ? xAxis : yAxisChk[0];
                  let yKey = xAxis !== 'デフォルト（行/データ順）' ? yAxisChk[0] : (yAxisChk[1] || yAxisChk[0]);
                  let zKey = xAxis !== 'デフォルト（行/データ順）' ? (yAxisChk[1] || yAxisChk[0]) : (yAxisChk[2] || yAxisChk[1] || yAxisChk[0]);
                  traces = [{ 
                    x: filteredData.map(d => cols.numeric.includes(xKey) ? toNum(d[xKey]) : d[xKey]), 
                    y: filteredData.map(d => toNum(d[yKey])), 
                    z: filteredData.map(d => toNum(d[zKey])),
                    mode: 'markers', 
                    type: 'scatter3d',
                    marker: { size: 5, color: filteredData.map(d => toNum(d[zKey])), colorscale: currentColorscale }
                  }];
                } else {
                  let xKey = xAxis;
                  let yKey = yAxisChk[0];
                  traces = [{ 
                    x: filteredData.map(d => xKey ? (cols.numeric.includes(xKey) ? toNum(d[xKey]) : d[xKey]) : null), 
                    y: filteredData.map(d => yKey ? toNum(d[yKey]) : null), 
                    mode: 'markers', 
                    type: 'scatter' 
                  }];
                }
                window.Plotly.newPlot('chart-area', traces, baseLayout, plotConfig);
            }
          }
          
          if (!extractedDataForAI) {
              extractedDataForAI = filteredData.slice(0, 50).map(d => {
                  let obj = {}; 
                  if(xAxis) obj[xAxis] = d[xAxis]; 
                  yAxisChk.forEach(y => obj[y] = d[y]); 
                  return obj;
              });
          }
          setChartDataForAI(extractedDataForAI);

        } catch (e) { setNoDataMsg(e.message); }
      };

      const handleAIAnalysis = async () => {
        setIsModalOpen(true);
        setAiLoading(true);
        setChatHistory([]);
        setShowExportMenu(false);
        
        const newSessionId = Date.now();
        setCurrentSessionId(newSessionId);
        const titleSuffix = yAxisChk.length > 0 ? ` (${yAxisChk.slice(0,2).join(', ')}${yAxisChk.length > 2 ? '...' : ''})` : '';
        const reportTitle = `${typeInfo ? typeInfo.name.split('. ')[1] : 'データ分析'}${titleSuffix}`;
        setCurrentReportTitle(reportTitle);
        
        let dataStr = "";
        if (chartDataForAI) {
            try {
                dataStr = JSON.stringify(chartDataForAI);
                if (dataStr.length > 20000) dataStr = dataStr.substring(0, 20000) + "...(省略)";
            } catch(e) {}
        }

        let overallStats = yAxisChk.map(c => {
          let vls = filteredData.map(d => toNum(d[c])).filter(v => v !== null).sort((a,b)=>a-b);
          if (!vls.length) return null;
          return { 
            "列名": c, 
            "有効データ数": vls.length, 
            "平均値": Number((vls.reduce((a,b)=>a+b,0)/vls.length).toFixed(2)), 
            "最小値": vls[0], 
            "中央値": vls[Math.floor(vls.length/2)], 
            "最大値": vls[vls.length-1] 
          };
        }).filter(Boolean);
        
        let statsStr = JSON.stringify(overallStats);
        let dateFilterInfo = dateFilterCol ? `\n期間指定: ${dateFilterCol} (${startDate || '指定なし'} 〜 ${endDate || '指定なし'})` : '';
        let currentXAxisInfo = xAxis || '未選択';

        let aiPrompt = `【分析条件】\n分析手法: ${analysisType}\nX軸(カテゴリ): ${currentXAxisInfo}\nY軸(数値): ${yAxisChk.join(", ")}\n対象データ件数: ${filteredData.length}${dateFilterInfo}\n\n【対象項目の基本統計量】\n${statsStr}\n\n【グラフ表示用の集計・サンプリングデータ】\n${dataStr}\n\n上記データと条件に基づいて、データから読み取れる主要な傾向や示唆を日本語で提供してください。必ず「基本統計量」や「集計データ」の実際の数値を引用して具体的に分析してください。`;
        
        try {
          const res = await callGemini(aiPrompt);
          setChatHistory([{ role: "assistant", text: res }]);
        } catch (e) {
          setChatHistory([{ role: "assistant", text: e.message || "AI分析中にエラーが発生しました。" }]);
        } finally { 
          setAiLoading(false); 
          setTimeout(() => {
            if (modalScrollRef.current) modalScrollRef.current.scrollTo({ top: 0, behavior: 'smooth' });
          }, 100);
        }
      };

      const askAI = async () => {
        if (!userInput.trim()) return;
        const msg = userInput; setUserInput("");
        setChatHistory(p => [...p, { role: "user", text: msg }]);
        setAiLoading(true);
        setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);

        try {
          const res = await callGemini(`文脈を踏まえて質問に答えてください: ${msg}`);
          setChatHistory(p => [...p, { role: "assistant", text: res }]);
        } catch (e) {
          setChatHistory(p => [...p, { role: "assistant", text: e.message || "エラーが発生しました。" }]);
        } finally { 
          setAiLoading(false); 
          setTimeout(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
        }
      };

      const downloadBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const exportResult = (format) => {
        setShowExportMenu(false);
        if (chatHistory.length === 0) return;
        
        const dateStr = new Date().toISOString().split('T')[0];
        const filename = `AI_Analysis_Report_${dateStr}`;
        
        if (format === 'md') {
          let content = `# データ分析レポート\n生成日時: ${new Date().toLocaleString()}\n\n`;
          content += chatHistory.map(m => `### ${m.role === 'user' ? '👤 ユーザーの質問' : '✨ AIによる分析'}\n${m.text}\n`).join('\n---\n\n');
          const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });
          downloadBlob(blob, `${filename}.md`);
        } 
        else if (format === 'txt') {
          let content = `データ分析レポート\n生成日時: ${new Date().toLocaleString()}\n\n`;
          content += chatHistory.map(m => `[${m.role === 'user' ? 'ユーザーの質問' : 'AIによる分析'}]\n${m.text.replace(/\*\*(.*?)\*\*/g, '$1')}\n`).join('\n------------------------\n\n');
          const blob = new Blob([content], { type: 'text/plain;charset=utf-8;' });
          downloadBlob(blob, `${filename}.txt`);
        } 
        else if (format === 'doc') {
          const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Report</title></head><body>";
          const footer = "</body></html>";
          const htmlContent = `<h1>データ分析レポート</h1><p style="color:#666;">生成日時: ${new Date().toLocaleString()}</p><hr>` + 
            chatHistory.map(m => `<h3>${m.role === 'user' ? 'ユーザーの質問' : 'AIによる分析'}</h3><div>${m.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}</div>`).join('<hr>');
          const blob = new Blob(['\ufeff', header + htmlContent + footer], { type: 'application/msword' });
          downloadBlob(blob, `${filename}.doc`);
        } 
        else if (format === 'pdf') {
          if (!window.html2pdf) {
            alert('PDF生成ライブラリを読み込み中です。数秒待ってから再度お試しください。');
            return;
          }
          const element = document.createElement('div');
          element.innerHTML = `
            <div style="font-family: sans-serif; padding: 20px;">
              <h2 style="color: #1e293b;">データ分析レポート</h2>
              <p style="color: #64748b; font-size: 12px;">生成日時: ${new Date().toLocaleString()}</p>
              <hr style="border: none; border-top: 1px solid #cbd5e1; margin: 20px 0;" />
              ${chatHistory.map(m => `
                <div style="margin-bottom: 20px;">
                  <h4 style="color: ${m.role === 'user' ? '#475569' : '#3b82f6'}; margin-bottom: 10px;">
                    ${m.role === 'user' ? '👤 ユーザーの質問' : '✨ AIによる分析'}
                  </h4>
                  <div style="font-size: 14px; line-height: 1.6; color: #334155;">
                    ${m.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}
                  </div>
                </div>
              `).join('<hr style="border: none; border-top: 1px dashed #e2e8f0; margin: 20px 0;" />')}
            </div>
          `;
          const opt = {
            margin:       15,
            filename:     `${filename}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };
          window.html2pdf().set(opt).from(element).save();
        }
      };

      const resetConditions = () => {
        setAnalysisType('summary');
        setChartTitle('');
        setColorPalette('default');
        setBgColor('white');
        setXAxis('デフォルト（行/データ順）');
        setYAxisChk(cols.numeric.length ? cols.numeric.slice(0, 3) : [cols.all[0]]);
        setActiveFilters({});
        setDateFilterCol('');
        setStartDate('');
        setEndDate('');
        setNoDataMsg('');
        setSummaryData(null);
        setChartDataForAI(null);
        const chartArea = document.getElementById('chart-area');
        if (chartArea && window.Plotly) window.Plotly.purge(chartArea);
      };

      const swapAxes = () => {
        const prevX = xAxis;
        const prevY = yAxisChk.length > 0 ? yAxisChk[0] : null;

        if (prevY) {
          setXAxis(prevY);
        } else {
          setXAxis('デフォルト（行/データ順）');
        }

        if (prevX && prevX !== 'デフォルト（行/データ順）') {
          setYAxisChk([prevX]);
        } else {
          setYAxisChk([]);
        }
      };

      return (
        <div className="flex h-full overflow-hidden relative">
          <div className="w-80 min-w-[320px] border-r p-5 overflow-y-auto bg-slate-50 shrink-0 custom-scrollbar flex flex-col">
            
            <div className="flex items-center justify-between mb-2 relative">
              <label className="block text-sm font-bold text-slate-700">分析手法の選択</label>
              <div 
                className="text-slate-400 hover:text-blue-500 cursor-help"
                onMouseEnter={() => setShowTooltip(true)}
                onMouseLeave={() => setShowTooltip(false)}
              >
                <Icons.Info className="w-5 h-5" />
              </div>
              {showTooltip && (
                <div className="absolute top-6 left-0 mt-2 w-full bg-slate-800 text-white text-xs p-3 rounded-lg shadow-xl z-50 animate-in">
                  <div className="font-bold text-blue-300 mb-1 flex items-center">
                    <Icons.Info className="w-3.5 h-3.5 mr-1" />
                    {typeInfo?.name.split('. ')[1]}
                  </div>
                  <div className="leading-relaxed">{typeInfo?.desc}</div>
                </div>
              )}
            </div>

            <div className="relative mb-4">
              <select value={analysisType} onChange={e => setAnalysisType(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg p-2.5 pr-8 bg-white outline-none shadow-sm font-medium appearance-none cursor-pointer">
                {['基礎', '推移・傾向', '比較', '分布', '関係性', '構成比', '高度な分析', '株式・金融'].map(g => (
                  <optgroup key={g} label={`--- ${g} ---`}>
                    {ANALYSIS_TYPES.filter(t => t.group === g).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </optgroup>
                ))}
              </select>
              <div className="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none text-slate-400">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>

            <div className="mb-4 bg-white p-3 rounded-lg border border-slate-200 shadow-sm animate-in">
              <label className="block text-xs font-bold text-slate-500 mb-2 flex items-center"><Icons.Filter className="w-3 h-3 mr-1" /> データの絞り込み</label>
              
              {cols.date && cols.date.length > 0 && (
                <div className="mb-3 border-b border-slate-100 pb-3">
                  <span className="text-[10px] font-bold text-slate-400 mb-1 block">期間で絞り込み</span>
                  <select value={dateFilterCol} onChange={e => handleDateColChange(e.target.value)} className="w-full text-xs border border-slate-300 rounded p-1.5 mb-1 bg-slate-50 outline-none text-slate-700 font-bold">
                    <option value="">-- 日付列を選択 --</option>

                      <span className="text-slate-400 text-xs font-bold">〜</span>
                      <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} className="w-full text-[10px] border border-slate-300 rounded p-1 outline-none text-slate-700 bg-white" />

              <div>
                <span className="text-[10px] font-bold text-slate-400 mb-1 block">項目で絞り込み (特定の値のみ抽出)</span>
                {!keyColumn ? (
                  <div className="text-[10px] text-slate-500 bg-slate-100 p-2 rounded">
                    ※編集画面で列名の「★」をクリックして項目を指定すると、絞り込み機能が有効になります。
                  </div>

                  <Fragment>
                    <select onChange={(e) => { 
                        const col = e.target.value;

                           const uniqueVals = [...new Set(processedData.map(d => String(d[col] || '')))].sort();
                           setActiveFilters(prev => ({...prev, [col]: uniqueVals}));

                      }} className="w-full text-xs border border-slate-300 rounded p-1.5 bg-slate-50 outline-none text-slate-700 font-bold mb-2">
                      <option value="">＋ フィルターを追加</option>
                      {!activeFilters[keyColumn] && <option value={keyColumn}>{keyColumn}</option>}
                    </select>

                    {Object.keys(activeFilters).map(col => {
                       const uniqueVals = [...new Set(processedData.map(d => String(d[col] || '')))].sort();
                       return (
                         <div key={col} className="border border-slate-200 rounded p-2 mb-2 bg-slate-50 relative group">
                           <div className="flex justify-between items-center mb-1">
                             <span className="text-xs font-bold text-slate-700 truncate pr-5" title={col}>{col}</span>

                                setActiveFilters(prev => { const n = {...prev}; delete n[col]; return n; });

                           <div className="flex space-x-1 mb-1">
                             <button onClick={() => setActiveFilters(prev => ({...prev, [col]: uniqueVals}))} className="text-[9px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-bold hover:bg-blue-200">全て</button>
                             <button onClick={() => setActiveFilters(prev => ({...prev, [col]: []}))} className="text-[9px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-bold hover:bg-slate-300">クリア</button>
                           </div>
                           <div className="max-h-32 overflow-y-auto custom-scrollbar border border-slate-200 bg-white rounded p-1">
                             {uniqueVals.map(val => (
                               <label key={val} className="flex items-center space-x-1.5 hover:bg-slate-50 cursor-pointer p-0.5 rounded">
                                 <input type="checkbox" checked={activeFilters[col].includes(val)} onChange={() => {
                                    setActiveFilters(prev => {
                                       const cur = prev[col] || [];
                                       return {...prev, [col]: cur.includes(val) ? cur.filter(v=>v!==val) : [...cur, val]};
                                    });
                                 }} className="rounded text-blue-600 w-3 h-3 border-slate-300" />
                                 <span className="truncate text-[10px] text-slate-600 leading-tight">{val || '(空白)'}</span>
                               </label>
                             ))}
                           </div>
                         </div>
                       );
                    })}
                  </Fragment>
                )}
              </div>
            </div>

            <div className="space-y-4">
              <div>
                <label className="text-xs font-bold text-slate-500 uppercase tracking-tight mb-1 block">軸 / カテゴリ (横軸)</label>
                <select value={xAxis} onChange={e=>setXAxis(e.target.value)} className="w-full text-sm border border-slate-300 rounded-lg p-2 bg-white outline-none shadow-sm font-medium">
                  <optgroup label="システム列">
                    <option value="デフォルト（行/データ順）">デフォルト（行/データ順）</option>
                  </optgroup>
                  {cols.categorical.length > 0 && (
                    <optgroup label="カテゴリー">
                      {cols.categorical.map(c => <option key={c} value={c}>{c}</option>)}
                    </optgroup>
                  )}
                  {cols.date.length > 0 && (
                    <optgroup label="日付データ">
                      {cols.date.map(c => <option key={c} value={c}>{c}</option>)}
                    </optgroup>
                  )}
                  {cols.dateExtended.length > 0 && (
                    <optgroup label="日付 (年・月)">
                      {cols.dateExtended.map(c => <option key={c} value={c}>{c}</option>)}
                    </optgroup>
                  )}
                  {cols.numeric.length > 0 && (
                    <optgroup label="数値データ">
                      {cols.numeric.map(c => <option key={c} value={c}>{c}</option>)}
                    </optgroup>
                  )}
                </select>
              </div>

              <div className="flex justify-center -my-2 relative z-10">
                 <button onClick={swapAxes} className="bg-white hover:bg-slate-50 text-slate-600 border border-slate-300 shadow-sm px-3 py-1 rounded-full text-[10px] font-bold flex items-center transition-colors" title="X軸とY軸(の最初の項目)を入れ替えます">
                   <Icons.ArrowDownUp className="w-3 h-3 mr-1" /> X軸・Y軸を入れ替え
                 </button>
              </div>

              <div>
