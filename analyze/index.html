<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統計データソースDB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.292.0",
      "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Plus, Trash2, ExternalLink, AlertCircle, Search, X, Edit2, Upload, Database, ChevronUp, ChevronDown, ArrowUpDown, RotateCcw, Layers, CopyPlus, Link as LinkIcon, CheckCircle2, ListFilter } from 'lucide-react';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, doc, getDocs, onSnapshot, addDoc, updateDoc, deleteDoc, writeBatch } from 'firebase/firestore';

    const firebaseConfig = { apiKey: "AIzaSyBx5e752GWfvJDZ3lEx0IcArxjvCEz7S2M", authDomain: "seisakuresearch00.firebaseapp.com", projectId: "seisakuresearch00", storageBucket: "seisakuresearch00.firebasestorage.app", messagingSenderId: "356788263577", appId: "1:356788263577:web:ecc3782d0c82cb7da43608", measurementId: "G-Y1C3GPNC9Z" };
    const appId = 'seisakuresearch';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function App() {
      const [view, setView] = useState('home');
      const [user, setUser] = useState(null);
      const [sites, setSites] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isEditModalOpen, setIsEditModalOpen] = useState(false);
      const [editSite, setEditSite] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminClickCount, setAdminClickCount] = useState(0);
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [sortConfig, setSortConfig] = useState({ key: 'no', direction: 'asc' });
      const [confirmModal, setConfirmModal] = useState({ open: false, title: '', message: '', onConfirm: null });
      const [importModal, setImportModal] = useState({ open: false, pendingRows: [] });
      const [toast, setToast] = useState(null);

      const notify = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };

      useEffect(() => {
        const initAuth = async () => { try { await signInAnonymously(auth); } catch (error) { notify("認証に失敗", "error"); } };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const statsCol = collection(db, 'artifacts', appId, 'public', 'data', 'statistics');
        const unsubscribe = onSnapshot(statsCol, (snapshot) => {
          const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          setSites(data);
          setLoading(false);
        }, (error) => { notify("アクセス権限がありません", "error"); setLoading(false); });
        return () => unsubscribe();
      }, [user]);

      const handleSort = (key) => { setSortConfig(prev => ({ key, direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc' })); };
      const resetAll = () => { setSearchQuery(''); setSortConfig({ key: 'no', direction: 'asc' }); };

      const processedSites = useMemo(() => {
        let result = [...sites];
        if (searchQuery) result = result.filter(site => Object.values(site).some(val => String(val).toLowerCase().includes(searchQuery.toLowerCase())));
        result.sort((a, b) => {
          let aVal = a[sortConfig.key] || '', bVal = b[sortConfig.key] || '';
          let comparison = sortConfig.key === 'no' ? (parseInt(aVal) || 0) - (parseInt(bVal) || 0) : String(aVal).localeCompare(String(bVal), 'ja');
          if (sortConfig.direction === 'desc') comparison *= -1;
          if (comparison === 0 && sortConfig.key !== 'no') return (parseInt(a.no) || 0) - (parseInt(b.no) || 0);
          return comparison;
        });
        return result;
      }, [sites, searchQuery, sortConfig]);

      const executeImport = async (rows, mode) => {
        if (!user) return; setLoading(true);
        const statsCol = collection(db, 'artifacts', appId, 'public', 'data', 'statistics');
        try {
          const existingKeys = new Set(sites.map(s => `${String(s.name).trim().toLowerCase()}|${String(s.url).trim()}`));
          if (mode === 'overwrite') {
            const snapshot = await getDocs(statsCol); const batch = writeBatch(db);
            snapshot.docs.forEach(d => batch.delete(d.ref)); await batch.commit(); existingKeys.clear();
          }
          let batch = writeBatch(db), count = 0, skipped = 0;
          for (let row of rows) {
            const siteData = { no: String(row[0] || '').trim(), name: String(row[1] || '').trim(), agency: String(row[2] || '').trim(), format: String(row[3] || '').trim(), priority: String(row[4] || '').trim(), category: String(row[5] || '').trim(), field: String(row[6] || '').trim(), frequency: String(row[7] || '').trim(), url: String(row[8] || '').trim(), updatedAt: new Date().toISOString() };
            if (siteData.name && siteData.name !== "統計名") {
              const key = `${siteData.name.toLowerCase()}|${siteData.url}`;
              if (mode === 'append' && existingKeys.has(key)) { skipped++; continue; }
              batch.set(doc(statsCol), siteData); count++;
              if (count % 400 === 0) { await batch.commit(); batch = writeBatch(db); }
            }
          }
          await batch.commit(); setImportModal({ open: false, pendingRows: [] });
          notify(`${count}件のデータを保存しました${skipped > 0 ? ` (${skipped}件の重複をスキップ)` : ''}`);
        } catch (e) { notify("エラーが発生しました", "error"); } finally { setLoading(false); }
      };

      const handleFileLoad = async (e) => {
        const file = e.target.files[0]; if (!file || !user) return;
        try {
          let rows = [];
          if (file.name.endsWith('.csv')) {
            const text = await file.text(); rows = text.split('\n').filter(r => r.trim()).map(r => r.split(','));
          } else if (file.name.endsWith('.xlsx')) {
            const data = await file.arrayBuffer(); const workbook = window.XLSX.read(data, { type: 'array' });
            rows = window.XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames.find(n => n.includes('統計')) || workbook.SheetNames[0]], { header: 1 });
          }
          const dataRows = rows.filter(r => r[0] && !isNaN(parseInt(r[0])));
          if (dataRows.length > 0) setImportModal({ open: true, pendingRows: dataRows }); else notify("有効なデータが見つかりませんでした", "error");
        } catch (err) { notify("ファイルの解析に失敗しました", "error"); }
        e.target.value = '';
      };

      const handleAdminClick = () => {
        if (isAdmin) { setView('settings'); return; }
        if (adminClickCount === 0) { notify("管理者のみしかアクセスできません", "error"); setAdminClickCount(1); } 
        else { setShowPasswordModal(true); setAdminClickCount(0); }
      };

      const handlePasswordSubmit = () => {
        if (passwordInput === 'data') { setIsAdmin(true); setShowPasswordModal(false); setPasswordInput(''); setView('settings'); notify("管理者としてログインしました"); } 
        else { notify("パスワードが間違っています", "error"); setPasswordInput(''); }
      };

      const SortIcon = ({ column }) => {
        if (sortConfig.key !== column) return <ArrowUpDown className="w-3 h-3 ml-1 opacity-20" />;
        return sortConfig.direction === 'asc' ? <ChevronUp className="w-3 h-3 ml-1 text-indigo-600" /> : <ChevronDown className="w-3 h-3 ml-1 text-indigo-600" />;
      };

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-800 text-[11px] sm:text-[12px]">
          {toast && (<div className={`fixed top-14 left-1/2 -translate-x-1/2 z-[100] px-4 py-1.5 rounded-full shadow-lg text-white font-bold flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-600' : 'bg-indigo-600'}`}>{toast.msg}</div>)}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm"><div className="max-w-[1600px] mx-auto h-12 flex items-center px-4 justify-between gap-4"><div className="flex items-center gap-2"><div className="bg-indigo-600 p-1.5 rounded-lg shadow-lg text-white"><Database className="w-4 h-4" /></div><span className="font-bold text-[15px] hidden lg:block">統計データソースDB</span></div><div className="flex items-center gap-2 flex-1 max-w-2xl"><div className="relative w-full group"><Search className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" /><input type="text" placeholder="名称、所管、分野などで横断検索..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-9 pr-10 py-2 bg-slate-100 border-none rounded-full text-[12px] outline-none" />{searchQuery && (<button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-500"><X className="w-4 h-4" /></button>)}</div><button onClick={resetAll} className="p-2 bg-white border rounded-full hover:bg-slate-50 text-slate-500"><RotateCcw className="w-4 h-4" /></button></div><div className="flex items-center gap-3"><div className="flex flex-col items-end"><span className="text-[9px] text-slate-400 font-bold uppercase">Record Count</span><span className="text-[14px] font-black text-indigo-600 leading-none">{processedSites.length}</span></div><div className="h-8 w-px bg-slate-200 mx-1"></div><nav className="flex gap-2"><button onClick={() => setView('home')} className={`px-4 py-1.5 rounded-full font-bold ${view === 'home' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}>ホーム</button><button onClick={handleAdminClick} className={`px-4 py-1.5 rounded-full font-bold ${view === 'settings' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-100'}`}>管理</button></nav></div></div></header>
          <main className="max-w-[1600px] mx-auto p-4 pb-20"><div className="bg-white border rounded-xl shadow-sm overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-left border-collapse table-auto"><thead className="bg-slate-50 border-b sticky top-0 z-10"><tr className="text-[10px] font-bold text-slate-500 uppercase whitespace-nowrap"><th onClick={() => handleSort('no')} className="px-3 py-3 w-[60px] cursor-pointer hover:bg-slate-100 border-r"><div className="flex items-center">No <SortIcon column="no" /></div></th><th onClick={() => handleSort('name')} className="px-4 py-3 min-w-[280px] cursor-pointer hover:bg-slate-100"><div className="flex items-center">統計名 <SortIcon column="name" /></div></th><th onClick={() => handleSort('agency')} className="px-4 py-3 min-w-[140px] cursor-pointer hover:bg-slate-100"><div className="flex items-center">所管 <SortIcon column="agency" /></div></th><th onClick={() => handleSort('format')} className="px-4 py-3 w-[100px] cursor-pointer hover:bg-slate-100"><div className="flex items-center">形式 <SortIcon column="format" /></div></th><th onClick={() => handleSort('priority')} className="px-4 py-3 w-[80px] cursor-pointer hover:bg-slate-100 text-center border-x"><div className="flex items-center justify-center">優先度 <SortIcon column="priority" /></div></th><th onClick={() => handleSort('category')} className="px-4 py-3 w-[120px] cursor-pointer hover:bg-slate-100"><div className="flex items-center">区分 <SortIcon column="category" /></div></th><th onClick={() => handleSort('field')} className="px-4 py-3 min-w-[120px] cursor-pointer hover:bg-slate-100"><div className="flex items-center">分野 <SortIcon column="field" /></div></th><th onClick={() => handleSort('frequency')} className="px-4 py-3 w-[120px] cursor-pointer hover:bg-slate-100"><div className="flex items-center">更新頻度 <SortIcon column="frequency" /></div></th>{view === 'settings' && <th className="px-4 py-3 w-[100px] text-right bg-slate-100/50">管理</th>}</tr></thead><tbody className="divide-y divide-slate-100 text-[12px]">{loading ? (<tr><td colSpan="9" className="py-20 text-center"><div className="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mx-auto"></div></td></tr>) : processedSites.length === 0 ? (<tr><td colSpan="9" className="py-20 text-center text-slate-400">データなし</td></tr>) : processedSites.map(site => (<tr key={site.id} className="hover:bg-indigo-50/20 group"><td className="px-3 py-2.5 font-mono text-slate-400 border-r">{site.no}</td><td className="px-4 py-2.5"><a href={site.url} target="_blank" className="font-bold text-indigo-600 hover:underline flex items-center gap-1">{site.name}<ExternalLink className="w-3 h-3 opacity-0 group-hover:opacity-100" /></a></td><td className="px-4 py-2.5">{site.agency}</td><td className="px-4 py-2.5 text-slate-500">{site.format}</td><td className="px-4 py-2.5 text-amber-500 font-bold text-center border-x">{site.priority}</td><td className="px-4 py-2.5"><span className="px-2 py-0.5 rounded-[4px] text-[10px] font-bold border bg-blue-50 text-blue-600 border-blue-100">{site.category}</span></td><td className="px-4 py-2.5 text-slate-600">{site.field}</td><td className="px-4 py-2.5 text-slate-500">{site.frequency}</td>{view === 'settings' && (<td className="px-4 py-2.5 text-right bg-slate-50/30"><div className="flex justify-end gap-1"><button onClick={() => { setEditSite(site); setIsEditModalOpen(true); }} className="p-1.5 text-slate-400 hover:text-indigo-600"><Edit2 className="w-4 h-4" /></button><button onClick={() => { setConfirmModal({ open: true, title: "削除確認", message: "削除しますか？", onConfirm: () => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'statistics', site.id)) }); }} className="p-1.5 text-slate-400 hover:text-red-500"><Trash2 className="w-4 h-4" /></button></div></td>)}</tr>))}</tbody></table></div></div>
            {view === 'settings' && (<div className="fixed bottom-8 right-8 flex flex-col gap-2 p-3 bg-white border rounded-2xl shadow-2xl"><label className="cursor-pointer flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-700 rounded-xl font-bold"><Upload className="w-4 h-4" /> CSV読込 <input type="file" accept=".csv, .xlsx" className="hidden" onChange={handleFileLoad} /></label><button onClick={() => { setEditSite({ no: '', name: '', agency: '', category: '国内統計', priority: '', frequency: '', url: '', format: '', field: '' }); setIsEditModalOpen(true); }} className="flex items-center gap-2 px-4 py-2.5 bg-indigo-600 text-white rounded-xl font-bold"><Plus className="w-4 h-4" /> 追加</button></div>)}
          </main>
          {importModal.open && (<div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-slate-900/60"><div className="bg-white rounded-3xl w-full max-w-sm p-6 text-center"><h3 className="text-lg font-bold mb-2">データの取込</h3><p className="text-xs mb-4">{importModal.pendingRows.length} 件</p><div className="flex flex-col gap-2"><button onClick={() => executeImport(importModal.pendingRows, 'append')} className="py-3 border-2 border-indigo-600 text-indigo-600 rounded-xl font-bold">追加</button><button onClick={() => executeImport(importModal.pendingRows, 'overwrite')} className="py-3 bg-indigo-600 text-white rounded-xl font-bold">上書き</button><button onClick={() => setImportModal({ open: false, pendingRows: [] })} className="py-3 text-slate-400 font-bold">キャンセル</button></div></div></div>)}
          {confirmModal.open && (<div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/60"><div className="bg-white rounded-3xl p-6 text-center w-full max-w-xs"><h3 className="font-bold mb-2">{confirmModal.title}</h3><p className="text-sm mb-6">{confirmModal.message}</p><div className="flex gap-2"><button onClick={() => setConfirmModal({ ...confirmModal, open: false })} className="flex-1 py-2.5 bg-slate-100 rounded-xl font-bold">いいえ</button><button onClick={() => { confirmModal.onConfirm(); setConfirmModal({ ...confirmModal, open: false }); }} className="flex-1 py-2.5 bg-rose-600 text-white rounded-xl font-bold">はい</button></div></div></div>)}
          {isEditModalOpen && (<div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60"><div className="bg-white rounded-2xl w-full max-w-lg p-6"><h3 className="font-bold text-lg mb-4">編集・登録</h3><div className="grid grid-cols-2 gap-3"><input type="text" placeholder="No" value={editSite.no} onChange={e=>setEditSite({...editSite,no:e.target.value})} className="border p-2 rounded" /><input type="text" placeholder="優先度" value={editSite.priority} onChange={e=>setEditSite({...editSite,priority:e.target.value})} className="border p-2 rounded" /><input type="text" placeholder="統計名" value={editSite.name} onChange={e=>setEditSite({...editSite,name:e.target.value})} className="col-span-2 border p-2 rounded" /><input type="text" placeholder="URL" value={editSite.url} onChange={e=>setEditSite({...editSite,url:e.target.value})} className="col-span-2 border p-2 rounded" /><input type="text" placeholder="所管" value={editSite.agency} onChange={e=>setEditSite({...editSite,agency:e.target.value})} className="border p-2 rounded" /><input type="text" placeholder="形式" value={editSite.format} onChange={e=>setEditSite({...editSite,format:e.target.value})} className="border p-2 rounded" /><input type="text" placeholder="区分" value={editSite.category} onChange={e=>setEditSite({...editSite,category:e.target.value})} className="border p-2 rounded" /><input type="text" placeholder="更新頻度" value={editSite.frequency} onChange={e=>setEditSite({...editSite,frequency:e.target.value})} className="border p-2 rounded" /><input type="text" placeholder="分野" value={editSite.field} onChange={e=>setEditSite({...editSite,field:e.target.value})} className="col-span-2 border p-2 rounded" /></div><div className="flex gap-2 mt-6"><button onClick={() => setIsEditModalOpen(false)} className="flex-1 py-2 bg-slate-100 rounded-xl font-bold">キャンセル</button><button onClick={() => { const finalData = { ...editSite, updatedAt: new Date().toISOString() }; if (editSite.id) updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'statistics', editSite.id), finalData); else addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'statistics'), finalData); setIsEditModalOpen(false); notify("保存しました"); }} className="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">保存</button></div></div></div>)}
          {showPasswordModal && (<div className="fixed inset-0 z-[130] flex items-center justify-center p-4 bg-slate-900/60"><div className="bg-white rounded-2xl p-6 text-center w-full max-w-sm"><h3 className="font-bold text-lg mb-4">管理者パスワード</h3><input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') handlePasswordSubmit(); }} className="w-full border p-3 rounded-xl mb-4 text-center font-mono" autoFocus /><div className="flex gap-2"><button onClick={() => { setShowPasswordModal(false); setPasswordInput(''); }} className="flex-1 py-2 bg-slate-100 rounded-xl font-bold">戻る</button><button onClick={handlePasswordSubmit} className="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold">ログイン</button></div></div></div>)}
        </div>
      );
    }
    const root = createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
  </textarea>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Fragment, forwardRef, useImperativeHandle } = React;

    const COLOR_PALETTES = {

    const excelSerialToDateString = (serial) => {
      let num = Number(serial);
      if (isNaN(num) || num < 10000 || num > 90000) return serial;
      try {
        const utc_days = Math.floor(num - 25569);
        const d = new Date(utc_days * 86400 * 1000);
        if (isNaN(d.getTime())) return serial;
        return d.toISOString().split('T')[0];
      } catch(e) { return serial; }
    };

    const smartFormatDate = (val, header = "") => {
      if (val === undefined || val === null || val === "") return "";
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      
      if (typeof val === 'number' || (!isNaN(Number(s)) && s !== '')) {
        const num = Number(s);
        const dateKeywords = ["日付", "日", "date", "day", "年", "year", "月", "month", "time", "期間"];
        if (dateKeywords.some(kw => header.toLowerCase().includes(kw)) || (num > 30000 && num < 60000)) {
          const res = excelSerialToDateString(num);
          if (typeof res === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(res)) return res;
        }
        if (s.length === 8 && num > 19000000 && num < 21000000) {
            const y = s.substring(0,4), m = s.substring(4,6), d = s.substring(6,8);
            const dateObj = new Date(`${y}-${m}-${d}`);
            if (!isNaN(dateObj.getTime())) return `${y}-${m}-${d}`;
        }
      }

      if (/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(s) || /^\d{4}年\d{1,2}月\d{1,2}日$/.test(s)) {
        const clean = s.replace(/年|月/g, '-').replace(/日/g, '').replace(/\//g, '-').replace(/\./g, '-');
        const d = new Date(clean);
        return isNaN(d.getTime()) ? s : d.toISOString().split('T')[0];
      }
      return s;
    };

    const analyzeColumns = (data, columnOrder = null) => {
      if(!data || data.length === 0) return { numeric: [], categorical: [], date: [], all: [] };
      const keys = columnOrder || Object.keys(data[0]);
      const num = [], cat = [], dt = [];
      const dateKeywords = ["日付", "日", "date", "day", "年", "year", "月", "month", "調査日", "期間"];
      
      keys.forEach(k => {
        let nC = 0, vC = 0, dC = 0;
        for(let i = 0; i < Math.min(data.length, 100); i++) {
          const v = data[i][k];
          if(v !== undefined && v !== null && v !== '') {
            vC++;
            const fmt = smartFormatDate(v, k);
            if (/^\d{4}-\d{2}-\d{2}$/.test(fmt)) {
                dC++;
            } else if (!isNaN(Number(v))) {
                nC++;
            }
          }
        }
        if (vC > 0) {
          if (dC / vC > 0.3 || (dateKeywords.some(kw => k.toLowerCase().includes(kw)) && dC > 0)) {
              dt.push(k);
          } else if (nC / vC > 0.7) {
              num.push(k);
          } else {
              cat.push(k);
          }
        }
      });
      return { numeric: num, categorical: cat, date: dt, all: keys };
    };

    const callGemini = async (prompt, base64Image = null, history = []) => {
      const apiKey = localStorage.getItem('gemini_api_key');
      let aiModel = localStorage.getItem('gemini_api_model') || 'gemini-2.5-flash';
      if (aiModel.includes('1.5') || aiModel === 'gemini-pro') {
        aiModel = 'gemini-2.5-flash';
        localStorage.setItem('gemini_api_model', aiModel);
      }
      if (!apiKey) throw new Error("APIキーが設定されていません。右上の「API設定」からGemini APIキーを登録してください。");

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${aiModel}:generateContent?key=${apiKey}`;
      let contents = [];
      if (history && history.length > 0) {
          history.forEach(m => {
              contents.push({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.text }] });
          });
      }
      
      let currentParts = [{ text: prompt }];
      if (base64Image) {
          const base64Data = base64Image.replace(/^data:image\/\w+;base64,/, "");
          currentParts.push({ inlineData: { mimeType: "image/png", data: base64Data } });
      }
      contents.push({ role: "user", parts: currentParts });

      const payload = {
        contents: contents,
        systemInstruction: { parts: [{ text: "あなたはプロの金融・データアナリストです。提供された実際の集計データ、統計量、およびグラフ画像に基づいて、主要な傾向や示唆を日本語で提供してください。一般的な説明は避け、必ず具体的な「数値（平均、変動率、差分など）」や「視覚的な特徴」を引用し、推測ではなくデータに基づいた実践的な洞察を、箇条書きと太字を活用して分かりやすく記述してください。" }] }
      };
      
      let delay = 1000;
      let lastErrorMsg = "";
      for (let attempt = 1; attempt <= 3; attempt++) {
          try {
              const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
              if (!response.ok) {
                  let errObj = {};
                  try { errObj = await response.json(); } catch(e) {}
                  throw new Error(`APIエラー (${response.status}): ${errObj.error?.message || JSON.stringify(errObj)}`);
              }
              const result = await response.json();
              if (result.candidates && result.candidates[0]?.content?.parts?.[0]?.text) {
                  return result.candidates[0].content.parts[0].text;
              } else throw new Error("AIから有効なテキストが返却されませんでした。");
          } catch (error) {
              lastErrorMsg = error.message;
              if (attempt === 3 || error.message.includes("APIエラー (400)") || error.message.includes("APIエラー (403)")) throw new Error(lastErrorMsg);
              await new Promise(resolve => setTimeout(resolve, delay));

          {showHistoryModal && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay animate-in">
              <div className="bg-white w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col h-[75vh] overflow-hidden border border-white/20">
                <div className="bg-slate-100 px-6 py-4 border-b flex justify-between items-center">
                  <div className="flex items-center space-x-2 font-bold text-slate-800"><Icons.History className="w-5 h-5 text-slate-500" /><span>AI分析レポートの履歴</span></div>
                  <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-600 transition-colors"><Icons.X className="w-5 h-5" /></button>
                </div>
                <div className="p-6 overflow-y-auto flex-1 bg-slate-50 custom-scrollbar">
                  {savedReports.length === 0 ? (
                    <div className="h-full flex flex-col items-center justify-center text-slate-400">
                      <Icons.History className="w-12 h-12 mb-3 opacity-20" /><p className="font-bold text-sm">保存された分析履歴はありません</p><p className="text-xs mt-1">AI分析を実行すると自動的にここに保存されます</p>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {savedReports.map(r => (
                        <div key={r.id} className="bg-white border border-slate-200 p-4 rounded-xl flex justify-between items-center shadow-sm hover:border-indigo-200 transition-colors group">
                          <div className="min-w-0 pr-4"><h4 className="font-bold text-slate-800 text-sm mb-1 truncate">{r.title}</h4><p className="text-xs text-slate-500">{r.date} · 💬 {r.history.length}ターンのやり取り</p></div>
                          <div className="flex space-x-2 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity md:opacity-100">
                            <button onClick={() => { setCurrentSessionId(r.id); setCurrentReportTitle(r.title); setChatHistory(r.history); setShowHistoryModal(false); setIsModalOpen(true); }} className="px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white rounded-lg text-xs font-bold transition-colors border border-indigo-100">開く</button>
                            <button onClick={() => { const updated = savedReports.filter(x => x.id !== r.id); setSavedReports(updated); localStorage.setItem('universal_analyzer_ai_reports', JSON.stringify(updated)); }} className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors border border-transparent hover:border-red-100" title="削除"><Icons.Trash className="w-4 h-4"/></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    });

    // ==========================================
    // 6. ワークスペースラッパー コンポーネント
    // ==========================================
    const AnalysisWorkspaceWrapper = ({ rawData, fileName, onReset, onOpenSettings, onLoadNewFile }) => {
      const initialGrid = useMemo(() => rawData.map(r => {
        const nr = {...r}; Object.keys(nr).forEach(k => { const f = smartFormatDate(nr[k], k); if(/^\d{4}-\d{2}-\d{2}$/.test(f)) nr[k]=f; }); return nr;
      }), [rawData]);
      
      const [gridData, setGridData] = useState(initialGrid);
      const [gridColumns, setGridColumns] = useState(() => Object.keys(initialGrid[0] || {}));
      const [keyColumn, setKeyColumn] = useState(null);
      
      const [viewMode, setViewMode] = useState('analysis');
      const [isManualOpen, setIsManualOpen] = useState(false);
      const [isDataSourceOpen, setIsDataSourceOpen] = useState(false);
      
      const [clipboard, setClipboard] = useState({ type: null, data: null });
      const [toastMsg, setToastMsg] = useState('');
      
      const [history, setHistory] = useState([]);
      const focusedGridSnapshot = useRef(null);
      const analysisPanelRef = useRef(null);

      // 新しいファイルが読み込まれた時に画面のデータを更新・初期化する
      useEffect(() => {
        setGridData(initialGrid);
        setGridColumns(Object.keys(initialGrid[0] || {}));
        setKeyColumn(null);
        setHistory([]);
      }, [initialGrid]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 4000);
      };

      const pushHistory = (gridSnap, colSnap, keyColSnap = keyColumn) => {
        if (!gridSnap || !colSnap) return;
        setHistory(h => {
          const newH = [...h, { grid: gridSnap, cols: colSnap, keyCol: keyColSnap }];
          if (newH.length > 50) return newH.slice(newH.length - 50);
          return newH;
        });
      };

      const undo = () => {
        if (history.length === 0) return;
        const previous = history[history.length - 1];
        setGridData(previous.grid);
        setGridColumns(previous.cols);
        setKeyColumn(previous.keyCol || null);
        setHistory(h => h.slice(0, -1));
        showToast('1つ前の状態に戻しました。');
      };

      const resetGrid = () => {
        pushHistory(gridData, gridColumns);
        setGridData(initialGrid);
        setGridColumns(Object.keys(initialGrid[0] || {}));
        setKeyColumn(null);
        showToast('最初の状態にリセットしました。');
      };

      // analyzeColumns に現在の列順序を渡すように変更
      const cols = useMemo(() => {
        const c = analyzeColumns(gridData, gridColumns);
        const ext = [];
        gridData.forEach(row => c.date.forEach(dk => {
          const d = new Date(row[dk]); if(!isNaN(d.getTime())){
            const yk = `${dk} (年)`, ymk = `${dk} (年月)`;
            if(!ext.includes(yk)) ext.push(yk); if(!ext.includes(ymk)) ext.push(ymk);
          }
        }));
        return { ...c, dateExtended: ext, allExtended: ['デフォルト（行/データ順）', ...c.all, ...ext] };
      }, [gridData, gridColumns]);

      const processedData = useMemo(() => gridData.map((r, i) => {
        const nr = {...r}; 
        nr['デフォルト（行/データ順）'] = i + 1;
        cols.date.forEach(dk => {
          const d = new Date(r[dk]); if(!isNaN(d.getTime())){
            nr[`${dk} (年)`] = d.getFullYear() + "年";
            nr[`${dk} (年月)`] = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
          }
        }); return nr;
      }), [gridData, cols]);

      // 編集画面等でCtrl+Vを押した際、既存データにコピーしたデータを追加する
      useEffect(() => {
        const handleWorkspacePaste = (e) => {
          // 入力フォーム(セル等)にフォーカスがある場合は通常のペーストを優先
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

          const clipboardData = e.clipboardData || window.clipboardData;
          if (!clipboardData) return;
          const htmlData = clipboardData.getData('text/html');
          const textData = clipboardData.getData('text/plain');
          if (!textData && !htmlData) return;

          try {
            let wb;
            if (htmlData && htmlData.includes('<table')) {
              const doc = new DOMParser().parseFromString(htmlData, 'text/html');
              const table = doc.querySelector('table');
              if (table) {
                const ws = window.XLSX.utils.table_to_sheet(table);
                wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
              } else { wb = window.XLSX.read(textData, {type: 'string'}); }
            } else if (textData) { wb = window.XLSX.read(textData, {type: 'string'}); }

            if (wb) {
               const pastedJson = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
               if (pastedJson.length > 0) { 
                   pushHistory(gridData, gridColumns);
                   
                   const newKeys = Object.keys(pastedJson[0]);
                   let updatedCols = [...gridColumns];
                   newKeys.forEach(k => {
                       if (!updatedCols.includes(k)) updatedCols.push(k);
                   });
                   
                   const appendedData = [...gridData];
                   pastedJson.forEach(row => {
                       const newRow = {};
                       updatedCols.forEach(col => {
                           newRow[col] = row[col] !== undefined ? row[col] : "";
                       });
                       appendedData.push(newRow);
                   });
                   
                   setGridColumns(updatedCols);
                   setGridData(appendedData);
                   showToast(`クリップボードから ${pastedJson.length} 件のデータを末尾に追加しました。`);
               }
            }
          } catch (err) { console.error(err); showToast('ペーストされたデータの追加に失敗しました。'); }
        };

        window.addEventListener('paste', handleWorkspacePaste);
        return () => window.removeEventListener('paste', handleWorkspacePaste);
      }, [gridData, gridColumns]);

      const transposeData = () => {
        if (!gridData.length) return;
        pushHistory(gridData, gridColumns);
        
        const f = keyColumn && gridColumns.includes(keyColumn) ? keyColumn : gridColumns[0];
        const remainingCols = gridColumns.filter(c => c !== f);
        
        const nh = ["項目", ...gridData.map((r, i) => String(r[f] || i + 1))];
        setGridColumns(nh);
        setGridData(remainingCols.map(k => {
          const nr = { "項目": k }; gridData.forEach((or, i) => nr[nh[i+1]] = smartFormatDate(or[k], k)); return nr;
        }));
        setKeyColumn(null);
        showToast('行列を入れ替えました。');
      };

      const deleteColumn = (colKey) => {
        if (gridColumns.length <= 1) return;
        pushHistory(gridData, gridColumns);
        setGridColumns(prev => prev.filter(c => c !== colKey));
        setGridData(prev => prev.map(row => { const newRow = { ...row }; delete newRow[colKey]; return newRow; }));
        if (keyColumn === colKey) setKeyColumn(null);
      };

      const deleteRow = (rIdx) => {
        if (gridData.length <= 1) return; 
        pushHistory(gridData, gridColumns);
        setGridData(prev => prev.filter((_, i) => i !== rIdx));
      };

      const insertColumnAfter = (targetKey) => {
        if (!gridData.length) return;
        pushHistory(gridData, gridColumns);
        let newCol = "新規列";
        let i = 1;
        while(gridColumns.includes(newCol)) { newCol = `新規列${i++}`; }
        
        setGridColumns(prev => {
           const idx = prev.indexOf(targetKey);
           const next = [...prev];
           next.splice(idx + 1, 0, newCol);
           return next;
        });
        setGridData(prev => prev.map(row => ({ ...row, [newCol]: "" })));
      };

      const insertRowAfter = (rIdx) => {
        if (!gridData.length) return;
        pushHistory(gridData, gridColumns);
        setGridData(prev => {
          const newRow = {};
          gridColumns.forEach(k => newRow[k] = "");
          const newData = [...prev];
          newData.splice(rIdx + 1, 0, newRow);
          return newData;
        });
      };

      const copyColumn = (colKey) => {
        if (!gridData.length) return;
        const colValues = gridData.map(r => r[colKey]);
        setClipboard({ type: 'col', data: { key: colKey, values: colValues } });
        showToast(`列「${colKey}」をコピーしました。好きな位置でペーストしてください。`);
      };

      const pasteColumnAfter = (targetKey) => {
        if (clipboard.type !== 'col' || !clipboard.data) return;
        pushHistory(gridData, gridColumns);
        let newCol = `${clipboard.data.key}_コピー`;
        let i = 1;
        while(gridColumns.includes(newCol)) { newCol = `${clipboard.data.key}_コピー${i++}`; }
        
        setGridColumns(prev => {
           const idx = prev.indexOf(targetKey);
           const next = [...prev];
           next.splice(idx + 1, 0, newCol);
           return next;
        });
        setGridData(prev => prev.map((row, idx) => ({ ...row, [newCol]: clipboard.data.values[idx] !== undefined ? clipboard.data.values[idx] : "" })));
        showToast('列をペーストしました。');
      };

      const copyRow = (rIdx) => {
        if (!gridData.length) return;
        setClipboard({ type: 'row', data: { ...gridData[rIdx] } });
        showToast(`${rIdx + 1}行目をコピーしました。好きな位置でペーストしてください。`);
      };

      const pasteRowAfter = (rIdx) => {
        if (clipboard.type !== 'row' || !clipboard.data) return;
        pushHistory(gridData, gridColumns);
        setGridData(prev => {
          const newData = [...prev];
          newData.splice(rIdx + 1, 0, { ...clipboard.data });
          return newData;
        });
        showToast('行をペーストしました。');
      };

      const pasteRowToHeader = () => {
        if (clipboard.type !== 'row' || !clipboard.data) return;
        pushHistory(gridData, gridColumns);
        
        const newKeys = [];
        const usedKeys = new Set();

        gridColumns.forEach(oldKey => {
          let proposedKey = clipboard.data[oldKey];
          if (proposedKey === undefined || proposedKey === null || String(proposedKey).trim() === '') {
             proposedKey = '列名未設定';
          } else {
             proposedKey = String(proposedKey).trim();
          }
          let finalKey = proposedKey;
          let counter = 1;
          while (usedKeys.has(finalKey)) {
             finalKey = `${proposedKey}_${counter}`;
             counter++;
          }
          usedKeys.add(finalKey);
          newKeys.push(finalKey);
        });

        setGridColumns(newKeys);
        setGridData(prev => prev.map(row => {
          const newRow = {};
          gridColumns.forEach((oldKey, idx) => {
            newRow[newKeys[idx]] = row[oldKey];
          });
          return newRow;
        }));
        showToast('コピーした行をヘッダー(列名)に適用しました。');
      };

      const reverseRows = () => {
        if (gridData.length <= 1) return;
        pushHistory(gridData, gridColumns);
        setGridData(prev => [...prev].reverse());
        showToast('行の順序を上下反転しました。');
      };

      const reverseColumns = () => {
        if (!gridColumns.length) return;
        pushHistory(gridData, gridColumns);
        setGridColumns(prev => [...prev].reverse());
        showToast('列の順序を左右反転しました。');
      };

      const convertToNumber = (val) => {
        if (val === undefined || val === null || val === '') return val;
        let cleanVal = String(val).replace(/[,¥\\ ]/g, '');
        let num = Number(cleanVal);
        if (!isNaN(num) && cleanVal !== '') return num;
        
        if (/^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(String(val)) || /^\d{4}年\d{1,2}月\d{1,2}日$/.test(String(val))) {
           const cleanDate = String(val).replace(/年|月/g, '-').replace(/日/g, '').replace(/\//g, '-').replace(/\./g, '-');
           const d = new Date(cleanDate);
           if (!isNaN(d.getTime())) {
               const utcDate = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
               return Math.floor(utcDate.getTime() / 86400000) + 25569;
           }
        }
        return val;
      };

      const convertToDate = (val, colKey = "") => {
        if (val === undefined || val === null || val === '') return val;
        let s = String(val).trim();
        let num = Number(s);
        if (!isNaN(num) && s !== '') {
            // Excelシリアル値の変換 (例: 45000)
            if (num >= 10000 && num <= 90000) {
                const res = excelSerialToDateString(num);
                if (typeof res === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(res)) return res;
            } 
            // YYYYMMDD形式の8桁の数字の変換 (例: 20230515)
            else if (s.length === 8 && num > 19000000 && num < 21000000) {
                const y = s.substring(0,4), m = s.substring(4,6), d = s.substring(6,8);
                const dateObj = new Date(`${y}-${m}-${d}`);
                if (!isNaN(dateObj.getTime())) return `${y}-${m}-${d}`;
            }
        }
        
        let formatted = smartFormatDate(val, colKey);
        if (formatted !== val) return formatted;
        
        return val;
      };

      const convertColumnType = (colKey, type) => {
        if (!gridData.length) return;
        pushHistory(gridData, gridColumns);
        setGridData(prev => prev.map(row => {
          const newRow = { ...row };
          if (type === 'number') newRow[colKey] = convertToNumber(newRow[colKey]);
          else if (type === 'date') newRow[colKey] = convertToDate(newRow[colKey], colKey);
          return newRow;
        }));
        showToast(`列「${colKey}」を${type === 'number' ? '数値' : '日付'}形式に一括変換しました。`);
      };

      const convertRowType = (rIdx, type) => {
        if (!gridData.length) return;
        pushHistory(gridData, gridColumns);
        setGridData(prev => {
          const newData = [...prev];
          const newRow = { ...newData[rIdx] };
          gridColumns.forEach(k => {
             if (type === 'number') newRow[k] = convertToNumber(newRow[k]);
             else if (type === 'date') newRow[k] = convertToDate(newRow[k], k);
          });
          newData[rIdx] = newRow;
          return newData;
        });
        showToast(`${rIdx + 1}行目を${type === 'number' ? '数値' : '日付'}形式に一括変換しました。`);
      };

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
            onLoadNewFile(e.target.files[0]);
            // 同じファイルを連続で選択できるように入力をリセット
            e.target.value = null; 
        }
      };

      return (
        <div className="flex flex-col h-[100dvh] overflow-hidden bg-slate-50">
          <header className="w-full bg-slate-900 text-white flex flex-wrap items-center justify-between px-3 md:px-6 py-2 shrink-0 z-30 gap-2 min-h-[4rem]">
            <div className="flex items-center space-x-2 md:space-x-4 shrink-0">
              <button onClick={onReset} className="p-2 hover:bg-white/10 rounded-full transition-colors"><Icons.Left className="w-5 h-5"/></button>
              <div className="hidden sm:block">
                <h1 className="font-black text-xl text-blue-400 leading-none truncate max-w-[150px] sm:max-w-xs">Universal Analyzer</h1>
                <p className="text-[10px] text-slate-400 mt-1 uppercase tracking-widest truncate max-w-[150px] sm:max-w-xs">{fileName}</p>
              </div>
            </div>
            
            <div className="flex items-center justify-center shrink-0 flex-wrap gap-2">
              {viewMode === 'analysis' && (
                <div className="flex space-x-1 md:space-x-2 border-r border-slate-700 pr-1 md:pr-3 mr-1 md:mr-2">
                  <button onClick={() => analysisPanelRef.current?.runAnalysis()} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 md:px-8 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-black transition-all shadow-md flex items-center tracking-wide">
                    <Icons.Play className="w-4 h-4 md:mr-1.5" /> <span className="hidden lg:inline">分析を実行</span>
                  </button>
                  <button onClick={() => analysisPanelRef.current?.resetConditions()} className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 md:px-3 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-bold transition-all shadow-sm border border-slate-600 flex items-center">
                    <Icons.RefreshCcw className="w-3.5 h-3.5 md:mr-1" /> <span className="hidden lg:inline">初期化</span>
                  </button>
                </div>
              )}

              <div className="flex bg-slate-800 rounded-xl p-1 border border-white/10 shrink-0">
                <button onClick={() => setViewMode('analysis')} className={`flex items-center px-3 md:px-6 py-1.5 md:py-2 rounded-lg text-sm font-bold transition-all ${viewMode === 'analysis' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                  <Icons.Chart className="w-4 h-4 md:mr-2" /> <span className="hidden sm:inline">分析</span>
                </button>
                <button onClick={() => setViewMode('editor')} className={`flex items-center px-3 md:px-6 py-1.5 md:py-2 rounded-lg text-sm font-bold transition-all ${viewMode === 'editor' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                  <Icons.Table className="w-4 h-4 md:mr-2" /> <span className="hidden sm:inline">編集</span>
                </button>
              </div>

              <div className="border-l border-slate-700 pl-1 md:pl-3 ml-1 md:ml-2 flex items-center hidden sm:flex shrink-0">
                 <div className="relative group flex items-center">
                   <input type="file" accept=".csv,.xlsx,.xls" onChange={handleFileChange} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                   <button className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 md:px-3 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-bold transition-all shadow-sm border border-slate-600 flex items-center">
                     <Icons.Upload className="w-3.5 h-3.5 md:mr-1" /> <span className="hidden lg:inline">ファイル読込</span>
                   </button>
                 </div>
                 <button onClick={() => setIsDataSourceOpen(true)} className="bg-indigo-600 hover:bg-indigo-500 text-white px-2 md:px-3 py-1.5 md:py-2 rounded-lg text-xs md:text-sm font-bold transition-all shadow-sm border border-indigo-500 flex items-center ml-2">
                   <Icons.Database className="w-3.5 h-3.5 md:mr-1" /> <span className="hidden lg:inline">データソース</span>
                 </button>
              </div>
            </div>
            
            <div className="flex items-center justify-end space-x-1 md:space-x-3 shrink-0">
              <div className="hidden xl:block font-black text-blue-500 text-[10px] animate-pulse tracking-tighter border border-blue-500/30 px-2 py-1 rounded bg-blue-500/10">AI READY</div>
              <button onClick={() => setIsManualOpen(true)} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors flex items-center text-slate-300 hover:text-white text-xs font-bold border border-white/10 shadow-sm whitespace-nowrap">
                <Icons.Book className="w-4 h-4 md:mr-1.5"/> <span className="hidden md:inline">使い方</span>
              </button>
              <button onClick={onOpenSettings} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors flex items-center text-slate-300 hover:text-white text-xs font-bold border border-white/10 shadow-sm whitespace-nowrap">
                <Icons.Key className="w-4 h-4 md:mr-1.5"/> <span className="hidden md:inline">API設定</span>
              </button>
            </div>
          </header>
          
          <main className="flex-1 overflow-hidden relative">
            <div className={viewMode === 'analysis' ? 'h-full' : 'hidden'}>
              <AnalysisPanel ref={analysisPanelRef} processedData={processedData} cols={cols} gridData={gridData} keyColumn={keyColumn} onResetGrid={resetGrid} fileName={fileName} />
            </div>
            
            <div className={viewMode === 'editor' ? 'flex flex-col h-full bg-white animate-in' : 'hidden'}>
              <div className="p-4 border-b flex justify-between items-center bg-slate-50 flex-wrap gap-3">
                <div className="flex items-center space-x-2 text-slate-600 font-bold"><Icons.Table className="w-5 h-5"/><span>データ編集 & 転置</span></div>
                <div className="flex space-x-2 flex-wrap gap-y-2 justify-end">
                  <button onClick={undo} disabled={history.length === 0} className={`px-3 py-2 rounded-lg text-sm font-bold flex items-center border transition-all ${history.length === 0 ? 'bg-slate-50 text-slate-400 border-slate-200' : 'bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-300'}`}>
                    <Icons.Undo className="w-4 h-4 mr-1" />元に戻す
                  </button>
                  <button onClick={resetGrid} className="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-bold flex items-center border border-slate-300 transition-all">
                    <Icons.RefreshCcw className="w-4 h-4 mr-1" />最初に戻す
                  </button>
                  <button onClick={reverseRows} className="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-bold flex items-center border border-slate-300 transition-all">
                    <Icons.ArrowDownUp className="w-4 h-4 mr-1" />行反転
                  </button>
                  <button onClick={reverseColumns} className="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-bold flex items-center border border-slate-300 transition-all">
                    <Icons.ArrowRightLeft className="w-4 h-4 mr-1" />列反転
                  </button>
                  <button onClick={transposeData} className="bg-orange-50 text-orange-600 hover:bg-orange-100 px-3 py-2 rounded-lg text-sm font-bold flex items-center border border-orange-200 transition-all"><Icons.Transpose className="w-4 h-4 mr-1" />行列を入替</button>
                  <button onClick={() => { const ws = XLSX.utils.json_to_sheet(gridData, { header: gridColumns }); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data"); XLSX.writeFile(wb, "data.xlsx"); }} className="bg-blue-600 text-white hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-bold flex items-center shadow-md transition-all"><Icons.Download className="w-4 h-4 mr-1" />保存</button>
                </div>
              </div>
              <div className="flex-1 overflow-auto custom-scrollbar">
                  <table className="min-w-full text-sm border-collapse">
                    <thead className="bg-slate-100 sticky top-0 z-20 shadow-sm">
                      <tr>
                        <th className="w-36 border-b bg-slate-100 min-w-[9rem] relative group p-0">
                          <div className="flex justify-center items-center h-full w-full min-h-[48px]">
                            <div className="flex opacity-0 group-hover:opacity-100 transition-opacity bg-slate-50 shadow-sm rounded">
                              {clipboard.type === 'row' && (
                                <button onClick={pasteRowToHeader} className="text-orange-400 hover:text-orange-600 p-1" title="コピーした行をヘッダーに適用"><Icons.Clipboard className="w-5 h-5"/></button>
                              )}
                            </div>
                          </div>
                        </th>
                        {gridColumns.map(k => (
                          <th key={k} className={`border border-slate-200 px-2 py-3 min-w-[200px] relative group ${keyColumn === k ? 'bg-amber-50' : 'bg-slate-50'}`}>
                            <div className="flex items-center w-full">
                              {keyColumn === k && <Icons.Star className="w-4 h-4 text-amber-500 mr-1 shrink-0" />}
                              <input type="text" defaultValue={k} onFocus={() => { focusedGridSnapshot.current = { grid: gridData, cols: gridColumns, keyCol: keyColumn }; }} onBlur={(e) => { const nk = e.target.value; if(!nk || nk===k) return; pushHistory(focusedGridSnapshot.current.grid, focusedGridSnapshot.current.cols, focusedGridSnapshot.current.keyCol); setGridColumns(prev => prev.map(c => c === k ? nk : c)); setGridData(prev => prev.map(r => { const nr = {}; Object.keys(r).forEach(x=>nr[x===k?nk:x]=r[x]); return nr; })); if(keyColumn === k) setKeyColumn(nk); }} className="cell-input header-input flex-1 min-w-0 mr-1 text-left px-1 bg-transparent" />
                              <div className="flex shrink-0 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-50 shadow-sm rounded">
                                <button onClick={() => setKeyColumn(keyColumn === k ? null : k)} className={`${keyColumn === k ? 'text-amber-500 hover:text-amber-600' : 'text-slate-400 hover:text-amber-500'} p-1`} title="この列を項目(キー)に指定"><Icons.Star className="w-4 h-4"/></button>
                                <button onClick={() => convertColumnType(k, 'number')} className="text-indigo-400 hover:text-indigo-600 p-1" title="数値に一括変換"><Icons.Hash className="w-4 h-4"/></button>
                                <button onClick={() => convertColumnType(k, 'date')} className="text-pink-400 hover:text-pink-600 p-1" title="日付に一括変換"><Icons.Calendar className="w-4 h-4"/></button>
                                <button onClick={() => copyColumn(k)} className="text-blue-400 hover:text-blue-600 p-1" title="列をコピー"><Icons.Copy className="w-4 h-4"/></button>
                                {clipboard.type === 'col' && (
                                  <button onClick={() => pasteColumnAfter(k)} className="text-orange-400 hover:text-orange-600 p-1" title="右にペースト"><Icons.Clipboard className="w-4 h-4"/></button>
                                )}
                                <button onClick={() => insertColumnAfter(k)} className="text-teal-400 hover:text-teal-600 p-1" title="右に空の列を挿入"><Icons.Plus className="w-4 h-4"/></button>
                                <button onClick={() => deleteColumn(k)} className="text-red-300 hover:text-red-600 p-1" title="この列を削除"><Icons.Trash className="w-4 h-4"/></button>
                              </div>
                            </div>
                          </th>
                        ))}
                        <th className="w-12 border-b bg-slate-100"></th>
                      </tr>
                    </thead>
                    <tbody>
                      {gridData.map((row, rIdx) => (
                        <tr key={rIdx} className="hover:bg-slate-50 border-b group">
                          <td className="bg-slate-50 border-r w-36 p-0 min-w-[9rem]">
                            <div className="flex justify-between items-center px-1">
                              <div className="flex opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onClick={() => convertRowType(rIdx, 'number')} className="text-indigo-400 hover:text-indigo-600 p-1" title="数値に一括変換"><Icons.Hash className="w-4 h-4"/></button>
                                <button onClick={() => convertRowType(rIdx, 'date')} className="text-pink-400 hover:text-pink-600 p-1" title="日付に一括変換"><Icons.Calendar className="w-4 h-4"/></button>
                                <button onClick={() => copyRow(rIdx)} className="text-blue-400 hover:text-blue-600 p-1" title="行をコピー"><Icons.Copy className="w-4 h-4"/></button>
                                {clipboard.type === 'row' && (
                                  <button onClick={() => pasteRowAfter(rIdx)} className="text-orange-400 hover:text-orange-600 p-1" title="下にペースト"><Icons.Clipboard className="w-4 h-4"/></button>
                                )}
                                <button onClick={() => insertRowAfter(rIdx)} className="text-emerald-400 hover:text-emerald-600 p-1" title="下に行を挿入"><Icons.Plus className="w-4 h-4"/></button>
                                <button onClick={() => deleteRow(rIdx)} className="text-red-300 hover:text-red-600 p-1" title="この行を削除"><Icons.Trash className="w-4 h-4"/></button>
                              </div>
                              <span className="text-slate-400 font-mono text-[10px] mr-1">{rIdx + 1}</span>
                            </div>
                          </td>
                          {gridColumns.map(k => (
                            <td key={k} className={`border-r border-slate-200 p-0 ${keyColumn === k ? 'bg-amber-50/30' : ''}`}>
                              {cols.date.includes(k) ? (
                                <input type="date" value={smartFormatDate(row[k], k)} onFocus={() => { focusedGridSnapshot.current = { grid: gridData, cols: gridColumns, keyCol: keyColumn }; }} onChange={(e) => { const nd = [...gridData]; nd[rIdx][k] = e.target.value; setGridData(nd); }} onBlur={(e) => { if (focusedGridSnapshot.current && focusedGridSnapshot.current.grid[rIdx] && smartFormatDate(focusedGridSnapshot.current.grid[rIdx][k], k) !== e.target.value) { pushHistory(focusedGridSnapshot.current.grid, focusedGridSnapshot.current.cols, focusedGridSnapshot.current.keyCol); } }} className="cell-input" />
                              ) : (
                                <input type="text" value={row[k] !== undefined ? row[k] : ''} onFocus={() => { focusedGridSnapshot.current = { grid: gridData, cols: gridColumns, keyCol: keyColumn }; }} onChange={(e) => { const nd = [...gridData]; nd[rIdx][k] = e.target.value; setGridData(nd); }} onBlur={(e) => { if (focusedGridSnapshot.current && focusedGridSnapshot.current.grid[rIdx] && focusedGridSnapshot.current.grid[rIdx][k] !== e.target.value) { pushHistory(focusedGridSnapshot.current.grid, focusedGridSnapshot.current.cols, focusedGridSnapshot.current.keyCol); } }} className="cell-input" />
                              )}
                            </td>
                          ))}
                          <td className="text-center">
                            <button onClick={() => deleteRow(rIdx)} className="text-red-300 hover:text-red-600 p-2 opacity-0 group-hover:opacity-100 transition-opacity" title="この行を削除"><Icons.Trash className="w-4 h-4"/></button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
              </div>
            </div>
          </main>
          
          {/* 追加したフッター */}
          <footer className="h-8 bg-slate-900 text-slate-400 flex items-center justify-center text-[10px] shrink-0 z-30 border-t border-slate-800">
            開発・提供：一般社団法人日本みらい研
          </footer>

          <ManualModal isOpen={isManualOpen} onClose={() => setIsManualOpen(false)} />
          <DataSourceModal isOpen={isDataSourceOpen} onClose={() => setIsDataSourceOpen(false)} />
          {toastMsg && (
            <div className="fixed bottom-6 right-6 bg-slate-800/90 backdrop-blur-sm text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-bold animate-in z-[200] flex items-center">
              <Icons.Info className="w-5 h-5 mr-2 text-blue-400" /> {toastMsg}
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // 7. メイン App コンポーネント
    // ==========================================
    const App = () => {
      const [data, setData] = useState([]);
      const [fileName, setFileName] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isManualOpen, setIsManualOpen] = useState(false);
      const [isDataSourceOpen, setIsDataSourceOpen] = useState(false);
      const [isDragging, setIsDragging] = useState(false);

      useEffect(() => {
        const handlePaste = (e) => {
          if (data.length > 0) return; 
          const clipboardData = e.clipboardData || window.clipboardData;
          if (!clipboardData) return;
          const htmlData = clipboardData.getData('text/html');
          const textData = clipboardData.getData('text/plain');
          if (!textData && !htmlData) return;
          try {
            let wb;
            if (htmlData && htmlData.includes('<table')) {
              const doc = new DOMParser().parseFromString(htmlData, 'text/html');
              const table = doc.querySelector('table');
              if (table) {
                const ws = window.XLSX.utils.table_to_sheet(table);
                wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
              } else { wb = window.XLSX.read(textData, {type: 'string'}); }
            } else if (textData) { wb = window.XLSX.read(textData, {type: 'string'}); }

            if (wb) {
               const jsonData = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
               if (jsonData.length > 0) { setData(jsonData); setFileName('ペーストされたデータ'); setErrorMsg(''); } 
               else { setErrorMsg('ペーストされたテキストからデータを抽出できませんでした。'); }
            }
          } catch (err) { setErrorMsg('ペーストされたデータの読み込みに失敗しました。'); }
        };
        window.addEventListener('paste', handlePaste);
        return () => window.removeEventListener('paste', handlePaste);
      }, [data.length]);

      const processFile = (file) => {
        if (!file) return;
        const validExt = ['.csv', '.xlsx', '.xls'];
        if (!validExt.some(ext => file.name.toLowerCase().endsWith(ext))) { setErrorMsg('CSVまたはExcelファイル(.csv, .xlsx, .xls)を選択してください。'); return; }
        setErrorMsg(''); setFileName(file.name);
        const reader = new FileReader();
        reader.onload = (evt) => {
          try { 
            const wb = window.XLSX.read(evt.target.result, {type:'binary'}); 
            const jsonData = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            if(jsonData.length > 0) setData(jsonData); else setErrorMsg('データが見つかりませんでした。');
          } catch(err) { setErrorMsg('読み込みに失敗しました。'); }
        }; reader.readAsBinaryString(file);
      };

      if (data.length > 0) {
        return (
          <Fragment>
            <AnalysisWorkspaceWrapper rawData={data} fileName={fileName} onReset={() => setData([])} onOpenSettings={() => setIsSettingsOpen(true)} onLoadNewFile={processFile} />
            <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} />
          </Fragment>
        );
      }

      return (
        <div className="min-h-[100dvh] flex flex-col items-center justify-center p-4 bg-slate-50 text-slate-800 relative">
          <div className="absolute top-4 right-4 flex space-x-2">
            <button onClick={() => setIsManualOpen(true)} className="flex items-center px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm font-bold shadow-sm hover:bg-slate-50 transition-colors">
              <Icons.Book className="w-4 h-4 mr-2 text-slate-500" /> 使い方
            </button>
            <button onClick={() => setIsSettingsOpen(true)} className="flex items-center px-4 py-2 bg-white border border-slate-200 text-slate-600 rounded-lg text-sm font-bold shadow-sm hover:bg-slate-50 transition-colors">
              <Icons.Key className="w-4 h-4 mr-2 text-slate-500" /> API設定
            </button>
          </div>
          
          <div 
            className={`max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-10 text-center animate-in border-4 transition-colors duration-200 ${isDragging ? 'border-blue-400 bg-blue-50' : 'border-transparent'}`}
            onDragOver={(e)=>{e.preventDefault(); e.stopPropagation(); setIsDragging(true);}}
            onDragEnter={(e)=>{e.preventDefault(); e.stopPropagation(); setIsDragging(true);}}
            onDragLeave={(e)=>{e.preventDefault(); e.stopPropagation(); setIsDragging(false);}}
            onDrop={(e)=>{e.preventDefault(); e.stopPropagation(); setIsDragging(false); if (e.dataTransfer.files && e.dataTransfer.files.length > 0) processFile(e.dataTransfer.files[0]);}}
          >
            <div className={`w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center mx-auto mb-6 sm:mb-8 shadow-inner transition-colors duration-200 ${isDragging ? 'bg-blue-600 text-white' : 'bg-blue-100 text-blue-600'}`}>
              <Icons.Upload className="w-10 h-10 sm:w-12 sm:h-12" />
            </div>
            <h1 className="text-2xl sm:text-3xl font-black text-slate-900 mb-3 tracking-tighter">Data Analyzer</h1>
            <p className="text-slate-500 text-xs sm:text-sm mb-8 sm:mb-10 leading-relaxed font-medium">
              CSV/Excelをインポートして分析を開始<br/>
              <span className="text-[10px] sm:text-xs text-slate-400 mt-1 block">（ドラッグ＆ドロップ、または <strong className="font-bold text-slate-500">Ctrl+V / Cmd+V</strong> で貼り付け）</span>
            </p>
            {errorMsg && <div className="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-bold mb-8 border border-red-100">{errorMsg}</div>}
            
            <div className="flex flex-col sm:flex-row items-stretch justify-center gap-3 sm:gap-4">
              <div className="relative group w-full sm:w-1/2 flex-1">
                <input type="file" accept=".csv,.xlsx,.xls" onChange={e=>processFile(e.target.files[0])} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"/>
                <div className={`text-white py-3 px-4 h-full w-full rounded-2xl shadow-xl flex items-center justify-center transition-all active:scale-95 pointer-events-none ${isDragging ? 'bg-blue-700' : 'bg-blue-600 group-hover:bg-blue-700'}`}>
                  <Icons.Sheet className="w-7 h-7 sm:w-8 sm:h-8 mr-3 shrink-0" />
                  <div className="text-left font-black leading-tight text-sm sm:text-base whitespace-nowrap">
                    <div>ファイルを</div>
                    <div>選択する</div>
                  </div>
                </div>
              </div>
              <button onClick={() => setIsDataSourceOpen(true)} className="text-white font-black py-3 px-4 h-full w-full sm:w-1/2 flex-1 rounded-2xl shadow-xl flex items-center justify-center transition-all active:scale-95 bg-indigo-600 hover:bg-indigo-700">
                <Icons.Database className="w-7 h-7 sm:w-8 sm:h-8 mr-3 shrink-0" />
                <div className="text-left font-black leading-tight text-sm sm:text-base whitespace-nowrap">
                  <div>データソース</div>
                  <div>DB</div>
                </div>
              </button>
            </div>
          </div>
          <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} />
          <ManualModal isOpen={isManualOpen} onClose={() => setIsManualOpen(false)} />
          <DataSourceModal isOpen={isDataSourceOpen} onClose={() => setIsDataSourceOpen(false)} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
