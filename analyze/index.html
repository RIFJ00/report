      const firebaseConfig = {

      const parseDateString = (dateStr) => {
        if (!dateStr) return '';
        const parts = dateStr.split(/[-/]/);
        if (parts.length === 3) {
          const y = parts[0];
          const m = parts[1].padStart(2, '0');
          const d = parts[2].padStart(2, '0');
          return `${y}-${m}-${d}`;
        }
        return dateStr;
      };

      const getPrevMonthStr = (monthStr) => {
        if (!monthStr) return '';
        let [y, m] = monthStr.split('-').map(Number);
        m -= 1;
        if (m === 0) {
          m = 12;
          y -= 1;
        }
        return `${y}-${String(m).padStart(2, '0')}`;
      };

      const renderMoM = (value, show) => {
        if (!show || value === null || value === undefined || isNaN(value)) return null;
        const isNegative = value < 0;
        const textClass = isNegative ? 'text-red-400' : 'text-slate-400';
        const displayVal = (value === 0 ? 0 : value).toFixed(1);
        const displaySign = value > 0 ? '+' : '';
        return (
          <div className={`text-[10px] ${textClass} font-normal leading-none mt-0.5 whitespace-nowrap`}>
            ({displaySign}{displayVal})
          </div>
        );
      };

      const renderMoMInline = (value, show) => {
        if (!show || value === null || value === undefined || isNaN(value)) return null;

      function MultiSelectDropdown({ label, options, selectedValues, onChange, hasAverageOption = false, formatOption = (val) => val, defaultToggleValue = [] }) {
        const [isOpen, setIsOpen] = useState(false);
        const dropdownRef = useRef(null);

        useEffect(() => {
          function handleClickOutside(event) {
            if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
              setIsOpen(false);
            }
          }
          document.addEventListener("mousedown", handleClickOutside);
          return () => document.removeEventListener("mousedown", handleClickOutside);
        }, []);

        const allOptions = hasAverageOption ? ['average', ...options] : options;
        const currentValues = selectedValues === null ? allOptions : selectedValues;

        const toggleOption = (val) => {
          let newValues;
          if (currentValues.includes(val)) {
            newValues = currentValues.filter(v => v !== val);
          } else {
            newValues = [...currentValues, val];
          }
          onChange(newValues.length === allOptions.length ? null : newValues);
        };

        const toggleAll = () => {
          if (currentValues.length === allOptions.length) {
            onChange(defaultToggleValue);
          } else {
            onChange(null);
          }
        };

        const isAllSelected = currentValues.length === allOptions.length;

        let displayText = '';
        if (currentValues.length === 0) displayText = '選択なし';
        else if (isAllSelected) displayText = 'すべて';
        else if (currentValues.length === 1) displayText = formatOption(currentValues[0]);
        else displayText = `${currentValues.length}件選択`;

        return (
          <div className="relative" ref={dropdownRef}>
            <div 
              onClick={() => setIsOpen(!isOpen)}
              className="flex items-center h-10 px-3 bg-white border border-slate-300 rounded-md text-sm font-medium text-slate-700 cursor-pointer shadow-sm hover:bg-slate-50 transition-colors"
            >
              <span className="text-slate-500 mr-2 whitespace-nowrap">{label}:</span>
              <span className="truncate max-w-[100px] whitespace-nowrap">{displayText}</span>
              <svg className="w-4 h-4 ml-1 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
            
            {isOpen && (
              <div className="absolute z-50 mt-1 w-48 bg-white border border-slate-200 rounded-md shadow-lg max-h-60 overflow-y-auto custom-scrollbar">
                <div className="p-2 border-b border-slate-100 sticky top-0 bg-white">
                  <label className="flex items-center space-x-2 cursor-pointer p-1 hover:bg-slate-50 rounded">
                    <input type="checkbox" checked={isAllSelected} onChange={toggleAll} className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" />
                    <span className="text-sm font-bold text-slate-700">すべて選択</span>
                  </label>
                </div>
                <div className="p-2 flex flex-col space-y-1">
                  {hasAverageOption && (
                    <label className="flex items-center space-x-2 cursor-pointer p-1 hover:bg-slate-50 rounded">
                      <input type="checkbox" checked={currentValues.includes('average')} onChange={() => toggleOption('average')} className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" />
                      <span className="text-sm font-medium text-slate-700">平均値</span>
                    </label>
                  )}
                  {options.map(opt => (
                    <label key={opt} className="flex items-center space-x-2 cursor-pointer p-1 hover:bg-slate-50 rounded">
                      <input type="checkbox" checked={currentValues.includes(opt)} onChange={() => toggleOption(opt)} className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" />

                    </label>
                  ))}

              </div>

      const CustomSimpleBarChart = ({ data, dataKey, colorKey }) => {
        const [hoveredIndex, setHoveredIndex] = useState(null);

        if (!data || data.length === 0) return (
          <div className="h-full w-full flex items-center justify-center text-slate-400">データがありません</div>
        );

        const maxValue = Math.max(...data.map(d => d[dataKey] || 0));
        const maxAxisValue = Math.max(Math.ceil(maxValue / 10) * 10, 10);
        const yAxisTicks = [0, maxAxisValue * 0.25, maxAxisValue * 0.5, maxAxisValue * 0.75, maxAxisValue].map(v => Math.round(v));

        return (
          <div className="relative h-full w-full flex items-end pt-4 pb-2">
            <div className="absolute inset-0 flex flex-col justify-between pointer-events-none pb-8 pt-4">

                  <span className="text-xs text-slate-400 w-10 text-right pr-3 font-medium transform -translate-y-1/2">

                return (
                  <div

      const AdvancedAnalysis = ({ polls }) => {
        const KEY_MAP = {
          'jimin': '自民', 'ishin': '維新', 'chudo': '中道', 'komei': '公明',
          'kokumin': '国民', 'sansei': '参政', 'mirai': 'みらい', 'hoshu': '保守',
          'kyosan': '共産', 'reiwa': 'れいわ', 'shamin': '社民', 'none': '支持なし',
          'cabinetSupport': '内閣支持', 'cabinetNonsupport': '内閣不支持',
          'media': '機関名', 'date': '調査日'
        };
        const ORDERED_KEYS = ['機関名', '調査月', '調査日', '内閣支持', '内閣不支持', '自民', '維新', '中道', '公明', '国民', '参政', 'みらい', '保守', '共産', 'れいわ', '社民', '支持なし'];

        const processed = useMemo(() => {
          if (!polls || polls.length === 0) return { raw: [], columns: { numeric: [], categorical: [], date: [] }, months: [], uniqueCats: [] };

          const mappedData = polls.map(row => {
            let newRow = {};
            Object.keys(row).forEach(k => {
              const newKey = KEY_MAP[k] || k;
              newRow[newKey] = row[k];
            });
            // 調査日から「調査月(YYYY-MM)」を生成して追加
            if (newRow['調査日']) {
              newRow['調査月'] = newRow['調査日'].substring(0, 7);
            }
            return newRow;
          });

          const allExtractedKeys = new Set();
          mappedData.forEach(row => Object.keys(row).forEach(k => allExtractedKeys.add(k)));
          ['id', 'createdAt', 'updatedAt', 'mom'].forEach(k => allExtractedKeys.delete(k));

          const headers = [];
          ORDERED_KEYS.forEach(k => {
            if (allExtractedKeys.has(k)) {
              headers.push(k);
              allExtractedKeys.delete(k);
            }
          });
          allExtractedKeys.forEach(k => headers.push(k));

          const columns = { numeric: [], categorical: [], date: [] };
          headers.forEach(header => {
            let isDate = false, isNumeric = false;
            if (header.includes('日') || header.includes('月') || header.toLowerCase().includes('date')) {
              isDate = true;
            } else {
              let numCount = 0;
              let checkRows = Math.min(mappedData.length, 10);
              for (let i = 0; i < checkRows; i++) {
                if (typeof mappedData[i][header] === 'number') numCount++;
              }
              if (numCount > checkRows * 0.5) isNumeric = true;
            }

            if (isDate) columns.date.push(header);
            else if (isNumeric) columns.numeric.push(header);
            else columns.categorical.push(header);
          });

          let months = [];
          if (columns.date.length > 0) {
            let dCol = columns.date[0];
            let dates = mappedData.map(d => new Date(d[dCol])).filter(d => !isNaN(d));
            if (dates.length > 0) {
              let minDate = new Date(Math.min(...dates));
              let maxDate = new Date(Math.max(...dates));
              let now = new Date();
              if (now > maxDate) maxDate = now;
              
              let cur = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
              let end = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
              while (cur <= end) {
                months.push(`${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`);
                cur.setMonth(cur.getMonth() + 1);
              }
              months.reverse();
            }
          }

          let uniqueCats = [];
          if (columns.categorical.length > 0) {
            let catCol = columns.categorical[0];
            uniqueCats = [...new Set(mappedData.map(d => d[catCol]))].filter(v => v);
            const MEDIA_OPTIONS = ['NHK', '朝日', '読売', '毎日', '産経', '日経', 'ANN', 'JNN', '時事', '共同', 'その他'];
            uniqueCats.sort((a, b) => {
              let ia = MEDIA_OPTIONS.indexOf(a); let ib = MEDIA_OPTIONS.indexOf(b);
              if(ia === -1) ia = 999; if(ib === -1) ib = 999;
              return ia - ib;
            });
          }

          return { raw: mappedData, columns, months, uniqueCats };
        }, [polls]);

        const [startMonth, setStartMonth] = useState('');
        const [endMonth, setEndMonth] = useState('');
        const [selectedCats, setSelectedCats] = useState(null);
        const [selectedNums, setSelectedNums] = useState(null);
        const [analysisType, setAnalysisType] = useState('summary');
        const [resultTitle, setResultTitle] = useState('分析結果');
        
        const [xAxis, setXAxis] = useState('全体');
        const [yAxis, setYAxis] = useState('');
        const [sizeAxis, setSizeAxis] = useState('');
        const [colorGroup, setColorGroup] = useState('なし');
        const [colorAxis, setColorAxis] = useState('');
        const [yAxisChk, setYAxisChk] = useState([]);
        const [bins, setBins] = useState(20);

        const chartRef = useRef(null);
        const [summaryData, setSummaryData] = useState(null);
        const [statTestData, setStatTestData] = useState(null);
        const [noDataMsg, setNoDataMsg] = useState('');

        const handleAnalysisTypeChange = (e) => {
            const newType = e.target.value;
            setAnalysisType(newType);

            if (newType === 'timeseries') {
                if (processed.columns.date.includes('調査月')) {
                    setXAxis('調査月');
                } else if (processed.columns.date.length > 0) {
                    setXAxis(processed.columns.date[0]);
                }
            } else if (newType === 'boxplot' || newType === 'stripplot' || newType === 'ridgeline' || newType === 'stat_test') {
                setXAxis('機関名');
            } else if (['histogram', 'scatter', 'bubble'].includes(newType)) {
                if (processed.columns.numeric.length > 0) {
                    setXAxis(processed.columns.numeric[0]);
                }
            } else if (['comparison', 'stackedbar', 'violin'].includes(newType)) {
                setXAxis('全体');
            } else if (newType === 'crosstab_heatmap') {
                if (processed.columns.categorical.length > 0) setXAxis(processed.columns.categorical[0]);
                if (processed.columns.date.includes('調査月')) setColorGroup('調査月');
                if (processed.columns.numeric.length > 0) setColorAxis(processed.columns.numeric[0]);
            } else if (newType === 'bumpchart') {
                setXAxis('機関名');
                if (processed.columns.numeric.length > 0) setColorAxis(processed.columns.numeric[0]);
            }
        };

        useEffect(() => {
          if (processed.months.length > 0 && !startMonth) {
            setStartMonth(processed.months[processed.months.length - 1]);
            setEndMonth(processed.months[0]);
          }
        }, [processed.months]);

        useEffect(() => {
          if (processed.columns.numeric.length > 0 && yAxisChk.length === 0) {
            setYAxisChk(processed.columns.numeric.slice(0, 5));
            setXAxis(processed.columns.date.length > 0 ? processed.columns.date[0] : '全体');
            setYAxis(processed.columns.numeric[0]);
            setSizeAxis(processed.columns.numeric[1 % processed.columns.numeric.length]);
            setColorAxis(processed.columns.numeric[0]);
          }
        }, [processed.columns.numeric]);

        const filteredData = useMemo(() => {
          let checkedCats = selectedCats === null ? processed.uniqueCats : selectedCats;
          let catCol = processed.columns.categorical.length > 0 ? processed.columns.categorical[0] : null;
          let startStr = startMonth;
          let endStr = endMonth;
          
          if (startStr && endStr && startStr > endStr) {
              let tmp = startStr; startStr = endStr; endStr = tmp;
          }

          return processed.raw.filter(row => {
            if (startStr && endStr && processed.columns.date.length > 0) {
              let dCol = processed.columns.date[0];
              let rowDateStr = row[dCol];
              if (rowDateStr) {
                let rowMonth = String(rowDateStr).substring(0, 7);
                if (rowMonth < startStr || rowMonth > endStr) return false;
              }
            }
            if (catCol && !checkedCats.includes(String(row[catCol]))) return false;
            return true;
          });
        }, [processed, startMonth, endMonth, selectedCats]);

        const activeNums = selectedNums === null ? processed.columns.numeric : selectedNums;

        const makeChartTitle = (mainTitle) => {
            const periodText = startMonth && endMonth ? 
                (startMonth === endMonth ? 
                    `${startMonth.split('-')[0]}年${parseInt(startMonth.split('-')[1], 10)}月` : 
                    `${startMonth.split('-')[0]}年${parseInt(startMonth.split('-')[1], 10)}月 〜 ${endMonth.split('-')[0]}年${parseInt(endMonth.split('-')[1], 10)}月`) 
                : '';
            return `${mainTitle}<br><span style="font-size:12px;color:#64748b;font-weight:normal;">期間: ${periodText}</span>`;
        };

        const executeAnalysis = () => {
          setNoDataMsg('');
          setSummaryData(null);
          setStatTestData(null);
          if (chartRef.current && window.Plotly) window.Plotly.purge(chartRef.current);

          if (filteredData.length === 0) {
            setNoDataMsg('データがありません。フィルター条件を変更してください。');
            return;
          }

          const selText = document.getElementById('analysisTypeSel')?.options[document.getElementById('analysisTypeSel')?.selectedIndex]?.text || '';
          setResultTitle(selText.split('(')[0].trim());

          switch (analysisType) {
              case 'summary': renderSummary(); break;
              case 'timeseries': renderTimeSeries(); break;
              case 'comparison': renderComparison(); break;
              case 'boxplot': renderBoxPlot(); break;
              case 'correlation': renderCorrelation(); break;
              case 'scatter': renderScatter(); break;
              case 'histogram': renderHistogram(); break;
              case 'stackedbar': renderStackedBar(); break;
              case 'pie': renderPie(); break;
              case 'radar': renderRadar(); break;
              case 'bubble': renderBubble(); break;
              case 'violin': renderViolin(); break;
              case 'parcoords': renderParcoords(); break;
              case 'crosstab_heatmap': renderCrosstabHeatmap(); break;
              case 'stripplot': renderStripPlot(); break;
              case 'ridgeline': renderRidgelinePlot(); break;
              case 'bumpchart': renderBumpChart(); break;
              case 'stat_test': renderStatTest(); break;
          }
        };

        const handleClearAnalysis = () => {
          if (processed.months.length > 0) {
            setStartMonth(processed.months[processed.months.length - 1]);
            setEndMonth(processed.months[0]);
          }
          setSelectedCats(null);
          setSelectedNums(null);
          setAnalysisType('summary');
          
          if (processed.columns.numeric.length > 0) {
            setYAxisChk(processed.columns.numeric.slice(0, 5));
            setXAxis('機関名');
            setYAxis(processed.columns.numeric[0]);
            setSizeAxis(processed.columns.numeric[1 % processed.columns.numeric.length]);
            setColorAxis(processed.columns.numeric[0]);
          }
          setColorGroup('なし');
          setBins(20);
          
          setSummaryData(null);
          setStatTestData(null);
          setNoDataMsg('');
          setResultTitle('分析結果');
          if (chartRef.current && window.Plotly) window.Plotly.purge(chartRef.current);
        };

        const renderSummary = () => {
          let summary = [];
          activeNums.forEach(col => {
              let values = filteredData.map(d => d[col]).filter(v => v !== null && v !== '' && !isNaN(v));
              if (values.length > 0) {
                  values.sort((a, b) => a - b);
                  let sum = values.reduce((a, b) => a + Number(b), 0);
                  let mean = sum / values.length;
                  let min = values[0];
                  let max = values[values.length - 1];
                  let mid = Math.floor(values.length / 2);
                  let median = values.length % 2 !== 0 ? values[mid] : (values[mid - 1] + values[mid]) / 2;
                  let sqSum = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0);
                  let sd = Math.sqrt(sqSum / values.length);
                  summary.push({ col, count: values.length, mean, sd, min, median, max });
              }
          });
          setSummaryData(summary);
        };

        const renderTimeSeries = () => {
            const xCol = xAxis;
            const yCols = yAxisChk;
            if (yCols.length === 0) { alert('表示するY軸の数値を選択してください。'); return; }

            let sortedData = [...filteredData];
            if (xCol && xCol !== '全体') sortedData.sort((a, b) => new Date(a[xCol]) - new Date(b[xCol]));
            let xData = (xCol && xCol !== '全体') ? sortedData.map(d => d[xCol]) : sortedData.map((_, i) => i + 1);

            let traces = yCols.map(col => ({
                x: xData, y: sortedData.map(d => d[col]),
                type: 'scatter', mode: 'lines+markers', name: col,
                line: { shape: 'spline', width: 3 }, marker: { size: 6 }
            }));

            let layout = {
                title: makeChartTitle('時系列推移'), xaxis: { title: xCol && xCol !== '全体' ? xCol : 'インデックス' }, yaxis: { title: '値' },
                hovermode: 'closest', margin: { t: 60, r: 20, l: 50, b: 60 }, legend: { orientation: 'h', y: -0.2 }
            };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const renderComparison = () => {
            const xCol = xAxis;
            const yCols = yAxisChk;
            if (yCols.length === 0) { alert('Y軸の数値を選択してください。'); return; }

            let grouped = {};
            filteredData.forEach(row => {
                let cat = xCol === '全体' ? 'All' : row[xCol];
                if (!cat) cat = '不明';
                if (!grouped[cat]) {
                    grouped[cat] = { count: 0, sums: {} };
                    yCols.forEach(yc => grouped[cat].sums[yc] = 0);
                }
                let validCount = 0;
                yCols.forEach(yc => {
                    let val = row[yc];
                    if (val !== null && val !== '' && !isNaN(val)) {
                        grouped[cat].sums[yc] += Number(val);
                        validCount++;
                    }
                });
                if(validCount > 0) grouped[cat].count++;
            });

            let categories = Object.keys(grouped);
            let traces = yCols.map(yc => ({
                x: categories,
                y: categories.map(cat => grouped[cat].count > 0 ? grouped[cat].sums[yc] / grouped[cat].count : 0),
                type: 'bar', name: yc
            }));

            let layout = { title: makeChartTitle('カテゴリ別平均値比較'), barmode: 'group', xaxis: { title: xCol, tickangle: -45 }, yaxis: { title: '平均値' }, margin: { t: 60, r: 20, l: 50, b: 80 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const renderBoxPlot = () => {
            const xCol = xAxis;
            const yCol = yAxis;
            let traces = [];
            if (xCol === '全体') {
                traces.push({
                    y: filteredData.map(d => d[yCol]).filter(v => v !== null && v !== '' && !isNaN(v)),
                    type: 'box', name: yCol, boxpoints: 'all', jitter: 0.3, pointpos: -1.8
                });
            } else {
                let grouped = {};
                filteredData.forEach(row => {
                    let cat = row[xCol];
                    if (!cat) cat = '不明';
                    let val = row[yCol];
                    if (val !== null && val !== '' && !isNaN(val)) {
                        if (!grouped[cat]) grouped[cat] = [];
                        grouped[cat].push(Number(val));
                    }
                });
                Object.keys(grouped).forEach(cat => {
                    traces.push({ y: grouped[cat], type: 'box', name: cat });
                });
            }

            let layout = { title: makeChartTitle(`${yCol} の分布ばらつき`), yaxis: { title: yCol }, xaxis: { title: xCol !== '全体' ? xCol : '' }, showlegend: false, margin: { t: 60, r: 20, l: 50, b: 80 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const calculatePearson = (x, y) => {
            let n = x.length;
            if (n === 0) return 0;
            let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
            for (let i = 0; i < n; i++) {
                sumX += x[i]; sumY += y[i]; sumXY += x[i] * y[i];
                sumX2 += x[i] * x[i]; sumY2 += y[i] * y[i];
            }
            let num = (n * sumXY) - (sumX * sumY);
            let den = Math.sqrt(((n * sumX2) - (sumX * sumX)) * ((n * sumY2) - (sumY * sumY)));
            return den === 0 ? 0 : num / den;
        };

        const renderCorrelation = () => {
            let cols = activeNums;
            if (cols.length < 2) { alert('相関を計算するには2つ以上の数値列が必要です。'); return; }

            let zData = [];
            for (let i = 0; i < cols.length; i++) {
                let row = [];
                for (let j = 0; j < cols.length; j++) {
                    if (i === j) { row.push(1); } 
                    else {
                        let x = [], y = [];
                        filteredData.forEach(d => {
                            let valX = d[cols[i]], valY = d[cols[j]];
                            if (valX !== null && valX !== '' && !isNaN(valX) && valY !== null && valY !== '' && !isNaN(valY)) {
                                x.push(Number(valX)); y.push(Number(valY));
                            }
                        });
                        row.push(calculatePearson(x, y));
                    }
                }
                zData.push(row);
            }

            let trace = { z: zData, x: cols, y: cols, type: 'heatmap', colorscale: 'RdBu', zmin: -1, zmax: 1 };
            let layout = { title: makeChartTitle('変数間 相関行列ヒートマップ'), margin: { t: 60, r: 20, l: 100, b: 100 }, xaxis: { tickangle: -45 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, [trace], layout, {responsive: true});
        };

        const renderScatter = () => {
            const xCol = xAxis; const yCol = yAxis; const colorCol = colorGroup;
            let traces = [];
            if (colorCol === 'なし') {
                traces.push({
                    x: filteredData.map(d => d[xCol]), y: filteredData.map(d => d[yCol]),
                    mode: 'markers', type: 'scatter', marker: { size: 8, opacity: 0.7, color: '#3b82f6' }
                });
            } else {
                let grouped = {};
                filteredData.forEach(row => {
                    let cat = row[colorCol];
                    if (!cat) cat = '不明';
                    if (!grouped[cat]) grouped[cat] = { x: [], y: [] };
                    grouped[cat].x.push(row[xCol]); grouped[cat].y.push(row[yCol]);
                });
                Object.keys(grouped).forEach(cat => {
                    traces.push({ x: grouped[cat].x, y: grouped[cat].y, mode: 'markers', type: 'scatter', name: cat, marker: { size: 8, opacity: 0.7 } });
                });
            }
            let layout = { title: makeChartTitle(`${xCol} vs ${yCol}`), xaxis: { title: xCol }, yaxis: { title: yCol }, hovermode: 'closest', margin: { t: 60, r: 20, l: 50, b: 50 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const renderHistogram = () => {
            const xCol = xAxis;
            let data = filteredData.map(d => d[xCol]).filter(v => v !== null && v !== '' && !isNaN(v));
            let trace = { x: data, type: 'histogram', nbinsx: bins, marker: { color: '#3b82f6', line: { color: '#ffffff', width: 1 } }, opacity: 0.8 };
            let layout = { title: makeChartTitle(`${xCol} の分布 (ヒストグラム)`), xaxis: { title: xCol }, yaxis: { title: '度数 (頻度)' }, bargap: 0.05, margin: { t: 60, r: 20, l: 50, b: 50 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, [trace], layout, {responsive: true});
        };

        const renderStackedBar = () => {
            const xCol = xAxis; const yCols = yAxisChk;
            if (yCols.length === 0) { alert('積み上げる数値を選択してください。'); return; }

            let grouped = {};
            filteredData.forEach(row => {
                let cat = xCol === '全体' ? 'All' : row[xCol];
                if (!cat) cat = '不明';
                if (!grouped[cat]) { grouped[cat] = { count: 0, sums: {} }; yCols.forEach(yc => grouped[cat].sums[yc] = 0); }
                let validCount = 0;
                yCols.forEach(yc => {
                    let val = row[yc];
                    if (val !== null && val !== '' && !isNaN(val)) { grouped[cat].sums[yc] += Number(val); validCount++; }
                });
                if(validCount > 0) grouped[cat].count++;
            });

            let categories = Object.keys(grouped);
            if (processed.columns.date.includes(xCol)) categories.sort((a, b) => new Date(a) - new Date(b)); 
            
            let traces = yCols.map(yc => ({
                x: categories, y: categories.map(cat => grouped[cat].count > 0 ? grouped[cat].sums[yc] / grouped[cat].count : 0),
                type: 'bar', name: yc
            }));

            let layout = { title: makeChartTitle('構成比推移・比較 (積み上げ棒グラフ)'), barmode: 'stack', xaxis: { title: xCol, tickangle: -45 }, yaxis: { title: '平均値の合計' }, margin: { t: 60, r: 20, l: 50, b: 80 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const renderPie = () => {
            const yCols = yAxisChk;
            if (yCols.length === 0) { alert('割合を比較する数値を選択してください。'); return; }
            
            let values = yCols.map(col => {
                let validData = filteredData.map(d => d[col]).filter(v => v !== null && v !== '' && !isNaN(v));
                if(validData.length === 0) return 0;
                return validData.reduce((a, b) => a + Number(b), 0) / validData.length;
            });

            let trace = { values: values, labels: yCols, type: 'pie', textinfo: 'label+percent', insidetextorientation: 'radial' };
            let layout = { title: makeChartTitle('選択項目の全体平均の割合 (円グラフ)'), margin: { t: 60, r: 20, l: 20, b: 40 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, [trace], layout, {responsive: true});
        };

        const renderRadar = () => {
            const xCol = xAxis; const yCols = yAxisChk;
            if (yCols.length === 0) { alert('比較する指標を選択してください。'); return; }

            let grouped = {};
            filteredData.forEach(row => {
                let cat = xCol === '全体' ? 'All' : row[xCol];
                if (!cat) cat = '不明';
                if (!grouped[cat]) { grouped[cat] = { count: 0, sums: {} }; yCols.forEach(yc => grouped[cat].sums[yc] = 0); }
                let validCount = 0;
                yCols.forEach(yc => {
                    let val = row[yc];
                    if (val !== null && val !== '' && !isNaN(val)) { grouped[cat].sums[yc] += Number(val); validCount++; }
                });
                if(validCount > 0) grouped[cat].count++;
            });

            let maxVal = 0;
            let traces = Object.keys(grouped).map(cat => {
                let r = yCols.map(yc => {
                    let val = grouped[cat].count > 0 ? grouped[cat].sums[yc] / grouped[cat].count : 0;
                    if (val > maxVal) maxVal = val;
                    return val;
                });
                r.push(r[0]); 
                return { type: 'scatterpolar', r: r, theta: [...yCols, yCols[0]], fill: 'toself', name: cat };
            });

            let layout = { title: makeChartTitle('多変量プロファイル比較 (レーダーチャート)'), polar: { radialaxis: { visible: true, range: [0, maxVal * 1.1] } }, showlegend: true, margin: { t: 70, r: 60, l: 60, b: 60 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const renderBubble = () => {
            const xCol = xAxis; const yCol = yAxis; const sizeC = sizeAxis; const colorCol = colorGroup;
            let allSizes = filteredData.map(d => d[sizeC]).filter(v => v !== null && v !== '' && !isNaN(v));
            let maxSize = Math.max(...allSizes);
            let getSize = (val) => val ? Math.max((val / maxSize) * 40, 5) : 5;

            let traces = [];
            if (colorCol === 'なし') {
                traces.push({
                    x: filteredData.map(d => d[xCol]), y: filteredData.map(d => d[yCol]),
                    text: filteredData.map(d => `${sizeC}: ${d[sizeC]}`),
                    mode: 'markers', type: 'scatter',
                    marker: { size: filteredData.map(d => getSize(d[sizeC])), opacity: 0.6, color: '#3b82f6', line: { color: '#1e3a8a', width: 1 } }
                });
            } else {
                let grouped = {};
                filteredData.forEach(row => {
                    let cat = row[colorCol];
                    if (!cat) cat = '不明';
                    if (!grouped[cat]) grouped[cat] = { x: [], y: [], size: [], text: [] };
                    grouped[cat].x.push(row[xCol]); grouped[cat].y.push(row[yCol]);
                    grouped[cat].size.push(getSize(row[sizeC])); grouped[cat].text.push(`${sizeC}: ${row[sizeC]}`);
                });
                Object.keys(grouped).forEach(cat => {
                    traces.push({ x: grouped[cat].x, y: grouped[cat].y, text: grouped[cat].text, mode: 'markers', type: 'scatter', name: cat, marker: { size: grouped[cat].size, opacity: 0.6, line: { width: 1 } } });
                });
            }

            let layout = { title: makeChartTitle(`${xCol} vs ${yCol} (サイズ: ${sizeC})`), xaxis: { title: xCol }, yaxis: { title: yCol }, hovermode: 'closest', margin: { t: 60, r: 20, l: 50, b: 50 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const renderViolin = () => {
            const xCol = xAxis; const yCol = yAxis;
            let traces = [];
            if (xCol === '全体') {
                traces.push({ y: filteredData.map(d => d[yCol]).filter(v => v !== null && !isNaN(v)), type: 'violin', name: yCol, box: { visible: true }, meanline: { visible: true } });

        const renderParcoords = () => {
            const yCols = yAxisChk; const colorCol = colorAxis;
            if (yCols.length < 2) { alert('比較する数値を2つ以上選択してください。'); return; }

            let colorData = filteredData.map(d => d[colorCol]).map(v => isNaN(v) || v === null ? 0 : Number(v));
            let dimensions = yCols.map(col => {
                let vals = filteredData.map(d => d[col]).map(v => isNaN(v) || v === null ? 0 : Number(v));
                return { range: [Math.min(...vals), Math.max(...vals)], label: col, values: vals };
            });

            let trace = { type: 'parcoords', line: { color: colorData, colorscale: 'Jet', showscale: true, cmin: Math.min(...colorData), cmax: Math.max(...colorData) }, dimensions: dimensions };
            let layout = { title: makeChartTitle('多次元パターン (平行座標プロット)'), margin: { t: 70, r: 40, l: 60, b: 40 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, [trace], layout, {responsive: true});
        };

        const renderCrosstabHeatmap = () => {
            const colX = xAxis;
            const colY = colorGroup;
            const colVal = colorAxis;
            
            if (colX === '全体' || colY === 'なし' || colY === '全体') {
                alert('クロス集計にはX軸・Y軸にカテゴリ(機関名や調査月など)を選択してください。'); return;
            }

            let xLabels = [...new Set(filteredData.map(d => d[colX]).filter(Boolean))].sort();
            let yLabels = [...new Set(filteredData.map(d => d[colY]).filter(Boolean))].sort();

            let zData = [];
            for (let i = 0; i < yLabels.length; i++) {
                let row = [];
                for (let j = 0; j < xLabels.length; j++) {
                    let matching = filteredData.filter(d => d[colY] === yLabels[i] && d[colX] === xLabels[j]);
                    let vals = matching.map(d => d[colVal]).filter(v => v !== null && v !== '' && !isNaN(v));
                    if (vals.length > 0) {
                        row.push(vals.reduce((a,b) => a + Number(b), 0) / vals.length);
                    } else {
                        row.push(null);
                    }
                }
                zData.push(row);
            }

            let trace = {
                z: zData,
                x: xLabels,
                y: yLabels,
                type: 'heatmap',
                colorscale: 'Viridis',
                colorbar: { title: colVal }
            };

            let layout = { title: makeChartTitle(`クロス集計ヒートマップ (${colX} × ${colY} : ${colVal})`), margin: { t: 60, r: 20, l: 100, b: 60 }, xaxis: { tickangle: -45 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, [trace], layout, {responsive: true});
        };

        const renderStripPlot = () => {
            const xCol = xAxis;
            const yCol = yAxis;
            let traces = [];
            if (xCol === '全体') {
                traces.push({
                    y: filteredData.map(d => d[yCol]).filter(v => v !== null && v !== '' && !isNaN(v)),
                    type: 'box', name: yCol, boxpoints: 'all', pointpos: 0, jitter: 0.5,
                    fillcolor: 'rgba(0,0,0,0)', line: {color: 'rgba(0,0,0,0)'}, marker: {size: 6, opacity: 0.7, color: '#3b82f6', line: {width: 1, color: '#1e3a8a'}}
                });
            } else {
                let grouped = {};
                filteredData.forEach(row => {
                    let cat = row[xCol];
                    if (!cat) cat = '不明';
                    let val = row[yCol];
                    if (val !== null && val !== '' && !isNaN(val)) {
                        if (!grouped[cat]) grouped[cat] = [];
                        grouped[cat].push(Number(val));
                    }
                });
                Object.keys(grouped).forEach(cat => {
                    traces.push({ 
                      y: grouped[cat], type: 'box', name: cat, 
                      boxpoints: 'all', pointpos: 0, jitter: 0.5,
                      fillcolor: 'rgba(0,0,0,0)', line: {color: 'rgba(0,0,0,0)'}, 
                      marker: {size: 6, opacity: 0.7, line: {width: 1}} 
                    });
                });
            }

            let layout = { title: makeChartTitle(`${yCol} の分布 (ストリッププロット)`), yaxis: { title: yCol }, xaxis: { title: xCol !== '全体' ? xCol : '' }, showlegend: false, margin: { t: 60, r: 20, l: 50, b: 80 } };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const renderRidgelinePlot = () => {
            const xCol = xAxis;
            const yCol = yAxis;
            if (xCol === '全体') {
                alert('グループ化(X軸)を選択してください。'); return;
            }

            let grouped = {};
            filteredData.forEach(row => {

                if (!cat) cat = '不明';
                let val = row[yCol];
                if (val !== null && val !== '' && !isNaN(val)) {
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(Number(val));
                }
            });

            let categories = Object.keys(grouped).sort().reverse(); 
            
            let traces = categories.map(cat => ({
                type: 'violin',
                x: grouped[cat],
                name: cat,
                side: 'positive',
                orientation: 'h',
                meanline: { visible: true },
                points: false,
                line: { color: '#1e3a8a', width: 1 },
                fillcolor: 'rgba(59, 130, 246, 0.5)',
                spanmode: 'hard'
            }));

            let layout = { 
                title: makeChartTitle(`${yCol} の分布 (リッジラインプロット)`), 
                xaxis: { title: yCol }, 
                yaxis: { showgrid: false },
                showlegend: false, 
                margin: { t: 60, r: 20, l: 80, b: 50 },
                hovermode: 'closest'
            };
            if(window.Plotly) window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
        };

        const renderBumpChart = () => {
            const valCol = colorAxis;
            const groupCol = xAxis;
            const timeCol = '調査月';

            if (!processed.columns.date.includes(timeCol) && processed.columns.date.length > 0) {
               alert('バンプチャートのデータには調査月が必要です。'); return;
            }

            let months = [...new Set(filteredData.map(d => d[timeCol]).filter(Boolean))].sort();
            let groups = [...new Set(filteredData.map(d => d[groupCol]).filter(Boolean))];

            let monthlyData = {};
            months.forEach(m => {
                monthlyData[m] = {};
                groups.forEach(g => {
                    let matching = filteredData.filter(d => d[timeCol] === m && d[groupCol] === g);
                    let vals = matching.map(d => d[valCol]).filter(v => v !== null && v !== '' && !isNaN(v));
                    if(vals.length > 0) {
                        monthlyData[m][g] = vals.reduce((a,b)=>a+Number(b),0)/vals.length;
                    }
                });
            });

            let tracesData = {};
            groups.forEach(g => tracesData[g] = {x:[], y:[], text:[]});

            months.forEach(m => {
                let items = Object.keys(monthlyData[m]).map(g => ({ group: g, val: monthlyData[m][g] }));
                items.sort((a,b) => b.val - a.val);
                items.forEach((item, index) => {
                    let rank = index + 1;
                    tracesData[item.group].x.push(m);
                    tracesData[item.group].y.push(rank);
                    tracesData[item.group].text.push(`${item.group}<br>${rank}位 (${item.val.toFixed(1)})`);
                });
            });

            let traces = groups.map(g => ({
                x: tracesData[g].x,

                text: tracesData[g].text,
                mode: 'lines+markers',
                name: g,

                marker: { size: 10 },
                hoverinfo: 'text'

            let layout = { 
                title: makeChartTitle(`${valCol} の順位推移 (バンプチャート)`), 
                xaxis: { title: timeCol }, 
                yaxis: { title: '順位', autorange: 'reversed', tickdtick: 1 }, 
                hovermode: 'closest', margin: { t: 60, r: 20, l: 50, b: 60 }

        const renderStatTest = () => {
            const xCol = xAxis;
            const yCol = yAxis;
            if (xCol === '全体') {
                alert('グループ化(X軸)を選択してください。'); return;
            }

            let grouped = {};
            let allVals = [];
            filteredData.forEach(row => {
                let cat = row[xCol];
                if (!cat) return;
                let val = row[yCol];
                if (val !== null && val !== '' && !isNaN(val)) {
                    val = Number(val);
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push(val);
                    allVals.push(val);
                }
            });

            let groupKeys = Object.keys(grouped).filter(k => grouped[k].length > 0);
            if (groupKeys.length < 2) {
                alert('比較できるグループが2つ以上ありません。'); return;
            }

            const k = groupKeys.length;
            const N = allVals.length;
            
            const overallMean = allVals.reduce((a,b)=>a+b,0) / N;

            let SSB = 0;
            let SSW = 0;

            let groupStats = groupKeys.map(key => {
                let vals = grouped[key];
                let n = vals.length;
                let mean = vals.reduce((a,b)=>a+b,0) / n;
                let variance = vals.reduce((a,b)=>a+Math.pow(b-mean,2),0) / (n > 1 ? n-1 : 1);
                
                SSB += n * Math.pow(mean - overallMean, 2);
                SSW += vals.reduce((a,b)=>a+Math.pow(b-mean,2),0);
                
                return { key, n, mean, variance };
            });

            const dfB = k - 1;
            const dfW = N - k;
            
            const MSB = dfB > 0 ? SSB / dfB : 0;
            const MSW = dfW > 0 ? SSW / dfW : 0;
            
            const F = MSW > 0 ? MSB / MSW : 0;
            
            let pValue = null;
            if (window.jStat) {
                pValue = 1 - window.jStat.centralF.cdf(F, dfB, dfW);
            }

            setStatTestData({
                groupCol: xCol,
                valCol: yCol,
                groups: groupStats,
                anova: { F, pValue, dfB, dfW }
            });
            
            let traces = groupKeys.map(cat => ({
                y: grouped[cat], type: 'box', name: cat, boxpoints: 'all', jitter: 0.3, pointpos: -1.8
            }));
            let layout = { title: makeChartTitle(`${yCol} のグループ間比較`), yaxis: { title: yCol }, xaxis: { title: xCol }, showlegend: false, margin: { t: 60, r: 20, l: 50, b: 80 } };

                        {options.map(o => <option key={o} value={o}>{o}</option>)}

                                <span className="text-xs font-medium text-slate-700">{opt}</span>
                            </label>

                            {title}
                        </button>
                        
                        {isOpen && (

                                    <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-indigo-50">
                                        <div className="flex items-center text-indigo-800">
                                            <Info className="w-5 h-5 mr-2" />
                                            <h3 className="font-bold text-lg">{title}</h3>
                                        </div>
                                        <button onClick={() => setIsOpen(false)} className="text-slate-400 hover:text-slate-600 p-1 rounded-md hover:bg-slate-100 transition-colors">
                                            <X className="w-5 h-5" />
                                        </button>
                                    </div>
                                    <div className="p-5 text-sm text-slate-700 space-y-4">
                                        <div>
                                            <span className="block font-bold text-indigo-700 mb-1 border-l-4 border-indigo-500 pl-2">概要</span>
                                            <p className="leading-relaxed pl-3">{desc}</p>
                                        </div>
                                        <div>
                                            <span className="block font-bold text-emerald-700 mb-1 border-l-4 border-emerald-500 pl-2">適した分析</span>

                                        </div>

                                    <div className="p-4 border-t border-slate-200 flex justify-end bg-slate-50">
                                        <button onClick={() => setIsOpen(false)} className="px-5 py-2 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
                                            閉じる
                                        </button>
                                    </div>
                                </div>
                            </div>

                    </div>
                );
            };

            switch (analysisType) {
                case 'summary':
                    return (
                        <React.Fragment>
                            <AnalysisDescription 
                                title="基本統計量 (表)" 
                                desc="データ数、平均値、標準偏差、最小値、中央値、最大値を一覧表で表示します。" 
                                useCase="選択したデータ全体の傾向や散らばり具合を数値で正確に把握したい場合に適しています。" 
                            />
                        </React.Fragment>
                    );
                case 'timeseries':
                    return (
                        <React.Fragment>
                            <AnalysisDescription 
                                title="時系列推移 (折れ線グラフ)" 
                                desc="時間の経過に伴う数値の変化を折れ線で表示します。" 
                                useCase="支持率などが月ごとや調査日ごとにどのように変化しているか、上昇・下降トレンドを確認するのに適しています。" 
                            />
                            {processed.columns.date.length > 0 ? <SelectControl label="X軸 (日付)" value={xAxis} onChange={setXAxis} options={processed.columns.date} /> : <p className="text-xs text-red-500 mb-2">日付と判定される列がありません。</p>}
                            <CheckboxesControl label="Y軸 (表示する数値)" options={activeNums} selected={yAxisChk} onChange={toggleYAxisChk} />
                        </React.Fragment>
                    );
                case 'comparison':
                case 'boxplot':
                case 'stackedbar':
                    let catOpts = [...processed.columns.categorical, ...processed.columns.date];
                    let descObj = {};
                    if(analysisType === 'comparison') descObj = { title: "カテゴリ別平均 (棒グラフ)", desc: "機関名や調査月などのグループごとに、平均値を棒グラフで並べて比較します。", useCase: "各機関の支持率の違いや、特定の月の平均的な支持率の比較など、グループ間の大小関係を見るのに適しています。" };

                case 'correlation':

      const handleDownloadImage = async (elementId, filename) => {
        // Function handles image downloading
        const element = document.getElementById(elementId);
        if (!element) return;
        
        try {
          let h2c = window.html2canvas;
          if (!h2c) {
            await new Promise((resolve, reject) => {
              const script = document.createElement('script');
              script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
              script.onload = () => resolve();
              script.onerror = reject;
              document.head.appendChild(script);
            });
            h2c = window.html2canvas;
          }

          const canvas = await h2c(element, {
            backgroundColor: '#ffffff',
            scale: 2,
            logging: false,
          });

          const dataUrl = canvas.toDataURL('image/png');
          
          try {
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          } catch (dlError) {
            console.warn('Auto download blocked by browser environment', dlError);
          }
        } catch (err) {
          console.error('Image generation error:', err);
        }
      };

        const prevAverages = useMemo(() => {

                pastPolls.sort((a, b) => new Date(b.date) - new Date(a.date));

            const latestDate = dates[dates.length - 1];
            if (!latestDate) return {};
            
            const latestMonth = latestDate.substring(0, 7);

            targetPastPolls = polls.filter(p => 
                p.date && 
                p.date.substring(0, 7) === prevMonth &&

          if (targetPastPolls.length === 0) return {};

          targetPastPolls.forEach(poll => {

            if (typeof poll.cabinetSupport === 'number') { sums.cabinetSupport = (sums.cabinetSupport || 0) + poll.cabinetSupport; counts.cabinetSupport = (counts.cabinetSupport || 0) + 1; }
            if (typeof poll.cabinetNonsupport === 'number') { sums.cabinetNonsupport = (sums.cabinetNonsupport || 0) + poll.cabinetNonsupport; counts.cabinetNonsupport = (counts.cabinetNonsupport || 0) + 1; }
          });

          const avgs = {};
          PARTIES.forEach(p => avgs[p.key] = counts[p.key] ? parseFloat((sums[p.key] / counts[p.key]).toFixed(1)) : null);
          avgs.cabinetSupport = counts.cabinetSupport ? parseFloat((sums.cabinetSupport / counts.cabinetSupport).toFixed(1)) : null;
          avgs.cabinetNonsupport = counts.cabinetNonsupport ? parseFloat((sums.cabinetNonsupport / counts.cabinetNonsupport).toFixed(1)) : null;

          return avgs;

        const tablePolls = useMemo(() => {
          const allOptions = ['average', ...availableMediaFilter];

              const indexA = MEDIA_OPTIONS.indexOf(a.media);
              const indexB = MEDIA_OPTIONS.indexOf(b.media);
              const orderA = indexA !== -1 ? indexA : MEDIA_OPTIONS.length;
              const orderB = indexB !== -1 ? indexB : MEDIA_OPTIONS.length;
              return orderA - orderB;
            });
          } else {

              const orderA = indexA !== -1 ? indexA : MEDIA_OPTIONS.length;
              const orderB = indexB !== -1 ? indexB : MEDIA_OPTIONS.length;
              if (orderA !== orderB) return orderA - orderB;
              return new Date(b.date) - new Date(a.date);

                pollWithMoM.mom.cabinetNonsupport = calcDiff(poll.cabinetNonsupport, prevData.cabinetNonsupport);
                PARTIES.forEach(p => {

        const handleSubmit = async (e) => {

        const handleBulkSubmit = async (e) => {
          e.preventDefault();
          if (!isAdmin) return;
          if (!bulkData.trim()) return setErrorMsg("データを入力してください。");

          setIsSubmitting(true);
          setErrorMsg('');
          setInfoMsg('');

          try {
            const batch = writeBatch(db);
            const pollsCollectionPath = collection(db, 'artifacts', appId, 'public', 'data', 'polls');
            const lines = bulkData.trim().split('\n');
            
            let count = 0;
            let skippedCount = 0;
            const newKeysThisBatch = new Set(); 

            for (const line of lines) {
              if(!line.trim()) continue;
              const normalizedLine = line.replace(/[０-９．％]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');

              let cols = normalizedLine.split(/\t|,/);
              if (cols.length < 5) cols = normalizedLine.split(/\s+/);
              cols = cols.map(c => c.trim().replace(/%/g, ''));
              
              if (cols.length < 3 || cols[0].includes('平均')) continue;

              const jiminVal = parseFloat(cols[1]);
              if (isNaN(jiminVal)) continue;
              
              const mediaName = cols[0];
              let dateStr = '';
              if (cols[cols.length - 1] && (cols[cols.length - 1].includes('/') || cols[cols.length - 1].includes('-'))) dateStr = cols[cols.length - 1];
              else if (cols.length > 1 && cols[cols.length - 2] && (cols[cols.length - 2].includes('/') || cols[cols.length - 2].includes('-'))) dateStr = cols[cols.length - 2];

              const parsedDate = parseDateString(dateStr) || new Date().toISOString().split('T')[0];
              const uniqueKey = `${mediaName}_${parsedDate}`;
              if (isDuplicate(mediaName, parsedDate) || newKeysThisBatch.has(uniqueKey)) {
                skippedCount++;
                continue;
              }

              const dataToSave = { media: mediaName, date: parsedDate, createdAt: new Date().toISOString() };
              IMPORT_COLUMN_KEYS.forEach((key, idx) => {
                if (idx + 1 < cols.length) {
                  const val = parseFloat(cols[idx + 1]);
                  if (!isNaN(val)) dataToSave[key] = val;
                }
              });

              const cabSup = parseFloat(cols[13]);
              if (!isNaN(cabSup) && cols[13] !== dateStr) dataToSave.cabinetSupport = cabSup;

              const cabNon = parseFloat(cols[14]);
              if (!isNaN(cabNon) && cols[14] !== dateStr) dataToSave.cabinetNonsupport = cabNon;

              batch.set(doc(pollsCollectionPath), dataToSave);
              newKeysThisBatch.add(uniqueKey);
              count++;
            }

            if (count === 0 && skippedCount === 0) {
              setIsSubmitting(false);
              return setErrorMsg("登録可能なデータが見つかりませんでした。");
            }

            if (count > 0) await batch.commit();
            
            setBulkData('');
            handleTabChange('table');
            
            let msg = `${count}件のデータを登録しました。`;
            if (skippedCount > 0) msg += ` (既に登録済みの${skippedCount}件はスキップしました)`;
            setInfoMsg(msg);
            
            const monthsWithData = polls.map(p => p.date.substring(0, 7));
            const latestDataMonth = monthsWithData.sort((a, b) => b.localeCompare(a))[0];
            if (latestDataMonth) setSelectedMonths([latestDataMonth]);
          } catch (error) {
            console.error("Bulk save error:", error);
            setErrorMsg("一括登録に失敗しました。Firebaseのルール設定を確認してください。");
          } finally {
            setIsSubmitting(false);
          }
        };

        const handleDeleteClick = (id) => setDeletingId(id);
        const confirmDelete = async () => {
          if (!deletingId || !isAdmin) return;
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'polls', deletingId));
            setDeletingId(null);
            setInfoMsg("データを削除しました。");
          } catch (error) {
            console.error("Error deleting doc:", error);
            setErrorMsg("削除に失敗しました。");
            setDeletingId(null);
          }
        };

        const handleEdit = (poll) => {
          setFormData({
            media: poll.media || '',
            date: poll.date || '',
            cabinetSupport: poll.cabinetSupport ?? '',
            cabinetNonsupport: poll.cabinetNonsupport ?? '',
            ...PARTIES.reduce((acc, p) => ({ ...acc, [p.key]: poll[p.key] ?? '' }), {})
          });
          setEditingId(poll.id);
          setInputMode('single');
          setActiveTab('input');
        };

        const cancelEdit = () => {
          setEditingId(null);
          setFormData(initialFormState);
        };

        const handleInputChange = (e) => {
          const { name, value } = e.target;
          setFormData(prev => ({ ...prev, [name]: value }));
        };

        const chartDataArray = useMemo(() => {
          const mediaList = selectedMediaForChart === null ? ['average', ...availableMediaFilter] : selectedMediaForChart;
          const monthList = selectedMonths === null ? availableMonths.filter(m => m !== 'latest') : selectedMonths;
          
          let sortedMediaList = [...mediaList];
          
          if (sortOrder === 'date') {
            const latestDates = {};
            sortedMediaList.forEach(m => {
               if (m === 'average') {
                  latestDates[m] = Infinity;
               } else {
                  const p = filteredPolls.find(poll => poll.media === m);
                  latestDates[m] = p ? new Date(p.date).getTime() : 0;
               }
            });
            sortedMediaList.sort((a, b) => {
               if (a === 'average') return -1;
               if (b === 'average') return 1;
               if (latestDates[a] !== latestDates[b]) return latestDates[b] - latestDates[a];
               const indexA = MEDIA_OPTIONS.indexOf(a);
               const indexB = MEDIA_OPTIONS.indexOf(b);
               const orderA = indexA !== -1 ? indexA : MEDIA_OPTIONS.length;
               const orderB = indexB !== -1 ? indexB : MEDIA_OPTIONS.length;
               return orderA - orderB;
            });
          } else {
            sortedMediaList.sort((a, b) => {
               if (a === 'average') return -1;
               if (b === 'average') return 1;
               const indexA = MEDIA_OPTIONS.indexOf(a);
               const indexB = MEDIA_OPTIONS.indexOf(b);
               const orderA = indexA !== -1 ? indexA : MEDIA_OPTIONS.length;
               const orderB = indexB !== -1 ? indexB : MEDIA_OPTIONS.length;
               return orderA - orderB;
            });
          }

          const result = [];

          sortedMediaList.forEach(mediaName => {
            monthList.forEach(monthStr => {
              let targetPolls = [];
              let isAverageRow = false;

              if (monthStr === 'latest') {
                const latestPollsByMedia = new Map();
                polls.forEach(p => {
                  if (!latestPollsByMedia.has(p.media)) {
                    latestPollsByMedia.set(p.media, p);
                  } else {
                    const existing = latestPollsByMedia.get(p.media);
                    if (new Date(p.date) > new Date(existing.date)) {
                      latestPollsByMedia.set(p.media, p);
                    }
                  }
                });
                const latestArray = Array.from(latestPollsByMedia.values());
                
                if (mediaName === 'average') {
                  const mediaToInclude = mediaList.filter(m => m !== 'average');
                  targetPolls = mediaToInclude.length > 0 
                    ? latestArray.filter(p => mediaToInclude.includes(p.media))
                    : latestArray;
                  isAverageRow = true;
                } else {
                  targetPolls = latestArray.filter(p => p.media === mediaName);
                }
              } else {
                const pollsInMonth = polls.filter(p => p.date && p.date.substring(0, 7) === monthStr);
                if (mediaName === 'average') {
                  const mediaToInclude = mediaList.filter(m => m !== 'average');
                  targetPolls = mediaToInclude.length > 0 
                    ? pollsInMonth.filter(p => mediaToInclude.includes(p.media))
                    : pollsInMonth;
                  isAverageRow = true;
                } else {
                  targetPolls = pollsInMonth.filter(p => p.media === mediaName);
                }
              }

              if (targetPolls.length === 0) return;

              const sums = {};
              const counts = {};
              targetPolls.forEach(poll => {
                PARTIES.forEach(p => {
                  if (typeof poll[p.key] === 'number') { sums[p.key] = (sums[p.key] || 0) + poll[p.key]; counts[p.key] = (counts[p.key] || 0) + 1; }
                });
                if (typeof poll.cabinetSupport === 'number') { sums.cabinetSupport = (sums.cabinetSupport || 0) + poll.cabinetSupport; counts.cabinetSupport = (counts.cabinetSupport || 0) + 1; }
                if (typeof poll.cabinetNonsupport === 'number') { sums.cabinetNonsupport = (sums.cabinetNonsupport || 0) + poll.cabinetNonsupport; counts.cabinetNonsupport = (counts.cabinetNonsupport || 0) + 1; }
              });

              const displayName = mediaName === 'average' ? '平均値' : mediaName;
              let nameLabel = displayName;
              
              if (monthStr === 'latest') {
                nameLabel = monthList.length > 1 ? `${displayName}\n(最新)` : displayName;
              } else {
                const [y, m] = monthStr.split('-');
                const formattedMonth = `${y.slice(2)}年${parseInt(m, 10)}月`;
                nameLabel = monthList.length > 1 ? `${displayName}\n(${formattedMonth})` : displayName;
              }

              const row = { name: nameLabel, originalMedia: mediaName, month: monthStr, isAverageRow };
              PARTIES.forEach(p => row[p.key] = counts[p.key] ? parseFloat((sums[p.key] / counts[p.key]).toFixed(1)) : 0);
              row.cabinetSupport = counts.cabinetSupport ? parseFloat((sums.cabinetSupport / counts.cabinetSupport).toFixed(1)) : 0;
              row.cabinetNonsupport = counts.cabinetNonsupport ? parseFloat((sums.cabinetNonsupport / counts.cabinetNonsupport).toFixed(1)) : 0;
              
              const cabUnknown = Math.max(0, 100 - (row.cabinetSupport || 0) - (row.cabinetNonsupport || 0));
              row.cabinetUnknown = parseFloat(cabUnknown.toFixed(1));

              result.push(row);
            });
          });

          return result;
        }, [polls, selectedMediaForChart, availableMediaFilter, selectedMonths, availableMonths, filteredPolls, sortOrder]);

        const isSingleData = chartDataArray.length === 1;
        const singleDataName = isSingleData ? chartDataArray[0].name : '';

        const singlePartyData = useMemo(() => {
          if (!isSingleData) return [];
          return PARTIES.map(p => ({
            name: p.label,
            [singleDataName]: chartDataArray[0][p.key] || 0,

        }, [chartDataArray, isSingleData, singleDataName]);

        const singleCabinetData = useMemo(() => {
          if (!isSingleData) return [];
          return [
            { name: '支持', [singleDataName]: chartDataArray[0].cabinetSupport || 0, fill: '#3b82f6' },
            { name: '不支持', [singleDataName]: chartDataArray[0].cabinetNonsupport || 0, fill: '#ef4444' }
          ].filter(d => d[singleDataName] > 0);
        }, [chartDataArray, isSingleData, singleDataName]);

        const groupedPartyData = useMemo(() => {
          if (isSingleData) return [];
          return PARTIES.map(p => {
            const result = { name: p.label };
            chartDataArray.forEach(dataRow => {
              result[dataRow.name] = dataRow[p.key] || 0;

            return result;

        }, [chartDataArray, isSingleData]);

        const groupedCabinetData = useMemo(() => {

          const supportRow = { name: '支持' };
          const nonsupportRow = { name: '不支持' };
          chartDataArray.forEach(dataRow => {
            supportRow[dataRow.name] = dataRow.cabinetSupport || 0;
            nonsupportRow[dataRow.name] = dataRow.cabinetNonsupport || 0;
          });
          return [supportRow, nonsupportRow];
        }, [chartDataArray, isSingleData]);

        const chartAggregateData = useMemo(() => {
          const mediaList = selectedMediaForChart === null ? ['average', ...availableMediaFilter] : selectedMediaForChart;
          const targetMediaList = mediaList.filter(m => m !== 'average');
          
          let targetPolls = [];
          if (targetMediaList.length === 0 && mediaList.includes('average')) {
              targetPolls = filteredPolls;
          } else {
              targetPolls = filteredPolls.filter(p => targetMediaList.includes(p.media));
          }

          if (targetPolls.length === 0) return null;

          const sums = {};
          const counts = {};
          targetPolls.forEach(poll => {
            PARTIES.forEach(p => {
              if (typeof poll[p.key] === 'number') { sums[p.key] = (sums[p.key] || 0) + poll[p.key]; counts[p.key] = (counts[p.key] || 0) + 1; }
            });
            if (typeof poll.cabinetSupport === 'number') { sums.cabinetSupport = (sums.cabinetSupport || 0) + poll.cabinetSupport; counts.cabinetSupport = (counts.cabinetSupport || 0) + 1; }
            if (typeof poll.cabinetNonsupport === 'number') { sums.cabinetNonsupport = (sums.cabinetNonsupport || 0) + poll.cabinetNonsupport; counts.cabinetNonsupport = (counts.cabinetNonsupport || 0) + 1; }
          });

          const result = {};
          PARTIES.forEach(p => result[p.key] = counts[p.key] ? parseFloat((sums[p.key] / counts[p.key]).toFixed(1)) : 0);
          result.cabinetSupport = counts.cabinetSupport ? parseFloat((sums.cabinetSupport / counts.cabinetSupport).toFixed(1)) : 0;
          result.cabinetNonsupport = counts.cabinetNonsupport ? parseFloat((sums.cabinetNonsupport / counts.cabinetNonsupport).toFixed(1)) : 0;
          
          return result;
        }, [filteredPolls, selectedMediaForChart, availableMediaFilter]);

        const partyPieData = useMemo(() => {
          if (!chartAggregateData) return [];
          return PARTIES.map(p => ({
            name: p.label,
            支持率: chartAggregateData[p.key] || 0,
            color: p.color
          })).filter(d => d.支持率 > 0);
        }, [chartAggregateData]);

        const cabinetPieData = useMemo(() => {
          if (!chartAggregateData) return [];
          const cabSup = chartAggregateData.cabinetSupport || 0;
          const cabNon = chartAggregateData.cabinetNonsupport || 0;
          const cabUnknown = Math.max(0, 100 - cabSup - cabNon);
          return [
            { name: '支持', value: cabSup, fill: '#3b82f6' },
            { name: '不支持', value: cabNon, fill: '#ef4444' },
            { name: '不明/その他', value: parseFloat(cabUnknown.toFixed(1)), fill: '#cbd5e1' }
          ].filter(d => d.value > 0);
        }, [chartAggregateData]);

        const trendData = useMemo(() => {
          if(polls.length === 0) return [];
          const monthlyStats = {};
          
          const mediaList = selectedMediaForChart === null ? ['average', ...availableMediaFilter] : selectedMediaForChart;
          const targetMediaList = mediaList.filter(m => m !== 'average');
          const useAllMedia = targetMediaList.length === 0;

          polls.forEach(poll => {
            if(!poll.date) return;
            if (!useAllMedia && !targetMediaList.includes(poll.media)) return;
            
            const month = poll.date.substring(0, 7); 
            if(!monthlyStats[month]) {
              monthlyStats[month] = { month, counts: {}, sums: {} };
              PARTIES.forEach(p => { monthlyStats[month].counts[p.key] = 0; monthlyStats[month].sums[p.key] = 0; });
              monthlyStats[month].counts.cabinetSupport = 0; monthlyStats[month].sums.cabinetSupport = 0;
              monthlyStats[month].counts.cabinetNonsupport = 0; monthlyStats[month].sums.cabinetNonsupport = 0;
            }
            PARTIES.forEach(p => {
              if(typeof poll[p.key] === 'number') { monthlyStats[month].sums[p.key] += poll[p.key]; monthlyStats[month].counts[p.key]++; }
            });
            if(typeof poll.cabinetSupport === 'number') { monthlyStats[month].sums.cabinetSupport += poll.cabinetSupport; monthlyStats[month].counts.cabinetSupport++; }
            if(typeof poll.cabinetNonsupport === 'number') { monthlyStats[month].sums.cabinetNonsupport += poll.cabinetNonsupport; monthlyStats[month].counts.cabinetNonsupport++; }
          });

          return Object.values(monthlyStats).map(stat => {
            const result = { name: stat.month };
            PARTIES.forEach(p => { result[p.key] = stat.counts[p.key] > 0 ? parseFloat((stat.sums[p.key] / stat.counts[p.key]).toFixed(1)) : null; });
            result.cabinetSupport = stat.counts.cabinetSupport > 0 ? parseFloat((stat.sums.cabinetSupport / stat.counts.cabinetSupport).toFixed(1)) : null;
            result.cabinetNonsupport = stat.counts.cabinetNonsupport > 0 ? parseFloat((stat.sums.cabinetNonsupport / stat.counts.cabinetNonsupport).toFixed(1)) : null;
            return result;
          }).sort((a, b) => a.name.localeCompare(b.name));
        }, [polls, selectedMediaForChart, availableMediaFilter]);

        // AI分析の実行 (自動リトライ対応)
        const handleAnalyze = async () => {
          setIsAnalyzing(true);
          setInfoMsg("最新データを分析中です...");
          
          try {
            const recentMonths = availableMonths.filter(m => m !== 'latest').slice(0, 6);
            const recentTrendData = trendData.filter(d => recentMonths.includes(d.name)).slice(-6);
            
            const dataStrList = [];
            dataStrList.push("【各月の平均支持率推移（直近6ヶ月）】");
            recentTrendData.forEach(d => {
              let str = `[${d.name}] 内閣支持:${d.cabinetSupport}% 不支持:${d.cabinetNonsupport}% | `;
              const partyStrs = PARTIES.map(p => `${p.label}:${d[p.key] || 0}%`).join(', ');
              str += partyStrs;
              dataStrList.push(str);
            });

            const prompt = `以下の政党支持率・内閣支持率の月次推移データをもとに、内閣支持率と各政党の支持率の推移、および直近の動向を分析してください。分析は客観的かつプロの政治アナリストの視点で、分かりやすく300〜500文字程度でまとめてください。マークダウン等は使用せずプレーンテキストで回答してください。\n\n${dataStrList.join('\n')}`;

            // APIキーは常に空文字にし、システム内蔵のプレビューモデルを使用する
            const apiKey = "";
            const modelName = 'gemini-2.5-flash-preview-09-2025';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            const payload = {
              contents: [{ parts: [{ text: prompt }] }],
              systemInstruction: { parts: [{ text: "あなたはプロの政治アナリストです。提供されたデータから客観的な事実と傾向を抽出して分析してください。特定の政党を応援・批判するような主観的な意見は避けてください。" }] }
            };

            let success = false;
            let comment = "";
            let lastErrorMsg = "";
            const delays = [1000, 2000, 4000, 8000, 16000];

            // 5回までの自動リトライ (エクスポネンシャル・バックオフ)
            for (let i = 0; i <= 5; i++) {
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });

                if (!response.ok) {
                  const errorData = await response.json();
                  throw new Error(errorData.error?.message || "API呼び出しに失敗しました");
                }

                const data = await response.json();
                comment = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (comment) {
                  success = true;
                  break;
                } else {
                   throw new Error("分析コメントが生成されませんでした。");
                }
              } catch (err) {
                lastErrorMsg = err.message;
                if (i < 5) {
                  await new Promise(res => setTimeout(res, delays[i]));
                }
              }
            }

            if (success) {
              try {
                const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
                await setDoc(configDocRef, { 
                  aiComment: comment, 
                  aiCommentUpdatedAt: new Date().toISOString() 
                }, { merge: true });
                setInfoMsg("分析が完了しました。");
              } catch (dbErr) {
                setErrorMsg("分析は完了しましたが、データベースへの保存に失敗しました。");
              }
            } else {
              setErrorMsg(`分析エラー: システム内蔵AIの呼び出しに失敗しました。（詳細: ${lastErrorMsg}）`);
            }
          } catch (err) {
            console.error("Analysis Error:", err);
            setErrorMsg("分析中に予期せぬエラーが発生しました: " + err.message);
          } finally {
            setIsAnalyzing(false);
          }
        };

        const confirmDeleteComment = async () => {
          if (!isAdmin) return;
          setIsSubmitting(true);
          try {
            const configDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
            await updateDoc(configDocRef, { aiComment: deleteField(), aiCommentUpdatedAt: deleteField() });
            setInfoMsg("分析コメントを削除しました。");
          } catch (error) {
            console.error(error);
            setErrorMsg("コメントの削除に失敗しました。");
          } finally {
            setIsSubmitting(false);
            setShowDeleteCommentConfirm(false);
          }
        };

        const customTooltipFormatter = (value, name) => [`${value}%`, name];

        if (isLoadingData && !errorMsg) {
          return (
            <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-center">
              <Loader2 className="w-12 h-12 text-blue-600 animate-spin mb-4" />
              <p className="text-slate-600 font-medium">データを読み込み中...</p>
            </div>
          );
        }

        const displayMonthText = selectedMonths === null ? '全期間' : 
                                 isLatestOnly ? '最新データ' :
                                 selectedMonths.length === 1 ? selectedMonths[0] : 
                                 `${selectedMonths.length}ヶ月分`;

        const nonAveragePolls = tablePolls.filter(p => !p.isAverage);
        const areAllLatestCurrentMonth = nonAveragePolls.length > 0 && nonAveragePolls.every(p => p.date && p.date.startsWith(currentMonthStrForHighlight));

        return (
          <div className="min-h-screen bg-slate-100 text-slate-800 p-4 md:p-8 font-sans">
            <div className="max-w-7xl mx-auto bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
              
              <div className="bg-slate-800 text-white p-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center">
                  <div>
                    <div className="flex flex-col sm:flex-row sm:items-baseline sm:space-x-3">
                      <h1 className="text-2xl font-bold">報道機関別政党・内閣支持率</h1>
                      {formattedUpdateDate && (
                        <span className="text-sm text-slate-300 mt-1 sm:mt-0 font-medium">
                          (更新日: {formattedUpdateDate})
                        </span>
                      )}
                    </div>
                  </div>
                  
                  <div className="mt-4 sm:mt-0 flex space-x-2">
                    <button 
                      onClick={() => setShowHelpModal(true)} 
                      className="flex items-center px-3 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm font-medium transition-colors" 
                      title="使い方（ヘルプ）"
                    >
                      <HelpCircle className="w-4 h-4 mr-1" /> 使い方
                    </button>
                    {(activeTab === 'table' || activeTab === 'chart') && tablePolls.length > 0 && (
                      <>
                        <button onClick={() => handleExport('csv')} className="flex items-center px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm transition-colors" title="CSV出力">
                          <Download className="w-4 h-4 mr-1" /> CSV
                        </button>
                        <button onClick={() => handleExport('excel')} className="flex items-center px-3 py-2 bg-emerald-700 hover:bg-emerald-600 rounded text-sm transition-colors" title="Excel出力">
                          <FileSpreadsheet className="w-4 h-4 mr-1" /> Excel
                        </button>
                      </>
                    )}
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center border-b border-slate-200 bg-slate-50 overflow-x-auto">
                <div className="flex">
                  <button onClick={() => handleTabChange('table')} className={`flex items-center px-6 py-4 text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'table' ? 'border-b-2 border-blue-600 text-blue-700 bg-white' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}>
                    <TableIcon className="w-4 h-4 mr-2" /> 一覧表示
                  </button>
                  <button onClick={() => handleTabChange('chart')} className={`flex items-center px-6 py-4 text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'chart' ? 'border-b-2 border-blue-600 text-blue-700 bg-white' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}>
                    <BarChart2 className="w-4 h-4 mr-2" /> グラフ分析
                  </button>
                  <button onClick={() => handleTabChange('advanced')} className={`flex items-center px-6 py-4 text-sm font-medium transition-colors whitespace-nowrap ${activeTab === 'advanced' ? 'border-b-2 border-blue-600 text-blue-700 bg-white' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}>
                    <ActivityIcon className="w-4 h-4 mr-2" /> データ分析
                  </button>
                </div>
                <div className="flex items-center pr-4 md:pr-6 py-2 whitespace-nowrap space-x-3">
                  <button 
                    onClick={handleGearClick}
                    className={`flex items-center justify-center p-2 rounded-full transition-colors ${activeTab === 'input' ? 'text-blue-600 bg-blue-50' : 'text-slate-400 hover:text-slate-600 hover:bg-slate-100'}`}
                    title="データ管理・設定 (管理者専用)"
                  >
                    <Settings className="w-4 h-4" />

                  <button 
                    onClick={() => {
