                    className="flex items-center px-4 py-2 text-sm font-bold text-slate-700 bg-white hover:bg-slate-50 border border-slate-300 rounded-md transition-colors shadow-sm"
                  >
                    <Home className="w-4 h-4 mr-1.5" /> 初期画面に戻る
                  </button>
                  <a 
                    href={mediaLinks['全体'] || 'https://report.rifj.jp/repute'} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="flex items-center px-4 py-2 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-md transition-colors shadow-sm"
                  >
                    支持率総合分析 <ExternalLink className="w-4 h-4 ml-1.5" />
                  </a>
                </div>
              </div>

              {(activeTab === 'table' || activeTab === 'chart') && (
                <div className="bg-slate-100 px-6 py-3 border-b border-slate-200 flex flex-wrap gap-3 items-center justify-between">
                  <div className="flex flex-wrap items-center gap-2 w-full md:w-auto overflow-visible">
                    
                    <MultiSelectDropdown 
                      label="表示対象月"
                      options={availableMonths}
                      selectedValues={selectedMonths}
                      onChange={setSelectedMonths}
                      hasAverageOption={false}
                      defaultToggleValue={['latest']}
                      formatOption={(val) => {
                        if (!val) return '';

                            </p>
                            <div className="h-96 w-full">
                              <ResponsiveContainer width="100%" height="100%">
                                <LineChart data={trendData} margin={{ top: 10, right: 30, left: 0, bottom: 20 }}>
                                  <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                  <XAxis dataKey="name" tick={{fill: '#475569'}} />
                                  <YAxis unit="%" tick={{fill: '#475569'}} />
                                  <RechartsTooltip formatter={customTooltipFormatter} contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} />
                                  <Legend wrapperStyle={{ paddingTop: '20px' }} />
                                  
                                  <Line type="monotone" dataKey="cabinetSupport" name="内閣支持" stroke="#3b82f6" strokeWidth={3} strokeDasharray="5 5" dot={{ r: 4 }} activeDot={{ r: 6 }} />
                                  <Line type="monotone" dataKey="cabinetNonsupport" name="内閣不支持" stroke="#ef4444" strokeWidth={3} strokeDasharray="5 5" dot={{ r: 4 }} activeDot={{ r: 6 }} />
                                  
                                  {PARTIES.map(p => (
                                    <Line key={p.key} type="monotone" dataKey={p.key} name={p.label} stroke={p.color} strokeWidth={2} dot={{ r: 3 }} activeDot={{ r: 5 }} />
                                  ))}
                                </LineChart>
                              </ResponsiveContainer>
                            </div>
                          </div>
                        )}
                      </React.Fragment>
                    )}
                  </div>
                )}
                
              </div>

              {deletingId && (
                <div className="fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50 p-4 animate-in fade-in">
                  <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full border border-slate-200">
                    <div className="flex items-center text-red-600 mb-4">
                      <AlertCircle className="w-6 h-6 mr-2" />
                      <h3 className="text-lg font-bold">データの削除</h3>
                    </div>
                    <p className="text-slate-600 mb-6 text-sm">このデータを削除してもよろしいですか？<br/>この操作は取り消すことができません。</p>
                    <div className="flex justify-end space-x-3">
                      <button 
                        onClick={() => setDeletingId(null)} 
                        className="px-4 py-2 bg-slate-100 text-slate-700 font-medium rounded-lg hover:bg-slate-200 transition-colors"
                      >
                        キャンセル
                      </button>
                      <button 
                        onClick={confirmDelete} 
                        className="px-4 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 transition-colors shadow-sm"
                      >
                        削除する
                      </button>
                    </div>
                  </div>
                </div>
              )}
              
              {showDeleteCommentConfirm && (
                <div className="fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50 p-4 animate-in fade-in">
                  <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full border border-slate-200">
                    <div className="flex items-center text-red-600 mb-4">
                      <AlertCircle className="w-6 h-6 mr-2" />
                      <h3 className="text-lg font-bold">コメントの削除</h3>
                    </div>
                    <p className="text-slate-600 mb-6 text-sm">現在の分析コメントを削除してよろしいですか？</p>
                    <div className="flex justify-end space-x-3">
                      <button 
                        onClick={() => setShowDeleteCommentConfirm(false)} 
                        className="px-4 py-2 bg-slate-100 text-slate-700 font-medium rounded-lg hover:bg-slate-200 transition-colors"
                      >
                        キャンセル
                      </button>
                      <button 
                        onClick={confirmDeleteComment} 
                        disabled={isSubmitting}
                        className="px-4 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 transition-colors shadow-sm disabled:opacity-50"
                      >
                        {isSubmitting ? '削除中...' : '削除する'}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showLoginModal && (
                <div className="fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50 p-4 animate-in fade-in">
                  <div className="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full border border-slate-200">
                    <div className="flex justify-center mb-4 text-blue-600">
                      <Lock className="w-12 h-12" />
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2 text-center">管理者ログイン</h3>
                    <p className="text-sm text-slate-500 mb-6 text-center">この操作を行うにはパスワードが必要です。</p>
                    
                    <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                        <input 
                          type="password" 
                          value={adminPassword} 
                          onChange={(e) => setAdminPassword(e.target.value)} 
                          className="w-full h-11 px-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" 
                          placeholder="パスワードを入力"
                          autoFocus
                        />
                      </div>
                      <div className="flex justify-end space-x-3 mt-2">
                        <button type="button" onClick={cancelLoginModal} className="flex-1 h-11 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg transition-colors">
                          キャンセル
                        </button>
                        <button type="submit" className="flex-1 h-11 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm transition-colors">
                          ログイン
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {showHelpModal && (
                <div className="fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50 p-4 animate-in fade-in">
                  <div className="bg-white rounded-xl shadow-xl max-w-2xl w-full border border-slate-200 max-h-[90vh] flex flex-col">
                    
                    {/* Modal Header */}
                    <div className="flex justify-between items-center p-5 border-b border-slate-200">
                      <div className="flex items-center text-blue-600">
                        <HelpCircle className="w-6 h-6 mr-2" />
                        <h3 className="text-xl font-bold text-slate-800">ツールの使い方</h3>
                      </div>
                      <button onClick={() => setShowHelpModal(false)} className="text-slate-400 hover:text-slate-600 p-1 rounded-md hover:bg-slate-100 transition-colors">
                        <X className="w-6 h-6" />
                      </button>
                    </div>

                    {/* Modal Body (Scrollable) */}
                    <div className="p-6 overflow-y-auto space-y-6 text-sm text-slate-700 leading-relaxed custom-scrollbar">
                      
                      <section>
                        <h4 className="font-bold text-base text-slate-800 mb-2 border-l-4 border-blue-500 pl-2">ツール概要</h4>
                        <p>このツールは、各報道機関が発表する「政党支持率」および「内閣支持率」の調査結果を一元管理し、平均値の算出や各種グラフによる比較、さらにはAIによる動向分析などを行うためのアプリケーションです。</p>
                      </section>

                      <section>
                        <h4 className="font-bold text-base text-slate-800 mb-2 border-l-4 border-blue-500 pl-2">主要な機能</h4>
                        <ul className="space-y-4">
                          <li>
                            <span className="font-semibold bg-slate-100 px-1.5 py-0.5 rounded text-blue-800 border border-slate-200 inline-block mb-1">一覧表示タブ</span><br/>
                            各調査機関のデータが表形式（テーブル）またはカード形式で確認できます。「表示機関」や「表示対象月」のプルダウンから、特定のデータのみを絞り込むことが可能です。<br/>
                            <ul className="list-disc list-inside text-slate-600 mt-1.5 ml-1 space-y-1">
                              <li>「前月比」ボタンを押すと、前回調査との差分が表示されます。</li>
                              <li>「縦横切替」ボタンで、表の行と列を反転させて比較しやすくできます。</li>
                              <li>「テーブル」「カード」ボタンで表示形式を切り替えられます。</li>
                            </ul>
                          </li>
                          <li>
                            <span className="font-semibold bg-slate-100 px-1.5 py-0.5 rounded text-blue-800 border border-slate-200 inline-block mb-1">グラフ分析タブ</span><br/>
                            データを視覚的に分析できます。初期状態では全機関の「平均値」が表示されます。<br/>
                            <ul className="list-disc list-inside text-slate-600 mt-1.5 ml-1 space-y-1">
                              <li>「表示データ」から複数の機関を選ぶと、自動的に比較しやすい並列の棒グラフに切り替わります。</li>
                              <li>「棒グラフ」「積み上げ」「円グラフ」ボタンで、グラフの種類を切り替えられます。</li>
                              <li>画面下部には、長期間の支持率の変化をたどる「トレンド（折れ線）グラフ」が表示されます。</li>
                              <li>各グラフの右上にある「カメラ」アイコンをクリックすると、表示中のグラフを画像として保存（ダウンロード）できます。</li>
                            </ul>
                          </li>
                          <li>
                            <span className="font-semibold bg-slate-100 px-1.5 py-0.5 rounded text-blue-800 border border-slate-200 inline-block mb-1">データ分析タブ</span><br/>
                            統計的な視点からより高度なデータ分析を行うことができます。<br/>
                            <ul className="list-disc list-inside text-slate-600 mt-1.5 ml-1 space-y-1">
                              <li>左側のパネルで「期間」「カテゴリ」「調べる数値」などを絞り込みます。</li>
                              <li>「分析手法の選択」から、基本統計量、箱ひげ図、ヒートマップ（相関）、散布図、レーダーチャートなど10種類以上の分析手法を選べます。</li>
                              <li>条件を指定して「グラフを更新」を押すと、右側に分析結果が描画されます。</li>
                            </ul>
                          </li>
                          <li>
                            <span className="font-semibold bg-slate-100 px-1.5 py-0.5 rounded text-indigo-800 border border-slate-200 inline-block mb-1">AIによる動向分析</span><br/>
                            一覧表示・グラフ分析タブの下部に、最新のデータ推移（直近6ヶ月）に基づいたAIの分析コメントが表示されます。客観的な傾向を素早く把握するのに役立ちます。
                          </li>
                          <li>
                            <span className="font-semibold bg-slate-100 px-1.5 py-0.5 rounded text-emerald-800 border border-slate-200 inline-block mb-1">便利な操作・データ出力</span><br/>
                            <ul className="list-disc list-inside text-slate-600 mt-1 ml-1 space-y-1">
                              <li>「今月」「最新表示」「デフォルトに戻す」ボタンを使って、ワンタッチで表示期間を切り替え・リセットできます。</li>
                              <li>画面右上にある「CSV」または「Excel」ボタンをクリックすると、現在画面に表示されている絞り込み状態のままデータをダウンロードできます。</li>
                            </ul>
                          </li>
                        </ul>
                      </section>

                    </div>

                    {/* Modal Footer */}
                    <div className="p-4 border-t border-slate-200 flex justify-end bg-slate-50 rounded-b-xl">
                      <button 
                        onClick={() => setShowHelpModal(false)} 
                        className="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors shadow-sm"
                      >
                        閉じる
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 生成画像プレビュー・保存用モーダル */}
              {showImageModal && generatedImage && (
                <div className="fixed inset-0 bg-slate-900 bg-opacity-80 flex items-center justify-center z-[60] p-4 animate-in fade-in">
                  <div className="bg-white rounded-xl shadow-2xl max-w-5xl w-full max-h-[95vh] flex flex-col overflow-hidden">
                    <div className="flex justify-between items-center p-4 border-b border-slate-200 bg-slate-50">
                      <div className="flex items-center text-blue-600">
                        <Camera className="w-6 h-6 mr-2" />
                        <h3 className="text-lg font-bold text-slate-800">生成された画像</h3>
                      </div>
                      <button onClick={() => setShowImageModal(false)} className="text-slate-500 hover:text-slate-700 p-1 rounded-md hover:bg-slate-200 transition-colors">
                        <X className="w-6 h-6" />
                      </button>
                    </div>
                    
                    <div className="p-4 overflow-auto flex-1 bg-slate-300 flex items-center justify-center relative custom-scrollbar shadow-inner">
                      <img 
                        src={generatedImage} 
                        alt="Generated Chart" 
                        className="max-w-full h-auto object-contain shadow-md bg-white" 
                      />
                    </div>
                    
                    <div className="p-4 border-t border-slate-200 bg-slate-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                      <div className="text-sm text-slate-600 bg-blue-50 p-3 rounded border border-blue-200 w-full sm:w-auto">
                        <p className="font-bold text-blue-800 mb-1">【保存方法】</p>
                        <p>自動でダウンロードされない場合やスマホの方は、<br className="hidden sm:block"/>上の画像を<strong className="text-blue-700">右クリック（スマホは長押し）</strong>して保存してください。</p>
                      </div>
                      <div className="flex space-x-3 w-full sm:w-auto">
                        <a 
                          href={generatedImage} 
                          download={downloadFilename}
                          className="flex-1 sm:flex-none px-6 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors shadow-sm flex items-center justify-center"
                        >
                          <Download className="w-5 h-5 mr-2" />
                          保存する
                        </a>
                        <button 
                          onClick={() => setShowImageModal(false)} 
                          className="px-6 py-3 bg-slate-200 text-slate-800 font-bold rounded-lg hover:bg-slate-300 transition-colors"
                        >
                          閉じる
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>

            {/* Footer */}
            <div className="max-w-7xl mx-auto mt-4 px-2 text-xs text-slate-500 text-right">
              * 調査日は一般社団法人日本みらい研がデータを整理した日であり、実際の各機関の調査日とは異なります。
            </div>

            <footer className="max-w-7xl mx-auto mt-8 text-center text-sm font-medium text-slate-500">
              企画・作成： 一般社団法人日本みらい研
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<AppWrapper />);
    };

    initApp().catch(console.error);
  </script>
</body>
</html>
