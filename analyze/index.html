<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Data Analyzer (22 Tools)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- SheetJS for Excel/CSV Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Plotly.js for Advanced Charting -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <!-- jStat for Statistical Tests -->
  <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    .animate-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Fragment } = React;

    // --- アイコンコンポーネント ---
    const SvgIcon = ({ d, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={props.className} {...props}>
        <path d={d} />
      </svg>
    );
    const UploadCloud = (p) => <SvgIcon d="M16 16l-4-4-4 4 M12 12v9 M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" {...p}/>;
    const FileSpreadsheet = (p) => <SvgIcon d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z M14 2v6h6 M8 13h2 M8 17h2 M14 13h2 M14 17h2" {...p}/>;
    const PlayIcon = (p) => <SvgIcon d="M5 3l14 9-14 9V3z" {...p}/>;
    const InfoIcon = (p) => <SvgIcon d="M12 12m-10 0a10 10 0 1 0 20 0 10 10 0 1 0-20 0 M12 16v-4 M12 8h.01" {...p}/>;
    const AlertCircle = (p) => <SvgIcon d="M12 12m-10 0a10 10 0 1 0 20 0 10 10 0 1 0-20 0 M12 8v4 M12 16h.01" {...p}/>;
    const RefreshCw = (p) => <SvgIcon d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5" {...p}/>;
    const ArrowLeft = (p) => <SvgIcon d="M19 12H5 M12 19l-7-7 7-7" {...p}/>;
    const ArrowUpDown = (p) => <SvgIcon d="M7 15l5 5 5-5 M7 9l5-5 5 5 M12 4v16" {...p}/>;

    // --- 分析設定とUIコントロールの定義 ---
    const ANALYSIS_TYPES = [
      // 基礎
      { id: 'summary', name: '1. 基本統計量 (表)', group: '基礎', desc: 'データ数、平均、標準偏差、最小、最大、中央値などを表形式で一覧表示します。', useCase: '選択した変数の全体的な規模感や分布の要約を数値で正確に確認したい場合。' },
      // 推移・傾向
      { id: 'timeseries', name: '2. 時系列推移 (折れ線グラフ)', group: '推移・傾向', desc: '時間の経過に伴う数値の変化を折れ線グラフで示します。', useCase: '売上などのトレンド（上昇・下降傾向）や季節性を確認したい場合。' },
      { id: 'bumpchart', name: '3. バンプチャート (順位推移)', group: '推移・傾向', desc: '数値そのものではなく、グループ間の「順位」の変動を折れ線で追います。', useCase: 'ランキングなど、時系列での順位の入れ替わりに焦点を当てて分析したい場合。' },
      // 比較
      { id: 'comparison', name: '4. カテゴリ別平均 (棒グラフ)', group: '比較', desc: 'カテゴリごとに数値の平均値を算出し、棒グラフで比較します。', useCase: 'グループ間の大小関係をシンプルに比較したい場合。' },
      { id: 'radar', name: '5. レーダーチャート (多変量比較)', group: '比較', desc: '複数の項目を放射状の軸にとり、多角形を作ります。', useCase: '対象の「総合的なバランス」や「強み・弱み」を複数の指標で同時に評価したい場合。' },
      // 分布
      { id: 'boxplot', name: '6. 分布・ばらつき (箱ひげ図)', group: '分布', desc: 'データのばらつきや外れ値を表現します。', useCase: 'グループごとの結果のブレ幅や、外れ値が存在するかどうかを確認したい場合。' },
      { id: 'histogram', name: '7. 全体分布 (ヒストグラム)', group: '分布', desc: 'データを一定の区間に区切り、各区間に含まれるデータの数を棒グラフで示します。', useCase: 'データの偏りや、どの数値帯（ボリュームゾーン）が最も多いのかを見たい場合。' },
      { id: 'violin', name: '8. バイオリンプロット (分布詳細)', group: '分布', desc: '箱ひげ図にデータの分布密度を組み合わせたグラフです。', useCase: 'データがどこに集中しているかという具体的な分布の形（山の数など）を比較する場合。' },
      { id: 'stripplot', name: '9. ストリッププロット (散布)', group: '分布', desc: '実際のデータ点を、グループごとに散らして配置します。', useCase: '実際の生データがどこに偏っているか、個々の点を確認したい場合。' },
      { id: 'ridgeline', name: '10. リッジラインプロット', group: '分布', desc: 'グループごとの分布を、山の稜線のように少しずつ重ねながら縦に並べます。', useCase: '多数のグループの分布を省スペースで比較したい場合。' },
      { id: 'contour', name: '11. 2D密度等高線', group: '分布', desc: 'データが密集している部分を等高線や色の濃淡で示します。', useCase: 'データ数が非常に多く、通常の散布図では点が重なりすぎて分布が分からない場合。' },
      // 関係性
      { id: 'correlation', name: '12. 変数間相関 (ヒートマップ)', group: '関係性', desc: '複数の数値データの間の連動性（相関）を色の濃淡で示します。', useCase: '複数項目間の連動性を一網打尽に探る場合。' },
      { id: 'scatter', name: '13. 散布図 (2変数比較)', group: '関係性', desc: '縦軸と横軸に異なる数値を設定し、データを点として打ち出します。', useCase: '2つの項目の間の相関（比例、反比例など）を直感的に捉えたい場合。' },
      { id: 'bubble', name: '14. バブルチャート (3変数比較)', group: '関係性', desc: '散布図に加え、点の大きさで3つ目の数値を表現します。', useCase: '縦横の位置関係に加え、「規模」などの3つ目の要素を同時に見せたい場合。' },
      { id: 'splom', name: '15. 散布図行列 (多変数)', group: '関係性', desc: '複数の数値変数の組み合わせすべてについて、散布図をマトリックス状に配置します。', useCase: '3つ以上の変数間の関係性の全体像を一度に見渡したい場合。' },
      { id: 'scatter3d', name: '16. 3D散布図', group: '関係性', desc: '3つの数値をX, Y, Z軸に割り当て、3次元空間にプロットします。', useCase: '立体的なクラスタや関係性を発見したい場合。' },
      // 構成比
      { id: 'stackedbar', name: '17. 積み上げ棒グラフ (構成比)', group: '構成比', desc: '複数の項目の数値を積み上げて1本の棒にします。', useCase: '全体量の比較と同時に、その内訳（構成比）の違いを確認したい場合。' },
      { id: 'pie', name: '18. 円グラフ (構成比)', group: '構成比', desc: '合計値や件数の割合を円グラフで表示します。', useCase: '全体における各カテゴリのシェアを直感的に示したい場合。' },
      { id: 'treemap', name: '19. ツリーマップ (階層構成比)', group: '構成比', desc: '値の大きさを面積で表現します。階層構造の表示も可能です。', useCase: '多数のカテゴリの内訳を直感的に見たい場合。' },
      // 高度な分析
      { id: 'parcoords', name: '20. 平行座標プロット (多次元)', group: '高度な分析', desc: '複数の縦軸を平行に並べ、データを折れ線で描画します。', useCase: '多数の変数を横断して多次元の特徴を見つける場合。' },
      { id: 'crosstab_heatmap', name: '21. クロス集計ヒートマップ', group: '高度な分析', desc: '2つのカテゴリを掛け合わせ、マスの色で数値を示します。', useCase: '「曜日×時間帯」のようなカテゴリの掛け合わせの傾向を俯瞰する場合。' },
      { id: 'stat_test', name: '22. 統計的検定 (分散分析)', group: '高度な分析', desc: '平均値の差が統計的に有意であるかを計算します。', useCase: '「グループ間の差は本当に意味があるのか、偶然なのか」を判定したい場合。' }
    ];

    const analyzeColumns = (data) => {
      if(!data || data.length === 0) return { numeric: [], categorical: [], date: [], all: [] };
      const keys = Object.keys(data[0]);
      const num = [], cat = [], dt = [];
      keys.forEach(k => {
        let numCount = 0, validCount = 0, dateCount = 0;
        for(let i = 0; i < Math.min(data.length, 50); i++) {
          const val = data[i][k];
          if(val !== undefined && val !== null && val !== '') {
            validCount++;
            if(typeof val === 'number' || !isNaN(Number(val))) numCount++;
            else if (typeof val === 'string' && val.length >= 6 && !isNaN(Date.parse(val))) dateCount++;
          }
        }
        if (validCount > 0) {
          if (numCount / validCount > 0.6) num.push(k);
          else if (dateCount / validCount > 0.6) dt.push(k);
          else cat.push(k);
        }
      });
      return { numeric: num, categorical: cat, date: dt, all: keys };
    };

    const AnalysisDescription = ({ typeId }) => {
      const info = ANALYSIS_TYPES.find(t => t.id === typeId);
      if (!info) return null;
      return (
        <div className="bg-blue-50/50 border border-blue-100 rounded-lg p-4 mb-5 shadow-sm animate-in fade-in">
          <h4 className="font-bold text-blue-800 flex items-center mb-2">
            <InfoIcon className="w-5 h-5 mr-1.5" />
            {info.name.split('. ')[1]}
          </h4>
          <p className="text-sm text-slate-700 mb-3 leading-relaxed">{info.desc}</p>
          <div className="text-sm text-slate-600 bg-white p-2.5 rounded-md border border-slate-200 leading-relaxed shadow-sm">
            <span className="font-bold text-emerald-600 mr-2">💡 活用例:</span>
            {info.useCase}
          </div>
        </div>
      );
    };

    const AnalysisWorkspace = ({ rawData, fileName, onReset }) => {
      const { data, cols } = useMemo(() => {
        const columns = analyzeColumns(rawData);
        const cleaned = rawData.map(row => {
          const newRow = { ...row };
          columns.numeric.forEach(c => {
            if(newRow[c] !== undefined && newRow[c] !== null && newRow[c] !== '') newRow[c] = Number(newRow[c]);
          });
          return newRow;
        });
        return { data: cleaned, cols: columns };
      }, [rawData]);

      const [analysisType, setAnalysisType] = useState('summary');
      const [xAxis, setXAxis] = useState('');
      const [yAxis, setYAxis] = useState('');
      const [yAxisChk, setYAxisChk] = useState([]);
      const [colorGroup, setColorGroup] = useState('なし');
      const [colorAxis, setColorAxis] = useState('なし');
      const [sizeAxis, setSizeAxis] = useState('');
      const [bins, setBins] = useState(20);
      const [resultTitle, setResultTitle] = useState('分析結果');
      const [summaryData, setSummaryData] = useState(null);
      const [statTestData, setStatTestData] = useState(null);
      const [noDataMsg, setNoDataMsg] = useState('');
      const chartRef = useRef(null);

      useEffect(() => {
        if (cols.all.length === 0) return;
        const n1 = cols.numeric[0] || '', n2 = cols.numeric[1] || n1, n3 = cols.numeric[2] || n2;
        const c1 = cols.categorical[0] || cols.date[0] || '', c2 = cols.categorical[1] || cols.date[0] || c1;
        const d1 = cols.date[0] || cols.categorical[0] || '';

        setXAxis(c1); setYAxis(n1); setYAxisChk(cols.numeric.slice(0, 3));
        setColorGroup('なし'); setColorAxis('なし'); setSizeAxis(n2);

        if (analysisType === 'timeseries') setXAxis(d1 || c1);
        else if (analysisType === 'bumpchart') { setXAxis(d1 || c1); setColorGroup(c1); setColorAxis(n1); }
        else if (analysisType === 'crosstab_heatmap') { setXAxis(c1); setColorGroup(c2); setColorAxis(n1); }
        else if (['histogram', 'scatter', 'bubble', 'contour'].includes(analysisType)) setXAxis(n1);
        else if (analysisType === 'scatter3d') { setXAxis(n1); setYAxis(n2); setSizeAxis(n3); }
      }, [analysisType, cols]);

      const executeAnalysis = () => {
        setNoDataMsg(''); setSummaryData(null); setStatTestData(null);
        if (chartRef.current && window.Plotly) window.Plotly.purge(chartRef.current);
        const sel = ANALYSIS_TYPES.find(t => t.id === analysisType);
        setResultTitle(sel ? sel.name.split('(')[0].trim() : '分析結果');
        try {
          switch (analysisType) {
            case 'summary': renderSummary(); break;
            case 'timeseries': renderTimeSeries(); break;
            case 'comparison': renderComparison(); break;
            case 'boxplot': renderBoxPlot(); break;
            case 'correlation': renderCorrelation(); break;
            case 'scatter': renderScatter(); break;
            case 'histogram': renderHistogram(); break;
            case 'stackedbar': renderStackedBar(); break;
            case 'pie': renderPie(); break;
            case 'radar': renderRadar(); break;
            case 'bubble': renderBubble(); break;
            case 'violin': renderViolin(); break;
            case 'parcoords': renderParcoords(); break;
            case 'crosstab_heatmap': renderCrosstabHeatmap(); break;
            case 'stripplot': renderStripPlot(); break;
            case 'ridgeline': renderRidgelinePlot(); break;
            case 'bumpchart': renderBumpChart(); break;
            case 'stat_test': renderStatTest(); break;
            case 'splom': renderSplom(); break;
            case 'scatter3d': renderScatter3D(); break;
            case 'treemap': renderTreemap(); break;
            case 'contour': renderContour(); break;
          }
        } catch (err) { setNoDataMsg(err.message); }
      };

      const renderSummary = () => {
        if (yAxisChk.length === 0) throw new Error('数値列を選択してください。');
        let res = [];
        yAxisChk.forEach(c => {
          let vals = data.map(d => d[c]).filter(v => v !== null && !isNaN(v)).sort((a,b)=>a-b);
          if (vals.length > 0) {
            let mean = vals.reduce((a,b)=>a+b,0)/vals.length;
            let sd = Math.sqrt(vals.reduce((a,b)=>a+Math.pow(b-mean,2),0)/vals.length);
            let median = vals.length%2!==0 ? vals[Math.floor(vals.length/2)] : (vals[vals.length/2-1]+vals[vals.length/2])/2;
            res.push({ col: c, count: vals.length, mean, sd, min: vals[0], median, max: vals[vals.length-1] });
          }
        });
        setSummaryData(res);
      };

      const renderTimeSeries = () => {
        if (!xAxis || yAxisChk.length===0) throw new Error('X軸とY軸の数値を選択してください。');
        let sorted = [...data].sort((a,b)=>a[xAxis]<b[xAxis]?-1:1);
        let traces = yAxisChk.map(c => ({ x: sorted.map(d=>d[xAxis]), y: sorted.map(d=>d[c]), type: 'scatter', mode: 'lines+markers', name: c }));
        window.Plotly.newPlot(chartRef.current, traces, { margin: {t:40, r:20, l:50, b:60} }, {responsive:true});
      };

      const renderComparison = () => {
        if (!xAxis || yAxisChk.length===0) throw new Error('X軸とY軸を選択してください。');
        let grp = {};
        data.forEach(r => {
          let c = r[xAxis] || '不明';
          if (!grp[c]) { grp[c] = { cnt: 0, sm: {} }; yAxisChk.forEach(y => grp[c].sm[y]=0); }
          let ok = false; yAxisChk.forEach(y => { if(r[y]!==null && !isNaN(r[y])){ grp[c].sm[y]+=r[y]; ok=true; } });
          if(ok) grp[c].cnt++;
        });
        let keys = Object.keys(grp).sort();
        let traces = yAxisChk.map(y => ({ x: keys, y: keys.map(k=>grp[k].cnt>0?grp[k].sm[y]/grp[k].cnt:0), type: 'bar', name: y }));
        window.Plotly.newPlot(chartRef.current, traces, { barmode: 'group', margin: {t:40, r:20, l:50, b:100} }, {responsive:true});
      };

      const renderBoxPlot = () => {
        if (!xAxis || !yAxis) throw new Error('X軸とY軸を選択してください。');
        let grp = {};
        data.forEach(r => { let c = r[xAxis] || '不明', v = r[yAxis]; if(v!==null && !isNaN(v)){ if(!grp[c])grp[c]=[]; grp[c].push(v); }});
        let traces = Object.keys(grp).sort().map(k => ({ y: grp[k], type: 'box', name: k }));
        window.Plotly.newPlot(chartRef.current, traces, { showlegend: false, margin: {t:40, r:20, l:50, b:100} }, {responsive:true});
      };

      const renderCorrelation = () => {
        if (yAxisChk.length < 2) throw new Error('2つ以上の数値列を選択してください。');
        const calcP = (x,y) => {
          let n=x.length, sx=0, sy=0, sxy=0, sx2=0, sy2=0;
          for(let i=0;i<n;i++){ sx+=x[i]; sy+=y[i]; sxy+=x[i]*y[i]; sx2+=x[i]*x[i]; sy2+=y[i]*y[i]; }
          let nm = n*sxy-sx*sy, dn = Math.sqrt((n*sx2-sx*sx)*(n*sy2-sy*sy));
          return dn===0?0:nm/dn;
        };
        let z = [];
        for(let i=0;i<yAxisChk.length;i++){
          let row=[];
          for(let j=0;j<yAxisChk.length;j++){
            if(i===j) row.push(1); else {
              let x=[], y=[]; data.forEach(d=>{ if(!isNaN(d[yAxisChk[i]]) && !isNaN(d[yAxisChk[j]])){ x.push(d[yAxisChk[i]]); y.push(d[yAxisChk[j]]); }});
              row.push(calcP(x,y));
            }
          }
          z.push(row);
        }
        window.Plotly.newPlot(chartRef.current, [{ z, x: yAxisChk, y: yAxisChk, type: 'heatmap', colorscale: 'RdBu', zmin: -1, zmax: 1 }], { margin: {t:40, r:20, l:120, b:100} }, {responsive:true});
      };

      const renderScatter = () => {
        if (!xAxis || !yAxis) throw new Error('X軸とY軸を選択してください。');
        let traces = [];
        if (colorGroup === 'なし') traces.push({ x: data.map(d=>d[xAxis]), y: data.map(d=>d[yAxis]), mode: 'markers', type: 'scatter' });
        else {
          let grp = {}; data.forEach(r=>{ let c=r[colorGroup]||'不明'; if(!grp[c])grp[c]={x:[],y:[]}; grp[c].x.push(r[xAxis]); grp[c].y.push(r[yAxis]); });
          Object.keys(grp).forEach(k=>traces.push({ x: grp[k].x, y: grp[k].y, mode: 'markers', type: 'scatter', name: k }));
        }
        window.Plotly.newPlot(chartRef.current, traces, { hovermode: 'closest', margin: {t:40, r:20, l:50, b:50} }, {responsive:true});
      };

      const renderHistogram = () => {
        let v = data.map(d=>d[xAxis]).filter(x=>!isNaN(x));
        window.Plotly.newPlot(chartRef.current, [{ x: v, type: 'histogram', nbinsx: bins }], { bargap: 0.05, margin: {t:40, r:20, l:50, b:50} }, {responsive:true});
      };

      const renderStackedBar = () => {
        if (!xAxis || yAxisChk.length===0) throw new Error('X軸と数値を選択してください。');
        let grp = {};
        data.forEach(r => {
          let c = r[xAxis] || '不明';
          if (!grp[c]) { grp[c] = { cnt: 0, sm: {} }; yAxisChk.forEach(y => grp[c].sm[y]=0); }
          yAxisChk.forEach(y => { if(!isNaN(r[y])) grp[c].sm[y]+=r[y]; });
          grp[c].cnt++;
        });
        let keys = Object.keys(grp).sort();
        let traces = yAxisChk.map(y => ({ x: keys, y: keys.map(k=>grp[k].cnt>0?grp[k].sm[y]/grp[k].cnt:0), type: 'bar', name: y }));
        window.Plotly.newPlot(chartRef.current, traces, { barmode: 'stack', margin: {t:40, r:20, l:50, b:100} }, {responsive:true});
      };

      const renderPie = () => {
        let cnt = {}; data.forEach(d=>{ if(d[xAxis]){ let k=String(d[xAxis]); cnt[k]=(cnt[k]||0)+1; }});
        window.Plotly.newPlot(chartRef.current, [{ values: Object.values(cnt), labels: Object.keys(cnt), type: 'pie', hole: 0.3 }], { margin: {t:40, r:20, l:20, b:40} }, {responsive:true});
      };

      const renderRadar = () => {
        if (!xAxis || yAxisChk.length===0) throw new Error('X軸と指標を選択してください。');
        let grp = {};
        data.forEach(r => {
          let c = r[xAxis] || '不明';
          if (!grp[c]) { grp[c] = { cnt: 0, sm: {} }; yAxisChk.forEach(y => grp[c].sm[y]=0); }
          yAxisChk.forEach(y => { if(!isNaN(r[y])) grp[c].sm[y]+=r[y]; });
          grp[c].cnt++;
        });
        let traces = Object.keys(grp).map(k => {
          let r = yAxisChk.map(y => grp[k].cnt>0?grp[k].sm[y]/grp[k].cnt:0);
          r.push(r[0]);
          return { type: 'scatterpolar', r, theta: [...yAxisChk, yAxisChk[0]], fill: 'toself', name: k };
        });
        window.Plotly.newPlot(chartRef.current, traces, { polar: { radialaxis: { visible: true } }, margin: {t:60, r:60, l:60, b:60} }, {responsive:true});
      };

      const renderBubble = () => {
        if (!xAxis || !yAxis || !sizeAxis) throw new Error('X軸, Y軸, サイズ列を選択してください。');
        let sMax = Math.max(...data.map(d=>d[sizeAxis]||0));
        let getS = (v) => v ? Math.max((v/sMax)*40, 5) : 5;
        let traces = [];
        if (colorGroup === 'なし') traces.push({ x: data.map(d=>d[xAxis]), y: data.map(d=>d[yAxis]), mode: 'markers', marker: { size: data.map(d=>getS(d[sizeAxis])) }, type: 'scatter' });
        else {
          let grp = {}; data.forEach(r=>{ let c=r[colorGroup]||'不明'; if(!grp[c])grp[c]={x:[],y:[],s:[]}; grp[c].x.push(r[xAxis]); grp[c].y.push(r[yAxis]); grp[c].s.push(getS(r[sizeAxis])); });
          Object.keys(grp).forEach(k=>traces.push({ x: grp[k].x, y: grp[k].y, marker: { size: grp[k].s }, mode: 'markers', type: 'scatter', name: k }));
        }
        window.Plotly.newPlot(chartRef.current, traces, { margin: {t:40, r:20, l:50, b:50} }, {responsive:true});
      };

      const renderViolin = () => {
        let grp = {}; data.forEach(r=>{ let c=r[xAxis]||'不明', v=r[yAxis]; if(!isNaN(v)){ if(!grp[c])grp[c]=[]; grp[c].push(v); }});
        let traces = Object.keys(grp).sort().map(k => ({ y: grp[k], type: 'violin', name: k, box: {visible:true}, meanline: {visible:true} }));
        window.Plotly.newPlot(chartRef.current, traces, { margin: {t:40, r:20, l:50, b:100} }, {responsive:true});
      };

      const renderParcoords = () => {
        if (yAxisChk.length < 2) throw new Error('2つ以上の数値を選択してください。');
        let dims = yAxisChk.map(c => ({ label: c, values: data.map(d=>d[c]||0) }));
        let trace = { type: 'parcoords', line: { color: data.map((_,i)=>i) }, dimensions: dims };
        window.Plotly.newPlot(chartRef.current, [trace], { margin: {t:60, r:40, l:60, b:40} }, {responsive:true});
      };

      const renderCrosstabHeatmap = () => {
        if (colorGroup === 'なし' || colorAxis === 'なし') throw new Error('軸と集計値を選択してください。');
        let xL = [...new Set(data.map(d=>d[xAxis]).filter(Boolean))].sort();
        let yL = [...new Set(data.map(d=>d[colorGroup]).filter(Boolean))].sort();
        let z = yL.map(y => xL.map(x => {
          let m = data.filter(d=>d[colorGroup]===y && d[xAxis]===x).map(d=>d[colorAxis]).filter(v=>!isNaN(v));
          return m.length>0?m.reduce((a,b)=>a+b,0)/m.length:null;
        }));
        window.Plotly.newPlot(chartRef.current, [{ z, x: xL, y: yL, type: 'heatmap', colorscale: 'Viridis' }], { margin: {t:40, r:20, l:100, b:80} }, {responsive:true});
      };

      const renderStripPlot = () => {
        let grp = {}; data.forEach(r=>{ let c=r[xAxis]||'不明', v=r[yAxis]; if(!isNaN(v)){ if(!grp[c])grp[c]=[]; grp[c].push(v); }});
        let traces = Object.keys(grp).sort().map(k => ({ y: grp[k], type: 'box', name: k, boxpoints: 'all', jitter: 0.5, fillcolor: 'rgba(0,0,0,0)', line: {color: 'rgba(0,0,0,0)'}, marker: {size: 6} }));
        window.Plotly.newPlot(chartRef.current, traces, { margin: {t:40, r:20, l:50, b:100} }, {responsive:true});
      };

      const renderRidgelinePlot = () => {
        let grp = {}; data.forEach(r=>{ let c=r[xAxis]||'不明', v=r[yAxis]; if(!isNaN(v)){ if(!grp[c])grp[c]=[]; grp[c].push(v); }});
        let traces = Object.keys(grp).sort().reverse().map(k => ({ type: 'violin', x: grp[k], name: k, side: 'positive', orientation: 'h', points: false }));
        window.Plotly.newPlot(chartRef.current, traces, { margin: {t:40, r:20, l:100, b:50} }, {responsive:true});
      };

      const renderBumpChart = () => {
        if (colorGroup === 'なし' || colorAxis === 'なし') throw new Error('グループと指標を選択してください。');
        let ts = [...new Set(data.map(d=>d[xAxis]).filter(Boolean))].sort();
        let gs = [...new Set(data.map(d=>d[colorGroup]).filter(Boolean))];
        let td = {}; ts.forEach(t => { td[t]={}; gs.forEach(g=>{ let m=data.filter(d=>d[xAxis]===t && d[colorGroup]===g).map(d=>d[colorAxis]).filter(v=>!isNaN(v)); if(m.length>0)td[t][g]=m.reduce((a,b)=>a+b,0)/m.length; })});
        let trD = {}; gs.forEach(g => trD[g]={x:[],y:[]});
        ts.forEach(t => { let itms=Object.keys(td[t]).map(g=>({g,v:td[t][g]})).sort((a,b)=>b.v-a.v); itms.forEach((itm,idx)=>{ trD[itm.g].x.push(t); trD[itm.g].y.push(idx+1); })});
        let traces = gs.filter(g=>trD[g].x.length>0).map(g=>({ x: trD[g].x, y: trD[g].y, mode:'lines+markers', name:g, line:{shape:'spline'} }));
        window.Plotly.newPlot(chartRef.current, traces, { yaxis: {autorange: 'reversed'}, margin: {t:40, r:20, l:50, b:60} }, {responsive:true});
      };

      const renderStatTest = () => {
        let grp = {}, all = [];
        data.forEach(r => { let c=r[xAxis], v=r[yAxis]; if(c && !isNaN(v)){ if(!grp[c])grp[c]=[]; grp[c].push(v); all.push(v); }});
        let ks = Object.keys(grp).filter(k=>grp[k].length>0); if(ks.length<2) throw new Error('2つ以上のグループが必要です。');
        const N = all.length, k = ks.length, avgA = all.reduce((a,b)=>a+b,0)/N;
        let ssb=0, ssw=0, stats = ks.map(key => {
          let vs = grp[key], n=vs.length, m=vs.reduce((a,b)=>a+b,0)/n;
          ssb += n*Math.pow(m-avgA,2); vs.forEach(v=>ssw+=Math.pow(v-m,2));
          return { key, n, mean:m, var: vs.reduce((a,b)=>a+Math.pow(b-m,2),0)/(n>1?n-1:1)};
        });
        const dfB = k-1, dfW = N-k, msb=ssb/dfB, msw=ssw/dfW, F=msb/msw;
        let p = window.jStat ? 1-window.jStat.centralF.cdf(F,dfB,dfW) : null;
        setStatTestData({ groupCol: xAxis, valCol: yAxis, groups: stats, anova: {F, pValue:p, dfB, dfW} });
        window.Plotly.newPlot(chartRef.current, ks.map(k=>({y:grp[k], type:'box', name:k})), {margin: {t:40, r:20, l:50, b:100}}, {responsive:true});
      };

      const renderSplom = () => {
        if (yAxisChk.length < 2) throw new Error('2つ以上の数値を選択してください。');
        let dims = yAxisChk.map(c => ({ label: c, values: data.map(d=>d[c]) }));
        let trace = { type: 'splom', dimensions: dims, marker: { size: 5, opacity: 0.7 } };
        if (colorAxis !== 'なし') trace.marker.color = data.map(d=>d[colorAxis]);
        window.Plotly.newPlot(chartRef.current, [trace], { margin: {t:50, b:50, l:50, r:50} }, {responsive:true});
      };

      const renderScatter3D = () => {
        if (!xAxis || !yAxis || !sizeAxis) throw new Error('X, Y, Z軸を選択してください。');
        let trace = { x: data.map(d=>d[xAxis]), y: data.map(d=>d[yAxis]), z: data.map(d=>d[sizeAxis]), mode: 'markers', type: 'scatter3d', marker: {size:4} };
        window.Plotly.newPlot(chartRef.current, [trace], { scene: {xaxis:{title:xAxis}, yaxis:{title:yAxis}, zaxis:{title:sizeAxis}}, margin: {t:0, b:0, l:0, r:0} }, {responsive:true});
      };

      const renderTreemap = () => {
        if (!xAxis || !yAxis) throw new Error('カテゴリと数値を選択してください。');
        let lbls=[], prnts=[], vls=[], g={};
        data.forEach(d => { let c=String(d[xAxis]), v=Number(d[yAxis])||0; if(v>0){ g[c]=(g[c]||0)+v; }});
        Object.keys(g).forEach(c=>{ lbls.push(c); prnts.push(''); vls.push(g[c]); });
        window.Plotly.newPlot(chartRef.current, [{ type: 'treemap', labels: lbls, parents: prnts, values: vls, root: { color: 'lightgrey' } }], { margin: {t:50, b:20, l:20, r:20} }, {responsive:true});
      };

      const renderContour = () => {
        if (!xAxis || !yAxis) throw new Error('X軸とY軸を選択してください。');
        let xv=[], yv=[]; data.forEach(d=>{ if(!isNaN(d[xAxis]) && !isNaN(d[yAxis])){ xv.push(d[xAxis]); yv.push(d[yAxis]); }});
        window.Plotly.newPlot(chartRef.current, [{ x: xv, y: yv, type: 'histogram2dcontour', colorscale: 'YlGnBu', reversescale: true }], { margin: {t:50, b:50, l:50, r:50} }, {responsive:true});
      };

      const toggleYAxisChk = (v) => setYAxisChk(prev => prev.includes(v) ? prev.filter(x=>x!==v) : [...prev, v]);

      const SelectField = ({ label, value, onChange, options, noMargin = false }) => (
        <div className={noMargin ? "" : "mb-4"}>
          <label className="block text-xs font-bold text-slate-600 mb-1.5">{label}</label>
          <select value={value} onChange={e => onChange(e.target.value)} className="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
            {options.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </div>
      );

      const MultiCheckboxes = ({ label, options, selected, onChange, onSelectAll, onClearAll }) => (
        <div className="mb-4">
          <div className="flex justify-between items-end mb-1.5">
            <label className="block text-xs font-bold text-slate-600">{label}</label>
            <div className="flex space-x-2">
              <button onClick={onSelectAll} className="text-[10px] text-blue-600 hover:underline bg-blue-50 px-1.5 py-0.5 rounded">すべて選択</button>
              <button onClick={onClearAll} className="text-[10px] text-slate-500 hover:underline bg-slate-100 px-1.5 py-0.5 rounded">クリア</button>
            </div>
          </div>
          <div className="max-h-40 overflow-y-auto border border-slate-200 rounded-lg p-2 bg-white shadow-inner custom-scrollbar">
            {options.map((opt) => (
              <label key={opt} className="flex items-center space-x-2 p-1.5 hover:bg-slate-50 rounded cursor-pointer transition-colors">
                <input type="checkbox" checked={selected.includes(opt)} onChange={() => onChange(opt)} className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" />
                <span className="text-sm font-medium text-slate-700 truncate">{opt}</span>
              </label>
            ))}
          </div>
        </div>
      );

      const renderControls = () => {
        const type = analysisType, ac = cols.all, nc = cols.numeric, cc = cols.categorical.concat(cols.date);
        if (nc.length === 0) return <p className="text-sm text-red-500 mt-4">数値データが見つかりません</p>;
        return (
          <div className="mt-2 space-y-2 animate-in fade-in">
            <AnalysisDescription typeId={type} />
            {type === 'summary' && <MultiCheckboxes label="対象の数値列" options={nc} selected={yAxisChk} onChange={toggleYAxisChk} onSelectAll={()=>setYAxisChk(nc)} onClearAll={()=>setYAxisChk([])} />}
            {type === 'timeseries' && <Fragment><SelectField label="時間軸" value={xAxis} onChange={setXAxis} options={cols.date.length>0?cols.date:cc} /><MultiCheckboxes label="数値" options={nc} selected={yAxisChk} onChange={toggleYAxisChk} onSelectAll={()=>setYAxisChk(nc)} onClearAll={()=>setYAxisChk([])} /></Fragment>}
            {(type === 'comparison' || type === 'stackedbar' || type === 'radar') && <Fragment><SelectField label="グループ化" value={xAxis} onChange={setXAxis} options={cc.length>0?cc:ac} /><MultiCheckboxes label="数値" options={nc} selected={yAxisChk} onChange={toggleYAxisChk} onSelectAll={()=>setYAxisChk(nc)} onClearAll={()=>setYAxisChk([])} /></Fragment>}
            {(type === 'boxplot' || type === 'violin' || type === 'stripplot' || type === 'ridgeline' || type === 'stat_test') && <Fragment><SelectField label="グループ化" value={xAxis} onChange={setXAxis} options={cc.length>0?cc:ac} /><SelectField label="数値" value={yAxis} onChange={setYAxis} options={nc} /></Fragment>}
            {(type === 'correlation' || type === 'parcoords' || type === 'splom') && <Fragment><MultiCheckboxes label="数値列" options={nc} selected={yAxisChk} onChange={toggleYAxisChk} onSelectAll={()=>setYAxisChk(nc)} onClearAll={()=>setYAxisChk([])} />{(type==='parcoords'||type==='splom')&&<SelectField label="色分け基準" value={colorAxis} onChange={setColorAxis} options={['なし',...nc,...cc]} />}</Fragment>}
            {(type === 'scatter' || type === 'bubble' || type === 'contour' || type === 'scatter3d') && (
              <Fragment>
                <div className="relative border border-slate-200 rounded-lg p-3 bg-slate-50/50 mb-4 flex flex-col space-y-3">
                  <SelectField label="X軸" value={xAxis} onChange={setXAxis} options={nc} noMargin />
                  <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10"><button onClick={()=>{const t=xAxis;setXAxis(yAxis);setYAxis(t);}} className="bg-white border border-slate-300 rounded-full p-1.5 shadow-md hover:text-blue-600"><ArrowUpDown className="w-4 h-4"/></button></div>
                  <SelectField label="Y軸" value={yAxis} onChange={setYAxis} options={nc} noMargin />
                </div>
                {(type==='bubble'||type==='scatter3d')&&<SelectField label={type==='scatter3d'?"Z軸":"サイズ"} value={sizeAxis} onChange={setSizeAxis} options={nc} />}
                <SelectField label="色分け基準" value={colorGroup} onChange={setColorGroup} options={['なし',...cc]} />
              </Fragment>
            )}
            {type === 'histogram' && <Fragment><SelectField label="対象" value={xAxis} onChange={setXAxis} options={nc} /><div className="mb-4"><label className="block text-xs font-bold text-slate-600 mb-1.5">ビン数</label><input type="number" value={bins} onChange={e=>setBins(e.target.value)} min="5" max="100" className="w-full text-sm border-slate-300 rounded-lg p-2.5 shadow-sm outline-none" /></div></Fragment>}
            {type === 'pie' && <SelectField label="カテゴリ" value={xAxis} onChange={setXAxis} options={cc.length>0?cc:ac} />}
            {type === 'crosstab_heatmap' && (
              <Fragment>
                <div className="relative border border-slate-200 rounded-lg p-3 bg-slate-50/50 mb-4 flex flex-col space-y-3">
                  <SelectField label="X軸 (列)" value={xAxis} onChange={setXAxis} options={cc} noMargin />
                  <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10"><button onClick={()=>{const t=xAxis;setXAxis(colorGroup);setColorGroup(t);}} className="bg-white border border-slate-300 rounded-full p-1.5 shadow-md hover:text-blue-600"><ArrowUpDown className="w-4 h-4"/></button></div>
                  <SelectField label="Y軸 (行)" value={colorGroup} onChange={setColorGroup} options={cc} noMargin />
                </div>
                <SelectField label="集計値" value={colorAxis} onChange={setColorAxis} options={nc} />
              </Fragment>
            )}
            {type === 'bumpchart' && <Fragment><SelectField label="時間軸" value={xAxis} onChange={setXAxis} options={cols.date.length>0?cols.date:cc} /><SelectField label="追跡グループ" value={colorGroup} onChange={setColorGroup} options={cc} /><SelectField label="指標" value={colorAxis} onChange={setColorAxis} options={nc} /></Fragment>}
            {type === 'treemap' && <Fragment><SelectField label="カテゴリ" value={xAxis} onChange={setXAxis} options={cc} /><SelectField label="サイズ" value={yAxis} onChange={setYAxis} options={nc} /></Fragment>}
          </div>
        );
      };

      return (
        <div className="flex flex-col md:flex-row h-screen bg-slate-50 overflow-hidden text-slate-800">
          <div className="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10 shrink-0 h-[45vh] md:h-full">
            <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
              <div><h1 className="font-black text-lg text-slate-800 tracking-tight leading-none">Analyzer</h1><p className="text-xs text-slate-500 mt-1 truncate max-w-[200px]">{fileName}</p></div>
              <button onClick={onReset} className="p-2 hover:bg-slate-100 rounded-md text-slate-400 hover:text-slate-600 transition-colors"><ArrowLeft className="w-5 h-5"/></button>
            </div>
            <div className="flex-1 overflow-y-auto p-5 custom-scrollbar">
              <label className="block text-sm font-bold text-slate-700 mb-2">分析手法の選択</label>
              <select value={analysisType} onChange={e => setAnalysisType(e.target.value)} className="w-full text-sm border-slate-300 rounded-lg p-2.5 font-medium bg-slate-50 shadow-sm focus:bg-white outline-none mb-2">
                {['基礎', '推移・傾向', '比較', '分布', '関係性', '構成比', '高度な分析'].map(g => (
                  <optgroup key={g} label={`--- ${g} ---`}>
                    {ANALYSIS_TYPES.filter(t => t.group === g).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                  </optgroup>
                ))}
              </select>
              <div className="mt-2">{renderControls()}</div>
            </div>
            <div className="p-4 bg-slate-50 border-t border-slate-200 shrink-0"><button onClick={executeAnalysis} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-md flex items-center justify-center"><PlayIcon className="w-5 h-5 mr-2" /> 分析を実行</button></div>
          </div>

          <div className="flex-1 p-4 md:p-8 overflow-y-auto custom-scrollbar flex flex-col h-[55vh] md:h-full bg-slate-100">
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col min-h-full overflow-hidden relative">
              <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-white shrink-0"><h2 className="text-xl font-bold text-slate-800">{resultTitle}</h2><div className="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full border border-blue-100">{data.length.toLocaleString()} 行</div></div>
              <div className="flex-1 p-4 md:p-6 relative bg-white">
                {noDataMsg && <div className="bg-red-50 text-red-600 p-4 rounded-lg border border-red-100 flex items-center mb-4 font-bold text-sm"><AlertCircle className="w-5 h-5 mr-2" />{noDataMsg}</div>}
                <div ref={chartRef} className={`w-full h-full min-h-[400px] ${summaryData ? 'hidden' : ''}`}></div>
                {summaryData && (
                  <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm animate-in fade-in">
                    <table className="min-w-full text-sm text-right whitespace-nowrap"><thead className="bg-slate-50 text-slate-600 font-bold border-b"><tr><th className="px-4 py-3 text-left">変数名</th><th>データ数</th><th>平均</th><th>標準偏差</th><th>最小値</th><th>中央値</th><th>最大値</th></tr></thead>
                    <tbody className="bg-white divide-y">{summaryData.map(r => (<tr key={r.col} className="hover:bg-slate-50"><td className="px-4 py-3 font-bold text-slate-800 text-left">{r.col}</td><td>{r.count}</td><td className="font-bold text-blue-600">{r.mean.toFixed(2)}</td><td>{r.sd.toFixed(2)}</td><td>{r.min}</td><td>{r.median.toFixed(2)}</td><td>{r.max}</td></tr>))}</tbody></table>
                  </div>
                )}
                {statTestData && (
                  <div className="mt-6 p-5 border border-indigo-100 bg-indigo-50 rounded-xl shadow-sm text-sm text-slate-800 animate-in fade-in">
                    <h3 className="font-bold text-lg mb-3 flex items-center text-indigo-900"><InfoIcon className="w-5 h-5 mr-2 text-indigo-600" /> ANOVA 結果</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4"><div className="bg-white p-4 rounded-lg">F値: <span className="text-xl font-black">{statTestData.anova.F.toFixed(3)}</span></div><div className="bg-white p-4 rounded-lg">p値: <span className="text-xl font-black text-indigo-600">{statTestData.anova.pValue !== null ? (statTestData.anova.pValue < 0.001 ? '< 0.001' : statTestData.anova.pValue.toFixed(4)) : '計算不可'}</span></div></div>
                    <div className={`p-4 rounded-lg font-bold border ${statTestData.anova.pValue < 0.05 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200'}`}>判定: {statTestData.anova.pValue < 0.05 ? '統計的に有意な差があります。' : '有意な差はありません。'}</div>
                  </div>
                )}
                {!summaryData && !statTestData && !chartRef.current?.children.length && !noDataMsg && <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400"><PlayIcon className="w-16 h-16 text-slate-200 mb-4" /><p className="text-lg font-bold text-slate-400">条件を設定し、「分析を実行」を押してください</p></div>}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [data, setData] = useState([]);
      const [fileName, setFileName] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const handleFileUpload = (e) => {
        const file = e.target.files[0]; if (!file) return;
        setErrorMsg(''); setFileName(file.name);
        const reader = new FileReader(); reader.onload = (evt) => {
          try { const wb = window.XLSX.read(evt.target.result, {type:'binary'}); setData(window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]])); }
          catch(err) { setErrorMsg('ファイルの読み込みに失敗しました。'); }
        }; reader.readAsBinaryString(file);
      };
      const loadDemoData = () => {
        const demo = [], regions = ['東京', '大阪', '愛知'], products = ['A', 'B', 'C'];
        let date = new Date('2024-01-01');
        for (let i = 0; i < 100; i++) {
          demo.push({ "日付": date.toISOString().split('T')[0], "地域": regions[Math.floor(Math.random()*3)], "商品": products[Math.floor(Math.random()*3)], "売上": Math.floor(Math.random()*50000)+10000, "満足度": Number((Math.random()*2+3).toFixed(1)) });
          if(i%2===0) date.setDate(date.getDate()+1);
        }
        setFileName('デモデータ.csv'); setData(demo);
      };
      if (data.length > 0) return <AnalysisWorkspace rawData={data} fileName={fileName} onReset={() => setData([])} />;
      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-50 text-slate-800">
          <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100 text-center animate-in fade-in">
            <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner"><UploadCloud className="w-10 h-10" /></div>
            <h1 className="text-2xl font-black text-slate-800 mb-2">Data Analyzer</h1>
            <p className="text-slate-500 text-sm mb-8">CSV または Excel ファイルをインポートして<br/>22種類の高度なデータ分析を始めましょう。</p>
            {errorMsg && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold mb-6">{errorMsg}</div>}
            <div className="relative"><input type="file" accept=".csv,.xlsx,.xls" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"/><div className="bg-blue-600 text-white font-bold py-4 rounded-xl shadow-md flex items-center justify-center"><FileSpreadsheet className="w-5 h-5 mr-2" />ファイルを選択する</div></div>
            <div className="mt-8 pt-6 border-t border-slate-100"><button onClick={loadDemoData} className="text-sm font-bold text-blue-600 hover:underline">デモデータを使って試す</button></div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
