<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Data Analyzer (22 Tools)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- SheetJS for Excel/CSV Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Plotly.js for Advanced Charting (Unifying all charts to Plotly) -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <!-- jStat for Statistical Tests -->
  <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    .animate-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Fragment } = React;

    // --- アイコンコンポーネント ---
    const SvgIcon = ({ d, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={props.className} {...props}>
        <path d={d} />
      </svg>
    );
    const UploadCloud = (p) => <SvgIcon d="M16 16l-4-4-4 4 M12 12v9 M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3" {...p}/>;
    const FileSpreadsheet = (p) => <SvgIcon d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z M14 2v6h6 M8 13h2 M8 17h2 M14 13h2 M14 17h2" {...p}/>;
    const PlayIcon = (p) => <SvgIcon d="M5 3l14 9-14 9V3z" {...p}/>;
    const InfoIcon = (p) => <SvgIcon d="M12 12m-10 0a10 10 0 1 0 20 0 10 10 0 1 0-20 0 M12 16v-4 M12 8h.01" {...p}/>;
    const AlertCircle = (p) => <SvgIcon d="M12 12m-10 0a10 10 0 1 0 20 0 10 10 0 1 0-20 0 M12 8v4 M12 16h.01" {...p}/>;
    const Settings = (p) => <SvgIcon d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" {...p}/>;
    const RefreshCw = (p) => <SvgIcon d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5" {...p}/>;
    const ArrowLeft = (p) => <SvgIcon d="M19 12H5 M12 19l-7-7 7-7" {...p}/>;
    const ArrowUpDown = (p) => <SvgIcon d="M7 15l5 5 5-5 M7 9l5-5 5 5 M12 4v16" {...p}/>;

    // --- 分析設定とUIコントロールの定義 ---
    const ANALYSIS_TYPES = [
      // 基礎
      { id: 'summary', name: '1. 基本統計量 (表)', group: '基礎', desc: 'データ数、平均、標準偏差、最小、最大、中央値などを表形式で一覧表示します。', useCase: '選択した変数の全体的な規模感や分布の要約を数値で正確に確認したい場合。' },
      // 推移・傾向
      { id: 'timeseries', name: '2. 時系列推移 (折れ線グラフ)', group: '推移・傾向', desc: '時間の経過に伴う数値の変化を折れ線グラフで示します。', useCase: '売上などのトレンド（上昇・下降傾向）や季節性を確認したい場合。' },
      { id: 'bumpchart', name: '3. バンプチャート (順位推移)', group: '推移・傾向', desc: '数値そのものではなく、グループ間の「順位」の変動を折れ線で追います。', useCase: '売上ランキングなど、時系列での「順位の入れ替わり」に焦点を当てて分析したい場合。' },
      // 比較
      { id: 'comparison', name: '4. カテゴリ別平均 (棒グラフ)', group: '比較', desc: 'カテゴリ（グループ）ごとに数値の平均値を算出し、棒グラフで比較します。', useCase: '店舗別、地域別、商品別など、グループ間の大小関係をシンプルに比較したい場合。' },
      { id: 'radar', name: '5. レーダーチャート (多変量比較)', group: '比較', desc: '複数の項目を放射状の軸にとり、それぞれの値を線で結んで多角形を作ります。', useCase: '対象の「総合的なバランス」や「強み・弱み」を複数の指標で同時に評価したい場合。' },
      // 分布
      { id: 'boxplot', name: '6. 分布・ばらつき (箱ひげ図)', group: '分布', desc: 'データのばらつき（四分位範囲や中央値）や外れ値を「箱」と「ひげ」で表現します。', useCase: 'グループごとの結果のブレ幅や、極端な異常値（外れ値）が存在するかどうかを確認したい場合。' },
      { id: 'histogram', name: '7. 全体分布 (ヒストグラム)', group: '分布', desc: 'データを一定の区間に区切り、各区間に含まれるデータの数を棒グラフで示します。', useCase: '全体の中でどの数値帯（ボリュームゾーン）が最も多いのか、データの偏りを見たい場合。' },
      { id: 'violin', name: '8. バイオリンプロット (分布詳細)', group: '分布', desc: '箱ひげ図にデータの分布密度（ヒストグラムを滑らかにしたもの）を組み合わせたグラフです。', useCase: '箱ひげ図ではわからない、データがどこに集中しているかという具体的な分布の形（山の数など）を比較する場合。' },
      { id: 'stripplot', name: '9. ストリッププロット (散布)', group: '分布', desc: '実際のデータ点を、グループごとに重ならないように散らして配置します。', useCase: '箱ひげ図のように統計値にまとめず、実際の生データがどこに偏っているか、個々の点を確認したい場合。' },
      { id: 'ridgeline', name: '10. リッジラインプロット', group: '分布', desc: 'グループごとの分布（山の形）を、山の稜線のように少しずつ重ねながら縦に並べます。', useCase: '多数のグループの分布を省スペースで比較し、全体のトレンドの変化を美しく見せたい場合。' },
      { id: 'contour', name: '11. 2D密度等高線', group: '分布', desc: '2変数の散布図において、データが密集している部分を等高線や色の濃淡（ヒートマップ状）で示します。', useCase: 'データ数が非常に多く、通常の散布図では点が重なりすぎて分布の濃淡（どこが一番多いか）が分からない場合。' },
      // 関係性
      { id: 'correlation', name: '12. 変数間相関 (ヒートマップ)', group: '関係性', desc: '複数の数値データの間にどの程度の関係性（相関）があるかを色の濃淡で示します。', useCase: '「気温が上がるとアイスが売れるか」のような、複数項目間の連動性を一網打尽に探る場合。' },
      { id: 'scatter', name: '13. 散布図 (2変数比較)', group: '関係性', desc: '縦軸と横軸に異なる数値を設定し、データを点として打ち出します。', useCase: '2つの項目の間にどのような関係（比例、反比例など）があるか、直感的に傾向を捉えたい場合。' },
      { id: 'bubble', name: '14. バブルチャート (3変数比較)', group: '関係性', desc: '散布図の機能に加え、点の大きさ（バブル）で3つ目の数値を表現します。', useCase: '縦横の位置関係に加え、「規模」や「売上」などの3つ目の要素を同時に見せたい場合。' },
      { id: 'splom', name: '15. 散布図行列 (多変数)', group: '関係性', desc: '選択した複数の数値変数の組み合わせすべてについて、散布図をマトリックス（行列）状に配置します。', useCase: '3つ以上の変数間の相関やパターンの全体像を一度に見渡したい場合に強力です。' },
      { id: 'scatter3d', name: '16. 3D散布図', group: '関係性', desc: '3つの数値変数をX, Y, Z軸に割り当て、3次元空間にデータをプロットします。マウスで回転させることができます。', useCase: '2次元の散布図では見えなかった、3変数間の立体的なクラスタ（まとまり）や関係性を発見したい場合。' },
      // 構成比
      { id: 'stackedbar', name: '17. 積み上げ棒グラフ (構成比)', group: '構成比', desc: '複数の項目の数値を積み上げて1本の棒にし、グループごとの内訳を表示します。', useCase: '全体量（合計）の比較と同時に、その内訳（構成比）の違いを確認したい場合。' },
      { id: 'pie', name: '18. 円グラフ (構成比)', group: '構成比', desc: '選択したカテゴリごとの合計値（または件数）の割合を円グラフで表示します。', useCase: '全体における各カテゴリのシェアや割合を直感的に示したい場合。' },
      { id: 'treemap', name: '19. ツリーマップ (階層構成比)', group: '構成比', desc: 'カテゴリごとの値の大きさを「四角形の面積」で表現します。親カテゴリを設定すると階層構造になります。', useCase: '円グラフでは見づらい多数のカテゴリの構成比や、「地域＞店舗」のような階層ごとの内訳を直感的に見たい場合。' },
      // 高度な分析
      { id: 'parcoords', name: '20. 平行座標プロット (多次元)', group: '高度な分析', desc: '複数の縦軸を平行に並べ、1件のデータを1本の折れ線としてすべての軸をまたいで描画します。', useCase: '多数の変数を横断して、「このパターンを持つデータは、別の指標でも高い」といった多次元の特徴を見つける場合。' },
      { id: 'crosstab_heatmap', name: '21. クロス集計ヒートマップ', group: '高度な分析', desc: '縦軸と横軸にカテゴリを取り、交差するマスの色で数値の大小を表現します。', useCase: '「どの曜日の、どの時間帯が一番売れるか」など、2つのカテゴリの掛け合わせの傾向を俯瞰する場合。' },
      { id: 'stat_test', name: '22. 統計的検定 (分散分析)', group: '高度な分析', desc: 'グループ間の平均値の差が、統計的に意味のある（有意な）差であるかを計算します。', useCase: '「AとBの差は本当に意味があるのか、それとも偶然（誤差）なのか」を客観的に判定したい場合。' }
    ];

    // --- データ列の型判定ロジック ---
    const analyzeColumns = (data) => {
      if(!data || data.length === 0) return { numeric: [], categorical: [], date: [], all: [] };
      const keys = Object.keys(data[0]);
      const num = [], cat = [], dt = [];
      
      keys.forEach(k => {
        let numCount = 0;
        let validCount = 0;
        let dateCount = 0;
        
        for(let i = 0; i < Math.min(data.length, 50); i++) {
          const val = data[i][k];
          if(val !== undefined && val !== null && val !== '') {
            validCount++;
            if(typeof val === 'number' || !isNaN(Number(val))) {
              numCount++;
            } else if (typeof val === 'string' && val.length >= 6 && !isNaN(Date.parse(val))) {
              dateCount++;
            }
          }
        }
        
        if (validCount > 0) {
          if (numCount / validCount > 0.6) num.push(k);
          else if (dateCount / validCount > 0.6) dt.push(k);
          else cat.push(k);
        }
      });
      return { numeric: num, categorical: cat, date: dt, all: keys };
    };

    // 分析の注釈(説明)コンポーネント
    const AnalysisDescription = ({ typeId }) => {
      const typeInfo = ANALYSIS_TYPES.find(t => t.id === typeId);
      if (!typeInfo) return null;
      return (
        <div className="bg-blue-50/50 border border-blue-100 rounded-lg p-4 mb-5 shadow-sm animate-in fade-in">
          <h4 className="font-bold text-blue-800 flex items-center mb-2">
            <InfoIcon className="w-5 h-5 mr-1.5" />
            {typeInfo.name.split('. ')[1]}
          </h4>
          <p className="text-sm text-slate-700 mb-3 leading-relaxed">{typeInfo.desc}</p>
          <div className="text-sm text-slate-600 bg-white p-2.5 rounded-md border border-slate-200 leading-relaxed shadow-sm">
            <span className="font-bold text-emerald-600 mr-2">💡 活用例:</span>
            {typeInfo.useCase}
          </div>
        </div>
      );
    };

    // -------------------------------------------------------------
    // メインの分析ワークスペースコンポーネント
    // -------------------------------------------------------------
    const AnalysisWorkspace = ({ rawData, fileName, onReset }) => {
      // データのクレンジング (数値と判定された列は Number にキャスト)
      const { data, cols } = useMemo(() => {
        const columns = analyzeColumns(rawData);
        const cleaned = rawData.map(row => {
          const newRow = { ...row };
          columns.numeric.forEach(c => {
            if(newRow[c] !== undefined && newRow[c] !== null && newRow[c] !== '') {
              newRow[c] = Number(newRow[c]);
            }
          });
          return newRow;
        });
        return { data: cleaned, cols: columns };
      }, [rawData]);

      // 分析コントロール用のステート
      const [analysisType, setAnalysisType] = useState('summary');
      const [xAxis, setXAxis] = useState('');
      const [yAxis, setYAxis] = useState('');
      const [yAxisChk, setYAxisChk] = useState([]);
      const [colorGroup, setColorGroup] = useState('なし');
      const [colorAxis, setColorAxis] = useState('なし');
      const [sizeAxis, setSizeAxis] = useState('');
      const [bins, setBins] = useState(20);
      
      const [resultTitle, setResultTitle] = useState('分析結果');
      const [summaryData, setSummaryData] = useState(null);
      const [statTestData, setStatTestData] = useState(null);
      const [noDataMsg, setNoDataMsg] = useState('');
      const chartRef = useRef(null);

      // 分析タイプの変更時にデフォルト値を設定する
      useEffect(() => {
        if (cols.all.length === 0) return;
        const num1 = cols.numeric[0] || '';
        const num2 = cols.numeric[1] || num1;
        const num3 = cols.numeric[2] || num2;
        const cat1 = cols.categorical[0] || cols.date[0] || '';
        const cat2 = cols.categorical[1] || cols.date[0] || cat1;
        const dt1 = cols.date[0] || cols.categorical[0] || '';

        setXAxis(cat1);
        setYAxis(num1);
        setYAxisChk(cols.numeric.slice(0, 3));
        setColorGroup('なし');
        setColorAxis('なし');
        setSizeAxis(num2);

        if (analysisType === 'timeseries') {
          setXAxis(dt1 || cat1);
        } else if (analysisType === 'bumpchart') {
          setXAxis(dt1 || cat1);
          setColorGroup(cat1); // デフォルト値を空にしない
          setColorAxis(num1);  // デフォルト値を空にしない
        } else if (analysisType === 'crosstab_heatmap') {
          setXAxis(cat1);
          setColorGroup(cat2); // デフォルト値を空にしない
          setColorAxis(num1);  // デフォルト値を空にしない
        } else if (['histogram', 'scatter', 'bubble', 'contour'].includes(analysisType)) {
          setXAxis(num1);
        } else if (analysisType === 'scatter3d') { 
          setXAxis(num1); setYAxis(num2); setSizeAxis(num3); 
        }
      }, [analysisType, cols]);

      // 分析の実行
      const executeAnalysis = () => {
        setNoDataMsg('');
        setSummaryData(null);
        setStatTestData(null);
        if (chartRef.current && window.Plotly) window.Plotly.purge(chartRef.current);

        if (data.length === 0) {
          setNoDataMsg('データがありません。');
          return;
        }

        const selectedTypeObj = ANALYSIS_TYPES.find(t => t.id === analysisType);
        setResultTitle(selectedTypeObj ? selectedTypeObj.name.split('(')[0].trim() : '分析結果');

        try {
          switch (analysisType) {
            case 'summary': renderSummary(); break;
            case 'timeseries': renderTimeSeries(); break;
            case 'comparison': renderComparison(); break;
            case 'boxplot': renderBoxPlot(); break;
            case 'correlation': renderCorrelation(); break;
            case 'scatter': renderScatter(); break;
            case 'histogram': renderHistogram(); break;
            case 'stackedbar': renderStackedBar(); break;
            case 'pie': renderPie(); break;
            case 'radar': renderRadar(); break;
            case 'bubble': renderBubble(); break;
            case 'violin': renderViolin(); break;
            case 'parcoords': renderParcoords(); break;
            case 'crosstab_heatmap': renderCrosstabHeatmap(); break;
            case 'stripplot': renderStripPlot(); break;
            case 'ridgeline': renderRidgelinePlot(); break;
            case 'bumpchart': renderBumpChart(); break;
            case 'stat_test': renderStatTest(); break;
            case 'splom': renderSplom(); break;
            case 'scatter3d': renderScatter3D(); break;
            case 'treemap': renderTreemap(); break;
            case 'contour': renderContour(); break;
          }
        } catch (err) {
          // 意図的なバリデーションエラーはコンソールに出力せずUIで通知
          setNoDataMsg(err.message);
        }
      };

      // -------------------------------------------------------------
      // 各分析の描画ロジック (Plotly.js)
      // -------------------------------------------------------------
      const renderSummary = () => {
        if (yAxisChk.length === 0) throw new Error('対象の数値列を選択してください。');
        let summary = [];
        yAxisChk.forEach(col => {
          let values = data.map(d => d[col]).filter(v => v !== null && v !== undefined && !isNaN(v));
          if (values.length > 0) {
            values.sort((a, b) => a - b);
            let sum = values.reduce((a, b) => a + b, 0);
            let mean = sum / values.length;
            let min = values[0];
            let max = values[values.length - 1];
            let mid = Math.floor(values.length / 2);
            let median = values.length % 2 !== 0 ? values[mid] : (values[mid - 1] + values[mid]) / 2;
            let sqSum = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0);
            let sd = Math.sqrt(sqSum / values.length);
            summary.push({ col, count: values.length, mean, sd, min, median, max });
          }
        });
        setSummaryData(summary);
      };

      const renderTimeSeries = () => {
        if (!xAxis) throw new Error('X軸(時間軸)を選択してください。');
        if (yAxisChk.length === 0) throw new Error('Y軸の数値を選択してください。');
        
        let sorted = [...data].sort((a, b) => {
          const vA = a[xAxis], vB = b[xAxis];
          if (vA < vB) return -1; if (vA > vB) return 1; return 0;
        });
        let xData = sorted.map(d => d[xAxis]);

        let traces = yAxisChk.map(col => ({
          x: xData, y: sorted.map(d => d[col]),
          type: 'scatter', mode: 'lines+markers', name: col,
          line: { shape: 'spline', width: 2 }, marker: { size: 5 }
        }));
        let layout = { title: `${xAxis}に沿った推移`, xaxis: { title: xAxis }, hovermode: 'closest', margin: { t: 40, r: 20, l: 50, b: 60 } };
        window.Plotly.newPlot(chartRef.current, traces, layout, {responsive: true});
      };

      const renderComparison = () => {
        if (!xAxis) throw new Error('グループ化(X軸)を選択してください。');
        if (yAxisChk.length === 0) throw new Error('比較する数値(Y軸)を選択してください。');

        let grouped = {};
        data.forEach(row => {
          let cat = row[xAxis] || '不明';
          if (!grouped[cat]) { grouped[cat] = { count: 0, sums: {} }; yAxisChk.forEach(yc => grouped[cat].sums[yc] = 0); }
          let validCount = 0;
          yAxisChk.forEach(yc => {
            let val = row[yc];
            if (val !== null && val !== undefined && !isNaN(val)) { grouped[cat].sums[yc] += val; validCount++; }
          });
          if(validCount > 0) grouped[cat].count++;
        });

        let categories = Object.keys(grouped).sort();
        let traces = yAxisChk.map(yc => ({
          x: categories,
          y: categories.map(cat => grouped[cat].count > 0 ? grouped[cat].sums[yc] / grouped[cat].count : 0),

        let grouped = {}, allVals = [];
        data.forEach(row => {

        let SSB = 0, SSW = 0;

        }

        let trace = { type: 'treemap', labels, parents, values, textinfo: 'label+value+percent parent', root: { color: 'lightgrey' } };
        let layout = { title: `ツリーマップ: ${yAxis}の構成比`, margin: { t: 50, b: 20, l: 20, r: 20 } };
        window.Plotly.newPlot(chartRef.current, [trace], layout, {responsive: true});
      };

      const renderContour = () => {
        if (!xAxis || !yAxis) throw new Error('X軸とY軸を選択してください。');
        let xVals = [], yVals = [];
        data.forEach(d => {
          let vx = d[xAxis], vy = d[yAxis];
          if (vx !== null && !isNaN(vx) && vy !== null && !isNaN(vy)) {
            xVals.push(vx); yVals.push(vy);
          }
        });

        let trace = {
          x: xVals, y: yVals,
          type: 'histogram2dcontour',
          colorscale: 'YlGnBu',
          reversescale: true
        };
        let traceScatter = {
          x: xVals, y: yVals,
          mode: 'markers', type: 'scatter', marker: { size: 3, color: 'rgba(0,0,0,0.3)' }
        };
        
        let layout = { title: `2D密度等高線: ${xAxis} vs ${yAxis}`, xaxis: { title: xAxis }, yaxis: { title: yAxis }, margin: { t: 50, b: 50, l: 50, r: 50 }, hovermode: 'closest' };
        window.Plotly.newPlot(chartRef.current, [trace, traceScatter], layout, {responsive: true});
      };

      // --- UI Control Helpers ---
      const toggleYAxisChk = (val) => {
        setYAxisChk(prev => prev.includes(val) ? prev.filter(v => v !== val) : [...prev, val]);
      };

      const SelectField = ({ label, value, onChange, options, noMargin = false }) => (
        <div className={noMargin ? "" : "mb-4"}>
          <label className="block text-xs font-bold text-slate-600 mb-1.5">{label}</label>
          <select value={value} onChange={e => onChange(e.target.value)} className="w-full text-sm border-slate-300 rounded-lg p-2.5 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
            {options.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </div>
      );

      const MultiCheckboxes = ({ label, options, selected, onChange, onSelectAll, onClearAll }) => (
        <div className="mb-4">
          <div className="flex justify-between items-end mb-1.5">
            <label className="block text-xs font-bold text-slate-600">{label}</label>
            <div className="flex space-x-2">
              <button onClick={onSelectAll} className="text-[10px] text-blue-600 hover:underline bg-blue-50 px-1.5 py-0.5 rounded transition-colors">すべて選択</button>
              <button onClick={onClearAll} className="text-[10px] text-slate-500 hover:underline bg-slate-100 px-1.5 py-0.5 rounded transition-colors">クリア</button>
            </div>
          </div>
          <div className="max-h-40 overflow-y-auto border border-slate-200 rounded-lg p-2 bg-white shadow-inner custom-scrollbar">
            {options.map((opt) => (
              <label key={opt} className="flex items-center space-x-2 p-1.5 hover:bg-slate-50 rounded cursor-pointer transition-colors">
                <input type="checkbox" value={opt} checked={selected.includes(opt)} onChange={() => onChange(opt)} className="rounded text-blue-600 focus:ring-blue-500 w-4 h-4" />
                <span className="text-sm font-medium text-slate-700 truncate">{opt}</span>
              </label>
            ))}
          </div>
        </div>
      );

      // 動的コントロール描画
      const renderDynamicControls = () => {
        const type = analysisType;
        const allCols = cols.all;
        const numCols = cols.numeric;
        const catCols = cols.categorical.concat(cols.date); // 簡易的に日付もカテゴリ扱い

        if (numCols.length === 0) return <p className="text-sm text-red-500 mt-4">数値データが見つかりません</p>;

        return (
          <div className="mt-2 space-y-2 animate-in fade-in">
            {/* 各分析手法の注釈表示 */}
            <AnalysisDescription typeId={type} />

            {/* 基本統計量 */}
            {type === 'summary' && <MultiCheckboxes label="対象の数値列" options={numCols} selected={yAxisChk} onChange={toggleYAxisChk} onSelectAll={() => setYAxisChk(numCols)} onClearAll={() => setYAxisChk([])} />}
            
            {/* 時系列 */}
            {type === 'timeseries' && (
              <Fragment>
                <SelectField label="時間軸 (X軸)" value={xAxis} onChange={setXAxis} options={cols.date.length > 0 ? cols.date : catCols} />
                <MultiCheckboxes label="表示する数値 (Y軸)" options={numCols} selected={yAxisChk} onChange={toggleYAxisChk} onSelectAll={() => setYAxisChk(numCols)} onClearAll={() => setYAxisChk([])} />
              </Fragment>
            )}

            {/* Xカテゴリ, Y複数数値 */}
            {(type === 'comparison' || type === 'stackedbar' || type === 'radar') && (
              <Fragment>
                <SelectField label="グループ化 (X軸)" value={xAxis} onChange={setXAxis} options={catCols.length > 0 ? catCols : allCols} />
                <MultiCheckboxes label="比較する数値 (複数可)" options={numCols} selected={yAxisChk} onChange={toggleYAxisChk} onSelectAll={() => setYAxisChk(numCols)} onClearAll={() => setYAxisChk([])} />
              </Fragment>
            )}

            {/* Xカテゴリ, Y単一数値 */}
            {(type === 'boxplot' || type === 'violin' || type === 'stripplot' || type === 'ridgeline' || type === 'stat_test') && (
              <Fragment>
                <SelectField label="グループ化 (X軸)" value={xAxis} onChange={setXAxis} options={catCols.length > 0 ? catCols : allCols} />
                <SelectField label="分布を見る数値 (Y軸)" value={yAxis} onChange={setYAxis} options={numCols} />
              </Fragment>
            )}

            {/* 相関・平行座標・散布図行列 */}
            {(type === 'correlation' || type === 'parcoords' || type === 'splom') && (
              <Fragment>
                <MultiCheckboxes label="分析する数値列 (2つ以上)" options={numCols} selected={yAxisChk} onChange={toggleYAxisChk} onSelectAll={() => setYAxisChk(numCols)} onClearAll={() => setYAxisChk([])} />
                {(type === 'parcoords' || type === 'splom') && <SelectField label="色の基準 (数値またはカテゴリ)" value={colorAxis} onChange={setColorAxis} options={['なし', ...numCols, ...catCols]} />}
              </Fragment>
            )}

            {/* X数値, Y数値 */}
            {(type === 'scatter' || type === 'bubble' || type === 'contour' || type === 'scatter3d') && (
              <Fragment>
                <div className="relative border border-slate-200 rounded-lg p-3 bg-slate-50/50 mb-4 flex flex-col space-y-3">
                  <SelectField label="X軸 (数値)" value={xAxis} onChange={setXAxis} options={numCols} noMargin />
                  <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10">
                    <button 
                      onClick={() => { const t = xAxis; setXAxis(yAxis); setYAxis(t); }} 
                      className="bg-white border border-slate-300 rounded-full p-1.5 shadow-md hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 text-slate-500 transition-all"
                      title="X軸とY軸を入れ替える"
                    >
                      <ArrowUpDown className="w-4 h-4" />
                    </button>
                  </div>
                  <SelectField label="Y軸 (数値)" value={yAxis} onChange={setYAxis} options={numCols} noMargin />
                </div>
                {(type === 'bubble' || type === 'scatter3d') && <SelectField label={type === 'scatter3d' ? "Z軸 (数値)" : "バブルの大きさ (数値)"} value={sizeAxis} onChange={setSizeAxis} options={numCols} />}
                {(type === 'scatter' || type === 'bubble' || type === 'scatter3d') && <SelectField label="色分け (カテゴリ) ※任意" value={colorGroup} onChange={setColorGroup} options={['なし', ...catCols]} />}
              </Fragment>
            )}

            {/* 単一数値 */}
            {type === 'histogram' && (
              <Fragment>
                <SelectField label="対象データ (数値)" value={xAxis} onChange={setXAxis} options={numCols} />
                <div className="mb-4">
                  <label className="block text-xs font-bold text-slate-600 mb-1.5">ビンの数 (階級数)</label>
                  <input type="number" value={bins} onChange={e=>setBins(e.target.value)} min="5" max="100" className="w-full text-sm border-slate-300 rounded-lg p-2.5 shadow-sm outline-none" />
                </div>
              </Fragment>
            )}

            {/* 単一カテゴリ */}
            {type === 'pie' && <SelectField label="集計するカテゴリ" value={xAxis} onChange={setXAxis} options={catCols.length > 0 ? catCols : allCols} />}

            {/* クロス集計 */}
            {type === 'crosstab_heatmap' && (
              <Fragment>
                <div className="relative border border-slate-200 rounded-lg p-3 bg-slate-50/50 mb-4 flex flex-col space-y-3">
                  <SelectField label="X軸 (カテゴリ)" value={xAxis} onChange={setXAxis} options={catCols} noMargin />
                  <div className="absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10">
                    <button 
                      onClick={() => { const t = xAxis; setXAxis(colorGroup); setColorGroup(t); }} 
                      className="bg-white border border-slate-300 rounded-full p-1.5 shadow-md hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 text-slate-500 transition-all"
                      title="X軸とY軸を入れ替える"
                    >
                      <ArrowUpDown className="w-4 h-4" />
                    </button>
                  </div>
                  <SelectField label="Y軸 (カテゴリ)" value={colorGroup} onChange={setColorGroup} options={catCols} noMargin />
                </div>
                <SelectField label="集計する数値 (平均値)" value={colorAxis} onChange={setColorAxis} options={numCols} />
              </Fragment>
            )}

            {/* バンプチャート */}
            {type === 'bumpchart' && (
              <Fragment>
                <SelectField label="時間軸・順序 (X軸)" value={xAxis} onChange={setXAxis} options={cols.date.length > 0 ? cols.date : catCols} />
                <SelectField label="追跡するグループ" value={colorGroup} onChange={setColorGroup} options={catCols} />
                <SelectField label="順位を決める数値" value={colorAxis} onChange={setColorAxis} options={numCols} />
              </Fragment>
            )}

            {/* ツリーマップ */}
            {type === 'treemap' && (
              <Fragment>
                <SelectField label="子カテゴリ" value={xAxis} onChange={setXAxis} options={catCols} />
                <SelectField label="親カテゴリ ※任意" value={colorGroup} onChange={setColorGroup} options={['なし', ...catCols]} />
                <SelectField label="サイズ (数値)" value={yAxis} onChange={setYAxis} options={numCols} />
              </Fragment>
            )}

          </div>
        );
      };

      return (
        <div className="flex flex-col md:flex-row h-screen bg-slate-50 overflow-hidden text-slate-800">
          {/* 左サイドバー: 設定パネル */}
          <div className="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10 shrink-0 h-[40vh] md:h-full">
            <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
              <div>
                <h1 className="font-black text-lg text-slate-800 tracking-tight leading-none">Data Analyzer</h1>
                <p className="text-xs text-slate-500 mt-1 truncate max-w-[200px]">{fileName}</p>
              </div>
              <button onClick={onReset} className="p-2 hover:bg-slate-100 rounded-md text-slate-400 hover:text-slate-600 transition-colors" title="別のファイルを読み込む">
                <ArrowLeft className="w-5 h-5" />
              </button>
            </div>
            
            <div className="flex-1 overflow-y-auto p-5 custom-scrollbar">
              <label className="block text-sm font-bold text-slate-700 mb-2">分析手法の選択</label>
              <select value={analysisType} onChange={e => setAnalysisType(e.target.value)} className="w-full text-sm border-slate-300 rounded-lg p-2.5 font-medium bg-slate-50 shadow-sm focus:bg-white outline-none mb-2">
                {['基礎', '推移・傾向', '比較', '分布', '関係性', '構成比', '高度な分析'].map(group => (
                  <optgroup key={group} label={`--- ${group} ---`}>
                    {ANALYSIS_TYPES.filter(t => t.group === group).map(t => (
                      <option key={t.id} value={t.id}>{t.name}</option>
                    ))}
                  </optgroup>
                ))}
              </select>

              <div className="mt-2">{renderDynamicControls()}</div>
            </div>

            <div className="p-4 bg-slate-50 border-t border-slate-200 shrink-0">
              <button onClick={executeAnalysis} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-transform active:scale-[0.98] flex items-center justify-center">
                <PlayIcon className="w-5 h-5 mr-2" /> 分析を実行
              </button>
            </div>
          </div>

          {/* 右メイン: 分析結果表示 */}
          <div className="flex-1 p-4 md:p-8 overflow-y-auto custom-scrollbar flex flex-col h-[60vh] md:h-full bg-slate-100">
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col min-h-full overflow-hidden relative">
              <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-white shrink-0">
                <h2 className="text-xl font-bold text-slate-800">{resultTitle}</h2>
                <div className="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full border border-blue-100">
                  {data.length.toLocaleString()} 行のデータ
                </div>
              </div>
              
              <div className="flex-1 p-4 md:p-6 relative bg-white">
                {noDataMsg && (
                  <div className="bg-red-50 text-red-600 p-4 rounded-lg border border-red-100 flex items-center mb-4">
                    <AlertCircle className="w-5 h-5 mr-2" />
                    <p className="font-bold text-sm">{noDataMsg}</p>
                  </div>
                )}
                
                <div ref={chartRef} className={`w-full h-full min-h-[400px] ${summaryData ? 'hidden' : ''}`}></div>
                
                {/* 基本統計量テーブル */}
                {summaryData && (
                  <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm animate-in fade-in">
                    <table className="min-w-full text-sm text-right whitespace-nowrap">
                      <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                        <tr>
                          <th className="px-4 py-3 text-left">変数名</th>
                          <th className="px-4 py-3">データ数</th>
                          <th className="px-4 py-3">平均</th>
                          <th className="px-4 py-3">標準偏差</th>
                          <th className="px-4 py-3">最小値</th>
                          <th className="px-4 py-3">中央値</th>
                          <th className="px-4 py-3">最大値</th>
                        </tr>
                      </thead>
                      <tbody className="bg-white divide-y divide-slate-100">
                        {summaryData.map(r => (
                          <tr key={r.col} className="hover:bg-slate-50">
                            <td className="px-4 py-3 font-bold text-slate-800 text-left">{r.col}</td>
                            <td className="px-4 py-3">{r.count}</td>
                            <td className="px-4 py-3 font-bold text-blue-600">{r.mean.toFixed(2)}</td>
                            <td className="px-4 py-3">{r.sd.toFixed(2)}</td>
                            <td className="px-4 py-3">{r.min}</td>
                            <td className="px-4 py-3">{r.median.toFixed(2)}</td>
                            <td className="px-4 py-3">{r.max}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 統計的検定の詳細表示 */}
                {statTestData && (
                  <div className="mt-6 p-5 border border-indigo-100 bg-indigo-50 rounded-xl shadow-sm text-sm text-slate-800 animate-in fade-in">
                    <h3 className="font-bold text-lg mb-3 flex items-center text-indigo-900"><InfoIcon className="w-5 h-5 mr-2 text-indigo-600" /> 一元配置分散分析 (ANOVA) 結果</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                      <div className="bg-white p-4 rounded-lg border border-indigo-100 shadow-sm">
                        <p className="text-xs text-slate-500 font-bold mb-1">F値 (グループ間の分散比)</p>
                        <p className="text-2xl font-black text-slate-700">{statTestData.anova.F.toFixed(3)}</p>
                      </div>
                      <div className="bg-white p-4 rounded-lg border border-indigo-100 shadow-sm">
                        <p className="text-xs text-slate-500 font-bold mb-1">p値 (有意確率)</p>
                        <p className="text-2xl font-black text-indigo-600">
                          {statTestData.anova.pValue !== null ? (statTestData.anova.pValue < 0.001 ? '< 0.001' : statTestData.anova.pValue.toFixed(4)) : '計算不可'}
                        </p>
                      </div>
                    </div>
                    {statTestData.anova.pValue !== null && (
                      <div className={`p-4 rounded-lg font-bold border ${statTestData.anova.pValue < 0.05 ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-slate-200 text-slate-700 border-slate-300'}`}>
                        【判定】 {statTestData.anova.pValue < 0.05 ? '統計的に有意な差があります (p < 0.05)。グループによって平均値に違いがあると言えます。' : '統計的に有意な差はありません (p >= 0.05)。グループ間の違いは誤差の範囲内である可能性があります。'}
                      </div>
                    )}
                  </div>
                )}

                {!summaryData && !statTestData && !chartRef.current?.children.length && !noDataMsg && (
                  <div className="absolute inset-0 flex flex-col items-center justify-center text-slate-400">
                    <PlayIcon className="w-16 h-16 text-slate-200 mb-4" />
                    <p className="text-lg font-bold text-slate-400">左側のパネルで条件を設定し、「分析を実行」を押してください</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // -------------------------------------------------------------
    // アプリケーション全体のエントリポイント (アップロード画面)
    // -------------------------------------------------------------
    const App = () => {
      const [data, setData] = useState([]);
      const [fileName, setFileName] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setErrorMsg('');
        setFileName(file.name);
        
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = window.XLSX.read(bstr, {type:'binary'});
            const wsname = wb.SheetNames[0];
            const ws = wb.Sheets[wsname];
            const jsonData = window.XLSX.utils.sheet_to_json(ws);
            if (jsonData && jsonData.length > 0) {
              setData(jsonData);
            } else {
              setErrorMsg('ファイル内にデータが見つかりませんでした。空のシートでないか確認してください。');
            }
          } catch(err) {
            setErrorMsg('ファイルの読み込みに失敗しました。対応している形式(CSV/XLS/XLSX)か確認してください。');
          }
        };
        reader.readAsBinaryString(file);
      };

      const loadDemoData = () => {
        const demo = [];
        const regions = ['東京', '大阪', '愛知', '福岡', '北海道'];
        const products = ['製品A', '製品B', '製品C'];
        let date = new Date('2024-01-01');
        
        for (let i = 0; i < 100; i++) {
          demo.push({
            "日付": date.toISOString().split('T')[0],
            "月": date.toISOString().substring(0, 7),
            "地域": regions[Math.floor(Math.random() * regions.length)],
            "商品": products[Math.floor(Math.random() * products.length)],
            "売上額": Math.floor(Math.random() * 50000) + 10000,
            "客数": Math.floor(Math.random() * 100) + 20,
            "満足度": Number((Math.random() * 2 + 3).toFixed(1)),
            "リピート率": Number((Math.random() * 40 + 20).toFixed(1))
          });
          if (i % 2 === 0) date.setDate(date.getDate() + 1);
        }
        setFileName('デモ売上データ.csv');
        setData(demo);
      };

      if (data.length > 0) {
        return <AnalysisWorkspace rawData={data} fileName={fileName} onReset={() => setData([])} />;
      }

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-50 font-sans text-slate-800">
          <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border border-slate-100 text-center animate-in fade-in">
            <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
              <UploadCloud className="w-10 h-10" />
            </div>
            <h1 className="text-2xl font-black text-slate-800 tracking-tight mb-2">Data Analyzer</h1>
            <p className="text-slate-500 text-sm mb-8">CSV または Excel ファイルをインポートして<br/>22種類の高度なデータ分析をすぐに始めましょう。</p>
            
            {errorMsg && (
              <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold mb-6 border border-red-100">
                {errorMsg}
              </div>
            )}

            <div className="relative">
              <input 
                type="file" 
                accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" 
                onChange={handleFileUpload} 
                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
              />
              <div className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-colors flex items-center justify-center">
                <FileSpreadsheet className="w-5 h-5 mr-2" />
                ファイルを選択する
              </div>
            </div>

            <div className="mt-8 pt-6 border-t border-slate-100">
              <p className="text-xs text-slate-400 mb-3">または、手元にデータがない場合は</p>
              <button onClick={loadDemoData} className="text-sm font-bold text-blue-600 hover:text-blue-800 hover:underline transition-colors">
                デモデータを使って試す
              </button>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
