<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>データ管理統合ツール</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-gray-50 p-4 md:p-8 font-sans text-gray-800 relative">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- ヘッダー -->
    <header class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 flex items-center">
          <i data-lucide="file-text" class="w-6 h-6 mr-2 text-blue-600"></i>
          データ管理統合ツール
        </h1>
        <p class="text-gray-500 mt-1 text-sm">各リストのインポート・編集・閲覧を一元管理します。</p>
      </div>
      <div class="mt-4 md:mt-0 flex flex-wrap items-center gap-3">
        <div class="flex items-center text-sm text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full">
          <div id="auth-status-dot" class="w-2 h-2 rounded-full mr-2 bg-gray-400"></div>
          <span id="auth-status-text">接続中...</span>
        </div>
        
        <button 
          onclick="window.open('https://strategy-monitor-rust.vercel.app', '_blank')"
          class="flex items-center px-4 py-1.5 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-full shadow-sm transition-all active:scale-95"
        >
          <i data-lucide="external-link" class="w-4 h-4 mr-2"></i>
          最新情報
        </button>
      </div>
    </header>

    <!-- タブナビゲーション -->
    <div id="tabs-container" class="flex border-b border-gray-300"></div>

    <!-- メッセージエリア -->
    <div id="message-container"></div>

    <!-- インポート・新規追加セクション -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 border-b pb-2">
        <h2 class="text-lg font-semibold text-gray-800 flex items-center">
          <span id="import-tab-name" class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded mr-2"></span>
          データの追加
        </h2>
        <button 
          onclick="window.app.openAddModal()"
          class="mt-2 md:mt-0 flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-bold rounded-md hover:bg-indigo-700 shadow-sm transition-all active:scale-95"
        >
          <i data-lucide="plus-circle" class="w-4 h-4 mr-2"></i>
          手動で新規登録
        </button>
      </div>
      
      <div class="flex flex-col md:flex-row gap-4 items-start md:items-center">
        <div class="flex-1 w-full relative">
          <input 
            type="file" id="file-input" accept=".csv, .xlsx, .xls"
            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors border border-gray-200 rounded-md"
          >
        </div>
        
        <div class="flex flex-col sm:flex-row items-start sm:items-center space-y-3 sm:space-y-0 sm:space-x-4">
          <label id="shift-jis-label" class="flex items-center text-sm text-gray-600 cursor-pointer">
            <input type="checkbox" id="use-shift-jis" checked class="mr-2 rounded text-blue-600 focus:ring-blue-500 disabled:opacity-50">
            Shift_JIS
          </label>

          <label class="flex items-center text-sm text-gray-600 cursor-pointer" title="チェックを入れると、一意の項目が一致する既存データを新しいデータで上書きします">
            <input type="checkbox" id="allow-overwrite" class="mr-2 rounded text-red-500 focus:ring-red-500">
            上書き許可
          </label>

          <button id="import-btn" class="flex items-center px-5 py-2.5 rounded-md font-medium text-white transition-all bg-gray-400 cursor-not-allowed" disabled>
            <i data-lucide="upload" class="w-4 h-4 mr-2"></i>一括保存
          </button>
        </div>
      </div>
    </div>

    <!-- データ一覧セクション -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-200 bg-gray-50 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
        
        <div class="flex flex-wrap items-center gap-3">
          <h2 id="list-tab-name" class="text-lg font-semibold text-gray-800"></h2>
          <span id="data-count-display" class="bg-white px-3 py-1 rounded-full text-xs font-medium text-gray-600 border shadow-sm">
            表示 0 / 全 0 件
          </span>
          <span class="flex items-center text-xs text-gray-500 bg-white px-3 py-1 rounded-full border border-gray-100">
            <i data-lucide="clock" class="w-3.5 h-3.5 mr-1 text-blue-400"></i>
            <span id="last-modified-display">最終更新: ---</span>
          </span>
        </div>
        
        <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
          <!-- 分野絞り込みプルダウン -->
          <div id="filter-select-container" class="relative w-full sm:w-48" style="display: none;">
            <select id="filter-select" class="block w-full pl-3 pr-10 py-2 border border-gray-300 rounded-md leading-5 bg-white focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors appearance-none">
            </select>
          </div>

          <!-- 検索バー -->
          <div class="relative flex items-center">
            <i data-lucide="search" class="absolute left-2 w-4 h-4 text-gray-400"></i>
            <input type="text" id="search-input" placeholder="検索..." class="pl-8 pr-8 p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-1 focus:ring-blue-500 focus:outline-none">
            <button id="clear-search-btn" class="absolute right-2 text-gray-400 hover:text-gray-600 hidden" title="クリア">
              <i data-lucide="x-circle" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- ソートボタン -->
          <button id="sort-btn" class="flex items-center px-3 py-2 border rounded-md transition-colors text-sm font-medium bg-white text-gray-700 border-gray-300 hover:bg-gray-50">
            <i data-lucide="arrow-up-down" class="w-4 h-4 mr-1.5"></i>
            <span id="sort-btn-text">順位</span>
          </button>

          <!-- エクスポートボタン -->
          <button id="export-btn" class="flex items-center px-3 py-2 bg-white text-gray-700 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors text-sm font-medium">
            <i data-lucide="download" class="w-4 h-4 mr-1.5"></i>出力
          </button>

          <!-- 一括削除ボタン -->
          <button id="bulk-delete-action-btn" class="flex items-center px-3 py-2 bg-red-50 text-red-600 border border-red-200 rounded-md hover:bg-red-100 transition-colors text-sm font-medium" style="display: none;">
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <div id="loading-state" class="p-12 flex justify-center items-center text-gray-500">
          <i data-lucide="refresh-cw" class="w-6 h-6 animate-spin mr-3 text-blue-500"></i>読み込み中...
        </div>
        
        <div id="empty-state" class="p-12 text-center text-gray-500" style="display: none;">
          <i data-lucide="file-text" class="w-12 h-12 mx-auto text-gray-300 mb-3"></i>
          <p id="empty-message">データがありません。</p>
        </div>

        <table id="main-table" class="min-w-full divide-y divide-gray-200" style="display: none;">
          <thead id="table-thead" class="bg-gray-100"></thead>
          <tbody id="table-tbody" class="bg-white divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="modals-container"></div>

  <!-- Firebase v11 JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, writeBatch, doc, deleteDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBx5e752GWfvJDZ3lEx0IcArxjvCEz7S2M",
      authDomain: "seisakuresearch00.firebaseapp.com",
      projectId: "seisakuresearch00",
      storageBucket: "seisakuresearch00.firebasestorage.app",
      messagingSenderId: "356788263577",
      appId: "1:356788263577:web:ecc3782d0c82cb7da43608",
      measurementId: "G-Y1C3GPNC9Z"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'seisakuresearch';

    const TABS = [
      { id: 'meetings', label: '会議体リスト', collection: 'meetings', icon: 'list', filterCol: '関連分野', sortCol: '順位', uniqueKeys: ['関連分野', '会議名'] },
      { id: 'fields', label: '分野別リスト', collection: 'fields', icon: 'database', filterCol: '分野', sortCol: null, uniqueKeys: ['分野'] },
      { id: 'links', label: 'リンクリスト', collection: 'links', icon: 'link', filterCol: '分野', sortCol: null, uniqueKeys: ['分野', '会議名'] }
    ];

    const COLUMNS = {
      meetings: ['関連分野', '区分', '順位', '会議名', 'URL', '所管', '対象分野', '直近開催日', '備考'],
      fields: ['分野', '解説'],
      links: ['分野', '会議名', '会議体URL', '構成員', 'ロードマップ', '概要']
    };

    // Application State
    const state = {
      user: null,
      activeTab: 'meetings',
      dataList: [],
      loading: true,
      file: null,
      importing: false,
      useShiftJis: true,
      message: { text: '', type: '' },
      editingItem: null,
      isAdding: false,
      newItem: {},
      deletingId: null,
      searchQuery: '',
      selectedIds: [],
      showBulkDeleteConfirm: false,
      allowOverwrite: false,
      sortByRank: false,
      selectedFieldFilter: ''
    };

    let unsubscribeSnapshot = null;

    // Helpers
    const loadXLSX = () => {
      return new Promise((resolve, reject) => {
        if (window.XLSX) return resolve(window.XLSX);
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        script.onload = () => resolve(window.XLSX);
        script.onerror = () => reject(new Error('Excel解析ライブラリの読み込みに失敗しました'));
        document.head.appendChild(script);
      });
    };

    function parseCSV(text) {
      const normalizedText = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const result = [];
      let row = [];
      let inQuotes = false;
      let currentValue = '';

      for (let i = 0; i < normalizedText.length; i++) {
        const char = normalizedText[i];
        if (char === '"') {
          if (inQuotes && normalizedText[i + 1] === '"') {
            currentValue += '"'; i++;
          } else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
          row.push(currentValue); currentValue = '';
        } else if (char === '\n' && !inQuotes) {
          row.push(currentValue); result.push(row); row = []; currentValue = '';
        } else { currentValue += char; }
      }
      if (currentValue || row.length > 0) { row.push(currentValue); result.push(row); }
      return result;
    }

    const isUrl = (text) => typeof text === 'string' && text.trim().startsWith('http');
    const escapeHTML = (str) => typeof str !== 'string' ? (str === undefined || str === null ? '' : String(str)) : str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));

    // Global Object for UI access
    window.app = {
      switchTab: (id) => {
        state.activeTab = id;
        state.selectedIds = [];
        state.searchQuery = '';
        state.selectedFieldFilter = '';
        state.message = { text: '', type: '' };
        state.sortByRank = false;

        document.getElementById('search-input').value = '';
        document.getElementById('clear-search-btn').classList.add('hidden');
        renderTabs();
        renderMessage();
        updateImportUI();
        
        const currentTabDef = TABS.find(t => t.id === state.activeTab);
        document.getElementById('import-tab-name').textContent = currentTabDef.label;
        document.getElementById('list-tab-name').textContent = currentTabDef.label;
        document.getElementById('sort-btn').style.display = currentTabDef.sortCol ? 'flex' : 'none';
        document.getElementById('sort-btn-text').textContent = '順位';

        if (unsubscribeSnapshot) unsubscribeSnapshot();
        state.loading = true;
        updateTable();

        const dataRef = collection(db, 'artifacts', appId, 'public', 'data', currentTabDef.collection);
        unsubscribeSnapshot = onSnapshot(dataRef, (snapshot) => {
          state.dataList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          state.loading = false;
          updateFilterSelect();
          updateTable();
        });
      },

      handleFileChange: (e) => {
        state.file = e.target.files[0] || null;
        updateImportUI();
      },

      handleImport: async () => {
        if (!state.file) return;
        state.importing = true;
        showMessage('', '');
        updateImportUI();

        const currentTabDef = TABS.find(t => t.id === state.activeTab);
        const activeColumns = COLUMNS[state.activeTab];

        try {
          let parsedData = [];
          const isExcelFile = state.file.name.toLowerCase().endsWith('.xlsx') || state.file.name.toLowerCase().endsWith('.xls');

          if (isExcelFile) {
            const XLSX = await loadXLSX();
            const arrayBuffer = await state.file.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            parsedData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: '' });
          } else {
            const readAs = (encoding) => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = (e) => resolve(e.target.result);
              reader.onerror = () => reject(new Error("読み込み失敗"));
              reader.readAsText(state.file, encoding);
            });
            let textRaw = await readAs(state.useShiftJis ? 'Shift_JIS' : 'UTF-8');
            if (!textRaw.includes(activeColumns[0])) {
              const alternateText = await readAs(state.useShiftJis ? 'UTF-8' : 'Shift_JIS');
              if (alternateText.includes(activeColumns[0])) {
                textRaw = alternateText;
                state.useShiftJis = !state.useShiftJis;
                document.getElementById('use-shift-jis').checked = state.useShiftJis;
              }
            }
            parsedData = parseCSV(textRaw.replace(/^\uFEFF/, ''));
          }

          if (!parsedData.length) throw new Error("データがありません");

          const isHeaderRow = parsedData[0].some(h => typeof h === 'string' && activeColumns.includes(h.trim()));
          let headers = isHeaderRow ? parsedData[0].map(h => String(h).trim()) : activeColumns;
          let startIndex = isHeaderRow ? 1 : 0;

          const uploadDataList = [];
          for (let i = startIndex; i < parsedData.length; i++) {
            const row = parsedData[i];
            if (!row || (row.length === 1 && row[0] === '')) continue;
            const item = {};
            headers.forEach((header, index) => {
              if (activeColumns.includes(header)) item[header] = row[index] !== undefined ? String(row[index]).trim() : '';
            });
            if (Object.values(item).some(v => v !== '')) uploadDataList.push(item);
          }

          if (!uploadDataList.length) throw new Error("有効なデータがありません");

          let skippedCount = 0, updatedCount = 0, addedCount = 0;
          const existingMap = new Map();
          state.dataList.forEach(m => {
            const key = currentTabDef.uniqueKeys.map(k => m[k] || '').join('_');
            existingMap.set(key, m.id);
          });

          const processedKeys = new Set();
          const batch = writeBatch(db);
          const dataRef = collection(db, 'artifacts', appId, 'public', 'data', currentTabDef.collection);

          uploadDataList.forEach((newItem, index) => {
            const uniqueKey = currentTabDef.uniqueKeys.map(k => newItem[k] || '').join('_');
            if (!uniqueKey || processedKeys.has(uniqueKey)) return;
            processedKeys.add(uniqueKey);

            const timestamp = Date.now() + index;

            if (existingMap.has(uniqueKey)) {
              if (state.allowOverwrite) {
                const existingId = existingMap.get(uniqueKey);
                const existingData = state.dataList.find(d => d.id === existingId) || {};
                batch.set(doc(db, 'artifacts', appId, 'public', 'data', currentTabDef.collection, existingId), { 
                  ...existingData, ...newItem, 
                  createdAt: existingData.createdAt || timestamp, 
                  updatedAt: timestamp 
                });
                updatedCount++;
              } else { skippedCount++; }
            } else {
              batch.set(doc(dataRef), { ...newItem, createdAt: timestamp, updatedAt: timestamp });
              addedCount++;
            }
          });

          if (addedCount === 0 && updatedCount === 0) {
            showMessage(`変更はありません（${skippedCount}件スキップ）。`, 'info');
          } else {
            await batch.commit();
            showMessage(`完了: ${addedCount}件登録 / ${updatedCount}件上書きしました。`, 'success');
          }
          state.file = null;
          document.getElementById('file-input').value = '';
        } catch (err) {
          showMessage(`エラー: ${err.message}`, 'error');
        } finally {
          state.importing = false;
          updateImportUI();
        }
      },

      openAddModal: () => {
        const cols = COLUMNS[state.activeTab];
        state.newItem = {};
        cols.forEach(c => state.newItem[c] = '');
        state.isAdding = true;
        renderModals();
      },

      closeAddModal: () => { state.isAdding = false; renderModals(); },

      handleSaveAdd: async () => {
        const currentTabDef = TABS.find(t => t.id === state.activeTab);
        const cols = COLUMNS[state.activeTab];
        const item = {};
        cols.forEach(c => {
          const el = document.getElementById(`add-input-${c}`);
          if (el) item[c] = el.value;
        });

        try {
          const dataRef = collection(db, 'artifacts', appId, 'public', 'data', currentTabDef.collection);
          const timestamp = Date.now();
          await addDoc(dataRef, { ...item, createdAt: timestamp, updatedAt: timestamp });
          showMessage('新規登録しました。', 'success');
          state.isAdding = false;
          renderModals();
        } catch (err) { showMessage(`エラー: ${err.message}`, 'error'); }
      },

      openEditModal: (id) => {
        const item = state.dataList.find(d => d.id === id);
        if (item) { state.editingItem = { ...item }; renderModals(); }
      },
      closeEditModal: () => { state.editingItem = null; renderModals(); },
      handleSaveEdit: async () => {
        if (!state.editingItem) return;
        const currentTabDef = TABS.find(t => t.id === state.activeTab);
        const activeColumns = COLUMNS[state.activeTab];
        activeColumns.forEach(col => {
          const el = document.getElementById(`edit-input-${col}`);
          if (el) state.editingItem[col] = el.value;
        });
        try {
          const { id, ...updateData } = state.editingItem;
          updateData.updatedAt = Date.now();
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', currentTabDef.collection, id), updateData);
          showMessage('更新しました。', 'success');
          state.editingItem = null;
          renderModals();
        } catch (err) { showMessage(`エラー: ${err.message}`, 'error'); }
      },

      openDeleteModal: (id) => { state.deletingId = id; renderModals(); },
      handleDelete: async () => {
        const currentTabDef = TABS.find(t => t.id === state.activeTab);
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', currentTabDef.collection, state.deletingId));
          showMessage('削除しました。', 'success');
        } catch (err) { showMessage(`エラー: ${err.message}`, 'error'); }
        state.deletingId = null;
        renderModals();
      },

      openBulkDeleteModal: () => { state.showBulkDeleteConfirm = true; renderModals(); },
      handleBulkDelete: async () => {
        const currentTabDef = TABS.find(t => t.id === state.activeTab);
        try {
          const batch = writeBatch(db);
          state.selectedIds.forEach(id => batch.delete(doc(db, 'artifacts', appId, 'public', 'data', currentTabDef.collection, id)));
          await batch.commit();
          showMessage('削除しました。', 'success');
          state.selectedIds = [];
        } catch (err) { showMessage(`エラー: ${err.message}`, 'error'); }
        state.showBulkDeleteConfirm = false;
        renderModals();
      },

      handleExport: () => {
        const activeColumns = COLUMNS[state.activeTab];
        const currentTabDef = TABS.find(t => t.id === state.activeTab);
        const csvContent = [
          activeColumns.map(h => `"${h}"`).join(','),
          ...computeProcessedData().map(item => activeColumns.map(col => `"${(item[col] || '').replace(/"/g, '""')}"`).join(','))
        ].join('\n');
        const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${currentTabDef.label}_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
      }
    };

    function showMessage(text, type) { state.message = { text, type }; renderMessage(); }

    function renderMessage() {
      const container = document.getElementById('message-container');
      if (!state.message.text) { container.innerHTML = ''; return; }
      const styles = {
        error: 'bg-red-50 text-red-800 border-red-200',
        success: 'bg-green-50 text-green-800 border-green-200',
        info: 'bg-blue-50 text-blue-800 border-blue-200'
      }[state.message.type] || 'bg-blue-50 text-blue-800 border-blue-200';
      container.innerHTML = `<div class="flex items-center p-4 mb-6 rounded-md border ${styles}"><span>${escapeHTML(state.message.text)}</span></div>`;
    }

    function renderTabs() {
      document.getElementById('tabs-container').innerHTML = TABS.map(tab => `
        <button onclick="window.app.switchTab('${tab.id}')" class="flex items-center py-3 px-6 font-medium text-sm transition-all border-b-2 -mb-[2px] ${state.activeTab === tab.id ? 'border-blue-600 text-blue-700 bg-blue-50/50' : 'border-transparent text-gray-500 hover:text-gray-700'}">
          <i data-lucide="${tab.icon}" class="w-4 h-4 mr-2"></i>${tab.label}
        </button>
      `).join('');
      lucide.createIcons();
    }

    function updateImportUI() {
      document.getElementById('import-btn').disabled = !state.file || state.importing;
      document.getElementById('import-btn').className = `flex items-center px-5 py-2.5 rounded-md font-medium text-white ${!state.file || state.importing ? 'bg-gray-400' : 'bg-blue-600 hover:bg-blue-700 shadow-sm'}`;
      document.getElementById('import-btn').innerHTML = state.importing ? '<i data-lucide="refresh-cw" class="w-4 h-4 mr-2 animate-spin"></i>保存中' : '<i data-lucide="upload" class="w-4 h-4 mr-2"></i>一括保存';
      lucide.createIcons();
    }

    function updateFilterSelect() {
      const col = TABS.find(t => t.id === state.activeTab).filterCol;
      const select = document.getElementById('filter-select');
      if (!col) { document.getElementById('filter-select-container').style.display = 'none'; return; }
      const fields = Array.from(new Set(state.dataList.sort((a,b) => (a.createdAt||0)-(b.createdAt||0)).map(m => m[col]).filter(Boolean)));
      if (!fields.length) { document.getElementById('filter-select-container').style.display = 'none'; return; }
      document.getElementById('filter-select-container').style.display = 'block';
      select.innerHTML = `<option value="">すべての${escapeHTML(col)}</option>` + fields.map(f => `<option value="${escapeHTML(f)}">${escapeHTML(f)}</option>`).join('');
    }

    function computeProcessedData() {
      const currentTabDef = TABS.find(t => t.id === state.activeTab);
      const activeColumns = COLUMNS[state.activeTab];
      const filterCol = currentTabDef.filterCol;
      
      let filtered = state.dataList.filter(item => {
        if (state.selectedFieldFilter && item[filterCol] !== state.selectedFieldFilter) return false;
        if (!state.searchQuery) return true;
        return activeColumns.some(col => String(item[col] || '').toLowerCase().includes(state.searchQuery.toLowerCase()));
      });

      const fieldOrder = {};
      state.dataList.forEach(m => {
        const val = m[filterCol] || '';
        fieldOrder[val] = fieldOrder[val] === undefined ? (m.createdAt||0) : Math.min(fieldOrder[val], m.createdAt||0);
      });

      filtered.sort((a, b) => {
        if (state.sortByRank && currentTabDef.sortCol) {
          const valA = a[filterCol] || '', valB = b[filterCol] || '';
          if (valA !== valB) return (fieldOrder[valA]||0) - (fieldOrder[valB]||0);
          const rA = parseInt(a[currentTabDef.sortCol]) || 9999, rB = parseInt(b[currentTabDef.sortCol]) || 9999;
          return rA - rB;
        }
        return (a.createdAt || 0) - (b.createdAt || 0);
      });
      return filtered;
    }

    function updateTable() {
      const processed = computeProcessedData();
      const activeColumns = COLUMNS[state.activeTab];
      
      let maxTime = 0;
      state.dataList.forEach(m => { const t = Math.max(Number(m.updatedAt||0), Number(m.createdAt||0)); if (t > maxTime) maxTime = t; });
      document.getElementById('last-modified-display').textContent = maxTime ? `最終更新: ${new Date(maxTime).toLocaleString('ja-JP', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'})}` : '最終更新: ---';
      
      document.getElementById('data-count-display').textContent = `表示 ${processed.length} / 全 ${state.dataList.length} 件`;
      document.getElementById('bulk-delete-action-btn').style.display = state.selectedIds.length ? 'flex' : 'none';
      document.getElementById('bulk-delete-action-btn').innerHTML = `<i data-lucide="trash-2" class="w-4 h-4 mr-1.5"></i>一括削除(${state.selectedIds.length})`;

      document.getElementById('loading-state').style.display = state.loading ? 'flex' : 'none';
      document.getElementById('empty-state').style.display = (!state.loading && !processed.length) ? 'block' : 'none';
      document.getElementById('main-table').style.display = (!state.loading && processed.length) ? 'table' : 'none';

      if (processed.length) {
        document.getElementById('table-thead').innerHTML = `<tr>
          <th class="p-3 text-left w-10"><input type="checkbox" onchange="window.app.selectAll(this.checked)" ${processed.every(d => state.selectedIds.includes(d.id)) ? 'checked' : ''}></th>
          ${activeColumns.map(c => `<th class="p-3 text-left whitespace-nowrap">${escapeHTML(c)}</th>`).join('')}
          <th class="p-3 text-right">操作</th>
        </tr>`;
        document.getElementById('table-tbody').innerHTML = processed.map(item => `
          <tr class="hover:bg-gray-50 ${state.selectedIds.includes(item.id) ? 'bg-blue-50/50' : ''}">
            <td class="p-3"><input type="checkbox" onchange="window.app.selectOne('${item.id}', this.checked)" ${state.selectedIds.includes(item.id) ? 'checked' : ''}></td>
            ${activeColumns.map(c => `<td class="p-3 text-sm text-gray-700">${isUrl(item[c]) ? `<a href="${escapeHTML(item[c])}" target="_blank" class="text-blue-600 hover:underline">リンク</a>` : `<div class="max-w-md break-words whitespace-pre-wrap">${escapeHTML(item[c]) || '-'}</div>`}</td>`).join('')}
            <td class="p-3 text-right whitespace-nowrap">
              <button onclick="window.app.openEditModal('${item.id}')" class="text-blue-600 hover:bg-blue-50 p-1.5 rounded mr-1"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
              <button onclick="window.app.openDeleteModal('${item.id}')" class="text-red-600 hover:bg-red-50 p-1.5 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </td>
          </tr>
        `).join('');
      }
      lucide.createIcons();
    }

    window.app.selectAll = (checked) => {
      const processed = computeProcessedData();
      state.selectedIds = checked ? processed.map(d => d.id) : [];
      updateTable();
    };
    window.app.selectOne = (id, checked) => {
      if (checked) state.selectedIds.push(id); else state.selectedIds = state.selectedIds.filter(i => i !== id);
      updateTable();
    };

    function renderModals() {
      const container = document.getElementById('modals-container');
      if (!state.editingItem && !state.isAdding && !state.deletingId && !state.showBulkDeleteConfirm) { container.innerHTML = ''; return; }
      
      let html = '';
      if (state.editingItem || state.isAdding) {
        const item = state.isAdding ? state.newItem : state.editingItem;
        const prefix = state.isAdding ? 'add' : 'edit';
        const cols = COLUMNS[state.activeTab];
        
        html = `<div class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between bg-gray-50 items-center">
              <h3 class="font-bold">${state.isAdding ? '新規登録' : '編集'}</h3>
              <button onclick="${state.isAdding ? 'window.app.closeAddModal()' : 'window.app.closeEditModal()'}"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
              ${cols.map(c => {
                const uniqueValues = Array.from(new Set(state.dataList.map(m => m[c]).filter(Boolean)));
                const needsDatalist = ['関連分野', '区分', '所管', '分野'].includes(c);
                const isTextArea = ['解説','備考','概要'].includes(c);
                
                let inputHtml = isTextArea 
                  ? `<textarea id="${prefix}-input-${c}" rows="4" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none">${escapeHTML(item[c])}</textarea>`
                  : `<input list="${prefix}-datalist-${c}" type="text" id="${prefix}-input-${c}" value="${escapeHTML(item[c])}" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:ring-1 focus:ring-blue-500 outline-none">`;
                
                if (needsDatalist && !isTextArea) {
                  inputHtml += `<datalist id="${prefix}-datalist-${c}">${uniqueValues.map(v => `<option value="${escapeHTML(v)}">`).join('')}</datalist>`;
                }

                return `<div><label class="block text-sm font-semibold mb-1 text-gray-700">${escapeHTML(c)}</label>${inputHtml}</div>`;
              }).join('')}
            </div>
            <div class="p-4 border-t flex justify-end gap-2 bg-gray-50">
              <button onclick="${state.isAdding ? 'window.app.closeAddModal()' : 'window.app.closeEditModal()'}" class="px-4 py-2 text-gray-600 font-medium">キャンセル</button>
              <button onclick="${state.isAdding ? 'window.app.handleSaveAdd()' : 'window.app.handleSaveEdit()'}" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 transition-colors shadow-sm">
                <i data-lucide="save" class="w-4 h-4 mr-2 inline"></i>${state.isAdding ? '登録' : '保存'}
              </button>
            </div>
          </div>
        </div>`;
      } else if (state.deletingId || state.showBulkDeleteConfirm) {
        const isBulk = state.showBulkDeleteConfirm;
        html = `<div class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
          <div class="bg-white p-6 rounded-lg max-w-sm w-full text-center shadow-2xl">
            <i data-lucide="alert-circle" class="w-12 h-12 text-red-500 mx-auto mb-4"></i>
            <h3 class="font-bold mb-4">${isBulk ? `${state.selectedIds.length}件を一括削除しますか？` : '削除しますか？'}</h3>
            <div class="flex gap-2"><button onclick="${isBulk ? 'state.showBulkDeleteConfirm=false;renderModals()' : 'window.app.closeDeleteModal()'}" class="flex-1 p-2 border rounded font-medium text-gray-600">戻る</button><button onclick="${isBulk ? 'window.app.handleBulkDelete()' : 'window.app.handleDelete()'}" class="flex-1 p-2 bg-red-600 text-white rounded font-bold">削除</button></div>
          </div>
        </div>`;
      }
      container.innerHTML = html;
      lucide.createIcons();
    }

    // Init UI
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      onAuthStateChanged(auth, (u) => {
        state.user = u;
        document.getElementById('auth-status-dot').className = `w-2 h-2 rounded-full mr-2 ${u ? 'bg-green-500' : 'bg-gray-400'}`;
        document.getElementById('auth-status-text').textContent = u ? 'システム接続済' : '接続中...';
        if (u) window.app.switchTab('meetings');
      });
      signInAnonymously(auth);

      document.getElementById('file-input').onchange = window.app.handleFileChange;
      document.getElementById('use-shift-jis').onchange = e => state.useShiftJis = e.target.checked;
      document.getElementById('allow-overwrite').onchange = e => state.allowOverwrite = e.target.checked;
      document.getElementById('import-btn').onclick = window.app.handleImport;
      
      const searchInput = document.getElementById('search-input');
      const clearSearchBtn = document.getElementById('clear-search-btn');
      
      searchInput.oninput = e => { 
        state.searchQuery = e.target.value; 
        if (state.searchQuery) {
          clearSearchBtn.classList.remove('hidden');
        } else {
          clearSearchBtn.classList.add('hidden');
        }
        updateTable(); 
      };

      clearSearchBtn.onclick = () => {
        state.searchQuery = '';
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        updateTable();
      };

      document.getElementById('filter-select').onchange = e => { state.selectedFieldFilter = e.target.value; updateTable(); };
      document.getElementById('export-btn').onclick = window.app.handleExport;
      document.getElementById('bulk-delete-action-btn').onclick = window.app.openBulkDeleteModal;
      document.getElementById('sort-btn').onclick = () => {
        state.sortByRank = !state.sortByRank;
        document.getElementById('sort-btn').className = `flex items-center px-3 py-2 border rounded-md transition-colors text-sm font-medium ${state.sortByRank ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-white text-gray-700'}`;
        document.getElementById('sort-btn-text').textContent = state.sortByRank ? '順位ソート中' : '順位';
        updateTable();
      };
    });

  </script>
</body>
</html>
