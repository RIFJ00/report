<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Word Search</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Word (.docx) 解析用ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    /* カスタムアニメーション */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.5s ease-out forwards; }
    /* スクロールバー非表示（スライドテーマ選択用） */
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen bg-white text-gray-900 font-sans dark:bg-[#202124] dark:text-gray-100 transition-colors duration-200">

  <!-- 設定モーダル -->
  <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
    <div class="bg-white dark:bg-[#303134] rounded-2xl shadow-xl w-full max-w-md p-6 border border-gray-200 dark:border-gray-700">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold flex items-center"><i data-lucide="settings" class="mr-2 h-5 w-5"></i>設定</h2>
        <button onclick="closeSettings()" class="text-gray-400 hover:text-gray-700 dark:hover:text-gray-200"><i data-lucide="x" class="h-5 w-5"></i></button>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Gemini API キー</label>
        <input type="password" id="api-key-input" class="w-full px-4 py-2 bg-gray-50 dark:bg-[#202124] border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white" placeholder="AIzaSy...">
        <p class="text-xs text-gray-500 mt-2"><a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400 hover:underline">Google AI Studio</a>で取得したAPIキーを入力してください。キーはブラウザにのみ保存されます。</p>
      </div>
      <div class="flex justify-between items-center">
        <button onclick="removeApiKey()" class="px-3 py-2 text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/20 rounded-lg transition-colors font-medium text-sm flex items-center">
          <i data-lucide="trash-2" class="h-4 w-4 mr-1"></i>キーを削除
        </button>
        <button onclick="saveApiKey()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">保存して閉じる</button>
      </div>
    </div>
  </div>

  <!-- ホーム画面 -->
  <div id="home-view" class="flex flex-col items-center justify-center min-h-screen px-4 pb-20 relative">
    <div class="absolute top-6 right-6 sm:top-8 sm:right-8 flex space-x-2">
      <button onclick="openSettings()" class="flex items-center justify-center p-2 bg-gray-50 dark:bg-[#303134] text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-600 rounded-full hover:bg-gray-100 transition-colors shadow-sm" title="設定">
        <i data-lucide="settings" class="h-5 w-5"></i>
      </button>
      <button onclick="switchView('saved')" class="flex items-center space-x-2 px-4 py-2 bg-gray-50 dark:bg-[#303134] text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-600 rounded-full hover:bg-gray-100 transition-colors shadow-sm">
        <i data-lucide="library" class="h-4 w-4"></i>
        <span class="font-medium text-sm">保存済みデータ一覧</span>
        <span id="home-saved-count" class="hidden bg-blue-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1">0</span>
      </button>
    </div>
    
    <div class="mb-8 flex items-center space-x-3 text-blue-500">
      <i data-lucide="search" class="w-14 h-14" stroke-width="2.5"></i>
      <h1 class="text-5xl sm:text-6xl font-extrabold tracking-tighter text-gray-800 dark:text-white">AI Word Search</h1>
    </div>
    
    <div class="w-full max-w-4xl">
      <form onsubmit="handleSubmit(event)" class="w-full flex flex-col gap-3">
        <div class="flex flex-col sm:flex-row gap-3 w-full">
          <div class="relative group flex-grow h-14">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="search" class="h-5 w-5 text-gray-400 group-focus-within:text-blue-500 transition-colors"></i>
            </div>
            <input type="text" id="home-search-input" oninput="syncSearchInput(this.value)" class="block w-full h-full pl-12 pr-12 bg-white dark:bg-[#303134] border border-gray-200 dark:border-gray-600 rounded-full shadow-sm hover:shadow-md focus:outline-none transition-shadow text-base dark:text-white placeholder-gray-400" placeholder="キーワード検索、または分野を選択...">
            <button type="button" id="home-clear-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600"><i data-lucide="x" class="h-5 w-5"></i></button>
          </div>
          <div class="relative shrink-0 w-full sm:w-56 h-14">
            <select id="home-category-select" onchange="syncCategory(this.value)" class="block w-full h-full pl-5 pr-10 bg-white dark:bg-[#303134] border border-gray-200 dark:border-gray-600 rounded-full shadow-sm hover:shadow-md focus:outline-none transition-shadow text-base dark:text-white appearance-none cursor-pointer text-gray-700 dark:text-gray-200">
              <option value="">すべての分野</option>
              <!-- JSで動的生成 -->
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-gray-500">
              <i data-lucide="chevron-down" class="h-5 w-5"></i>
            </div>
          </div>
          <div class="shrink-0 h-14">
            <input type="file" id="file-upload-home" class="hidden" accept=".pdf,.txt,.html,.htm,.pptx,.docx" onchange="handleFileChange(event)">
            <label for="file-upload-home" class="flex items-center justify-center w-full sm:w-14 h-full bg-white dark:bg-[#303134] border border-gray-200 dark:border-gray-600 rounded-full shadow-sm hover:shadow-md cursor-pointer text-gray-500 hover:text-blue-500 transition-colors" title="PDF, TEXT, HTML, PPTX, WORDファイルを添付して分析">
              <i data-lucide="paperclip" class="h-5 w-5"></i>
            </label>
          </div>
        </div>
        
        <div id="home-file-display" class="hidden flex items-center justify-center sm:justify-start space-x-2 text-sm text-blue-700 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/30 px-4 py-2 rounded-full border border-blue-200 dark:border-blue-800 w-fit mx-auto sm:mx-0 transition-all">
          <i data-lucide="file-check" class="h-4 w-4"></i>
          <span id="home-file-name" class="truncate max-w-[200px] sm:max-w-md font-medium"></span>
          <button type="button" onclick="removeFile()" class="text-blue-400 hover:text-blue-700 dark:hover:text-blue-100 ml-2 rounded-full hover:bg-blue-100 dark:hover:bg-blue-800 p-0.5 transition-colors" title="ファイルを削除">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        </div>
      </form>

      <div class="mt-10 flex justify-center">
        <button id="home-submit-btn" onclick="executeSearch()" disabled class="px-8 py-3.5 bg-[#f8f9fa] dark:bg-[#303134] border border-gray-200 dark:border-gray-600 rounded-full text-base font-medium text-gray-800 dark:text-gray-200 hover:border-gray-300 dark:hover:border-gray-500 hover:shadow-sm hover:bg-gray-50 disabled:opacity-50 transition-all">検索を実行する</button>
      </div>
      
      <div id="home-error" class="hidden mt-6 bg-red-50 border border-red-200 rounded-lg p-4 flex items-start space-x-3 max-w-xl mx-auto">
        <i data-lucide="alert-circle" class="h-5 w-5 text-red-600 shrink-0 mt-0.5"></i>
        <p id="home-error-text" class="text-sm text-red-600 whitespace-pre-wrap"></p>
      </div>
    </div>

    <!-- ホーム画面用フッター -->
    <footer class="absolute bottom-6 w-full text-center text-sm text-gray-500 dark:text-gray-400">
      &copy; 一般社団法人日本みらい研 All Rights Reserved.
    </footer>
  </div>

  <!-- アプリ本体画面（検索結果・保存一覧用） -->
  <div id="app-view" class="hidden flex flex-col min-h-screen">
    <header class="sticky top-0 z-10 bg-white dark:bg-[#202124] border-b border-gray-200 dark:border-gray-700 p-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row items-center gap-4 sm:gap-6">
      <div class="flex items-center space-x-2 text-blue-500 cursor-pointer shrink-0" onclick="resetHome()">
        <i data-lucide="search" class="w-8 h-8" stroke-width="2.5"></i>
        <span class="text-2xl font-extrabold tracking-tighter text-gray-800 dark:text-white hidden lg:block">AI Word Search</span>
      </div>

      <form onsubmit="handleSubmit(event)" class="flex-grow w-full max-w-5xl flex flex-col gap-2">
        <div class="flex flex-row gap-2 w-full">
          <div class="relative flex-grow group h-12">
            <input type="text" id="header-search-input" oninput="syncSearchInput(this.value)" class="block w-full h-full pl-5 pr-10 bg-white dark:bg-[#303134] border border-gray-200 dark:border-gray-600 rounded-full shadow-sm focus:outline-none text-base dark:text-white" placeholder="キーワード検索...">
            <button type="button" id="header-clear-btn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600"><i data-lucide="x" class="h-5 w-5"></i></button>
          </div>
          <div class="relative shrink-0 w-28 sm:w-40 h-12">
            <select id="header-category-select" onchange="syncCategory(this.value)" class="block w-full h-full pl-3 sm:pl-4 pr-6 sm:pr-8 bg-white dark:bg-[#303134] border border-gray-200 dark:border-gray-600 rounded-full shadow-sm focus:outline-none text-sm sm:text-base dark:text-white appearance-none cursor-pointer truncate text-gray-700 dark:text-gray-200">
              <option value="">分野: すべて</option>
              <!-- JSで動的生成 -->
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:pr-3 pointer-events-none text-gray-500">
              <i data-lucide="chevron-down" class="h-4 w-4"></i>
            </div>
          </div>
          <div class="shrink-0 h-12">
            <input type="file" id="file-upload-header" class="hidden" accept=".pdf,.txt,.html,.htm,.pptx,.docx" onchange="handleFileChange(event)">
            <label for="file-upload-header" class="flex items-center justify-center w-12 h-full bg-white dark:bg-[#303134] border border-gray-200 dark:border-gray-600 rounded-full shadow-sm hover:shadow-md cursor-pointer text-gray-500 hover:text-blue-500 transition-colors" title="ファイルを添付">
              <i data-lucide="paperclip" class="h-4 w-4"></i>
            </label>
          </div>
          <button type="submit" id="header-submit-btn" disabled class="h-12 w-full md:w-auto shrink-0 px-4 sm:px-6 bg-blue-600 hover:bg-blue-700 text-white rounded-full text-sm font-medium transition-colors disabled:opacity-50 whitespace-nowrap shadow-sm">
            検索を実行する
          </button>
        </div>
        
        <div id="header-file-display" class="hidden flex items-center space-x-2 text-xs sm:text-sm text-blue-700 dark:text-blue-300 bg-blue-50 dark:bg-blue-900/30 px-3 py-1.5 rounded-full border border-blue-200 dark:border-blue-800 w-fit transition-all mt-1">
          <i data-lucide="file-check" class="h-3 w-3 sm:h-4 sm:w-4"></i>
          <span id="header-file-name" class="truncate max-w-[150px] sm:max-w-xs font-medium"></span>
          <button type="button" onclick="removeFile()" class="text-blue-400 hover:text-blue-700 dark:hover:text-blue-100 ml-1 rounded-full hover:bg-blue-100 dark:hover:bg-blue-800 p-0.5 transition-colors">
            <i data-lucide="x" class="h-3 w-3 sm:h-4 sm:w-4"></i>
          </button>
        </div>
      </form>

      <div class="shrink-0 flex items-center justify-end space-x-2">
        <button onclick="openSettings()" class="p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-[#303134] rounded-full transition-colors" title="設定">
           <i data-lucide="settings" class="h-5 w-5"></i>
        </button>
        <button id="header-saved-btn" onclick="switchView('saved')" class="flex items-center space-x-1.5 px-3 py-2 rounded-lg font-medium text-sm transition-colors text-gray-600 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-[#303134]">
          <i data-lucide="library" class="h-4 w-4"></i>
          <span class="hidden md:inline">保存済みデータ一覧</span>
        </button>
      </div>
    </header>

    <!-- 検索結果メインエリア -->
    <main id="results-main" class="flex-grow p-4 sm:p-6 lg:p-8 max-w-3xl mx-auto w-full">
      <!-- ローディング -->
      <div id="results-loading" class="hidden flex flex-col items-center justify-center py-20 text-gray-500">
        <i data-lucide="loader-2" class="h-8 w-8 animate-spin mb-4 text-blue-500"></i>
        <p>情報の分析と回答を生成中...</p>
      </div>
      
      <!-- エラー -->
      <div id="results-error" class="hidden bg-red-50 border border-red-200 rounded-lg p-6 flex items-start space-x-4">
        <i data-lucide="alert-circle" class="h-6 w-6 text-red-600 shrink-0 mt-0.5"></i>
        <div><h3 class="text-lg font-medium text-red-800 mb-2">エラー</h3><p id="results-error-text" class="text-red-600 whitespace-pre-wrap"></p></div>
      </div>

      <!-- 結果コンテンツ -->
      <div id="results-content" class="hidden space-y-8 animate-in"></div>
    </main>

    <!-- 保存済み一覧エリア -->
    <main id="saved-main" class="hidden flex-grow p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">
      <div class="flex items-center space-x-3 mb-8 text-gray-800 dark:text-gray-100">
        <i data-lucide="library" class="h-8 w-8 text-blue-500"></i>
        <h2 class="text-3xl font-bold">保存済みデータ一覧</h2>
      </div>
      <div id="saved-content"></div>
    </main>

    <!-- アプリ画面用フッター -->
    <footer class="w-full py-6 mt-auto border-t border-gray-200 dark:border-gray-800 bg-[#f8f9fa] dark:bg-[#1a1a1b] text-center text-sm text-gray-500 dark:text-gray-400">
      &copy; 一般社団法人日本みらい研 All Rights Reserved.
    </footer>
  </div>

  <!-- スライドプレビューモーダル -->
  <div id="slide-modal" class="hidden fixed inset-0 z-50 flex flex-col bg-gray-900 backdrop-blur-md animate-in duration-300">
    <div class="flex items-center justify-between p-3 sm:p-4 bg-gray-950 text-white border-b border-gray-800 shadow-xl z-20">
      <div class="flex items-center space-x-3">
        <i data-lucide="presentation" class="h-6 w-6 text-blue-400 hidden sm:block"></i>
        <div>
          <h2 class="text-base sm:text-lg font-semibold leading-tight">スライドプレビュー</h2>
          <p class="text-xs text-gray-400 hidden sm:block">← → キーでページ送り / テキストをクリックして直接編集できます</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2 sm:space-x-4">
        <div class="flex items-center space-x-1 sm:space-x-1.5 mr-1 sm:mr-2 bg-gray-800 px-2 sm:px-3 py-1.5 rounded-lg border border-gray-700 overflow-hidden">
          <i data-lucide="palette" class="h-4 w-4 text-gray-400 hidden lg:block shrink-0 mr-1"></i>
          <div id="theme-selector" class="flex items-center space-x-1.5 overflow-x-auto hide-scrollbar">
            <!-- テーマボタンはJSで生成 -->
          </div>
        </div>

        <button onclick="handleDownloadHTML()" class="flex items-center space-x-1.5 sm:space-x-2 bg-gray-800 hover:bg-gray-700 text-white px-2 sm:px-4 py-2 rounded-md transition-colors text-xs sm:text-sm border border-gray-700" title="印刷用HTMLを保存">
          <i data-lucide="file-code" class="h-4 w-4"></i>
          <span class="hidden sm:inline">HTML</span>
        </button>
        <button onclick="handleDownloadPPTX()" class="flex items-center space-x-1.5 sm:space-x-2 bg-orange-600 hover:bg-orange-700 text-white px-2 sm:px-4 py-2 rounded-md transition-colors text-xs sm:text-sm font-medium shadow-md" title="PowerPointファイルを保存">
          <i data-lucide="download" class="h-4 w-4"></i>
          <span class="hidden sm:inline">PPTX</span>
        </button>
        <button onclick="closeSlideModal()" class="text-gray-400 hover:text-white transition-colors p-1 ml-1 sm:ml-2"><i data-lucide="x-circle" class="h-6 w-6 sm:h-8 sm:w-8"></i></button>
      </div>
    </div>

    <div class="flex-grow w-full relative flex items-center justify-center p-4 sm:p-8 cursor-pointer overflow-hidden" onclick="nextSlide()">
      <button onclick="event.stopPropagation(); prevSlide();" class="absolute left-2 sm:left-8 p-2 sm:p-3 rounded-full bg-black/20 hover:bg-black/40 text-white backdrop-blur-sm z-10 transition-all">
        <i data-lucide="chevron-left" class="h-6 w-6 sm:h-8 sm:w-8"></i>
      </button>

      <!-- スライド描画領域 -->
      <div id="slide-container" class="w-full aspect-video max-w-[calc(100vh*16/9-100px)] max-h-[calc(100vw*9/16)] shadow-2xl relative flex flex-col p-[6%] overflow-hidden rounded-md transition-all duration-500 cursor-default" onclick="event.stopPropagation()">
        <!-- JSで動的にスライド内容を流し込む -->
      </div>

      <button onclick="event.stopPropagation(); nextSlide();" class="absolute right-2 sm:right-8 p-2 sm:p-3 rounded-full bg-black/20 hover:bg-black/40 text-white backdrop-blur-sm z-10 transition-all">
        <i data-lucide="chevron-right" class="h-6 w-6 sm:h-8 sm:w-8"></i>
      </button>
    </div>

    <div class="h-1 bg-gray-800 w-full">
      <div id="slide-progress" class="h-full transition-all duration-300 ease-out"></div>
    </div>
  </div>

  <script>
    // 定数定義
    const CATEGORIES = [
      "外交・安全保障", "国際情勢", "成長戦略", "気候変動・脱炭素", "宇宙産業", "AI・人工知能", "少子高齢化", 
      "SDGs・サステナビリティ", "地方創生", "自動運転・モビリティ", "サイバーセキュリティ", "金融・FinTech",
      "バイオテクノロジー", "IT・テクノロジー", "ビジネス・経済", "政治・社会", "科学・学問", 
      "医療・健康", "教育・学習", "芸術・文化", "歴史・地理", "エンターテインメント", 
      "ライフスタイル", "旅行・観光", "環境・エコ", "法律・法務", "哲学・思想"
    ];

    const slideThemes = [
      { id: 'blue', name: 'ブルー', bg: ['#f8f9fa', '#e9ecef'], text: '#202124', accent: '#1a73e8', subText: '#5f6368' },
      { id: 'green', name: 'グリーン', bg: ['#f4fdf8', '#e6f6ec'], text: '#1b2e22', accent: '#0f9d58', subText: '#4d5156' },
      { id: 'dark', name: 'ダーク', bg: ['#202124', '#303134'], text: '#e8eaed', accent: '#8ab4f8', subText: '#9aa0a6' },
      { id: 'purple', name: 'パープル', bg: ['#fdf8ff', '#f3e8fa'], text: '#2a1b38', accent: '#9333ea', subText: '#6b5a7a' },
      { id: 'orange', name: 'オレンジ', bg: ['#fff8f3', '#faebe1'], text: '#382216', accent: '#ea580c', subText: '#7a5a4a' },
      { id: 'navy-yellow', name: 'ネイビー＆イエロー', bg: ['#0f2027', '#203a43'], text: '#ffffff', accent: '#f2c94c', subText: '#b0bec5' },
      { id: 'pink-blue', name: 'ピンク＆ブルー', bg: ['#ff9a9e', '#fecfef'], text: '#2c3e50', accent: '#3498db', subText: '#34495e' },
      { id: 'black-red', name: 'ブラック＆レッド', bg: ['#121212', '#1a1a1a'], text: '#f5f5f5', accent: '#e50914', subText: '#9e9e9e' },
      { id: 'teal-coral', name: 'ティール＆コーラル', bg: ['#0083b0', '#00b4db'], text: '#ffffff', accent: '#ff7e67', subText: '#e0f7fa' },
      { id: 'mint-choco', name: 'ミント＆チョコ', bg: ['#e0f2f1', '#b2dfdb'], text: '#3e2723', accent: '#d84315', subText: '#5d4037' }
    ];

    const getDomain = (url) => {
      try { return new URL(url).hostname; } catch { return url; }
    };

    // アプリケーションの状態
    let state = {
      apiKey: localStorage.getItem('ai_search_api_key') || '',
      tempApiKey: '',
      query: '',
      searchInput: '',
      selectedCategory: '',
      selectedFile: null,
      results: [],
      aiSummary: '',
      isLoading: false,
      error: null,
      view: 'home', // 'home', 'results', 'saved'
      
      isGeneratingSlide: false,
      slideData: [],
      currentSlideIndex: 0,
      currentThemeId: 'blue',
      
      isElaborating: false,
      savedItems: JSON.parse(localStorage.getItem('ai_search_saved_items')) || []
    };

    // 初期化処理
    function init() {
      // カテゴリセレクトボックスの生成
      const categoryOptions = CATEGORIES.map(cat => `<option value="${cat}">${cat}</option>`).join('');
      document.getElementById('home-category-select').innerHTML += categoryOptions;
      document.getElementById('header-category-select').innerHTML += categoryOptions;

      // テーマセレクタの生成
      const themeSelector = document.getElementById('theme-selector');
      themeSelector.innerHTML = slideThemes.map(t => `
        <button onclick="setTheme('${t.id}')" id="theme-btn-${t.id}" class="w-4 h-4 sm:w-5 sm:h-5 rounded-full border border-gray-500 hover:scale-110 transition-transform shrink-0" style="background: linear-gradient(135deg, ${t.bg[0]} 50%, ${t.accent} 50%)" title="${t.name}"></button>
      `).join('');

      updateView();
      lucide.createIcons();

      // キーボードイベント（スライド用）
      window.addEventListener('keydown', (e) => {
        const slideModal = document.getElementById('slide-modal');
        if (slideModal.classList.contains('hidden') || state.slideData.length === 0 || document.activeElement.isContentEditable) return;
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
      });
    }

    // --- ファイルアップロード ---
    function handleFileChange(e) {
      const file = e.target.files[0];
      if (!file) return;

      // Gemini APIのinlineData上限を考慮し、可能な限り大きな20MBまでに拡張
      const MAX_FILE_SIZE = 20 * 1024 * 1024;
      if (file.size > MAX_FILE_SIZE) {
        alert(`ファイルサイズが大きすぎます。20MB以下のファイルを選択してください。\n(現在のサイズ: ${(file.size / 1024 / 1024).toFixed(1)}MB)`);
        e.target.value = null;
        return;
      }

      const lowerName = file.name.toLowerCase();
      const isTextBased = lowerName.endsWith('.txt') || lowerName.endsWith('.html') || lowerName.endsWith('.htm');
      const isDocx = lowerName.endsWith('.docx');

      if (isDocx) {
        if (!window.mammoth) {
          alert("Wordファイル解析ライブラリが読み込まれていません。通信環境をご確認ください。");
          e.target.value = null;
          return;
        }
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const arrayBuffer = event.target.result;
            // mammoth.jsで.docxからプレーンテキストを抽出
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            state.selectedFile = { name: file.name, type: 'text', data: result.value };
            updateView();
          } catch (err) {
            console.error("Word抽出エラー:", err);
            alert("Wordファイルのテキスト抽出に失敗しました。パスワード保護されているか、ファイルが破損している可能性があります。");
          }
        };
        reader.readAsArrayBuffer(file);
      } else if (isTextBased) {
        const reader = new FileReader();
        reader.onload = (event) => {
          let textData = event.target.result;
          
          // HTMLファイルの場合は、タグやスクリプトを除去して純粋なテキストのみを抽出する
          if (lowerName.endsWith('.html') || lowerName.endsWith('.htm')) {
            try {
              const parser = new DOMParser();
              const doc = parser.parseFromString(textData, 'text/html');
              // 不要な要素（スクリプトやスタイル）を削除
              const scriptsAndStyles = doc.querySelectorAll('script, style, noscript');
              scriptsAndStyles.forEach(el => el.remove());
              textData = doc.body ? doc.body.textContent : textData;
              // 連続する空白や改行を圧縮してトークンを節約
              textData = textData.replace(/\s+/g, ' ').trim();
            } catch (err) {
              console.error("HTMLパースエラー:", err);
              // パース失敗時はそのままのテキストフォールバック
            }
          }
          
          state.selectedFile = { name: file.name, type: 'text', data: textData };
          updateView();
        };
        reader.readAsText(file);
      } else {
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64Data = event.target.result.split(',')[1];
          let mimeType = file.type;
          if (!mimeType) {
            if (lowerName.endsWith('.pdf')) mimeType = 'application/pdf';
            else if (lowerName.endsWith('.pptx')) mimeType = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
          }
          state.selectedFile = { name: file.name, type: 'inline', mimeType: mimeType, data: base64Data };
          updateView();
        };
        reader.readAsDataURL(file);
      }
      
      e.target.value = null;
    }

    function removeFile() {
      state.selectedFile = null;

    }

    // --- API連携 (検索) ---
    async function executeSearch() {
      const baseQuery = typeof state.searchInput === 'string' ? state.searchInput.trim() : '';
      if (!baseQuery && !state.selectedCategory && !state.selectedFile) return;

      if (!state.apiKey) {
        openSettings();
        state.error = "APIキーが設定されていません。設定画面からGemini APIキーを入力してください。";
        updateView();
        return;
      }

      state.isLoading = true;
      state.error = null;
      state.view = 'results';
      updateView();

      let displayQuery = "";
      let promptContext = "";

      if (baseQuery && state.selectedCategory) {
        displayQuery = `${baseQuery} (${state.selectedCategory})`;
        promptContext = `特に「${state.selectedCategory}」の分野・観点から、「${baseQuery}」について、検索した時点での最新の情勢や情報を参照し、詳しく分かりやすい回答を提供してください。`;
      } else if (baseQuery) {
        displayQuery = baseQuery;
        promptContext = `「${baseQuery}」について、検索した時点での最新の情勢や情報を参照し、詳しく分かりやすい回答を提供してください。`;
      } else if (state.selectedCategory) {
        displayQuery = state.selectedCategory;
        promptContext = `「${state.selectedCategory}」の分野における最新の情勢、重要な動向、今後の展望について検索し、詳しく分かりやすい回答を提供してください。`;
      } else if (state.selectedFile) {
        displayQuery = `ファイル分析`;
        promptContext = `添付されたドキュメントの内容を分析し、詳しく分かりやすい要約と解説を提供してください。必要に応じてWEB検索で最新情報も補足してください。`;
      }

      if (state.selectedFile && (baseQuery || state.selectedCategory)) {
        displayQuery += ` 📎 ${state.selectedFile.name}`;
        promptContext = `【添付ファイルあり】添付されたドキュメント（ファイル名: ${state.selectedFile.name}）の内容を詳細に読み込み・分析し、その情報を強く踏まえた上で、` + promptContext;
      }

      state.query = displayQuery;
      state.slideData = [];

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`;
      const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
      
      const parts = [{ 
        text: `現在は${today}です。${promptContext}回答の文体は「だ・である」調（常体）で統一してください。\nまた、回答の最後には必ず「===SOURCES===」という行を追加し、その下に参考にしたWEBサイトのリストを以下の厳密なJSON形式で出力してください。\n[\n  {"title": "記事やページの具体的なタイトル（ドメイン名不可）", "siteName": "サイト名や運営組織名（ドメイン名不可）", "url": "サイトのURL", "description": "サイト内容の詳しい要約"}\n]\n※重要：「title」や「siteName」にはURLやドメイン名（例: jimin.jp）を絶対に書かないでください。必ず実際の日本語の名称を記述してください。` 
      }];

      if (state.selectedFile) {
        if (state.selectedFile.type === 'text') {
          parts.push({ text: `\n\n--- 添付ファイル (${state.selectedFile.name}) の内容 ---\n${state.selectedFile.data}\n--- 添付ファイル終わり ---\n` });
        } else {
          parts.push({ inlineData: { mimeType: state.selectedFile.mimeType, data: state.selectedFile.data } });
        }
      }

      const payload = { contents: [{ role: "user", parts }], tools: [{ google_search: {} }] };

      let retries = 5; let delay = 1000;
      while (retries > 0) {
        try {
          const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!response.ok) {
             const errorText = await response.text();
             if (response.status === 401 || response.status === 403 || response.status === 400) throw new Error(`認証エラー (${response.status}) が発生しました。設定したAPIキーが正しくないか、無効になっています。右上の設定から確認してください。`);
             if (response.status === 404) throw new Error(`モデルが見つかりません (${response.status})。APIのバージョンまたはモデル名が正しくありません。`);
             if (response.status === 429) throw new Error(`APIの利用制限（Quota exceeded）に達しました。しばらく時間をおいてから再度お試しいただくか、APIキーのプランをご確認ください。`);
             throw new Error(`API error: ${response.status} - ${errorText}`);
          }
          const data = await response.json();
          if (!data || !data.candidates || data.candidates.length === 0) throw new Error("No candidates in response");
          
          const candidate = data.candidates[0];
          const rawText = candidate?.content?.parts?.[0]?.text || "（回答の生成に失敗しました）";
          let summaryText = rawText;
          let sourceDescriptions = {};
          let sourceTitles = {};
          let sourceSiteNames = {};

          const sourcesMarker = "===SOURCES===";
          if (rawText.includes(sourcesMarker)) {
            const partsArray = rawText.split(sourcesMarker);
            summaryText = partsArray[0].trim();
            // Markdownブロック等が混入してパースエラーになるのを防ぐ
            let jsonRaw = partsArray[1].replace(/```json/gi, '').replace(/```/gi, '');
            const jsonStr = jsonRaw.match(/\[[\s\S]*\]/);
            if (jsonStr) {
              try {
                const sourcesJson = JSON.parse(jsonStr[0]);
                if (Array.isArray(sourcesJson)) {
                  sourcesJson.forEach(item => {
                    if (item.url) {
                      const cleanUrl = item.url.trim().replace(/\/$/, '');
                      if (item.description) sourceDescriptions[cleanUrl] = item.description;
                      if (item.title) sourceTitles[cleanUrl] = item.title;
                      if (item.siteName) sourceSiteNames[cleanUrl] = item.siteName;
                    }
                  });
                }
              } catch(e) { console.error("JSON parse error:", e); }
            }
          }

          const chunks = candidate.groundingMetadata?.groundingChunks || [];
          const attributions = candidate.groundingMetadata?.groundingAttributions || [];
          
          const uniqueSources = []; const seenUrls = new Set();
          
          const processSource = (uri, chunkTitle) => {
            if (uri && !seenUrls.has(uri)) {
              seenUrls.add(uri); 
              const cleanUrl = uri.trim().replace(/\/$/, '');
              let desc = sourceDescriptions[cleanUrl];
              let aiTitle = sourceTitles[cleanUrl];
              let aiSiteName = sourceSiteNames[cleanUrl];
              
              if (!desc || !aiTitle || !aiSiteName) {
                const domain = getDomain(uri);
                const matchUrl = Object.keys(sourceDescriptions).find(k => getDomain(k) === domain);
                if (matchUrl) {
                  if (!desc) desc = sourceDescriptions[matchUrl];
                  if (!aiTitle) aiTitle = sourceTitles[matchUrl];
                  if (!aiSiteName) aiSiteName = sourceSiteNames[matchUrl];
                }
              }
              
              if (!desc) desc = "このサイトの詳しい情報はリンク先をご覧ください。";
              
              // ドメイン名やURLそのものがタイトルになっているか判定
              const isBadTitle = (t) => !t || t.toLowerCase() === getDomain(uri).toLowerCase() || t.toLowerCase().startsWith("http");
              
              let finalTitle = "参考ウェブサイト";
              if (chunkTitle && !isBadTitle(chunkTitle)) {
                finalTitle = chunkTitle; // 1. Search Groundingの公式タイトルを最優先
              } else if (aiTitle && !isBadTitle(aiTitle)) {
                finalTitle = aiTitle; // 2. AIが生成したタイトル
              } else if (chunkTitle) {
                finalTitle = chunkTitle; // 3. 妥協してそのまま使用
              } else if (aiTitle) {
                finalTitle = aiTitle;
              }

              let finalSiteName = aiSiteName && !isBadTitle(aiSiteName) ? aiSiteName : "";
              
              uniqueSources.push({ title: finalTitle, siteName: finalSiteName, url: uri, description: desc });
            }
          };

          for (const chunk of chunks) processSource(chunk.web?.uri, chunk.web?.title);
          if (uniqueSources.length === 0) {
            for (const attr of attributions) processSource(attr.web?.uri, attr.web?.title);
          }

          state.aiSummary = summaryText; 
          state.results = uniqueSources; 
          state.isLoading = false; 
          updateView();
          return; 
        } catch (err) {
          if (err.message.includes("認証エラー") || err.message.includes("モデルが見つかりません")) {
              state.error = err.message;
              state.isLoading = false;
              updateView();
              if(err.message.includes("認証エラー")) openSettings();
              return;
          }
          retries--;
          if (retries === 0) { 
            console.error("Search API Error:", err);
            state.error = err.message.includes("利用制限") ? err.message : `情報の取得・分析に失敗しました。時間をおいて再度お試しいただくか、ファイルサイズ等をご確認ください。\n詳細: ${err.message}`; 
            state.isLoading = false; 
            updateView();
          } else { 
            await new Promise(r => setTimeout(r, delay)); delay *= 2; 
          }
        }
      }
    }

      const newItem = {

    async function handleExportWord() {
      if (!state.aiSummary) return;

      const btn = document.getElementById('btn-export-word');
      const originalHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.innerHTML = `<i data-lucide="loader-2" class="h-4 w-4 animate-spin"></i><span class="font-medium">生成中...</span>`;
        lucide.createIcons({ root: btn });
        btn.disabled = true;
      }

      try {
        // 複数のCDNを順番に試行してライブラリを確実に読み込む
        const loadDocxScript = async () => {
          if (window.docx) return;
          const cdns = [
            "https://unpkg.com/docx@8.5.0/build/index.js",
            "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js",
            "https://unpkg.com/docx@7.8.2/build/index.js"
          ];
          for (const url of cdns) {
            try {
              await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = () => {
                  if (window.docx) resolve();
                  else reject(new Error("No window.docx"));
                };
                script.onerror = reject;
                document.body.appendChild(script);
              });
              return; // 読み込み成功
            } catch (e) {
              console.warn(`Failed to load docx from ${url}`);
            }
          }
          throw new Error("すべてのサーバーからのライブラリ読み込みに失敗しました。通信環境をご確認ください。");
        };

        await loadDocxScript();

        const includeSources = document.getElementById('report-include-sources')?.checked ?? true;
        const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = window.docx;
        
        const summaryParagraphs = [];
        const lines = state.aiSummary.split('\n');
        
        for (const line of lines) {
          if (!line.trim()) {
             summaryParagraphs.push(new Paragraph({ text: "", spacing: { after: 200 } }));
             continue;
          }

          if (line.startsWith('### ')) {
             summaryParagraphs.push(new Paragraph({
               text: line.substring(4),
               heading: HeadingLevel.HEADING_3,
               spacing: { before: 240, after: 120 }
             }));
          } else if (line.startsWith('## ')) {
             summaryParagraphs.push(new Paragraph({
               text: line.substring(3),
               heading: HeadingLevel.HEADING_2,
               spacing: { before: 360, after: 120 }
             }));
          } else if (line.startsWith('# ')) {
             summaryParagraphs.push(new Paragraph({
               text: line.substring(2),
               heading: HeadingLevel.HEADING_1,
               spacing: { before: 480, after: 120 }
             }));
          } else {
             const runs = [];
             const parts = line.split(/(\*\*.*?\*\*)/g);
             for (const part of parts) {
               if (part.startsWith('**') && part.endsWith('**')) {
                 runs.push(new TextRun({ text: part.substring(2, part.length - 2), bold: true }));
               } else if (part) {
                 runs.push(new TextRun({ text: part }));
               }
             }
             summaryParagraphs.push(new Paragraph({ children: runs, spacing: { after: 120 } }));
          }
        }

        const docChildren = [
          new Paragraph({
            text: state.query,
            heading: HeadingLevel.TITLE,
            alignment: AlignmentType.CENTER,
            spacing: { after: 400 }
          }),
          new Paragraph({
            children: [
              new TextRun({
                  text: `作成日時: ${new Date().toLocaleString('ja-JP')}`,
                  color: "6b7280"
              })
            ],
            alignment: AlignmentType.RIGHT,
            spacing: { after: 400 }
          }),
          new Paragraph({
            text: "分析結果のレポート",
            heading: HeadingLevel.HEADING_1,
            spacing: { after: 200 }
          }),
          ...summaryParagraphs
        ];

        if (includeSources && state.results && state.results.length > 0) {
          docChildren.push(
            new Paragraph({
              text: "参考としたWEBサイト一覧",
              heading: HeadingLevel.HEADING_1,
              spacing: { before: 400, after: 200 }
            })
          );

          state.results.forEach((r, i) => {
            docChildren.push(
               new Paragraph({
                 text: `[${i + 1}] ${r.title}`,
                 heading: HeadingLevel.HEADING_3,
                 spacing: { before: 200, after: 50 }
               })
            );
            
            if (r.siteName) {
               docChildren.push(new Paragraph({ text: `サイト名: ${r.siteName}`, spacing: { after: 50 } }));
            }

            // エラーを回避するため、URLは通常のテキスト(青色・下線)として挿入
            docChildren.push(new Paragraph({
                children: [
                  new TextRun({
                      text: r.url,
                      color: "1a0dab",
                      underline: {}
                  })
                ],
                spacing: { after: 50 }
            }));

            if (r.description) {
               docChildren.push(new Paragraph({ text: r.description, spacing: { after: 150 } }));
            }
          });
        }

        const doc = new Document({
          styles: {
              default: {
                  document: {
                      run: {
                          font: "Yu Gothic",
                      },
                  },
              },
          },
          sections: [{
            properties: {},
            children: docChildren,
          }]
        });

        const blob = await Packer.toBlob(doc);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${state.query.replace(/[\\/:*?"<>|]/g, '_')}_レポート.docx`;
        a.click();
        URL.revokeObjectURL(url);

      } catch (err) {
        console.error("Word Export Error:", err);
        alert("Wordファイルの生成中にエラーが発生しました: " + err.message);
      } finally {
        if (btn) {
          btn.innerHTML = originalHtml;
          btn.disabled = false;
          lucide.createIcons({ root: btn });
        }
      }
    }

      let formattedSummary = state.aiSummary
        .replace(/\*\*(.*?)\*\*/g, `<strong>$1</strong>`)
        .replace(/### (.*)/g, `<h4 style="margin-top: 1.5em; margin-bottom: 0.5em; color: ${t.textBold};">$1</h4>`)
        .replace(/## (.*)/g, `<h3 style="margin-top: 1.5em; margin-bottom: 0.5em; color: ${t.textBold}; border-bottom: 1px solid ${t.border}; padding-bottom: 0.3em;">$1</h3>`)
        .replace(/# (.*)/g, `<h2 style="margin-top: 1.5em; margin-bottom: 0.5em; color: ${t.textBold};">$1</h2>`);

      let htmlContent = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${state.query} - 調査レポート</title>
<style>
  body { font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; line-height: 1.6; color: ${t.text}; max-width: 800px; margin: 0 auto; padding: 20px; background-color: ${t.bg}; }
  .container { background-color: ${t.container}; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
  h1 { color: ${t.accent}; border-bottom: 3px solid ${t.accent}; padding-bottom: 10px; margin-top: 0; }
  .meta { color: ${t.textMuted}; font-size: 0.9em; margin-bottom: 30px; text-align: right; }
  .section-title { color: ${t.textBold}; margin-top: 40px; border-bottom: 2px solid ${t.border}; padding-bottom: 8px; font-size: 1.5em; }
  .summary { white-space: pre-wrap; margin-bottom: 30px; line-height: 1.8; color: ${t.text}; }
  .summary strong { color: ${t.textBold}; }
  .source-item { margin-bottom: 20px; padding: 20px; border: 1px solid ${t.border}; border-radius: 8px; background-color: ${t.sourceBg}; page-break-inside: avoid; }
  .source-title { font-weight: bold; color: ${t.accent}; text-decoration: none; font-size: 1.1em; display: block; margin-bottom: 5px; }
  .source-title:hover { text-decoration: underline; opacity: 0.8; }
  .source-url { color: ${t.textMuted}; font-size: 0.85em; margin-bottom: 10px; word-break: break-all; }
  .source-desc { font-size: 0.95em; color: ${t.text}; margin-top: 5px; line-height: 1.5; }
  .print-btn-container { text-align: right; margin-bottom: 20px; position: sticky; top: 20px; z-index: 100; }
  .print-btn { background-color: ${t.accent}; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; }
  .print-btn:hover { filter: brightness(0.9); transform: translateY(-1px); }
  @media print {
    body { background-color: white; padding: 0; color: black; }
    .container { box-shadow: none; padding: 0; background-color: white; }
    h1, .source-title { color: ${t.accent !== '#60a5fa' ? t.accent : '#1d4ed8'}; } /* ダークモード時の印刷用フォールバック調整 */
    .print-btn-container { display: none; }
    .summary, .source-desc { color: black; }
  }
</style>
</head>
<body>
  <div class="print-btn-container">
    <button class="print-btn" onclick="window.print()">📄 PDFで保存 / 印刷する</button>
  </div>
  <div class="container">
    <h1>${state.query}</h1>
    <div class="meta">作成日時: ${new Date().toLocaleString('ja-JP')}</div>
    
    <h2 class="section-title">分析結果のレポート</h2>
    <div class="summary">${formattedSummary}</div>
`;

      if (includeSources && state.results && state.results.length > 0) {
        htmlContent += `<h2 class="section-title">参考としたWEBサイト一覧</h2>`;
        state.results.forEach((r, i) => { 
          htmlContent += `
          <div class="source-item">
            <a href="${r.url}" target="_blank" class="source-title">[${i + 1}] ${r.title}</a>
            <div class="source-url">${r.siteName ? `${r.siteName} - ` : ''}${r.url}</div>
            ${r.description ? `<div class="source-desc">${r.description}</div>` : ''}
          </div>`;
        });
      }

      htmlContent += `
  </div>
</body>
</html>`;

      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.query.replace(/[\\/:*?"<>|]/g, '_')}_レポート.html`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function handleDeleteSavedItem(id, e) {
      e.stopPropagation();
      if(window.confirm("この保存済み回答を削除してもよろしいですか？")) {
        state.savedItems = state.savedItems.filter(item => item.id !== id);
        localStorage.setItem('ai_search_saved_items', JSON.stringify(state.savedItems));
        updateView();
      }
    }

    function loadSavedItem(id) {
      const item = state.savedItems.find(i => i.id === id);
      if(!item) return;
      state.query = item.query;
      state.searchInput = item.rawQuery || '';
      state.selectedCategory = item.category || '';
      state.selectedFile = null;
      state.aiSummary = item.aiSummary;
      state.results = item.results;
      state.view = 'results';
      state.slideData = [];
      state.error = null;
      updateView();
    }

    // --- スライド生成機能 ---
    async function generateSlide() {
      state.isGeneratingSlide = true;
      updateView();
      
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${state.apiKey}`;
      const prompt = `以下のテーマと内容をもとに、プレゼンテーション用スライドの構成を作成し、必ず有効なJSON形式で出力してください。\n\nテーマ: ${state.query}\n内容: ${state.aiSummary}\n\n【厳格な要件】\n1. JSONのルートは "slides" というキーを持つオブジェクトにしてください。\n2. "slides" の値は配列とし、各要素が1ページ分のスライドを表します。\n3. 各スライドオブジェクトは "title" (文字列) と "content" (文字列の配列。1要素が1つの箇条書き項目) を持ってください。\n4. 1ページ目はタイトルスライドとしてください ("content" にはテーマの説明を短い1文で入れてください)。\n5. 2ページ目以降は詳細な内容をバランスよく分割して配置してください（1スライドにつき箇条書きは3〜4つまで）。\n6. 情報は省略せず全て網羅してください。\n7. スライド内のテキスト（タイトル、概要、箇条書きの各項目）は、すべて「だ・である」調（常体）で統一して簡潔にまとめてください。\n8. 返却するのはJSONデータのみです。Markdownのブロック記法（\`\`\`json など）は絶対に含めず、純粋なJSON文字列だけを出力してください。`;

      const payload = { contents: [{ parts: [{ text: prompt }] }] };

      let retries = 5; let delay = 1000;
      while (retries > 0) {
        try {
          const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!response.ok) {
             if (response.status === 401 || response.status === 403 || response.status === 400) throw new Error(`認証エラー (${response.status})。APIキーを確認してください。`);
             if (response.status === 404) throw new Error(`モデルが見つかりません (${response.status})。APIのバージョンまたはモデル名が正しくありません。`);
             if (response.status === 429) throw new Error(`APIの利用制限（Quota exceeded）に達しました。時間をおいて再度お試しください。`);
             throw new Error("生成失敗");
          }
          const data = await response.json();
          let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
          const parsedData = JSON.parse(rawText);
          
          if (parsedData && parsedData.slides) {
            state.slideData = parsedData.slides;
            state.currentSlideIndex = 0;
            state.isGeneratingSlide = false;
            updateView();
            openSlideModal();
            return;
          } else {
            throw new Error("正しい形式ではありませんでした。");
          }
        } catch (err) {
          if (err.message.includes("認証エラー") || err.message.includes("モデルが見つかりません")) {
            alert(err.message);
            if (err.message.includes("認証エラー")) openSettings();
            state.isGeneratingSlide = false;
            updateView();
            return;
          }
          retries--;
          if (retries === 0) {
            console.error("Slide Generation Error:", err);
            alert(err.message.includes("利用制限") ? err.message : "スライドの生成中にエラーが発生しました。");
            state.isGeneratingSlide = false;
            updateView();
            return;
          } else {
            await new Promise(r => setTimeout(r, delay)); delay *= 2;
          }
        }
      }
    }

    function openSlideModal() {
      document.getElementById('slide-modal').classList.remove('hidden');
      renderSlide();
    }

    function closeSlideModal() {
      document.getElementById('slide-modal').classList.add('hidden');
    }

    function setTheme(themeId) {
      state.currentThemeId = themeId;
      
      // ボタンのハイライト更新
      slideThemes.forEach(t => {
        const btn = document.getElementById(`theme-btn-${t.id}`);
        if(t.id === themeId) {
          btn.classList.add('scale-125', 'border-white', 'ring-1', 'ring-white');
          btn.classList.remove('border-gray-500', 'hover:scale-110');
        } else {
          btn.classList.remove('scale-125', 'border-white', 'ring-1', 'ring-white');
          btn.classList.add('border-gray-500', 'hover:scale-110');
        }
      });
      renderSlide();
    }

    function renderSlide() {
      if (state.slideData.length === 0) return;
      
      const theme = slideThemes.find(t => t.id === state.currentThemeId) || slideThemes[0];
      const slide = state.slideData[state.currentSlideIndex];
      const container = document.getElementById('slide-container');
      const isTitle = state.currentSlideIndex === 0;

      container.style.background = `linear-gradient(135deg, ${theme.bg[0]} 0%, ${theme.bg[1]} 100%)`;

      let innerHtml = '';
      if (isTitle) {
        innerHtml = `
          <div class="flex-grow flex flex-col items-center justify-center text-center animate-in duration-500">
            <h1 contenteditable="true" onblur="handleSlideTitleChange(${state.currentSlideIndex}, this)" onkeydown="handleKeyDownOnEditable(event)" class="text-[5cqw] font-extrabold leading-tight mb-[3cqw] tracking-tight transition-colors duration-500 cursor-text hover:bg-black/5 focus:bg-black/5 focus:outline-none rounded px-2" style="color: ${theme.accent}">${slide.title}</h1>
            <div class="w-24 h-1.5 mb-[4cqw] rounded-full transition-colors duration-500" style="background-color: ${theme.accent}"></div>
            <p contenteditable="true" onblur="handleSlideTitleContentChange(${state.currentSlideIndex}, this)" onkeydown="handleKeyDownOnEditable(event)" class="text-[2.2cqw] leading-relaxed max-w-[80%] font-medium transition-colors duration-500 cursor-text hover:bg-black/5 focus:bg-black/5 focus:outline-none rounded px-2" style="color: ${theme.subText}">${slide.content.join(" ")}</p>
          </div>
        `;
      } else {
        const listItems = slide.content.map((text, i) => `
          <li contenteditable="true" onblur="handleSlideListContentChange(${state.currentSlideIndex}, ${i}, this)" onkeydown="handleKeyDownOnEditable(event)" class="cursor-text hover:bg-black/5 focus:bg-black/5 focus:outline-none rounded px-1 -ml-1">${text}</li>
        `).join('');

        innerHtml = `
          <div class="flex-grow flex flex-col animate-in duration-500">
            <h2 contenteditable="true" onblur="handleSlideTitleChange(${state.currentSlideIndex}, this)" onkeydown="handleKeyDownOnEditable(event)" class="text-[3.5cqw] font-bold border-b-[3px] pb-[1cqw] mb-[3cqw] transition-colors duration-500 cursor-text hover:bg-black/5 focus:bg-black/5 focus:outline-none rounded px-2" style="color: ${theme.accent}; border-bottom-color: ${theme.accent}">${slide.title}</h2>
            <ul class="text-[2.2cqw] leading-[1.8] list-disc ml-[3cqw] space-y-[1.5cqw] font-medium transition-colors duration-500" style="color: ${theme.text}">${listItems}</ul>
          </div>
        `;
      }

      innerHtml += `
        <div class="absolute bottom-[3cqw] left-[4cqw] text-[1.5cqw] font-bold transition-colors duration-500" style="color: ${theme.subText}">${state.currentSlideIndex + 1} / ${state.slideData.length}</div>
        <div class="absolute bottom-[3cqw] right-[4cqw] text-[1.2cqw] transition-colors duration-500" style="color: ${theme.subText}">AI Generated</div>
      `;

      container.innerHTML = innerHtml;

      // プログレスバー更新
      const progress = document.getElementById('slide-progress');
      progress.style.width = `${((state.currentSlideIndex + 1) / state.slideData.length) * 100}%`;
      progress.style.backgroundColor = theme.accent;
    }

    function nextSlide() {
      if(state.slideData.length === 0) return;
      state.currentSlideIndex = (state.currentSlideIndex + 1) % state.slideData.length;
      renderSlide();
    }

    function prevSlide() {
      if(state.slideData.length === 0) return;
      state.currentSlideIndex = (state.currentSlideIndex - 1 + state.slideData.length) % state.slideData.length;
      renderSlide();
    }

    // スライド内テキスト編集
    window.handleSlideTitleChange = function(index, el) { state.slideData[index].title = el.innerText; };
    window.handleSlideTitleContentChange = function(index, el) { state.slideData[index].content = [el.innerText]; };
    window.handleSlideListContentChange = function(slideIndex, listIndex, el) { state.slideData[slideIndex].content[listIndex] = el.innerText; };
    window.handleKeyDownOnEditable = function(e) {
      if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
    };

    // --- ダウンロード ---
    function handleDownloadHTML() {
      if (state.slideData.length === 0) return;
      const theme = slideThemes.find(t => t.id === state.currentThemeId) || slideThemes[0];

      let htmlStr = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${state.query} - スライド資料</title>
<style>
  body { margin: 0; padding: 2vw; font-family: 'Helvetica Neue', Arial, sans-serif; background: #e9ecef; color: ${theme.text}; display: flex; flex-direction: column; align-items: center; gap: 3vw; }
  .container-query { container-type: inline-size; width: 100%; max-width: 1200px; }
  .slide-container { width: 100%; aspect-ratio: 16 / 9; background: linear-gradient(135deg, ${theme.bg[0]} 0%, ${theme.bg[1]} 100%); position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; padding: 6cqw; box-sizing: border-box; justify-content: flex-start; }
  .title-slide { justify-content: center; align-items: center; text-align: center; }
  .title { font-size: 3.5cqw; color: ${theme.accent}; margin-bottom: 3cqw; font-weight: bold; border-bottom: 2px solid ${theme.accent}; padding-bottom: 1cqw; }
  .title-slide .title { font-size: 5cqw; border-bottom: none; margin-bottom: 2cqw; }
  .title-slide .content-text { font-size: 2cqw; color: ${theme.subText}; }
  .content { font-size: 2.2cqw; color: ${theme.text}; line-height: 1.8; margin-left: 2cqw; }
  .content li { margin-bottom: 1.5cqw; }
  .page-num { position: absolute; bottom: 2cqw; left: 2cqw; font-size: 1.2cqw; color: ${theme.subText}; font-weight: bold; }
  .print-btn-container { width: 100%; max-width: 1200px; display: flex; justify-content: flex-end; margin-bottom: -1vw; }
  .print-btn { padding: 12px 24px; background: ${theme.accent}; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
  .print-btn:hover { opacity: 0.9; transform: translateY(-2px); }
  @media print {
    @page { size: 16in 9in; margin: 0; }
    body { background: white; padding: 0; gap: 0; display: block; }
    .print-btn-container { display: none; }
    .container-query { max-width: none; page-break-after: always; page-break-inside: avoid; margin-bottom: 0; }
    .slide-container { box-shadow: none; border-radius: 0; width: 100vw; height: 56.25vw; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="print-btn-container"><button class="print-btn" onclick="window.print()">この資料をPDFで保存・印刷</button></div>
`;
      state.slideData.forEach((slide, idx) => {
        const isTitleSlide = idx === 0;
        htmlStr += `<div class="container-query"><div class="slide-container ${isTitleSlide ? 'title-slide' : ''}"><div class="title">${slide.title}</div>\n`;
        if (isTitleSlide) htmlStr += `    <div class="content-text">${slide.content.join('<br>')}</div>\n`;
        else htmlStr += `    <ul class="content">\n${slide.content.map(c => `      <li>${c}</li>`).join('\n')}\n    </ul>\n`;
        htmlStr += `    <div class="page-num">${idx + 1} / ${state.slideData.length}</div></div></div>\n`;
      });
      htmlStr += `</body></html>`;

      const blob = new Blob([htmlStr], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.query.replace(/[\\/:*?"<>|]/g, '_')}_スライド資料.html`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function handleDownloadPPTX() {
      if (state.slideData.length === 0) return;
      const theme = slideThemes.find(t => t.id === state.currentThemeId) || slideThemes[0];
      const hexToPptx = (hex) => hex.replace('#', '').toUpperCase();
      
      const loadScript = (src) => {
        return new Promise((resolve, reject) => {
          if (window.PptxGenJS) return resolve();
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      };

      try {
        await loadScript("https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js");
        const pptx = new window.PptxGenJS();
        pptx.layout = 'LAYOUT_16x9';

        state.slideData.forEach((slide, idx) => {
          const slidePptx = pptx.addSlide();
          slidePptx.background = { color: hexToPptx(theme.bg[0]) };

          if (idx === 0) {
            slidePptx.addText(slide.title, { x: 0.5, y: 2.0, w: "90%", fontSize: 44, bold: true, color: hexToPptx(theme.accent), align: "center" });
            if (slide.content.length > 0) slidePptx.addText(slide.content.join("\n"), { x: 0.5, y: 3.5, w: "90%", fontSize: 24, color: hexToPptx(theme.subText), align: "center" });
          } else {
            slidePptx.addText(slide.title, { x: 0.5, y: 0.5, w: "90%", h: 0.8, fontSize: 32, bold: true, color: hexToPptx(theme.accent), align: "left" });
            slidePptx.addShape(pptx.ShapeType.line, { x: 0.5, y: 1.3, w: "90%", h: 0, line: { color: hexToPptx(theme.accent), width: 2 } });
            if (slide.content.length > 0) {
              const bullets = slide.content.map(text => ({ text, options: { bullet: true, breakLine: true } }));
              slidePptx.addText(bullets, { x: 0.5, y: 1.6, w: "90%", h: 5.0, fontSize: 24, color: hexToPptx(theme.text), align: "left", valign: "top", lineSpacing: 35 });
            }
          }
          slidePptx.addText(`${idx + 1} / ${state.slideData.length}`, { x: 0.5, y: 6.8, w: "90%", fontSize: 12, color: hexToPptx(theme.subText), align: "right" });
        });

        pptx.writeFile({ fileName: `${state.query.replace(/[\\/:*?"<>|]/g, '_')}_slide.pptx` });
      } catch (error) {
        alert("PPTXの生成に失敗しました。ネットワーク環境を確認してください。");
        console.error(error);
      }
    }

    // 初期化実行
    window.addEventListener('DOMContentLoaded', init);

  </script>
</body>
</html>
