<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Margin Cleaner - Ultra Precision</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cropper.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <!-- pdf-lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <style>
        :root {
            --sidebar-bg: #ffffff;
            --main-bg: #f1f5f9;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --success: #10b981;
        }

        .cropper-container {
            max-height: calc(100vh - 140px);
            width: 100%;
        }
        
        #thumbnailSidebar::-webkit-scrollbar {
            width: 6px;
        }
        #thumbnailSidebar::-webkit-scrollbar-track { background: transparent; }
        #thumbnailSidebar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .thumbnail-item {
            margin-bottom: 4rem; /* ページ間隔をさらに広く確保 */
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .active-page {
            outline: 5px solid var(--accent);
            outline-offset: 4px;
            background-color: #f8fafc;
            transform: scale(1.02);
        }

        .btn-action {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }
        .btn-action:active:not(:disabled) {
            transform: translateY(0);
            filter: brightness(0.95);
        }

        #toastContainer {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-animate { animation: slideIn 0.3s ease forwards; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen text-slate-600 font-medium selection:bg-indigo-100 overflow-hidden">

    <div id="toastContainer"></div>

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 p-4 flex justify-between items-center z-30 shadow-sm px-8">
        <div class="flex items-center gap-4">
            <div class="bg-slate-800 p-2 rounded-xl shadow-sm">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-extrabold text-slate-800 tracking-tighter uppercase leading-none">Margin Cleaner <span class="text-indigo-600">Ultra</span></h1>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Professional Document Workflow</p>
            </div>
        </div>
        <div class="flex items-center gap-6 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span> Privacy Guard Active</span>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <!-- 左パネル -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col z-20 overflow-y-auto">
            <div class="p-8 flex flex-col gap-12">
                
                <!-- 1. ファイル -->
                <section>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">01. Import</label>
                    <div class="relative">
                        <input type="file" id="fileInput" accept="image/png, image/jpeg, application/pdf" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-slate-100 file:text-slate-600 hover:file:bg-indigo-50 hover:file:text-indigo-600 cursor-pointer transition-all border border-slate-100 rounded-xl" />
                    </div>
                </section>

                <!-- 2. ナビゲーション -->
                <section id="pdfControls" class="hidden">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">02. Navigation</label>
                    <div class="flex items-center justify-between bg-slate-50 p-2 rounded-2xl border border-slate-200 shadow-inner">
                        <button id="prevPage" class="p-3 hover:bg-white hover:text-indigo-600 rounded-xl transition-all disabled:opacity-20">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <span id="pageInfo" class="text-xs font-black text-slate-800 tracking-tight italic">PAGE 1 / 1</span>
                        <button id="nextPage" class="p-3 hover:bg-white hover:text-indigo-600 rounded-xl transition-all disabled:opacity-20">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </section>

                <!-- 3. メインアクション -->
                <section>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">03. Smart Cleanup</label>
                    <button id="autoCropBtn" class="btn-action w-full flex flex-col items-center justify-center gap-1 px-4 py-8 bg-indigo-600 text-white rounded-[2rem] shadow-xl shadow-indigo-100 disabled:grayscale disabled:opacity-30 disabled:shadow-none" disabled title="1回目で枠を検知、2回目で保存します">
                        <div id="btnIconContainer">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <span id="btnMainText" class="font-bold text-sm tracking-tight">AUTO CLEANUP</span>
                        <span id="btnSubText" class="text-[9px] font-bold opacity-70">黒余白の自動検知を実行</span>
                    </button>
                    <div id="stepInfo" class="mt-4 text-[10px] text-center font-bold text-indigo-500 bg-indigo-50 p-3 rounded-2xl hidden animate-pulse">
                        枠を確認・調整し、もう一度ボタンを押して保存を完了してください。
                    </div>
                </section>

                <!-- 4. 回転・微調整 -->
                <section>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">04. Adjust Frame</label>
                    <div class="grid grid-cols-2 gap-4">
                        <button id="rotateLeftBtn" class="btn-action p-4 bg-slate-50 border border-slate-200 rounded-2xl hover:bg-white hover:border-indigo-200 text-slate-400 hover:text-indigo-600 disabled:opacity-50" disabled>
                            <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        </button>
                        <button id="rotateRightBtn" class="btn-action p-4 bg-slate-50 border border-slate-200 rounded-2xl hover:bg-white hover:border-indigo-200 text-slate-400 hover:text-indigo-600 disabled:opacity-50" disabled>
                            <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transform: scaleX(-1);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        </button>
                    </div>
                </section>

            </div>

            <!-- フッター操作 -->
            <div class="mt-auto p-8 border-t border-slate-100 bg-slate-50/50 flex flex-col gap-5">
                <div id="pageRotationControls" class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm hidden">
                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3 text-center">PDF Rotate Settings</p>
                    <select id="rotateTargetSelect" class="w-full text-[10px] font-bold border-none bg-slate-100 rounded-xl p-3 mb-3 outline-none focus:ring-2 ring-indigo-500 appearance-none text-center">
                        <option value="current">表示中のページ</option>
                        <option value="all">全てのページ</option>
                        <option value="landscape">横向きのみ</option>
                        <option value="portrait">縦向きのみ</option>
                    </select>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="rotatePage90Btn" class="btn-action py-2.5 bg-slate-800 text-white rounded-xl text-[10px] font-black tracking-widest">90°</button>
                        <button id="rotatePage180Btn" class="btn-action py-2.5 bg-slate-800 text-white rounded-xl text-[10px] font-black tracking-widest">180°</button>
                    </div>
                </div>

                <button id="undoBtn" class="btn-action w-full py-3 bg-white border border-slate-200 text-slate-400 font-bold text-[10px] rounded-2xl hover:bg-slate-50 disabled:opacity-30 uppercase tracking-widest hidden">
                    Undo
                </button>

                <button id="downloadFinalPdfBtn" class="btn-action w-full py-5 bg-slate-900 text-white font-black text-base rounded-[2rem] shadow-xl hover:bg-black transition-all hidden disabled:opacity-50">
                    PDFをダウンロード
                </button>
            </div>
        </aside>

        <!-- メイン・ワークスペース -->
        <div id="mainWorkspace" class="flex-1 flex overflow-hidden bg-slate-100 relative">
            
            <!-- サムネイル (広い間隔) -->
            <aside id="thumbnailSidebar" class="w-64 bg-white border-r border-slate-200 overflow-y-auto hidden flex-col p-10 gap-0 shadow-inner z-20"></aside>
            
            <!-- プレビュー表示 -->
            <section id="previewSection" class="flex-1 flex items-center justify-center p-12 relative overflow-hidden">
                <!-- ローディング -->
                <div id="loading" class="hidden absolute inset-0 bg-white/90 z-50 flex flex-col items-center justify-center backdrop-blur-sm transition-all">
                    <div class="w-10 h-10 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin"></div>
                    <p class="text-slate-400 font-black text-[10px] mt-4 uppercase tracking-[0.3em]" id="loadingText">Processing</p>
                </div>
                
                <div class="w-full h-full flex items-center justify-center relative">
                    <img id="imagePreview" src="" alt="Preview" class="hidden max-w-full max-h-full shadow-[0_40px_80px_-20px_rgba(0,0,0,0.3)] bg-white border border-slate-200" />
                    
                    <div id="placeholder" class="text-slate-400 flex flex-col items-center justify-center border-2 border-dashed border-slate-200 hover:border-indigo-300 hover:bg-white transition-all rounded-[4rem] p-24 w-full max-w-2xl cursor-pointer bg-slate-50/50 group">
                        <div class="bg-indigo-600 text-white rounded-[2rem] p-6 mb-10 shadow-xl group-hover:scale-110 transition-transform duration-500">
                            <svg class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        </div>
                        <p class="text-3xl font-black text-slate-800 mb-3 tracking-tighter">DROP PDF HERE</p>
                        <p class="text-sm font-bold opacity-40 uppercase tracking-[0.2em]">または クリックして読み込む</p>
                        <input type="file" id="previewFileInput" accept="image/png, image/jpeg, application/pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const getById = (id) => document.getElementById(id);
        const els = {
            fileInput: getById('fileInput'),
            previewFileInput: getById('previewFileInput'),
            mainWorkspace: getById('mainWorkspace'),
            thumbnailSidebar: getById('thumbnailSidebar'),
            pdfControls: getById('pdfControls'),
            prevPage: getById('prevPage'),
            nextPage: getById('nextPage'),
            pageInfo: getById('pageInfo'),
            autoCropBtn: getById('autoCropBtn'),
            btnMainText: getById('btnMainText'),
            btnSubText: getById('btnSubText'),
            btnIconContainer: getById('btnIconContainer'),
            stepInfo: getById('stepInfo'),
            rotateLeftBtn: getById('rotateLeftBtn'),
            rotateRightBtn: getById('rotateRightBtn'),
            rotateTargetSelect: getById('rotateTargetSelect'),
            rotatePage90Btn: getById('rotatePage90Btn'),
            rotatePage180Btn: getById('rotatePage180Btn'),
            pageRotationControls: getById('pageRotationControls'),
            undoBtn: getById('undoBtn'),
            downloadFinalPdfBtn: getById('downloadFinalPdfBtn'),
            imagePreview: getById('imagePreview'),
            placeholder: getById('placeholder'),
            loading: getById('loading'),
            loadingText: getById('loadingText')
        };

        let currentPdf = null, currentPageNum = 1, cropper = null, originalPdfBytes = null;
        let pdfHistory = [], thumbnailGenId = 0, isDetected = false;
        const pdfScale = 3.0, maxHistory = 15;

        const showLoading = (text) => { els.loadingText.innerText = text; els.loading.classList.remove('hidden'); };
        const hideLoading = () => els.loading.classList.add('hidden');

        function showToast(msg, type = 'info') {
            const container = getById('toastContainer');
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-slate-800' : 'bg-indigo-600');
            toast.className = `${bg} text-white px-8 py-4 rounded-2xl shadow-2xl mb-2 text-[11px] font-black tracking-tight toast-animate border border-white/10`;
            toast.innerText = msg; container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        const resetAutoBtnState = () => {
            isDetected = false;
            els.btnMainText.innerText = "AUTO CLEANUP";
            els.btnSubText.innerText = "黒余白の自動検知を実行";
            els.btnIconContainer.innerHTML = '<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>';
            els.autoCropBtn.style.backgroundColor = '';
            els.autoCropBtn.classList.remove('bg-emerald-600');
            els.autoCropBtn.classList.add('bg-indigo-600');
            els.stepInfo.classList.add('hidden');
        };

        const updateControls = () => {
            const hasFile = !!cropper;
            const isPdf = !!currentPdf;
            els.autoCropBtn.disabled = !hasFile;
            els.rotateLeftBtn.disabled = !hasFile;
            els.rotateRightBtn.disabled = !hasFile;
            if (isPdf) {
                els.downloadFinalPdfBtn.disabled = false;
                els.rotateTargetSelect.disabled = false;
                els.rotatePage90Btn.disabled = false;
                els.rotatePage180Btn.disabled = false;
            }
            els.undoBtn.disabled = pdfHistory.length === 0;
        };

        const saveHistory = () => { 
            if (originalPdfBytes) { 
                pdfHistory.push(new Uint8Array(originalPdfBytes)); 
                if (pdfHistory.length > maxHistory) pdfHistory.shift(); 
                updateControls(); 
            } 
        };

        async function handleFile(file) {
            if (!file) return;
            showLoading('Loading document');
            try {
                if (file.type === 'application/pdf') {
                    const buffer = await file.arrayBuffer();
                    originalPdfBytes = new Uint8Array(buffer); pdfHistory = [];
                    currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
                    els.pdfControls.classList.remove('hidden');
                    els.pageRotationControls.classList.remove('hidden');
                    els.undoBtn.classList.remove('hidden');
                    els.downloadFinalPdfBtn.classList.remove('hidden');
                    currentPageNum = 1; renderThumbnails(); await renderPage(1);
                } else if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => initCropper(e.target.result);
                    reader.readAsDataURL(file);
                    currentPdf = null; els.pdfControls.classList.add('hidden'); els.thumbnailSidebar.classList.add('hidden');
                }
                showToast('ドキュメントを読み込みました');
            } catch (e) { showToast('読み込み失敗', 'error'); hideLoading(); }
        }

        els.fileInput.onchange = (e) => handleFile(e.target.files[0]);
        els.previewFileInput.onchange = (e) => handleFile(e.target.files[0]);
        els.mainWorkspace.ondragover = (e) => { e.preventDefault(); els.mainWorkspace.classList.add('bg-slate-200/50'); };
        els.mainWorkspace.ondragleave = () => els.mainWorkspace.classList.remove('bg-slate-200/50');
        els.mainWorkspace.ondrop = (e) => { e.preventDefault(); els.mainWorkspace.classList.remove('bg-slate-200/50'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

        async function renderPage(num) {
            if (!currentPdf) return;
            showLoading(`Preparing Page ${num}`);
            try {
                const page = await currentPdf.getPage(num);
                const vp = page.getViewport({ scale: pdfScale });
                const cv = document.createElement('canvas');
                cv.width = vp.width; cv.height = vp.height;
                await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
                els.pageInfo.innerText = `PAGE ${num} / ${currentPdf.numPages}`;
                els.prevPage.disabled = num <= 1; els.nextPage.disabled = num >= currentPdf.numPages;
                initCropper(cv.toDataURL('image/png'));
                page.cleanup(); updateThumbHighlight(); resetAutoBtnState();
            } catch (e) { hideLoading(); }
        }

        els.prevPage.onclick = () => { if (currentPageNum > 1) renderPage(--currentPageNum); };
        els.nextPage.onclick = () => { if (currentPageNum < currentPdf.numPages) renderPage(++currentPageNum); };

        function initCropper(src) {
            els.placeholder.classList.add('hidden'); els.imagePreview.classList.remove('hidden');
            if (cropper) cropper.destroy();
            els.imagePreview.src = src;
            els.imagePreview.onload = () => {
                cropper = new Cropper(els.imagePreview, { viewMode: 2, dragMode: 'crop', autoCropArea: 0.98, background: false });
                updateControls(); hideLoading();
            };
        }

        // AUTO CLEANUP Logic (2-Step)
        els.autoCropBtn.onclick = async () => {
            if (!cropper) return;

            if (!isDetected) {
                // STEP 1: 境界を検知する
                showLoading('境界を解析中...');
                setTimeout(() => {
                    const img = new Image();
                    img.onload = () => {
                        const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
                        const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0);
                        const data = ctx.getImageData(0, 0, cv.width, cv.height);
                        const box = detectUltraInside(data, cv.width, cv.height);
                        if (box) {
                            cropper.setData(box);
                            isDetected = true;
                            els.btnMainText.innerText = "CONFIRM & SAVE";
                            els.btnSubText.innerText = "この範囲で適用し保存します";
                            els.btnIconContainer.innerHTML = '<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                            els.autoCropBtn.classList.remove('bg-indigo-600');
                            els.autoCropBtn.classList.add('bg-emerald-600');
                            els.stepInfo.classList.remove('hidden');
                            showToast('余白の内側を指定しました。手動調整も可能です。');
                        } else {
                            showToast('境界を特定できませんでした', 'error');
                        }
                        hideLoading();
                    };
                    img.src = els.imagePreview.src;
                }, 50);
            } else {
                // STEP 2: 確定して保存する (ダイレクト保存)
                showLoading('保存しています...');
                try {
                    await new Promise(r => setTimeout(r, 50));
                    const { PDFDocument } = PDFLib;
                    const pdfDoc = await PDFDocument.load(originalPdfBytes);
                    await updateSinglePage(pdfDoc, currentPageNum - 1, cropper.getCroppedCanvas());
                    
                    originalPdfBytes = await pdfDoc.save(); 
                    saveHistory();
                    currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
                    await renderPage(currentPageNum); 
                    renderThumbnails();
                    showToast('保存しました', 'success');
                } catch (e) {
                    showToast('保存に失敗しました', 'error');
                }
                hideLoading();
            }
        };

        function detectUltraInside(imageData, w, h) {
            const d = imageData.data;
            const getL = (x, y) => { const i = (y * w + x) * 4; return 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]; };
            const whiteThreshold = 232, minRatio = 0.05; 
            let top = 0, bottom = h - 1, left = 0, right = w - 1;

            for (let y = 0; y < h / 2; y++) {
                let white = 0; for (let x = 0; x < w; x += 5) { if (getL(x, y) > whiteThreshold) white++; }
                if (white / (w / 5) > minRatio) { top = y; break; }
            }
            for (let y = h - 1; y > h / 2; y--) {
                let white = 0; for (let x = 0; x < w; x += 5) { if (getL(x, y) > whiteThreshold) white++; }
                if (white / (w / 5) > minRatio) { bottom = y; break; }
            }
            for (let x = 0; x < w / 2; x++) {
                let white = 0; for (let y = top; y < bottom; y += 5) { if (getL(x, y) > whiteThreshold) white++; }
                if (white / ((bottom - top) / 5) > minRatio) { left = x; break; }
            }
            for (let x = w - 1; x > w / 2; x--) {
                let white = 0; for (let y = top; y < bottom; y += 5) { if (getL(x, y) > whiteThreshold) white++; }
                if (white / ((bottom - top) / 5) > minRatio) { right = x; break; }
            }

            const safety = 40; // 黒線を完全に断つために40px深めに切り取る
            const fx = left + safety, fy = top + safety;
            const fw = (right - left) - (safety * 2), fh = (bottom - top) - (safety * 2);
            return (fw <= 150 || fh <= 150) ? null : { x: fx, y: fy, width: fw, height: fh };
        }

        els.rotateLeftBtn.onclick = () => cropper.rotate(-90);
        els.rotateRightBtn.onclick = () => cropper.rotate(90);

        async function rotatePages(angle) {
            if (!originalPdfBytes) return;
            showLoading('Applying rotation');
            try {
                const target = els.rotateTargetSelect.value;
                const { PDFDocument, degrees } = PDFLib;
                const pdfDoc = await PDFDocument.load(originalPdfBytes);
                const pages = pdfDoc.getPages();
                let count = 0;
                for (let i = 0; i < pages.length; i++) {
                    const p = pages[i]; const s = p.getSize(); const r = p.getRotation().angle;
                    const isL = ((r === 90 || r === 270) ? s.height : s.width) > ((r === 90 || r === 270) ? s.width : s.height);
                    if (target === 'all' || (target === 'current' && i === currentPageNum - 1) || (target === 'landscape' && isL) || (target === 'portrait' && !isL)) {
                        p.setRotation(degrees(r + angle)); count++;
                    }
                }
                originalPdfBytes = await pdfDoc.save(); saveHistory();
                currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
                await renderPage(currentPageNum); renderThumbnails();
                showToast(`${count}ページを回転し保存しました`, 'success');
            } catch (e) { showToast('失敗しました', 'error'); }
            hideLoading();
        }
        els.rotatePage90Btn.onclick = () => rotatePages(90);
        els.rotatePage180Btn.onclick = () => rotatePages(180);

        async function updateSinglePage(doc, idx, canvas) {
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png', 1.0));
            const img = await doc.embedPng(await blob.arrayBuffer());
            const isL = canvas.width > canvas.height;
            const p = doc.getPages()[idx], { width: ow, height: oh } = p.getSize();
            const long = Math.max(ow, oh), short = Math.min(ow, oh);
            const tw = isL ? long : short, th = isL ? short : long;
            doc.removePage(idx);
            const np = doc.insertPage(idx, [tw, th]);
            const dims = img.scaleToFit(tw, th);
            np.drawImage(img, { x: tw/2 - dims.width/2, y: th/2 - dims.height/2, width: dims.width, height: dims.height });
        }

        els.downloadFinalPdfBtn.onclick = () => {
            if (!originalPdfBytes) return;
            const blob = new Blob([originalPdfBytes], { type: 'application/pdf' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `Precision_Cleaned_${Date.now()}.pdf`; a.click();
            showToast('ダウンロードを開始しました', 'success');
        };

        els.undoBtn.onclick = async () => {
            if (pdfHistory.length === 0) return;
            showLoading('Undo');
            originalPdfBytes = pdfHistory.pop();
            currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
            await renderPage(currentPageNum); renderThumbnails(); updateControls();
            hideLoading(); showToast('前の状態に戻しました');
        };

        const updateThumbHighlight = () => {
            document.querySelectorAll('.thumbnail-item').forEach(el => el.classList.remove('active-page'));
            const cur = getById(`thumb-wrapper-${currentPageNum}`);
            if (cur) { cur.classList.add('active-page'); cur.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        };

        async function renderThumbnails() {
            if (!currentPdf) return;
            els.thumbnailSidebar.innerHTML = ''; els.thumbnailSidebar.classList.remove('hidden');
            const gid = ++thumbnailGenId;
            for (let i = 1; i <= currentPdf.numPages; i++) {
                const div = document.createElement('div'); div.id = `thumb-wrapper-${i}`; div.onclick = () => { if (currentPageNum !== i) { currentPageNum = i; renderPage(i); } };
                div.className = 'thumbnail-item cursor-pointer rounded-2xl bg-white relative p-4 shadow-sm flex items-center justify-center min-h-[200px] border border-slate-100';
                const label = document.createElement('div'); label.className = 'absolute -top-4 -left-4 bg-slate-800 text-white text-[11px] font-black px-4 py-2 rounded-xl z-10 shadow-lg'; label.innerText = i;
                const img = document.createElement('img'); img.id = `thumb-img-${i}`; img.className = 'max-w-full h-auto opacity-0 transition-opacity duration-700 rounded-lg shadow-sm border border-slate-100';
                div.append(img, label); els.thumbnailSidebar.append(div);
            }
            updateThumbHighlight();
            for (let i = 1; i <= currentPdf.numPages; i++) {
                if (gid !== thumbnailGenId) return;
                try {
                    const page = await currentPdf.getPage(i), vp = page.getViewport({ scale: 0.3 });
                    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
                    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
                    const target = getById(`thumb-img-${i}`);
                    if (target) { target.src = cv.toDataURL(); target.onload = () => target.classList.remove('opacity-0'); }
                    page.cleanup(); await new Promise(r => setTimeout(r, 20));
                } catch (e) {}
            }
        }
    </script>
</body>
</html>
