<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Margin Cleaner - Ultra Precision</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cropper.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <!-- pdf-lib -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <style>
        :root {
            --sidebar-bg: #ffffff;
            --main-bg: #f8fafc;
            --accent: #4f46e5;
            --success: #10b981;
            --danger-red: #ef4444;
        }

        .cropper-container {
            max-height: calc(100vh - 140px);
            width: 100%;
        }
        
        .cropper-view-box {
            outline: 4px solid var(--danger-red) !important;
            outline-color: var(--danger-red) !important;
        }
        .cropper-line { background-color: var(--danger-red) !important; }
        .cropper-point {
            background-color: var(--danger-red) !important;
            width: 14px !important;
            height: 14px !important;
            opacity: 1 !important;
        }
        .cropper-dashed { border-color: var(--danger-red) !important; }

        #thumbnailSidebar::-webkit-scrollbar { width: 6px; }
        #thumbnailSidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .thumbnail-item {
            margin-bottom: 4rem;
            transition: all 0.3s ease;
        }
        
        .active-page {
            outline: 5px solid var(--accent);
            outline-offset: 4px;
            background-color: #f1f5f9;
        }

        .btn-action { transition: all 0.2s ease; }
        .btn-action:hover:not(:disabled) { transform: translateY(-1px); }

        .tool-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
        }

        #toastContainer {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col h-screen text-slate-700 font-medium selection:bg-indigo-100 overflow-hidden">

    <div id="toastContainer"></div>

    <header class="bg-white border-b border-slate-200 p-3 flex justify-between items-center z-30 shadow-sm px-6">
        <div class="flex items-center gap-3">
            <div class="bg-slate-800 p-1.5 rounded-lg shadow-sm">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <h1 class="text-base font-black text-slate-800 tracking-tighter uppercase leading-none italic">Margin Cleaner <span class="text-indigo-600 font-black">Island</span></h1>
        </div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-4">
            <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span> Ultra Precision Ready</span>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col z-20 overflow-y-auto">
            <div class="p-6 flex flex-col gap-6">
                
                <section>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest italic">01. Import</label>
                        <button id="clearFileBtn" class="hidden text-[10px] font-bold text-red-500 hover:text-red-700 flex items-center gap-1 transition-colors uppercase tracking-tighter">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            ファイルを閉じる
                        </button>
                    </div>
                    <input type="file" id="fileInput" accept="image/png, image/jpeg, application/pdf" class="block w-full text-[11px] text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-black file:bg-slate-100 file:text-slate-600 hover:file:bg-indigo-50 hover:file:text-indigo-700 cursor-pointer transition-all border border-slate-100 rounded-lg p-1 shadow-sm" />
                </section>

                <section id="pdfControls" class="hidden">
                    <div class="flex items-center justify-between bg-slate-50 p-1 rounded-xl border border-slate-200 shadow-inner">
                        <button id="prevPage" class="p-2 hover:bg-white hover:text-indigo-600 rounded-lg transition disabled:opacity-20">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <span id="pageInfo" class="text-[10px] font-black text-slate-800 tracking-widest italic uppercase text-center">Page 1 / 1</span>
                        <button id="nextPage" class="p-2 hover:bg-white hover:text-indigo-600 rounded-xl transition disabled:opacity-20">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </section>

                <!-- メインアクション -->
                <section class="flex flex-col gap-3">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest italic">02. Execution</label>
                    <button id="autoCropBtn" class="btn-action w-full flex items-center justify-center gap-2 py-3.5 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-100 disabled:grayscale disabled:opacity-30 group font-black" disabled>
                        <div id="btnIconContainer">
                            <svg class="w-5 h-5 group-hover:rotate-12 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <span id="btnMainText" class="font-black text-sm tracking-widest uppercase text-center leading-none">切り取りを実行</span>
                    </button>

                    <div class="grid grid-cols-2 gap-2">
                        <button id="undoBtn" class="btn-action py-2.5 bg-slate-50 border border-slate-200 text-slate-500 font-bold text-[10px] rounded-xl hover:bg-white disabled:opacity-30 flex items-center justify-center gap-1 shadow-sm" disabled title="最大5件まで戻れます">一つ前に戻る</button>
                        <button id="redoBtn" class="btn-action py-2.5 bg-slate-50 border border-slate-200 text-slate-500 font-bold text-[10px] rounded-xl hover:bg-white disabled:opacity-30 flex items-center justify-center gap-1 shadow-sm" disabled title="最大5件まで進めます">一つ後ろに進む</button>
                    </div>
                </section>

                <div class="border-t border-slate-100 my-1"></div>

                <section class="tool-box flex flex-col gap-2 shadow-sm">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest italic mb-1">03. Adjust Frame</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="rotateLeftBtn" class="btn-action p-1.5 bg-white border border-slate-200 rounded-lg hover:text-indigo-600 transition text-slate-400 disabled:opacity-30" disabled title="枠のみ回転"><svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg></button>
                        <button id="rotateRightBtn" class="btn-action p-1.5 bg-white border border-slate-200 rounded-lg hover:text-indigo-600 transition text-slate-400 disabled:opacity-30" disabled><svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transform: scaleX(-1);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg></button>
                    </div>
                </section>
            </div>

            <div class="mt-auto p-6 border-t border-slate-100 bg-slate-50/50 flex flex-col gap-4">
                <div id="pageRotationControls" class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm hidden">
                    <select id="rotateTargetSelect" class="w-full text-[10px] font-black bg-slate-100 rounded-lg p-2 mb-2 outline-none appearance-none text-center cursor-pointer">
                        <option value="current">このページのみ</option>
                        <option value="all">全ページ</option>
                        <option value="landscape">横向きのみ</option>
                        <option value="portrait">縦向きのみ</option>
                    </select>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="rotatePage90Btn" class="btn-action py-2 bg-slate-800 text-white rounded-lg text-[9px] font-black tracking-widest">90°</button>
                        <button id="rotatePage180Btn" class="btn-action py-2 bg-slate-800 text-white rounded-lg text-[9px] font-black tracking-widest">180°</button>
                    </div>
                </div>
                <button id="downloadFinalPdfBtn" class="btn-action w-full py-4 bg-slate-900 text-white font-black text-xs rounded-2xl shadow-xl hover:bg-black transition-all hidden disabled:opacity-50 uppercase tracking-[0.2em]">PDFをダウンロード</button>
            </div>
        </aside>

        <div id="mainWorkspace" class="flex-1 flex overflow-hidden bg-slate-200 relative">
            <aside id="thumbnailSidebar" class="w-64 bg-white border-r border-slate-200 overflow-y-auto hidden flex-col p-10 gap-0 shadow-inner z-20"></aside>
            <section id="previewSection" class="flex-1 flex items-center justify-center p-12 relative overflow-hidden">
                <div id="loading" class="hidden absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
                    <div class="w-8 h-8 border-4 border-slate-200 border-t-indigo-600 rounded-full animate-spin"></div>
                    <p class="text-slate-400 font-black text-[9px] mt-4 uppercase tracking-[0.3em]" id="loadingText">Processing</p>
                </div>
                <div class="w-full h-full flex items-center justify-center relative">
                    <img id="imagePreview" src="" alt="Preview" class="hidden max-w-full max-h-full shadow-[0_40px_80px_-20px_rgba(0,0,0,0.3)] bg-white border border-slate-300" />
                    <div id="placeholder" class="text-slate-400 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 hover:border-indigo-400 hover:bg-white transition-all rounded-[3rem] p-24 w-full max-w-xl cursor-pointer bg-slate-50 shadow-inner group">
                        <div class="bg-indigo-600 text-white rounded-2xl p-4 mb-6 shadow-lg group-hover:scale-110 transition-transform duration-500"><svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg></div>
                        <p class="text-xl font-black text-slate-800 mb-1 tracking-tighter uppercase">Drop PDF</p>
                        <input type="file" id="previewFileInput" accept="image/png, image/jpeg, application/pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const getById = (id) => document.getElementById(id);
        const els = {
            fileInput: getById('fileInput'), previewFileInput: getById('previewFileInput'),
            clearFileBtn: getById('clearFileBtn'), mainWorkspace: getById('mainWorkspace'),
            thumbnailSidebar: getById('thumbnailSidebar'), pdfControls: getById('pdfControls'),
            prevPage: getById('prevPage'), nextPage: getById('nextPage'), pageInfo: getById('pageInfo'),
            autoCropBtn: getById('autoCropBtn'), btnMainText: getById('btnMainText'),
            btnIconContainer: getById('btnIconContainer'), rotateLeftBtn: getById('rotateLeftBtn'),
            rotateRightBtn: getById('rotateRightBtn'), rotateTargetSelect: getById('rotateTargetSelect'),
            rotatePage90Btn: getById('rotatePage90Btn'), rotatePage180Btn: getById('rotatePage180Btn'),
            pageRotationControls: getById('pageRotationControls'), undoBtn: getById('undoBtn'),
            redoBtn: getById('redoBtn'), downloadFinalPdfBtn: getById('downloadFinalPdfBtn'),
            imagePreview: getById('imagePreview'), placeholder: getById('placeholder'),
            loading: getById('loading'), loadingText: getById('loadingText')
        };

        let currentPdf = null, currentPageNum = 1, cropper = null, originalPdfBytes = null;
        let originalFileName = 'Cleaned_Document';
        let pdfHistory = [], pdfRedoStack = [], thumbnailGenId = 0;
        const pdfScale = 3.0, maxHistory = 5; 

        const showLoading = (text) => { els.loadingText.innerText = text; els.loading.classList.remove('hidden'); };
        const hideLoading = () => els.loading.classList.add('hidden');

        function showToast(msg, type = 'info') {
            const container = getById('toastContainer');
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-emerald-600' : 'bg-slate-800');
            toast.className = `${bg} text-white px-8 py-4 rounded-xl shadow-xl mb-2 text-[10px] font-black tracking-widest animate-fade border border-white/10 uppercase text-center`;
            toast.innerText = msg; container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        const updateControls = () => {
            const hasFile = !!cropper;
            els.autoCropBtn.disabled = !hasFile; els.rotateLeftBtn.disabled = !hasFile; els.rotateRightBtn.disabled = !hasFile;
            if (currentPdf) {
                els.downloadFinalPdfBtn.disabled = false; els.pageRotationControls.classList.remove('hidden');
                els.clearFileBtn.classList.remove('hidden');
            } else { els.clearFileBtn.classList.add('hidden'); }
            els.undoBtn.disabled = pdfHistory.length === 0; els.redoBtn.disabled = pdfRedoStack.length === 0;
        };

        const saveHistory = () => { 
            if (originalPdfBytes) { 
                pdfHistory.push(new Uint8Array(originalPdfBytes)); 
                pdfRedoStack = []; if (pdfHistory.length > maxHistory) pdfHistory.shift(); 
                updateControls(); 
            } 
        };

        async function handleFile(file) {
            if (!file) return;
            // 拡張子を除いたファイル名を保存
            originalFileName = file.name.replace(/\.[^/.]+$/, "");
            showLoading('Analyzing');
            try {
                if (file.type === 'application/pdf') {
                    const buffer = await file.arrayBuffer();
                    originalPdfBytes = new Uint8Array(buffer); pdfHistory = []; pdfRedoStack = [];
                    currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
                    els.pdfControls.classList.remove('hidden'); els.downloadFinalPdfBtn.classList.remove('hidden');
                    els.undoBtn.classList.remove('hidden'); els.redoBtn.classList.remove('hidden');
                    currentPageNum = 1; renderThumbnails(); await renderPage(1);
                } else if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => initCropper(e.target.result);
                    reader.readAsDataURL(file);
                    currentPdf = null; els.pdfControls.classList.add('hidden'); els.thumbnailSidebar.classList.add('hidden');
                    els.clearFileBtn.classList.remove('hidden');
                }
            } catch (e) { showToast('LOAD ERROR', 'error'); hideLoading(); }
        }

        els.clearFileBtn.onclick = () => {
            currentPdf = null; originalPdfBytes = null; pdfHistory = []; pdfRedoStack = [];
            if (cropper) cropper.destroy(); cropper = null;
            els.imagePreview.src = ""; els.imagePreview.classList.add('hidden');
            els.placeholder.classList.remove('hidden'); els.pdfControls.classList.add('hidden');
            els.pageRotationControls.classList.add('hidden'); els.undoBtn.classList.add('hidden');
            els.redoBtn.classList.add('hidden'); els.downloadFinalPdfBtn.classList.add('hidden');
            els.thumbnailSidebar.innerHTML = ''; els.thumbnailSidebar.classList.add('hidden');
            els.fileInput.value = ""; els.previewFileInput.value = "";
            updateControls(); showToast('FILES CLOSED');
        };

        els.fileInput.onchange = (e) => handleFile(e.target.files[0]);
        els.previewFileInput.onchange = (e) => handleFile(e.target.files[0]);
        els.mainWorkspace.ondragover = (e) => { e.preventDefault(); els.mainWorkspace.classList.add('bg-slate-300/30'); };
        els.mainWorkspace.ondragleave = () => els.mainWorkspace.classList.remove('bg-slate-300/30');
        els.mainWorkspace.ondrop = (e) => { e.preventDefault(); els.mainWorkspace.classList.remove('bg-slate-300/30'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };

        async function renderPage(num) {
            if (!currentPdf) return;
            showLoading(`Preparing P${num}`);
            try {
                const page = await currentPdf.getPage(num);
                const vp = page.getViewport({ scale: pdfScale });
                const cv = document.createElement('canvas');
                cv.width = vp.width; cv.height = vp.height;
                await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
                els.pageInfo.innerText = `PAGE ${num} / ${currentPdf.numPages}`;
                els.prevPage.disabled = num <= 1; els.nextPage.disabled = num >= currentPdf.numPages;
                initCropper(cv.toDataURL('image/png'));
                page.cleanup(); updateThumbHighlight();
            } catch (e) { hideLoading(); }
        }

        els.prevPage.onclick = () => { if (currentPageNum > 1) renderPage(--currentPageNum); };
        els.nextPage.onclick = () => { if (currentPageNum < currentPdf.numPages) renderPage(++currentPageNum); };

        function initCropper(src) {
            els.placeholder.classList.add('hidden'); els.imagePreview.classList.remove('hidden');
            if (cropper) cropper.destroy();
            els.imagePreview.src = src;
            els.imagePreview.onload = () => {
                cropper = new Cropper(els.imagePreview, { 
                    viewMode: 2, dragMode: 'crop', autoCropArea: 1.0, background: false,
                    ready() { 
                        autoDetectIslandDocument(); 
                    }
                });
                updateControls(); hideLoading();
            };
        }

        function autoDetectIslandDocument() {
            if (!cropper) return;
            const img = new Image();
            img.onload = () => {
                const cv = document.createElement('canvas'); 
                cv.width = img.width; cv.height = img.height;
                const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0);
                const data = ctx.getImageData(0, 0, cv.width, cv.height);
                const box = detectIslandOutwards(data, cv.width, cv.height);
                if (box) cropper.setData(box);
            };
            img.src = els.imagePreview.src;
        }

        function detectIslandOutwards(imageData, w, h) {
            const d = imageData.data;
            const getL = (x, y) => { const i = (y * w + x) * 4; return 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]; };
            const centerX = Math.floor(w / 2);
            const centerY = Math.floor(h / 2);
            const edgeThr = 75; 
            let top = 0, bottom = h - 1, left = 0, right = w - 1;

            for (let x = centerX; x >= 0; x--) {
                let darkCount = 0;
                for (let y = centerY - 20; y <= centerY + 20; y++) { if (getL(x, y) < edgeThr) darkCount++; }
                if (darkCount > 30) { left = x; break; }
            }
            for (let x = centerX; x < w; x++) {
                let darkCount = 0;
                for (let y = centerY - 20; y <= centerY + 20; y++) { if (getL(x, y) < edgeThr) darkCount++; }
                if (darkCount > 30) { right = x; break; }
            }
            for (let y = centerY; y >= 0; y--) {
                let darkCount = 0;
                for (let x = centerX - 20; x <= centerX + 20; x++) { if (getL(x, y) < edgeThr) darkCount++; }
                if (darkCount > 30) { top = y; break; }
            }
            for (let y = centerY; y < h; y++) {
                let darkCount = 0;
                for (let x = centerX - 20; x <= centerX + 20; x++) { if (getL(x, y) < edgeThr) darkCount++; }
                if (darkCount > 30) { bottom = y; break; }
            }

            const inset = 60;
            const finalX = left + inset;
            const finalY = top + inset;
            const finalW = (right - left) - (inset * 2);
            const finalH = (bottom - top) - (inset * 2);

            return (finalW > 150 && finalH > 150) ? { x: finalX, y: finalY, width: finalW, height: finalH } : null;
        }

        els.autoCropBtn.onclick = async () => {
            if (!cropper) return;
            showLoading('SAVING');
            try {
                await new Promise(r => setTimeout(r, 50));
                const { PDFDocument } = PDFLib;
                const pdfDoc = await PDFDocument.load(originalPdfBytes);
                await updateSinglePage(pdfDoc, currentPageNum - 1, cropper.getCroppedCanvas());
                originalPdfBytes = await pdfDoc.save(); 
                saveHistory();
                currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
                await renderPage(currentPageNum); 
                renderThumbnails();
                showToast('保存完了', 'success');
            } catch (e) { showToast('ERROR', 'error'); }
            hideLoading();
        };

        els.rotateLeftBtn.onclick = () => cropper.rotate(-90);
        els.rotateRightBtn.onclick = () => cropper.rotate(90);

        async function rotatePages(angle) {
            if (!originalPdfBytes) return;
            showLoading('Applying');
            try {
                const target = els.rotateTargetSelect.value;
                const { PDFDocument, degrees } = PDFLib;
                const pdfDoc = await PDFDocument.load(originalPdfBytes);
                const pages = pdfDoc.getPages();
                for (let i = 0; i < pages.length; i++) {
                    const p = pages[i]; const s = p.getSize(); const r = p.getRotation().angle;
                    const isL = ((r === 90 || r === 270) ? s.height : s.width) > ((r === 90 || r === 270) ? s.width : s.height);
                    if (target === 'all' || (target === 'current' && i === currentPageNum - 1) || (target === 'landscape' && isL) || (target === 'portrait' && !isL)) {
                        p.setRotation(degrees(r + angle));
                    }
                }
                originalPdfBytes = await pdfDoc.save(); saveHistory();
                currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
                await renderPage(currentPageNum); renderThumbnails();
            } catch (e) { showToast('ERROR', 'error'); }
            hideLoading();
        }
        els.rotatePage90Btn.onclick = () => rotatePages(90);
        els.rotatePage180Btn.onclick = () => rotatePages(180);

        async function updateSinglePage(doc, idx, canvas) {
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png', 1.0));
            const img = await doc.embedPng(await blob.arrayBuffer());
            const isL = canvas.width > canvas.height;
            const p = doc.getPages()[idx], { width: ow, height: oh } = p.getSize();
            const tw = isL ? Math.max(ow, oh) : Math.min(ow, oh), th = isL ? Math.min(ow, oh) : Math.max(ow, oh);
            doc.removePage(idx); const np = doc.insertPage(idx, [tw, th]);
            const dims = img.scaleToFit(tw, th);
            np.drawImage(img, { x: tw/2 - dims.width/2, y: th/2 - dims.height/2, width: dims.width, height: dims.height });
        }

        els.downloadFinalPdfBtn.onclick = () => {
            if (!originalPdfBytes) return;
            const blob = new Blob([originalPdfBytes], { type: 'application/pdf' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            // 読み込み時と同じ名前でダウンロード
            a.download = `${originalFileName}.pdf`; a.click();
            URL.revokeObjectURL(a.href);
            showToast('DOWNLOAD STARTED', 'success');
        };

        els.undoBtn.onclick = async () => {
            if (pdfHistory.length === 0) return;
            pdfRedoStack.push(new Uint8Array(originalPdfBytes));
            originalPdfBytes = pdfHistory.pop();
            currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
            await renderPage(currentPageNum); renderThumbnails(); updateControls();
        };

        els.redoBtn.onclick = async () => {
            if (pdfRedoStack.length === 0) return;
            pdfHistory.push(new Uint8Array(originalPdfBytes));
            originalPdfBytes = pdfRedoStack.pop();
            currentPdf = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
            await renderPage(currentPageNum); renderThumbnails(); updateControls();
        };

        const updateThumbHighlight = () => {
            document.querySelectorAll('.thumbnail-item').forEach(el => el.classList.remove('active-page'));
            const cur = getById(`thumb-wrapper-${currentPageNum}`);
            if (cur) { cur.classList.add('active-page'); cur.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        };

        async function renderThumbnails() {
            if (!currentPdf) return;
            els.thumbnailSidebar.innerHTML = ''; els.thumbnailSidebar.classList.remove('hidden');
            const gid = ++thumbnailGenId;
            for (let i = 1; i <= currentPdf.numPages; i++) {
                const div = document.createElement('div'); div.id = `thumb-wrapper-${i}`; div.onclick = () => { if (currentPageNum !== i) { currentPageNum = i; renderPage(i); } };
                div.className = 'thumbnail-item cursor-pointer rounded-2xl bg-white relative p-4 shadow-sm flex items-center justify-center min-h-[220px] border border-slate-200';
                const label = document.createElement('div'); label.className = 'absolute -top-4 -left-4 bg-slate-800 text-white text-[10px] font-black px-4 py-1.5 rounded-xl z-10 shadow-lg'; label.innerText = i;
                const img = document.createElement('img'); img.id = `thumb-img-${i}`; img.className = 'max-w-full h-auto opacity-0 transition-opacity duration-700 rounded-lg shadow-sm border border-slate-100';
                div.append(img, label); els.thumbnailSidebar.append(div);
            }
            updateThumbHighlight();
            for (let i = 1; i <= currentPdf.numPages; i++) {
                if (gid !== thumbnailGenId) return;
                try {
                    const page = await currentPdf.getPage(i); const vp = page.getViewport({ scale: 0.3 });
                    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
                    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
                    const target = getById(`thumb-img-${i}`);
                    if (target) { target.src = cv.toDataURL(); target.onload = () => target.classList.remove('opacity-0'); }
                    page.cleanup(); await new Promise(r => setTimeout(r, 15));
                } catch (e) {}
            }
        }
    </script>
</body>
</html>
